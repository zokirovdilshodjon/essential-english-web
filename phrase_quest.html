p":"on the side","m":"in addition to your main job or activity","d":"In addition to your main job or activity, often secretly or unofficially.","ex":["He works as a teacher and paints portraits on the side.","Many students earn extra money on the side."],"key":"on the side","syn":["in addition","as a sideline","besides"],"reg":"informal","ielts":"careful","note":"Informal; in essays use 'in addition' or 'part-time'."},{"p":"on the threshold of sth","m":"about to start something important","d":"About to start or experience something new and important.","ex":["Biology is on the threshold of a major breakthrough.","The country stood on the threshold of independence."],"key":"on the threshold of","syn":["on the brink of","on the verge of","at the dawn of"],"reg":"formal","ielts":"yes","note":"Strong for describing change and breakthroughs; avoid overuse."},{"p":"once and for all","m":"completely and finally","d":"In a way that is completely settled, so the matter is finished.","ex":["The government must settle the dispute once and for all.","This research may resolve the issue once and for all."],"key":"once and for all","syn":["finally","definitively","permanently"],"reg":"neutral","ielts":"yes","note":"Good for emphatic conclusions or solutions in Task 2."},{"p":"(all) in one","m":"combining several things in one","d":"Combined into one; used to show that one thing performs several functions.","ex":["The device is a phone, camera and map all in one.","It is a school, library and clinic all in one."],"key":"all in one","syn":["combined","multi-purpose","all-in-one"],"reg":"neutral","ielts":"careful","note":"Better for describing products; use cautiously in essays."},{"p":"only so much/many","m":"limited in amount or number","d":"Used to say that there is a limit to how much or how many of something can be done or exist.","ex":["There is only so much time we can spend on research.","Only so many people can fit in the hall."],"key":"only so much","syn":["a limited amount","a finite amount","not unlimited"],"reg":"neutral","ielts":"careful","note":"Natural in speech; in essays say 'there is a limit to...'."},{"p":"etc. onwards","m":"from a particular time to the present","d":"Used after a time or date to mean beginning at that time and continuing afterwards.","ex":["Prices have risen steadily from 1990 onwards.","The policy applied from January onwards."],"key":"from 1990 onwards","syn":["from then on","thereafter","subsequently"],"reg":"neutral","ielts":"yes","note":"Very useful in Academic Task 1 for describing trends over time."},{"p":"open to abuse/criticism, etc.","m":"easily misused or criticised","d":"Likely to be misused or criticised because the system is weak or unclear.","ex":["The rules are open to abuse by dishonest employers.","The proposal is open to criticism on several grounds."],"key":"open to abuse","syn":["vulnerable to","susceptible to","prone to"],"reg":"formal","ielts":"yes","note":"Excellent for evaluating policies and arguments in Task 2."},{"p":"economic/political/social order","m":"the way society is organised","d":"The way in which society or a system is arranged, especially economically, politically or socially.","ex":["The war disturbed the social order of the country.","Economic order depends on stable institutions."],"key":"social order","syn":["structure","system","organisation"],"reg":"formal","ielts":"yes","note":"Useful for sociology and politics topics in Task 2."},{"p":"out of the ordinary","m":"different from what is usual","d":"Different from what is usual, expected or normal.","ex":["Nothing out of the ordinary happened during the trial.","It was an out of the ordinary event for the quiet village."],"key":"out of the ordinary","syn":["unusual","exceptional","extraordinary"],"reg":"neutral","ielts":"yes","note":"Good natural alternative to 'unusual' in Task 2 and Speaking."},{"p":"originate from/in/with, etc.","m":"start in a particular place or from a source","d":"To begin or have its source in a particular place, time or cause.","ex":["The festival originates from a pagan ritual.","The idea originated in ancient Greece."],"key":"originates from","syn":["stem from","arise from","derive from"],"reg":"formal","ielts":"yes","note":"Useful for history and linguistics topics; check which preposition follows."},{"p":"be out of this world","m":"be extremely good","d":"To be extremely good or excellent.","ex":["The food at that restaurant is out of this world.","The view from the mountain was out of this world."],"key":"out of this world","syn":["be fantastic","be superb","be exceptional"],"reg":"informal","ielts":"no","note":"Spoken enthusiasm; avoid in essays. Use 'exceptional' or 'superb'."},{"p":"out of place","m":"not suitable for the place or situation","d":"Not suitable or comfortable for a particular place or situation.","ex":["He felt out of place at the formal dinner.","The modern building looked out of place among old houses."],"key":"out of place","syn":["inappropriate","unsuitable","incongruous"],"reg":"neutral","ielts":"yes","note":"Good for describing contrast or lack of fit."},{"p":"out of proportion","m":"too big or too important for the situation","d":"Much larger or more serious than is reasonable compared with something else.","ex":["The punishment was out of proportion to the offence.","Media coverage was out of proportion to the actual risk."],"key":"out of proportion to","syn":["disproportionate","excessive","exaggerated"],"reg":"neutral","ielts":"yes","note":"Useful for criticising unfair or exaggerated reactions in Task 2."},{"p":"be out of the question","m":"impossible or not allowed","d":"Certain not to be allowed or to happen because it is impossible or unacceptable.","ex":["Cancelling the event is out of the question.","Paying such high prices is simply out of the question."],"key":"is out of the question","syn":["be impossible","be unthinkable","be inconceivable"],"reg":"neutral","ielts":"yes","note":"Strong dismissal; good in essays rejecting an unacceptable option."},{"p":"out of season","m":"not at the usual time of year","d":"At a time of year when it is not normally available or grown.","ex":["Strawberries are expensive when they are out of season.","Hotels are cheap out of season."],"key":"out of season","syn":["off-peak","unseasonal","not in season"],"reg":"neutral","ielts":"yes","note":"Useful for tourism, food and agriculture topics."},{"p":"out of shape","m":"not physically fit","d":"Not in good physical condition, often because of lack of exercise.","ex":["He is out of shape after months without training.","Many office workers are out of shape."],"key":"out of shape","syn":["unfit","unhealthy","in poor condition"],"reg":"neutral","ielts":"careful","note":"Natural for health topics; 'unfit' is more formal."},{"p":"be/get out of touch","m":"no longer in contact or up to date","d":"To no longer be in contact with someone, or no longer know recent information.","ex":["Politicians who are out of touch lose voter support.","She got out of touch with her old classmates."],"key":"are out of touch","syn":["be disconnected","be behind","be unaware"],"reg":"neutral","ielts":"yes","note":"Useful for criticising leaders or institutions that ignore reality."},{"p":"at/from the outset","m":"from the very beginning","d":"From the first stage or beginning of something.","ex":["The goals should be clear from the outset.","The project faced problems at the outset."],"key":"from the outset","syn":["from the start","initially","from the beginning"],"reg":"formal","ielts":"yes","note":"Good formal phrase; ideal for introductions and conclusions."},{"p":"over the top","m":"too much; exaggerated","d":"More than is reasonable or acceptable; exaggerated or extreme.","ex":["The special effects in the film were over the top.","Her reaction to the criticism was over the top."],"key":"over the top","syn":["excessive","exaggerated","extreme"],"reg":"informal","ielts":"careful","note":"Idiomatic; use 'excessive' in essays, keep this for Speaking."},{"p":"excitement/fear/sadness, etc.","m":"a pattern of nouns like excitement, fear or sadness","d":"Examples of abstract nouns for emotions that can follow certain structures, such as 'with excitement' or 'out of fear'.","ex":["Excitement filled the stadium before the final.","Fear can prevent people from taking risks."],"key":"Excitement","syn":["thrill","anticipation","enthusiasm"],"reg":"neutral","ielts":"careful","note":"Placeholder; learn each emotion noun with its usual collocation."},{"p":"confidence/happiness/love, etc.","m":"a pattern of nouns like confidence, happiness or love","d":"Examples of abstract nouns for qualities or feelings that can fill a given structure.","ex":["Happiness often depends on strong relationships.","Confidence grows when students receive honest feedback."],"key":"Happiness","syn":["joy","contentment","well-being"],"reg":"neutral","ielts":"careful","note":"Placeholder; use each noun with the right preposition."},{"p":"pace yourself","m":"control your speed so you do not get tired","d":"To control the speed at which you do something so that you do not become too tired.","ex":["Marathon runners must pace themselves carefully.","You need to pace yourself during a long exam."],"key":"pace themselves","syn":["take it steady","regulate your speed","moderate your effort"],"reg":"neutral","ielts":"careful","note":"Good for sport and study advice; adjust the reflexive pronoun."},{"p":"pace about/up and down, etc","m":"walk repeatedly in one area, usually because of worry","d":"To walk backwards and forwards repeatedly, often because you are nervous or impatient.","ex":["She paced about the room while waiting for news.","He paced up and down the corridor before the interview."],"key":"paced about","syn":["stride","walk back and forth","roam"],"reg":"neutral","ielts":"careful","note":"Narrative description; fine for Speaking stories."},{"p":"a sharp pain","m":"a sudden, strong pain","d":"A sudden, strong and unpleasant feeling of pain.","ex":["He felt a sharp pain in his chest.","A sharp pain shot through her knee."],"key":"a sharp pain","syn":["a stabbing pain","a severe pain","an acute pain"],"reg":"neutral","ielts":"careful","note":"Natural in health descriptions; use 'acute pain' in formal writing."},{"p":"the best/better part of sth","m":"most of something, almost all of it","d":"Most of a period of time or amount of something, nearly all.","ex":["The project took the best part of a year.","He spent the better part of the day waiting."],"key":"the best part of","syn":["most of","nearly all of","the majority of"],"reg":"neutral","ielts":"careful","note":"British; useful for expressing long time spans."},{"p":"a passport to sth","m":"something that gives you a way into something","d":"Something that gives you access to something useful or valuable, or allows you to achieve something.","ex":["Education is a passport to a better life.","A degree can be a passport to a high-paying career."],"key":"a passport to","syn":["a key to","a gateway to","a ticket to"],"reg":"neutral","ielts":"yes","note":"Effective metaphor in Task 2 on education and opportunities."},{"p":"a bad/rough, etc. patch","m":"a period of difficulty","d":"A period of time of a particular kind, often difficult or unlucky.","ex":["The company went through a rough patch last year.","He is going through a bad patch at work."],"key":"a rough patch","syn":["a difficult period","a tough time","a setback"],"reg":"informal","ielts":"careful","note":"Idiomatic; in essays use 'difficult period' or 'downturn'."},{"p":"pay tribute to sb/sth","m":"publicly show respect or admiration","d":"To express respect, admiration or thanks for someone or something in public.","ex":["Leaders paid tribute to the victims of the earthquake.","Colleagues paid tribute to her years of dedicated service."],"key":"paid tribute to","syn":["honour","commemorate","pay homage to"],"reg":"formal","ielts":"yes","note":"Good formal phrase for essays on heritage and public figures."},{"p":"peculiar to sb/sth","m":"belonging to one person or thing only","d":"Found only in or associated with a particular person, thing or place; used after a noun with 'to'.","ex":["This species of frog is peculiar to the island.","The habit is peculiar to people in that region."],"key":"peculiar to","syn":["unique to","specific to","characteristic of"],"reg":"formal","ielts":"yes","note":"Useful for describing unique features in geography and culture."},{"p":"peep at/through/out, etc.","m":"look quickly or secretly through a small gap","d":"To look quickly or secretly at something, especially through a small opening.","ex":["The children peeped at the presents through the keyhole.","She peeped out from behind the curtain."],"key":"peeped at","syn":["glance","peek","glimpse"],"reg":"neutral","ielts":"no","note":"Narrative/spoken; too small-scale for formal essays."},{"p":"peer at/into/through, etc.","m":"look closely, especially when it is hard to see","d":"To look carefully or closely at something, especially when you cannot see clearly.","ex":["He peered at the map in the dim light.","She peered into the fog looking for the road sign."],"key":"peered at","syn":["squint","gaze","stare"],"reg":"neutral","ielts":"careful","note":"Narrative description; fine for Speaking Part 2 stories."},{"p":"pitch dark/black","m":"completely dark","d":"Completely dark with no light at all.","ex":["The cave was pitch dark inside.","It was pitch black when we left the station."],"key":"pitch dark","syn":["completely dark","pitch-black","very dark"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful in Speaking stories."},{"p":"place emphasis/importance, etc. on sth","m":"give special attention or value to something","d":"To give special attention or importance to something, especially to show that it matters.","ex":["Schools should place greater emphasis on creative thinking.","The company places importance on teamwork."],"key":"place greater emphasis on","syn":["stress","highlight","prioritise"],"reg":"formal","ielts":"yes","note":"Very useful in Task 2; 'place emphasis on' is high-scoring."},{"p":"anything/as/what/whatever, etc. you please","m":"whatever you want","d":"Used to say that someone can have or do anything they like.","ex":["You can order whatever you please from the menu.","He spends his money as he pleases."],"key":"whatever you please","syn":["as you wish","whatever you like","anything you want"],"reg":"informal","ielts":"no","note":"Spoken and dismissive; avoid in essays."},{"p":"a plethora of sth","m":"a very large number of something","d":"A very large amount or number of something, often more than is needed.","ex":["The city offers a plethora of cultural attractions.","Applicants face a plethora of confusing forms."],"key":"a plethora of","syn":["a multitude of","an abundance of","a wealth of"],"reg":"formal","ielts":"yes","note":"High-level quantifier; use once in an essay for variety."},{"p":"plunge down/into, etc.","m":"fall or drop suddenly into something","d":"To fall, drop or move down suddenly and with force into something.","ex":["The car plunged down the steep embankment.","Share prices plunged into a deep decline."],"key":"plunged down","syn":["plummet","dive","drop sharply"],"reg":"neutral","ielts":"yes","note":"Useful for describing sharp drops in graphs."},{"p":"to the point","m":"directly relevant to the subject","d":"Relevant and brief, concerned with the main subject without extra details.","ex":["Her answer was short and to the point.","Keep your arguments to the point."],"key":"to the point","syn":["relevant","concise","direct"],"reg":"neutral","ielts":"yes","note":"Good in Speaking and writing advice; keep essays focused."},{"p":"pose a/the question","m":"raise a question for discussion","d":"To ask a question or raise an issue for discussion.","ex":["The report poses the question of who should pay for the clean-up.","He posed the question during the lecture."],"key":"poses the question","syn":["raise a question","bring up","put forward"],"reg":"formal","ielts":"yes","note":"Useful to introduce an issue in essay introductions."},{"p":"be posted to France/London/Singapore, etc.","m":"be sent to work in a particular place","d":"To be sent officially to work or serve in a particular place, often abroad.","ex":["He was posted to Singapore for three years.","Diplomats are often posted to London."],"key":"was posted to Singapore","syn":["be stationed in","be assigned to","be sent to"],"reg":"neutral","ielts":"careful","note":"Useful for work and travel topics; passive form."},{"p":"pour into/out/from, etc.","m":"flow in large quantities in a direction","d":"To flow or move in large amounts or numbers in a particular direction.","ex":["Tourists poured into the city during the festival.","Water poured out of the broken pipe."],"key":"poured into","syn":["flood","stream","surge"],"reg":"neutral","ielts":"yes","note":"Useful descriptive verb for movement of people or water."},{"p":"in/out of print","m":"available or no longer available as a printed book","d":"Describes a book that is currently published and available, or no longer printed.","ex":["The novel has been out of print for years.","Her new book is in print now."],"key":"out of print","syn":["unavailable","discontinued","no longer published"],"reg":"neutral","ielts":"careful","note":"Fine for publishing topics; otherwise rarely used."},{"p":"hold/keep/take sb prisoner","m":"keep someone captive","d":"To capture someone and keep them as a prisoner so they cannot leave.","ex":["Rebels took the journalists prisoner.","The soldiers were held prisoner for months."],"key":"took the journalists prisoner","syn":["capture","detain","imprison"],"reg":"neutral","ielts":"careful","note":"Suitable for news and history topics; avoid in generic essays."},{"p":"proceed to do sth","m":"go on to do something next","d":"To continue by doing something next, often after a pause or after another action.","ex":["After the introduction, she proceeded to explain the results.","He proceeded to discuss the budget."],"key":"proceeded to explain","syn":["go on to","move on to","continue by"],"reg":"formal","ielts":"yes","note":"Useful formal sequencing phrase for process descriptions."},{"p":"a profound effect/impact/influence, etc.","m":"a very strong and deep result","d":"Used with nouns such as effect, impact or influence to show something has a very great or deep result.","ex":["Social media has had a profound effect on young people.","Her teacher had a profound influence on her career."],"key":"a profound effect","syn":["a deep impact","a major influence","a significant effect"],"reg":"formal","ielts":"yes","note":"Excellent collocation for describing consequences in Task 2."},{"p":"prompt sb to do sth","m":"cause someone to do something","d":"To cause or encourage someone to do something, usually used with an infinitive.","ex":["The scandal prompted the minister to resign.","Rising prices prompted many families to cut spending."],"key":"prompted the minister to resign","syn":["induce","spur","motivate"],"reg":"formal","ielts":"yes","note":"Good cause-and-effect verb; high-scoring in Task 2."},{"p":"be prone to sth/doing sth","m":"likely to suffer from something","d":"Likely to experience or do something, usually something bad.","ex":["Older people are prone to falls.","Coastal areas are prone to flooding."],"key":"are prone to","syn":["susceptible to","vulnerable to","liable to"],"reg":"formal","ielts":"yes","note":"Useful for risks and health; follow with a noun or -ing."},{"p":"the prosecution","m":"the lawyers who try to prove someone guilty","d":"The lawyers who present a case against someone accused of a crime in court.","ex":["The prosecution presented new evidence to the jury.","The prosecution argued that the defendant had lied."],"key":"The prosecution","syn":["the state's lawyers","the accusers","the crown"],"reg":"formal","ielts":"yes","note":"Useful for law and crime topics."},{"p":"prove yourself","m":"show that you are capable or good","d":"To show that you are capable, good or worthy, especially to other people.","ex":["New employees must prove themselves quickly.","He worked hard to prove himself to his critics."],"key":"prove themselves","syn":["demonstrate your ability","show your worth","earn respect"],"reg":"neutral","ielts":"yes","note":"Good for work and education topics; adjust reflexive pronoun."},{"p":"a public announcement/appearance/state ment, etc.","m":"a pattern of nouns like announcement, appearance or statement","d":"Examples of public things that are made or done for everyone to see, hear or read.","ex":["The minister made a public announcement about the new tax.","The actress made a rare public appearance last week."],"key":"public announcement","syn":["official notice","open declaration","statement"],"reg":"formal","ielts":"yes","note":"Useful collocation; adjust the noun to fit the topic."},{"p":"serve a/the purpose","m":"achieve a goal or do a job","d":"To fulfil a function or be useful for a particular purpose.","ex":["The new bridge serves the purpose of easing congestion.","This device serves a useful purpose in hospitals."],"key":"serves the purpose of","syn":["fulfil a function","be useful","meet a need"],"reg":"formal","ielts":"yes","note":"Good to explain functions in Academic Task 1 and Task 2."},{"p":"put sth to one side","m":"temporarily leave something aside","d":"To leave something aside for now so that you can deal with it later or think about other matters.","ex":["Let us put the cost to one side and focus on quality.","She put her doubts to one side and signed."],"key":"put the cost to one side","syn":["set aside","disregard","shelve"],"reg":"neutral","ielts":"yes","note":"Useful for discussion transitions."},{"p":"raise hopes/fears/doubts, etc.","m":"cause people to hope, fear or doubt","d":"To make people begin to feel hope, fear or doubts about something.","ex":["The incident raised fears about airline safety.","The results raised hopes of a breakthrough."],"key":"raised fears","syn":["spark","fuel","arouse"],"reg":"neutral","ielts":"yes","note":"Natural collocation for news and social issues."},{"p":"the ratings","m":"figures showing how popular TV programmes are","d":"Numbers showing how many people watch or listen to a TV or radio programme.","ex":["The drama topped the ratings last night.","Falling ratings forced the channel to cancel the show."],"key":"the ratings","syn":["viewing figures","audience figures","popularity scores"],"reg":"neutral","ielts":"careful","note":"Useful for media topics."},{"p":"a ray of comfort/hope, etc.","m":"a small sign of comfort or hope","d":"A small sign of something good or hopeful in a bad situation.","ex":["The news was a ray of hope for the victims.","The doctor offered a ray of comfort to the family."],"key":"a ray of hope","syn":["a glimmer of hope","a spark of hope","a ray of light"],"reg":"neutral","ielts":"yes","note":"Good metaphor in Task 2 introductions or conclusions."},{"p":"a good/easy, etc. read","m":"a book that is easy or pleasant to read","d":"Used to describe how easy or enjoyable a book or article is to read.","ex":["The novel is a good read.","The article was an easy read."],"key":"a good read","syn":["an enjoyable book","a page-turner","an engaging text"],"reg":"informal","ielts":"no","note":"Spoken reviews; avoid in formal writing."},{"p":"reap the benefits/profits/rewards","m":"get the good results of something","d":"To gain the advantages or rewards that come from earlier effort or action.","ex":["Countries that invest in education reap the benefits later.","Farmers reaped the rewards of the new irrigation system."],"key":"reap the benefits","syn":["enjoy the rewards","profit from","gain from"],"reg":"neutral","ielts":"yes","note":"Strong collocation for cause-and-effect arguments in Task 2."},{"p":"within reason","m":"within sensible limits","d":"Within sensible or acceptable limits; not excessive.","ex":["Parents should allow children freedom within reason.","You can do anything you like within reason."],"key":"within reason","syn":["within limits","in moderation","sensibly"],"reg":"neutral","ielts":"yes","note":"Useful hedge for balanced arguments."},{"p":"it stands to reason","m":"it is logical and sensible","d":"Used to say that something is logical or natural, based on common sense.","ex":["It stands to reason that people who exercise are healthier.","It stands to reason that prices will rise."],"key":"It stands to reason","syn":["logically","naturally","it makes sense"],"reg":"neutral","ielts":"careful","note":"Useful in essays but avoid overuse; best with a clear explanation."},{"p":"be a recipe for disaster/success/trouble, etc.","m":"something likely to lead to a result","d":"Something that is likely to cause a particular result, either good or bad.","ex":["Cutting funding is a recipe for disaster.","The mix of talent and effort is a recipe for success."],"key":"a recipe for disaster","syn":["a formula for","a sure way to","a prelude to"],"reg":"neutral","ielts":"yes","note":"Idiomatic but acceptable in Task 2 with a clear explanation."},{"p":"reckon with sth","m":"have to consider or deal with something","d":"To have to consider or deal with something, especially a difficulty or opponent.","ex":["Planners must reckon with rising sea levels.","We did not reckon with so much traffic."],"key":"reckon with","syn":["take into account","deal with","anticipate"],"reg":"neutral","ielts":"careful","note":"Slightly informal; use 'take into account' in formal essays."},{"p":"relative to sth","m":"compared with or in relation to something","d":"In comparison with or in connection with something else.","ex":["Salaries are low relative to living costs.","Output increased relative to last year."],"key":"relative to","syn":["compared with","in relation to","in proportion to"],"reg":"formal","ielts":"yes","note":"Very useful in Task 1 for comparisons."},{"p":"reliance on sb/sth","m":"dependence on someone or something","d":"The state of depending on someone or something for help or support.","ex":["Our reliance on fossil fuels is growing.","Excessive reliance on technology can reduce creativity."],"key":"reliance on","syn":["dependence on","dependency on","trust in"],"reg":"formal","ielts":"yes","note":"Useful noun for Task 2 on technology and energy."},{"p":"be reliant on sb/sth","m":"depending on someone or something","d":"Needing someone or something to function or survive.","ex":["Many families are reliant on a single income.","The country is heavily reliant on imports."],"key":"are reliant on","syn":["dependent on","depend on","rely on"],"reg":"formal","ielts":"yes","note":"Useful adjective; follow with 'on'."},{"p":"be in good/bad repair","m":"in a good or bad physical state","d":"Describes the physical condition of a building or object.","ex":["The bridge is in poor repair.","Many roads are in good repair."],"key":"in poor repair","syn":["in good condition","in bad shape","dilapidated"],"reg":"neutral","ielts":"yes","note":"Useful for infrastructure topics."},{"p":"bear a/little/no, etc. resemblance to sth/sb","m":"look like someone or something to a degree","d":"To look like or be similar to someone or something, or not at all.","ex":["The copy bears no resemblance to the original.","He bears a striking resemblance to his father."],"key":"bears no resemblance to","syn":["look like","be similar to","be alike"],"reg":"formal","ielts":"yes","note":"Formal comparison; good for Academic Task 1 or comparisons."},{"p":"retrace your steps","m":"go back the way you came","d":"To go back along the same route you used before, often to find something.","ex":["He retraced his steps to find his lost keys.","She retraced her steps to the station."],"key":"retraced his steps","syn":["go back","backtrack","return"],"reg":"neutral","ielts":"careful","note":"Narrative; also figurative for reviewing past actions."},{"p":"retreat to/into, etc.","m":"go back to a place for safety","d":"To move back or withdraw to a place for safety, privacy or peace.","ex":["The army retreated to the mountains.","He retreated into silence."],"key":"retreated to","syn":["withdraw","fall back","escape"],"reg":"neutral","ielts":"careful","note":"Useful for describing defence or personal escape."},{"p":"be a revelation","m":"be a surprising and impressive discovery","d":"To be something surprising and impressive that teaches you something new.","ex":["The documentary was a revelation to many viewers.","The study was a revelation for the researchers."],"key":"was a revelation","syn":["be an eye-opener","be astonishing","be enlightening"],"reg":"neutral","ielts":"careful","note":"Good in Speaking for describing a memorable experience."},{"p":"the reverse","m":"the opposite","d":"The opposite of what has been said, or the opposite side.","ex":["The reverse is also true.","He thought the reverse."],"key":"The reverse","syn":["the opposite","the contrary","the converse"],"reg":"formal","ielts":"yes","note":"Useful for contrasting ideas in Task 2."},{"p":"be revolted by sth","m":"feel disgusted by something","d":"To feel strong disgust or shock because of something.","ex":["Many people were revolted by the images.","I was revolted by the smell."],"key":"were revolted by","syn":["be disgusted by","be appalled by","be sickened by"],"reg":"neutral","ielts":"careful","note":"Strong; use 'appalled' in measured essays."},{"p":"the Right/right","m":"the political party group, or what is correct","d":"Used for the political right, or what is morally or legally correct.","ex":["The Right won the election.","He has a right to know."],"key":"The Right","syn":["conservatives","the right wing","the correct side"],"reg":"neutral","ielts":"careful","note":"Be precise: capital R for politics."},{"p":"in its/his/their, etc. own right","m":"considered important by itself","d":"Having an importance or quality of one's own, without being linked to anything else.","ex":["She is a respected scientist in her own right.","The city is a major port in its own right."],"key":"in her own right","syn":["independently","by itself","as such"],"reg":"neutral","ielts":"yes","note":"Useful for showing independence or status in Task 2."},{"p":"a riot of sth","m":"a lot of bright and varied things","d":"A great variety or very large amount of something, especially colourful.","ex":["The market was a riot of colour.","The garden is a riot of flowers."],"key":"a riot of colour","syn":["a profusion of","a blaze of","a burst of"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for Speaking about places."},{"p":"ripe for sth","m":"ready or suitable for something","d":"Ready for or likely to have something, often a change.","ex":["The industry is ripe for reform.","The topic is ripe for debate."],"key":"ripe for reform","syn":["ready for","suited to","due for"],"reg":"formal","ielts":"yes","note":"Good for arguing change is needed in Task 2."},{"p":"rise to/through, etc.","m":"go up or move upward to something","d":"To go up to a higher position or place, often from a lower one.","ex":["She rose through the ranks to become chief.","Prices rose to record highs."],"key":"rose through","syn":["climb","advance","ascend"],"reg":"neutral","ielts":"yes","note":"Good for describing growth in Task 1."},{"p":"sb's rise to fame/power, etc.","m":"becoming famous or powerful","d":"The process of becoming famous, successful or powerful.","ex":["His rise to power was swift.","Her rise to fame began in 2010."],"key":"rise to power","syn":["ascent","emergence","climb"],"reg":"neutral","ielts":"yes","note":"Useful for history and biography topics."},{"p":"run the risk of sth","m":"accept the chance of something bad","d":"To accept that something bad could happen as a result of what you do.","ex":["Firms that ignore trends run the risk of bankruptcy.","You run the risk of failure if you do not prepare."],"key":"run the risk of","syn":["risk","court danger","take a chance"],"reg":"neutral","ielts":"yes","note":"Useful for warnings in Task 2."},{"p":"rob sb of sth","m":"take something away from someone","d":"To take something from someone, usually something important, unfairly.","ex":["Illness robbed him of his strength.","The scandal robbed the team of its credibility."],"key":"robbed him of","syn":["deprive","strip","deny"],"reg":"neutral","ielts":"yes","note":"Useful figurative use in Task 2."},{"p":"rub it in","m":"keep reminding someone of a mistake","d":"To keep reminding someone of something unpleasant that they have done or lost.","ex":["I know I lost, so don't rub it in.","Stop rubbing it in."],"key":"rub it in","syn":["remind","gloat","harp on"],"reg":"informal","ielts":"no","note":"Spoken; avoid in writing."},{"p":"etc. sth","m":"and similar things; used when a pattern lists examples","d":"Used as a placeholder in dictionary patterns to show that a verb or noun can be followed by a similar object.","ex":["The shop sells pens, paper, staplers etc. for office use.","She packed shirts, socks, shoes etc. into the suitcase before leaving."],"key":"etc.","syn":["and so on","and so forth","and the like"],"reg":"neutral","ielts":"careful","note":"Avoid 'etc.' in formal essays; give full examples or use 'such as'."},{"p":"be running at sth","m":"to be at a certain level or rate","d":"To be operating or measured at a particular level, rate or figure, often used of inflation, prices or percentages.","ex":["Inflation is running at four percent this year.","Unemployment was running at its highest level in a decade."],"key":"running at","syn":["stand at","be at","operate at"],"reg":"neutral","ielts":"yes","note":"Useful for describing rates and levels in Task 1 reports."},{"p":"run wild","m":"to behave in an uncontrolled, free way","d":"To behave or grow in a free, uncontrolled way without discipline or restriction, used of children, animals, plants or imagination.","ex":["The children were allowed to run wild in the garden all afternoon.","Without regular pruning, the roses will run wild."],"key":"run wild","syn":["go wild","get out of control","rampage"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; in essays use it only with clear context."},{"p":"a run of sth","m":"a series of the same events in a row","d":"A continuous series of similar events, usually successes or failures, occurring one after another.","ex":["The team enjoyed a run of victories at the start of the season.","After a run of bad luck, the firm finally secured a major contract."],"key":"a run of","syn":["a series of","a streak of","a string of"],"reg":"neutral","ielts":"yes","note":"Good for describing trends or sequences, in speaking and writing."},{"p":"safe and sound","m":"unharmed and in good condition","d":"Not hurt, damaged or lost, especially after a dangerous situation or journey.","ex":["The hikers were found safe and sound after two nights on the mountain.","I was relieved when the parcel arrived safe and sound."],"key":"safe and sound","syn":["unharmed","unscathed","in one piece"],"reg":"neutral","ielts":"careful","note":"Nice in speaking stories; rare in academic essays."},{"p":"set sail","m":"to begin a journey by boat","d":"To start a voyage by ship or boat, often followed by 'for' and a destination.","ex":["The explorers set sail for the New World in the spring of 1492.","We set sail at dawn, hoping to reach the island by dusk."],"key":"set sail","syn":["put to sea","embark","depart by ship"],"reg":"neutral","ielts":"yes","note":"Fine for history topics and narrative descriptions in speaking."},{"p":"to sb's satisfaction","m":"in a way that pleases someone or meets their standards","d":"In a manner that fully pleases someone or meets their requirements, often used after a verb such as 'complete' or 'resolve'.","ex":["The problem was resolved to the customer's satisfaction.","She completed the task to her manager's satisfaction."],"key":"to the customer's satisfaction","syn":["satisfactorily","to sb's liking","as sb wanted"],"reg":"formal","ielts":"yes","note":"Useful in formal letters and complaint letters in General Training."},{"p":"scare the hell/life/living daylights etc. out of sb","m":"to frighten someone very much","d":"To frighten someone extremely, using an emphatic noun such as 'hell', 'life' or 'living daylights' after 'scare'.","ex":["The sudden thunderclap scared the living daylights out of me.","That horror film scared the life out of the children."],"key":"scared the living daylights out of","syn":["frighten to death","terrify","give sb a fright"],"reg":"informal","ielts":"no","note":"Spoken and chatty; avoid in essays, fine for informal storytelling."},{"p":"scramble down/out/up, etc.","m":"to climb or move quickly using hands and feet","d":"To move quickly and awkwardly, often on hands and knees, in a direction shown by the particle that follows.","ex":["The climbers scrambled up the rocky slope before the storm hit.","Passengers scrambled out of the bus as smoke filled the cabin."],"key":"scrambled up","syn":["clamber","scrabble","climb hurriedly"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful for narrative in speaking, rare in essays."},{"p":"scroll up/down/through, etc.","m":"to move text on a screen up or down","d":"To move text or images up, down or across a computer or phone screen to see more.","ex":["Scroll down to the bottom of the page to find the form.","He scrolled through hundreds of emails looking for the invoice."],"key":"Scroll down","syn":["browse","move through","page down"],"reg":"neutral","ielts":"yes","note":"Handy for technology topics in speaking and Task 2."},{"p":"seat 4/12/200, etc.","m":"to have enough seats for that number of people","d":"To have enough chairs or places for a stated number of people to sit.","ex":["The new auditorium seats 800 people comfortably.","Our dining table seats twelve, so everyone can join us."],"key":"seats 800","syn":["accommodate","hold","have room for"],"reg":"neutral","ielts":"yes","note":"Good for describing venues or buildings in Task 1 or speaking."},{"p":"see that","m":"to make sure something happens","d":"To make certain that something is done or happens, followed by a clause.","ex":["Please see that all the windows are closed before you leave.","The manager will see that your complaint is dealt with promptly."],"key":"see that","syn":["make sure","ensure","check that"],"reg":"neutral","ielts":"careful","note":"Slightly old-fashioned; 'ensure that' is safer in formal essays."},{"p":"see sense","m":"to start to act in a sensible way","d":"To begin to accept good advice and behave reasonably, especially after being stubborn.","ex":["After weeks of arguing, he finally saw sense and apologised.","I hope the council will see sense and reverse the decision."],"key":"saw sense","syn":["come to your senses","listen to reason","wise up"],"reg":"neutral","ielts":"careful","note":"Better in speaking; use 'listen to reason' in formal writing."},{"p":"(the) seeds of sth","m":"the early signs of something that will grow later","d":"The first causes or beginnings of a later development, usually of something negative such as conflict or doubt.","ex":["The treaty unwittingly sowed the seeds of future conflict.","Early failures planted the seeds of doubt in her mind."],"key":"the seeds of","syn":["the roots of","the origins of","the beginnings of"],"reg":"neutral","ielts":"yes","note":"Strong metaphor for Task 2 cause-and-effect arguments."},{"p":"set guidelines/standards, etc.","m":"to decide rules or levels that others must follow","d":"To establish rules, targets or levels of quality that others are expected to follow.","ex":["The government should set strict standards for food safety.","Schools need to set clear guidelines on the use of phones."],"key":"set strict standards","syn":["establish rules","lay down standards","define criteria"],"reg":"formal","ielts":"yes","note":"Very useful collocation for policy arguments in Task 2."},{"p":"set sth down/on, etc.","m":"to put something carefully on a surface","d":"To place something gently on a surface or the ground, with a particle or preposition showing where.","ex":["She set the tray down on the kitchen table.","He carefully set the baby on the sofa."],"key":"set the tray down","syn":["put down","place","lay down"],"reg":"neutral","ielts":"careful","note":"Narrative use; not common in academic writing."},{"p":"take shape","m":"to begin to develop a clear form","d":"To develop gradually into a clear form or become more definite, used of plans, ideas or objects.","ex":["Our plans for the new library are slowly taking shape.","As the sculptor worked, the figure began to take shape."],"key":"taking shape","syn":["develop","materialise","come together"],"reg":"neutral","ielts":"yes","note":"Good for describing projects or ideas developing in essays."},{"p":"your (fair) share of sth","m":"the normal or deserved amount of something","d":"The amount of something that a person ought to receive, have or experience, often with 'have had'.","ex":["She has had her fair share of misfortune over the years.","Every citizen should pay their share of taxes."],"key":"her fair share of","syn":["a due portion of","a reasonable amount of","one's portion of"],"reg":"neutral","ielts":"yes","note":"Useful in fairness and tax arguments in Task 2."},{"p":"a sharp contrast/difference, etc.","m":"a very clear and obvious difference","d":"A very noticeable or marked difference between two things, often used before 'between' or 'with'.","ex":["There is a sharp contrast between urban and rural incomes.","The figures reveal a sharp difference in life expectancy between the two regions."],"key":"a sharp contrast","syn":["a marked difference","a stark contrast","a striking difference"],"reg":"formal","ielts":"yes","note":"Excellent for comparing data in Academic Task 1."},{"p":"a sharp bend/turn, etc.","m":"a sudden change in direction on a road or path","d":"A sudden, tight change in direction, as on a road, river or path; also used figuratively.","ex":["The car slowed as it approached a sharp bend in the road.","The river takes a sharp turn to the east near the town."],"key":"a sharp bend","syn":["a tight corner","a hairpin bend","an abrupt turn"],"reg":"neutral","ielts":"yes","note":"Useful in map descriptions and describing routes in Task 1."},{"p":"shelter from/in/under, etc.","m":"to stay in a place that protects you","d":"To find or take protection from bad weather or danger in or under a place, with a preposition indicating where.","ex":["We sheltered from the rain under a large oak tree.","Villagers sheltered in the church until the floodwaters receded."],"key":"sheltered from the rain","syn":["take cover","seek refuge","hide"],"reg":"neutral","ielts":"yes","note":"Fine for weather, disaster and housing topics."},{"p":"shoot across/out/up, etc.","m":"to move very quickly in a direction","d":"To move suddenly and very fast in a particular direction, used of people, animals, vehicles or prices.","ex":["A cat shot across the road in front of our car.","House prices shot up during the early 2000s."],"key":"shot across","syn":["dash","rocket","surge"],"reg":"neutral","ielts":"careful","note":"'Shoot up' for prices is lively; prefer 'rise sharply' in formal writing."},{"p":"stop short of sth/doing sth","m":"to nearly do something but not actually do it","d":"To avoid going as far as a particular action or extreme, although you come close to it.","ex":["The minister stopped short of calling the policy a failure.","They stopped short of making a formal apology."],"key":"stopped short of","syn":["fall short of","hold back from","refrain from"],"reg":"formal","ielts":"yes","note":"Great for balanced, cautious arguments and reporting views."},{"p":"shower sb with sth","m":"to give someone a lot of something","d":"To give someone a large amount of something, such as gifts, praise or questions, in a generous way.","ex":["Fans showered the winning team with praise and flowers.","The grandparents showered the baby with gifts."],"key":"showered the winning team with","syn":["lavish on","heap upon","overwhelm with"],"reg":"neutral","ielts":"careful","note":"Vivid for speaking; limited use in academic essays."},{"p":"at/by your side","m":"next to you, or supporting you","d":"Close beside someone, or giving them continuous support, especially in hard times.","ex":["Her husband stayed by her side throughout the long illness.","The dog walked at his side all the way home."],"key":"by her side","syn":["beside you","alongside you","supporting you"],"reg":"neutral","ielts":"careful","note":"Good for speaking about family or friends; emotional tone."},{"p":"sit sb down/at/in, etc.","m":"to make someone sit in a place","d":"To cause or ask someone to sit in a particular place or position.","ex":["The teacher sat the new pupil down at the front of the class.","She sat her children down at the table and served dinner."],"key":"sat the new pupil down","syn":["seat","place in a chair","make sit"],"reg":"neutral","ielts":"careful","note":"Narrative use; rarely needed in essays."},{"p":"sleep on it","m":"to wait until tomorrow before deciding","d":"To delay making an important decision until the next day so that you have time to think.","ex":["I'm not sure about the offer, so I'll sleep on it.","Let's sleep on it and discuss the plan in the morning."],"key":"sleep on it","syn":["think it over","take time to decide","consider overnight"],"reg":"informal","ielts":"no","note":"Good in Speaking Part 3 answers about decisions; not for essays."},{"p":"not sleep a wink","m":"to not sleep at all","d":"To be unable to sleep at all during a night, often because of worry or noise.","ex":["I didn't sleep a wink before my exam.","The noisy neighbours meant we couldn't sleep a wink all night."],"key":"sleep a wink","syn":["not get a wink of sleep","stay awake all night","be sleepless"],"reg":"informal","ielts":"no","note":"Nice spoken idiom for sleep topics; avoid in essays."},{"p":"slip sth into/through, etc.","m":"to put something somewhere quietly or quickly","d":"To put something into or through a place smoothly, quickly or secretly.","ex":["She slipped the note into his coat pocket without being seen.","He slipped a coin through the slot."],"key":"slipped the note into","syn":["tuck","slide","sneak"],"reg":"neutral","ielts":"careful","note":"Narrative; avoid in academic writing."},{"p":"slip out/through, etc.","m":"to leave quietly without being noticed","d":"To move or escape quietly or easily, often without anyone noticing, with a particle showing direction.","ex":["He slipped out of the meeting before anyone noticed.","The thief slipped through the gap in the fence."],"key":"slipped out of","syn":["sneak out","steal away","escape quietly"],"reg":"neutral","ielts":"careful","note":"Fits storytelling in speaking; rarely used in essays."},{"p":"be slow to do sth; be slow in doing sth","m":"to take a long time to do something","d":"To react or act later or more gradually than expected, followed by 'to' plus infinitive or 'in' plus -ing.","ex":["Many companies were slow to respond to changing consumer habits.","The government was slow in introducing environmental laws."],"key":"were slow to respond","syn":["be reluctant to","be tardy in","delay in"],"reg":"formal","ielts":"yes","note":"Neutral criticism of governments or firms in Task 2."},{"p":"sneak into/out/around, etc.","m":"to move quietly so nobody notices","d":"To go somewhere quietly and secretly so as not to be seen or heard.","ex":["The boys sneaked into the cinema without paying.","She sneaked out of the house after midnight."],"key":"sneaked into","syn":["creep","slip in","tiptoe"],"reg":"informal","ielts":"no","note":"Story-telling only; avoid in essays."},{"p":"sneak sth into/out of/through, etc.","m":"to secretly take something somewhere","d":"To take something somewhere secretly, so that nobody sees or stops you.","ex":["He sneaked a camera into the concert hall.","The prisoner tried to sneak a letter out of the jail."],"key":"sneaked a camera into","syn":["smuggle","slip in secretly","bring in covertly"],"reg":"informal","ielts":"no","note":"Spoken, narrative use; avoid in academic writing."},{"p":"sneak a look/glance at sb/sth","m":"to look quickly and secretly","d":"To look at someone or something quickly and secretly, hoping not to be noticed.","ex":["I sneaked a glance at her phone while she was away.","He sneaked a look at the answers on the teacher's desk."],"key":"sneaked a glance at","syn":["steal a glance","peek at","glance furtively"],"reg":"informal","ielts":"no","note":"Good for describing a memory in Speaking Part 2."},{"p":"be snowed in","m":"to be unable to leave because of heavy snow","d":"To be trapped in a place by heavy snow so that travel is impossible.","ex":["We were snowed in for three days at the mountain lodge.","The village was snowed in after the blizzard."],"key":"were snowed in","syn":["be snowbound","be cut off by snow","be trapped by snow"],"reg":"neutral","ielts":"yes","note":"Useful for weather and travel topics in speaking."},{"p":"be snowed under","m":"to have too much work to deal with","d":"To have so much work or so many tasks that you can hardly manage them, usually followed by 'with'.","ex":["I'm snowed under with marking this week.","The office was snowed under with applications."],"key":"snowed under with","syn":["be swamped","be overloaded","be inundated"],"reg":"informal","ielts":"careful","note":"Good for work and study topics in speaking; avoid in formal essays."},{"p":"so much for...","m":"used to show that something has failed or is useless","d":"Used to say that something has been shown to be useless or unsuccessful, often with sarcasm, or to close a topic.","ex":["It rained all day, so much for our picnic.","So much for the new software; it crashes every hour."],"key":"so much for","syn":["that's the end of","so that's that for","forget about"],"reg":"informal","ielts":"no","note":"Sarcastic and spoken; do not use in essays."},{"p":"I told you so","m":"used to say you were right and warned someone","d":"Said to a person when events have proved that your earlier warning or advice was correct.","ex":["I told you so; you should have taken an umbrella.","He didn't say 'I told you so' when my plan failed."],"key":"I told you so","syn":["I warned you","I knew it","what did I say"],"reg":"informal","ielts":"no","note":"Spoken and slightly rude; not for writing."},{"p":"so to speak","m":"used to show you are using words in an unusual way","d":"Used to indicate that a word or expression is not meant literally or is being used in an unusual way.","ex":["The city is, so to speak, the engine of the national economy.","He was thrown in at the deep end, so to speak."],"key":"so to speak","syn":["as it were","in a manner of speaking","figuratively speaking"],"reg":"neutral","ielts":"careful","note":"Useful hedge in speaking; use sparingly in essays."},{"p":"be something","m":"to be impressive or remarkable","d":"To be impressive, remarkable or important in some way, used mainly in informal speech.","ex":["That view from the summit is really something.","Her courage in the face of danger was something."],"key":"is really something","syn":["be remarkable","be impressive","be special"],"reg":"informal","ielts":"no","note":"Spoken enthusiasm; avoid in academic writing."},{"p":"something of a sth","m":"rather like; to some extent","d":"Used before a noun to say that someone or something is partly or to some degree that thing.","ex":["He is something of an expert on ancient languages.","The result came as something of a surprise to the researchers."],"key":"something of an expert","syn":["rather a","a bit of a","to some extent a"],"reg":"neutral","ielts":"yes","note":"Useful hedging phrase for balanced, cautious claims."},{"p":"would sooner","m":"would prefer to do one thing than another","d":"Used to express a preference, followed by a bare infinitive and often 'than' plus another verb.","ex":["I would sooner walk than take the crowded bus.","She'd sooner stay at home than go to a noisy party."],"key":"would sooner walk","syn":["would rather","would prefer to","would choose to"],"reg":"neutral","ielts":"careful","note":"Good for expressing preference in speaking; 'would rather' is more common."},{"p":"the sound of sth","m":"the noise that something makes","d":"The noise made by something or someone, often used to describe what a person hears.","ex":["I love the sound of rain on the roof.","The sound of children laughing filled the playground."],"key":"the sound of rain","syn":["the noise of","the noise made by","the audio of"],"reg":"neutral","ielts":"yes","note":"Helpful in Speaking Part 2 descriptions of places and memories."},{"p":"spare no effort/expense, etc.","m":"to use as much effort or money as needed","d":"To use all available effort, money or resources in order to achieve something.","ex":["The organisers spared no expense in making the festival a success.","Doctors spared no effort to save the injured climber."],"key":"spared no expense","syn":["go to any lengths","leave no stone unturned","pull out all the stops"],"reg":"formal","ielts":"yes","note":"Good emphatic phrase for essays about commitment or investment."},{"p":"spare a thought for sb","m":"to think kindly about someone in a worse situation","d":"To think about and feel sympathy for someone who is in a difficult situation.","ex":["Let us spare a thought for the families affected by the floods.","While you are enjoying your holiday, spare a thought for those still working."],"key":"spare a thought for","syn":["think of","remember","have sympathy for"],"reg":"neutral","ielts":"careful","note":"Rhetorical; effective in speaking and some essay conclusions."},{"p":"speaks for itself","m":"is so clear that it needs no explanation","d":"Used to say that something is so obvious or impressive that no further explanation is needed.","ex":["The company's growth figures speak for themselves.","Her record of success speaks for itself."],"key":"speak for themselves","syn":["is self-evident","needs no explanation","is obvious"],"reg":"neutral","ielts":"yes","note":"Good to support an argument with evidence in Task 2."},{"p":"not be on speaking terms","m":"to refuse to talk to someone after a quarrel","d":"To be in a state where two people avoid talking to each other because of an argument.","ex":["The two brothers have not been on speaking terms for years.","After the dispute, the neighbours were no longer on speaking terms."],"key":"on speaking terms","syn":["be estranged","not be talking","be at odds"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about family relationships; rare in essays."},{"p":"free speech/freedom of speech","m":"the right to say what you think","d":"The legal right to express opinions publicly without government restriction or punishment.","ex":["Freedom of speech is a cornerstone of any democratic society.","Critics argue that limiting free speech harms public debate."],"key":"Freedom of speech","syn":["freedom of expression","the right to speak freely","free expression"],"reg":"formal","ielts":"yes","note":"Key topic phrase for media, law and society essays."},{"p":"the spotlight","m":"public attention","d":"The focus of public attention, often used with 'in', 'into' or 'under'.","ex":["The scandal put the minister firmly in the spotlight.","Young musicians often struggle with life in the spotlight."],"key":"the spotlight","syn":["the limelight","public attention","the public eye"],"reg":"neutral","ielts":"yes","note":"Good for fame, media and celebrity topics."},{"p":"spring back/forward/out, etc.","m":"to jump or move suddenly in a direction","d":"To move suddenly and quickly in a particular direction, or to return quickly to the original position.","ex":["The branch sprang back and hit him in the face.","The cat sprang out from behind the sofa."],"key":"sprang back","syn":["jump","bounce","leap"],"reg":"neutral","ielts":"careful","note":"Mostly narrative; use 'rebound' for economic recovery in essays."},{"p":"stage a concert/show, etc.","m":"to organise and present a public event","d":"To organise and present a public performance or event, such as a concert, play or demonstration.","ex":["The school will stage a musical at the end of term.","Protesters staged a demonstration outside parliament."],"key":"stage a musical","syn":["put on","organise","present"],"reg":"neutral","ielts":"yes","note":"Useful for culture, arts and events topics."},{"p":"stand trial","m":"to be judged in a court of law","d":"To be tried in a court on a charge of a crime.","ex":["The former director will stand trial for fraud next month.","He was too ill to stand trial."],"key":"stand trial","syn":["be tried","face trial","go on trial"],"reg":"formal","ielts":"yes","note":"Useful for crime and justice topics in Task 2."},{"p":"stand to gain/lose sth","m":"to be likely to win or lose something","d":"To be in a position where you are likely to gain or lose something as a result of a situation.","ex":["Farmers stand to lose millions if the drought continues.","Local businesses stand to gain from the new tourism scheme."],"key":"stand to lose","syn":["be likely to lose","risk losing","be set to gain"],"reg":"formal","ielts":"yes","note":"Excellent for discussing winners and losers of policies."},{"p":"where you stand (with sb)","m":"what your relationship or position with someone is","d":"Your exact position or status in a relationship or situation, especially how someone regards you.","ex":["I want to know where I stand with my boss.","After the argument, she was unsure where she stood with her friends."],"key":"where I stand","syn":["what your position is","how you are regarded","your status"],"reg":"neutral","ielts":"careful","note":"Fine in speaking about work or relationships."},{"p":"where sb stands (on sth)","m":"what someone's opinion is about something","d":"What someone's opinion or position is on an issue, often used in questions and statements about politics.","ex":["Voters want to know where the candidate stands on taxation.","It is not clear where the government stands on nuclear power."],"key":"where the candidate stands","syn":["sb's position on","sb's view on","sb's stance on"],"reg":"neutral","ielts":"yes","note":"Fits politics and opinion topics in essays and speaking."},{"p":"stand for sth","m":"to represent or support something","d":"To represent an idea or value, to be an abbreviation of something, or to support a cause.","ex":["The party stands for equality and social justice.","UN stands for United Nations."],"key":"stands for equality","syn":["represent","symbolise","support"],"reg":"neutral","ielts":"yes","note":"Useful for describing values and meanings of terms."},{"p":"make/take a stand","m":"to publicly show strong support or opposition","d":"To publicly declare a firm position on an issue, especially in opposition to something.","ex":["Residents decided to take a stand against the new highway.","It is time for leaders to make a stand on climate change."],"key":"take a stand","syn":["speak out","take a position","draw the line"],"reg":"neutral","ielts":"yes","note":"Strong phrase for arguments about activism and responsibility."},{"p":"stay put","m":"to remain where you are","d":"To remain in the same place or position and not move.","ex":["The rescuers told us to stay put until help arrived.","Shares stayed put despite the announcement."],"key":"stay put","syn":["remain","stay where you are","not move"],"reg":"informal","ielts":"no","note":"Spoken; use 'remain' in essays."},{"p":"steady job/work","m":"a job that is regular and secure","d":"Employment that provides a regular income and is not likely to end suddenly.","ex":["Many graduates prefer a steady job to a risky start-up.","He finally found steady work in a local factory."],"key":"a steady job","syn":["secure employment","stable job","regular work"],"reg":"neutral","ielts":"yes","note":"Good for job security topics in Task 2 and speaking."},{"p":"stiff drink/whisky/vodka, etc.","m":"a strong alcoholic drink","d":"A large or strong alcoholic drink, often taken to calm nerves.","ex":["After the shock, he poured himself a stiff whisky.","She needed a stiff drink after the long meeting."],"key":"a stiff whisky","syn":["a strong drink","a large measure","a double"],"reg":"informal","ielts":"no","note":"Spoken and narrative; unsuitable for formal writing."},{"p":"take stock (of sth)","m":"to think carefully about a situation before deciding","d":"To review the present situation carefully, especially before making a decision.","ex":["At the end of the year, we take stock of our achievements.","He took stock of his finances before buying the house."],"key":"take stock of","syn":["assess","review","evaluate"],"reg":"neutral","ielts":"yes","note":"Good in conclusions and reflective essay paragraphs."},{"p":"stretch away/into, etc.","m":"to extend over a long distance","d":"To extend over a large area or distance in a stated direction.","ex":["Rice fields stretched away into the distance.","The beach stretched into the haze as far as we could see."],"key":"stretched away","syn":["extend","spread out","reach"],"reg":"neutral","ielts":"yes","note":"Useful for describing landscapes in Speaking Part 2."},{"p":"strike sb as sth","m":"to give someone a particular impression","d":"To give someone a particular impression or seem a certain way to them.","ex":["His behaviour struck me as rather odd.","The plan strikes many experts as unrealistic."],"key":"struck me as","syn":["seem to","impress as","appear to"],"reg":"neutral","ielts":"yes","note":"Good for giving opinions and impressions in speaking."},{"p":"strike gold, oil, etc.","m":"to find a valuable resource, or become suddenly successful","d":"To discover a valuable resource such as gold or oil, or to achieve sudden success.","ex":["The prospectors struck gold in the hills of California.","The company struck oil off the coast of Norway."],"key":"struck gold","syn":["hit the jackpot","find a fortune","make a lucky find"],"reg":"neutral","ielts":"careful","note":"Good for history or business examples; figurative use is informal."},{"p":"a strong chance/possibility, etc.","m":"a good probability that something will happen","d":"A high likelihood that something will happen or is true.","ex":["There is a strong chance that prices will fall next year.","Experts see a strong possibility of further flooding."],"key":"a strong chance","syn":["a high probability","a good likelihood","a real prospect"],"reg":"neutral","ielts":"yes","note":"Useful for predictions in Task 1 and Task 2."},{"p":"strong opposition/support, etc.","m":"a lot of disagreement or backing","d":"A large degree of disagreement with, or backing for, a plan or idea.","ex":["The proposal met with strong opposition from local residents.","The policy enjoys strong support among younger voters."],"key":"strong opposition","syn":["fierce resistance","firm backing","widespread support"],"reg":"formal","ielts":"yes","note":"Very useful collocation for policy and opinion essays."},{"p":"be/get stuck with sb/sth","m":"to have to deal with someone or something unwanted","d":"To be forced to deal with a person or thing you do not want, with no easy way out.","ex":["I got stuck with the washing-up after the party.","We were stuck with a noisy neighbour for years."],"key":"got stuck with","syn":["be lumbered with","be saddled with","be landed with"],"reg":"informal","ielts":"no","note":"Spoken; use 'be burdened with' in formal writing."},{"p":"stuff sth in/into/behind, etc.","m":"to push something quickly into a space","d":"To push something quickly and carelessly into a small space.","ex":["She stuffed the letter into her bag and hurried out.","He stuffed his clothes behind the wardrobe."],"key":"stuffed the letter into","syn":["shove","cram","thrust"],"reg":"informal","ielts":"no","note":"Narrative and spoken; avoid in essays."},{"p":"cramp sb's style","m":"to stop someone from acting freely","d":"To prevent someone from behaving naturally or freely, often by being present or restricting them.","ex":["Having my parents around really cramps my style.","Strict rules can cramp a young artist's style."],"key":"cramps my style","syn":["restrict","inhibit","hold back"],"reg":"informal","ielts":"no","note":"Spoken idiom for Speaking Part 1 or 3; avoid in essays."},{"p":"subject to sth","m":"depending on or controlled by something","d":"Likely to be affected by something, or depending on certain conditions or rules being met.","ex":["All prices are subject to change without notice.","The plan is subject to approval by the council."],"key":"subject to change","syn":["dependent on","conditional on","liable to"],"reg":"formal","ielts":"yes","note":"Common in formal writing and letters about conditions."},{"p":"the substance of sth","m":"the main or most important part of something","d":"The essential meaning or most important content of a speech, document or argument.","ex":["The substance of her argument was that wages must rise.","I agree with the substance of the report, but not its tone."],"key":"The substance of her argument","syn":["the essence of","the gist of","the core of"],"reg":"formal","ielts":"yes","note":"Good for summarising arguments or reports."},{"p":"a suggestion of/that sth","m":"a slight sign or hint of something","d":"A slight indication or hint that something exists or is true, followed by 'of' plus noun or 'that' plus clause.","ex":["There was a suggestion of sadness in her voice.","The data offers a suggestion that diets are changing."],"key":"a suggestion of","syn":["a hint of","a trace of","an indication of"],"reg":"neutral","ielts":"yes","note":"Good for cautious statements about evidence."},{"p":"sweep along/into/past, etc.","m":"to move or carry quickly and strongly","d":"To move quickly and strongly in a direction, or to carry something with great force.","ex":["The flood swept the cars along the street.","A new fashion swept across Europe in the 1920s."],"key":"swept the cars along","syn":["surge","rush","carry away"],"reg":"neutral","ielts":"yes","note":"Useful for describing trends or disasters in essays."},{"p":"I take it (that)","m":"I assume that something is true","d":"Used to say that you assume something is true based on the evidence you have.","ex":["I take it that you have already read the report.","I take it you won't be coming to the party."],"key":"I take it that","syn":["I assume","I presume","I gather"],"reg":"informal","ielts":"no","note":"Spoken; not suitable for academic essays."},{"p":"take its toll","m":"to cause damage or harm over time","d":"To have a gradually harmful effect, especially on health, resources or relationships.","ex":["Years of overwork began to take their toll on his health.","Pollution is taking its toll on the river's wildlife."],"key":"take their toll","syn":["have a negative effect","wear down","cause damage"],"reg":"neutral","ielts":"yes","note":"Very useful for describing negative effects in Task 2."},{"p":"take a turn for the better/worse","m":"to start getting better or worse","d":"To change suddenly in a good or bad direction, especially of a person's health or a situation.","ex":["The patient took a turn for the worse overnight.","Our luck took a turn for the better when we found a sponsor."],"key":"took a turn for the worse","syn":["improve suddenly","deteriorate","change for the better"],"reg":"neutral","ielts":"yes","note":"Fine for describing changes in health or economy."},{"p":"your take on sth","m":"your opinion or view of something","d":"Your personal opinion or interpretation of a situation or event.","ex":["What's your take on the new education reforms?","His take on the film was surprisingly positive."],"key":"your take on","syn":["your view on","your opinion of","your angle on"],"reg":"informal","ielts":"no","note":"Good in speaking; use 'view' or 'perspective' in essays."},{"p":"talk about sth/doing sth","m":"to discuss or mention something","d":"To discuss a subject or mention an idea or plan, followed by a noun or gerund.","ex":["We talked about moving abroad for a year.","The article talks about the effects of social media."],"key":"talked about moving","syn":["discuss","speak about","mention"],"reg":"neutral","ielts":"careful","note":"Common in speaking; use 'discuss' or 'address' in writing."},{"p":"target audience/market, etc.","m":"the group of people a product aims to reach","d":"The particular group of people at whom a product, advert or message is aimed.","ex":["The magazine's target audience is young professionals.","Firms must understand their target market before launching a product."],"key":"target audience","syn":["intended audience","intended market","key demographic"],"reg":"neutral","ielts":"yes","note":"Useful for advertising, media and business topics."},{"p":"a taste for sth","m":"a liking for something","d":"A liking or preference for something, often one that develops over time.","ex":["She developed a taste for spicy food while living in Thailand.","Many teenagers acquire a taste for fast food."],"key":"a taste for","syn":["a liking for","a fondness for","an appetite for"],"reg":"neutral","ielts":"yes","note":"Good for food, music and lifestyle topics."},{"p":"(be) torn between sth and sth","m":"to find it hard to choose between two things","d":"To be unable to decide between two options or loyalties because you want both.","ex":["She was torn between accepting the job and staying at university.","Many parents are torn between work and family life."],"key":"torn between","syn":["be divided between","be undecided between","be in two minds about"],"reg":"neutral","ielts":"yes","note":"Good for describing dilemmas in essays and speaking."},{"p":"(I'll) tell you what","m":"used to introduce a suggestion","d":"Used in speech to introduce a suggestion or offer to solve a problem.","ex":["Tell you what, I'll drive you to the station.","I'll tell you what, let's split the cost."],"key":"Tell you what","syn":["how about this","here's an idea","why don't we"],"reg":"informal","ielts":"no","note":"Spoken only; fine in friend letters, not essays."},{"p":"be on good/bad/friendly, etc. terms","m":"to have a good or bad relationship with someone","d":"To have a particular kind of relationship with someone, such as friendly or hostile.","ex":["The two neighbours are on friendly terms with each other.","He is on bad terms with his former employer."],"key":"on friendly terms","syn":["get along","have a relationship","be on speaking terms"],"reg":"neutral","ielts":"yes","note":"Good for relationships topics in speaking and writing."},{"p":"this and that","m":"various small unnamed things","d":"Various things that are not important enough to name.","ex":["We chatted about this and that over coffee.","She bought this and that at the market."],"key":"this and that","syn":["one thing and another","odds and ends","various things"],"reg":"informal","ielts":"no","note":"Vague and spoken; avoid in essays."},{"p":"vanish into thin air","m":"to disappear completely and mysteriously","d":"To disappear suddenly and completely, leaving no trace.","ex":["The money seemed to vanish into thin air.","The magician made the coin vanish into thin air."],"key":"vanish into thin air","syn":["disappear without trace","disappear suddenly","evaporate"],"reg":"neutral","ielts":"careful","note":"Vivid idiom; fine in speaking, use sparingly in essays."},{"p":"not think much of sb/sth","m":"to have a low opinion of someone or something","d":"To have a poor or unfavourable opinion of someone or something.","ex":["I didn't think much of the film.","Critics did not think much of the new policy."],"key":"didn't think much of","syn":["have a low opinion of","not rate","disapprove of"],"reg":"neutral","ielts":"careful","note":"Good in speaking; milder than 'dislike' and polite."},{"p":"Who would have thought...?","m":"used to show surprise at something unexpected","d":"Used to express surprise that something happened or is true.","ex":["Who would have thought that a small village could host such a festival?","Who would have thought she'd win the competition?"],"key":"Who would have thought","syn":["Who'd have guessed","Fancy that","Isn't that surprising"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"think highly/a lot of sb/sth","m":"to have a very good opinion of someone","d":"To admire or have a very favourable opinion of someone or something.","ex":["My colleagues think highly of her work.","Everyone thinks a lot of our new headteacher."],"key":"think highly of","syn":["admire","hold in high regard","rate highly"],"reg":"neutral","ielts":"yes","note":"Natural for talking about people you admire."},{"p":"a thirst for sth","m":"a strong desire for something","d":"A strong desire for something, especially knowledge, adventure or success.","ex":["The students showed a real thirst for knowledge.","His thirst for adventure took him around the world."],"key":"thirst for","syn":["a hunger for","a craving for","an appetite for"],"reg":"neutral","ielts":"yes","note":"Strong phrase for education and ambition essays."},{"p":"train of thought","m":"the connected ideas in your mind","d":"The connected series of ideas that go through a person's mind as they think or speak.","ex":["The phone call interrupted my train of thought.","She lost her train of thought halfway through the speech."],"key":"train of thought","syn":["line of thought","thread of thought","chain of reasoning"],"reg":"neutral","ielts":"yes","note":"Good for talking about concentration and interruptions."},{"p":"thread your way through/between, etc.","m":"to move carefully through a crowded space","d":"To move carefully and skilfully through a crowd or narrow space by finding gaps.","ex":["She threaded her way through the crowded market.","Cyclists threaded their way between the slow cars."],"key":"threaded her way through","syn":["weave through","pick your way through","wind through"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful in Speaking Part 2 stories."},{"p":"the throne","m":"the position of being king or queen","d":"The position and power of a king or queen, often used with 'ascend', 'abdicate' or 'succeed to'.","ex":["She succeeded to the throne at the age of eighteen.","The king was forced to give up the throne."],"key":"the throne","syn":["the crown","the monarchy","royal power"],"reg":"formal","ielts":"yes","note":"Use for history and politics topics."},{"p":"throw sth around/down/on, etc.","m":"to throw something in a careless way","d":"To throw or put something carelessly somewhere, with a particle or preposition showing the place.","ex":["He threw his coat on the chair and sat down.","Children had thrown toys around the room."],"key":"threw his coat on","syn":["toss","fling","hurl"],"reg":"neutral","ielts":"careful","note":"Narrative use; rarely needed in essays."},{"p":"time after time","m":"again and again","d":"Repeatedly, on many occasions, often showing annoyance or surprise.","ex":["Time after time, the committee ignored the warnings.","He failed time after time but never gave up."],"key":"Time after time","syn":["again and again","repeatedly","over and over"],"reg":"neutral","ielts":"careful","note":"Emphatic; fine in speaking, use 'repeatedly' in formal writing."},{"p":"have no time for sb/sth","m":"to dislike someone or think something is not worth attention","d":"To dislike or disapprove of someone or something, or to be unwilling to waste time on it.","ex":["I have no time for people who are rude to waiters.","The director has no time for excuses."],"key":"have no time for","syn":["have no patience with","disapprove of","not tolerate"],"reg":"informal","ielts":"careful","note":"Fine in speaking; use more formal wording in essays."},{"p":"tip sth into/onto/out of, etc. sth","m":"to pour or empty something from a container","d":"To pour or empty something by tilting its container, with a preposition showing destination.","ex":["She tipped the rice into the boiling water.","He tipped the rubbish out of the bin."],"key":"tipped the rice into","syn":["pour","empty","dump"],"reg":"neutral","ielts":"careful","note":"Common in cooking descriptions in speaking."},{"p":"to sb's disappointment/relief/surprise, etc.","m":"used to say how someone felt about a result","d":"Used to express someone's emotional reaction to an event, with a noun such as 'surprise' or 'relief'.","ex":["To my surprise, the exam was easier than expected.","To everyone's relief, the storm passed quickly."],"key":"To my surprise","syn":["much to sb's surprise","unexpectedly for sb","happily for sb"],"reg":"neutral","ielts":"yes","note":"Useful sentence opener for narrative in speaking and letters."},{"p":"the top","m":"the highest part or position","d":"The highest point, part or position of something, or the highest rank in a group.","ex":["We climbed to the top of the tower before sunset.","The firm is at the top of its industry."],"key":"the top of the tower","syn":["the summit","the peak","the highest point"],"reg":"neutral","ielts":"yes","note":"Common in map and chart descriptions."},{"p":"be topped with sth","m":"to have something on the upper part","d":"To have something placed on the upper part or surface, especially food or buildings.","ex":["The cake was topped with fresh strawberries.","The tower is topped with a golden dome."],"key":"was topped with","syn":["be covered with","be crowned with","be garnished with"],"reg":"neutral","ielts":"yes","note":"Useful for food or building descriptions in speaking."},{"p":"toss sth away/into/on, etc.","m":"to throw something lightly or carelessly","d":"To throw something gently or carelessly in a direction, with a particle or preposition.","ex":["He tossed the keys onto the table.","She tossed the empty bottle into the bin."],"key":"tossed the keys onto","syn":["throw","flip","chuck"],"reg":"neutral","ielts":"careful","note":"Narrative; avoid in essays."},{"p":"toss and turn","m":"to move around in bed and not sleep well","d":"To move restlessly in bed, unable to sleep properly.","ex":["I tossed and turned all night before the interview.","Worry kept her tossing and turning until dawn."],"key":"tossed and turned","syn":["sleep badly","be restless","lie awake"],"reg":"neutral","ielts":"yes","note":"Natural for sleep and stress topics in speaking."},{"p":"not touch sb/sth","m":"to not eat, use or interfere with something","d":"To avoid eating, drinking, using or interfering with someone or something.","ex":["He won't touch seafood because of an allergy.","I haven't touched my savings since the crisis."],"key":"won't touch","syn":["avoid","leave alone","refuse to use"],"reg":"informal","ielts":"careful","note":"Useful in speaking about food habits or money."},{"p":"a touch","m":"a small amount, or slightly","d":"A very small amount of something, or used as an adverb meaning slightly.","ex":["The soup needs a touch more salt.","The room was a touch too warm for me."],"key":"a touch more salt","syn":["a little","a bit","a hint"],"reg":"informal","ielts":"careful","note":"Fine in speaking; use 'slightly' in essays."},{"p":"trail after/behind/along, etc.","m":"to follow slowly or lag behind","d":"To follow slowly behind someone or something, or to be behind in a race or contest.","ex":["The little boy trailed after his mother through the shops.","Our team trailed behind by ten points at half-time."],"key":"trailed after","syn":["follow","lag behind","straggle"],"reg":"neutral","ielts":"yes","note":"Can describe lagging performance in Task 1 comparisons."},{"p":"trudge along/through/up, etc.","m":"to walk slowly with heavy steps","d":"To walk slowly and wearily with heavy steps,
