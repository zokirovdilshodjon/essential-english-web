g; essays may prefer 'secure environment'."},{"p":"in the same way","m":"like the first thing; similarly","d":"Used to show that one thing is similar to another, often as a linker between ideas.","ex":["Children learn by imitation; in the same way, adults pick up habits from colleagues.","In the same way, rural areas need better public services."],"key":"in the same way","syn":["similarly","likewise","equally"],"reg":"neutral","ielts":"yes","note":"Useful linker to add a parallel point in Task 2."},{"p":"all/just the same","m":"despite that; nevertheless","d":"Used to say that something is true or happens in spite of what has just been said.","ex":["The plan seemed risky, but we went ahead all the same.","He was warned of the consequences, but he signed just the same."],"key":"all the same","syn":["nevertheless","even so","nonetheless"],"reg":"neutral","ielts":"careful","note":"Fine for contrast in Speaking; prefer 'nevertheless' in essays."},{"p":"be satisfied that","m":"be convinced that something is true","d":"To be certain, after considering evidence, that something is correct or acceptable; followed by a that-clause.","ex":["The inspectors were satisfied that safety rules had been followed.","The court must be satisfied that the evidence is reliable."],"key":"were satisfied that","syn":["be convinced that","be certain that","be persuaded that"],"reg":"formal","ielts":"yes","note":"Formal; useful in legal and policy contexts."},{"p":"conditions/needs/requirements, etc.","m":"pattern showing plural nouns for what is needed or the situation","d":"A placeholder for plural nouns such as working conditions, basic needs or entry requirements.","ex":["Working conditions in the factory improved after new regulations were introduced.","Entry requirements vary between universities."],"key":"Working conditions","syn":["circumstances","demands","criteria"],"reg":"neutral","ielts":"yes","note":"Common collocations; use precise nouns to sound academic."},{"p":"say sth to yourself","m":"think words quietly in your own mind","d":"To think or repeat something silently or very quietly, often to encourage oneself.","ex":["She said to herself that she would never make the same mistake.","I kept saying the words to myself before the presentation."],"key":"said to herself","syn":["think to yourself","mutter","tell yourself"],"reg":"neutral","ielts":"careful","note":"Good for Speaking anecdotes; rare in academic writing."},{"p":"I'll/we'll see","m":"I will decide later, after I know more","d":"Used to avoid giving a firm answer now, saying the decision will be made later.","ex":["Will you apply for the scholarship? I'll see after I get my results.","We'll see how the market reacts before we invest."],"key":"I'll see","syn":["let's wait and see","perhaps later","I'll think about it"],"reg":"informal","ielts":"no","note":"Spoken response; use for informal letters or Speaking only."},{"p":"you see","m":"used to explain something or make sure someone understands","d":"A spoken discourse marker used to introduce an explanation or draw the listener's attention to a point.","ex":["I prefer studying at night; you see, the house is quiet then.","You see, public transport here is not very reliable."],"key":"you see","syn":["as you know","the thing is","you understand"],"reg":"informal","ielts":"no","note":"Spoken filler; avoid in essays, limited use in Speaking."},{"p":"wait and see","m":"be patient and find out what happens","d":"To delay a decision or action until you know the outcome of events.","ex":["The government decided to wait and see before introducing new restrictions.","Investors are advised to wait and see how the economy develops."],"key":"wait and see","syn":["hold off","bide your time","watch developments"],"reg":"neutral","ielts":"careful","note":"Good for Speaking; 'adopt a wait-and-see approach' works in essays."},{"p":"a shade","m":"slightly; a little bit","d":"Used as an adverbial to mean a small degree, or a type of colour; informal when meaning 'slightly'.","ex":["The new model is a shade more expensive than the old one.","The sky turned a shade darker before the storm."],"key":"a shade more expensive","syn":["slightly","a touch","a little"],"reg":"informal","ielts":"careful","note":"Colloquial for small differences; 'slightly' is safer in Task 1."},{"p":"problems/thoughts/ideas, etc.","m":"pattern showing plural abstract nouns people have or share","d":"A placeholder for plural nouns like problems, thoughts or ideas used with verbs such as share, solve or discuss.","ex":["Students should share their ideas openly in class.","Scientists are working to solve environmental problems."],"key":"share their ideas","syn":["concerns","suggestions","issues"],"reg":"neutral","ielts":"yes","note":"Learn common collocations like 'tackle problems' and 'share ideas'."},{"p":"shed tears","m":"cry","d":"To cry, letting tears fall from the eyes; often used in literary or emotional contexts.","ex":["Many in the audience shed tears during the final scene.","She shed tears of joy when she heard the news."],"key":"shed tears","syn":["weep","cry","sob"],"reg":"formal","ielts":"careful","note":"Literary; use in Speaking stories or descriptive writing."},{"p":"sincere apologies/thanks, etc.","m":"honest and deep apology or thanks","d":"Used in formal letters to express genuine feelings of apology or gratitude.","ex":["Please accept our sincere apologies for the delay in delivery.","We would like to express our sincere thanks for your support."],"key":"sincere apologies","syn":["heartfelt thanks","genuine regrets","deepest apologies"],"reg":"formal","ielts":"yes","note":"Excellent for formal General Training letters of complaint or thanks."},{"p":"a skeleton crew/staff/service","m":"the smallest number of workers or services needed","d":"A minimal group of workers or a limited service that keeps something running.","ex":["Only a skeleton crew remained on the ship during the storm.","The railway is running a skeleton service over the holiday."],"key":"a skeleton crew","syn":["minimum staff","reduced staff","bare-bones team"],"reg":"neutral","ielts":"careful","note":"Useful in work topics; moderately idiomatic for essays."},{"p":"to do so","m":"in order to do that thing","d":"A formal substitute for repeating a verb phrase already mentioned, meaning to do that.","ex":["Citizens have a duty to vote, and governments should encourage them to do so.","Companies should reduce emissions and are legally required to do so."],"key":"to do so","syn":["to do this","to do that","to act accordingly"],"reg":"formal","ielts":"yes","note":"Avoids repetition in essays; common formal cohesive device."},{"p":"so as not to do sth","m":"in order to avoid doing something","d":"Used before a bare infinitive to state a purpose of avoiding something.","ex":["She spoke quietly so as not to wake the baby.","Drivers should slow down so as not to cause accidents."],"key":"so as not to wake","syn":["in order not to do sth","to avoid doing sth","lest"],"reg":"formal","ielts":"yes","note":"Neat purpose clause for Task 2 and formal letters."},{"p":"solid gold/silver/wood, etc.","m":"made completely of one material, not mixed or hollow","d":"Used to describe an object made entirely of a particular material throughout.","ex":["The museum displays a solid gold mask from the ancient tomb.","They bought a solid wood table that has lasted for decades."],"key":"solid gold","syn":["pure gold","entirely wooden","made wholly of sth"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful for describing objects in Speaking Part 2."},{"p":"with sth/sb","m":"pattern meaning accompanied by something or someone","d":"A prepositional phrase pattern indicating accompaniment, possession or means.","ex":["She travelled to the conference with her colleagues.","The report deals with the effects of climate change."],"key":"with her colleagues","syn":["together with sb","accompanied by sb","alongside sb"],"reg":"neutral","ielts":"yes","note":"Basic preposition; check collocations such as 'deal with'."},{"p":"no sooner ... than","m":"used to say one thing happened immediately after another","d":"A correlative structure meaning immediately after; with 'no sooner' at the start, the subject and auxiliary are inverted.","ex":["No sooner had the policy been announced than protests began.","We had no sooner arrived than it started to rain."],"key":"No sooner had the policy been announced than","syn":["as soon as","hardly ... when","immediately after"],"reg":"formal","ielts":"yes","note":"Impressive inversion for grammatical range; use carefully."},{"p":"to spare","m":"more than you need","d":"Used after a noun to mean remaining or extra after satisfying needs.","ex":["We arrived at the airport with an hour to spare.","Few people have much money to spare after paying rent."],"key":"with an hour to spare","syn":["extra","left over","surplus"],"reg":"neutral","ielts":"careful","note":"Fine for time and money in Speaking; less usual in essays."},{"p":"speak for/on behalf of sb","m":"say what someone thinks as their representative","d":"To give opinions or make statements officially for another person or group.","ex":["The union leader spoke on behalf of the striking workers.","I cannot speak for everyone, but I believe the changes are needed."],"key":"spoke on behalf of","syn":["represent sb","act as spokesperson for sb","be the voice of sb"],"reg":"formal","ielts":"yes","note":"Useful in formal letters: 'I am writing on behalf of...'."},{"p":"up to speed","m":"having the latest information or skills","d":"Fully informed about or competent in the latest situation or developments; often 'bring sb up to speed'.","ex":["New employees need a week to get up to speed with the software.","Let me bring you up to speed on the latest findings."],"key":"up to speed","syn":["well informed","up to date","in the loop"],"reg":"informal","ielts":"careful","note":"Common workplace idiom; good in Speaking, avoid in formal essays."},{"p":"squeeze through/past, etc.","m":"push your way through a narrow space","d":"To move through or past a tight space with difficulty; the particle shows direction.","ex":["She squeezed through the crowd to reach the front.","The cyclist squeezed past the parked van."],"key":"squeezed through the crowd","syn":["push through","edge past","force your way through"],"reg":"neutral","ielts":"careful","note":"Vivid description for Speaking; unnecessary in essays."},{"p":"step by step","m":"slowly, one stage at a time","d":"Gradually, in a sequence of small stages; also used as an adjective phrase before a noun.","ex":["The instructor explained the process step by step.","Change must be introduced step by step to avoid resistance."],"key":"step by step","syn":["gradually","one stage at a time","systematically"],"reg":"neutral","ielts":"yes","note":"Useful for describing processes in Task 1 and in Speaking."},{"p":"not think straight","m":"be unable to think clearly","d":"To be unable to reason calmly or clearly, usually because of tiredness, stress or strong emotion.","ex":["After two sleepless nights, I could not think straight.","He was so anxious that he could not think straight during the interview."],"key":"could not think straight","syn":["be unable to think clearly","be confused","be muddled"],"reg":"informal","ielts":"careful","note":"Spoken idiom about stress; fine in Speaking, rare in essays."},{"p":"stroll along/down/through, etc.","m":"walk slowly and in a relaxed way","d":"To walk in a leisurely manner along or through a place; the particle indicates direction.","ex":["Tourists strolled along the harbour in the evening.","We enjoy strolling through the park on Sundays."],"key":"strolled along the harbour","syn":["wander","amble","saunter"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for Speaking Part 2 about places and routines."},{"p":"subject to sth","m":"depending on or controlled by something","d":"Likely to be affected by, or depending on, a condition, rule or change; used after 'be'.","ex":["The plan is subject to approval by the board.","All prices are subject to change without notice."],"key":"subject to approval","syn":["dependent on sth","conditional on sth","liable to sth"],"reg":"formal","ielts":"yes","note":"Formal and precise; useful in letters and policy contexts."},{"p":"be suited to/for sth","m":"be right or appropriate for something","d":"To have the qualities needed for a particular purpose or person.","ex":["This climate is ideally suited for growing tea.","She is well suited to a career in teaching."],"key":"is ideally suited for growing tea","syn":["be appropriate for sth","be fit for sth","be right for sth"],"reg":"neutral","ielts":"yes","note":"Good for job, education and agriculture topics."},{"p":"a sure thing","m":"something certain to happen or succeed","d":"An event or outcome that is completely certain, or a person or thing certain to succeed.","ex":["Victory for the home team was a sure thing.","Investing in the stock market is never a sure thing."],"key":"a sure thing","syn":["a certainty","a safe bet","a foregone conclusion"],"reg":"informal","ielts":"careful","note":"Casual; use 'a certainty' in formal writing."},{"p":"be sure to do sth","m":"remember to do something; make certain you do it","d":"Used to tell someone to make certain they do something; followed by 'to' plus infinitive.","ex":["Be sure to proofread your essay before submitting it.","Be sure to include all the relevant details in your letter."],"key":"Be sure to proofread","syn":["make sure you do sth","don't forget to do sth","remember to do sth"],"reg":"neutral","ielts":"careful","note":"Fits advice in General Training letters; rare in essays."},{"p":"take your time","m":"do something slowly without hurrying","d":"To use as much time as needed without rushing; often used as polite reassurance.","ex":["Take your time when choosing a university course.","The examiner told me to take my time before answering."],"key":"Take your time","syn":["don't rush","there's no hurry","go at your own pace"],"reg":"informal","ielts":"no","note":"Conversational; useful in informal letters to friends."},{"p":"take sb's word for it","m":"believe what someone says without checking","d":"To accept that what someone says is true without asking for proof.","ex":["I haven't seen the data, so I will take your word for it.","You do not have to take my word for it; check the figures."],"key":"take your word for it","syn":["accept sb's claim","believe sb","trust sb"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; avoid in academic argument."},{"p":"talk business/politics, etc.","m":"discuss a particular subject","d":"To discuss a specific topic, especially seriously; the noun names the subject.","ex":["Colleagues often talk business over lunch.","My grandfather loves to talk politics with his neighbours."],"key":"talk business","syn":["discuss business","chat about politics","debate"],"reg":"neutral","ielts":"careful","note":"Handy for Speaking Part 1 on work and conversation habits."},{"p":"tear sth out of/off/down, etc.","m":"pull something forcefully away or apart","d":"To remove or destroy something by pulling it violently; the particle shows the direction.","ex":["Protesters tore down the old statue.","She tore a page out of her notebook."],"key":"tore down","syn":["rip off","pull down","demolish"],"reg":"neutral","ielts":"careful","note":"Physical action verb; good in Speaking stories, rare in essays."},{"p":"that's that","m":"the matter is finished and settled","d":"Said to show that a decision is final or a task is complete.","ex":["I have made my decision, and that's that.","The deadline has passed, and that's that."],"key":"that's that","syn":["that's the end of it","it's settled","and that is final"],"reg":"informal","ielts":"no","note":"Spoken and blunt; avoid in essays."},{"p":"that is (to say)","m":"in other words; meaning","d":"Used to introduce a clearer or more exact explanation of what has just been said.","ex":["The programme targets low-income families, that is to say, those earning below the national average.","The company will expand soon, that is, within the next two years."],"key":"that is to say","syn":["in other words","namely","i.e."],"reg":"formal","ielts":"yes","note":"Useful for clarifying points in Task 2."},{"p":"think of sb/sth as sth","m":"consider someone or something to be a type of thing","d":"To regard a person or thing in a particular way; followed by a noun phrase or adjective.","ex":["Many people think of volunteering as a way to gain experience.","Some economists think of education as an investment."],"key":"think of volunteering as","syn":["regard sth as sth","view sth as sth","consider sth to be sth"],"reg":"neutral","ielts":"yes","note":"Useful for presenting different viewpoints in Task 2."},{"p":"think twice","m":"consider carefully before deciding or acting","d":"To give serious thought to a decision, especially because of possible problems.","ex":["High fines make drivers think twice about using their phones.","You should think twice before quitting your job."],"key":"think twice","syn":["reconsider","hesitate","weigh up the risks"],"reg":"neutral","ielts":"careful","note":"Good idiom for deterrence arguments; keep use moderate."},{"p":"not think twice","m":"act at once without hesitating","d":"To do something immediately without worrying about it or considering risks.","ex":["She did not think twice about helping the injured stranger.","He did not think twice before accepting the job offer."],"key":"did not think twice","syn":["not hesitate","act without delay","not give it a second thought"],"reg":"neutral","ielts":"careful","note":"Good in Speaking anecdotes; informal feel in essays."},{"p":"throw sth in/on, etc.","m":"add or put something quickly into or onto something","d":"To add something, often casually or as a bonus; or to put on clothes quickly.","ex":["The shop threw in a free case when I bought the phone.","She threw on a coat and ran outside."],"key":"threw in a free case","syn":["add in","include as a bonus","put on quickly"],"reg":"informal","ielts":"no","note":"Casual; fine in Speaking, not in academic writing."},{"p":"about/high time","m":"the right or late moment for something to happen","d":"Used with a past tense verb to say that something should happen now or should have happened already.","ex":["It is high time governments took climate change seriously.","It is about time we replaced these outdated computers."],"key":"high time governments took","syn":["long overdue","the moment has come","it's time"],"reg":"neutral","ielts":"careful","note":"Strong opinion phrase for Task 2; follow it with the past tense."},{"p":"toss (a coin)","m":"throw a coin in the air to decide something","d":"To throw a coin into the air so that the way it lands decides a choice.","ex":["The referee tossed a coin to decide which team would start.","We tossed a coin to see who would pay the bill."],"key":"tossed a coin","syn":["flip a coin","draw lots","leave it to chance"],"reg":"neutral","ielts":"careful","note":"Fine for Speaking about decisions; rare in essays."},{"p":"sb's travels","m":"the journeys someone makes, especially far away","d":"Plural noun for a person's journeys, especially to foreign countries over a period.","ex":["During his travels in Asia, he learned three languages.","Her travels across Europe broadened her outlook."],"key":"his travels in Asia","syn":["journeys","trips","voyages"],"reg":"neutral","ielts":"yes","note":"Useful for Speaking Part 2 about trips and experiences."},{"p":"I trust (that)","m":"I believe and hope that something is true","d":"A polite, formal way to express confidence that something is the case; followed by a that-clause.","ex":["I trust that you will consider my application favourably.","I trust that the enclosed documents are satisfactory."],"key":"I trust that","syn":["I hope that","I am confident that","I assume that"],"reg":"formal","ielts":"yes","note":"Polite phrase for formal General Training letters."},{"p":"turn 16/21, etc.","m":"reach a particular age","d":"To become a particular age; used with a number in the subject's age.","ex":["Many people begin to vote as soon as they turn eighteen.","She will turn thirty next month."],"key":"turn eighteen","syn":["reach the age of","become","hit"],"reg":"neutral","ielts":"yes","note":"Useful for age limits in Task 2 on law and education."},{"p":"I/we understand (that)...","m":"I have heard or learnt that something is true","d":"A polite phrase used to introduce information you have been told, often in formal letters; followed by a that-clause.","ex":["We understand that the course fees will increase next year.","I understand that you are looking for a new supplier."],"key":"We understand that","syn":["I gather that","it is my understanding that","I have been told that"],"reg":"formal","ielts":"yes","note":"Polite opening in formal letters when checking facts."},{"p":"the unemployed","m":"people without a job","d":"People who do not have paid work, considered as a group; used with a plural verb.","ex":["The scheme offers free training to the unemployed.","Benefits for the unemployed have been cut in recent years."],"key":"the unemployed","syn":["jobseekers","people out of work","the jobless"],"reg":"neutral","ielts":"yes","note":"Common in economy topics; 'jobless people' is a variation."},{"p":"be unique to sb/sth","m":"exist only in one person, place or thing","d":"To be found only in a particular person, group or place and nowhere else.","ex":["Several of these plants are unique to the island.","This tradition is unique to the northern region."],"key":"are unique to","syn":["be exclusive to sth","be peculiar to sth","be specific to sth"],"reg":"formal","ielts":"yes","note":"Good for culture, tourism and biology topics."},{"p":"the unknown","m":"things that nobody knows or has experienced","d":"Things, places or situations that are unfamiliar or have not been discovered.","ex":["Many people fear the unknown when changing careers.","Space exploration pushes us into the unknown."],"key":"the unknown","syn":["the unfamiliar","uncharted territory","the unexplored"],"reg":"neutral","ielts":"yes","note":"Good for change and exploration topics in Task 2."},{"p":"urge sb to do sth","m":"strongly advise someone to do something","d":"To strongly encourage or persuade someone to take action; followed by an object and 'to' plus infinitive.","ex":["Health experts urge people to exercise at least three times a week.","The report urges governments to invest in renewable energy."],"key":"urge people to exercise","syn":["encourage sb to do sth","press sb to do sth","call on sb to do sth"],"reg":"formal","ielts":"yes","note":"Strong verb for recommendations in Task 2 conclusions."},{"p":"with a view to doing sth","m":"with the aim of doing something","d":"A formal phrase meaning for the purpose of; the 'to' is a preposition so it is followed by a gerund.","ex":["The company expanded abroad with a view to increasing its market share.","She visited several universities with a view to studying engineering."],"key":"with a view to increasing","syn":["in order to","with the aim of doing sth","with the intention of doing sth"],"reg":"formal","ielts":"yes","note":"Formal purpose phrase; remember to use a gerund afterwards."},{"p":"the vote","m":"the right to vote, or the total of votes","d":"The legal right to take part in elections, or the process or result of voting.","ex":["Women won the vote in many countries in the early twentieth century.","The vote will be held on Friday."],"key":"won the vote","syn":["suffrage","the ballot","the franchise"],"reg":"neutral","ielts":"yes","note":"Useful for politics and rights topics in Task 2."},{"p":"get/have your (own) way","m":"get what you want, even if others disagree","d":"To obtain what one wants despite other people's wishes or objections.","ex":["Spoiled children often cry until they get their own way.","The committee finally had its way and the plan was approved."],"key":"get their own way","syn":["have it your way","get what you want","prevail"],"reg":"neutral","ielts":"careful","note":"Useful for parenting and conflict topics; slightly critical tone."},{"p":"may/might as well do sth","m":"used when there is no good reason not to do something","d":"Used to suggest that one should do something because there is no better alternative; followed by a bare infinitive.","ex":["The shops are closed, so we may as well go home.","If the meeting is cancelled, I might as well work from home."],"key":"may as well go home","syn":["could just as well","no reason not to","just as well"],"reg":"informal","ielts":"no","note":"Conversational; use in Speaking, not in essays."},{"p":"can work sth; know how to work sth","m":"able to operate a machine or device","d":"To be able to operate or use a machine, device or system correctly.","ex":["Most children today can work a smartphone before they start school.","Employees need to know how to work the new software."],"key":"can work a smartphone","syn":["operate sth","handle sth","use sth","run sth"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; 'operate' is better in formal writing."},{"p":"wrongly accused/convicted/imprisoned, etc.","m":"punished or blamed when you did nothing wrong","d":"Describes someone blamed or punished unfairly for something they did not do; the adverb precedes a past participle.","ex":["Several wrongly convicted prisoners were released after new DNA evidence emerged.","He was wrongly accused of theft and lost his job."],"key":"wrongly convicted","syn":["unjustly accused","falsely accused","unfairly imprisoned"],"reg":"formal","ielts":"yes","note":"Good for justice and law topics in Task 2."}],"C2":[{"p":"Absolutely not.","m":"A very strong way to say no.","d":"An emphatic refusal or disagreement used in response to a question or suggestion.","ex":["When asked whether he would sign the deal, she replied, \"Absolutely not.\"","\"Absolutely not,\" the minister said when asked if taxes would rise."],"key":"Absolutely not.","syn":["Certainly not","Never","Under no circumstances"],"reg":"neutral","ielts":"no","note":"Spoken reply; avoid in essays. Fine in Speaking Part 3 for emphasis."},{"p":"of your own accord","m":"without being asked or forced","d":"Voluntarily, without being told or pressured by anyone else; used with a possessive adjective.","ex":["Several employees resigned of their own accord after the merger was announced.","The patient left the clinic of her own accord, against no medical order."],"key":"of their own accord","syn":["voluntarily","willingly","of your own free will"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 when discussing voluntary action versus legal compulsion."},{"p":"on no account; not on any account","m":"never, under any circumstances","d":"Used to state emphatically that something must never happen; often followed by inversion in formal writing.","ex":["On no account should children be left unsupervised near the water.","Not on any account will the committee reveal the identities of the donors."],"key":"On no account","syn":["under no circumstances","never","by no means"],"reg":"formal","ielts":"careful","note":"Formal; needs inversion (On no account should...). Use sparingly in essays."},{"p":"add insult to injury","m":"make a bad situation even worse","d":"To make a situation worse by doing something further that upsets or harms someone already treated badly.","ex":["The company dismissed hundreds of workers and, to add insult to injury, cancelled their pensions.","Added insult to injury, the airline lost her luggage after delaying the flight for six hours."],"key":"add insult to injury","syn":["make matters worse","rub salt into the wound","compound the problem"],"reg":"neutral","ielts":"careful","note":"Idiom; acceptable in Speaking, rarely in formal essays."},{"p":"adverse conditions/effect(s)/impact","m":"harmful or unfavourable conditions or results","d":"Describes negative, harmful or unfavourable circumstances or consequences; commonly collocates with effects, impact, weather and conditions.","ex":["Excessive screen time can have adverse effects on children's sleep and concentration.","Farmers struggled to harvest crops under adverse conditions last winter."],"key":"adverse effects","syn":["harmful effects","negative impact","detrimental consequences","unfavourable conditions"],"reg":"formal","ielts":"yes","note":"Excellent Task 2 collocation for problems; use instead of 'bad effects'."},{"p":"cannot afford","m":"do not have enough money or means for something","d":"To lack the money, time or resources to do or buy something; also used for risks that one must avoid.","ex":["Many young people cannot afford to buy a home in the capital.","Governments cannot afford to ignore the threat of climate change any longer."],"key":"cannot afford","syn":["be unable to pay for","lack the means","be unable to risk"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 for cost or risk arguments; works with 'to' + verb."},{"p":"then/there again","m":"on the other hand; considering another point","d":"Used to introduce a contrasting thought or consideration that weakens or qualifies what was just said.","ex":["The film may be too long; then again, it is a great story.","Prices have risen sharply, but there again, wages have also increased."],"key":"then again","syn":["on the other hand","but still","that said"],"reg":"informal","ielts":"no","note":"Conversational; use 'however' or 'on the other hand' in essays. Fine in Speaking."},{"p":"against sb's advice/wishes, etc.","m":"opposing what someone recommended or wanted","d":"Doing something that goes against what another person has recommended, wanted or instructed.","ex":["He invested his savings against his accountant's advice and lost most of them.","She moved abroad against her parents' wishes."],"key":"against his accountant's advice","syn":["contrary to sb's advice","in defiance of sb","despite sb's warnings"],"reg":"neutral","ielts":"careful","note":"Fine for narrative or Speaking; in essays prefer 'contrary to advice'."},{"p":"against all (the) odds","m":"despite very little chance of success","d":"Succeeding or happening although it seemed very unlikely because of great difficulties.","ex":["Against all the odds, the small school won the national science competition.","She recovered against all odds and returned to work within a year."],"key":"Against all the odds","syn":["in spite of everything","despite the odds","unexpectedly"],"reg":"neutral","ielts":"yes","note":"Good in Speaking and in Task 2 examples about overcoming difficulties."},{"p":"at the tender age of 8/17/25, etc.","m":"at a very young age","d":"Used to stress that someone was very young when they did something notable or difficult.","ex":["Mozart composed his first symphony at the tender age of eight.","She started running her family's business at the tender age of seventeen."],"key":"at the tender age of eight","syn":["at a very young age","when barely old enough","from an early age"],"reg":"neutral","ielts":"careful","note":"Good for Speaking anecdotes; in essays, may sound too literary."},{"p":"be aimed at doing sth","m":"be intended to achieve something","d":"To be designed or intended to achieve a particular result; followed by a gerund.","ex":["The new campaign is aimed at reducing plastic waste in coastal towns.","Several reforms were aimed at improving literacy among adults."],"key":"is aimed at reducing","syn":["be intended to","be designed to","seek to"],"reg":"formal","ielts":"yes","note":"Very useful in Task 2 and Task 1 to describe policy goals."},{"p":"raise the alarm","m":"warn people of danger","d":"To alert others that something dangerous or wrong is happening, so action can be taken.","ex":["A passing cyclist raised the alarm when he saw smoke coming from the building.","Scientists raised the alarm about declining bee populations decades ago."],"key":"raised the alarm","syn":["sound the alarm","give a warning","alert people"],"reg":"neutral","ielts":"yes","note":"Works well in Task 2 about warnings from experts or media."},{"p":"for all","m":"in spite of; considering","d":"Preposition meaning despite, often followed by a noun phrase to introduce a contrast.","ex":["For all its wealth, the city still has serious housing problems.","For all his experience, the manager made a basic error."],"key":"For all its wealth","syn":["despite","in spite of","notwithstanding"],"reg":"formal","ielts":"yes","note":"Concessive linker; try 'For all its flaws,...' in Task 2 to show contrast."},{"p":"all shapes and sizes","m":"of many different types","d":"Used to say that people or things come in a very wide variety of kinds.","ex":["Dogs of all shapes and sizes were competing at the show.","Companies of all shapes and sizes now offer remote work."],"key":"all shapes and sizes","syn":["of every kind","of all types","diverse"],"reg":"neutral","ielts":"careful","note":"Useful for variety in Speaking; in essays prefer 'diverse' or 'all kinds'."},{"p":"all the better/easier/more exciting, etc.","m":"even better, easier or more exciting because of something","d":"Used with a comparative adjective to show that something has increased because of a particular fact.","ex":["The course was all the more rewarding because students chose their own projects.","Learning is all the easier when lessons are linked to real life."],"key":"all the more rewarding","syn":["even more","so much more","that much better"],"reg":"neutral","ielts":"yes","note":"Natural comparative structure for Task 2 reasoning; follow with 'because/when'."},{"p":"all but","m":"almost; very nearly","d":"Used before an adjective, verb or noun to mean almost completely; also means everything except.","ex":["The town was all but deserted after the factory closed.","Traditional shops have all but disappeared from many high streets."],"key":"all but deserted","syn":["almost","practically","nearly"],"reg":"formal","ielts":"yes","note":"Good for describing near-complete change in Task 1 or Task 2."},{"p":"make allowances for sb/sth","m":"accept problems or limits when judging","d":"To take someone's situation or difficulties into account and be tolerant, or to plan for something possible.","ex":["Teachers should make allowances for students who are learning in a second language.","The schedule makes allowances for possible delays in delivery."],"key":"make allowances for","syn":["take into account","be lenient with","bear in mind"],"reg":"neutral","ielts":"yes","note":"Good in education and workplace essays about fairness and tolerance."},{"p":"along the lines of sth","m":"similar to something","d":"Of a similar type or following a similar general idea or pattern to something else.","ex":["The government is considering a scheme along the lines of the Swedish model.","She wrote an essay along the lines of what the teacher had suggested."],"key":"along the lines of","syn":["similar to","on the model of","in the style of"],"reg":"neutral","ielts":"yes","note":"Useful to propose solutions; slightly vague so give details."},{"p":"at one time or another","m":"on some occasion; sooner or later","d":"Used to say that something happens to most or all people at some point, though not at the same time.","ex":["Almost everyone has felt anxious about exams at one time or another.","Most visitors will use the metro at one time or another."],"key":"at one time or another","syn":["at some point","sooner or later","on occasion"],"reg":"neutral","ielts":"careful","note":"Good generalisation in Speaking; in essays prefer 'at some point'."},{"p":"in anticipation (of)","m":"expecting something to happen and preparing","d":"In expectation of an event, often with preparation made before it happens.","ex":["Shops hired extra staff in anticipation of the holiday rush.","Residents stockpiled food in anticipation of the storm."],"key":"in anticipation of","syn":["in expectation of","ahead of","in preparation for"],"reg":"formal","ielts":"yes","note":"Good formal alternative to 'because they expected' in Task 1 and 2."},{"p":"an appetite for something","m":"a strong desire for something","d":"A strong wish or enthusiasm for something, not just for food.","ex":["Young audiences show a huge appetite for short online videos.","The voters have little appetite for further reforms."],"key":"a huge appetite for","syn":["a hunger for","a taste for","enthusiasm for"],"reg":"neutral","ielts":"yes","note":"Use figuratively in Task 2 about demand, interest or public attitudes."},{"p":"round of applause","m":"a time when people clap together","d":"A single occasion when an audience claps to show approval, usually for a performer or speaker.","ex":["The speaker received a round of applause at the end of her presentation.","Let's give the volunteers a big round of applause."],"key":"a round of applause","syn":["ovation","clapping","standing ovation"],"reg":"neutral","ielts":"no","note":"Mainly spoken or descriptive; not useful in academic essays."},{"p":"apply yourself","m":"work very hard at something","d":"To concentrate and put great effort into a task, especially studying or working.","ex":["If you apply yourself, you will pass the exam comfortably.","He finally applied himself to his studies and his grades improved."],"key":"apply yourself","syn":["work hard","buckle down","dedicate yourself"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 on education and motivation; a reflexive verb."},{"p":"arm in arm","m":"with arms linked together","d":"Walking or standing with one's arm linked through another person's arm, showing closeness.","ex":["The elderly couple strolled arm in arm along the promenade.","The two friends left the hall arm in arm."],"key":"arm in arm","syn":["linked together","side by side","hand in hand"],"reg":"neutral","ielts":"no","note":"Descriptive; useful for Speaking stories but not for essays."},{"p":"answer/conclusion/decision, etc.","m":"a pattern showing 'etc.' after a list of related words","d":"Written pattern illustrating that 'etc.' follows a list of nouns to indicate more similar items.","ex":["You must reach a conclusion, decision, etc. before the meeting ends.","The report offers an answer, conclusion, decision, etc. for each section."],"key":"decision, etc.","syn":["and so on","and the like","and so forth"],"reg":"neutral","ielts":"no","note":"Not a real phrase; learn 'etc.' as a list-ending abbreviation."},{"p":"as opposed to","m":"in contrast with","d":"Used to contrast two different things, ideas or approaches, showing that one is chosen rather than the other.","ex":["Online learning offers flexibility as opposed to traditional classroom study.","She prefers working freelance as opposed to being employed full-time."],"key":"as opposed to","syn":["in contrast to","rather than","versus"],"reg":"formal","ielts":"yes","note":"Common contrast phrase for Task 2 and Task 1 comparisons."},{"p":"do sth as you see/think fit","m":"do something in the way you decide is best","d":"To act according to your own judgement without needing approval from others.","ex":["The manager allowed staff to organise their time as they saw fit.","Parents should be free to educate their children as they think fit."],"key":"as they saw fit","syn":["as you prefer","as you wish","as you judge best"],"reg":"formal","ielts":"careful","note":"Formal; useful in Task 2 on freedom of choice."},{"p":"as the/its name implies","m":"as the name suggests","d":"Used to say that the meaning of something can be understood from its name.","ex":["The Quiet Zone, as its name implies, is a space for silent study.","As the name implies, a heat pump moves heat from one place to another."],"key":"as its name implies","syn":["as the name suggests","as the title indicates","as the label says"],"reg":"neutral","ielts":"yes","note":"Good for introducing a definition in Task 2 or Task 1 description."},{"p":"as it stands","m":"in its present state","d":"In the current situation or form, without any change; often used to criticise a plan or text.","ex":["As it stands, the law protects large companies more than consumers.","The proposal, as it stands, is too expensive for most councils."],"key":"As it stands","syn":["in its present form","at present","currently"],"reg":"formal","ielts":"yes","note":"Useful in Task 2 to evaluate a current system before suggesting change."},{"p":"if you ask me","m":"in my opinion","d":"Used to introduce a personal opinion, often a critical one, in a conversational way.","ex":["If you ask me, public transport should be free in every large city.","The service is poor, if you ask me."],"key":"If you ask me","syn":["in my view","personally","in my opinion"],"reg":"informal","ielts":"no","note":"Spoken only; use 'In my opinion' in essays."},{"p":"ask yourself sth","m":"consider a question carefully","d":"To think about a question and try to answer it honestly yourself.","ex":["Before buying anything, ask yourself whether you really need it.","Voters should ask themselves who will benefit from these policies."],"key":"ask yourself whether","syn":["consider","reflect on","wonder"],"reg":"neutral","ielts":"careful","note":"Rhetorical device in Task 2 introductions; do not overuse."},{"p":"fast asleep","m":"sleeping deeply","d":"Completely asleep and not easy to wake; fast is used as an adverb here.","ex":["The toddler was fast asleep by the time we arrived.","Everyone in the house was fast asleep when the storm hit."],"key":"fast asleep","syn":["sound asleep","deeply asleep","out cold"],"reg":"neutral","ielts":"no","note":"Descriptive; fine in Speaking Part 2 stories but not for essays."},{"p":"aspire to sth; aspire to do sth","m":"have a strong wish to achieve something","d":"To have a strong desire or ambition to reach a high goal; followed by 'to' + noun or verb.","ex":["Many graduates aspire to become entrepreneurs rather than employees.","She aspired to a career in international law."],"key":"aspire to become","syn":["aim to","long to","set your sights on"],"reg":"formal","ielts":"yes","note":"Use in Task 2 on careers and ambition; 'aspire to' not 'aspire for'."},{"p":"an aspiring actor/politician/write etc.","m":"someone who hopes to become an actor, politician, etc.","d":"Describes a person who is working towards a career or role they want to achieve in the future.","ex":["As an aspiring politician, he volunteered for several local campaigns.","The workshop is aimed at aspiring writers who want advice from publishers."],"key":"an aspiring politician","syn":["would-be","budding","up-and-coming"],"reg":"neutral","ielts":"yes","note":"Adjective before a noun; good for Task 1 or career topics."},{"p":"assert yourself","m":"express your opinions confidently","d":"To behave in a confident, forceful way so that others pay attention to your views or rights.","ex":["Shy employees often find it hard to assert themselves in meetings.","She learned to assert herself without being aggressive."],"key":"assert themselves","syn":["stand up for yourself","be assertive","speak up"],"reg":"neutral","ielts":"yes","note":"Reflexive verb; good for communication or workplace topics."},{"p":"assert your authority/control/independence, etc.","m":"show clearly that you have power or freedom","d":"To make others recognise your power, control or independence by acting firmly.","ex":["The new head teacher quickly asserted her authority over the department.","Teenagers often try to assert their independence from their parents."],"key":"asserted her authority","syn":["exercise control","establish authority","make a stand"],"reg":"formal","ielts":"yes","note":"Collocation for Task 2 on leadership, family and politics."},{"p":"assume control/power/responsibility, etc.","m":"take charge of something","d":"To begin to have control, power or responsibility, often formally or officially.","ex":["The vice-president assumed control after the chairman resigned.","Parents must assume responsibility for their children's online safety."],"key":"assumed control","syn":["take over","take on","take charge"],"reg":"formal","ielts":"yes","note":"Strong formal collocation for Task 2 on duty and leadership."},{"p":"at best","m":"in the most favourable view","d":"Used to say that even the most positive description is not very good.","ex":["The results were, at best, inconclusive.","At best, the policy will reduce waiting times by a few minutes."],"key":"at best","syn":["at the very most","if everything goes well","at most"],"reg":"formal","ielts":"yes","note":"Good in Task 2 to criticise limited benefits of a policy."},{"p":"at the best of times","m":"even in good conditions","d":"Even when conditions are favourable; used to say that something is difficult or unpleasant.","ex":["Driving in the city is stressful at the best of times.","Public speaking is difficult at the best of times."],"key":"at the best of times","syn":["under normal circumstances","even in ideal conditions","even at the best"],"reg":"neutral","ielts":"careful","note":"Idiomatic; fine in Speaking, less suited to formal essays."},{"p":"at a disadvantage","m":"in a worse position than others","d":"In a less favourable situation compared with other people or groups.","ex":["Students without internet access are at a disadvantage in online courses.","Small firms are often at a disadvantage when competing with multinationals."],"key":"at a disadvantage","syn":["disadvantaged","in a weaker position","handicapped"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 on inequality, education and business."},{"p":"at the latest","m":"no later than","d":"Used after a time to say that something must happen by then or earlier.","ex":["Please submit your application by Friday at the latest.","Applicants will be notified by June at the latest."],"key":"at the latest","syn":["no later than","by","not after"],"reg":"neutral","ielts":"yes","note":"Fine for deadlines in General Training letters and formal emails."},{"p":"at length","m":"for a long time; in detail","d":"Describes doing something in great detail or for a long time.","ex":["The committee discussed the proposal at length before voting.","She wrote at length about the problems facing rural schools."],"key":"at length","syn":["in detail","extensively","for a long time"],"reg":"formal","ielts":"yes","note":"Formal adverbial; good for describing discussion or analysis."},{"p":"be at liberty to do sth","m":"be allowed to do something","d":"To be free or permitted to do something without restriction.","ex":["Citizens are at liberty to criticise the government in a democracy.","You are at liberty to leave whenever you wish."],"key":"are at liberty to criticise","syn":["be free to","be permitted to","be entitled to"],"reg":"formal","ielts":"yes","note":"Formal; good for rights and freedoms in Task 2."},{"p":"at a loss","m":"not knowing what to do or say","d":"Feeling confused or uncertain and not knowing how to act or respond.","ex":["The teachers were at a loss to explain the sudden drop in results.","I was at a loss when the machine suddenly stopped working."],"key":"at a loss","syn":["puzzled","baffled","uncertain"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking; 'at a loss to explain' works in formal writing."},{"p":"at a loss for words","m":"unable to say anything","d":"So surprised or emotional that you cannot find the right words to speak.","ex":["The winner was at a loss for words when her name was announced.","I was at a loss for words after hearing the news."],"key":"at a loss for words","syn":["speechless","lost for words","tongue-tied"],"reg":"neutral","ielts":"no","note":"Spoken or narrative; avoid in academic essays."},{"p":"be at the mercy of sb/sth","m":"be completely controlled by something powerful","d":"To be in a situation where someone or something powerful can do what they want to you.","ex":["Farmers are at the mercy of the weather.","Small businesses can be at the mercy of large suppliers."],"key":"at the mercy of","syn":["be helpless before","be subject to","be vulnerable to"],"reg":"neutral","ielts":"yes","note":"Vivid idiom that suits Task 2 on dependence and vulnerability."},{"p":"at the earliest","m":"not before a certain time","d":"Used after a time or date to say that something cannot happen before then.","ex":["The new bridge will open in 2030 at the earliest.","The results will be available next Tuesday at the earliest."],"key":"at the earliest","syn":["not before","no sooner than","at the soonest"],"reg":"neutral","ielts":"yes","note":"Pairs with 'at the latest'; useful for predictions and timelines."},{"p":"at sb's expense","m":"with sb paying or suffering","d":"Paid for by someone, or gaining advantage while someone else loses or is harmed.","ex":["The company expanded its profits at the expense of its workers.","He made jokes at her expense during the meeting."],"key":"at the expense of","syn":["to sb's cost","to sb's detriment","at sb's cost"],"reg":"neutral","ielts":"yes","note":"Good Task 2 phrase for trade-offs such as economy versus environment."},{"p":"at the hands of sb","m":"suffered because of what someone did","d":"Used to say that someone suffers or is harmed because of the action of another person or group.","ex":["Thousands of civilians suffered at the hands of the regime.","The team lost its title at the hands of its local rivals."],"key":"at the hands of","syn":["through the actions of","by","because of"],"reg":"formal","ielts":"yes","note":"Formal; used for harm or defeat, not for neutral actions."},{"p":"at heart","m":"basically; in your real nature","d":"Used to say what someone is really like despite how they seem or behave.","ex":["He is a shy person at heart, despite his confident manner.","Despite their differences, they are engineers at heart."],"key":"at heart","syn":["basically","fundamentally","deep down"],"reg":"neutral","ielts":"careful","note":"Better in Speaking; use 'fundamentally' in formal essays."},{"p":"at issue","m":"being discussed or disputed","d":"Used for the main point being argued about or considered.","ex":["What is at issue is whether schools should ban mobile phones.","The question at issue is how the funds are to be spent."],"key":"at issue","syn":["under discussion","in question","in dispute"],"reg":"formal","ielts":"yes","note":"Good formal phrase for introducing the central debate in Task 2."},{"p":"be at a premium","m":"be scarce and therefore valuable","d":"To be in short supply and therefore hard to get or very expensive.","ex":["Affordable housing is at a premium in most large cities.","Time is at a premium for working parents."],"key":"is at a premium","syn":["be in short supply","be scarce","be hard to come by"],"reg":"formal","ielts":"yes","note":"Useful for scarcity in housing, time, skills or resources."},{"p":"at this rate","m":"if things continue like this","d":"Used to say what will happen if the present speed or pattern continues.","ex":["At this rate, the glacier will disappear within fifty years.","We'll never finish at this rate."],"key":"At this rate","syn":["at this pace","if this continues","if present trends continue"],"reg":"neutral","ielts":"careful","note":"Fine for predictions; in Task 1 prefer 'if the trend continues'."},{"p":"at any rate","m":"anyway; in any case","d":"Used to show that something is true whatever else happens or to correct what was just said.","ex":["The plan may be costly; at any rate, it deserves a trial.","At any rate, the results were better than expected."],"key":"at any rate","syn":["in any case","anyway","at least"],"reg":"neutral","ielts":"careful","note":"Rather spoken; use 'in any case' or 'nevertheless' in essays."},{"p":"at your own risk","m":"accepting responsibility for any harm","d":"Doing something while accepting that you alone are responsible if it goes wrong.","ex":["Swimming here is at your own risk because there are no lifeguards.","Visitors enter the cave at their own risk."],"key":"at your own risk","syn":["at your peril","on your own responsibility","without any guarantee"],"reg":"neutral","ielts":"careful","note":"Common on signs; in essays use for personal responsibility."},{"p":"be at stake","m":"be in danger of being lost","d":"To be at risk or depend on the result of something important.","ex":["The jobs of thousands of workers are at stake.","Our planet's future is at stake if we do nothing."],"key":"are at stake","syn":["be at risk","be in jeopardy","be on the line"],"reg":"neutral","ielts":"yes","note":"Excellent for Task 2 conclusions on risk and importance."},{"p":"attach importance/value, etc. to sb/sth","m":"consider something important","d":"To believe that something has importance, value or meaning.","ex":["Many employers attach great importance to teamwork skills.","Some cultures attach little value to material wealth."],"key":"attach great importance to","syn":["place importance on","regard as important","value"],"reg":"formal","ielts":"yes","note":"Strong collocation for Task 2; often with 'great' or 'little'."},{"p":"in attendance","m":"present at an event","d":"Present at a ceremony, meeting or event, often used after a noun.","ex":["Doctors were in attendance throughout the marathon.","Over two hundred guests were in attendance at the ceremony."],"key":"in attendance","syn":["present","on hand","attending"],"reg":"formal","ielts":"careful","note":"Formal; useful in General Training reports and letters about events."},{"p":"be the centre of attention","m":"be the person everyone notices","d":"To be the person or thing that everyone is looking at or talking about.","ex":["The young singer was the centre of attention at the party.","Some children love to be the centre of attention."],"key":"the centre of attention","syn":["be in the spotlight","attract all eyes","be the focus"],"reg":"neutral","ielts":"careful","note":"Good in Speaking; use 'the focus of attention' in formal essays."},{"p":"an authority on sth","m":"an expert in a subject","d":"A person with great knowledge or expert status in a particular subject.","ex":["She is a leading authority on marine biology.","He became an authority on ancient trade routes."],"key":"authority on","syn":["an expert on","a specialist in","a leading figure in"],"reg":"formal","ielts":"yes","note":"Useful in Task 2 when referring to experts' views."},{"p":"be wide awake","m":"be fully awake","d":"To be completely awake and alert, not sleepy at all.","ex":["The children were wide awake at midnight.","I was wide awake after drinking strong coffee."],"key":"wide awake","syn":["be alert","be fully awake","not be sleepy"],"reg":"neutral","ielts":"no","note":"Everyday phrase; suits Speaking on sleep or routines."},{"p":"be in awe of sb","m":"admire someone greatly and feel a little afraid","d":"To feel great respect, admiration and sometimes fear towards someone or something impressive.","ex":["Students are in awe of the professor's knowledge.","Visitors are in awe of the mountain scenery."],"key":"in awe of","syn":["admire greatly","revere","be amazed by"],"reg":"neutral","ielts":"careful","note":"Better in Speaking; formal alternative 'hold in high esteem'."},{"p":"back and forth","m":"moving in one direction then the other","d":"Moving repeatedly in one direction and then the opposite; also exchanged between two parties.","ex":["The pendulum swung back and forth for hours.","Negotiators went back and forth over the contract."],"key":"back and forth","syn":["to and fro","backwards and forwards","repeatedly"],"reg":"neutral","ielts":"careful","note":"Fine in Task 1 process descriptions; otherwise mostly spoken."},{"p":"back to front","m":"with the back where the front should be","d":"Arranged the wrong way round, so the back is at the front.","ex":["He put his jumper on back to front.","The instructions were printed back to front."],"key":"back to front","syn":["the wrong way round","reversed","inside out"],"reg":"informal","ielts":"no","note":"Spoken British idiom; avoid in formal writing."},{"p":"behind sb's back","m":"without the person knowing","d":"Doing something about someone secretly, usually something unfair or critical.","ex":["Employees complained about the manager behind his back.","They organised the surprise party behind her back."],"key":"behind his back","syn":["secretly","covertly","without their knowledge"],"reg":"neutral","ielts":"careful","note":"Idiom; mostly negative; avoid in formal essays."},{"p":"turn your back on sb/sth","m":"abandon or reject someone or something","d":"To reject, abandon or refuse to help someone or something.","ex":["The government should not turn its back on refugees.","He turned his back on the family business."],"key":"turn its back on","syn":["abandon","reject","desert"],"reg":"neutral","ielts":"yes","note":"Vivid idiom for Task 2 on responsibility and social issues."},{"p":"in the background","m":"not at the centre of attention","d":"In a less noticeable position, or related to a person's earlier circumstances or experience.","ex":["Music played quietly in the background during the meeting.","She prefers to remain in the background at events."],"key":"in the background","syn":["out of sight","behind the scenes","unobtrusively"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking Part 2 descriptions; clear in photo-based answers."},{"p":"be/hang in the balance","m":"be uncertain or at risk","d":"To be in an uncertain situation in which the result could be either good or bad.","ex":["The future of the factory hangs in the balance.","Thousands of jobs are in the balance."],"key":"hangs in the balance","syn":["be at stake","be uncertain","be on a knife-edge"],"reg":"neutral","ielts":"yes","note":"Useful for Task 2 on uncertain outcomes and risk."},{"p":"into the bargain","m":"in addition; as an extra","d":"Used to add a further fact, often an unexpected extra advantage or disadvantage.","ex":["The hotel was cheap and, into the bargain, close to the beach.","He lost his wallet and missed his flight into the bargain."],"key":"into the bargain","syn":["in addition","as well","on top of that"],"reg":"neutral","ielts":"careful","note":"British and slightly old-fashioned; use 'in addition' in essays."},{"p":"keep/hold sth at bay","m":"stop something harmful from coming close","d":"To prevent something unpleasant or dangerous from approaching or having an effect.","ex":["Regular exercise can help keep illness at bay.","The sea wall held the floods at bay."],"key":"keep illness at bay","syn":["fend off","ward off","keep in check"],"reg":"neutral","ielts":"yes","note":"Useful for health and environment topics in Task 2."},{"p":"bear a/no resemblance/relation, etc. to sb/sth","m":"look like or be connected to something","d":"Used to say whether two things are similar or connected; usually negative in meaning.","ex":["The final product bears no resemblance to the original design.","His claims bear little relation to the facts."],"key":"bears no resemblance to","syn":["resemble","be similar to","be unrelated to"],"reg":"formal","ielts":"yes","note":"Neat way to contrast things in Task 1 or Task 2."},{"p":"bear a grudge","m":"keep feeling angry about something in the past","d":"To continue to feel resentment towards someone because of something they did earlier.","ex":["She still bears a grudge against her former employer.","He bears no grudge against the referee."],"key":"bears a grudge","syn":["hold a grudge","harbour resentment","resent"],"reg":"neutral","ielts":"careful","note":"Good in Speaking about relationships; avoid in formal essays."},{"p":"bear fruit","m":"give good results","d":"To produce successful results after time and effort has been spent.","ex":["The long negotiations finally bore fruit.","Her efforts to learn Spanish began to bear fruit."],"key":"bore fruit","syn":["succeed","pay off","produce results"],"reg":"neutral","ielts":"yes","note":"Good Task 2 idiom for the success of plans or policies."},{"p":"grin and bear it","m":"accept something unpleasant without complaint","d":"To suffer a bad situation patiently without showing that you are upset.","ex":["There was nothing to do but grin and bear it.","We must grin and bear it until the roadworks finish."],"key":"grin and bear it","syn":["put up with it","endure it","take it on the chin"],"reg":"informal","ielts":"no","note":"Informal; keep for Speaking."},{"p":"you can't beat sth","m":"nothing is better than something","d":"Used to say that something is better than any alternative.","ex":["You can't beat a hot cup of tea on a cold day.","You can't beat fresh bread for breakfast."],"key":"You can't beat","syn":["nothing beats","there is nothing better than","nothing compares to"],"reg":"informal","ielts":"no","note":"Informal; for Speaking or letters to friends."},{"p":"the beauty of sth","m":"the attractive or best feature of something","d":"The most pleasing or valuable quality of something, often something simple.","ex":["The beauty of online courses is that you can study anywhere.","The beauty of the system is its simplicity."],"key":"The beauty of","syn":["the advantage of","the great thing about","the appeal of"],"reg":"neutral","ielts":"careful","note":"Use in Speaking; 'The advantage of' is safer in essays."},{"p":"what/whatever became of sb/sth","m":"what happened to someone or something","d":"Used to ask or wonder what has happened to someone or something over time.","ex":["Whatever became of the old cinema on the corner?","I wonder what became of my classmates from primary school."],"key":"Whatever became of","syn":["what happened to","where is","whatever happened to"],"reg":"neutral","ielts":"no","note":"Spoken or narrative; useful in Speaking Part 2."},{"p":"long before","m":"a long time earlier than","d":"Used before a time, event or clause to show something happened much earlier.","ex":["Long before the internet, people communicated by letter.","The village was empty long before the dam was built."],"key":"Long before","syn":["well before","many years before","ages before"],"reg":"neutral","ielts":"yes","note":"Good for historical comparison in Task 2."},{"p":"come into being","m":"start to exist","d":"To begin to exist or be created.","ex":["The organisation came into being after the war.","Many new industries have come into being thanks to technology."],"key":"came into being","syn":["come into existence","emerge","be established"],"reg":"formal","ielts":"yes","note":"Useful for describing origins in Task 1 process or Task 2."},{"p":"beyond belief","m":"too extreme to believe","d":"So great, bad or surprising that it is very hard to believe.","ex":["The level of poverty in some areas is shocking beyond belief.","Her patience was beyond belief."],"key":"beyond belief","syn":["unbelievable","incredible","astonishing"],"reg":"neutral","ielts":"careful","note":"Strong; only in Speaking or opinion essays, sparingly."},{"p":"beneath your dignity","m":"too low or humiliating for you","d":"Something considered unsuitable for someone's status or self-respect.","ex":["He felt that cleaning the office was beneath his dignity.","Begging was beneath her dignity."],"key":"beneath his dignity","syn":["demeaning","unworthy of you","below you"],"reg":"formal","ielts":"careful","note":"Slightly old-fashioned; rare in essays."},{"p":"give sb the benefit of the doubt","m":"trust someone when unsure","d":"To accept that someone is telling the truth or acting correctly because there is no proof otherwise.","ex":["The teacher gave the student the benefit of the doubt.","Judges must give defendants the benefit of the doubt."],"key":"the benefit of the doubt","syn":["trust","assume innocence","accept"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 on justice, relationships or trust."},{"p":"be beside yourself (with sth)","m":"be extremely emotional","d":"To be so upset, angry or excited that you can hardly control yourself.","ex":["She was beside herself with worry.","The fans were beside themselves with excitement."],"key":"beside herself","syn":["be overwhelmed","be out of your mind","be frantic"],"reg":"neutral","ielts":"no","note":"Emotional idiom for Speaking; avoid in essays."},{"p":"beside the point","m":"not relevant","d":"Not connected with the main matter being discussed.","ex":["Whether the policy is popular is beside the point.","His age is beside the point; his skills matter."],"key":"beside the point","syn":["irrelevant","not relevant","off the subject"],"reg":"neutral","ielts":"yes","note":"Useful to dismiss weak arguments in Task 2."},{"p":"know best","m":"understand what is best","d":"To have better knowledge or judgement about what should be done.","ex":["Parents often think they know best.","Local people know best how to protect their environment."],"key":"know best","syn":["know better","be the expert","have better judgement"],"reg":"neutral","ielts":"yes","note":"Good for debates on authority and choice in Task 2."},{"p":"for the best","m":"good in the end","d":"Something that will have a good result even if it is unpleasant now.","ex":["The separation was painful but for the best.","It was sad to move, but probably for the best."],"key":"for the best","syn":["beneficial","advisable","a good thing"],"reg":"neutral","ielts":"careful","note":"Better for Speaking; in essays state the reason clearly."},{"p":"bring out the best in sb","m":"help someone show their best qualities","d":"To help someone show their finest qualities or perform to their highest level.","ex":["A good coach brings out the best in every player.","Challenging tasks can bring out the best in employees."],"key":"brings out the best in","syn":["inspire","get the most from","encourage"],"reg":"neutral","ielts":"yes","note":"Good for education and sport topics in Task 2."},{"p":"your best bet","m":"the best choice","d":"The option most likely to succeed or be most sensible.","ex":["Your best bet is to book early.","Public transport is your best bet in the city."],"key":"best bet","syn":["your best option","the wisest choice","the safest choice"],"reg":"informal","ielts":"no","note":"Informal; use in Speaking or letters."},{"p":"a safe bet","m":"something very likely to happen","d":"Something that is almost certain to happen or succeed.","ex":["It's a safe bet that prices will rise.","Choosing a reliable brand is a safe bet."],"key":"a safe bet","syn":["a certainty","a sure thing","a good choice"],"reg":"informal","ielts":"careful","note":"Informal; prefer 'it is likely that' in essays."},{"p":"know better","m":"be wise enough not to do something","d":"To have enough sense or experience not to do something foolish.","ex":["You should know better than to lie to your teacher.","He should have known better."],"key":"know better","syn":["be more sensible","have more sense","be wise enough"],"reg":"neutral","ielts":"careful","note":"Often 'know better than to'; mostly spoken."},{"p":"beyond dispute","m":"certain and not open to argument","d":"Too clear to be argued about or doubted.","ex":["The importance of sleep is beyond dispute.","It is beyond dispute that exercise improves health."],"key":"beyond dispute","syn":["undeniable","indisputable","beyond question"],"reg":"formal","ielts":"yes","note":"Strong claim for Task 2; use only for clearly established facts."},{"p":"in a big way","m":"to a great extent","d":"In a very large or enthusiastic way.","ex":["Streaming has changed the music industry in a big way.","The town embraced tourism in a big way."],"key":"in a big way","syn":["on a large scale","greatly","significantly"],"reg":"informal","ielts":"careful","note":"Informal; use 'significantly' in formal essays."},{"p":"bits and pieces","m":"small different items","d":"Various small objects or tasks of different kinds.","ex":["He packed his bits and pieces into a bag.","I still have some bits and pieces to finish."],"key":"bits and pieces","syn":["odds and ends","bits and bobs","miscellaneous items"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"a bite (to eat)","m":"a small meal or snack","d":"A small amount of food or a quick meal.","ex":["Let's grab a bite to eat before the film.","I need a bite to eat before the meeting."],"key":"a bite to eat","syn":["a snack","a quick meal","something to eat"],"reg":"informal","ielts":"no","note":"Spoken; fine in Speaking and informal letters."},{"p":"etc.","m":"and other similar things","d":"Abbreviation of et cetera; used at the end of a list to show more items could be added.","ex":["The shop sells bread, milk, cheese, etc.","Students study maths, science, languages, etc."],"key":"etc.","syn":["and so on","and so forth","and the like"],"reg":"neutral","ielts":"careful","note":"Acceptable in writing but better to give full examples; avoid in Speaking."},{"p":"be blind to sth","m":"fail to notice something","d":"To fail or refuse to see a fault, truth or problem.","ex":["Many leaders are blind to the risks of rapid growth.","She was blind to his flaws."],"key":"blind to","syn":["be unaware of","ignore","overlook"],"reg":"neutral","ielts":"yes","note":"Useful figurative phrase in Task 2 on attitudes and awareness."},{"p":"blow it/your chance(s)","m":"waste an opportunity","d":"To lose a chance by making a mistake.","ex":["He blew his chance by arriving late for the interview.","Don't blow it now."],"key":"blew his chance","syn":["waste an opportunity","miss out","throw away"],"reg":"informal","ielts":"no","note":"Informal; avoid in essays."},{"p":"body and soul","m":"completely","d":"With all your energy and commitment.","ex":["She threw herself into the project body and soul.","He devoted himself to the cause, body and soul."],"key":"body and soul","syn":["wholeheartedly","completely","fully"],"reg":"neutral","ielts":"careful","note":"Literary; fine in Speaking Part 2."},{"p":"stamps/tickets, etc.","m":"a pattern for things like stamps and tickets","d":"Pattern showing that a list of similar items is followed by etc.","ex":["The drawer was full of stamps, tickets, etc.","She collects stamps, tickets, etc."],"key":"stamps, tickets, etc.","syn":["and so on","and the like","and similar items"],"reg":"neutral","ielts":"no","note":"Not a real phrase; learn the 'etc.' pattern."},{"p":"be born","m":"start life","d":"To come into the world at birth.","ex":["She was born in a small village in 1990.","Many children are born into poverty."],"key":"was born","syn":["come into the world","enter the world","be delivered"],"reg":"neutral","ielts":"yes","note":"Always passive; used in biography and Task 1 timeline."},{"p":"from top to bottom","m":"completely","d":"From the highest point to the lowest, or thoroughly.","ex":["The house was cleaned from top to bottom.","They searched the building from top to bottom."],"key":"from top to bottom","syn":["thoroughly","completely","from head to toe"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking; reasonably neutral."},{"p":"bound up with sth","m":"closely connected with something","d":"Closely linked or involved with something else.","ex":["Her happiness is bound up with her family.","The country's economy is bound up with oil."],"key":"bound up with","syn":["linked to","tied to","connected with"],"reg":"formal","ielts":"yes","note":"Useful in Task 2 to show links between issues."},{"p":"the length and breadth of sth","m":"everywhere in a place","d":"Throughout all parts of a country or region.","ex":["They travelled the length and breadth of the country.","The news spread the length and breadth of Europe."],"key":"the length and breadth of","syn":["all over","throughout","everywhere in"],"reg":"neutral","ielts":"careful","note":"Good in Speaking; fine in some essay contexts."},{"p":"break the news to sb","m":"tell someone important news","d":"To tell someone news that may upset them.","ex":["He broke the news to his family gently.","The doctor broke the news to the patient."],"key":"broke the news to","syn":["tell","inform","announce to"],"reg":"neutral","ielts":"no","note":"Speaking only; narrative."},{"p":"break free","m":"escape","d":"To escape from something or someone holding you.","ex":["The prisoner tried to break free.","Some people struggle to break free from poverty."],"key":"break free","syn":["escape","get away","liberate yourself"],"reg":"neutral","ielts":"yes","note":"Can be used figuratively in Task 2."},{"p":"under your breath","m":"in a very quiet voice","d":"Speaking softly so others do not hear.","ex":["He muttered an insult under his breath.","She complained under her breath."],"key":"under his breath","syn":["quietly","in a whisper","softly"],"reg":"neutral","ielts":"no","note":"Narrative; speaking only."},{"p":"breed contempt/ignorance, etc.","m":"produce negative feelings","d":"To cause negative attitudes or situations to develop.","ex":["Familiarity can breed contempt.","Poor education may breed ignorance."],"key":"breed contempt","syn":["cause","produce","give rise to"],"reg":"formal","ielts":"yes","note":"Good for cause-and-effect in Task 2."},{"p":"bring sth to light","m":"reveal something","d":"To make something known or visible.","ex":["The investigation brought several errors to light.","Research has brought the issue to light."],"key":"brought several errors to light","syn":["reveal","uncover","expose"],"reg":"formal","ielts":"yes","note":"Useful in Task 2 for research and media."},{"p":"be on the brink of sth","m":"be very close to something","d":"About to do or experience something significant.","ex":["The company is on the brink of collapse.","They are on the brink of a breakthrough."],"key":"on the brink of","syn":["be on the verge of","be close to","be about to"],"reg":"formal","ielts":"yes","note":"Good in Task 2 predictions and warnings."},{"p":"a broken home","m":"a family where parents are separated","d":"A family where parents have divorced or separated.","ex":["Children from a broken home may struggle at school.","He grew up in a broken home."],"key":"a broken home","syn":["a single-parent family","a divided family","a family breakdown"],"reg":"neutral","ielts":"careful","note":"Somewhat old-fashioned; consider 'a single-parent household'."},{"p":"a bundle of energy/nerves","m":"a very energetic or nervous person","d":"A person full of energy or very nervous.","ex":["The child is a bundle of energy.","She was a bundle of nerves before the exam."],"key":"a bundle of energy","syn":["very energetic","highly strung","full of life"],"reg":"informal","ielts":"no","note":"Informal; for Speaking."},{"p":"burst into flames","m":"suddenly catch fire","d":"To suddenly begin to burn.","ex":["The car burst into flames after the crash.","The warehouse burst into flames."],"key":"burst into flames","syn":["catch fire","ignite","go up in flames"],"reg":"neutral","ielts":"careful","note":"Descriptive; Task 1 maps or event reports."},{"p":"bury yourself in sth","m":"become fully absorbed in something","d":"To spend all your attention on an activity.","ex":["He buried himself in his studies.","She buried herself in her work after the loss."],"key":"buried himself in","syn":["immerse yourself in","absorb yourself in","throw yourself into"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking about hobbies or study."},{"p":"bury your face/head in sth","m":"hide your face in something","d":"To press your face into something, often from shame or sadness.","ex":["She buried her face in her hands.","He buried his head in the pillow."],"key":"buried her face in","syn":["hide your face","press your face","cover your face"],"reg":"neutral","ielts":"no","note":"Narrative; not needed in essays."},{"p":"the bush","m":"wild, uncultivated land in Australia and Africa","d":"Wild undeveloped land, especially in Australia and Africa.","ex":["They camped in the bush.","The farm lies deep in the bush."],"key":"the bush","syn":["the outback","wilderness","the wilds"],"reg":"neutral","ielts":"no","note":"Regional; useful in Speaking about Australia."},{"p":"mind your own business","m":"do not interfere","d":"Used to tell someone to stop being nosy.","ex":["He told the neighbour to mind her own business.","I wish people would mind their own business."],"key":"mind her own business","syn":["keep out of it","stay out of it","stop interfering"],"reg":"informal","ielts":"no","note":"Informal and rude; avoid in essays."},{"p":"by any chance","m":"possibly","d":"Used in polite questions to ask if something is possible.","ex":["Do you by any chance have a pen?","Is this seat free by any chance?"],"key":"by any chance","syn":["perhaps","possibly","by some chance"],"reg":"neutral","ielts":"careful","note":"Useful polite Speaking phrase."},{"p":"by virtue of sth","m":"because of something","d":"As a result of a particular quality or situation.","ex":["She got the job by virtue of her experience.","He is eligible by virtue of his age."],"key":"by virtue of","syn":["because of","thanks to","on account of"],"reg":"formal","ielts":"yes","note":"Formal linker for Task 2 and formal letters."},{"p":"by all means","m":"of course","d":"Used to give permission or encourage strongly.","ex":["By all means, ask any question.","Take a seat, by all means."],"key":"By all means","syn":["certainly","of course","please do"],"reg":"neutral","ielts":"careful","note":"Polite for Speaking and letters."},{"p":"by the same token","m":"in the same way","d":"Used to say a similar argument applies.","ex":["Lower taxes help firms; by the same token, they reduce services.","Praise motivates; by the same token, criticism can discourage."],"key":"by the same token","syn":["similarly","likewise","equally"],"reg":"formal","ielts":"yes","note":"Good Task 2 linker for parallel reasoning."},{"p":"be calculated to do sth","m":"be intended to have an effect","d":"To be designed to achieve a particular result.","ex":["The advert was calculated to attract young buyers.","The move was calculated to annoy rivals."],"key":"calculated to attract","syn":["be designed to","be intended to","be meant to"],"reg":"formal","ielts":"yes","note":"Useful formal phrase in Task 2 about motives."},{"p":"call sb names","m":"insult someone","d":"To use unkind words about someone.","ex":["Children should not call other pupils names.","He called her names in the playground."],"key":"call other pupils names","syn":["insult","abuse verbally","taunt"],"reg":"informal","ielts":"careful","note":"Used in school and bullying topics."},{"p":"cast a/your vote","m":"vote","d":"To formally make a vote in an election.","ex":["Millions of citizens cast their vote on Sunday.","You must register before you can cast a vote."],"key":"cast their vote","syn":["vote","go to the polls","ballot"],"reg":"formal","ielts":"yes","note":"Good for politics essays."},{"p":"cast your mind back","m":"try to remember","d":"To think about the past.","ex":["Cast your mind back to your first day at school.","She cast her mind back to 1999."],"key":"Cast your mind back","syn":["remember","think back","recall"],"reg":"neutral","ielts":"careful","note":"Common in speeches; Speaking."},{"p":"cast a spell on sb","m":"use magic on someone","d":"To use magic words to affect a person, or charm them.","ex":["The witch cast a spell on the prince.","The music cast a spell on the audience."],"key":"cast a spell on","syn":["enchant","bewitch","charm"],"reg":"neutral","ielts":"no","note":"Fantasy or figurative description."},{"p":"cast doubt on sb/sth","m":"make people unsure about something","d":"To make something seem less certain or reliable.","ex":["New evidence cast doubt on the theory.","The scandal cast doubt on his honesty."],"key":"cast doubt on","syn":["question","undermine","call into question"],"reg":"formal","ielts":"yes","note":"Excellent for Task 2 when criticising claims."},{"p":"be/get caught","m":"be discovered doi
