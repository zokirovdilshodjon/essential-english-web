ther people","d":"Without other people with you, or without anyone's help; the pronoun changes with the subject.","ex":["She lives all on her own in the countryside.","I finished the project on my own."],"key":"all on her own","syn":["alone","by yourself","unaided"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; use 'alone' or 'independently' in essays."},{"p":"once upon a time","m":"a long time ago, used to start a story","d":"A traditional opening for children's stories, meaning at some time long ago.","ex":["Once upon a time, there lived a poor farmer.","My grandmother began the story with 'Once upon a time'."],"key":"Once upon a time","syn":["long ago","in the old days","many years ago"],"reg":"neutral","ielts":"no","note":"Only for stories; not suitable for essays."},{"p":"one day","m":"at some time in the future or past","d":"Used to refer to an unspecified day in the past, or an unknown time in the future.","ex":["One day, I'd like to visit Japan.","One day my neighbour knocked on the door and asked for help."],"key":"One day","syn":["someday","at some point","eventually"],"reg":"neutral","ielts":"careful","note":"Good for Speaking stories; in essays use 'in the future' instead."},{"p":"one or two","m":"a few; a small number","d":"A small number, usually between one and three; used before a plural noun.","ex":["I have one or two questions about the test.","He bought one or two books at the market."],"key":"one or two questions","syn":["a few","a couple of","several"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; essays can use 'a few' or 'some'."},{"p":"or so","m":"approximately; about","d":"Used after a number or amount to show it is not exact.","ex":["It takes twenty minutes or so to get there.","About fifty people or so came to the party."],"key":"twenty minutes or so","syn":["or thereabouts","approximately","roughly"],"reg":"informal","ielts":"careful","note":"Casual; use 'approximately' for numbers in Task 1."},{"p":"out of order","m":"not working","d":"Describing a machine or public facility that is broken and cannot be used.","ex":["The lift is out of order today.","The phone box was out of order."],"key":"out of order","syn":["broken","not working","faulty"],"reg":"neutral","ielts":"careful","note":"Useful in complaint letters in General Training Task 1."},{"p":"the other side/end (of sth)","m":"the opposite side or end of something","d":"The part of something that is across from or at the far point from where you are.","ex":["He lives on the other side of the river.","Our office is at the other end of the corridor."],"key":"the other side of the river","syn":["the opposite side","the far side","the far end"],"reg":"neutral","ielts":"yes","note":"Useful for describing locations in map tasks."},{"p":"the other day/week, etc.","m":"a few days or weeks ago, recently","d":"Used to refer to a time in the recent past without being exact.","ex":["I met your brother the other day.","We went to a concert the other week."],"key":"the other day","syn":["recently","a few days ago","not long ago"],"reg":"informal","ielts":"careful","note":"Fine for Speaking and letters; avoid in formal writing."},{"p":"out of work","m":"without a job; unemployed","d":"Describing a person who does not have a job but would like one.","ex":["Many people were out of work after the factory closed.","He has been out of work for six months."],"key":"out of work","syn":["unemployed","jobless","without a job"],"reg":"neutral","ielts":"careful","note":"Use 'unemployed' in formal essays about employment."},{"p":"all over somewhere","m":"in every part of a place","d":"In or across all parts of a place; followed by a place noun.","ex":["People all over the world love football.","There were toys all over the floor."],"key":"all over the world","syn":["throughout","everywhere in","across"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 for global trends."},{"p":"over here/there","m":"in or to this place or that place nearby","d":"Used to show a place near you or a place a short distance away.","ex":["Come over here and look at this.","Your bag is over there on the chair."],"key":"over here","syn":["this way","here","in that direction"],"reg":"informal","ielts":"no","note":"Spoken; used in directions, not for essays."},{"p":"of your own","m":"belonging to you only","d":"Used after a noun to say it belongs only to you; the pronoun changes with the subject.","ex":["Every child should have a room of their own.","I'd love to have a car of my own."],"key":"a room of their own","syn":["personal","private","belonging to oneself"],"reg":"neutral","ielts":"yes","note":"Good for emphasising ownership or independence in essays."},{"p":"take part","m":"join in an activity or event","d":"To be involved in an activity with other people; usually followed by in.","ex":["Over 200 runners took part in the race.","Students should take part in class discussions."],"key":"took part in the race","syn":["participate","join in","get involved"],"reg":"neutral","ielts":"yes","note":"Use 'take part in', often in education or sport essays."},{"p":"pass over/through, etc.","m":"go across, through or past a place","d":"To move across, through or past something; the particle shows direction.","ex":["The plane passed over our village.","The road passes through a beautiful valley."],"key":"passed over our village","syn":["go across","travel through","cross"],"reg":"neutral","ielts":"careful","note":"Useful in descriptions of routes or maps."},{"p":"the passive","m":"the grammar form where the subject receives the action","d":"A grammatical form of a verb in which the subject is affected by the action, as in 'It was built'.","ex":["Scientific writing often uses the passive.","The sentence 'The cake was eaten' is in the passive."],"key":"the passive","syn":["passive voice","passive form"],"reg":"neutral","ielts":"yes","note":"Passive suits Academic Task 1 for processes and diagrams."},{"p":"the past","m":"the time before now","d":"The time that has already happened, or events from earlier times.","ex":["In the past, people travelled mostly by horse.","She does not like talking about the past."],"key":"In the past","syn":["former times","history","days gone by"],"reg":"neutral","ielts":"yes","note":"Very useful for comparing past and present in Task 2."},{"p":"take place","m":"happen, especially as planned","d":"To happen, especially after being arranged; it is not used in the passive.","ex":["The meeting will take place on Monday.","The Olympic Games take place every four years."],"key":"will take place","syn":["occur","happen","be held"],"reg":"neutral","ielts":"yes","note":"Good formal verb for events and processes in Task 1."},{"p":"in first/second/third, etc. place","m":"at the position of first, second, third, etc.","d":"Used to give the position of someone in a race or competition, or to list reasons.","ex":["She finished in second place in the race.","In the first place, the plan is too expensive."],"key":"in second place","syn":["ranked second","came second","at number two"],"reg":"neutral","ielts":"yes","note":"Useful for rankings; 'in the first place' also introduces reasons."},{"p":"prepare yourself","m":"get ready for something difficult or important","d":"To make yourself ready, mentally or physically, for something that will happen; often followed by for.","ex":["You should prepare yourself for a long journey.","He prepared himself for bad news."],"key":"prepare yourself for a long journey","syn":["get ready","brace yourself","make yourself ready"],"reg":"neutral","ielts":"careful","note":"Fine for Speaking and letters; reflexive pronoun must match subject."},{"p":"the present","m":"the time that is now","d":"The period of time happening now, as opposed to the past or future.","ex":["We should think about the present, not only the past.","At present, prices are rising quickly."],"key":"the present","syn":["now","the current time","today"],"reg":"neutral","ielts":"yes","note":"Useful with 'the past' and 'the future' in comparison essays."},{"p":"the public","m":"ordinary people in general","d":"People in general, not members of a particular group or government.","ex":["The museum is open to the public.","The public should be told about the risks."],"key":"the public","syn":["the people","the community","society"],"reg":"neutral","ielts":"yes","note":"Common in essays about government and society; takes plural verb."},{"p":"pull sth off/out/up","m":"remove or move something by pulling","d":"To remove or move something using force in a certain direction; the particle shows which way.","ex":["He pulled the weeds up from the garden.","She pulled a coin out of her pocket."],"key":"pulled the weeds up","syn":["drag","tug","extract"],"reg":"neutral","ielts":"careful","note":"Everyday physical action; fine in narratives and Speaking."},{"p":"quite a while","m":"a fairly long time","d":"A fairly long period of time; used as a noun phrase, often with 'for' or 'ago'.","ex":["I haven't seen him for quite a while.","It took quite a while to finish the repairs."],"key":"quite a while","syn":["a long time","some time","ages"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; essays may prefer 'a considerable time'."},{"p":"rather than","m":"instead of; and not","d":"Used to show a choice or contrast between two things; followed by a noun, verb or -ing form.","ex":["Many people choose to walk rather than drive.","He gave advice rather than money."],"key":"rather than drive","syn":["instead of","as opposed to","in preference to"],"reg":"neutral","ielts":"yes","note":"Strong contrast linker for Task 2 arguments."},{"p":"would rather","m":"prefer to do something","d":"Used to say what you prefer; followed by a bare infinitive, or past tense for another person's action.","ex":["I would rather stay at home tonight.","She'd rather you didn't tell anyone."],"key":"would rather stay","syn":["would prefer to","would sooner","prefer to"],"reg":"neutral","ielts":"careful","note":"Good in Speaking; formal essays use 'prefer'."},{"p":"not really","m":"not exactly or not very much","d":"Used to give a mild no or to say that something is not completely true.","ex":["'Do you like jogging?' 'Not really.'","I'm not really sure about my plans."],"key":"Not really","syn":["not exactly","not especially","not particularly"],"reg":"informal","ielts":"no","note":"Fine in Speaking Part 1; avoid in written essays."},{"p":"remain calm/open, etc.","m":"stay calm, open or in the same state","d":"To stay in the same state or condition; followed by an adjective.","ex":["Please remain calm during the fire drill.","The shop will remain open until nine."],"key":"remain calm","syn":["stay calm","keep calm","continue to be"],"reg":"formal","ielts":"yes","note":"Formal link verb that suits essays and notices."},{"p":"sth","m":"something; a symbol for an unnamed thing in dictionaries","d":"An abbreviation for 'something', used in dictionaries and learner books to show where a thing goes.","ex":["I need to buy something for dinner.","She wanted something sweet after lunch."],"key":"something","syn":["a thing","an item"],"reg":"neutral","ielts":"no","note":"Abbreviation only; write 'something' in full."},{"p":"right away/now/after","m":"immediately or directly after","d":"Used to mean at once, or directly following another event.","ex":["Please call the doctor right away.","I went home right after the lesson."],"key":"right away","syn":["immediately","at once","straight away"],"reg":"informal","ielts":"careful","note":"Fine in Speaking and letters; use 'immediately' in essays."},{"p":"the same","m":"exactly like another thing, or not different","d":"Used to say that two things are alike or that something has not changed.","ex":["Prices stayed the same for ten years.","We both ordered the same."],"key":"stayed the same","syn":["identical","unchanged","alike"],"reg":"neutral","ielts":"yes","note":"Very useful for describing stable trends in Task 1."},{"p":"seem happy/a nice person, etc.","m":"appear to be happy, nice, etc.","d":"A linking verb pattern meaning to give the impression of being something; followed by an adjective or noun.","ex":["He seems happy in his new job.","Your teacher seems a very kind person."],"key":"seems happy","syn":["appear","look","come across as"],"reg":"neutral","ielts":"yes","note":"Good for cautious claims in essays and descriptions."},{"p":"seem like/as if/to, etc.","m":"appear to be or to do something","d":"Used to give an impression of what is true; followed by like, as if or a to-infinitive.","ex":["It seems like a good idea to me.","He seems to know the answer."],"key":"seems like a good idea","syn":["appear to","look as if","give the impression that"],"reg":"neutral","ielts":"yes","note":"Hedging verb: good for careful opinions in Task 2."},{"p":"set a date/time (for sth)","m":"decide when something will happen","d":"To choose a particular date or time for an event; followed by for and the event.","ex":["They set a date for the wedding.","Let's set a time for the next meeting."],"key":"set a date for the wedding","syn":["fix a date","arrange a time","schedule"],"reg":"neutral","ielts":"yes","note":"Useful in formal letters and emails about arrangements."},{"p":"shake hands","m":"greet someone by holding hands and moving them up and down","d":"To hold someone's hand and move it up and down as a greeting or to agree something.","ex":["The two leaders shook hands in front of the cameras.","In many countries people shake hands when they meet."],"key":"shook hands","syn":["greet","exchange a handshake","clasp hands"],"reg":"neutral","ielts":"careful","note":"Good for culture topics; always plural 'hands'."},{"p":"I/we shall...","m":"I or we will do something, in a formal way","d":"A formal or old-fashioned way to say what you will do or offer to do, used with I and we.","ex":["I shall write to you next week.","We shall meet again in spring."],"key":"I shall write","syn":["I will","I am going to","we intend to"],"reg":"formal","ielts":"careful","note":"Formal; fine at the end of formal letters but sounds old-fashioned."},{"p":"be short of sth","m":"not have enough of something","d":"To have too little of something that you need; followed by a noun.","ex":["We are short of time today.","The school is short of teachers."],"key":"short of time","syn":["lack","be low on","run short of"],"reg":"neutral","ielts":"yes","note":"Good for problems like shortages in Task 2."},{"p":"after/before sth","m":"later or earlier than something","d":"Prepositions showing that something happens later or earlier than another event or time.","ex":["We went for a walk after dinner.","Please call me before lunch."],"key":"after dinner","syn":["following","later than","prior to"],"reg":"neutral","ielts":"yes","note":"Basic sequencing words; 'prior to' is more formal."},{"p":"do sth","m":"perform an action; a symbol for any verb in dictionaries","d":"A pattern showing that a verb goes here; do means to perform an action or activity.","ex":["I want to do something fun this weekend.","She likes to do her homework early."],"key":"do something fun","syn":["perform","carry out","complete"],"reg":"neutral","ielts":"no","note":"Pattern label only; use more precise verbs in essays."},{"p":"be sick","m":"vomit, or be ill (British English)","d":"In British English, to vomit; in American English, to be ill.","ex":["The baby was sick after eating too much.","I feel like I'm going to be sick."],"key":"was sick after eating","syn":["vomit","throw up","be ill"],"reg":"informal","ielts":"careful","note":"Meaning differs in UK and US; avoid unless the topic needs it."},{"p":"the sights","m":"interesting places that tourists visit","d":"The famous or interesting places in a town or area that visitors go to see.","ex":["We spent the day seeing the sights of Rome.","The guide showed us the sights of the old town."],"key":"seeing the sights of Rome","syn":["attractions","landmarks","places of interest"],"reg":"neutral","ielts":"careful","note":"Good for tourism topics; 'attractions' is more common in essays."},{"p":"Yours sincerely","m":"a polite way to end a formal letter","d":"A formal closing phrase used when you begin a letter with the person's name.","ex":["Yours sincerely, Anna Brown","I look forward to your reply. Yours sincerely, John Smith"],"key":"Yours sincerely","syn":["Sincerely","Kind regards","Best wishes"],"reg":"formal","ielts":"yes","note":"Use after 'Dear Mr Smith' in formal General Training letters."},{"p":"single ticket","m":"a ticket for a trip in one direction only","d":"A ticket that allows you to travel from one place to another but not back again; British English.","ex":["I'd like a single ticket to Oxford, please.","A single ticket costs less than a return."],"key":"a single ticket to Oxford","syn":["one-way ticket","one-way fare"],"reg":"neutral","ielts":"careful","note":"Useful for transport topics; US English says 'one-way ticket'."},{"p":"single parent","m":"a parent who looks after children alone","d":"A mother or father who raises their children without a partner.","ex":["She is a single parent with two children.","Single parents often face financial pressure."],"key":"a single parent with two children","syn":["lone parent","solo parent","sole carer"],"reg":"neutral","ielts":"yes","note":"Useful for family and society topics in Task 2."},{"p":"every single","m":"each one, with no exception","d":"Used before a noun to emphasise that you mean all of them without exception.","ex":["I answered every single question.","Every single student passed the exam."],"key":"every single question","syn":["each and every","every","all without exception"],"reg":"informal","ielts":"careful","note":"Emphatic; fine in Speaking, use sparingly in essays."},{"p":"be situated in/on/by, etc.","m":"be in a particular place","d":"To be in a particular place or position; followed by a preposition of place.","ex":["The school is situated on a hill.","The village is situated by a lake."],"key":"is situated on a hill","syn":["be located in","be positioned","lie"],"reg":"formal","ielts":"yes","note":"Good for map descriptions in Academic Task 1."},{"p":"get/go to sleep","m":"begin to sleep","d":"To pass from being awake into sleeping; 'get' and 'go' are both used.","ex":["I couldn't get to sleep last night.","The baby went to sleep at eight o'clock."],"key":"get to sleep","syn":["fall asleep","drop off","nod off"],"reg":"neutral","ielts":"careful","note":"Common in Speaking about routines and health."},{"p":"delicious/horrible, etc.","m":"adjectives describing very good or very bad taste","d":"Strong adjectives used to describe food or drink that tastes very good or very bad.","ex":["The soup was absolutely delicious.","The medicine tasted horrible."],"key":"absolutely delicious","syn":["tasty","wonderful","disgusting"],"reg":"neutral","ielts":"careful","note":"Good for Speaking about food; 'absolutely' goes with strong adjectives."},{"p":"that sort of thing","m":"things like that","d":"Used at the end of a statement to refer vaguely to similar things.","ex":["We play board games, cards, that sort of thing.","She likes dancing and singing and that sort of thing."],"key":"that sort of thing","syn":["that kind of thing","and so on","things like that"],"reg":"informal","ielts":"no","note":"Vague and spoken; avoid in essays."},{"p":"sound like/as if/as though","m":"seem to be something from what you hear","d":"To give an impression from what you hear or read; followed by like or a clause.","ex":["That sounds like a great idea.","It sounds as if you had a wonderful holiday."],"key":"sounds like a great idea","syn":["seem","appear","give the impression of"],"reg":"neutral","ielts":"careful","note":"Good in Speaking and friendly letters; avoid in formal essays."},{"p":"sparkling water/wine","m":"water or wine with bubbles","d":"A drink that contains small bubbles of gas; opposite of still.","ex":["I'd like a glass of sparkling water, please.","They served sparkling wine at the party."],"key":"sparkling water","syn":["fizzy water","carbonated water","bubbly"],"reg":"neutral","ielts":"careful","note":"Useful for food and drink talk in Speaking."},{"p":"speak about/of sth","m":"talk about something","d":"To talk about a subject; 'of' is more formal and often used for people or memories.","ex":["She spoke about her trip to Peru.","He often speaks of his childhood."],"key":"spoke about her trip","syn":["talk about","discuss","mention"],"reg":"neutral","ielts":"careful","note":"'Discuss' is better in essays for academic tone."},{"p":"special offer","m":"a lower price for a short time","d":"A reduced price or extra benefit given by a shop for a limited period.","ex":["There is a special offer on laptops this week.","I bought two shirts on special offer."],"key":"a special offer on laptops","syn":["discount","promotion","bargain"],"reg":"neutral","ielts":"careful","note":"Useful for shopping topics and consumer essays."},{"p":"in spite of sth","m":"although something is true; despite","d":"Used before a noun or -ing form to show that something happens even though there is a problem.","ex":["In spite of the rain, we had a great picnic.","She passed in spite of being ill."],"key":"In spite of the rain","syn":["despite","notwithstanding","regardless of"],"reg":"neutral","ielts":"yes","note":"Strong contrast linker; it is followed by noun or -ing."},{"p":"can't stand sb/sth","m":"strongly dislike someone or something","d":"To dislike someone or something very much; followed by a noun or verb-ing.","ex":["I can't stand loud music.","She can't stand waiting in queues."],"key":"can't stand loud music","syn":["hate","detest","can't bear"],"reg":"informal","ielts":"careful","note":"Good in Speaking; use 'dislike' or 'object to' in essays."},{"p":"step back/forward/over, etc.","m":"move one foot a little in a direction","d":"To move a short distance by putting one foot in a particular direction.","ex":["Please step back from the door.","He stepped over the puddle."],"key":"step back from the door","syn":["move back","move forward","stride over"],"reg":"neutral","ielts":"careful","note":"Physical action; also 'step back' can mean reconsider."},{"p":"step on/in sth","m":"put your foot on or into something","d":"To put your foot down onto or into something, often by accident.","ex":["Be careful not to step on the glass.","The dog stepped in the mud."],"key":"step on the glass","syn":["tread on","trample","put your foot in"],"reg":"neutral","ielts":"careful","note":"Everyday phrase for narratives and Speaking."},{"p":"straight away","m":"immediately; at once","d":"Used as an adverb to say that something happens with no delay.","ex":["I phoned the bank straight away.","Please reply straight away."],"key":"straight away","syn":["immediately","at once","right away"],"reg":"neutral","ielts":"careful","note":"Fine in letters; 'immediately' is better in essays."},{"p":"suffer from sth","m":"have an illness or a problem","d":"To have a medical condition or a problem that causes pain or trouble; followed by a noun.","ex":["Many people suffer from stress at work.","He suffers from a bad back."],"key":"suffer from stress","syn":["be affected by","experience","endure"],"reg":"neutral","ielts":"yes","note":"Very useful for health and social problems in Task 2."},{"p":"I suppose (so)","m":"I think so, but I am not sure or not happy","d":"Used to agree reluctantly or to say what you think is probably true.","ex":["'Is it going to rain?' 'I suppose so.'","I suppose you're right."],"key":"I suppose so","syn":["I guess so","probably","I think so"],"reg":"informal","ielts":"no","note":"Spoken; shows a hesitant agreement, not for essays."},{"p":"be supposed to do sth","m":"be expected or required to do something","d":"To be expected to do something because of a rule, plan or custom; pattern be supposed to + verb.","ex":["You are supposed to wear a uniform at school.","The train was supposed to arrive at six."],"key":"are supposed to wear a uniform","syn":["be meant to","be expected to","be required to"],"reg":"neutral","ielts":"careful","note":"Good for rules and plans; 'be expected to' is better in essays."},{"p":"take a break/rest, etc.","m":"stop an activity for a short time to relax","d":"To stop working for a short period of time; pattern take a + noun.","ex":["Let's take a break after this chapter.","He took a rest after the long walk."],"key":"take a break","syn":["have a rest","pause","stop for a while"],"reg":"neutral","ielts":"yes","note":"Useful in work-life balance topics in Task 2."},{"p":"taste good/bad/sweet, etc.","m":"have a particular flavour","d":"A linking verb pattern meaning to have a certain flavour; followed by an adjective.","ex":["This soup tastes really good.","The tea tastes too sweet for me."],"key":"tastes really good","syn":["have a flavour","be flavoured","be tasty"],"reg":"neutral","ielts":"careful","note":"Use an adjective, not an adverb, after taste."},{"p":"burst into tears","m":"suddenly begin to cry","d":"To suddenly start crying, often because of strong emotion; pattern burst into + noun.","ex":["She burst into tears when she heard the news.","The little boy burst into tears and ran to his mother."],"key":"burst into tears","syn":["start to cry","break down","dissolve into tears"],"reg":"neutral","ielts":"careful","note":"Good for narratives and Speaking; rarely needed in essays."},{"p":"I can't tell you how ...","m":"I feel something very strongly","d":"An expression used to stress how strongly you feel about something; followed by an adjective or clause.","ex":["I can't tell you how happy I was to see you.","I can't tell you how much I enjoyed the party."],"key":"I can't tell you how happy I was","syn":["I can't say how much","you have no idea how","words cannot express how"],"reg":"informal","ielts":"careful","note":"Friendly emotional phrase for letters; not for formal essays."},{"p":"that's it","m":"that is all; you have done it correctly","d":"Used to say that something is finished, or to approve of what someone is doing.","ex":["That's it, we're done for today.","Yes, that's it! You've got the right answer."],"key":"That's it","syn":["that's all","that's right","that's enough"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in written work."},{"p":"a thing","m":"an object, event or idea that is not named","d":"A noun used to refer to an object, event, idea or fact without naming it.","ex":["I don't have a thing to wear.","The most important thing is to stay healthy."],"key":"a thing to wear","syn":["an item","an object","a matter"],"reg":"neutral","ielts":"careful","note":"Vague word; replace with a precise noun in essays."},{"p":"the same thing","m":"exactly that item, idea or action again","d":"Used to say that two things are identical or that someone repeats an action.","ex":["We ordered the same thing for lunch.","Saving and investing are not the same thing."],"key":"the same thing","syn":["the same","an identical thing","likewise"],"reg":"neutral","ielts":"yes","note":"Useful when contrasting two concepts in Task 2."},{"p":"things like that","m":"similar things","d":"Used after a list or statement to refer to similar things without naming them.","ex":["He likes cycling, swimming, and things like that.","I don't enjoy loud parties and things like that."],"key":"things like that","syn":["that sort of thing","and so on","and the like"],"reg":"informal","ielts":"no","note":"Vague and spoken; avoid in essays."},{"p":"think of sth","m":"have an idea or remember something","d":"To have something in your mind, such as an idea, or to remember it; followed by a noun or -ing.","ex":["Can you think of a better solution?","I can't think of her name."],"key":"think of a better solution","syn":["come up with","remember","consider"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; essays can use 'consider'."},{"p":"it's time","m":"the correct moment has come to do something","d":"Used to say that something should now be done; pattern it's time to + verb, or it's time + past clause.","ex":["It's time to go home.","It's time you started studying seriously."],"key":"It's time to go home","syn":["the moment has come","it is high time","now is the time"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking and informal letters; avoid contractions in essays."},{"p":"time","m":"minutes, hours and days as measured by a clock","d":"A noun for the quantity measured in seconds, minutes, hours and days; also an occasion or period.","ex":["I don't have much time today.","We had a great time at the beach."],"key":"much time","syn":["period","duration","occasion"],"reg":"neutral","ielts":"yes","note":"Basic noun; time is uncountable as a quantity and countable as occasions."},{"p":"tired of doing sth","m":"bored with something and wanting it to stop","d":"No longer interested in or patient with an activity; followed by verb-ing.","ex":["I'm tired of waiting for the bus.","She is tired of eating the same food."],"key":"tired of waiting","syn":["fed up with","bored with","sick of"],"reg":"neutral","ielts":"careful","note":"Useful for opinions in Speaking; 'weary of' is more formal."},{"p":"be/get/keep, etc. in touch","m":"have or begin contact with someone","d":"To communicate or stay in contact with someone; the verb changes the meaning slightly.","ex":["I'll get in touch with you next week.","We have kept in touch since school."],"key":"get in touch with you","syn":["contact","communicate with","reach out"],"reg":"neutral","ielts":"yes","note":"Great for General Training letters and emails."},{"p":"Yours truly,","m":"a closing phrase at the end of a letter","d":"A polite closing for a letter, used mainly in American English or older style.","ex":["Thank you for your help. Yours truly, Mark Taylor","I look forward to hearing from you. Yours truly, Sarah"],"key":"Yours truly","syn":["Yours sincerely","Sincerely","Best regards"],"reg":"formal","ielts":"careful","note":"Rare; prefer 'Yours sincerely' or 'Yours faithfully' in IELTS letters."},{"p":"the truth","m":"what is real or correct; facts","d":"The real facts about something, not lies or guesses.","ex":["Please tell me the truth.","The truth is that many people do not exercise enough."],"key":"the truth","syn":["the facts","reality","honesty"],"reg":"neutral","ielts":"yes","note":"'The truth is that' can introduce a strong point in essays."},{"p":"the tube/the Tube","m":"the London underground train system","d":"The underground railway system in London; informal British English.","ex":["I take the Tube to work every day.","The tube is very crowded at eight o'clock."],"key":"the Tube","syn":["the underground","the metro","the subway"],"reg":"informal","ielts":"careful","note":"UK specific; say 'underground' in essays on transport."},{"p":"be unable to do sth","m":"not be able to do something","d":"A formal way to say you cannot do something; pattern be unable to + verb.","ex":["She was unable to attend the meeting.","Many people are unable to afford a house."],"key":"was unable to attend","syn":["cannot","be incapable of","fail to"],"reg":"formal","ielts":"yes","note":"Formal alternative to 'can't', good in essays and letters."},{"p":"the universe","m":"all space and everything in it","d":"Everything that exists, including the stars, planets and space.","ex":["Scientists study how the universe began.","There may be life elsewhere in the universe."],"key":"the universe began","syn":["the cosmos","outer space","creation"],"reg":"neutral","ielts":"yes","note":"Fine for science topics in Task 2 and Speaking."},{"p":"not until","m":"only after a certain time or event","d":"Used to say that something happens only after a particular time; often begins a sentence with inversion.","ex":["I didn't get home until midnight.","Not until she left did I realise the truth."],"key":"didn't get home until midnight","syn":["only after","not before","only when"],"reg":"neutral","ielts":"yes","note":"Fronted 'Not until' with inversion shows grammatical range."},{"p":"go/walk, etc. up to sb/sth","m":"move towards someone or something until you are near","d":"To approach someone or something until you are close to it; the first verb can vary.","ex":["She walked up to the stranger and asked for help.","He went up to the front of the room."],"key":"walked up to the stranger","syn":["approach","come close to","move towards"],"reg":"neutral","ielts":"careful","note":"Good for narratives and Speaking stories."},{"p":"be up to sb","m":"be someone's decision or responsibility","d":"To be the choice or duty of a particular person; followed by a person.","ex":["It's up to you to decide.","The final decision is up to the manager."],"key":"up to you to decide","syn":["be down to sb","be sb's responsibility","depend on sb"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; essays may use 'is the responsibility of'."},{"p":"be up to sth","m":"be doing something, often something secret or bad","d":"To be involved in an activity, often something secret; also to be good enough for something.","ex":["What have the children been up to?","He is up to something suspicious."],"key":"been up to","syn":["be doing","be engaged in","be involved in"],"reg":"informal","ielts":"no","note":"Spoken and informal; fine in friend letters."},{"p":"up to 10, 20, etc.","m":"as many as a maximum number","d":"Used before a number to show the highest amount possible or the limit.","ex":["The hall can hold up to 200 people.","Students can borrow up to ten books."],"key":"up to 200 people","syn":["as many as","a maximum of","at most"],"reg":"neutral","ielts":"yes","note":"Useful to describe maximum figures in Task 1."},{"p":"up to/until/till, etc.","m":"as late as a particular time or point","d":"Used to say that something continues until a certain time or point.","ex":["I waited up to midnight.","The shop is open up till nine."],"key":"up to midnight","syn":["until","as far as","till"],"reg":"neutral","ielts":"careful","note":"'Until' is safer in formal writing; 'till' is informal."},{"p":"used to do/be sth","m":"did or was something regularly in the past","d":"Used for past habits or states that are no longer true; pattern used to + verb.","ex":["We used to play football every Sunday.","There used to be a cinema here."],"key":"used to play football","syn":["formerly did","would (for habits)","once"],"reg":"neutral","ielts":"yes","note":"Good for contrasting past and present in Task 2 and Task 1."},{"p":"good value (for money)","m":"worth the money you pay","d":"Describes a product or service that is worth its price or better.","ex":["This restaurant is good value for money.","The cheap tickets were good value."],"key":"good value for money","syn":["worth the price","inexpensive","a bargain"],"reg":"neutral","ielts":"yes","note":"Useful for consumer topics and complaint or review letters."},{"p":"keep sb waiting","m":"make someone wait for you","d":"To make someone wait, especially because you are late; pattern keep + person + waiting.","ex":["Sorry to keep you waiting.","The doctor kept patients waiting for an hour."],"key":"keep you waiting","syn":["delay","make sb wait","hold sb up"],"reg":"neutral","ielts":"careful","note":"Useful for polite apologies in letters."},{"p":"wait a minute/moment","m":"please wait for a short time","d":"Used to ask someone to wait briefly, or to show you have just noticed something.","ex":["Wait a minute, I'll get my coat.","Wait a moment, something is not right here."],"key":"Wait a minute","syn":["hold on","just a second","hang on"],"reg":"informal","ielts":"no","note":"Spoken only; not for essays."},{"p":"walk sb home/to sth","m":"go with someone on foot to a place","d":"To go on foot with someone to their home or another place, often to keep them safe.","ex":["I'll walk you home after the party.","He walked his sister to school every day."],"key":"walk you home","syn":["accompany","escort","see sb home"],"reg":"neutral","ielts":"careful","note":"Good for Speaking about family or friends."},{"p":"walk the dog","m":"take a dog outside for exercise","d":"To take a dog for a walk so it can exercise.","ex":["I walk the dog every morning before work.","She walks the dog in the park after school."],"key":"walk the dog","syn":["take the dog out","exercise the dog"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking about pets and daily routine."},{"p":"be welcome to do sth","m":"be allowed or invited to do something","d":"To be freely permitted to do something; pattern be welcome to + verb.","ex":["You are welcome to stay for dinner.","Visitors are welcome to take photographs."],"key":"are welcome to stay","syn":["be free to","be invited to","be allowed to"],"reg":"neutral","ielts":"yes","note":"Good polite phrase for invitations in letters."},{"p":"Oh well","m":"a phrase showing you accept something that cannot change","d":"An informal expression used to show that you accept a disappointing situation.","ex":["Oh well, we can try again tomorrow.","Oh well, at least we tried."],"key":"Oh well","syn":["never mind","that's life","so be it"],"reg":"informal","ielts":"no","note":"Spoken only; fine in friend letters, not in essays."},{"p":"What about ...?","m":"a way to make a suggestion or ask about something","d":"Used to suggest something or ask for information, followed by a noun or -ing form.","ex":["What about going to the cinema tonight?","What about your brother? Is he coming?"],"key":"What about going to the cinema","syn":["How about...?","Why don't we...?","Shall we...?"],"reg":"informal","ielts":"careful","note":"Good for suggestions in friend letters and Speaking Part 3."},{"p":"What if ...?","m":"a question about what could happen","d":"Used to ask about possible results or problems of a situation; followed by a clause.","ex":["What if it rains on the day of the picnic?","What if we miss the last train?"],"key":"What if it rains","syn":["Suppose that...","Imagine that...","Supposing..."],"reg":"informal","ielts":"careful","note":"Useful for raising problems in Speaking; essays use 'If ... then'."},{"p":"What's up?","m":"a friendly way to ask what is happening or wrong","d":"An informal greeting or question asking what is the matter or what is happening.","ex":["Hi Tom, what's up?","You look sad. What's up?"],"key":"what's up?","syn":["What's going on?","How are you?","What's the matter?"],"reg":"informal","ielts":"no","note":"Greeting for friends; never in essays."},{"p":"a while","m":"a period of time","d":"A period of time, usually fairly short or of unclear length; often used with 'for' or 'after'.","ex":["I waited for a while outside.","After a while, the rain stopped."],"key":"for a while","syn":["some time","a short time","a period"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; essays prefer specific time words."},{"p":"the whole of sth","m":"all of something","d":"Used before a noun to mean every part of something, not just some of it.","ex":["I spent the whole of Sunday studying.","The whole of the city lost power."],"key":"the whole of Sunday","syn":["all of","the entirety of","every part of"],"reg":"neutral","ielts":"yes","note":"Good for emphasis; take care to use 'the whole' with singular nouns."},{"p":"why not?","m":"a way to agree, or ask for the reason","d":"Used to agree to a suggestion, or to ask why something is not true or allowed.","ex":["'Shall we eat out?' 'Why not?'","Why not take a taxi instead?"],"key":"Why not?","syn":["sure","of course","how about it"],"reg":"informal","ielts":"no","note":"Spoken; use in Speaking, but not in written essays."},{"p":"5 miles/10 metres, etc. wide","m":"having a width of a certain distance","d":"A measurement pattern: number + unit + wide, giving the distance from one side to the other.","ex":["The river is ten metres wide.","The road is only five metres wide here."],"key":"ten metres wide","syn":["with a width of","in width","across"],"reg":"neutral","ielts":"yes","note":"Useful for describing size in maps and diagrams."},{"p":"a wide range/selection/variety, etc.","m":"many different kinds of something","d":"A phrase meaning a large number of different types of something; followed by of and a plural noun.","ex":["The shop sells a wide range of products.","The menu offers a wide variety of dishes."],"key":"a wide range of products","syn":["a broad range of","a large variety of","a diverse selection of"],"reg":"neutral","ielts":"yes","note":"Strong collocation that raises lexical range in essays."},{"p":"be willing (to do sth)","m":"be happy or ready to do something if needed","d":"To be ready and ready to do something without being forced; pattern be willing to + verb.","ex":["I am willing to help you with the project.","Many workers are willing to travel for a higher salary."],"key":"am willing to help","syn":["be prepared to","be ready to","be happy to"],"reg":"neutral","ielts":"yes","note":"Good formal-neutral phrase for opinions and offers in letters."},{"p":"wish sb luck/success, etc.","m":"say you hope someone does well","d":"To express a hope that someone will have good luck or success; pattern wish + person + noun.","ex":["We wish you luck in your new job.","Everyone wished her success in the competition."],"key":"wish you luck","syn":["send good wishes","hope for the best for","congratulate in advance"],"reg":"neutral","ielts":"yes","note":"Common closing sentence in General Training letters."},{"p":"not believe/understand/hear/say, etc. a word","m":"not believe, understand, hear or say anything at all","d":"A negative pattern using 'a word' to emphasise that nothing at all was believed, understood, heard or said.","ex":["I couldn't understand a word he said.","She didn't say a word during the meeting."],"key":"couldn't understand a word","syn":["not understand anything","not catch anything","say nothing"],"reg":"neutral","ielts":"careful","note":"Good emphasis in Speaking and narratives."},{"p":"a quick/slow/good, etc. worker","m":"a person who works in a certain way","d":"A noun pattern: adjective + worker, describing how well or how fast someone works.","ex":["She is a quick worker and finishes early.","He is a good worker and always on time."],"key":"a quick worker","syn":["an employee","a hard worker","a capable person"],"reg":"neutral","ielts":"careful","note":"Useful for describing people at work in Speaking."},{"p":"be worth","m":"have a certain value in money","d":"To have a particular value, usually followed by an amount of money.","ex":["The painting is worth a million pounds.","That old car is worth very little."],"key":"is worth a million pounds","syn":["be valued at","cost","be priced at"],"reg":"neutral","ielts":"yes","note":"Useful when describing values or financial benefits."},{"p":"be worth sth/doing sth","m":"be good or useful enough to do","d":"To be important or useful enough to justify the effort; followed by a noun or verb-ing.","ex":["The museum is worth visiting.","This book is worth reading twice."],"key":"is worth visiting","syn":["deserve","merit","be valuable to do"],"reg":"neutral","ielts":"yes","note":"Good for evaluations; do not add 'to' after worth."},{"p":"be worth it","m":"be useful or good enough for the effort or cost","d":"To be a good result for the time, money or effort spent.","ex":["The journey was long, but it was worth it.","Is it worth it to pay extra for a faster train?"],"key":"it was worth it","syn":["be worthwhile","pay off","be valuable"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; essays may use 'be worthwhile'."},{"p":"for years","m":"for a very long time","d":"Used to say that something has lasted or continued for a number of years, often with the present perfect.","ex":["I have lived here for years.","They have been friends for years."],"key":"for years","syn":["for a long time","for ages","for many years"],"reg":"neutral","ielts":"careful","note":"Good in Speaking; essays can use 'for many years'."}],"B2":[{"p":"be absorbed in sth","m":"be completely focused on something so you ignore other things","d":"To be so interested in or busy with an activity that you pay no attention to anything else; used with 'in'.","ex":["She was so absorbed in her novel that she missed her stop.","Many students are absorbed in their phones during lectures."],"key":"absorbed in her novel","syn":["be engrossed in","be immersed in","be wrapped up in"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about hobbies; rare in formal essays."},{"p":"accept responsibility/blame","m":"admit that something is your fault or duty","d":"To agree that you are responsible for something bad that has happened; followed by 'for' plus a noun or -ing form.","ex":["The minister refused to accept responsibility for the failure.","Companies must accept blame when their products harm customers."],"key":"accept responsibility","syn":["take the blame","admit liability","own up to"],"reg":"formal","ielts":"yes","note":"Good for Task 2 on government or corporate duty."},{"p":"take account of sth","m":"consider something when you make a decision","d":"To consider particular facts or circumstances when making a judgement or plan; also 'take sth into account'.","ex":["Planners must take account of the needs of elderly residents.","The report takes account of recent changes in the economy."],"key":"take account of","syn":["take into consideration","bear in mind","allow for"],"reg":"formal","ielts":"yes","note":"Strong formal phrase for Task 2 arguments and solutions."},{"p":"take into account sth","m":"think about something when deciding or judging","d":"To consider something carefully as a factor when making a decision; the object can come before 'into account'.","ex":["Employers should take into account candidates' practical experience.","You must take the cost of travel into account."],"key":"take into account","syn":["take into consideration","factor in","bear in mind"],"reg":"formal","ielts":"yes","note":"Very common in Task 2; useful for balanced arguments."},{"p":"on account of sth","m":"because of something","d":"Preposition phrase meaning because of or due to a particular thing, followed by a noun.","ex":["The match was cancelled on account of heavy rain.","He retired early on account of poor health."],"key":"on account of heavy rain","syn":["because of","owing to","due to"],"reg":"formal","ielts":"yes","note":"Formal alternative to 'because of'; fine in essays."},{"p":"in actual fact","m":"in reality; really","d":"Used to emphasise what is really true, often when it differs from what people think or expect.","ex":["People assume the city is expensive, but in actual fact it is quite affordable.","He looked calm, but in actual fact he was extremely nervous."],"key":"in actual fact","syn":["in reality","as a matter of fact","in truth"],"reg":"neutral","ielts":"careful","note":"Better in speaking; use 'in fact' or 'in reality' in essays."},{"p":"take advantage of sb/sth","m":"use an opportunity, or treat someone unfairly for your benefit","d":"To make good use of a situation or opportunity, or to exploit a person unfairly.","ex":["Students should take advantage of the free library services.","Some landlords take advantage of tenants who do not know their rights."],"key":"take advantage of","syn":["make use of","exploit","capitalise on"],"reg":"neutral","ielts":"yes","note":"Versatile; positive with things, negative with people."},{"p":"all over again","m":"from the beginning, one more time","d":"Used to say that something has to be done again completely from the start.","ex":["The file was lost, so I had to write the report all over again.","If I could live my life all over again, I would study music."],"key":"all over again","syn":["from scratch","once more","afresh"],"reg":"informal","ielts":"careful","note":"Good in speaking; too casual for most essays."},{"p":"yet again","m":"once more, often with annoyance","d":"Adverb phrase used to emphasise that something has happened many times before.","ex":["The train was late yet again this morning.","Yet again, the government has delayed the new policy."],"key":"yet again","syn":["once more","again and again","for the umpteenth time"],"reg":"neutral","ielts":"careful","note":"Shows frustration; use sparingly in essays."},{"p":"against the law","m":"not allowed by the law; illegal","d":"Describes an action that is prohibited by the law; used after 'be'.","ex":["It is against the law to drive without a licence.","Dumping waste in rivers is against the law in most countries."],"key":"against the law","syn":["illegal","unlawful","prohibited"],"reg":"neutral","ielts":"yes","note":"Clear and safe for Task 2 on crime and regulation."},{"p":"be aimed at sb","m":"be made or planned for a particular group","d":"To be intended to influence or be used by a particular group of people; followed by 'at'.","ex":["The campaign is aimed at young drivers.","Many TV adverts are aimed at children."],"key":"is aimed at young drivers","syn":["be targeted at","be directed at","be intended for"],"reg":"neutral","ielts":"yes","note":"Useful for describing campaigns and policies in Task 2."},{"p":"the air","m":"the space above the ground that we breathe in","d":"The mixture of gases around the earth that people breathe; often used with 'in the air' or 'by air'.","ex":["The air in big cities is often polluted.","Cold air rushed into the room when the door opened."],"key":"The air in big cities","syn":["the atmosphere","the sky","the open air"],"reg":"neutral","ielts":"yes","note":"Common in pollution and environment topics."},{"p":"in all","m":"as a total; counting everything","d":"Used to give a total number or amount after adding things together.","ex":["There were fifty guests in all.","In all, the project cost nearly two million pounds."],"key":"in all","syn":["altogether","in total","all told"],"reg":"neutral","ielts":"yes","note":"Handy for totals in Task 1 descriptions."},{"p":"all of a sudden","m":"quickly and without warning","d":"Adverb phrase meaning suddenly and unexpectedly.","ex":["All of a sudden, the lights went out.","The weather changed all of a sudden."],"key":"All of a sudden","syn":["suddenly","out of the blue","abruptly"],"reg":"neutral","ielts":"careful","note":"Good for storytelling in speaking; use 'suddenly' in essays."},{"p":"all along","m":"for the whole time","d":"Adverb phrase meaning during the whole of a period, often when something was true but not known.","ex":["I suspected all along that he was lying.","She had the answer all along."],"key":"all along","syn":["from the start","throughout","the whole time"],"reg":"neutral","ielts":"careful","note":"Conversational; fine in speaking Part 2 stories."},{"p":"all in all","m":"considering everything; in summary","d":"Used to introduce a general summary or conclusion after considering all points.","ex":["All in all, the trip was a great success.","All in all, I think remote work benefits both staff and employers."],"key":"All in all","syn":["on the whole","overall","in conclusion"],"reg":"neutral","ielts":"careful","note":"Acceptable for conclusions, but 'Overall' is safer in essays."},{"p":"all over the place","m":"in many places, or very untidy or disorganised","d":"Everywhere, or in a messy and disorganised state; informal in the second sense.","ex":["There were toys all over the place after the party.","His ideas were all over the place during the meeting."],"key":"all over the place","syn":["everywhere","in a mess","scattered about"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"leave sb alone","m":"stop bothering someone","d":"To stop talking to or disturbing someone, or to let them be by themselves.","ex":["Please leave me alone; I'm trying to study.","The press should leave the family alone during this difficult time."],"key":"leave me alone","syn":["stop bothering","give sb some space","let sb be"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; rarely needed in formal writing."},{"p":"along with sb/sth","m":"together with someone or something","d":"Preposition phrase meaning in addition to or accompanied by another person or thing.","ex":["Pollution, along with traffic, is a serious problem in cities.","She travelled along with her sister."],"key":"along with traffic","syn":["together with","as well as","in addition to"],"reg":"neutral","ielts":"yes","note":"Good for adding ideas; check verb agreement with the main subject."},{"p":"among other things","m":"including other things not mentioned","d":"Used to say that what you mention is only one of several things.","ex":["The course covers, among other things, grammar and writing skills.","Among other things, the survey asked about diet and exercise."],"key":"among other things","syn":["amongst others","not least","for example"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 and 2 to avoid long lists."},{"p":"among the best/worst/biggest, etc.","m":"one of the group that is best, worst, biggest, etc.","d":"Used with a superlative to say that something is one of the top few in a group.","ex":["The university is among the best in Europe.","Japan has among the oldest populations in the world."],"key":"among the best","syn":["one of the best","ranked high","counted among the best"],"reg":"neutral","ielts":"yes","note":"Great for Task 1 comparisons with superlatives."},{"p":"keep sb amused","m":"make someone enjoy themselves so they are not bored","d":"To entertain someone so that they do not get bored; pattern: keep + object + amused.","ex":["Toys and games keep the children amused on long journeys.","She kept the guests amused with funny stories."],"key":"keep the children amused","syn":["keep sb entertained","occupy","entertain"],"reg":"neutral","ielts":"careful","note":"Fine in speaking about childhood or leisure."},{"p":"or anything","m":"or something similar (used in questions and negatives)","d":"Informal tag used after a negative or question to include any similar thing.","ex":["I didn't see a doctor or anything.","Are you hungry or anything?"],"key":"or anything","syn":["or something like that","or whatever","or the like"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"anything like","m":"at all similar to","d":"Used mostly in questions and negatives to mean even slightly similar to something.","ex":["The film isn't anything like the book.","Is the new model anything like the old one?"],"key":"anything like the book","syn":["at all similar to","remotely like","comparable to"],"reg":"informal","ielts":"careful","note":"Mainly spoken; use 'similar to' in writing."},{"p":"not/never get anywhere","m":"make no progress","d":"To fail to make progress or achieve anything useful in a situation.","ex":["We argued for hours but didn't get anywhere.","You will never get anywhere if you give up so easily."],"key":"didn't get anywhere","syn":["make no progress","get nowhere","fail to advance"],"reg":"informal","ielts":"careful","note":"Good in speaking; use 'make no progress' in essays."},{"p":"it appears (that)","m":"it seems that","d":"Used to introduce something that seems to be true based on evidence; followed by a clause.","ex":["It appears that sales have fallen sharply this year.","It appears the data was collected incorrectly."],"key":"It appears that","syn":["it seems that","apparently","it would seem that"],"reg":"formal","ielts":"yes","note":"Useful hedging language for Task 1 and Task 2."},{"p":"would appreciate","m":"would be grateful for something","d":"Polite expression used to ask for something or say you would be thankful; often 'would appreciate it if...'.","ex":["I would appreciate your help with this form.","We would appreciate it if you could reply by Friday."],"key":"would appreciate","syn":["would be grateful for","would value","would be thankful"],"reg":"formal","ielts":"yes","note":"Good for formal General Training letters of request."},{"p":"I/We appreciate...","m":"thank someone or show you value what they did","d":"Used to express thanks or recognition for something; followed by a noun or -ing form.","ex":["We appreciate your quick response to our complaint.","I appreciate having the chance to explain."],"key":"We appreciate your quick response","syn":["we are grateful for","thank you for","we value"],"reg":"formal","ielts":"yes","note":"Useful in formal General Training letters."},{"p":"be around","m":"exist, or be present in a place","d":"To exist or be present in a place or time; informal when asking if someone is nearby.","ex":["Smartphones have been around for less than twenty years.","Is your manager around this afternoon?"],"key":"have been around","syn":["exist","be present","be nearby"],"reg":"informal","ielts":"careful","note":"Fine in speaking; use 'exist' in formal writing."},{"p":"as for","m":"about; used to move to a new topic","d":"Used to introduce a new topic or person related to what was just said.","ex":["The city has good transport. As for housing, it is expensive.","As for the second point, I disagree."],"key":"As for housing","syn":["regarding","with regard to","when it comes to"],"reg":"neutral","ielts":"yes","note":"Useful for moving between ideas in Task 2."},{"p":"as a result of sth","m":"because of something that happened","d":"Preposition phrase showing that something is caused by a previous event or action.","ex":["As a result of the storm, many flights were cancelled.","Prices rose as a result of higher fuel costs."],"key":"As a result of the storm","syn":["because of","owing to","due to"],"reg":"neutral","ielts":"yes","note":"Excellent for cause and effect in essays."},{"p":"as a whole","m":"considered completely, not in parts","d":"Used after a noun to refer to all of something considered together.","ex":["The policy benefits society as a whole.","The economy as a whole grew by two per cent."],"key":"as a whole","syn":["overall","in general","collectively"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 for society or community."},{"p":"as a matter of fact","m":"in truth; actually","d":"Used to add or correct information, often to say something surprising or to emphasise.","ex":["I like cold weather; as a matter of fact, I prefer it.","As a matter of fact, the experiment failed twice."],"key":"as a matter of fact","syn":["in fact","actually","in reality"],"reg":"informal","ielts":"careful","note":"Better in speaking; use 'in fact' in essays."},{"p":"as follows","m":"in the way listed next","d":"Used to introduce a list or explanation that comes next.","ex":["The results were as follows: 40% agreed and 60% disagreed.","The steps are as follows."],"key":"as follows","syn":["like this","in the following way","thus"],"reg":"formal","ielts":"yes","note":"Useful in Task 1 and reports to introduce details."},{"p":"as if/as though","m":"in a way that seems like something","d":"Conjunction introducing a comparison with how something appears or might be; often followed by past subjunctive.","ex":["He talks as if he owns the company.","It looked as though it would rain."],"key":"as if he owns the company","syn":["like","in the manner of","just as"],"reg":"neutral","ielts":"yes","note":"Useful for comparisons; 'as though' feels slightly more formal."},{"p":"as far as sb is concerned","m":"in someone's opinion","d":"Used to introduce a person's opinion or position on a matter.","ex":["As far as I am concerned, education should be free.","As far as the council is concerned, the plan is final."],"key":"As far as I am concerned","syn":["in my opinion","from my point of view","to my mind"],"reg":"neutral","ielts":"yes","note":"Good opinion phrase for Task 2 introductions."},{"p":"be ashamed of sb","m":"feel embarrassed or guilty about someone or something","d":"To feel guilty or embarrassed because of a person's behaviour; followed by 'of' plus noun or -ing.","ex":["She was ashamed of her brother's rude behaviour.","I'm ashamed of having lied to them."],"key":"was ashamed of her brother's rude behaviour","syn":["feel embarrassed about","feel guilty about","be mortified by"],"reg":"neutral","ielts":"careful","note":"Personal tone; better in speaking than academic writing."},{"p":"aside from sth","m":"except for; in addition to","d":"Preposition phrase meaning apart from, either excluding or adding to something.","ex":["Aside from the cost, the plan has many advantages.","Aside from English, she speaks three other languages."],"key":"Aside from the cost","syn":["apart from","besides","except for"],"reg":"neutral","ielts":"yes","note":"Fine in essays; 'apart from' is equally good."},{"p":"Don't ask!","m":"used when something was very bad or annoying","d":"Informal exclamation suggesting that a situation was too bad or complicated to explain.","ex":["How was the exam? Don't ask!","\"How was the journey?\" \"Don't ask! The train broke down twice.\""],"key":"Don't ask!","syn":["You don't want to know","Please don't remind me","Let's not talk about it"],"reg":"informal","ielts":"no","note":"Spoken only; use with friends, never in essays."},{"p":"Don't ask me","m":"I do not know the answer","d":"Informal reply meaning you have no idea and cannot help.","ex":["Don't ask me where the keys are; I haven't seen them.","\"Why is he late?\" \"Don't ask me.\""],"key":"Don't ask me","syn":["I have no idea","How should I know","Search me"],"reg":"informal","ielts":"no","note":"Spoken and rude in formal settings; avoid in the test."},{"p":"be associated with sth","m":"be connected in people's minds with something","d":"To be linked with something, often in a way that people notice; passive form with 'with'.","ex":["Fast food is often associated with obesity.","The brand is associated with high quality."],"key":"is often associated with obesity","syn":["be linked to","be connected with","be related to"],"reg":"formal","ielts":"yes","note":"Excellent for describing links and causes in Task 2."},{"p":"at least","m":"not less than; or at the minimum","d":"Used to say a minimum amount, or to mention a positive point in a bad situation.","ex":["Adults should exercise for at least thirty minutes a day.","The flight was late, but at least our bags arrived."],"key":"at least thirty minutes","syn":["no fewer than","a minimum of","not less than"],"reg":"neutral","ielts":"yes","note":"Useful for quantities in Task 1; avoid chatty uses."},{"p":"at all costs","m":"whatever happens; no matter what","d":"Used to say something must be achieved or avoided regardless of the price or effort.","ex":["The company wants to avoid bankruptcy at all costs.","Safety must be protected at all costs."],"key":"at all costs","syn":["whatever it takes","no matter what","by any means"],"reg":"neutral","ielts":"yes","note":"Strong emphasis; good in Task 2 conclusions."},{"p":"at sb's disposal","m":"available for someone to use","d":"Available for a person to use whenever they need; pattern: at + possessive + disposal.","ex":["Students have a modern library at their disposal.","I will put my car at your disposal."],"key":"at their disposal","syn":["available to","for sb's use","on hand"],"reg":"formal","ielts":"yes","note":"Formal; good for resources in Task 2."},{"p":"at fault","m":"responsible for a mistake or problem","d":"Describes someone who is to blame for something wrong, used after 'be'.","ex":["The driver was at fault in the accident.","Neither side is wholly at fault for the dispute."],"key":"was at fault","syn":["to blame","responsible","in the wrong"],"reg":"formal","ielts":"yes","note":"Fine for discussing blame and responsibility."},{"p":"at risk","m":"in danger of being harmed or lost","d":"In a situation where something bad could happen; often followed by 'of' or 'from'.","ex":["Many species are at risk of extinction.","Elderly people are most at risk from the virus."],"key":"at risk of extinction","syn":["in danger","vulnerable","under threat"],"reg":"neutral","ielts":"yes","note":"Very useful in environment and health essays."},{"p":"the atmosphere","m":"the air around the earth, or the mood of a place","d":"The layer of gases around the earth, or the general feeling in a place.","ex":["Carbon dioxide traps heat in the atmosphere.","The restaurant has a friendly atmosphere."],"key":"in the atmosphere","syn":["the air","the ambience","the mood"],"reg":"neutral","ielts":"yes","note":"Key word in environment topics; also for mood in speaking."},{"p":"attract/get (sb's) attention","m":"make someone notice you or something","d":"To make people notice or take an interest in something or someone.","ex":["The advert was designed to attract people's attention.","She waved her arms to get his attention."],"key":"attract people's attention","syn":["catch sb's eye","draw attention","grab sb's attention"],"reg":"neutral","ielts":"yes","note":"Useful for advertising and media topics."},{"p":"draw (sb's) attention to sth/sb","m":"make someone notice something","d":"To make people notice or think about a particular fact or person; followed by 'to'.","ex":["The report draws attention to the lack of funding.","I'd like to draw your attention to the graph below."],"key":"draws attention to the lack of funding","syn":["highlight","point out","call attention to"],"reg":"formal","ielts":"yes","note":"Excellent in Task 1 and for introducing key points."},{"p":"be attracted to sb","m":"feel interest or romantic liking for someone","d":"To find someone interesting or appealing, often romantically; used with 'to'.","ex":["She was attracted to him because of his sense of humour.","Many people are attracted to cities by job opportunities."],"key":"was attracted to him","syn":["be drawn to","be drawn towards","fancy"],"reg":"neutral","ielts":"careful","note":"Fine for people and cities; avoid romance topics in essays."},{"p":"on average","m":"usually, or as a typical figure","d":"Used to give a typical or mean amount when looking at many cases.","ex":["On average, people here walk five kilometres a day.","Women live longer than men on average."],"key":"On average","syn":["typically","in general","as a rule"],"reg":"neutral","ielts":"yes","note":"Very useful in Academic Task 1 for typical figures."},{"p":"avoid doing sth","m":"stay away from doing something","d":"To keep away from or prevent an action; always followed by an -ing form.","ex":["Drivers should avoid using their phones on the road.","He avoided answering the question."],"key":"avoid using their phones","syn":["refrain from","steer clear of","evade"],"reg":"neutral","ielts":"yes","note":"Use -ing after 'avoid'; common in advice and solutions."},{"p":"an awful lot (of sth)","m":"a very large amount","d":"Informal expression meaning a very large quantity or number of something.","ex":["There is an awful lot of traffic in the morning.","We learned an awful lot on the course."],"key":"an awful lot of traffic","syn":["a great deal of","a huge amount of","loads of"],"reg":"informal","ielts":"no","note":"Spoken; use 'a great deal of' in essays."},{"p":"on balance","m":"after considering all points","d":"Used to give an overall judgement after weighing advantages and disadvantages.","ex":["On balance, I believe the benefits outweigh the costs.","On balance, the plan seems reasonable."],"key":"On balance","syn":["all things considered","overall","on the whole"],"reg":"formal","ielts":"yes","note":"Excellent for Task 2 conclusions."},{"p":"a balanced diet/meal","m":"food with the right amounts of different nutrients","d":"A diet or meal that contains the correct proportions of different foods for good health.","ex":["A balanced diet includes fruit, vegetables and protein.","Schools should serve balanced meals."],"key":"A balanced diet","syn":["a healthy diet","a nutritious diet","well-rounded meals"],"reg":"neutral","ielts":"yes","note":"Common collocation in health topics."},{"p":"behind bars","m":"in prison","d":"Informal-neutral expression meaning in prison; often used with 'put' or 'be'.","ex":["The thief spent five years behind bars.","Many people believe dangerous criminals belong behind bars."],"key":"behind bars","syn":["in prison","in jail","incarcerated"],"reg":"informal","ielts":"careful","note":"Fine in speaking; use 'in prison' in formal essays."},{"p":"be based at/in/etc.","m":"have your main place of work or home somewhere","d":"To have a place as your main location for work or operations; followed by a preposition and place.","ex":["The company is based in Manchester.","She is based at the university's research centre."],"key":"is based in Manchester","syn":["be located in","be headquartered in","operate from"],"reg":"neutral","ielts":"yes","note":"Useful for describing organisations and jobs."},{"p":"the basics","m":"the simplest and most important facts or skills","d":"The most important and simple parts of a subject or activity.","ex":["Children should learn the basics of reading before school.","He knows the basics of cooking."],"key":"the basics of reading","syn":["the fundamentals","the essentials","the ABC"],"reg":"neutral","ielts":"yes","note":"Good for education topics; usually with 'of'."},{"p":"on a daily/monthly/regular, etc. basis","m":"happening every day, month, or regularly","d":"Used to say how often something happens; pattern: on a + adjective + basis.","ex":["Many people use social media on a daily basis.","Staff are tested on a weekly basis."],"key":"on a daily basis","syn":["daily","regularly","routinely"],"reg":"formal","ielts":"yes","note":"Formal way to show frequency in Task 1 and 2."},{"p":"bear (sb/sth) in mind","m":"remember and think about something","d":"To remember a fact when making a decision; the object can go between 'bear' and 'in mind'.","ex":["Bear in mind that prices may rise.","We should bear the risks in mind."],"key":"Bear in mind","syn":["keep in mind","take into account","remember"],"reg":"neutral","ielts":"yes","note":"Useful for adding conditions or warnings in Task 2."},{"p":"to begin with","m":"at first; as the first point","d":"Used to introduce the first point in a list or to mean at the start.","ex":["To begin with, exercise improves health.","To begin with, the project was small."],"key":"To begin with","syn":["firstly","in the first place","initially"],"reg":"neutral","ielts":"yes","note":"Fine for starting a paragraph, though 'Firstly' is more common."},{"p":"make the best of sth","m":"do well in a bad or difficult situation","d":"To accept a difficult situation and get as much benefit from it as possible.","ex":["We made the best of the bad weather by visiting museums.","Students must make the best of limited resources."],"key":"made the best of the bad weather","syn":["make the most of","cope with","get by with"],"reg":"neutral","ielts":"yes","note":"Good for resource and attitude themes."},{"p":"beyond my/our, etc. control","m":"something you cannot influence or stop","d":"Used for situations that a person or group cannot manage or change; also 'beyond sb's control'.","ex":["The delay was beyond our control.","Natural disasters are beyond human control."],"key":"beyond our control","syn":["out of our hands","unavoidable","uncontrollable"],"reg":"neutral","ielts":"yes","note":"Useful for natural events and unavoidable problems."},{"p":"give birth","m":"produce a baby from your body","d":"To produce a baby or young animal from the body; often followed by 'to'.","ex":["She gave birth to twins last week.","Women are giving birth later than before."],"key":"gave birth","syn":["have a baby","deliver a baby","bear a child"],"reg":"neutral","ielts":"yes","note":"Useful for demographic topics like falling birth rates."},{"p":"American/Italian, etc. by birth","m":"having a nationality from the time you were born","d":"Used to say that someone has a certain nationality because of where they were born.","ex":["He is Italian by birth but lives in Canada.","She is French by birth."],"key":"Italian by birth","syn":["born as","native-born","of origin"],"reg":"neutral","ielts":"careful","note":"Useful for describing people's backgrounds in speaking."},{"p":"a bit","m":"slightly, or a small amount","d":"Used as an adverb to mean slightly, or as a noun phrase for a small quantity.","ex":["I'm a bit tired today.","Can you wait a bit longer?"],"key":"a bit tired","syn":["slightly","a little","somewhat"],"reg":"informal","ielts":"careful","note":"Fine in speaking; use 'slightly' or 'somewhat' in writing."},{"p":"go blank","m":"suddenly be unable to think or remember","d":"To suddenly stop being able to remember or think of something, especially under pressure.","ex":["My mind went blank during the exam.","She went blank when the teacher asked her."],"key":"went blank","syn":["draw a blank","freeze","forget everything"],"reg":"neutral","ielts":"careful","note":"Good in speaking about stress; avoid in essays."},{"p":"can't be bothered","m":"too lazy or tired to do something","d":"Used to say you do not want to spend effort on something; followed by 'to do' or 'with'.","ex":["I can't be bothered to cook tonight.","He couldn't be bothered with the paperwork."],"key":"can't be bothered","syn":["can't be bothered","not feel like it","not want to make the effort"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in writing."},{"p":"bounce along/around/into, etc.","m":"move with jumps or bumps","d":"To move quickly and lightly, hitting the ground repeatedly; followed by a direction word.","ex":["The ball bounced along the road.","The children bounced around the room."],"key":"bounced along the road","syn":["bound along","spring","skip"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful for speaking, rare in essays."},{"p":"bound to do sth","m":"very likely to happen or do something","d":"Certain or very likely to do something; pattern: be bound to + infinitive.","ex":["Prices are bound to rise next year.","You're bound to feel nervous before the interview."],"key":"are bound to rise","syn":["certain to","sure to","likely to"],"reg":"neutral","ielts":"yes","note":"Good for predictions in Task 2."},{"p":"break a record","m":"do better than the previous best result","d":"To achieve a result better than the previous best in a competition or activity.","ex":["She broke the world record for swimming.","Temperatures this summer broke all previous records."],"key":"broke the world record","syn":["beat a record","set a new record","surpass the record"],"reg":"neutral","ielts":"yes","note":"Useful for Task 1 trends and sports topics."},{"p":"break an agreement/promise, etc.","m":"fail to do what you agreed or promised","d":"To fail to keep an agreement or promise; the object is a noun like 'promise' or 'contract'.","ex":["The company broke the agreement with its workers.","He broke his promise to call."],"key":"broke the agreement","syn":["violate","go back on","fail to honour"],"reg":"neutral","ielts":"yes","note":"Fine in formal contexts and essays on trust."},{"p":"break the law","m":"do something illegal","d":"To do something that is forbidden by the law.","ex":["Anyone who breaks the law should face punishment.","Drivers break the law when they use phones."],"key":"breaks the law","syn":["commit an offence","violate the law","act illegally"],"reg":"neutral","ielts":"yes","note":"Very common in crime and punishment essays."},{"p":"be out of breath","m":"be breathing quickly after exercise","d":"To be breathing fast and with difficulty after physical effort.","ex":["He was out of breath after climbing the stairs.","I get out of breath when I run."],"key":"was out of breath","syn":["be breathless","be panting","be short of breath"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful for speaking about exercise."},{"p":"hold your breath","m":"stop breathing for a short time","d":"To stop breathing for a moment, often because of fear or when diving; also to wait nervously.","ex":["She held her breath and dived into the pool.","We held our breath waiting for the result."],"key":"held her breath","syn":["stop breathing","wait anxiously","hold back"],"reg":"neutral","ielts":"careful","note":"Fine in speaking stories; rare in essays."},{"p":"take a deep breath","m":"breathe in a lot of air slowly","d":"To fill your lungs with air, often to calm yourself or prepare for something hard.","ex":["He took a deep breath before starting his speech.","Take a deep breath and relax."],"key":"took a deep breath","syn":["breathe in deeply","inhale","draw breath"],"reg":"neutral","ielts":"careful","note":"Good for speaking about nerves or stress."},{"p":"in brief","m":"in a few words; shortly","d":"Used to introduce a short summary of what has been said.","ex":["In brief, the plan failed because of poor funding.","In brief, the results were positive."],"key":"In brief","syn":["in short","in summary","to sum up"],"reg":"formal","ielts":"yes","note":"Good concluding phrase for essays and reports."},{"p":"a broken heart","m":"deep sadness after a love ends","d":"Strong emotional pain caused by the end of a romantic relationship or a great loss.","ex":["She died of a broken heart after her husband's death.","He nursed a broken heart for years."],"key":"a broken heart","syn":["heartbreak","emotional pain","grief"],"reg":"informal","ielts":"careful","note":"Emotional; fine in speaking, avoid in academic essays."},{"p":"bump against/into sth","m":"hit something by accident","d":"To hit something or someone accidentally; followed by 'against' or 'into'.","ex":["I bumped into the table in the dark.","She bumped against the door."],"key":"bumped into the table","syn":["knock into","collide with","hit"],"reg":"neutral","ielts":"careful","note":"Everyday description; also means meeting someone by chance."},{"p":"be none of sb's business","m":"not something someone has the right to know","d":"Used to say that a matter is private and should not concern someone else.","ex":["My salary is none of your business.","It's none of the neighbours' business how we live."],"key":"none of your business","syn":["not your concern","private matter","not sb's affair"],"reg":"informal","ielts":"no","note":"Rude or blunt; avoid in the test."},{"p":"by far","m":"much; by a large amount","d":"Used to emphasise a comparative or superlative adjective or adverb.","ex":["She is by far the best candidate.","This is by far the most popular option."],"key":"by far the best candidate","syn":["easily","much","far and away"],"reg":"neutral","ielts":"yes","note":"Strong emphasis for superlatives in Task 1 and 2."},{"p":"by heart","m":"from memory; knowing every word","d":"Used with 'learn' or 'know' to mean memorised perfectly.","ex":["Students learn the poem by heart.","She knows the whole speech by heart."],"key":"by heart","syn":["from memory","by rote","word for word"],"reg":"neutral","ielts":"yes","note":"Useful for education topics about memorisation."},{"p":"day by day/little by little/one by one, etc.","m":"gradually or one at a time","d":"Pattern showing gradual change or a step-by-step order using repeated words with 'by'.","ex":["Day by day, her English improved.","They entered the room one by one."],"key":"Day by day","syn":["gradually","step by step","bit by bit"],"reg":"neutral","ielts":"careful","note":"Good for trends; keep it to one use per essay."},{"p":"call in sick","m":"phone work to say you are ill","d":"To telephone your employer to say you cannot come to work because you are ill.","ex":["He called in sick on Monday.","Many staff call in sick during the winter."],"key":"called in sick","syn":["report sick","take a sick day","phone in ill"],"reg":"informal","ielts":"careful","note":"Fine for work topics; use 'be absent due to illness' in formal text."},{"p":"an army/prison/refugee, etc. camp","m":"a place with tents or buildings for soldiers, prisoners, or refugees","d":"A place where a particular group of people live, often temporarily and under controlled conditions.",
