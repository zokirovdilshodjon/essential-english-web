"ex":["Thousands of families live in a refugee camp.","He trained at an army camp."],"key":"a refugee camp","syn":["a settlement","a barracks","a shelter"],"reg":"neutral","ielts":"yes","note":"Useful for migration, war and global issues topics."},{"p":"capable of sth/doing sth","m":"able to do something","d":"Having the ability or qualities to do something; followed by 'of' plus noun or -ing.","ex":["She is capable of leading a large team.","Robots are capable of performing dangerous tasks."],"key":"capable of leading","syn":["able to","competent at","qualified to"],"reg":"formal","ielts":"yes","note":"Common formal adjective; remember 'of' plus -ing."},{"p":"capture sb/sth on camera/film, etc.","m":"record someone or something in photos or video","d":"To record an image or event using a camera or film.","ex":["Tourists captured the eclipse on camera.","The documentary captured the lives of the villagers on film."],"key":"captured the eclipse on camera","syn":["record","film","photograph"],"reg":"neutral","ielts":"yes","note":"Useful in media and technology topics."},{"p":"Who cares?","m":"it does not matter to anyone","d":"Rhetorical question showing you think something is not important.","ex":["\"He didn't call.\" \"Who cares?\"","Who cares if we lose one game?"],"key":"Who cares?","syn":["So what?","Nobody minds","It doesn't matter"],"reg":"informal","ielts":"no","note":"Dismissive and spoken; avoid in essays."},{"p":"be the case","m":"be true in a particular situation","d":"To be true or correct in the situation being discussed; often 'if this is the case'.","ex":["If that is the case, we need new rules.","This was not the case in the past."],"key":"is the case","syn":["be true","hold true","apply"],"reg":"formal","ielts":"yes","note":"Very useful for conditional arguments in Task 2."},{"p":"in any case","m":"whatever happens; anyway","d":"Used to introduce a point that is true whatever else may be the situation.","ex":["The train may be late; in any case, we will leave early.","In any case, the policy needs changing."],"key":"in any case","syn":["anyway","at any rate","regardless"],"reg":"neutral","ielts":"careful","note":"Fine for adding a final point; do not overuse."},{"p":"in that case","m":"if that is true; then","d":"Used to say what will happen or should be done if the previous statement is true.","ex":["If you don't like the job, in that case you should quit.","\"I'm busy.\" \"In that case, I'll come tomorrow.\""],"key":"in that case","syn":["if so","then","under those circumstances"],"reg":"neutral","ielts":"careful","note":"More natural in speaking; use 'if so' in essays."},{"p":"catch sb's attention, interest, etc.","m":"make someone notice or become interested","d":"To make someone notice or become interested in something; the object is a person.","ex":["The headline caught my attention.","The advert caught the public's interest."],"key":"caught my attention","syn":["grab sb's attention","attract attention","capture sb's imagination"],"reg":"neutral","ielts":"yes","note":"Good for media and advertising topics."},{"p":"a certain","m":"particular but not named, or some","d":"Used before a noun to refer to a specific person or thing without describing it exactly.","ex":["A certain amount of stress is normal.","I met a certain Mr Brown yesterday."],"key":"A certain amount of stress","syn":["a particular","some","a specific"],"reg":"neutral","ielts":"yes","note":"Useful hedging phrase in Task 2."},{"p":"change the subject","m":"begin talking about something different","d":"To start talking about a different topic, often to avoid something uncomfortable.","ex":["He quickly changed the subject when I asked about money.","Let's change the subject."],"key":"changed the subject","syn":["switch topics","steer the conversation away","move on"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; rarely needed in writing."},{"p":"take charge","m":"take control of a situation or group","d":"To take control or responsibility for something; often followed by 'of'.","ex":["Maria took charge of the project when the manager left.","Someone must take charge of the emergency."],"key":"took charge of the project","syn":["take control","take the lead","take command"],"reg":"neutral","ielts":"yes","note":"Useful for leadership and work topics."},{"p":"the charts","m":"the list of best-selling songs","d":"The weekly list of the most popular songs or albums.","ex":["The song went straight to the top of the charts.","Her album has been in the charts for months."],"key":"the charts","syn":["the top 40","the hit list","the music rankings"],"reg":"informal","ielts":"careful","note":"Music topics in speaking; not for Task 1 charts."},{"p":"have a clue","m":"know something or have any idea","d":"To know or have any understanding of something; mostly used in questions and negatives.","ex":["I don't have a clue where he lives.","Do you have a clue what the answer is?"],"key":"have a clue","syn":["have any idea","know","have an inkling"],"reg":"informal","ielts":"no","note":"Spoken only; use 'have no idea' sparingly."},{"p":"come up","m":"happen unexpectedly, or be mentioned","d":"To arise or be raised as a subject, or to happen unexpectedly.","ex":["Something urgent has come up at work.","The subject came up during dinner."],"key":"has come up","syn":["arise","crop up","be raised"],"reg":"neutral","ielts":"careful","note":"Useful in speaking; 'arise' is more formal."},{"p":"common knowledge","m":"facts that most people know","d":"Information that is known by most people; usually followed by 'that' or 'to'.","ex":["It is common knowledge that smoking causes cancer.","The story is common knowledge in the village."],"key":"common knowledge","syn":["general knowledge","well known","public knowledge"],"reg":"neutral","ielts":"yes","note":"Use to introduce widely accepted facts in Task 2."},{"p":"keep sb company","m":"stay with someone so they are not alone","d":"To spend time with someone so that they do not feel lonely.","ex":["My dog keeps me company at home.","I stayed to keep her company in the hospital."],"key":"keeps me company","syn":["accompany","stay with","be with"],"reg":"neutral","ielts":"careful","note":"Fine for speaking about family or pets."},{"p":"compared to/with sb/sth","m":"when you look at two things together","d":"Used to show differences or similarities between two things; followed by a noun.","ex":["Compared to last year, sales have risen.","Compared with men, women live longer."],"key":"Compared to last year","syn":["in comparison with","relative to","as opposed to"],"reg":"neutral","ielts":"yes","note":"Essential for Task 1 comparisons."},{"p":"In conclusion","m":"to finish; as a final point","d":"Used at the beginning of a final sentence or paragraph to sum up an argument.","ex":["In conclusion, public transport should be improved.","In conclusion, both views have merit."],"key":"In conclusion","syn":["to sum up","in summary","to conclude"],"reg":"formal","ielts":"yes","note":"Standard for Task 2 conclusions; avoid repeating it."},{"p":"on condition that","m":"only if something else happens","d":"Conjunction meaning only if a specific requirement is met; followed by a clause.","ex":["He agreed to help on condition that he stayed anonymous.","Loans are given on condition that they are repaid."],"key":"on condition that","syn":["provided that","as long as","on the understanding that"],"reg":"formal","ielts":"yes","note":"Formal conditional linker for Task 2."},{"p":"in connection with sth","m":"about or related to something","d":"Preposition phrase meaning relating to a particular matter, often used in official contexts.","ex":["Police are questioning a man in connection with the robbery.","I am writing in connection with your recent order."],"key":"in connection with the robbery","syn":["in relation to","regarding","with reference to"],"reg":"formal","ielts":"yes","note":"Good in formal letters and reports."},{"p":"be conscious of/that","m":"know about or notice something","d":"To be aware of something, often followed by 'of' plus noun or a 'that' clause.","ex":["She was conscious of everyone watching her.","Consumers are becoming conscious that plastic harms the oceans."],"key":"was conscious of everyone watching her","syn":["be aware of","be mindful of","realise"],"reg":"formal","ielts":"yes","note":"Fine alternative to 'aware' in Task 2."},{"p":"consider sb/sth (to be) sth","m":"think of someone or something in a certain way","d":"To have an opinion about someone or something; 'to be' is often omitted.","ex":["Many people consider cycling to be the best exercise.","She is considered a leading expert."],"key":"consider cycling to be the best exercise","syn":["regard as","view as","think of as"],"reg":"formal","ielts":"yes","note":"Good for stating opinions in Task 2."},{"p":"take sth into consideration","m":"think about something before deciding","d":"To think carefully about something when making a decision or plan.","ex":["The committee took the residents' views into consideration.","Please take my age into consideration."],"key":"took the residents' views into consideration","syn":["take into account","bear in mind","factor in"],"reg":"formal","ielts":"yes","note":"Strong formal phrase for Task 2 recommendations."},{"p":"on the contrary","m":"the opposite is true","d":"Used to introduce a statement that disagrees with or contradicts the previous one.","ex":["The policy did not reduce crime; on the contrary, it increased it.","On the contrary, many people prefer the old system."],"key":"on the contrary","syn":["quite the opposite","in fact","conversely"],"reg":"formal","ielts":"yes","note":"Use after a negative statement to contradict it."},{"p":"by/in contrast","m":"showing a clear difference","d":"Used to introduce a point that differs sharply from the previous one.","ex":["Sales rose in Europe. By contrast, they fell in Asia.","In contrast, rural areas have lower incomes."],"key":"By contrast","syn":["on the other hand","whereas","conversely"],"reg":"formal","ielts":"yes","note":"Excellent for comparing data in Task 1."},{"p":"beyond your/out of control","m":"impossible to manage","d":"Used to say a situation cannot be managed or stopped; 'out of control' is also used for behaviour.","ex":["The fire quickly became out of control.","Costs have gone beyond our control."],"key":"out of control","syn":["unmanageable","uncontrollable","out of hand"],"reg":"neutral","ielts":"yes","note":"Common for problems like pollution or crime."},{"p":"under control","m":"being dealt with successfully","d":"Managed or dealt with so that it is not dangerous or harmful.","ex":["The firefighters soon had the fire under control.","The government has the outbreak under control."],"key":"under control","syn":["managed","contained","in hand"],"reg":"neutral","ielts":"yes","note":"Useful for problem-solution essays."},{"p":"take control","m":"begin to manage or lead","d":"To begin to direct or manage a situation or organisation; often followed by 'of'.","ex":["The new manager took control of the department.","Patients should take control of their own health."],"key":"took control of the department","syn":["take charge","take over","assume command"],"reg":"neutral","ielts":"yes","note":"Fits topics on health, government and leadership."},{"p":"at your convenience","m":"at a time that suits you","d":"Polite expression used in letters meaning when it is easy for you.","ex":["Please reply at your convenience.","You may visit us at your convenience."],"key":"at your convenience","syn":["when it suits you","when you are free","at a suitable time"],"reg":"formal","ielts":"yes","note":"Polite ending for formal General Training letters."},{"p":"could have","m":"was possible, but did not happen","d":"Modal structure with past participle, expressing a past possibility that did not happen or a likely guess.","ex":["We could have won the match if we had trained harder.","She could have left already."],"key":"could have won","syn":["might have","was able to but did not","had the chance to"],"reg":"neutral","ielts":"yes","note":"Useful for unreal past situations and speculation."},{"p":"couldn't have","m":"it was impossible that something happened","d":"Modal structure expressing that something was impossible in the past, or showing strong feeling.","ex":["He couldn't have known about the plan.","I couldn't have asked for a better teacher."],"key":"couldn't have known","syn":["can't have","would not have been able to","it was impossible that"],"reg":"neutral","ielts":"careful","note":"Contracted form; write 'could not have' in essays."},{"p":"in due course","m":"at the right time later","d":"At a suitable time in the future, after the proper steps have happened.","ex":["You will receive your results in due course.","The report will be published in due course."],"key":"in due course","syn":["in time","eventually","at the appropriate time"],"reg":"formal","ielts":"yes","note":"Formal; good for letters and predictions."},{"p":"to date","m":"until now","d":"Up to the present time; used in reports and formal writing.","ex":["To date, no cure has been found.","The company has sold ten million units to date."],"key":"To date","syn":["so far","until now","up to now"],"reg":"formal","ielts":"yes","note":"Good for present perfect in Task 1."},{"p":"in those days","m":"at that time in the past","d":"Used to refer to a period in the past when things were different.","ex":["In those days, few families owned a car.","Life was simpler in those days."],"key":"In those days","syn":["back then","at that time","in the past"],"reg":"neutral","ielts":"yes","note":"Useful for past comparisons in Task 2."},{"p":"a good/great deal","m":"a lot; a large amount","d":"Used before 'of' with uncountable nouns, or alone as an adverb meaning much.","ex":["A great deal of research has been done on sleep.","He has improved a good deal."],"key":"A great deal of research","syn":["a large amount","plenty","much"],"reg":"neutral","ielts":"yes","note":"Good formal quantifier with uncountable nouns."},{"p":"death","m":"the end of life","d":"The state of no longer being alive, or the event of dying.","ex":["The death of the president shocked the nation.","Smoking causes millions of deaths every year."],"key":"The death of the president","syn":["demise","passing","end of life"],"reg":"neutral","ielts":"yes","note":"Common noun in health and statistics topics."},{"p":"one metre/6 ft, etc. deep","m":"measuring a certain distance from top to bottom","d":"Pattern for giving depth using a number and unit followed by 'deep'.","ex":["The pool is two metres deep.","They dug a hole six feet deep."],"key":"two metres deep","syn":["in depth","of a depth of","down to"],"reg":"neutral","ielts":"yes","note":"Useful for measurements in Task 1 diagrams."},{"p":"a deep sleep","m":"sleep that is very hard to wake from","d":"A state of sleep from which it is hard to wake someone.","ex":["The baby fell into a deep sleep.","After the long trip, he was in a deep sleep."],"key":"a deep sleep","syn":["sound sleep","heavy sleep","a good night's rest"],"reg":"neutral","ielts":"careful","note":"Good in speaking about sleep and health."},{"p":"deep down","m":"in your true feelings","d":"Used to describe what you really feel or know, even if you do not show it.","ex":["Deep down, I knew I was wrong.","She is confident, but deep down she worries."],"key":"Deep down","syn":["in your heart","privately","inwardly"],"reg":"informal","ielts":"careful","note":"Personal and emotional; fine in speaking."},{"p":"deliver a speech/talk, etc.","m":"give a formal talk to an audience","d":"To give a formal speech or presentation to an audience.","ex":["The mayor delivered a speech to the crowd.","She delivered a talk on climate change."],"key":"delivered a speech","syn":["give a speech","make a presentation","address an audience"],"reg":"formal","ielts":"yes","note":"Good for work and education topics."},{"p":"in depth","m":"in a thorough and detailed way","d":"Adverb phrase meaning in a very detailed and complete way; as an adjective, 'in-depth'.","ex":["The article examines the issue in depth.","They studied the problem in depth."],"key":"in depth","syn":["thoroughly","in detail","comprehensively"],"reg":"formal","ielts":"yes","note":"Use to show detailed analysis in Task 2."},{"p":"be designed for/to do sth","m":"be made for a particular purpose","d":"To be created for a specific purpose; followed by 'for' plus noun or 'to' plus verb.","ex":["The app is designed for beginners.","These tools are designed to save time."],"key":"is designed for beginners","syn":["be intended for","be created to","be made for"],"reg":"neutral","ielts":"yes","note":"Good for describing devices and processes in Task 1."},{"p":"despite the fact that","m":"although; even though","d":"Conjunction used to introduce a surprising fact that contrasts with the main clause.","ex":["He passed despite the fact that he rarely studied.","Despite the fact that prices rose, sales increased."],"key":"despite the fact that","syn":["although","even though","notwithstanding that"],"reg":"formal","ielts":"yes","note":"Formal contrast linker; keep it grammatically correct."},{"p":"go into detail/s","m":"explain something fully","d":"To give all the facts or details about something, rather than a general summary.","ex":["I won't go into details now.","The report goes into detail about funding."],"key":"go into details","syn":["elaborate","explain fully","expand on"],"reg":"neutral","ielts":"yes","note":"Useful for saying you won't expand on a point."},{"p":"make a (big) difference","m":"have an important effect","d":"To cause a noticeable change or improvement; often followed by 'to' or 'for'.","ex":["Recycling can make a big difference to the environment.","Small changes make a difference."],"key":"make a big difference","syn":["have an impact","change things","have a significant effect"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 solutions."},{"p":"difference","m":"the way two things are not the same","d":"The way in which two or more things are unlike each other.","ex":["There is a big difference between city and village life.","The difference in prices is small."],"key":"a big difference between","syn":["contrast","gap","distinction"],"reg":"neutral","ielts":"yes","note":"Key noun for comparisons; use 'between' not 'with'."},{"p":"dig a hole/tunnel","m":"make a hole by removing earth","d":"To make a hole or tunnel by moving soil or rock; verb 'dig' with the object.","ex":["Workers dug a tunnel under the river.","The dog dug a hole in the garden."],"key":"dug a tunnel","syn":["excavate","tunnel","burrow"],"reg":"neutral","ielts":"careful","note":"Useful in construction or Task 1 process descriptions."},{"p":"in sb's direction","m":"towards someone","d":"Towards a person or place, often describing a look or movement.","ex":["She looked in my direction and smiled.","The car was heading in our direction."],"key":"in my direction","syn":["towards","heading to","toward sb"],"reg":"neutral","ielts":"careful","note":"Descriptive; mostly speaking and narratives."},{"p":"discourage sb from doing sth","m":"try to stop someone from doing something","d":"To persuade someone not to do something; followed by 'from' plus -ing.","ex":["High prices discourage people from buying cars.","Teachers should not discourage students from asking questions."],"key":"discourage people from buying cars","syn":["deter sb from","put sb off","dissuade sb from"],"reg":"formal","ielts":"yes","note":"Useful for taxes and policy solutions."},{"p":"be a disgrace","m":"be very shameful","d":"To be so bad that people feel shame or anger; pattern: be a disgrace to sb/sth.","ex":["The state of the roads is a disgrace.","His behaviour was a disgrace to the team."],"key":"is a disgrace","syn":["be shameful","be scandalous","be appalling"],"reg":"neutral","ielts":"careful","note":"Strong emotional wording; keep essays more neutral."},{"p":"do sb good","m":"be useful or healthy for someone","d":"To benefit someone; used for health or helpful effects; pattern: do + object + good.","ex":["A holiday would do you good.","Regular exercise does everyone good."],"key":"would do you good","syn":["benefit","be good for","help"],"reg":"neutral","ielts":"careful","note":"Friendly tone; fine in speaking and informal letters."},{"p":"do damage/harm, etc.","m":"cause harm or injury to something","d":"To cause harm or damage to someone or something; usually followed by 'to' plus the thing affected.","ex":["Heavy use of fertilisers can do serious damage to local rivers.","Constant noise may do harm to children's concentration."],"key":"do serious damage","syn":["cause damage","inflict harm","harm","damage"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 for environmental or health problems."},{"p":"be/have to do with sth","m":"be connected with or about something","d":"To be related to or concerned with a particular subject; often used in negative or question forms.","ex":["The decline in sales has to do with rising production costs.","Her interest in law has a lot to do with her family background."],"key":"has to do with","syn":["be related to","concern","be linked to"],"reg":"neutral","ielts":"careful","note":"Fine in essays; 'be linked to' sounds more academic."},{"p":"a dose of sth","m":"a small amount of something, often unpleasant","d":"A quantity of something, especially medicine, or a small amount of an experience, usually followed by 'of'.","ex":["Students benefit from a dose of realism before choosing a career.","The patient was given a dose of antibiotics twice a day."],"key":"a dose of realism","syn":["a measure of","a small amount of","a touch of"],"reg":"neutral","ielts":"careful","note":"Use figuratively with care; literal use suits health topics."},{"p":"be in doubt","m":"be uncertain or not decided","d":"To be uncertain or not definitely known; used for outcomes, results or decisions.","ex":["The future of the project is still in doubt because of funding cuts.","Her ability to lead the team was never in doubt."],"key":"is still in doubt","syn":["be uncertain","be unclear","be questionable"],"reg":"neutral","ielts":"yes","note":"Good for describing uncertain outcomes in Task 2."},{"p":"draw into/out/away, etc.","m":"move in a direction, as a vehicle or person does","d":"To move steadily in a particular direction, often used of vehicles, e.g. 'draw into a station'.","ex":["The train slowly drew into the station just after noon.","The car drew away from the kerb as the rain began."],"key":"drew into","syn":["pull into","move towards","approach"],"reg":"neutral","ielts":"no","note":"Descriptive; rarely useful in essays, fine in narrative speaking."},{"p":"draw a conclusion","m":"decide something after considering the evidence","d":"To form an opinion or decide something is true based on evidence or reasoning.","ex":["It is difficult to draw a firm conclusion from such a small sample.","From the chart, we can draw the conclusion that sales peaked in 2020."],"key":"draw a firm conclusion","syn":["reach a conclusion","conclude","deduce","infer"],"reg":"neutral","ielts":"yes","note":"Excellent for Task 1 summaries and Task 2 reasoning."},{"p":"draw near/close","m":"come closer in space or time","d":"To approach in distance or time; used for events, deadlines and people.","ex":["As the exam date drew near, the students became anxious.","The ship drew close to the harbour at dawn."],"key":"drew near","syn":["approach","come near","get closer"],"reg":"neutral","ielts":"careful","note":"Fine for narrative; in essays prefer 'approach'."},{"p":"be in a dream","m":"be not paying attention, thinking about other things","d":"To be thinking about something else and not noticing what is happening around you.","ex":["Sorry, I didn't hear you; I was in a dream.","He walked through the corridor as if he were in a dream."],"key":"in a dream","syn":["be daydreaming","be lost in thought","be miles away"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"drive sb mad/crazy, etc.","m":"make someone very annoyed or upset","d":"To irritate someone greatly or push them into an extreme emotional state.","ex":["The constant traffic noise drives residents mad.","Waiting for the results was driving her crazy."],"key":"drives residents mad","syn":["infuriate","annoy greatly","exasperate"],"reg":"informal","ielts":"careful","note":"Good for Speaking; use 'frustrate' or 'infuriate' in essays."},{"p":"on/off duty","m":"working or not working at a given time","d":"Being at work or not at work, especially for police, doctors and soldiers.","ex":["Nurses who are on duty at night need regular breaks.","The officer was off duty when the accident happened."],"key":"on duty","syn":["at work","working","on shift"],"reg":"neutral","ielts":"careful","note":"Useful for work topics; keep to specific professions."},{"p":"not believe your ears","m":"be very surprised by what you hear","d":"To be extremely surprised by something you hear because it seems unlikely.","ex":["When I heard the news, I could not believe my ears.","She could hardly believe her ears when the manager offered her the job."],"key":"could not believe my ears","syn":["be astonished to hear","be amazed"],"reg":"informal","ielts":"no","note":"Spoken or narrative; avoid in formal essays."},{"p":"earn a/your living","m":"get money by working","d":"To make enough money to live on by doing a job.","ex":["Many artists find it hard to earn a living from their work.","He earns his living as a freelance translator."],"key":"earn a living","syn":["make a living","support yourself","get by"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 work and education topics."},{"p":"at ease","m":"relaxed and comfortable","d":"Feeling relaxed and not worried or embarrassed; often used with 'feel' or 'put sb'.","ex":["Good teachers put students at ease on the first day.","She did not feel at ease speaking in front of large groups."],"key":"at ease","syn":["relaxed","comfortable","calm"],"reg":"neutral","ielts":"yes","note":"Useful for Speaking and for education or workplace essays."},{"p":"the East","m":"the eastern part of a country or the Asian world","d":"The eastern region of a country or, historically, Asian countries as opposed to the West.","ex":["Many industries in the East have grown rapidly in recent decades.","Trade between the East and the West has increased dramatically."],"key":"the East","syn":["the Orient","the eastern region","Asia"],"reg":"neutral","ielts":"careful","note":"Be precise; avoid generalising about 'the East' in essays."},{"p":"(be) in your eighties","m":"be aged between eighty and eighty-nine","d":"Aged between 80 and 89; used with a possessive adjective.","ex":["My grandmother is in her eighties but still walks daily.","Many people in their eighties now live independently."],"key":"in her eighties","syn":["aged eighty to eighty-nine","octogenarian"],"reg":"neutral","ielts":"yes","note":"Fine for age-related Task 1 or ageing-society essays."},{"p":"the eighties","m":"the years 1980 to 1989","d":"The decade from 1980 to 1989, or ages 80 to 89.","ex":["Unemployment rose sharply in the eighties.","Home computers became popular during the eighties."],"key":"in the eighties","syn":["the 1980s","the decade 1980-89"],"reg":"neutral","ielts":"careful","note":"In Task 1 write 'the 1980s' rather than words."},{"p":"either side/end, etc.","m":"one or both of two sides or ends","d":"Each of two sides, ends or parts; used with a singular noun after 'either'.","ex":["Trees were planted on either side of the road.","There are shops at either end of the street."],"key":"on either side","syn":["both sides","each side","both ends"],"reg":"neutral","ielts":"yes","note":"Good for describing maps and diagrams in Task 1."},{"p":"the elder","m":"the older of two people, usually in a family","d":"The one of two people, especially family members, who is older.","ex":["The elder of the two brothers took over the family business.","She is the elder of two daughters."],"key":"The elder of the two","syn":["the older","the senior"],"reg":"formal","ielts":"careful","note":"Only for two people; rare in modern essays."},{"p":"the eldest","m":"the oldest of three or more family members","d":"The oldest of three or more children in a family.","ex":["The eldest child often takes on more responsibility at home.","He is the eldest of five brothers."],"key":"The eldest child","syn":["the oldest","the first-born"],"reg":"neutral","ielts":"careful","note":"Use in family topics; avoid for non-family comparisons."},{"p":"or else","m":"otherwise; if not, something bad will happen","d":"Used to say what will happen if something is not done, or as an alternative.","ex":["Governments must act now, or else the damage may be irreversible.","Students should revise carefully, or else they may fail the exam."],"key":"or else","syn":["otherwise","if not","failing that"],"reg":"neutral","ielts":"careful","note":"Slightly spoken; 'otherwise' is safer in essays."},{"p":"for hours/days, etc. on end","m":"continuously for a long time","d":"For a very long period without stopping; the time word is plural.","ex":["Some teenagers play video games for hours on end.","It rained for days on end during the flood."],"key":"for hours on end","syn":["continuously","without a break","non-stop"],"reg":"neutral","ielts":"careful","note":"Good for problems of screen time; slightly informal."},{"p":"no end","m":"a great amount or a lot","d":"A very large amount; used in 'no end of' or as an adverb meaning a lot.","ex":["The new rules caused no end of confusion among staff.","We have been waiting no end of time for the bus."],"key":"no end of confusion","syn":["a great deal","endless amounts","plenty"],"reg":"informal","ielts":"no","note":"Informal; avoid in essays."},{"p":"put an end to sth","m":"stop something completely","d":"To make something stop for good, especially something harmful or unwanted.","ex":["Stricter laws could put an end to illegal dumping.","The treaty put an end to years of conflict."],"key":"put an end to","syn":["stop","eliminate","bring to an end","abolish"],"reg":"neutral","ielts":"yes","note":"Strong phrase for solutions in Task 2."},{"p":"strangely enough","m":"surprisingly","d":"Used to introduce a fact that is surprising or unexpected.","ex":["Strangely enough, the cheaper option produced better results.","Strangely enough, few students used the new library."],"key":"Strangely enough","syn":["oddly enough","surprisingly","curiously"],"reg":"neutral","ielts":"careful","note":"Fine in moderation; 'surprisingly' is more academic."},{"p":"fair enough","m":"used to accept a reasonable point","d":"Used to show that you accept a suggestion or argument as reasonable.","ex":["Fair enough, I will submit the report tomorrow instead.","\"I need more time.\" \"Fair enough.\""],"key":"Fair enough","syn":["all right","that's reasonable","fine"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"ever so","m":"very (informal)","d":"Very or extremely; used before adjectives and adverbs, especially in British English.","ex":["The staff were ever so helpful during my visit.","It is ever so easy to get lost in the city."],"key":"ever so helpful","syn":["very","really","extremely"],"reg":"informal","ielts":"no","note":"Informal and British; fine only in friendly letters."},{"p":"be/mean everything","m":"be extremely important","d":"To be the most important thing to someone.","ex":["For many athletes, winning means everything.","Education meant everything to her parents."],"key":"means everything","syn":["be of utmost importance","matter greatly","be vital"],"reg":"neutral","ielts":"careful","note":"Emphatic; use sparingly in essays."},{"p":"not exactly","m":"not completely or not quite","d":"Used to say something is not completely true, or ironically to mean not at all.","ex":["The results were not exactly what the researchers expected.","The plan is not exactly new, but it is effective."],"key":"not exactly","syn":["not quite","not entirely","hardly"],"reg":"neutral","ielts":"careful","note":"Good for cautious statements; keep tone measured."},{"p":"set an example","m":"behave in a way others should copy","d":"To behave in a way that others can copy, usually a good way.","ex":["Parents should set an example by eating healthily.","Leaders must set an example for their employees."],"key":"set an example","syn":["be a role model","lead by example","show the way"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 on parents, leaders and role models."},{"p":"exchange looks, opinions, views, etc.","m":"give and receive looks or ideas","d":"To give something and receive the same thing back, such as looks or views.","ex":["The two leaders exchanged views on climate policy.","Students exchange ideas freely in small group discussions."],"key":"exchanged views","syn":["share views","swap ideas","trade opinions"],"reg":"neutral","ielts":"yes","note":"Good for communication and education topics."},{"p":"I expect","m":"I think it is likely","d":"Used to say you think something is probably true.","ex":["I expect the exam will be difficult this year.","I expect you are tired after the long journey."],"key":"I expect","syn":["I suppose","I imagine","I think"],"reg":"informal","ielts":"no","note":"Spoken; in essays use 'it is likely that'."},{"p":"be expecting (a baby)","m":"be pregnant","d":"To be pregnant, or to be waiting for a baby or other arrival.","ex":["My sister is expecting a baby in March.","They are expecting their first child this summer."],"key":"is expecting a baby","syn":["be pregnant","be going to have a baby"],"reg":"neutral","ielts":"no","note":"Personal; useful in Speaking about family."},{"p":"be exposed to sth","m":"be in contact with something, often harmful","d":"To be in a situation where you experience something, especially something harmful or new.","ex":["Children are exposed to advertising from a very young age.","Workers were exposed to dangerous chemicals at the plant."],"key":"are exposed to","syn":["come into contact with","be subjected to","experience"],"reg":"neutral","ielts":"yes","note":"Strong for health, media and environment essays."},{"p":"to a great/large, etc. extent","m":"to a large degree","d":"Used to show how far something is true; adjectives like 'great' or 'large' go before 'extent'.","ex":["Success depends to a large extent on hard work.","The problem is to a great extent caused by poor planning."],"key":"to a large extent","syn":["largely","mainly","to a considerable degree"],"reg":"formal","ielts":"yes","note":"Excellent hedging phrase for Task 2 arguments."},{"p":"to some extent/to a certain extent","m":"partly but not completely","d":"Used to say something is true only in part.","ex":["I agree with this view to some extent.","To a certain extent, technology has made life easier."],"key":"to some extent","syn":["partly","in part","up to a point"],"reg":"neutral","ielts":"yes","note":"Great for balanced opinions in Task 2."},{"p":"in sb's eyes","m":"in someone's opinion","d":"According to what someone thinks or judges.","ex":["In the eyes of many voters, the policy was unfair.","In her parents' eyes, she could do no wrong."],"key":"In the eyes of","syn":["in someone's opinion","from someone's view","as seen by"],"reg":"neutral","ielts":"careful","note":"Fine for opinions; prefer 'in the view of' in essays."},{"p":"keep your/an eye on sb/sth","m":"watch someone or something carefully","d":"To watch someone or something carefully to make sure all is well.","ex":["Parents should keep an eye on what children watch online.","Please keep an eye on my bag."],"key":"keep an eye on","syn":["monitor","watch","supervise"],"reg":"informal","ielts":"careful","note":"Idiomatic; use 'monitor' in formal writing."},{"p":"can't face sb/sth/doing sth","m":"not able to deal with something unpleasant","d":"To be unable to deal with something unpleasant, or to meet someone because of shame.","ex":["After the long journey, I couldn't face cooking dinner.","He can't face telling his parents about the exam results."],"key":"couldn't face cooking","syn":["can't bear","dread","be unable to cope with"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"the fact (of the matter) is","m":"the true situation is","d":"Used to introduce the real situation, often after a different suggestion.","ex":["The fact of the matter is that most people prefer cheaper goods.","The fact is that public transport is often unreliable."],"key":"The fact of the matter is","syn":["in reality","the truth is","actually"],"reg":"neutral","ielts":"careful","note":"Useful but can sound blunt; use sparingly."},{"p":"fail to do sth","m":"not succeed in doing something","d":"To not do something that was expected or needed.","ex":["Many companies fail to adapt to new technology.","The government failed to meet its targets."],"key":"fail to adapt","syn":["not manage to","neglect to","be unable to"],"reg":"neutral","ielts":"yes","note":"Good for describing problems and failures in Task 2."},{"p":"failure to do sth","m":"the fact of not doing something expected","d":"The fact of not doing something that you should or are expected to do.","ex":["Failure to act now could have serious consequences.","Failure to follow safety rules may result in fines."],"key":"Failure to act","syn":["neglect","omission","inability"],"reg":"formal","ielts":"yes","note":"Strong formal opener for warnings in Task 2."},{"p":"Yours faithfully","m":"formal ending of a letter to unknown person","d":"A polite closing used at the end of a formal letter that begins 'Dear Sir or Madam'.","ex":["I look forward to your reply. Yours faithfully, J. Brown","Thank you for your time. Yours faithfully, Maria Lopez"],"key":"Yours faithfully","syn":["Yours sincerely","Kind regards","Respectfully"],"reg":"formal","ielts":"yes","note":"Use with 'Dear Sir/Madam' in formal General Training letters."},{"p":"be familiar with sth/sb","m":"know something or someone well","d":"To know something well because you have seen or used it before.","ex":["Most students are familiar with basic computer software.","I am not familiar with this area of the city."],"key":"are familiar with","syn":["know well","be acquainted with","be aware of"],"reg":"neutral","ielts":"yes","note":"Good general phrase for essays and Speaking."},{"p":"fasten sth on/to/together, etc.","m":"attach or join things so they stay in place","d":"To attach or close something so it stays firmly in place.","ex":["Passengers must fasten their seat belts before take-off.","She fastened the papers together with a clip."],"key":"fasten their seat belts","syn":["attach","secure","fix"],"reg":"neutral","ielts":"careful","note":"Concrete verb; fine for process descriptions in Task 1."},{"p":"be in favour of sth","m":"support or agree with something","d":"To support an idea, plan or action; followed by a noun or -ing form.","ex":["Most residents are in favour of building a new park.","I am strongly in favour of banning single-use plastics."],"key":"are in favour of","syn":["support","approve of","back"],"reg":"neutral","ielts":"yes","note":"Clear way to state your position in Task 2."},{"p":"feel different/strange, etc.","m":"have a certain feeling or impression","d":"To experience a particular physical or emotional state, followed by an adjective.","ex":["Living abroad made me feel different from other people.","It felt strange to return to my old school."],"key":"feel different","syn":["seem","experience","sense"],"reg":"neutral","ielts":"careful","note":"Fine for Speaking; essays need more precise adjectives."},{"p":"(be) in your fifties","m":"be aged between fifty and fifty-nine","d":"Aged between 50 and 59; used with a possessive adjective.","ex":["Many people in their fifties return to study part-time.","My uncle is in his fifties and still plays football."],"key":"in their fifties","syn":["aged fifty to fifty-nine","middle-aged"],"reg":"neutral","ielts":"yes","note":"Useful for age groups in Task 1 and society essays."},{"p":"the fifties","m":"the years 1950 to 1959","d":"The decade from 1950 to 1959, or ages 50 to 59.","ex":["Television became common in many homes during the fifties.","Birth rates rose sharply in the fifties."],"key":"during the fifties","syn":["the 1950s","the decade 1950-59"],"reg":"neutral","ielts":"careful","note":"In Task 1 write '1950s' with numbers."},{"p":"fill sb with anger/joy/pride, etc.","m":"make someone feel a strong emotion","d":"To make someone feel a strong emotion.","ex":["The news filled the community with pride.","Seeing the damage filled him with anger."],"key":"filled the community with pride","syn":["make feel","inspire","overwhelm with"],"reg":"neutral","ielts":"careful","note":"Good for descriptive writing; less useful in data essays."},{"p":"find yourself somewhere/doing sth","m":"discover you are in a situation unexpectedly","d":"To realise you are in a place or doing something without planning it.","ex":["Many graduates find themselves working in unrelated jobs.","I found myself laughing at the joke."],"key":"find themselves working","syn":["end up","discover you are","realise you are"],"reg":"neutral","ielts":"yes","note":"Good for describing unexpected outcomes in Task 2."},{"p":"be found","m":"be discovered or be shown to be","d":"To be discovered to be in a place or condition, often in research results.","ex":["Traces of lead were found in the drinking water.","The disease is found mainly in tropical regions."],"key":"were found","syn":["be discovered","be located","occur"],"reg":"formal","ielts":"yes","note":"Common in academic reporting of results."},{"p":"find sb guilty/not guilty","m":"decide in court that someone did or did not commit a crime","d":"To officially decide in court whether someone committed a crime.","ex":["The jury found the defendant guilty of fraud.","The court found her not guilty of the charge."],"key":"found the defendant guilty","syn":["convict","declare guilty","acquit"],"reg":"formal","ielts":"yes","note":"Useful for crime and punishment essays."},{"p":"at first sight","m":"when first seen, before knowing more","d":"When you first see or consider something, before knowing more.","ex":["At first sight, the figures appear to show a steady rise.","It was love at first sight."],"key":"At first sight","syn":["on first impression","initially","apparently"],"reg":"neutral","ielts":"yes","note":"Good for Task 1 overviews, often followed by 'however'."},{"p":"in the first place","m":"at the beginning or originally","d":"Used to talk about the start of a situation or to list a first reason.","ex":["We should ask why the problem arose in the first place.","In the first place, public transport reduces pollution."],"key":"in the first place","syn":["originally","to begin with","firstly"],"reg":"neutral","ielts":"careful","note":"Useful for listing reasons; slightly spoken."},{"p":"fix sth onto/to/under, etc.","m":"attach something firmly in a position","d":"To attach something firmly so it stays in a particular position.","ex":["Engineers fixed solar panels onto the roof.","He fixed a shelf to the wall."],"key":"fixed solar panels onto","syn":["attach","secure","mount"],"reg":"neutral","ielts":"careful","note":"Fine for process descriptions in Task 1."},{"p":"fall flat on your face","m":"fail in an embarrassing way","d":"To fail completely and in an embarrassing way, or to fall forward.","ex":["The company's new product fell flat on its face.","He tripped and fell flat on his face."],"key":"fell flat on its face","syn":["fail badly","flop","come a cropper"],"reg":"informal","ielts":"no","note":"Idiom for Speaking; avoid in essays."},{"p":"the following","m":"the thing or things that come next","d":"Used to introduce a list or statement that comes next.","ex":["The report highlights the following problems.","Please consider the following points before deciding."],"key":"the following problems","syn":["these","as follows","the next"],"reg":"formal","ielts":"yes","note":"Useful for introducing lists in essays and letters."},{"p":"make a fool (out) of sb","m":"make someone look stupid","d":"To make someone appear silly or stupid on purpose.","ex":["The reporter tried to make a fool of the minister.","They made a fool out of him in front of everyone."],"key":"make a fool of","syn":["humiliate","mock","embarrass"],"reg":"informal","ielts":"no","note":"Informal; use 'humiliate' in essays."},{"p":"make a fool of yourself","m":"behave in a way that looks silly","d":"To behave in a silly way that makes others laugh at you.","ex":["I made a fool of myself at the party.","Don't make a fool of yourself by shouting."],"key":"made a fool of myself","syn":["embarrass yourself","look silly","humiliate yourself"],"reg":"informal","ielts":"no","note":"Spoken; fine for Speaking anecdotes."},{"p":"for the moment","m":"for now, but maybe not later","d":"For the present time only.","ex":["For the moment, prices remain stable.","We can manage with this equipment for the moment."],"key":"For the moment","syn":["for now","at present","temporarily"],"reg":"neutral","ielts":"careful","note":"Fine in Task 1; 'at present' is more formal."},{"p":"for once","m":"this one time, unlike usual","d":"On this occasion only, as something unusual.","ex":["For once, the trains ran on time.","For once, the government has listened to experts."],"key":"For once","syn":["on this occasion","just this time"],"reg":"informal","ielts":"careful","note":"Informal tone; use carefully in essays."},{"p":"for real","m":"truly or seriously","d":"Really or seriously, not just pretend.","ex":["Is this offer for real?","They're moving abroad for real this time."],"key":"for real","syn":["genuinely","seriously","truly"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"forget it","m":"do not worry about it","d":"Used to say something is not important or not worth discussing.","ex":["Forget it, it doesn't matter anymore.","Oh, forget it, I'll do it myself."],"key":"Forget it","syn":["never mind","drop it","don't worry"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in writing, except friend letters."},{"p":"forgive me","m":"polite phrase before disagreeing or asking","d":"A polite phrase used to apologise or before asking or disagreeing.","ex":["Forgive me, but I think you have misunderstood the question.","Forgive me for interrupting, but the train is leaving."],"key":"Forgive me","syn":["excuse me","pardon me","I beg your pardon"],"reg":"formal","ielts":"careful","note":"Polite for Speaking Part 3; rare in essays."},{"p":"the former","m":"the first of two things mentioned","d":"The first of two people or things just mentioned.","ex":["Both cars and trains pollute, but the former is worse.","Of the two options, the former is cheaper."],"key":"the former is worse","syn":["the first","the first-mentioned"],"reg":"formal","ielts":"yes","note":"Useful formal reference word; pair with 'the latter'."},{"p":"(be) in your forties","m":"be aged between forty and forty-nine","d":"Aged between 40 and 49; used with a possessive adjective.","ex":["Many professionals in their forties change careers.","My aunt is in her forties and runs a business."],"key":"in their forties","syn":["aged forty to forty-nine","middle-aged"],"reg":"neutral","ielts":"yes","note":"Useful for age groups in Task 1."},{"p":"the forties","m":"the years 1940 to 1949","d":"The decade from 1940 to 1949, or ages 40 to 49.","ex":["Rationing was common in the forties.","The factory opened in the forties."],"key":"in the forties","syn":["the 1940s","the decade 1940-49"],"reg":"neutral","ielts":"careful","note":"In Task 1 write '1940s' with numbers."},{"p":"set sb/sth free","m":"release someone or something","d":"To release a person or animal from prison or a cage.","ex":["The authorities set the prisoners free after the agreement.","Campaigners want zoos to set the animals free."],"key":"set the prisoners free","syn":["release","liberate","let go"],"reg":"neutral","ielts":"yes","note":"Fine for crime, animal rights or history topics."},{"p":"from side to side","m":"moving left and right repeatedly","d":"Moving repeatedly from one side to the other.","ex":["The boat rocked from side to side in the storm.","She shook her head from side to side."],"key":"from side to side","syn":["back and forth","sideways","left and right"],"reg":"neutral","ielts":"careful","note":"Descriptive; rarely needed in essays."},{"p":"from time to time","m":"occasionally","d":"Sometimes but not regularly.","ex":["People should exercise at least from time to time.","I visit my old school from time to time."],"key":"from time to time","syn":["occasionally","now and then","sometimes"],"reg":"neutral","ielts":"yes","note":"Good frequency phrase for Speaking and Task 1."},{"p":"a week/six months/ten years, etc. from now","m":"after a stated period starting today","d":"After the stated period of time, counted from the present moment.","ex":["Ten years from now, most cars may be electric.","I will graduate six months from now."],"key":"Ten years from now","syn":["in a week's time","in ten years' time","after ten years"],"reg":"neutral","ielts":"yes","note":"Useful for predictions in Task 2."},{"p":"make fun of sb/sth","m":"laugh at someone in an unkind way","d":"To laugh at someone or something in an unkind way.","ex":["Children should never make fun of classmates.","They made fun of his accent."],"key":"make fun of classmates","syn":["mock","tease","ridicule"],"reg":"informal","ielts":"careful","note":"Use 'mock' or 'ridicule' in formal essays."},{"p":"in the near future","m":"soon","d":"At a time not far from now.","ex":["Driverless cars may become common in the near future.","The company plans to expand in the near future."],"key":"in the near future","syn":["soon","before long","shortly"],"reg":"neutral","ielts":"yes","note":"Very common in Task 2 predictions."},{"p":"gaze at/into/out of, etc.","m":"look steadily for a long time","d":"To look steadily and for a long time at something, often with surprise or admiration.","ex":["The children gazed at the stars in wonder.","She gazed out of the window during the lesson."],"key":"gazed at the stars","syn":["stare","look fixedly","watch"],"reg":"neutral","ielts":"careful","note":"Narrative or Speaking descriptions; not for essays."},{"p":"in general","m":"usually or in most cases","d":"In most cases, or without looking at details.","ex":["In general, young people use social media more than older people.","Prices in general have risen."],"key":"In general","syn":["generally","on the whole","by and large"],"reg":"neutral","ielts":"yes","note":"Good for Task 1 overviews and Task 2 generalisations."},{"p":"get rid of sth","m":"remove or throw away something","d":"To remove or throw away something unwanted.","ex":["We must get rid of plastic waste.","Many people get rid of old phones too soon."],"key":"get rid of plastic waste","syn":["eliminate","dispose of","discard"],"reg":"neutral","ielts":"careful","note":"Slightly informal; use 'eliminate' or 'dispose of' in essays."},{"p":"get sb/sth to do sth","m":"persuade or cause someone to do something","d":"To make or persuade someone or something to do a task.","ex":["Teachers should get students to take part in discussions.","I could not get the machine to start."],"key":"get students to take part","syn":["persuade","encourage","make"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'encourage' is better in essays."},{"p":"get the feeling/idea/impression, etc.","m":"start to think something is true","d":"To begin to think or sense that something is true.","ex":["I get the impression that many people distrust the news.","She got the feeling that nobody was listening."],"key":"get the impression","syn":["have the sense","gather","suspect"],"reg":"neutral","ielts":"careful","note":"Good for Speaking opinions; use 'it appears' in essays."},{"p":"get on sb's nerves","m":"annoy someone","d":"To irritate someone, especially by doing something repeatedly.","ex":["Loud music on public transport gets on my nerves.","His constant complaining got on her nerves."],"key":"gets on my nerves","syn":["irritate","annoy","bug"],"reg":"informal","ielts":"no","note":"Informal; use for Speaking, not in essays."},{"p":"get to do sth","m":"have the chance to do something","d":"To have an opportunity to do something, or to gradually begin to do it.","ex":["Students rarely get to choose their own subjects.","I got to meet the president last week."],"key":"get to choose","syn":["have the chance to","be allowed to","manage to"],"reg":"informal","ielts":"careful","note":"Informal; 'have the opportunity to' is safer."},{"p":"get over sth/sb","m":"recover from something","d":"To recover from an illness, shock or disappointment.","ex":["It took her months to get over the illness.","Many people struggle to get over the loss of a job."],"key":"get over the illness","syn":["recover from","overcome","come to terms with"],"reg":"neutral","ielts":"careful","note":"Phrasal verb; use 'overcome' in formal writing."},{"p":"give a performance/speech, etc.","m":"present a performance or talk to an audience","d":"To perform or deliver something publicly, such as a speech or concert.","ex":["The president gave a speech about education reform.","The band gave a performance in the city square."],"key":"gave a speech","syn":["deliver a speech","perform","present"],"reg":"neutral","ielts":"yes","note":"Useful for arts and public life topics."},{"p":"glance at/over/through, etc.","m":"look quickly at something","d":"To look quickly at something without reading or studying it carefully.","ex":["She glanced at her watch and left the room.","He glanced through the report before the meeting."],"key":"glanced at her watch","syn":["take a quick look","skim","peek at"],"reg":"neutral","ielts":"careful","note":"Good for narratives and Speaking; not essays."},{"p":"go red","m":"become red in the face from embarrassment","d":"To become red in the face, especially from embarrassment or anger.","ex":["He went red when the teacher asked him a question.","She goes red whenever she speaks in public."],"key":"went red","syn":["blush","flush","turn red"],"reg":"informal","ielts":"no","note":"Informal; fine for Speaking descriptions."},{"p":"it goes without saying","m":"it is obvious","d":"Used to say something is so obvious it needs no explanation; followed by 'that'.","ex":["It goes without saying that education is important.","It goes without saying that safety comes first."],"key":"It goes without saying","syn":["needless to say","obviously","of course"],"reg":"neutral","ielts":"careful","note":"Can sound clichéd; use once at most."},{"p":"it's a good thing","m":"it is fortunate or beneficial","d":"Used to say something is positive or lucky; often followed by 'that'.","ex":["It's a good thing that more people recycle.","It's a good thing we left early."],"key":"It's a good thing","syn":["it is fortunate","it is beneficial","it is positive"],"reg":"informal","ielts":"careful","note":"Use 'it is beneficial that' in essays."},{"p":"Good for you!","m":"well done","d":"Used to praise someone or show approval of their success.","ex":["You passed your driving test? Good for you!","\"I got the job.\" \"Good for you!\""],"key":"Good for you!","syn":["Well done","Congratulations","Nice one"],"reg":"informal","ielts":"no","note":"Spoken only; fine for informal friend letters."},{"p":"take sb/sth for granted","m":"not appreciate someone or something","d":"To not value someone or something because you expect them to always be there.","ex":["Many people take clean water for granted.","Do not take your friends for granted."],"key":"take clean water for granted","syn":["undervalue","overlook","not appreciate"],"reg":"neutral","ielts":"yes","note":"Good for essays about modern life and gratitude."},{"p":"take it for granted","m":"assume something is true without checking","d":"To assume that something is true or will happen without questioning it.","ex":["We take it for granted that schools are free.","Don't take it for granted that everyone agrees."],"key":"take it for granted","syn":["assume","presume","expect"],"reg":"neutral","ielts":"yes","note":"Useful for describing assumptions in Task 2."},{"p":"great big/long, etc.","m":"very big or very long","d":"Used before an adjective to emphasise size or length in an informal way.","ex":["A great big tree blocked the road.","He took a great long walk by the river."],"key":"great big tree","syn":["very big","huge","enormous"],"reg":"informal","ielts":"no","note":"Informal; avoid in essays."},{"p":"a great deal","m":"a large amount","d":"A large amount or degree; used with 'of' or alone as an adverb.","ex":["Students spend a great deal of time online.","Technology has changed a great deal in recent years."],"key":"a great deal of time","syn":["a lot","considerable","a large amount"],"reg":"neutral","ielts":"yes","note":"Good quantity phrase, with uncountable nouns."},{"p":"grow tired/old/calm, etc.","m":"gradually become tired, old or calm","d":"To gradually become a certain state, followed by an adjective.","ex":["Consumers soon grow tired of the same products.","The sea grew calm after the storm."],"key":"grow tired of","syn":["become","get","turn"],"reg":"neutral","ielts":"yes","note":"Good change-of-state phrase for essays."},{"p":"I guess so/not","m":"I suppose yes or no","d":"Used to agree or disagree reluctantly or without being sure.","ex":["\"Is it going to rain?\" \"I guess so.\"","\"Will you come?\" \"I guess not.\""],"key":"I guess so","syn":["I suppose so","probably","I think so"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"not half as good/bad/exciting, etc.","m":"much less good, bad or exciting","d":"Much less good, bad or exciting than something else.","ex":["The film was not half as good as the book.","The traffic was not half as bad as I expected."],"key":"not half as good","syn":["far less","much less","nowhere near as good"],"reg":"informal","ielts":"careful","note":"Informal comparison; avoid in formal essays."},{"p":"on the one hand ... on the other hand","m":"introducing two opposite points","d":"A pair of phrases used to present two contrasting points of view.","ex":["On the one hand, cars are convenient; on the other hand, they cause pollution.","On the one hand, online study is flexible; on the other hand, it can be isolating."],"key":"On the one hand","syn":["while","whereas","in contrast"],"reg":"formal","ielts":"yes","note":"Classic discussion linker for balanced Task 2 essays."},{"p":"hand in hand","m":"closely connected or together","d":"Closely connected, or holding hands with each other.","ex":["Economic growth often goes hand in hand with pollution.","The couple walked hand in hand along the beach."],"key":"hand in hand","syn":["together","closely linked","in tandem"],"reg":"neutral","ielts":"yes","note":"Good for showing links between factors in Task 2."},{"p":"a handful of","m":"a small number of","d":"A small number of people or things.","ex":["Only a handful of students passed the test.","A handful of countries produce most of the oil."],"key":"a handful of students","syn":["a few","a small number of","a minority of"],"reg":"neutral","ielts":"yes","note":"Good for Task 1 when describing small numbers."},{"p":"be hard on sb","m":"treat someone severely or unfairly","d":"To treat someone strictly or unfairly, or to cause difficulty for someone.","ex":["Teachers should not be too hard on young pupils.","The recession was hard on small businesses."],"key":"be too hard on","syn":["be strict with","be harsh with","be tough on"],"reg":"neutral","ielts":"careful","note":"Fine for Speaking; 'strict' is better in essays."},{"p":"have sb over/round/to stay, etc.","m":"invite someone to your home","d":"To invite someone to visit your home, or to stay there.","ex":["We often have friends over at the weekend.","They had their cousins to stay during the summer."],"key":"have friends over","syn":["invite round","host","entertain"],"reg":"informal","ielts":"no","note":"Informal; good for Speaking about home life."},{"p":"have a word with sb","m":"speak to someone briefly","d":"To have a short private talk with someone, often about a problem.","ex":["I will have a word with the manager about the delay.","Could I have a word with you after class?"],"key":"have a word with","syn":["speak to","talk with","consult"],"reg":"informal","ielts":"no","note":"Informal and polite; good for letters to friends."},{"p":"have nothing to do with sb/sth","m":"be unrelated to something","d":"To have no connection with someone or something.","ex":["Her decision had nothing to do with money.","The new rules have nothing to do with safety."],"key":"had nothing to do with","syn":["be unrelated to","have no connection with"],"reg":"neutral","ielts":"careful","note":"Useful for refuting arguments; keep tone neutral."},{"p":"have nothing to do with sb","m":"avoid or refuse any contact with someone","d":"To refuse to meet or be connected with a person.","ex":["After the argument, she would have nothing to do with him.","I want nothing to do with those people."],"key":"have nothing to do with him","syn":["avoid","shun","steer clear of"],"reg":"neutral","ielts":"careful","note":"Fine in narrative; formal essays prefer 'avoid'."},{"p":"head back/down/towards, etc.","m":"move in a particular direction","d":"To go or move in a particular direction.","ex":["After lunch, we headed back to the office.","The ship headed towards the harbour."],"key":"headed back","syn":["go","move towards","make your way"],"reg":"neutral","ielts":"careful","note":"Narrative use; useful in Speaking stories."},{"p":"the headlines","m":"the main news stories","d":"The main stories on news pages or broadcasts.","ex":["Climate change has dominated the headlines this year.","I read the headlines every morning on my phone."],"key":"the headlines","syn":["main news","top stories","front-page news"],"reg":"neutral","ielts":"yes","note":"Good for media and news topics."},{"p":"with all your heart","m":"sincerely and completely","d":"In a very sincere and complete way.","ex":["I hope with all my heart that peace returns.","She loved her country with all her heart."],"key":"with all my heart","syn":["sincerely","wholeheartedly","deeply"],"reg":"neutral","ielts":"careful","note":"Emotional; use in Speaking or personal letters."},{"p":"the hell","m":"used for emphasis in angry questions","d":"An informal and rude emphasising phrase used in questions, e.g. 'What the hell?'.","ex":["What the hell is going on here?","Where the hell have you been?"],"key":"the hell","syn":["on earth","the heck","in the world"],"reg":"informal","ielts":"no","note":"Rude; avoid in all IELTS writing."},{"p":"here and there","m":"in various places","d":"In several different places, not many or close together.","ex":["Small shops were scattered here and there along the road.","Litter was lying here and there on the beach."],"key":"here and there","syn":["in places","scattered about","in various places"],"reg":"neutral","ielts":"careful","note":"Useful for describing maps and scenes."},{"p":"don't hesitate to do sth","m":"feel free to do something","d":"Used to politely encourage someone to ask or contact you.","ex":["Please don't hesitate to contact me if you need help.","Don't hesitate to ask questions in class."],"key":"don't hesitate to contact","syn":["feel free to","do not delay in"],"reg":"formal","ielts":"yes","note":"Good polite closing line in formal letters."},{"p":"catch/get/grab/take hold of sth/sb","m":"grip something or someone","d":"To take something or someone in your hands and hold firmly.","ex":["Take hold of the rope and pull hard.","She grabbed hold of his arm to stop him."],"key":"Take hold of","syn":["grasp","grip","seize"],"reg":"neutral","ielts":"careful","note":"Physical action; rarely used in essays."},{"p":"get hold of sth/sb","m":"find or obtain something or someone","d":"To obtain something, or to manage to contact someone.","ex":["It is hard to get hold of fresh vegetables in winter.","I finally got hold of the manager by phone."],"key":"get hold of","syn":["obtain","contact","track down"],"reg":"informal","ielts":"careful","note":"Use 'obtain' or 'contact' in formal writing."},{"p":"in honour of sb/sth","m":"to show respect for someone or something","d":"As a way of showing great respect or admiration.","ex":["A statue was built in honour of the founder.","The festival is held in honour of the harvest."],"key":"in honour of","syn":["to commemorate","to celebrate","as a tribute to"],"reg":"formal","ielts":"yes","note":"Good for culture and history topics."},{"p":"be/get hooked on sth","m":"become unable to stop doing something","d":"To become addicted to something or very keen on it.","ex":["Many teenagers get hooked on online games.","He was hooked on crime novels."],"key":"get hooked on","syn":["become addicted to","be obsessed with","be keen on"],"reg":"informal","ielts":"careful","note":"Use 'addicted to' in essays."},{"p":"however cold/difficult/slowly, etc.","m":"no matter how cold or difficult","d":"Used to say something is true regardless of how extreme something is.","ex":["However difficult the task is, we must try.","However slowly you walk, you will arrive."],"key":"However difficult","syn":["no matter how","whatever the degree","regardless of how"],"reg":"neutral","ielts":"yes","note":"Good concession structure for Task 2."},{"p":"if so","m":"if that is the case","d":"Used to refer to a situation just mentioned.","ex":["Do you use public transport? If so, how often?","Is this possible? If so, how soon?"],"key":"If so","syn":["in that case","if that is true"],"reg":"neutral","ielts":"yes","note":"Useful in essays when asking rhetorical questions."},{"p":"as if","m":"as though","d":"Used to compare how something seems to how it would be if something were true.","ex":["The city looked as if it had been abandoned.","He talks as if he knew everything."],"key":"as if it had been abandoned","syn":["as though","like","in the manner of"],"reg":"neutral","ielts":"yes","note":"Useful for comparisons; follows a clause."},{"p":"be under the impression","m":"believe something that may be wrong","d":"To believe something that may not be true; followed by 'that'.","ex":["Many people are under the impression that exercise is expensive.","I was under the impression that the shop opened at nine."],"key":"are under the impression","syn":["believe","assume","have the idea"],"reg":"formal","ielts":"yes","note":"Good for challenging common beliefs in Task 2."},{"p":"in two/half","m":"into two parts","d":"Into two equal or separate pieces.","ex":["The ship broke in two during the storm.","Cut the cake in half."],"key":"in two","syn":["into two parts","into halves"],"reg":"neutral","ielts":"careful","note":"Concrete use; occasionally useful in Task 1 processes."},{"p":"in other words","m":"to say the same thing differently","d":"Used to restate an idea in a clearer way.","ex":["The scheme was too costly; in other words, it failed.","Sales fell by half; in other words, the company lost money."],"key":"in other words","syn":["that is to say","put differently","to put it simply"],"reg":"neutral","ielts":"yes","note":"Good linker for clarifying ideas in Task 2."},{"p":"in writing","m":"in written form","d":"In a written document rather than spoken.","ex":["All complaints must be submitted in writing.","Please confirm your offer in writing."],"key":"in writing","syn":["in written form","officially"],"reg":"formal","ielts":"yes","note":"Useful in formal letters and business topics."},{"p":"in season","m":"available at the proper time of year","d":"Available, ready or at its best during the right time of the year.","ex":["Strawberries are cheaper when they are in season.","Fruit that is in season tastes better."],"key":"are in season","syn":["seasonal","at its peak","available now"],"reg":"neutral","ielts":"careful","note":"Good for food and agriculture topics."},{"p":"in secret","m":"without others knowing","d":"Without other people knowing.","ex":["The two leaders met in secret to discuss the treaty.","She wrote songs in secret."],"key":"met in secret","syn":["secretly","covertly","privately"],"reg":"neutral","ielts":"careful","note":"Narrative use; 'secretly' is simpler."},{"p":"in good/high/low, etc. spirits","m":"in a cheerful or sad mood","d":"Feeling happy or sad; the adjective says which.","ex":["The team was in high spirits after the victory.","He seemed in low spirits after the news."],"key":"in high spirits","syn":["cheerful","upbeat","downcast"],"reg":"neutral","ielts":"careful","note":"Fine for narratives and Speaking."},{"p":"in view of sth","m":"because of something","d":"Because of something that has been taken into account.","ex":["In view of the evidence, the plan should be rejected.","In view of recent events, security has been increased."],"key":"In view of the evidence","syn":["considering","given","in light of"],"reg":"formal","ielts":"yes","note":"Strong formal opener for reasons or conclusions."},{"p":"in person","m":"physically present, not by phone or online","d":"Being physically present, rather than by phone or online.","ex":["Applicants must attend the interview in person.","It is easier to make friends in person than online."],"key":"in person","syn":["face to face","personally","in the flesh"],"reg":"neutral","ielts":"yes","note":"Good for online versus face-to-face topics."},{"p":"in place of sth","m":"instead of something","d":"Used instead of something else.","ex":["Many people use bicycles in place of cars.","In place of cash, shoppers now pay by phone."],"key":"in place of cars","syn":["instead of","rather than","as a replacement for"],"reg":"neutral","ielts":"yes","note":"Good formal alternative to 'instead of'."},{"p":"in practice","m":"in real situations, not only in theory","d":"In real situations rather than in theory.","ex":["In practice, few people follow this advice.","The scheme works well in theory but poorly in practice."],"key":"In practice","syn":["in reality","actually","in real life"],"reg":"neutral","ielts":"yes","note":"Good for contrasting theory and reality in Task 2."},{"p":"in private","m":"away from other people","d":"Without other people listening or watching.","ex":["The two ministers discussed the matter in private.","Some issues are better discussed in private."],"key":"in private","syn":["privately","confidentially","behind closed doors"],"reg":"neutral","ielts":"careful","note":"Fine in essays on privacy or confidential matters."},{"p":"in progress","m":"happening now but not finished","d":"Currently happening or being done but not finished.","ex":["Building work is still in progress.","Please be quiet because an exam is in progress."],"key":"is still in progress","syn":["ongoing","under way","in process"],"reg":"formal","ielts":"yes","note":"Good for Task 1 maps showing development."},{"p":"in relation to sth","m":"regarding or compared with something","d":"Concerning something, or when compared with it.","ex":["Salaries have risen in relation to living costs.","The government's role in relation to education is changing."],"key":"in relation to living costs","syn":["regarding","concerning","with regard to"],"reg":"formal","ielts":"yes","note":"Strong formal phrase for Task 1 and 2."},{"p":"in response to","m":"as an answer or reaction to","d":"As a reaction or answer to something.","ex":["The government introduced new laws in response to public anger.","In response to the survey, many firms changed their policy."],"key":"in response to public anger","syn":["in reaction to","as an answer to","following"],"reg":"formal","ielts":"yes","note":"Useful for cause and effect statements."},{"p":"in a row","m":"one after another without a break","d":"Happening one after another without interruption.","ex":["The team won five matches in a row.","It rained for three days in a row."],"key":"in a row","syn":["consecutively","in succession","one after another"],"reg":"neutral","ielts":"yes","note":"Good for describing trends in Task 1."},{"p":"in stock","m":"available in a shop","d":"Available to buy in a shop or warehouse.","ex":["The jacket you want is not in stock.","Most items are in stock all year."],"key":"in stock","syn":["available","on the shelves","in supply"],"reg":"neutral","ielts":"careful","note":"Useful for shopping topics and letters."},{"p":"in turn","m":"one after another in order, or as a result","d":"One after another in order, or as the next step in a chain of effects.","ex":["Higher prices lead to lower demand, which in turn reduces profits.","The children spoke in turn."],"key":"in turn","syn":["consequently","subsequently","one by one"],"reg":"neutral","ielts":"yes","note":"Useful for cause-effect chains in Task 2."},{"p":"inside out","m":"with the inside on the outside","d":"With the inner part facing outwards, or knowing something extremely well.","ex":["He put his shirt on inside out.","She knows the city inside out."],"key":"inside out","syn":["wrong side out","thoroughly","completely"],"reg":"neutral","ielts":"careful","note":"Idiomatic; good for Speaking about places."},{"p":"be/get involved (in/with sth)","m":"take part or be connected","d":"To take part in something or be connected with it.","ex":["Local people should get involved in planning decisions.","He became involved with a charity."],"key":"get involved in","syn":["take part in","participate in","engage in"],"reg":"neutral","ielts":"yes","note":"Good for community and participation topics."},{"p":"in itself","m":"by its own nature, separate from other things","d":"Adverbial phrase used after a noun to refer to something considered alone, apart from related factors.","ex":["The price in itself is not a problem, but the hidden fees are.","Education in itself cannot solve poverty without economic reform."],"key":"in itself","syn":["on its own","per se","by itself"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 to separate one factor from wider issues."},{"p":"do a good/excellent, etc. job","m":"to perform a task well or badly","d":"Verb phrase: do + a + adjective + job, used to evaluate how well someone carries out a task.","ex":["The new mayor has done an excellent job of reducing traffic.","She did a good job organising the conference."],"key":"done an excellent job","syn":["perform well","carry out a task well","handle something well"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; in essays prefer 'perform effectively'."},{"p":"judging by/from","m":"using something as evidence to form an opinion","d":"Participle phrase followed by a noun, introducing the evidence on which a conclusion or guess is based.","ex":["Judging by the latest figures, unemployment will fall next year.","Judging from her accent, she grew up in Scotland."],"key":"Judging by the latest figures","syn":["going by","to judge from","based on"],"reg":"neutral","ielts":"yes","note":"Good for Task 1 and Task 2 predictions based on data."},{"p":"just as","m":"at the same moment as; in the same way as","d":"Conjunction or adverbial phrase meaning at exactly the time that, or in the same way that.","ex":["Just as the lecture began, the projector stopped working.","Women should be treated just as men are in the workplace."],"key":"Just as the lecture began","syn":["at the very moment","exactly when","in the same way as"],"reg":"neutral","ielts":"yes","note":"Use 'just as ... so' for comparisons in Task 2."},{"p":"keep sb waiting","m":"make someone wait for you","d":"Verb phrase: keep + object + waiting, meaning to cause someone to wait, often longer than expected.","ex":["I'm sorry to keep you waiting; the meeting ran late.","The doctor kept patients waiting for over an hour."],"key":"keep you waiting","syn":["make someone wait","delay someone","hold someone up"],"reg":"neutral","ielts":"careful","note":"Good in speaking and General Training letters; rare in essays."},{"p":"keep a/your promise","m":"do what you said you would do","d":"Verb phrase meaning to fulfil a commitment made to someone, with a possessive or article.","ex":["Politicians must keep their promises if they want public trust.","He kept his promise and returned the book on Monday."],"key":"keep their promises","syn":["honour a commitment","fulfil a pledge","stick to your word"],"reg":"neutral","ielts":"yes","note":"Works for politics and trust topics in Task 2."},{"p":"keep notes/records, etc.","m":"write down and save information regularly","d":"Verb phrase: keep + noun such as notes, records, accounts or a diary, meaning to maintain written information over time.","ex":["Hospitals are required to keep accurate records of all patients.","Students should keep notes during every lecture."],"key":"keep accurate records","syn":["maintain records","document","log information"],"reg":"neutral","ielts":"yes","note":"Useful in work, study and administration topics."},{"p":"keep sb/sth in mind","m":"remember and consider something when deciding","d":"Verb phrase meaning to remember a fact or consider it when making a decision or plan.","ex":["Planners must keep the needs of older residents in mind.","Keep this deadline in mind when you schedule your work."],"key":"keep the needs of older residents in mind","syn":["bear in mind","take into account","remember"],"reg":"neutral","ielts":"yes","note":"Good for recommendations and conclusions in Task 2."},{"p":"kill time","m":"do something to pass time while waiting","d":"Verb phrase meaning to spend time on an activity because you are waiting or have nothing better to do.","ex":["We played cards to kill time while waiting for the train.","Many commuters scroll through their phones to kill time."],"key":"kill time","syn":["pass the time","while away the time","fill time"],"reg":"informal","ielts":"careful","note":"Fine in speaking; avoid in formal essays."},{"p":"kind of","m":"to some degree; a type of","d":"Informal adverbial phrase used to soften a statement, or a noun phrase meaning a type of.","ex":["The film was kind of boring at the start.","I felt kind of nervous before the interview."],"key":"kind of boring","syn":["sort of","somewhat","rather"],"reg":"informal","ielts":"no","note":"Spoken filler; use 'rather' or 'somewhat' in writing."},{"p":"know better (than to do sth)","m":"be wise enough not to do something foolish","d":"Idiom: know better (than to do sth), meaning to have enough sense or experience to avoid a mistake.","ex":["You should know better than to leave your bag unattended.","He knew better than to argue with the manager."],"key":"know better than to leave","syn":["have more sense than","be wise enough not to","be old enough to know"],"reg":"neutral","ielts":"careful","note":"Better in speaking; sounds critical in formal writing."},{"p":"I know","m":"I agree with you; I understand","d":"Spoken expression used to show agreement or sympathy with what someone has just said.","ex":["I know, the traffic in this city is terrible.","I know, it's hard to find a quiet place to study."],"key":"I know","syn":["I agree","you're right","exactly"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"to (the best of) my knowledge","m":"as far as I know","d":"Parenthetical phrase used to say that something is true according to what the speaker knows, though not certain.","ex":["To the best of my knowledge, the report has not been published.","To my knowledge, no similar study has been carried out."],"key":"To the best of my knowledge","syn":["as far as I know","as far as I am aware","so far as I know"],"reg":"formal","ielts":"yes
