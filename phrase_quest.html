ng something wrong","d":"To be found doing something wrong or trapped somewhere.","ex":["The thief was caught by the police.","She got caught in the rain."],"key":"was caught","syn":["be arrested","be trapped","be discovered"],"reg":"neutral","ielts":"careful","note":"Passive form; used in crime or weather stories."},{"p":"catch sight of sth","m":"suddenly see something","d":"To see something briefly.","ex":["I caught sight of a rare bird.","She caught sight of him in the crowd."],"key":"caught sight of","syn":["glimpse","spot","notice"],"reg":"neutral","ielts":"careful","note":"Narrative Speaking; not for essays."},{"p":"the turn of the century","m":"the start of a new century","d":"The time when one century ends and another begins.","ex":["At the turn of the century, many people left farms.","Smartphones changed life after the turn of the century."],"key":"the turn of the century","syn":["the beginning of the century","the dawn of the century","the century's start"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 line graphs."},{"p":"(the) chances are","m":"it is likely that","d":"Used to say something is probable.","ex":["Chances are, prices will rise again.","The chances are you have already met him."],"key":"Chances are","syn":["probably","it is likely","most likely"],"reg":"informal","ielts":"careful","note":"Informal; use 'it is likely' in essays."},{"p":"stand a chance","m":"have a chance of success","d":"To have some hope of winning.","ex":["Small teams rarely stand a chance against champions.","Does he stand a chance of winning?"],"key":"stand a chance","syn":["have a chance","be in with a chance","have hope"],"reg":"neutral","ielts":"careful","note":"Often negative or in questions."},{"p":"No chance!/ Not a chance!","m":"definitely not","d":"A strong informal refusal.","ex":["Lend you my car? No chance!","Will he win? Not a chance!"],"key":"No chance!","syn":["no way","certainly not","absolutely not"],"reg":"informal","ielts":"no","note":"Spoken only."},{"p":"press charges","m":"make a formal legal complaint","d":"To officially accuse someone of a crime.","ex":["The victim decided to press charges.","The shop owner did not press charges."],"key":"press charges","syn":["prosecute","take legal action","file a complaint"],"reg":"formal","ielts":"careful","note":"Used in crime topics."},{"p":"a clap of thunder","m":"a sudden loud noise in a storm","d":"A sudden loud sound of thunder.","ex":["A clap of thunder startled the children.","A loud clap of thunder shook the windows."],"key":"A clap of thunder","syn":["a thunderclap","a peal of thunder","a rumble"],"reg":"neutral","ielts":"no","note":"Descriptive; Speaking about weather."},{"p":"crystal clear","m":"very easy to understand or see","d":"Completely clear and easy to understand or see through.","ex":["The instructions were crystal clear.","The water was crystal clear."],"key":"crystal clear","syn":["perfectly clear","transparent","obvious"],"reg":"neutral","ielts":"careful","note":"Good in Speaking; fine in some essays."},{"p":"in the clear","m":"free from blame or danger","d":"No longer suspected or in danger.","ex":["The police told him he was in the clear.","She felt in the clear after the test."],"key":"in the clear","syn":["off the hook","safe","cleared"],"reg":"informal","ielts":"no","note":"Informal."},{"p":"steer clear of sb/sth","m":"avoid someone or something","d":"To keep away from something harmful.","ex":["Doctors advise people to steer clear of sugar.","Steer clear of that area at night."],"key":"steer clear of","syn":["avoid","keep away from","shun"],"reg":"neutral","ielts":"careful","note":"Useful for advice in health essays."},{"p":"sb's/sth's clutches","m":"power or control of someone","d":"The control of a powerful or dangerous person.","ex":["He escaped from the villain's clutches.","The village fell into the clutches of a developer."],"key":"the villain's clutches","syn":["grasp","control","power"],"reg":"neutral","ielts":"careful","note":"Literary; used rarely."},{"p":"collect yourself/your thoughts","m":"calm down and get organised","d":"To become calm and think clearly again.","ex":["She paused to collect her thoughts before answering.","He needed a moment to collect himself."],"key":"collect her thoughts","syn":["compose yourself","gather your thoughts","calm down"],"reg":"neutral","ielts":"yes","note":"Useful for Speaking Part 2 when thinking."},{"p":"come to think of it","m":"now that I think about it","d":"Used when remembering something relevant.","ex":["Come to think of it, I saw her yesterday.","Come to think of it, the film was quite long."],"key":"Come to think of it","syn":["now that I think of it","on reflection","actually"],"reg":"informal","ielts":"no","note":"Spoken only."},{"p":"come to light","m":"become known or discovered","d":"(of facts or secrets) to become publicly known or discovered, often after being hidden; intransitive.","ex":["New evidence came to light during the investigation.","Several errors in the original study have since come to light."],"key":"came to light","syn":["emerge","be revealed","surface","become known"],"reg":"neutral","ielts":"yes","note":"Useful in essays about research, scandals or discoveries."},{"p":"come to the/sb's rescue","m":"help someone in a difficult or dangerous situation","d":"to help or save someone or something that is in trouble or danger; often used of unexpected help.","ex":["When the company faced bankruptcy, a wealthy investor came to its rescue.","Local volunteers came to the rescue of the stranded hikers."],"key":"came to its rescue","syn":["save","bail out","help out","step in"],"reg":"neutral","ielts":"careful","note":"Slightly dramatic; fine for examples in Task 2 about aid or governments."},{"p":"take sth as it comes","m":"accept things as they happen without planning","d":"to deal with events or situations as they occur, without worrying about them in advance.","ex":["I have no fixed plans for the year; I prefer to take things as they come.","She takes life as it comes and rarely gets stressed."],"key":"take things as they come","syn":["go with the flow","play it by ear","live for the moment"],"reg":"informal","ielts":"careful","note":"Good in Speaking Part 1 and 2; avoid in formal essays."},{"p":"come to terms with sth","m":"slowly accept a difficult situation","d":"to gradually accept something unpleasant or difficult and learn to deal with it; followed by a noun or gerund.","ex":["It took him years to come to terms with the loss of his career.","Societies must come to terms with the realities of an ageing population."],"key":"come to terms with","syn":["accept","reconcile yourself to","get used to","resign yourself to"],"reg":"neutral","ielts":"yes","note":"Strong phrase for Task 2 on social change or personal difficulties."},{"p":"come along","m":"appear, arrive or go with someone","d":"to arrive or appear, to accompany someone, or to make progress; intransitive phrasal verb.","ex":["A better opportunity may come along if you are patient.","We are going to the museum; would you like to come along?"],"key":"come along","syn":["turn up","appear","accompany","show up"],"reg":"informal","ielts":"careful","note":"Conversational; fine in Speaking, rare in academic writing."},{"p":"come in","m":"enter a place or be received or become fashionable","d":"to enter a place, to arrive, or to be received or become available; also used for roles and fashions.","ex":["Please come in and take a seat while you wait.","Reports on the earthquake damage are still coming in."],"key":"come in","syn":["enter","arrive","walk in","be received"],"reg":"neutral","ielts":"careful","note":"Fine in letters and speaking; use more specific verbs in essays."},{"p":"No comment.","m":"a polite refusal to answer a question","d":"a fixed expression used to refuse to give an opinion or information, especially to journalists.","ex":["When asked about the rumours, the minister simply replied, \"No comment.\"","The company said \"No comment\" when reporters asked about the lawsuit."],"key":"No comment","syn":["I'd rather not say","I have nothing to add","no statement"],"reg":"neutral","ielts":"no","note":"Spoken response; unsuitable as part of an essay argument."},{"p":"comparative comfort/freedom/silence, etc.","m":"a fairly good level of comfort, freedom or silence","d":"a pattern using 'comparative' before an abstract noun to mean relatively, though not completely, comfortable, free or quiet.","ex":["After the noisy city, they enjoyed the comparative silence of the countryside.","Retirees in the region live in comparative comfort."],"key":"comparative silence","syn":["relative silence","relative comfort","reasonable freedom"],"reg":"formal","ielts":"yes","note":"Elegant for descriptions in Task 1 and Task 2 comparisons."},{"p":"pay sb a compliment","m":"say something nice about someone","d":"to say something that expresses admiration or praise to a person.","ex":["He paid her a compliment on her excellent presentation.","It is polite to pay a host a compliment on the meal."],"key":"paid her a compliment","syn":["praise","compliment","flatter","say something nice to"],"reg":"neutral","ielts":"careful","note":"Good for Speaking and General Training letters; rarely needed in essays."},{"p":"with the compliments of sb","m":"a polite phrase showing something is a free gift","d":"a formal phrase written on gifts or letters to show something is given free by someone as a courtesy.","ex":["The wine was delivered with the compliments of the hotel manager.","The brochure was enclosed with the compliments of the publisher."],"key":"with the compliments of","syn":["courtesy of","as a gift from","with best wishes from"],"reg":"formal","ielts":"careful","note":"Possible in formal General Training letters; not for essays."},{"p":"jump to conclusions","m":"decide something too quickly without enough facts","d":"to form an opinion or judgement too quickly, before knowing all the facts.","ex":["It is unwise to jump to conclusions before examining all the data.","Critics jumped to conclusions about the policy before it had been tested."],"key":"jump to conclusions","syn":["draw hasty conclusions","rush to judgement","make assumptions"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 discussions of media, research and opinion."},{"p":"lead sb to a conclusion","m":"cause someone to form a certain opinion","d":"to cause a person to reach a particular judgement or decision based on evidence.","ex":["The evidence led investigators to the conclusion that the fire was accidental.","These findings lead us to a conclusion that few expected."],"key":"led investigators to the conclusion","syn":["bring sb to a view","cause sb to decide","point to a result"],"reg":"formal","ielts":"yes","note":"Good academic phrase to link evidence with a conclusion."},{"p":"conduct yourself","m":"behave in a particular way","d":"to behave in a stated manner, especially in a formal or public situation; followed by an adverb.","ex":["Candidates are expected to conduct themselves professionally during the interview.","He conducted himself with great dignity throughout the trial."],"key":"conduct themselves","syn":["behave","act","carry yourself","comport yourself"],"reg":"formal","ielts":"yes","note":"Formal; good for essays on behaviour, workplaces and ethics."},{"p":"in confidence","m":"as a secret, trusting the listener not to tell","d":"in a private way, on the understanding that the information will not be shared.","ex":["She told me the news in confidence, so I cannot repeat it.","Patients' records must be treated in confidence by doctors."],"key":"in confidence","syn":["privately","in secret","confidentially"],"reg":"formal","ielts":"yes","note":"Useful for privacy topics in Task 2, such as medical records."},{"p":"a conflict of interest","m":"a situation where personal gain affects fair decisions","d":"a situation in which someone's personal interests may influence their professional duty or judgement.","ex":["The judge withdrew from the case because of a conflict of interest.","Politicians who own shares in companies face a clear conflict of interest."],"key":"a conflict of interest","syn":["divided loyalties","competing interests","ethical clash"],"reg":"formal","ielts":"yes","note":"Strong for Task 2 on politics, business and ethics."},{"p":"be confronted by/with sth","m":"face a problem or difficult situation","d":"to have to deal with a difficult problem or a situation that is hard to avoid; passive construction.","ex":["Many graduates are confronted with high housing costs.","The team was confronted by a series of unexpected obstacles."],"key":"are confronted with","syn":["be faced with","encounter","be up against","come up against"],"reg":"formal","ielts":"yes","note":"Strong academic verb phrase for problems and challenges."},{"p":"in conjunction with sth/sb","m":"together with something or someone","d":"together with or in combination with another thing or person, often in formal contexts.","ex":["The scheme was developed in conjunction with local schools.","Antibiotics should be used in conjunction with rest and fluids."],"key":"in conjunction with","syn":["together with","jointly with","in combination with","alongside"],"reg":"formal","ielts":"yes","note":"Polished linker for cooperation or combined solutions in Task 2."},{"p":"a conscious decision/choice/effort, etc.","m":"something done deliberately and with full awareness","d":"a pattern with 'conscious' to describe an action that is done on purpose and with full awareness.","ex":["She made a conscious decision to reduce her use of plastic.","Governments must make a conscious effort to protect wildlife."],"key":"a conscious decision","syn":["a deliberate decision","an intentional choice","a deliberate effort"],"reg":"neutral","ielts":"yes","note":"Excellent collocation to show intention in Task 2 arguments."},{"p":"consistent with sth","m":"agreeing with or matching something else","d":"in agreement with something, or not contradicting it; followed by a noun.","ex":["The results are consistent with earlier research on sleep.","His account was not consistent with the evidence."],"key":"consistent with","syn":["in line with","compatible with","in keeping with","in accordance with"],"reg":"formal","ielts":"yes","note":"Very useful for Task 1 comparisons and academic claims."},{"p":"be consumed by/with sth","m":"be completely filled with a strong feeling","d":"to be completely taken over by a strong emotion such as guilt, anger or curiosity.","ex":["He was consumed by guilt after the accident.","She was consumed with curiosity about her family's past."],"key":"was consumed by guilt","syn":["be overwhelmed by","be gripped by","be eaten up by"],"reg":"formal","ielts":"careful","note":"Literary tone; good in Speaking descriptions of strong feelings."},{"p":"eye contact","m":"looking directly into another person's eyes","d":"the act of looking directly at another person's eyes while communicating; usually uncountable.","ex":["Good eye contact is important during a job interview.","In some cultures, direct eye contact with elders is considered rude."],"key":"eye contact","syn":["direct gaze","visual contact","looking someone in the eye"],"reg":"neutral","ielts":"yes","note":"Useful in Speaking and Task 2 essays on communication skills."},{"p":"around/round the corner","m":"very near or going to happen soon","d":"very close in distance or about to happen in the near future.","ex":["Exam season is just around the corner for most students.","There is a pharmacy round the corner from my house."],"key":"just around the corner","syn":["imminent","close at hand","coming up","nearby"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; use 'imminent' or 'approaching' in essays."},{"p":"lose count","m":"forget how many there have been","d":"to forget the exact number of something because there are so many; often followed by 'of'.","ex":["I have lost count of how many times the train has been late.","She lost count of the books she had read that year."],"key":"lost count of","syn":["forget how many","miss count","lose track"],"reg":"informal","ielts":"careful","note":"Good for Speaking exaggeration; avoid in formal essays."},{"p":"be/run counter to sth","m":"go against or oppose something","d":"to be opposed to or in conflict with something such as a belief, rule or expectation.","ex":["The new policy runs counter to the government's promises on education.","His findings run counter to popular belief."],"key":"runs counter to","syn":["contradict","go against","conflict with","be at odds with"],"reg":"formal","ielts":"yes","note":"Strong academic phrase to show contrast with expectations."},{"p":"the country","m":"the area outside towns and cities","d":"the rural area away from cities, often with farms and fields; used with 'the'.","ex":["Many families are leaving the city to live in the country.","He grew up in the country and loves open spaces."],"key":"the country","syn":["the countryside","rural areas","the provinces"],"reg":"neutral","ielts":"yes","note":"Common in urban versus rural topics in Task 2 and Speaking."},{"p":"pluck up (the) courage (to do sth)","m":"make yourself brave enough to do something","d":"to make an effort to become brave enough to do something that frightens you; followed by to-infinitive.","ex":["He finally plucked up the courage to ask for a promotion.","She plucked up courage to speak in front of the class."],"key":"plucked up the courage","syn":["summon up the courage","screw up your courage","gather your nerve"],"reg":"informal","ielts":"careful","note":"Good for Speaking stories; prefer 'summon the courage' in essays."},{"p":"the crack of dawn","m":"very early in the morning","d":"the very first light of day, used especially when someone gets up or starts something extremely early.","ex":["Farmers often start work at the crack of dawn.","We left at the crack of dawn to avoid the traffic."],"key":"the crack of dawn","syn":["first light","daybreak","sunrise","the early hours"],"reg":"informal","ielts":"careful","note":"Nice for Speaking about routines; avoid in academic essays."},{"p":"be crawling with sb/sth","m":"be full of many people or things moving around","d":"to be covered with or full of a large number of people, insects or animals, often unpleasantly.","ex":["The beach was crawling with tourists during the holidays.","The old kitchen was crawling with ants."],"key":"was crawling with tourists","syn":["be swarming with","be teeming with","be overrun with"],"reg":"informal","ielts":"careful","note":"Vivid; suits Speaking. 'Teeming with' is safer in essays."},{"p":"to sb's credit","m":"deserving praise for something good done","d":"used to show that a person deserves praise for something, often despite difficulties or mistakes.","ex":["To her credit, she admitted the mistake immediately.","The company, to its credit, has cut emissions by a third."],"key":"To her credit","syn":["admirably","commendably","in fairness to","deserving praise"],"reg":"neutral","ielts":"yes","note":"Nice evaluative phrase for balanced arguments in Task 2."},{"p":"creep along/down/in/out, etc.","m":"move slowly and quietly","d":"to move slowly, quietly and carefully, often so as not to be noticed; also used of slow gradual change.","ex":["The cat crept along the wall towards the bird.","Prices have been creeping up all year."],"key":"crept along","syn":["sneak","tiptoe","inch","steal"],"reg":"neutral","ielts":"careful","note":"'Creep up' is useful for gradual increases in Task 1 trends."},{"p":"cry your eyes out","m":"cry for a very long time","d":"to cry for a long time and with great sadness.","ex":["She cried her eyes out when she heard the sad news.","He cried his eyes out after losing the final."],"key":"cried her eyes out","syn":["sob","weep bitterly","break down in tears"],"reg":"informal","ielts":"no","note":"Spoken idiom; fine in Speaking stories, not in essays."},{"p":"cut sth short or cut short sth","m":"end something earlier than planned","d":"to stop something before its planned end; can be separated by an object or used with the noun after 'short'.","ex":["Bad weather forced them to cut their holiday short.","The president cut short his visit after the earthquake."],"key":"cut their holiday short","syn":["curtail","end early","abbreviate","shorten"],"reg":"neutral","ielts":"yes","note":"Useful for events and disruptions; 'curtail' is more formal."},{"p":"cut out sth or cut sth out","m":"remove something or stop eating or doing it","d":"to remove something by cutting, or to stop using or consuming something; separable phrasal verb.","ex":["Doctors advise patients to cut out sugary drinks.","The editor cut the final paragraph out of the article."],"key":"cut out sugary drinks","syn":["eliminate","give up","remove","exclude"],"reg":"neutral","ielts":"yes","note":"Useful for health and lifestyle topics; 'eliminate' is more formal."},{"p":"Don't you dare","m":"a strong warning not to do something","d":"a forceful spoken warning telling someone not to do something, often followed by a verb.","ex":["Don't you dare touch my laptop while I'm away!","Don't you dare tell her the surprise."],"key":"Don't you dare","syn":["Don't even think of it","I forbid you to","Just try it"],"reg":"informal","ielts":"no","note":"Spoken and angry in tone; avoid in essays and most letters."},{"p":"I dare say","m":"I think it is probably true","d":"used to say that you think something is probably true or likely, often introducing a polite opinion.","ex":["I dare say you will find the exam easier than you expect.","I dare say the experts will disagree."],"key":"I dare say","syn":["I suppose","probably","I daresay","I expect"],"reg":"formal","ielts":"careful","note":"Slightly old-fashioned; acceptable in Speaking to sound thoughtful."},{"p":"drop dead","m":"die suddenly, or rude words telling someone to go away","d":"to die suddenly and unexpectedly; as an imperative, a rude way of telling someone to go away.","ex":["He dropped dead of a heart attack at the age of fifty.","\"Drop dead!\" she shouted at the rude driver."],"key":"dropped dead","syn":["die suddenly","collapse and die","keel over"],"reg":"informal","ielts":"no","note":"Blunt and informal; avoid in IELTS writing."},{"p":"dear to sb/sb's heart","m":"loved or valued very much by someone","d":"very important and loved by someone; used of subjects, places or causes.","ex":["Environmental protection is a cause dear to my heart.","The old village is dear to her heart."],"key":"dear to my heart","syn":["cherished","beloved","close to sb's heart","precious"],"reg":"neutral","ielts":"careful","note":"Good in Speaking about hobbies; slightly emotional for essays."},{"p":"to death","m":"until dead, or to an extreme degree","d":"used after a verb to mean until dead, or to emphasise an extreme level of a feeling.","ex":["The explorers nearly froze to death in the storm.","I am bored to death with this routine."],"key":"to death","syn":["until dead","extremely","fatally"],"reg":"neutral","ielts":"careful","note":"Literal sense is fine; the exaggerated sense is Speaking only."},{"p":"put sb to death","m":"kill someone as a legal punishment","d":"to execute someone officially as punishment for a crime.","ex":["Some countries still put criminals to death for serious crimes.","In the past, traitors were put to death in public."],"key":"put criminals to death","syn":["execute","sentence to death","carry out the death penalty on"],"reg":"formal","ielts":"yes","note":"Fits capital punishment essays; 'execute' is more direct."},{"p":"a matter of life and/or death","m":"a very serious situation where lives are at risk","d":"an extremely serious situation in which someone's life may depend on the outcome.","ex":["For patients awaiting transplants, speed is a matter of life and death.","In an emergency, quick decisions can be a matter of life or death."],"key":"a matter of life and death","syn":["a life-or-death issue","critically urgent","extremely serious"],"reg":"neutral","ielts":"yes","note":"Strong emphasis for health and safety arguments in Task 2."},{"p":"the deceased","m":"a person who has recently died","d":"a formal or legal term for a person who has died, used with 'the'; can be singular or plural.","ex":["The police have not yet named the deceased.","The will of the deceased was read to the family."],"key":"the deceased","syn":["the dead person","the late person","the departed"],"reg":"formal","ielts":"careful","note":"Legal and news register; rarely needed in IELTS essays."},{"p":"deciding factor","m":"the most important thing that decides the result","d":"the factor that has the greatest influence on a final decision or outcome.","ex":["Cost was the deciding factor in choosing the new supplier.","Experience may be the deciding factor when employers select candidates."],"key":"the deciding factor","syn":["key factor","determining factor","decisive element","main consideration"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 when explaining main causes or reasons."},{"p":"dedicate sth to sb","m":"give a book, song or effort to honour someone","d":"to say that a book, performance or achievement is in honour of someone; also to give time or effort to a person or cause.","ex":["The author dedicated her novel to her late mother.","He dedicated his career to helping refugees."],"key":"dedicated her novel to her late mother","syn":["devote to","offer to","inscribe to"],"reg":"neutral","ielts":"yes","note":"Fine in essays about commitment; 'dedicate yourself to' also works."},{"p":"deep in thought/conversation","m":"fully busy thinking or talking and not noticing others","d":"completely absorbed in thinking or talking so that other things are ignored.","ex":["She sat by the window, deep in thought.","The two professors were deep in conversation and did not hear the bell."],"key":"deep in thought","syn":["lost in thought","absorbed","engrossed"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for Speaking stories, less so for essays."},{"p":"the defence","m":"the lawyers who protect the accused in court, or the military","d":"the side in a court case that argues for the accused; also the protection of a country or a team's protective play.","ex":["The defence argued that the evidence was unreliable.","The government plans to increase spending on defence."],"key":"The defence","syn":["the defence team","the accused's lawyers","the military"],"reg":"formal","ielts":"yes","note":"British spelling 'defence'; useful for crime and government spending topics."},{"p":"defy belief/description/explanation, etc.","m":"be too extreme or strange to be believed or explained","d":"to be so unusual, extreme or surprising that it cannot be believed, described or explained.","ex":["The scale of the destruction defies description.","Some of his claims simply defy belief."],"key":"defies description","syn":["be beyond belief","be indescribable","be inexplicable","baffle"],"reg":"formal","ielts":"yes","note":"Impressive for disasters or surprising statistics; use sparingly."},{"p":"a/some degree of sth","m":"a certain amount of something","d":"a limited or moderate amount of a quality or condition; used before an abstract noun.","ex":["The job requires a degree of flexibility.","Some degree of risk is unavoidable in any investment."],"key":"a degree of flexibility","syn":["a certain amount of","a measure of","a level of","some extent of"],"reg":"formal","ielts":"yes","note":"Good hedging phrase for balanced, academic claims."},{"p":"derive comfort/pleasure, etc. from sth","m":"get a good feeling from something","d":"to obtain a feeling or benefit from a particular source; followed by 'from'.","ex":["Many people derive great pleasure from gardening.","Patients derive comfort from the support of their families."],"key":"derive great pleasure from","syn":["get enjoyment from","gain satisfaction from","draw comfort from"],"reg":"formal","ielts":"yes","note":"Academic upgrade for 'get pleasure from' in essays and Speaking."},{"p":"the desired effect/result/shape, etc.","m":"the outcome that someone wants","d":"a pattern with 'desired' meaning the particular outcome or form that someone is trying to achieve.","ex":["The new tax had the desired effect of reducing car use.","Mould the clay until it reaches the desired shape."],"key":"the desired effect","syn":["the intended outcome","the wanted result","the planned effect"],"reg":"formal","ielts":"yes","note":"Good for evaluating policies and solutions in Task 2."},{"p":"a dim memory/recollection, etc.","m":"a memory that is not clear","d":"a memory or recollection that is faint and not detailed; 'dim' is used with memory nouns.","ex":["I have only a dim memory of my first school.","She retained a dim recollection of the accident."],"key":"a dim memory","syn":["a faint memory","a vague recollection","a hazy memory"],"reg":"neutral","ielts":"yes","note":"Good in Speaking Part 2 when describing childhood memories."},{"p":"be a disgrace to sb/sth","m":"be a cause of shame to someone or something","d":"to be so bad that it brings shame on a person, group or institution.","ex":["The state of the roads is a disgrace to the city.","His behaviour was a disgrace to the profession."],"key":"is a disgrace to the city","syn":["be a shame to","dishonour","bring shame on"],"reg":"neutral","ielts":"careful","note":"Strong opinion; tone down in essays with 'unacceptable'."},{"p":"a display of affection/anger, etc.","m":"an open showing of a feeling","d":"an outward expression of an emotion, usually one that others can see.","ex":["Public displays of affection are discouraged in some countries.","The meeting ended with a display of anger from the chairman."],"key":"Public displays of affection","syn":["an expression of","a show of","a demonstration of"],"reg":"neutral","ielts":"yes","note":"Useful for cultural differences and behaviour topics."},{"p":"be disposed to do sth","m":"be likely or willing to do something","d":"to be inclined or ready to act in a particular way; followed by to-infinitive.","ex":["The committee was not disposed to accept the proposal.","Some people are naturally disposed to take risks."],"key":"was not disposed to accept","syn":["be inclined to","be willing to","be prone to","tend to"],"reg":"formal","ielts":"yes","note":"Formal; a high-level alternative to 'be inclined to'."},{"p":"do sb/sth justice; do justice to sb/sth","m":"show or treat someone or something fairly and fully","d":"to represent, treat or show the true qualities of someone or something fully and fairly.","ex":["No photograph can do justice to the beauty of the mountains.","The review did not do justice to her talent."],"key":"do justice to","syn":["represent fairly","show at its best","capture properly"],"reg":"neutral","ielts":"yes","note":"Good for descriptions and evaluations; negative use is common."},{"p":"can't/couldn't very well do sth","m":"unable to do something reasonably or politely","d":"used to say that it would not be sensible or polite to do something; followed by an infinitive without 'to'.","ex":["I couldn't very well refuse after all the help she had given me.","You can't very well complain if you never speak up."],"key":"couldn't very well refuse","syn":["can hardly","could not reasonably","could not really"],"reg":"neutral","ielts":"careful","note":"Natural in Speaking; use 'cannot reasonably' in formal writing."},{"p":"make do (with)","m":"manage with what you have","d":"to manage with something that is not ideal because nothing better is available; often followed by 'with'.","ex":["We had to make do with a small tent during the trip.","Families on low incomes must often make do."],"key":"make do with","syn":["manage with","get by with","improvise","cope with"],"reg":"informal","ielts":"careful","note":"Good for Speaking on budgets and resources; informal in essays."},{"p":"do the trick","m":"work well and solve a problem","d":"to achieve the desired result, often in a simple way.","ex":["A short walk after lunch usually does the trick.","If the printer won't start, restarting it should do the trick."],"key":"does the trick","syn":["work","do the job","solve it","serve the purpose"],"reg":"informal","ielts":"no","note":"Chatty idiom; fine in Speaking, avoid in essays."},{"p":"doom and gloom","m":"a feeling that everything is bad and hopeless","d":"a very negative mood or situation in which the future seems hopeless.","ex":["Despite the doom and gloom in the news, there are signs of recovery.","Economists have predicted doom and gloom for years."],"key":"doom and gloom","syn":["pessimism","despair","negativity","gloom"],"reg":"informal","ielts":"careful","note":"Useful for describing pessimism in media; informal tone."},{"p":"beyond/without a/the shadow of doubt","m":"completely certain","d":"used to say that something is absolutely certain and cannot be questioned.","ex":["The evidence proves beyond a shadow of doubt that he was present.","She is, without a shadow of a doubt, the best candidate."],"key":"beyond a shadow of doubt","syn":["undoubtedly","beyond question","without doubt","indisputably"],"reg":"formal","ielts":"yes","note":"Emphatic; use once in a conclusion to show strong certainty."},{"p":"be down to sb","m":"be someone's responsibility or the result of someone","d":"to be the responsibility of someone, or to be caused by someone or something; British informal.","ex":["The final decision is down to the manager.","Our success was largely down to teamwork."],"key":"is down to","syn":["be up to","be the responsibility of","be due to","be thanks to"],"reg":"informal","ielts":"careful","note":"Common in Speaking; use 'is due to' or 'depends on' in essays."},{"p":"a downward spiral","m":"a situation that keeps getting worse","d":"a continuous worsening of a situation in which one problem causes another.","ex":["The company entered a downward spiral after losing its biggest client.","Unemployment can lead to a downward spiral of debt and poor health."],"key":"a downward spiral","syn":["a steady decline","a vicious circle","a continual worsening"],"reg":"neutral","ielts":"yes","note":"Effective for describing worsening economies or social problems."},{"p":"drag sb along/out/to, etc.","m":"pull or force someone to go somewhere","d":"to pull someone or something with effort, or to make an unwilling person go somewhere.","ex":["My brother dragged me along to the concert.","They dragged the heavy boxes out of the garage."],"key":"dragged me along","syn":["haul","pull","force to come","tow"],"reg":"informal","ielts":"careful","note":"Fine in Speaking stories; avoid in academic writing."},{"p":"a drain on sth","m":"something that uses up too much money or energy","d":"something that uses up resources such as money, time or energy, causing a continual loss.","ex":["The old stadium has become a drain on public funds.","Caring for sick relatives can be a drain on your energy."],"key":"a drain on public funds","syn":["a burden on","a strain on","a constant expense for"],"reg":"neutral","ielts":"yes","note":"Strong for economy, healthcare and government spending essays."},{"p":"draw to a close/end","m":"slowly finish","d":"to be nearly finished; used of events, periods or time; intransitive.","ex":["The conference drew to a close after three days of debate.","As the year draws to an end, many people reflect on their goals."],"key":"drew to a close","syn":["come to an end","wind down","wrap up","approach its end"],"reg":"formal","ielts":"yes","note":"Good for conclusions or describing time periods in Task 1."},{"p":"draw a comparison/distinction","m":"show how two things are similar or different","d":"to point out the similarities or differences between two or more things.","ex":["The report draws a comparison between urban and rural incomes.","It is important to draw a distinction between fact and opinion."],"key":"draws a comparison","syn":["compare","make a distinction","contrast","differentiate"],"reg":"formal","ielts":"yes","note":"Excellent for Task 1 and compare-and-contrast essays."},{"p":"I dread to think","m":"I am afraid to imagine something bad","d":"used to say that you are worried about how bad something might be; often followed by 'what' or 'how'.","ex":["I dread to think what would happen without proper regulation.","I dread to think how much the repairs will cost."],"key":"I dread to think","syn":["I shudder to think","I hate to think","it is frightening to imagine"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; essays can use 'it is worrying to consider'."},{"p":"wouldn't dream of doing sth","m":"would never do something because it is wrong","d":"used to say that you would never consider doing something, as you think it is wrong or unthinkable.","ex":["I wouldn't dream of cheating in an exam.","She wouldn't dream of leaving without saying goodbye."],"key":"wouldn't dream of cheating","syn":["would never think of","would never consider","would not contemplate"],"reg":"neutral","ielts":"careful","note":"Good for Speaking opinions; avoid contractions in essays."},{"p":"drop it/the subject","m":"stop talking about a topic","d":"to stop discussing a topic, often because it causes annoyance or discomfort.","ex":["I asked him to drop the subject because it upset her.","Let's drop it; we will never agree."],"key":"drop the subject","syn":["change the subject","let it go","leave the matter"],"reg":"informal","ielts":"no","note":"Conversational; use only in Speaking or friend letters."},{"p":"dump sth on/in/down, etc.","m":"leave or throw something somewhere carelessly","d":"to put something down or get rid of it carelessly, especially waste; also to leave work or problems on someone.","ex":["Factories were fined for dumping waste in the river.","He dumped his bags on the floor and sat down."],"key":"dumping waste in the river","syn":["discard","offload","get rid of","throw away"],"reg":"neutral","ielts":"yes","note":"Useful for pollution and waste topics in Task 2."},{"p":"play sth by ear","m":"decide what to do as things happen","d":"to deal with a situation without a fixed plan, deciding as it develops; also to play music without notes.","ex":["We have no schedule, so we'll just play it by ear.","The pianist played the tune by ear."],"key":"play it by ear","syn":["improvise","wing it","take it as it comes"],"reg":"informal","ielts":"careful","note":"Good in Speaking about plans; avoid in formal essays."},{"p":"early on","m":"at an early stage","d":"at the beginning of a period of time or process.","ex":["Problems with the design became clear early on.","Children who learn languages early on often speak more fluently."],"key":"early on","syn":["at an early stage","in the beginning","from the outset"],"reg":"neutral","ielts":"yes","note":"Handy time phrase for essays and describing processes."},{"p":"ill at ease","m":"uncomfortable and nervous","d":"feeling anxious or uncomfortable in a particular situation.","ex":["He felt ill at ease among so many strangers.","Many students appear ill at ease when speaking in public."],"key":"ill at ease","syn":["uneasy","uncomfortable","awkward","on edge"],"reg":"formal","ielts":"yes","note":"Good for describing feelings in Speaking and Task 2 examples."},{"p":"easily the best/worst/biggest, etc.","m":"clearly the best or most extreme without doubt","d":"used before a superlative to emphasise that something is clearly better, worse or bigger than others.","ex":["This is easily the best museum in the country.","It was easily the worst storm in decades."],"key":"easily the best","syn":["by far the best","undoubtedly the best","far and away the best"],"reg":"neutral","ielts":"yes","note":"Strengthens superlatives in Task 1 and Task 2."},{"p":"have the edge on/over sb/sth","m":"be slightly better than a competitor","d":"to have a small advantage over someone or something else.","ex":["Electric cars now have the edge over petrol cars in running costs.","Candidates with languages have the edge over others."],"key":"have the edge over","syn":["have the advantage over","be ahead of","outdo","have the upper hand"],"reg":"neutral","ielts":"yes","note":"Useful in comparison essays on competition and business."},{"p":"be on edge","m":"feel nervous and unable to relax","d":"to feel tense, nervous or irritable, especially because of worry.","ex":["Everyone was on edge before the exam results arrived.","The constant noise left residents on edge."],"key":"was on edge","syn":["be tense","be nervous","be anxious","be jumpy"],"reg":"neutral","ielts":"careful","note":"Good in Speaking about feelings; essays may prefer 'anxious'."},{"p":"an educated guess","m":"a guess based on knowledge and experience","d":"an estimate or opinion based on some knowledge or experience, so likely to be fairly accurate.","ex":["Based on past figures, I can make an educated guess about next year's sales.","The forecast is merely an educated guess."],"key":"an educated guess","syn":["an informed estimate","a reasoned guess","a calculated guess"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for forecasts and predictions."},{"p":"in effect","m":"in reality, even if not officially","d":"used to say what the real situation is, although it may officially be described differently.","ex":["The new rule is, in effect, a ban on private cars downtown.","In effect, the two companies have merged."],"key":"in effect","syn":["effectively","in practice","essentially","in reality"],"reg":"formal","ielts":"yes","note":"Helpful to explain real consequences of policies in Task 2."},{"p":"come/go into effect","m":"begin to be officially used or valid","d":"to start to be applied or become legally valid, used of laws and rules.","ex":["The new law comes into effect next January.","The ban went into effect last month."],"key":"comes into effect","syn":["take effect","become law","come into force","begin to apply"],"reg":"formal","ielts":"yes","note":"Precise phrase for laws and policy changes in essays."},{"p":"be an effort","m":"need a lot of energy or hard work","d":"to require great energy or determination to do.","ex":["After the long journey, it was an effort to stay awake.","Climbing the stairs is an effort for elderly people."],"key":"was an effort","syn":["be a struggle","be hard work","be difficult"],"reg":"neutral","ielts":"careful","note":"Good for Speaking; essays can use 'require considerable effort'."},{"p":"your elders","m":"older people who deserve respect","d":"people who are older than you, especially family members, regarded with respect.","ex":["Children are taught to show respect to their elders.","In many cultures, decisions are made by listening to one's elders."],"key":"their elders","syn":["older people","senior members","the older generation"],"reg":"formal","ielts":"yes","note":"Relevant to family, culture and generation gap essays."},{"p":"an element of sth","m":"a small part of a quality","d":"a certain amount of a quality or feature, often a small one.","ex":["There is an element of truth in his argument.","Every investment carries an element of risk."],"key":"an element of truth","syn":["a degree of","a trace of","a measure of","a touch of"],"reg":"formal","ielts":"yes","note":"Good hedging phrase for balanced arguments."},{"p":"or else","m":"otherwise, or something bad will happen","d":"used to say that if something is not done, a bad result will follow; also a mild threat.","ex":["Leave now, or else you will miss the train.","Employers must follow safety rules or else they risk heavy fines."],"key":"or else","syn":["otherwise","if not","failing that"],"reg":"neutral","ielts":"careful","note":"Better to use 'otherwise' in formal essays."},{"p":"odds and ends","m":"small things of different kinds","d":"small items of various types that are not very important or valuable.","ex":["The drawer was full of odds and ends.","She spent the day doing odds and ends around the house."],"key":"odds and ends","syn":["bits and pieces","bits and bobs","miscellaneous items"],"reg":"informal","ielts":"careful","note":"Fine for Speaking and informal letters; avoid in essays."},{"p":"a means to an end","m":"something used only to reach a goal","d":"something that is not valuable in itself but is useful for achieving something else.","ex":["For many students, a degree is simply a means to an end.","Money should be a means to an end, not a goal."],"key":"a means to an end","syn":["a stepping stone","a tool for","a route to a goal"],"reg":"neutral","ielts":"yes","note":"Effective in education and work essays."},{"p":"the tail end of sth","m":"the very last part of something","d":"the final part of a period or event.","ex":["We arrived at the tail end of the festival.","Prices dropped at the tail end of the year."],"key":"the tail end of","syn":["the final part of","the last stage of","the closing phase of"],"reg":"informal","ielts":"careful","note":"Acceptable in Task 1 descriptions of time; 'final stage' is safer."},{"p":"be endowed with sth","m":"naturally have a good quality or ability","d":"to naturally possess a particular quality or ability, or to be given money or property; passive.","ex":["She is endowed with remarkable musical talent.","The country is richly endowed with natural resources."],"key":"is endowed with","syn":["be blessed with","be gifted with","possess","be equipped with"],"reg":"formal","ielts":"yes","note":"Good for talent and natural resources topics."},{"p":"sure enough","m":"just as expected","d":"used to say that something happened as you expected or predicted.","ex":["He warned that prices would rise, and sure enough, they did.","I thought it would rain, and sure enough it poured."],"key":"sure enough","syn":["as expected","predictably","just as predicted"],"reg":"informal","ielts":"careful","note":"Good in Speaking stories; avoid in formal essays."},{"p":"be the envy of sb","m":"be something others wish they had","d":"to be so good that other people wish they had it.","ex":["The city's public transport is the envy of many nations.","Her garden was the envy of the neighbourhood."],"key":"is the envy of","syn":["be admired by","be coveted by","make others jealous"],"reg":"neutral","ielts":"yes","note":"Useful to praise systems or achievements in Task 2."},{"p":"(be) green with envy","m":"very jealous","d":"extremely jealous of someone or something that another person has.","ex":["She was green with envy when she saw her friend's new house.","I'm green with envy over your holiday!"],"key":"green with envy","syn":["very jealous","envious","consumed by envy"],"reg":"informal","ielts":"careful","note":"Idiom for Speaking; avoid in essays."},{"p":"margin of error","m":"the amount by which a result may be wrong","d":"the amount by which a calculation or estimate may be inaccurate, often expressed as a percentage.","ex":["The poll has a margin of error of three per cent.","Engineers allow a small margin of error in every calculation."],"key":"a margin of error","syn":["tolerance","allowance for error","degree of uncertainty"],"reg":"formal","ielts":"yes","note":"Useful for statistics and research in Task 1 and Task 2."},{"p":"trial and error","m":"learning by trying and correcting mistakes","d":"a method of finding a solution by trying different ways and learning from the failures.","ex":["He learned to cook through trial and error.","Scientists often progress by trial and error."],"key":"trial and error","syn":["experimentation","testing and learning","hit and miss"],"reg":"neutral","ielts":"yes","note":"Good for learning and science topics."},{"p":"a narrow escape","m":"a lucky avoidance of danger","d":"a situation in which someone only just avoids danger or harm.","ex":["The driver had a narrow escape when the bridge collapsed.","They had a narrow escape from the fire."],"key":"a narrow escape","syn":["a close call","a near miss","a lucky escape"],"reg":"neutral","ielts":"careful","note":"Good for Speaking stories; 'near miss' fits safety essays."},{"p":"in essence","m":"in the most basic way","d":"used to talk about the basic or most important nature of something.","ex":["In essence, the two proposals are identical.","The debate is, in essence, about fairness."],"key":"In essence","syn":["essentially","fundamentally","basically","at heart"],"reg":"formal","ielts":"yes","note":"Strong linker for summing up arguments."},{"p":"turn of events","m":"the way a situation develops, especially unexpectedly","d":"the way in which a situation changes or develops, often surprisingly.","ex":["This unexpected turn of events surprised everyone.","Given the latest turn of events, the plan must change."],"key":"turn of events","syn":["development","twist","course of events"],"reg":"neutral","ielts":"yes","note":"Useful for narrating changes in Task 2 examples."},{"p":"ever such a","m":"very, used before an adjective and noun","d":"a British informal intensifier meaning very, used before a noun phrase.","ex":["She is ever such a kind person.","It was ever such a lovely day."],"key":"ever such a","syn":["such a","really a","very"],"reg":"informal","ielts":"no","note":"Spoken British intensifier; avoid in essays."},{"p":"ever- changing/growing/increasing, etc.","m":"always changing, growing or increasing","d":"a pattern with 'ever-' before a participle to show a continuing process.","ex":["We live in an ever-changing world.","The ever-increasing cost of housing worries young people."],"key":"ever-changing","syn":["constantly changing","continually growing","perpetual"],"reg":"neutral","ielts":"yes","note":"Useful modifier for trends and technology topics."},{"p":"every so often","m":"sometimes but not regularly","d":"occasionally, at irregular intervals.","ex":["Every so often, the system crashes without warning.","I visit my old school every so often."],"key":"Every so often","syn":["occasionally","from time to time","now and then","once in a while"],"reg":"informal","ielts":"careful","note":"Fine for Speaking frequency; use 'occasionally' in writing."},{"p":"every other day/week, etc.","m":"once in every two days or weeks","d":"every second day, week or other period, with one period missed between each.","ex":["The bins are collected every other week.","He plays football every other day."],"key":"every other week","syn":["alternate days","every second day","on alternate weeks"],"reg":"neutral","ielts":"yes","note":"Useful for frequency in Task 1 and Speaking."},{"p":"a/the prime example","m":"the best or clearest example","d":"the most typical or clearest example of something.","ex":["Tokyo is a prime example of a well-planned transport system.","This is the prime example of successful reform."],"key":"a prime example","syn":["a classic example","a perfect illustration","a textbook case"],"reg":"formal","ielts":"yes","note":"Excellent for introducing examples in Task 2."},{"p":"excel yourself","m":"do even better than usual","d":"to perform exceptionally well, better than you normally do.","ex":["The chef really excelled himself with tonight's meal.","The team excelled themselves in the final."],"key":"excelled himself","syn":["surpass yourself","outdo yourself","do your best ever"],"reg":"neutral","ielts":"careful","note":"Good in Speaking and letters of praise."},{"p":"take exception to sth","m":"be offended or annoyed by something","d":"to feel offended or annoyed by something that was said or done.","ex":["Many residents took exception to the new parking charges.","He took exception to being called lazy."],"key":"took exception to","syn":["object to","take offence at","resent","be annoyed by"],"reg":"formal","ielts":"yes","note":"Good for formal complaint letters and reactions to policy."},{"p":"do sth to excess","m":"do something too much","d":"to do something more than is healthy or reasonable.","ex":["Eating sweets to excess can damage your health.","He drinks to excess on weekends."],"key":"to excess","syn":["too much","excessively","immoderately"],"reg":"formal","ielts":"yes","note":"Useful in health and lifestyle essays."},{"p":"exclusive of sth","m":"not including something","d":"not counting or including a particular thing, often a cost.","ex":["The price is exclusive of tax.","The total is exclusive of delivery charges."],"key":"exclusive of tax","syn":["excluding","not including","without"],"reg":"formal","ielts":"yes","note":"Useful for prices and figures in Task 1."},{"p":"extend from/into/over, etc.","m":"reach or stretch to a certain point","d":"to reach, stretch or cover a certain area or time.","ex":["The forest extends from the coast to the mountains.","The meeting extended into the evening."],"key":"extends from the coast to","syn":["stretch","reach","span","run"],"reg":"neutral","ielts":"yes","note":"Good for describing maps and time periods in Task 1."},{"p":"the extent to which","m":"how much something is true or happens","d":"used to talk about the degree to which something is true or has an effect.","ex":["The study examines the extent to which diet affects health.","It is unclear the extent to which technology helps learning."],"key":"the extent to which","syn":["the degree to which","how far","how much"],"reg":"formal","ielts":"yes","note":"Perfect for essay questions beginning 'To what extent'."},{"p":"the naked eye","m":"normal sight without a telescope or microscope","d":"human sight without the help of instruments.","ex":["Some stars are visible to the naked eye.","The bacteria are invisible to the naked eye."],"key":"the naked eye","syn":["unaided vision","unaided eye","plain sight"],"reg":"neutral","ielts":"yes","note":"Useful in science topics."},{"p":"in your mind's eye","m":"in your imagination or memory","d":"in your imagination or memory, seeing a picture of something.","ex":["In my mind's eye, I can still see the old house.","She pictured the event in her mind's eye."],"key":"In my mind's eye","syn":["in your imagination","in your memory","mentally"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for Speaking Part 2 memories."},{"p":"roll your eyes","m":"move your eyes up to show annoyance","d":"to move your eyes upwards to show annoyance or disbelief.","ex":["She rolled her eyes when he told the same joke again.","Teenagers often roll their eyes at advice."],"key":"rolled her eyes","syn":["show disbelief","look exasperated"],"reg":"informal","ielts":"careful","note":"Spoken or descriptive; avoid in academic essays."},{"p":"the fabric of sth","m":"the basic structure of a society or system","d":"the basic structure that holds a society or organisation together.","ex":["Immigration has shaped the fabric of modern Britain.","Corruption threatens the very fabric of society."],"key":"","syn":["the structure of","the foundation of","the framework of"],"reg":"formal","ielts":"yes","note":"Strong in Task 2 on society and community."},{"p":"let's face it","m":"we must accept an unpleasant truth","d":"used to introduce a fact that is unpleasant but must be accepted.","ex":["Let's face it, nobody enjoys long commutes.","Let's face it, some jobs will disappear."],"key":"Let's face it","syn":["admit it","the truth is","to be honest"],"reg":"informal","ielts":"no","note":"Chatty; use 'it must be acknowledged' in essays."},{"p":"I fail to see/understand","m":"I cannot understand something","d":"a formal way to say you do not understand or agree with something.","ex":["I fail to see why the project needs more funding.","I fail to understand how this policy helps."],"key":"I fail to see","syn":["I cannot see","I do not understand","it escapes me"],"reg":"formal","ielts":"careful","note":"Useful for polite disagreement; avoid 'I' in academic essays."},{"p":"feel faint","m":"feel weak as if you may collapse","d":"to feel dizzy and weak, as though about to lose consciousness.","ex":["I felt faint after standing in the sun.","She felt faint at the sight of blood."],"key":"felt faint","syn":["feel dizzy","feel light-headed","feel giddy"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking about health."},{"p":"not have the faintest idea","m":"know nothing about something","d":"to have no knowledge at all about something.","ex":["They don't have the faintest idea how the system works.","I haven't the faintest idea where she went."],"key":"don't have the faintest idea","syn":["have no idea","not have a clue","have not the slightest notion"],"reg":"informal","ielts":"no","note":"Spoken only."},{"p":"a fair amount/distance/size, etc.","m":"quite a large amount, distance or size","d":"a reasonably large quantity, distance or size.","ex":["The project required a fair amount of money.","It is a fair distance from the station."],"key":"a fair amount of money","syn":["quite a lot of","a considerable amount","a reasonable amount"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; use 'considerable' in essays."},{"p":"fair play","m":"honest and equal treatment","d":"respect for rules and honest behaviour towards others, especially in sport.","ex":["Referees are expected to ensure fair play.","The competition emphasises fair play over winning."],"key":"fair play","syn":["sportsmanship","honest dealing","justice"],"reg":"neutral","ielts":"yes","note":"Good for sport and ethics essays."},{"p":"darkness/night falls","m":"it becomes dark","d":"the period of dark begins; used literally of the coming of night.","ex":["The streets empty as darkness falls.","Night fell and the campers lit a fire."],"key":"darkness falls","syn":["night comes","dusk arrives","the sun sets"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for Speaking Part 2 narratives."},{"p":"fall prey to sth","m":"be harmed or attacked by something","d":"to be harmed, attacked or tricked by something.","ex":["Elderly people often fall prey to online scams.","Many animals fall prey to larger predators."],"key":"fall prey to","syn":["become a victim of","succumb to","be exploited by"],"reg":"formal","ielts":"yes","note":"Strong for crime, health and internet topics."},{"p":"fall short of sth","m":"fail to reach the expected level","d":"to be not as good or large as expected or needed.","ex":["The results fell short of expectations.","Funding fell short of the target."],"key":"fell short of","syn":["not meet","fail to reach","be inadequate"],"reg":"formal","ielts":"yes","note":"Excellent for Task 1 targets and policy evaluations."},{"p":"familiarize sb/yourself with sth","m":"learn about something so you know it well","d":"to learn about something or teach someone so that they know it well.","ex":["Students should familiarize themselves with the exam format.","The guide familiarized visitors with local customs."],"key":"familiarize themselves with","syn":["acquaint with","get to know","become acquainted with"],"reg":"formal","ielts":"yes","note":"Good for study and training topics; British spelling 'familiarise' also fine."},{"p":"far from doing sth","m":"not at all doing something, the opposite","d":"used to say that someone is not doing something, and may be doing the opposite.","ex":["Far from solving the problem, the new law made it worse.","Far from being lazy, he works long hours."],"key":"Far from solving","syn":["instead of","rather than","by no means"],"reg":"neutral","ielts":"yes","note":"Strong contrast structure in Task 2."},{"p":"go so far as to do sth","m":"do something extreme","d":"to do or say something extreme.","ex":["Some critics go so far as to call the scheme a fraud.","She went so far as to quit her job."],"key":"go so far as to call","syn":["even go as far as","venture to","take it to the point of"],"reg":"neutral","ielts":"yes","note":"Good for strong claims in essays."},{"p":"go too far","m":"do something beyond what is acceptable","d":"to behave in a way that is more extreme than acceptable.","ex":["The tabloid went too far by publishing private photographs.","Some reforms may go too far."],"key":"went too far","syn":["overstep","cross the line","go overboard"],"reg":"neutral","ielts":"yes","note":"Useful for debating limits in Task 2."},{"p":"few and far between","m":"rare and not often found","d":"rare and found at long intervals or in few places.","ex":["Good jobs are few and far between in rural areas.","Public libraries are few and far between here."],"key":"few and far between","syn":["scarce","rare","thin on the ground","hard to find"],"reg":"neutral","ielts":"yes","note":"Good idiom to describe scarcity in Task 2."},{"p":"be far removed from sth","m":"be very different from something","d":"to be very different or distant from something.","ex":["Modern farming is far removed from traditional methods.","His lifestyle is far removed from mine."],"key":"is far removed from","syn":["be very different from","be remote from","be a long way from"],"reg":"formal","ielts":"yes","note":"Good comparison phrase in Task 2."},{"p":"the far left/right","m":"extreme political groups on the left or right","d":"political groups with extreme left-wing or right-wing views.","ex":["Support for the far right has grown across Europe.","The party has been attacked by the far left."],"key":"the far right","syn":["extremists","radicals","the extreme left or right"],"reg":"neutral","ielts":"careful","note":"Fine for politics topics; avoid unfair labels."},{"p":"a faraway look/expression","m":"a dreamy expression showing absent thoughts","d":"an expression of someone thinking about something distant or not paying attention.","ex":["She had a faraway look in her eyes.","He wore a faraway expression during the meeting."],"key":"a faraway look","syn":["a dreamy look","a distant stare","a vacant expression"],"reg":"neutral","ielts":"careful","note":"Descriptive; Speaking Part 2 people descriptions."},{"p":"thick and fast","m":"in large numbers very quickly","d":"in large numbers and at great speed.","ex":["Complaints came in thick and fast after the broadcast.","Ideas came thick and fast during the workshop."],"key":"thick and fast","syn":["in large numbers","rapidly","in quick succession"],"reg":"informal","ielts":"careful","note":"Vivid for Speaking; use 'rapidly' in essays."},{"p":"find fault with sb/sth","m":"criticise someone or something","d":"to look for and point out mistakes or problems in someone or something.","ex":["Critics find fault with the new curriculum.","She always finds fault with my work."],"key":"find fault with","syn":["criticise","pick holes in","complain about","object to"],"reg":"neutral","ielts":"yes","note":"Usable in essays on criticism and policy."},{"p":"in favour of sb/sth","m":"supporting or agreeing with something","d":"supporting or approving of a person, idea or plan.","ex":["Most voters are in favour of the reform.","I am in favour of longer school holidays."],"key":"in favour of","syn":["supportive of","for","pro","on the side of"],"reg":"neutral","ielts":"yes","note":"Core phrase for opinion essays."},{"p":"for fear of sth/doing sth","m":"because you are afraid of something","d":"because of anxiety that something bad may happen.","ex":["Many people avoid flying for fear of accidents.","She kept quiet for fear of upsetting him."],"key":"for fear of","syn":["out of fear of","in case of","lest"],"reg":"formal","ielts":"yes","note":"Useful to explain motives in Task 2."},{"p":"fear the worst","m":"think that something very bad has happened","d":"to expect that a very bad thing has happened or will happen.","ex":["When he did not call, his parents feared the worst.","Residents feared the worst as the flood waters rose."],"key":"feared the worst","syn":["expect the worst","dread the worst","be afraid of the worst"],"reg":"neutral","ielts":"careful","note":"Good for narratives in Speaking."},{"p":"be no mean feat","m":"be a hard and impressive achievement","d":"to be an achievement that is difficult and impressive.","ex":["Building the tunnel in two years was no mean feat.","Raising three children alone is no mean feat."],"key":"was no mean feat","syn":["be an impressive achievement","be no small task","be a real accomplishment"],"reg":"neutral","ielts":"yes","note":"Good idiom for praising achievements."},{"p":"fill a need/gap/demand","m":"provide something that is missing or wanted","d":"to provide what is lacking or wanted.","ex":["The new bus service fills a real need in the village.","Online courses fill a gap in adult education."],"key":"fills a real need","syn":["meet a need","satisfy demand","plug a gap"],"reg":"neutral","ielts":"yes","note":"Very useful for describing solutions."},{"p":"filter down/in/through, etc.","m":"pass slowly through something or spread gradually","d":"to pass slowly through a barrier or to spread gradually from one group to another.","ex":["Light filtered through the curtains.","News of the decision slowly filtered down to staff."],"key":"filtered through","syn":["seep","trickle","percolate","spread slowly"],"reg":"neutral","ielts":"yes","note":"Useful for describing information spreading in Task 2."},{"p":"filter down/through/out, etc.","m":"spread gradually through a system","d":"to spread slowly through a system or social group, or to be removed gradually.","ex":["The benefits of growth rarely filter down to the poor.","Weaker applicants are filtered out early."],"key":"filter down to","syn":["trickle down","spread","seep through"],"reg":"neutral","ielts":"yes","note":"Good for economic inequality essays."},{"p":"pulse","m":"the regular beat of blood in the body","d":"the regular beating of the heart as felt in the wrist; also a short signal or burst of energy.","ex":["The nurse checked the patient's pulse.","Her pulse quickened as she walked on stage."],"key":"pulse","syn":["heartbeat","pulsation","rhythm"],"reg":"neutral","ielts":"yes","note":"Neutral medical or science word."},{"p":"set fire to sth; set sth on fire","m":"make something start to burn","d":"to make something start burning, deliberately or by accident.","ex":["Protesters set fire to several vehicles.","Lightning set the barn on fire."],"key":"set fire to","syn":["ignite","torch","burn","light"],"reg":"neutral","ielts":"yes","note":"Fine in crime and disaster topics."},{"p":"fire sb's imagination","m":"make someone feel excited and creative","d":"to excite someone's interest and creativity.","ex":["The documentary fired the children's imagination.","Space travel fired his imagination."],"key":"fired the children's imagination","syn":["inspire","stimulate","capture the imagination of"],"reg":"neutral","ielts":"yes","note":"Good for education and art topics."},{"p":"be a first","m":"be something that has never happened before","d":"to be an event or achievement that has not happened before.","ex":["The mission was a first for the country.","Winning the prize was a first for our school."],"key":"was a first","syn":["be unprecedented","be groundbreaking","be new"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 and Task 2 achievements."},{"p":"flash by/past/through, etc.","m":"move or pass very quickly","d":"to pass or move very quickly, or to appear suddenly in the mind.","ex":["The scenery flashed by outside the train window.","A thought flashed through her mind."],"key":"flashed by","syn":["speed past","whizz by","dart","zoom"],"reg":"neutral","ielts":"careful","note":"Descriptive; Speaking narratives."},{"p":"in a flash","m":"very quickly; in an instant","d":"Idiom meaning extremely quickly or immediately; used as an adverbial phrase, usually with past or future events.","ex":["The idea came to her in a flash, and she rewrote the entire proposal.","Technological change can transform whole industries in a flash."],"key":"in a flash","syn":["in an instant","in no time","immediately"],"reg":"neutral","ielts":"careful","note":"Vivid idiom; fine in speaking, use sparingly in essays."},{"p":"a flight of stairs/steps","m":"a set of stairs between two floors or levels","d":"A continuous series of steps leading from one level to another, often without a turn or landing.","ex":["The archive is located at the top of a flight of stairs.","Older residents struggle when there is no lift and several flights of steps to climb."],"key":"a flight of stairs","syn":["a staircase","a set of steps"],"reg":"neutral","ielts":"careful","note":"Useful in descriptive speaking or accessibility topics; rare in essays."},{"p":"it follows that","m":"as a logical result, we can conclude that","d":"Used to introduce a logical conclusion drawn from a previous statement, followed by a clause.","ex":["If the population keeps ageing, it follows that healthcare costs will rise.","If cities invest heavily in cycling, it follows that car use should decline."],"key":"it follows that","syn":["it can be concluded that","consequently","therefore"],"reg":"formal","ielts":"yes","note":"Good for Task 2 reasoning; make sure the logic really follows."},{"p":"follow sb's example/lead","m":"copy what someone else has done","d":"To behave in the same way as another person or organisation, taking them as a model.","ex":["Smaller firms are likely to follow the lead of the industry's largest players.","Many students follow their teachers' example and read widely."],"key":"follow the lead of","syn":["copy","imitate","take a cue from"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 about role models, governments and companies."},{"p":"follow suit","m":"do the same as someone else has just done","d":"To do the same thing as another person or organisation has just done; used as an intransitive verb phrase.","ex":["If one country bans plastic bags, others will probably follow suit.","The central bank cut interest rates, and other banks quickly followed suit."],"key":"follow suit","syn":["do likewise","do the same","copy"],"reg":"neutral","ielts":"yes","note":"Neat phrase for describing trends or policy effects in Task 2."},{"p":"get/rise to your feet","m":"stand up","d":"To stand up from a sitting or lying position, often to speak or to show respect.","ex":["The whole audience rose to their feet and applauded the speaker.","He got to his feet and walked slowly to the podium."],"key":"rose to their feet","syn":["stand up","rise","get up"],"reg":"neutral","ielts":"careful","note":"Good for narrative or speaking answers; not needed in essays."},{"p":"for one thing","m":"used to give the first reason for something","d":"Used to introduce one reason or point among several, often in an explanation or argument.","ex":["Remote work is appealing; for one thing, it removes the daily commute.","I would not live in the city; for one thing, the rents are far too high."],"key":"for one thing","syn":["firstly","to begin with","in the first place"],"reg":"neutral","ielts":"careful","note":"Slightly conversational; fine in speaking, prefer 'firstly' in formal essays."},{"p":"a force to be reckoned with","m":"a powerful person or group that must be taken seriously","d":"A person, group or organisation with enough power or influence that others must take it seriously.","ex":["Within a decade, the start-up had become a force to be reckoned with in the market.","China has emerged as a force to be reckoned with in renewable energy."],"key":"a force to be reckoned with","syn":["a major player","a powerful presence","a significant competitor"],"reg":"neutral","ielts":"yes","note":"Useful for economy and politics topics; use once, not repeatedly."},{"p":"join forces","m":"work together to achieve something","d":"To combine efforts with another person or group in order to achieve a shared aim; often followed by 'with' or 'to'.","ex":["Governments and charities must join forces to tackle global hunger.","The two universities joined forces with local industry to fund the research."],"key":"join forces","syn":["collaborate","work together","team up"],"reg":"neutral","ielts":"yes","note":"Good for Task 2 on cooperation between countries or sectors."},{"p":"in/into force","m":"(of a law or rule) being used or starting to be used","d":"Describes a law, rule or regulation that is currently valid and applied; 'come/go into force' means to start to apply.","ex":["The new emissions rules will come into force next January.","Strict tobacco laws have been in force in the country since 2007."],"key":"come into force","syn":["take effect","be in effect","become valid"],"reg":"formal","ielts":"yes","note":"Excellent for law and policy topics in Task 2."},{"p":"be foreign to sb","m":"be unfamiliar or strange to someone","d":"To be unknown or alien to a person, or not part of their nature or experience.","ex":["The concept of retirement is foreign to many farming communities.","Such aggressive behaviour was completely foreign to her gentle character."],"key":"foreign to many farming communities","syn":["be alien to","be unfamiliar to","be strange to"],"reg":"formal","ielts":"yes","note":"Useful for culture and tradition topics; shows precise vocabulary."},{"p":"for/in the foreseeable future","m":"for as long as we can predict","d":"For a period of time that can reasonably be predicted from present circumstances; usually used with negative or stable situations.","ex":["Oil will remain a key energy source for the foreseeable future.","House prices are unlikely to fall in the foreseeable future."],"key":"for the foreseeable future","syn":["in the near future","for the time being","in the short to medium term"],"reg":"formal","ielts":"yes","note":"Strong for predictions in Task 2 and Task 1 trend forecasts."},{"p":"I forget","m":"said when you cannot remember something exactly","d":"A spoken expression used to show you cannot recall a detail, often placed at the start or end of a clause.","ex":["It was built in the 1800s, but the exact year I forget.","She lives in a village near Oxford, I forget what it is called."],"key":"I forget","syn":["I can't remember","I don't recall","it escapes me"],"reg":"informal","ielts":"no","note":"Fine in Speaking Part 1 when hesitating; avoid in writing."},{"p":"be on (good) form","m":"be performing well","d":"To be performing or playing particularly well, especially in sport or in a performance; British English.","ex":["The young striker is on good form and scored twice last night.","The pianist was on form throughout the entire concert."],"key":"on good form","syn":["be at one's best","be in top form","be performing well"],"reg":"neutral","ielts":"careful","note":"Good for sport or music talk in Speaking; unsuitable for formal essays."},{"p":"foundation","m":"the base or basis on which something is built","d":"A basic idea, principle or institution on which something develops; also a charitable organisation funded by donations.","ex":["A strong education provides the foundation for a successful career.","The foundation of a stable economy is trust in public institutions."],"key":"the foundation for","syn":["basis","groundwork","cornerstone"],"reg":"neutral","ielts":"yes","note":"Versatile Task 2 noun; often 'lay the foundations of/for'."},{"p":"frame of mind","m":"your mood or attitude at a particular time","d":"The mental or emotional state a person is in, affecting how they think or behave at a given moment.","ex":["Exams are easier to handle with a positive frame of mind.","He was in a cheerful frame of mind when he arrived."],"key":"a positive frame of mind","syn":["state of mind","mindset","mood"],"reg":"neutral","ielts":"yes","note":"Good for stress, study and wellbeing topics in speaking and writing."},{"p":"freedom from sth","m":"being free from something unpleasant or harmful","d":"The state of not being affected by something undesirable, such as fear, want or interference; noun followed by 'from'.","ex":["Many consider freedom from poverty a basic human right.","Journalists need freedom from political interference to report honestly."],"key":"freedom from poverty","syn":["liberty from","immunity from","release from"],"reg":"formal","ielts":"yes","note":"Strong for human rights and social policy Task 2 essays."},{"p":"fresh water","m":"water that is not salty, safe for drinking and farming","d":"Water from rivers, lakes and underground sources that contains little salt, as opposed to sea water.","ex":["Many regions face a shortage of fresh water due to drought.","Fresh water is essential for both agriculture and public health."],"key":"fresh water","syn":["drinking water","potable water","non-saline water"],"reg":"neutral","ielts":"yes","note":"Key collocation for environment topics; also written 'freshwater' as adjective."},{"p":"the frontiers of sth","m":"the furthest limits of what is known in a subject","d":"The outer limit of knowledge or achievement in a field, where new discoveries are being made.","ex":["The research team works at the frontiers of artificial intelligence.","Scientists are pushing back the frontiers of medical knowledge every year."],"key":"the frontiers of artificial intelligence","syn":["the cutting edge of","the limits of","the boundaries of"],"reg":"formal","ielts":"yes","note":"Impressive in science and technology essays; often 'push back the frontiers'."},{"p":"the fruit(s) of sth","m":"the good results of someone's work or effort","d":"The positive results or rewards of a person's work, effort or activity, usually used in the plural or singular.","ex":["After years of study, she finally enjoyed the fruits of her labour.","Society should share the fruits of economic growth more fairly."],"key":"the fruits of her labour","syn":["the rewards of","the benefits of","the results of"],"reg":"formal","ielts":"yes","note":"Nice for conclusions on effort, education or economic growth."},{"p":"be full of yourself","m":"think you are better or more important than you are","d":"To be arrogant and have too high an opinion of your own importance; informal and disapproving.","ex":["Since winning the award, he has been completely full of himself.","Nobody likes a manager who is full of herself."],"key":"full of himself","syn":["be conceited","be arrogant","have a big head"],"reg":"informal","ielts":"no","note":"Spoken and critical; use in Speaking descriptions of people, not essays."},{"p":"gained","m":"obtained or achieved something, often through effort","d":"Past tense and past participle of 'gain': to obtain or achieve something useful, such as experience, skills or advantage.","ex":["Graduates who have gained work experience find jobs more easily.","The party gained ground in the last election."],"key":"gained work experience","syn":["acquired","obtained","earned"],"reg":"neutral","ielts":"yes","note":"Common collocations: gain experience, knowledge, ground, access."},{"p":"a gap in the market","m":"a product or service that people want but nobody sells","d":"An opportunity to sell a product or service that customers need but which no company currently provides.","ex":["The entrepreneur spotted a gap in the market for affordable electric bikes.","Many successful start-ups begin by filling a gap in the market."],"key":"a gap in the market","syn":["a niche","a market opportunity","an unmet demand"],"reg":"neutral","ielts":"yes","note":"Useful for business and entrepreneurship topics in Task 2."},{"p":"the germ of sth","m":"the first small beginning of an idea or plan","d":"The earliest stage of something, such as an idea, that may later develop into something larger.","ex":["The germ of the idea came from a casual conversation with a colleague.","The germ of democracy can be traced back to ancient Athens."],"key":"The germ of the idea","syn":["the seed of","the origin of","the beginnings of"],"reg":"formal","ielts":"yes","note":"Elegant for history or innovation topics; avoid confusion with bacteria sense."},{"p":"get you nowhere","m":"will not help you achieve anything","d":"Used to say that a particular action or approach will produce no useful result for the person doing it.","ex":["Complaining about the problem will get you nowhere; you must propose solutions.","Cramming the nigh
