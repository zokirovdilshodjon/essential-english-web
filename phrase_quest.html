n.","The new software is supposed to be easy to use."],"key":"is supposed to be","syn":["be said to be","be meant to be","be believed to be"],"reg":"neutral","ielts":"careful","note":"Good for expectations versus reality; avoid in very formal prose."},{"p":"be supposed to do sth","m":"be expected or required to do something","d":"To be expected or required to do something according to rules, plans or custom; pattern: be supposed to + verb.","ex":["Drivers are supposed to stop at red lights.","You are supposed to hand in the form by Friday."],"key":"are supposed to stop","syn":["be meant to do","be expected to do","be required to do"],"reg":"neutral","ielts":"careful","note":"Better in speaking; in essays use 'be expected to'."},{"p":"be sure of sth","m":"be certain about something","d":"To be certain that something is true or will happen; pattern: be sure of sth / be sure of doing sth.","ex":["Scientists are sure of the link between smoking and cancer.","I am not sure of the exact date of the meeting."],"key":"are sure of the link","syn":["be certain of","be confident about","be convinced of"],"reg":"neutral","ielts":"yes","note":"Fine for degrees of certainty in Task 2 opinions."},{"p":"of yourself","m":"used after 'proud', 'ashamed' etc. to refer to you","d":"Used after adjectives like 'proud', 'ashamed' or 'think' to show that the feeling is about yourself.","ex":["You should be proud of yourself for finishing the course.","He thinks too highly of himself."],"key":"proud of yourself","syn":["of oneself","about yourself"],"reg":"neutral","ielts":"careful","note":"Common in speaking about achievements and confidence."},{"p":"be/get swept along/away, etc.","m":"be carried quickly by a strong force or feeling","d":"To be carried quickly by water, wind or strong emotion or events; pattern: be/get swept + adverb/preposition.","ex":["Many villagers were swept away by the floodwater.","She got swept along by the excitement of the crowd."],"key":"were swept away","syn":["be carried away","be washed away","be overwhelmed"],"reg":"neutral","ielts":"careful","note":"Vivid for floods or enthusiasm; use cautiously in essays."},{"p":"take milk/sugar, etc.","m":"add milk or sugar to a drink","d":"To usually have milk, sugar or similar in a hot drink; pattern: take + noun.","ex":["Do you take milk in your tea?","My father takes sugar in his coffee."],"key":"take milk","syn":["have milk","add milk","like milk"],"reg":"neutral","ielts":"no","note":"Everyday speaking; useful for food and drink topics only."},{"p":"can't take sth","m":"cannot accept or bear something unpleasant","d":"To be unable to bear or tolerate something unpleasant; pattern: can't take sth/doing sth.","ex":["I can't take the noise from the building site any longer.","She can't take criticism from her colleagues."],"key":"can't take the noise","syn":["can't stand","can't bear","can't tolerate"],"reg":"informal","ielts":"no","note":"Spoken; use 'cannot tolerate' in writing."},{"p":"take sth/sb seriously","m":"treat something or someone as important","d":"To treat a person or matter as important and worth serious attention; pattern: take sth/sb seriously.","ex":["Companies must take data security seriously.","Nobody took the warning seriously."],"key":"take data security seriously","syn":["treat as important","regard seriously","pay serious attention to"],"reg":"neutral","ielts":"yes","note":"Strong phrase for Task 2 on responsibility and urgent problems."},{"p":"take your breath away","m":"surprise or impress you very much","d":"To amaze or impress someone greatly, often by beauty or shock.","ex":["The view from the top of the mountain took my breath away.","Her performance took the audience's breath away."],"key":"took my breath away","syn":["amaze","astonish","leave you speechless"],"reg":"neutral","ielts":"careful","note":"Good in speaking about places or events; too emotive for essays."},{"p":"take sb's word for it","m":"believe what someone says without checking","d":"To accept that what someone says is true without asking for proof.","ex":["You don't need to check; just take my word for it.","I took her word for it that the road was safe."],"key":"take my word for it","syn":["trust sb","accept sb's claim","believe sb"],"reg":"informal","ielts":"no","note":"Spoken idiom; avoid in essays."},{"p":"can tell","m":"are able to know or judge something","d":"To be able to see or judge something from signs; pattern: can tell + clause / can tell the difference.","ex":["I can tell that she is nervous about the interview.","Most people can tell the difference between real and fake news."],"key":"can tell that","syn":["can see","can judge","can recognise"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; use 'it is clear that' in essays."},{"p":"be tempted","m":"feel a strong wish to do something","d":"To feel attracted to doing something, especially something you should not do; pattern: be tempted to do sth / by sth.","ex":["Shoppers are tempted to spend more by special offers.","I was tempted to quit my job after the argument."],"key":"are tempted to spend","syn":["feel inclined","be drawn","be enticed"],"reg":"neutral","ielts":"yes","note":"Good for consumerism and behaviour topics in Task 2."},{"p":"tend to do sth","m":"usually or often do something","d":"To be likely to do something, or to do it often; pattern: tend to + verb.","ex":["Young people tend to spend more time online.","Prices tend to rise during the holiday season."],"key":"tend to spend","syn":["be inclined to","be likely to","have a tendency to"],"reg":"neutral","ielts":"yes","note":"Excellent hedging verb for generalisations in Task 2."},{"p":"in ... terms/in terms of sth","m":"when thinking about a particular aspect","d":"Used to specify the aspect from which something is considered; pattern: in + adjective + terms / in terms of + noun.","ex":["In economic terms, the project was a success.","The two countries differ in terms of population."],"key":"In economic terms","syn":["from the viewpoint of","with regard to","as far as ... is concerned"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 for evaluating from different angles."},{"p":"thanks to sb/sth","m":"because of someone or something good","d":"Used to show that something happens because of a person or thing, usually with a positive result.","ex":["Thanks to modern medicine, people live longer.","The project succeeded thanks to her hard work."],"key":"Thanks to modern medicine","syn":["owing to","because of","as a result of"],"reg":"neutral","ielts":"yes","note":"Use for positive causes in Task 2; use 'due to' for neutral ones."},{"p":"that's it","m":"that is all; that is the end or the answer","d":"Informal expression meaning that is everything, or that is exactly right.","ex":["That's it, we are finished for today.","Yes, that's it! You solved the puzzle."],"key":"That's it","syn":["that's all","that's right","that's everything"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"in theory","m":"according to ideas, but maybe not in reality","d":"Used to say that something is supposed to be true but may not be true in practice.","ex":["In theory, the scheme should reduce traffic.","In theory, everyone has equal access to education."],"key":"In theory","syn":["theoretically","on paper","in principle"],"reg":"neutral","ielts":"yes","note":"Good for contrasting ideas with practice: 'In theory... however in practice'."},{"p":"the whole thing","m":"all of a situation or matter","d":"Used to refer to the entire situation, event or object being discussed.","ex":["The whole thing took less than an hour.","I think the whole thing was a misunderstanding."],"key":"The whole thing","syn":["the entire matter","everything","the whole situation"],"reg":"informal","ielts":"no","note":"Chatty; use 'the entire process' or 'the whole situation' in writing."},{"p":"the thing is...","m":"used to introduce an important point or problem","d":"Informal phrase used to introduce the main point, problem or explanation; pattern: The thing is + clause.","ex":["The thing is, I have never lived abroad before.","The thing is that the tickets are too expensive."],"key":"The thing is","syn":["the point is","the problem is","the fact is"],"reg":"informal","ielts":"no","note":"Spoken discourse marker; use 'The key issue is' in essays."},{"p":"not a single thing","m":"absolutely nothing","d":"Used for emphasis to mean none at all; pattern: not a single thing.","ex":["There was not a single thing left in the fridge.","He did not do a single thing to help us."],"key":"not a single thing","syn":["nothing at all","not one thing","absolutely nothing"],"reg":"informal","ielts":"careful","note":"Emphatic; good in speaking, avoid in neutral academic writing."},{"p":"(be) in your thirties","m":"be aged between thirty and thirty-nine","d":"Used to say a person's age is between thirty and thirty-nine.","ex":["My sister is in her thirties and works as a lawyer.","Many people in their thirties delay having children."],"key":"in her thirties","syn":["aged 30 to 39","in their thirties"],"reg":"neutral","ielts":"yes","note":"Useful for age groups in Task 1 and speaking."},{"p":"the thirties","m":"the years 1930 to 1939","d":"The decade from 1930 to 1939, or ages 30 to 39.","ex":["Unemployment was very high in the thirties.","The economy recovered slowly after the thirties."],"key":"in the thirties","syn":["the 1930s","the decade 1930-1939"],"reg":"neutral","ielts":"yes","note":"In Task 1 write '1930s' with digits for precision."},{"p":"those who/which/that","m":"the people or things that do or have something","d":"Used to refer to a group of people or things described by the clause that follows; pattern: those who/which/that + verb.","ex":["Those who work long hours often suffer from stress.","Governments should support those that need help most."],"key":"Those who work","syn":["people who","anyone who","individuals who"],"reg":"formal","ielts":"yes","note":"Neat for generalising about groups in Task 2."},{"p":"as though","m":"in a way that suggests something; as if","d":"Used to compare a situation with how it would be if something were true; pattern: as though + clause.","ex":["She spoke as though she had lived there all her life.","It seems as though prices will keep rising."],"key":"as though she had lived","syn":["as if","like","in the way that"],"reg":"neutral","ielts":"yes","note":"Fine in essays and speaking; use past forms for unreal comparisons."},{"p":"for some time","m":"for quite a long period","d":"For a fairly long period of time, often continuing until now.","ex":["Scientists have been studying this problem for some time.","I have been planning to move for some time."],"key":"for some time","syn":["for a while","for quite a while","for a considerable period"],"reg":"neutral","ielts":"yes","note":"Safe with present perfect in Task 1 and 2 background sentences."},{"p":"tons of sth","m":"a very large amount of something","d":"Informal expression meaning a very large quantity; pattern: tons of + noun.","ex":["We have tons of homework this week.","There were tons of people at the festival."],"key":"tons of homework","syn":["lots of","masses of","loads of"],"reg":"informal","ielts":"no","note":"Spoken and informal letters only; use 'a great deal of' in essays."},{"p":"be trapped","m":"be unable to escape from a place or situation","d":"To be in a place or situation from which it is difficult or impossible to escape; pattern: be trapped in/by sth.","ex":["Several miners were trapped underground after the collapse.","Many families feel trapped in poverty."],"key":"were trapped underground","syn":["be stuck","be caught","be confined"],"reg":"neutral","ielts":"yes","note":"'Trapped in poverty' works well for social issues in Task 2."},{"p":"the trouble with sb/sth","m":"the main problem or fault of someone or something","d":"Used to introduce the main problem or disadvantage of a person or thing; pattern: the trouble with sb/sth is...","ex":["The trouble with this plan is that it costs too much.","The trouble with fast food is that it is unhealthy."],"key":"The trouble with this plan","syn":["the problem with","the drawback of","the difficulty with"],"reg":"informal","ielts":"careful","note":"Good in speaking; in essays write 'The main drawback of ...'."},{"p":"turn blue/cold/nasty, etc.","m":"change and become a certain colour or quality","d":"To change into a particular state, colour or quality; pattern: turn + adjective.","ex":["The sky turned dark before the storm.","The weather turned cold in October."],"key":"turned dark","syn":["become dark","go dark","grow dark"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about weather and change; 'become' is more formal."},{"p":"take turns or take it in turns","m":"do something one after another in order","d":"To do something one after another with other people in a fixed order; pattern: take turns (to do sth) / take it in turns.","ex":["The children took turns on the swing.","We take it in turns to cook dinner."],"key":"took turns","syn":["alternate","do in rotation","go one after another"],"reg":"neutral","ielts":"careful","note":"Good for speaking about family and sharing tasks."},{"p":"(be) in your twenties","m":"be aged between twenty and twenty-nine","d":"Used to say a person's age is between twenty and twenty-nine.","ex":["He is in his twenties and works for a start-up.","Many people in their twenties rent rather than buy."],"key":"in his twenties","syn":["aged 20 to 29","in their twenties"],"reg":"neutral","ielts":"yes","note":"Useful for age groups in Task 1 and speaking."},{"p":"the twenties","m":"the years 1920 to 1929","d":"The decade from 1920 to 1929, or ages 20 to 29.","ex":["Jazz became popular in the twenties.","Many fashions of the twenties are returning."],"key":"in the twenties","syn":["the 1920s","the decade 1920-1929"],"reg":"neutral","ielts":"yes","note":"In Task 1 write '1920s' with digits for precision."},{"p":"be unclear about sth","m":"not know or not understand something clearly","d":"To not be certain or not have a clear understanding of something; pattern: be unclear about sth.","ex":["Many students are unclear about the exam rules.","Scientists remain unclear about the exact cause."],"key":"are unclear about","syn":["be uncertain about","be confused about","be unsure about"],"reg":"neutral","ielts":"yes","note":"Useful for describing uncertain evidence in Task 2."},{"p":"be unfamiliar with sth","m":"not know something well","d":"To have little knowledge or experience of something; pattern: be unfamiliar with sth.","ex":["Many tourists are unfamiliar with local customs.","I am unfamiliar with this software."],"key":"are unfamiliar with","syn":["be unacquainted with","be new to","have no experience of"],"reg":"formal","ielts":"yes","note":"Good formal alternative to 'not know' in essays."},{"p":"unusually big/strong/good,etc.","m":"more than normal in size, strength or quality","d":"Used before an adjective to mean more than is typical; pattern: unusually + adjective.","ex":["The region had an unusually cold winter.","She is an unusually talented musician."],"key":"unusually cold","syn":["exceptionally","remarkably","extraordinarily"],"reg":"neutral","ielts":"yes","note":"Good adverb for describing unexpected figures in Task 1."},{"p":"up and down","m":"moving higher and lower, or in both directions","d":"Moving repeatedly upwards and downwards, or varying; also along a place from one end to the other.","ex":["Prices went up and down throughout the year.","The children ran up and down the corridor."],"key":"up and down","syn":["back and forth","fluctuating","to and fro"],"reg":"neutral","ielts":"careful","note":"Task 1: prefer 'fluctuated'; 'up and down' is plain and spoken."},{"p":"upset stomach","m":"a stomach feeling sick or in pain","d":"A condition in which the stomach feels uncomfortable, often due to illness or food.","ex":["I had an upset stomach after eating seafood.","An upset stomach kept him in bed all day."],"key":"an upset stomach","syn":["stomach ache","indigestion","tummy trouble"],"reg":"neutral","ielts":"no","note":"Useful in speaking about health or in letters explaining absence."},{"p":"be (of) any/some use","m":"be helpful or useful","d":"To be helpful or have practical value; pattern: be of some/any use (to sb).","ex":["I hope this advice will be of some use to you.","Is this old computer of any use to the school?"],"key":"be of some use","syn":["be helpful","be useful","be of value"],"reg":"neutral","ielts":"yes","note":"Polite in formal letters: 'I hope this will be of some use'."},{"p":"be (of) no use","m":"be not helpful or have no value","d":"To be worthless or not helpful; pattern: be (of) no use (to sb).","ex":["The map was of no use in the dark.","Old textbooks are of no use to modern students."],"key":"was of no use","syn":["be useless","be worthless","be of no value"],"reg":"neutral","ielts":"yes","note":"Fine in Task 2 when criticising outdated methods."},{"p":"be no use doing sth","m":"be pointless to do something","d":"Used to say that doing something will not help or change anything; pattern: it's no use doing sth.","ex":["It is no use complaining about the weather.","It's no use arguing with him; he never listens."],"key":"It is no use complaining","syn":["be pointless","be futile","be a waste of time"],"reg":"neutral","ielts":"careful","note":"Slightly conversational; 'it is pointless to' works better in essays."},{"p":"make use of sth","m":"use something well to get a benefit","d":"To use something, especially so that you gain an advantage; pattern: make (good) use of sth.","ex":["Students should make use of the library facilities.","The company made good use of social media."],"key":"make use of","syn":["utilise","take advantage of","exploit"],"reg":"neutral","ielts":"yes","note":"Strong, flexible collocation for Task 2 on technology and resources."},{"p":"a short/ten-minute, etc. walk","m":"a walk of a certain length of time","d":"A walk that lasts a stated amount of time or distance; pattern: a + adjective + walk.","ex":["The station is a ten-minute walk from my house.","After lunch we took a short walk by the river."],"key":"a ten-minute walk","syn":["a stroll","a brief walk","a short stroll"],"reg":"neutral","ielts":"yes","note":"Useful for giving directions and distances in General Training letters."},{"p":"in a way; in some/many ways","m":"partly; from some points of view","d":"Used to show that a statement is true only in some respects; pattern: in a way / in some ways.","ex":["In many ways, city life is easier than country life.","In a way, the new system is better than the old one."],"key":"In many ways","syn":["to some extent","in some respects","partly"],"reg":"neutral","ielts":"yes","note":"Good for balanced Task 2 arguments; 'in some respects' is more formal."},{"p":"may/might as well","m":"it is a sensible choice because nothing else is better","d":"Used to say that something is the best thing to do because there is no better alternative; pattern: may/might as well + verb.","ex":["The bus has gone, so we might as well walk.","You may as well take the job if nobody else offers one."],"key":"might as well walk","syn":["could just as well","had better just","have nothing to lose by"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"may/might/could well","m":"it is quite likely that something will happen","d":"Used to say that something is quite probable; pattern: may/might/could well + verb.","ex":["Prices could well rise next year.","The new law may well change public attitudes."],"key":"could well rise","syn":["will probably","is quite likely to","is very possible that"],"reg":"neutral","ielts":"yes","note":"Excellent hedging for predictions in Task 2 and Task 1 forecasts."},{"p":"it's just as well","m":"it is lucky that something happened","d":"Used to say that it is fortunate that something is the case; pattern: it's just as well (that) + clause.","ex":["It's just as well that we booked early.","It's just as well you brought an umbrella."],"key":"It's just as well","syn":["it is fortunate that","it is lucky that","thank goodness"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"what's/what is more","m":"and also; used to add a stronger extra point","d":"Used to add an extra, often more important, point to what has been said.","ex":["The course is cheap and, what is more, it is very useful.","The scheme saves money. What's more, it protects the environment."],"key":"what is more","syn":["moreover","furthermore","in addition","besides"],"reg":"neutral","ielts":"yes","note":"Good linker for adding a stronger point in Task 2."},{"p":"or whatever","m":"or something similar; used when you are not exact","d":"Informal phrase added to a list or description to mean something similar or not important.","ex":["You can bring a book or whatever to pass the time.","Wear a jacket or whatever; it will be cold."],"key":"or whatever","syn":["or something like that","or anything else","and so on"],"reg":"informal","ielts":"no","note":"Spoken and chatty; avoid in essays."},{"p":"the wheel","m":"the circle part of a car you turn to steer","d":"The steering wheel of a vehicle; also 'at the wheel' means driving.","ex":["He fell asleep at the wheel and crashed.","She gripped the wheel tightly on the icy road."],"key":"the wheel","syn":["the steering wheel","the controls","the driving seat"],"reg":"neutral","ielts":"careful","note":"Relevant to road safety and driving topics in speaking."},{"p":"differ/vary widely","m":"be very different from one another","d":"To be very different between places, people or situations; pattern: differ/vary widely (between/across sth).","ex":["Salaries vary widely between regions.","Opinions on the issue differ widely."],"key":"vary widely","syn":["vary greatly","differ considerably","range widely"],"reg":"neutral","ielts":"yes","note":"Very good for comparing data or opinions in Task 1 and 2."},{"p":"will have","m":"future form: will possess or will have done something","d":"Used for future possession or, with a past participle, an action completed by a future time; pattern: will have + noun / past participle.","ex":["By 2050, most cities will have introduced congestion charges.","She will have finished her degree by next summer."],"key":"will have introduced","syn":["will have completed","will possess","shall have"],"reg":"neutral","ielts":"yes","note":"Future perfect is useful for predictions in Task 1 and 2."},{"p":"wind (sth) around/round, etc. sth","m":"twist or wrap something around an object","d":"To wrap or twist something around something else; pattern: wind (sth) around/round sth.","ex":["She wound the scarf around her neck.","He wound the rope round the post twice."],"key":"wound the scarf around","syn":["wrap around","coil around","twist around"],"reg":"neutral","ielts":"no","note":"Physical action; useful in speaking descriptions only."},{"p":"wind along/through, etc.","m":"follow a path with many bends","d":"To follow a curved, twisting route; pattern: wind + along/through/up/down.","ex":["The river winds through the valley.","A narrow path wound along the cliff edge."],"key":"winds through the valley","syn":["twist through","meander through","snake along"],"reg":"neutral","ielts":"careful","note":"Useful for describing places and maps in speaking or Task 1 maps."},{"p":"wipe sth away/from/off, etc.","m":"remove something by rubbing it with a cloth","d":"To remove dirt or liquid by rubbing with a cloth or hand; pattern: wipe sth + away/from/off sth.","ex":["She wiped the tears from her face.","He wiped the dust off the shelf."],"key":"wiped the tears from","syn":["rub off","clean off","brush away"],"reg":"neutral","ielts":"no","note":"Everyday action; not needed in academic essays."},{"p":"wish to do sth","m":"want to do something, in a formal way","d":"A formal way to say you want to do something; pattern: wish to + verb.","ex":["I wish to apply for the position of manager.","Anyone who wishes to attend should register online."],"key":"wish to apply","syn":["would like to","want to","desire to"],"reg":"formal","ielts":"yes","note":"Excellent in formal General Training letters: 'I wish to complain'."},{"p":"have a word (with sb)","m":"talk briefly with someone, often about a problem","d":"To have a short conversation with someone, often to give advice or complain; pattern: have a word (with sb) (about sth).","ex":["I'll have a word with the manager about the delay.","Could I have a word with you after the lesson?"],"key":"have a word with the manager","syn":["speak to","talk to","have a quick chat with"],"reg":"informal","ielts":"careful","note":"Fine for speaking and informal letters; use 'speak to' formally."},{"p":"worse and worse","m":"becoming more bad all the time","d":"Used to show that something is steadily getting worse.","ex":["The traffic problem is getting worse and worse.","Her health grew worse and worse during the winter."],"key":"worse and worse","syn":["steadily worsening","deteriorating","going downhill"],"reg":"neutral","ielts":"careful","note":"Plain repetition; use 'deteriorate' or 'worsen' in formal writing."},{"p":"worst of all","m":"the most bad thing of all in a list","d":"Used to introduce the most serious or unpleasant point in a list of problems.","ex":["The hotel was dirty, noisy and, worst of all, very expensive.","Worst of all, nobody apologised for the mistake."],"key":"worst of all","syn":["most seriously","above all","the biggest problem was"],"reg":"neutral","ielts":"careful","note":"Good for complaint letters; use 'most seriously' in essays."},{"p":"the best/worst, etc. yet","m":"the best or worst up to now","d":"Used to say that something is the best, worst, etc. that has happened or been seen up to this point.","ex":["This year's results are the best yet.","It was the worst storm yet this season."],"key":"the best yet","syn":["the best so far","the best to date","the greatest so far"],"reg":"neutral","ielts":"careful","note":"'So far' or 'to date' sounds more formal in Task 1."},{"p":"the young","m":"young people as a group","d":"Young people considered together as a group; used with a plural verb.","ex":["The young are more likely to use social media.","Policies should protect the young and the old."],"key":"The young are","syn":["young people","the youth","the younger generation"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 on generations; 'the young', 'the old' take plural verbs."}],"C1":[{"p":"in accordance with sth","m":"following a rule, law or instruction","d":"In a way that agrees with or follows a rule, law or wish; used before a noun.","ex":["All research must be conducted in accordance with ethical guidelines.","The funds were distributed in accordance with the will."],"key":"in accordance with ethical guidelines","syn":["according to","in line with","in compliance with"],"reg":"formal","ielts":"yes","note":"Excellent formal phrase for Task 2 about laws and rules."},{"p":"by all accounts","m":"according to what most people say","d":"Judging by what people generally report; used as a sentence adverbial to express a widely held opinion.","ex":["By all accounts, the new transport policy has been a success.","She was, by all accounts, an outstanding teacher."],"key":"By all accounts","syn":["from all reports","according to most people","reportedly"],"reg":"neutral","ielts":"careful","note":"Useful for hedging claims; support with evidence in essays."},{"p":"accustomed to sth/doing sth","m":"used to something; familiar with it","d":"Familiar with something through experience, so that it seems normal; followed by a noun or -ing form.","ex":["Many migrants are not accustomed to living in cold climates.","Workers soon become accustomed to the new schedule."],"key":"accustomed to living","syn":["used to","familiar with","habituated to"],"reg":"formal","ielts":"yes","note":"Good in Task 2 on adapting to change; note 'to' + -ing."},{"p":"legal action","m":"taking someone to court","d":"The process of bringing a case against someone in a court of law; uncountable noun.","ex":["The residents threatened legal action against the council.","Legal action is often a last resort for consumers."],"key":"legal action","syn":["litigation","court proceedings","a lawsuit"],"reg":"formal","ielts":"yes","note":"Useful for law and consumer-rights topics in Task 2."},{"p":"out of action","m":"not working or not able to play","d":"Not working, or unable to take part because of damage or injury; used after a verb like be.","ex":["The main server was out of action for several hours.","The striker has been out of action since March."],"key":"out of action","syn":["out of order","out of service","not functioning"],"reg":"neutral","ielts":"careful","note":"Better for speaking or Task 1 reports than argument essays."},{"p":"course of action","m":"a way of dealing with a situation","d":"A plan or method chosen to deal with a situation or problem.","ex":["Governments must choose the most effective course of action.","Delaying reform is not a sensible course of action."],"key":"course of action","syn":["plan of action","strategy","approach"],"reg":"formal","ielts":"yes","note":"Strong, flexible phrase for Task 2 solutions and recommendations."},{"p":"after all","m":"despite what was expected or said earlier","d":"Used to introduce a reason or to show that something is true despite earlier doubts.","ex":["The experiment worked after all, despite the early setbacks.","We should not blame him; he is only a child, after all."],"key":"after all","syn":["in the end","nevertheless","when all is said and done"],"reg":"neutral","ielts":"careful","note":"Avoid sentence-initial use in formal essays; fine in speaking."},{"p":"have sth against sb/sth","m":"dislike someone or something for a reason","d":"To dislike or object to a person or thing; usually used in negative sentences and questions.","ex":["I have nothing against modern art, but I rarely visit galleries.","Do you have anything against working from home?"],"key":"have nothing against","syn":["object to","dislike","be opposed to"],"reg":"neutral","ielts":"careful","note":"Better in speaking; formal essays prefer 'oppose' or 'object to'."},{"p":"long ago","m":"a very long time in the past","d":"At a point in the distant past; an adverb phrase.","ex":["Humans began farming long ago, in the Neolithic period.","Such customs disappeared long ago in most regions."],"key":"long ago","syn":["in the distant past","years ago","in ancient times"],"reg":"neutral","ielts":"yes","note":"Fine for describing past change; be precise with dates in Task 1."},{"p":"ahead of time/schedule","m":"earlier than planned","d":"Earlier than the planned or expected time; used after a verb such as finish or arrive.","ex":["The new bridge was completed ahead of schedule.","Please submit the forms ahead of time."],"key":"ahead of schedule","syn":["early","earlier than planned","in advance"],"reg":"neutral","ielts":"yes","note":"Useful in work and project topics; good for Task 2 examples."},{"p":"in aid of sb/sth","m":"to raise money for a cause","d":"In order to help or support a person or cause, especially by raising money; mainly British.","ex":["The students held a concert in aid of local hospitals.","A marathon was organised in aid of cancer research."],"key":"in aid of local hospitals","syn":["in support of","for the benefit of","on behalf of"],"reg":"neutral","ielts":"careful","note":"Good for charity topics; mainly British, so keep usage simple."},{"p":"with the aid of sth","m":"by using something to help","d":"Using a particular tool or thing as help in doing something.","ex":["Complex data can be analysed with the aid of software.","She walked with the aid of a stick."],"key":"with the aid of software","syn":["by means of","using","through the use of"],"reg":"formal","ielts":"yes","note":"Good formal phrase for technology topics in Task 2."},{"p":"on air","m":"being broadcast on radio or television","d":"Being broadcast live on radio or television; used after be or go.","ex":["The programme goes on air at nine every morning.","The presenter was on air when the power failed."],"key":"on air","syn":["broadcasting","live","being transmitted"],"reg":"neutral","ielts":"careful","note":"Use only for media topics; spoken Part 2 fits well."},{"p":"all things considered","m":"after thinking about everything","d":"Used to give an overall judgement after taking all factors into account.","ex":["All things considered, remote work benefits both firms and employees.","All things considered, the trial was a success."],"key":"All things considered","syn":["on balance","taking everything into account","all in all"],"reg":"neutral","ielts":"yes","note":"Good linker for Task 2 conclusions."},{"p":"all hours","m":"very late or at any time of day","d":"Very late at night or at any time; used in the pattern at all hours.","ex":["Doctors often work at all hours of the day and night.","Noise from the bar continued until all hours."],"key":"at all hours","syn":["round the clock","day and night","at any time"],"reg":"informal","ielts":"careful","note":"More suitable for speaking; use 'around the clock' in essays."},{"p":"all at once","m":"suddenly or at the same time","d":"Suddenly, or all together at the same time.","ex":["All at once, the lights went out across the city.","Students cannot learn everything all at once."],"key":"All at once","syn":["suddenly","simultaneously","at the same time"],"reg":"neutral","ielts":"careful","note":"Fine in narratives and speaking; use 'simultaneously' in essays."},{"p":"be all very well","m":"be fine in theory but unhelpful","d":"Used to say something sounds good but does not solve the real problem; followed by but.","ex":["It is all very well to promote recycling, but few cities provide bins.","That is all very well, but who will pay?"],"key":"is all very well","syn":["be fine in theory","sound good but","be easy to say"],"reg":"informal","ielts":"no","note":"Conversational and sceptical; avoid in formal essays."},{"p":"be all set","m":"be completely ready","d":"To be fully prepared and ready to begin something.","ex":["We are all set for the exhibition tomorrow.","Are you all set for the journey?"],"key":"are all set","syn":["be ready","be prepared","be good to go"],"reg":"informal","ielts":"no","note":"Spoken or friend letters only; avoid in essays."},{"p":"let alone","m":"and certainly not","d":"Used after a negative statement to show the next thing is even less likely.","ex":["Many families cannot afford a car, let alone a house.","He could hardly walk, let alone run a marathon."],"key":"let alone","syn":["not to mention","much less","still less"],"reg":"neutral","ielts":"careful","note":"Useful for emphasis in Task 2; use sparingly and only after negatives."},{"p":"alternate days/weeks/years, etc.","m":"every second day, week or year","d":"Happening on one day, week or year, then skipping the next; a pattern with time words.","ex":["The two teams use the pitch on alternate weeks.","Rubbish is collected on alternate days."],"key":"alternate weeks","syn":["every other week","every second week","on a rota"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for describing schedules and patterns."},{"p":"at an angle","m":"not straight; slanting","d":"In a position that is not straight, vertical or horizontal.","ex":["The tower leans at an angle of five degrees.","He wore his hat at an angle."],"key":"at an angle","syn":["slanting","aslant","obliquely"],"reg":"neutral","ielts":"careful","note":"Rarely needed; may fit Task 1 process or map descriptions."},{"p":"anywhere near sth","m":"even close to something","d":"Used in negatives and questions to mean even approximately close to an amount or state.","ex":["The sales figures are not anywhere near last year's level.","Nowhere is anywhere near as crowded as the capital."],"key":"anywhere near","syn":["nearly","close to","approaching"],"reg":"informal","ielts":"careful","note":"Useful for comparing figures in Task 1, but 'nowhere near' is safer."},{"p":"it would appear (that)","m":"it seems that","d":"A cautious, formal way to say that something seems to be true.","ex":["It would appear that crime rates have fallen significantly.","It would appear that the policy has had little effect."],"key":"It would appear that","syn":["it seems that","apparently","it looks as though"],"reg":"formal","ielts":"yes","note":"Excellent hedging phrase for Task 1 and Task 2."},{"p":"as it happens","m":"by chance; in fact","d":"Used to give extra information that is surprising or coincidental.","ex":["As it happens, I studied there for two years.","As it happens, the shop closed last month."],"key":"As it happens","syn":["by chance","as a matter of fact","incidentally"],"reg":"informal","ielts":"no","note":"Mostly spoken; good in Speaking Part 1 and 2."},{"p":"as many as","m":"up to as large a number as","d":"Used before a number to show it is surprisingly large.","ex":["As many as forty percent of graduates change careers.","As many as 2,000 people attended the festival."],"key":"As many as forty percent","syn":["up to","no fewer than","a total of"],"reg":"neutral","ielts":"yes","note":"Good for stressing large figures in Task 1; use with countable nouns."},{"p":"as yet","m":"until now","d":"Up to the present time; usually used in negative sentences.","ex":["No cure has as yet been found for the disease.","As yet, there is no evidence of long-term harm."],"key":"as yet","syn":["so far","up to now","to date"],"reg":"formal","ielts":"yes","note":"Useful for research and future-oriented points in Task 2."},{"p":"in association with","m":"together with; connected to","d":"Working jointly with another organisation, or linked with something.","ex":["The report was published in association with the United Nations.","Obesity is often found in association with poor diet."],"key":"in association with the United Nations","syn":["in partnership with","together with","in conjunction with"],"reg":"formal","ielts":"yes","note":"Formal and flexible; works for cooperation and causal links."},{"p":"at the expense of sth","m":"harming or losing something else","d":"With damage or loss to something else as the price of an advantage.","ex":["Economic growth should not come at the expense of the environment.","He succeeded at the expense of his health."],"key":"at the expense of the environment","syn":["to the detriment of","at the cost of","to the disadvantage of"],"reg":"formal","ielts":"yes","note":"Excellent for Task 2 discussing trade-offs and negative effects."},{"p":"at a glance","m":"immediately, with a quick look","d":"Understood or seen immediately, without careful study.","ex":["The chart shows at a glance how prices have risen.","She could tell at a glance that something was wrong."],"key":"at a glance","syn":["immediately","at first sight","in a quick look"],"reg":"neutral","ielts":"careful","note":"Possible in Task 1 overviews; keep for visual summaries."},{"p":"at hand","m":"near and available","d":"Close in time or place; nearby and available to use.","ex":["Help is always at hand for new students.","With the exams at hand, she stopped going out."],"key":"at hand","syn":["nearby","available","within reach"],"reg":"formal","ielts":"yes","note":"Neat formal phrase; fits support and technology topics."},{"p":"at the very least","m":"as an absolute minimum","d":"Used to say that the minimum is a certain amount, and the real one may be more.","ex":["At the very least, schools should teach basic financial skills.","The repairs will cost at the very least a million pounds."],"key":"At the very least","syn":["at a minimum","at least","if nothing else"],"reg":"neutral","ielts":"yes","note":"Good for emphasising minimum recommendations in Task 2."},{"p":"at short notice","m":"with little warning","d":"With very little warning or time to prepare.","ex":["Employers sometimes cancel shifts at short notice.","The meeting was arranged at short notice."],"key":"at short notice","syn":["without much warning","at the last minute","with little warning"],"reg":"neutral","ielts":"yes","note":"Useful in work topics; fine for General Training letters."},{"p":"at once","m":"immediately; at the same time","d":"Immediately, or at the same time; context shows the meaning.","ex":["The authorities must act at once to protect the coast.","It is hard to do several tasks at once."],"key":"at once","syn":["immediately","straight away","simultaneously"],"reg":"neutral","ielts":"yes","note":"Fine in essays and letters; the meaning depends on the context."},{"p":"at random","m":"without a plan or pattern","d":"Chosen without any system, pattern or aim.","ex":["Participants were selected at random from the voter list.","The results were not distributed at random."],"key":"at random","syn":["randomly","arbitrarily","haphazardly"],"reg":"neutral","ielts":"yes","note":"Useful in describing survey methods in Task 1 or 2."},{"p":"at times","m":"sometimes","d":"On some occasions, but not always.","ex":["Public transport can be unreliable at times.","Studying abroad is lonely at times."],"key":"at times","syn":["sometimes","occasionally","from time to time"],"reg":"neutral","ielts":"yes","note":"Good hedging adverbial; vary it with 'occasionally'."},{"p":"attached to sb/sth","m":"fond of or joined to","d":"Feeling affection for a person or thing, or physically joined to something.","ex":["Many elderly people are deeply attached to their homes.","A small camera was attached to the drone."],"key":"attached to their homes","syn":["fond of","devoted to","connected to"],"reg":"neutral","ielts":"yes","note":"Good for emotion, tradition and family topics."},{"p":"be authorized to do sth","m":"have official permission to do something","d":"To have the official right or permission to do something.","ex":["Only trained staff are authorized to handle chemicals.","Who is authorized to sign this form?"],"key":"are authorized to handle chemicals","syn":["be permitted to","be empowered to","have the authority to"],"reg":"formal","ielts":"yes","note":"Formal; good in letters and work or law topics."},{"p":"back road/street","m":"a quiet minor road","d":"A small, quiet road away from main routes.","ex":["We avoided the traffic by taking the back roads.","Many cafes hide in the back streets of the old town."],"key":"back roads","syn":["side road","minor road","side street"],"reg":"neutral","ielts":"careful","note":"Descriptive; fits map description or speaking, not argument."},{"p":"too bad","m":"unfortunate; a pity","d":"Used to say something is a pity or that nothing can be done.","ex":["It is too bad that the museum closes so early.","Too bad you missed the concert."],"key":"too bad","syn":["what a pity","unfortunate","never mind"],"reg":"informal","ielts":"no","note":"Spoken or friend letters only; avoid in essays."},{"p":"strike a balance","m":"find a fair middle position","d":"To find a satisfactory compromise between two competing things.","ex":["Governments must strike a balance between growth and conservation.","It is hard to strike a balance between work and family."],"key":"strike a balance between growth and conservation","syn":["find a compromise","find a middle ground","balance"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 for discussing competing priorities."},{"p":"on the basis of sth","m":"because of or using something","d":"Using something as the reason or foundation for a decision or judgement.","ex":["Candidates are chosen on the basis of merit.","The theory was formed on the basis of several studies."],"key":"on the basis of merit","syn":["based on","according to","by reference to"],"reg":"formal","ielts":"yes","note":"Strong formal phrase for criteria and evidence."},{"p":"bear left/right","m":"turn gently to the left or right","d":"To follow a road as it curves slightly in a given direction.","ex":["Bear left at the fork and follow the river.","Bear right after the church."],"key":"Bear left","syn":["veer left","turn slightly left","keep left"],"reg":"neutral","ielts":"careful","note":"Useful for map directions in General Training letters."},{"p":"before you know it","m":"very soon","d":"Used to say that something happens much sooner than expected.","ex":["Before you know it, the holidays will be over.","Before you know it, you will be fluent."],"key":"Before you know it","syn":["very soon","in no time","in a flash"],"reg":"informal","ielts":"no","note":"Spoken only; use in Speaking, not in essays."},{"p":"behind the times","m":"old-fashioned","d":"Not modern; having outdated ideas or methods.","ex":["Some critics say the education system is behind the times.","His attitude to technology is behind the times."],"key":"behind the times","syn":["old-fashioned","outdated","out of touch"],"reg":"informal","ielts":"careful","note":"Idiomatic; prefer 'outdated' in formal essays."},{"p":"a bit of a change/fool/problem, etc.","m":"somewhat of a change, fool or problem","d":"Used before a noun to say that someone or something is partly like it; informal and understating.","ex":["Moving abroad was a bit of a change for the whole family.","Parking is a bit of a problem in the city."],"key":"a bit of a change","syn":["something of a","rather a","quite a"],"reg":"informal","ielts":"no","note":"Informal softener; good in speaking, not essays."},{"p":"bit by bit","m":"gradually, in small steps","d":"Slowly and in small stages.","ex":["Bit by bit, she rebuilt her confidence.","The old town was restored bit by bit."],"key":"Bit by bit","syn":["gradually","little by little","step by step"],"reg":"neutral","ielts":"careful","note":"Prefer 'gradually' in essays; good for speaking."},{"p":"be to blame","m":"be responsible for something bad","d":"To be the person or thing responsible for a fault or problem; often followed by for.","ex":["Poor planning is largely to blame for the traffic.","Who is to blame for rising prices?"],"key":"is largely to blame","syn":["be at fault","be responsible","be guilty"],"reg":"neutral","ielts":"yes","note":"Useful for causes in Task 2; often 'be to blame for'."},{"p":"the blind","m":"people who cannot see","d":"Blind people as a group; used with a plural verb.","ex":["Audio guides make museums accessible to the blind.","The charity supports the blind and partially sighted."],"key":"the blind","syn":["visually impaired people","sightless people","those without sight"],"reg":"neutral","ielts":"careful","note":"Prefer 'visually impaired people' as it sounds more modern."},{"p":"break even","m":"earn just enough to cover costs","d":"To make neither a profit nor a loss.","ex":["The company hopes to break even by the end of the year.","Many small cafes only just break even."],"key":"break even","syn":["cover costs","make neither profit nor loss","balance the books"],"reg":"neutral","ielts":"yes","note":"Useful in business topics and Task 1 finance charts."},{"p":"catch your breath; get your breath back","m":"rest until breathing is normal again","d":"To rest after exercise until you breathe normally; also to pause after a shock.","ex":["She stopped on the hill to catch her breath.","He sat down to get his breath back."],"key":"catch her breath","syn":["recover","pause for a rest","regain your breath"],"reg":"neutral","ielts":"no","note":"Good for narrative and speaking; not for formal essays."},{"p":"bring sth to an end","m":"finish something","d":"To make something stop or finish.","ex":["The treaty brought the long conflict to an end.","New laws could bring the practice to an end."],"key":"brought the long conflict to an end","syn":["end","put a stop to","terminate"],"reg":"neutral","ielts":"yes","note":"Natural in Task 2 for solutions; alternative: 'put an end to'."},{"p":"broken English/Spanish, etc.","m":"speaking a language badly with mistakes","d":"Speech in a language with many mistakes and little fluency.","ex":["He spoke in broken English but made himself understood.","The tourists asked for directions in broken Spanish."],"key":"broken English","syn":["poor English","halting English","imperfect English"],"reg":"neutral","ielts":"careful","note":"Fine in speaking Part 2 stories; avoid in formal essays."},{"p":"brush sth away/off, etc.","m":"remove something with light sweeping","d":"To remove something by moving a hand or brush lightly across it; can also mean dismiss.","ex":["She brushed the dust off her coat.","He brushed away the criticism."],"key":"brushed the dust off","syn":["wipe away","sweep off","flick away"],"reg":"neutral","ielts":"careful","note":"Literal use is for speaking; 'brush aside' fits arguments."},{"p":"bubble (over) with confidence/enthusiasm, etc.","m":"be full of a lively feeling","d":"To show a lot of happy, lively feeling.","ex":["The children were bubbling over with excitement.","She bubbled with enthusiasm about the project."],"key":"bubbling over with excitement","syn":["brim with","be full of","overflow with"],"reg":"neutral","ielts":"careful","note":"Lively descriptive phrase for Speaking; use sparingly in writing."},{"p":"in bulk","m":"in large quantities","d":"In large amounts, usually to get a lower price.","ex":["Supermarkets buy goods in bulk to reduce costs.","Rice is cheaper if you buy it in bulk."],"key":"in bulk","syn":["in large quantities","wholesale","in large amounts"],"reg":"neutral","ielts":"yes","note":"Useful in economics and shopping topics."},{"p":"the bulk of sth","m":"most of something","d":"The main or largest part of something.","ex":["The bulk of the budget goes on salaries.","The bulk of students live off campus."],"key":"The bulk of the budget","syn":["the majority of","most of","the greater part of"],"reg":"formal","ielts":"yes","note":"Great for Task 1 describing the largest share."},{"p":"a burning issue/question","m":"an extremely important problem","d":"A subject that people feel strongly about and want solved urgently.","ex":["Climate change is a burning issue for young voters.","The cost of housing is a burning question."],"key":"a burning issue","syn":["a pressing issue","an urgent matter","a hot topic"],"reg":"neutral","ielts":"yes","note":"Strong collocation for introductions in Task 2."},{"p":"burning ambition/desire, etc.","m":"very strong ambition or desire","d":"A very strong feeling of wanting to achieve something.","ex":["She had a burning ambition to become a surgeon.","He felt a burning desire to travel."],"key":"a burning ambition","syn":["intense ambition","strong desire","fierce determination"],"reg":"neutral","ielts":"yes","note":"Good for personal goals in Speaking and General Training letters."},{"p":"by and large","m":"generally; on the whole","d":"In most cases; considering everything.","ex":["By and large, urban residents have better access to services.","The plan was, by and large, successful."],"key":"By and large","syn":["on the whole","generally","for the most part"],"reg":"neutral","ielts":"yes","note":"Useful to generalise in Task 1 or Task 2."},{"p":"by law","m":"as required by law","d":"As demanded by the law of a country.","ex":["Children must attend school by law.","Employers are required by law to provide safe workplaces."],"key":"by law","syn":["legally","under the law","as legally required"],"reg":"neutral","ielts":"yes","note":"Useful for rules and government topics in Task 2."},{"p":"by way of sth","m":"through or as a form of","d":"Passing through a place, or acting as a form of something.","ex":["We travelled to Rome by way of Paris.","He offered a small gift by way of thanks."],"key":"by way of Paris","syn":["via","through","as a form of"],"reg":"formal","ielts":"yes","note":"Formal alternative to 'via'; good for routes or explanations."},{"p":"call an election/meeting, etc.","m":"officially arrange an election or meeting","d":"To announce that an election or meeting will take place.","ex":["The prime minister called an election for May.","The union called a meeting to discuss the strike."],"key":"called an election","syn":["announce","convene","summon"],"reg":"formal","ielts":"yes","note":"Useful in politics and workplace topics."},{"p":"a call for sth","m":"a public demand for something","d":"A request or demand, usually public, for action or change.","ex":["The report issued a call for urgent reform.","There were calls for tougher environmental laws."],"key":"a call for urgent reform","syn":["a demand for","an appeal for","a plea for"],"reg":"formal","ielts":"yes","note":"Good for describing social demands in Task 2."},{"p":"to cap it all","m":"as the final extra bad or good thing","d":"Used to introduce a last event, usually one making a situation even better or worse.","ex":["The flight was late and, to cap it all, my bag was lost.","To cap it all, the sun came out."],"key":"to cap it all","syn":["on top of everything","to crown it all","as a final blow"],"reg":"informal","ielts":"no","note":"Spoken or anecdotal; avoid in formal writing."},{"p":"capture sb's attention/ imagination/ interest","m":"make someone very interested","d":"To attract and hold someone's interest or imagination.","ex":["The documentary captured the public's imagination.","Advertisements must capture consumers' attention quickly."],"key":"captured the public's imagination","syn":["catch someone's eye","grab","fascinate"],"reg":"neutral","ielts":"yes","note":"Useful for media and advertising topics in Task 2."},{"p":"take care of sth/doing sth","m":"look after or deal with something","d":"To look after a person or thing, or deal with a task.","ex":["Parents should take care of their elderly relatives.","I will take care of booking the hotel."],"key":"take care of their elderly relatives","syn":["look after","deal with","handle"],"reg":"neutral","ielts":"yes","note":"Suitable for family topics; 'look after' is also fine."},{"p":"I/he, etc. couldn't care less","m":"I do not care at all","d":"Used to show that someone is completely indifferent.","ex":["Honestly, he couldn't care less about the results.","I couldn't care less about fashion."],"key":"couldn't care less","syn":["not give a hoot","be indifferent","not mind at all"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays and use 'be indifferent'."},{"p":"know/say for certain","m":"be completely sure about a fact","d":"To be absolutely sure of something; often used in negatives.","ex":["No one can say for certain how the universe began.","We cannot know for certain whether prices will fall."],"key":"say for certain","syn":["know for sure","be certain","state definitively"],"reg":"neutral","ielts":"yes","note":"Useful for cautious claims about the future in Task 2."},{"p":"certainly not","m":"definitely no","d":"A strong way to say no or to deny something.","ex":["Is tuition free? Certainly not in most countries.","Certainly not all students enjoy group work."],"key":"Certainly not","syn":["definitely not","by no means","absolutely not"],"reg":"neutral","ielts":"careful","note":"Emphatic; use for disagreement in speaking and sparingly in essays."},{"p":"the cleaner's","m":"a shop that cleans clothes","d":"A shop where clothes are dry-cleaned; mainly British.","ex":["I took my suit to the cleaner's on Monday.","The cleaner's on the corner closes at five."],"key":"the cleaner's","syn":["dry cleaner's","laundry","laundrette"],"reg":"neutral","ielts":"no","note":"Everyday word for General Training letters; not essay language."},{"p":"crystal clear","m":"completely clear and easy to understand","d":"Extremely clear, either in meaning or in appearance.","ex":["The instructions were crystal clear.","The lake water was crystal clear."],"key":"crystal clear","syn":["perfectly clear","transparent","unmistakable"],"reg":"neutral","ielts":"careful","note":"Idiomatic; use occasionally for emphasis in Speaking."},{"p":"be/come close to doing sth","m":"almost do something","d":"To be very near to achieving or doing something.","ex":["The team came close to winning the title.","She was close to resigning."],"key":"came close to winning","syn":["almost do","come near to","be on the verge of"],"reg":"neutral","ielts":"yes","note":"Useful for near achievements in Task 1 or Task 2."},{"p":"be close to sth","m":"be near or similar to something","d":"To be physically near something, or almost at a state or figure.","ex":["The figure is close to ten percent.","The school is close to the station."],"key":"is close to ten percent","syn":["be near","approach","be approximately"],"reg":"neutral","ielts":"yes","note":"Handy in Task 1 for approximate values."},{"p":"come easily/easy/naturally","m":"be natural or effortless for someone","d":"To be something a person does without difficulty; often with to + person.","ex":["Languages come easily to some children.","Leadership comes naturally to her."],"key":"come easily","syn":["be effortless","be second nature","be simple"],"reg":"neutral","ielts":"yes","note":"Good for talents and learning topics."},{"p":"come first","m":"be the most important priority","d":"To be treated as more important than anything else; also to finish first in a race.","ex":["For many parents, safety comes first.","Customers must come first in any business."],"key":"comes first","syn":["take priority","be the top priority","rank highest"],"reg":"neutral","ielts":"yes","note":"Useful for priorities in Task 2."},{"p":"come to mind","m":"be remembered or thought of","d":"To occur to you; to be thought of suddenly.","ex":["Several solutions come to mind.","What comes to mind when you hear the word 'home'?"],"key":"come to mind","syn":["occur to one","spring to mind","cross one's mind"],"reg":"neutral","ielts":"yes","note":"Good for introducing examples; common in Speaking too."},{"p":"when it comes to sth/doing sth","m":"regarding a particular subject","d":"Used to introduce the topic being discussed.","ex":["When it comes to saving energy, small changes matter.","When it comes to choosing a career, salary is important."],"key":"When it comes to saving energy","syn":["as regards","with regard to","as far as ... is concerned"],"reg":"neutral","ielts":"yes","note":"Useful topic introducer; keep it formal with 'with regard to'."},{"p":"how come","m":"why; for what reason","d":"A casual way of asking why something happened.","ex":["How come you never told me about the exam?","How come the shop is closed?"],"key":"How come","syn":["why","what is the reason","for what reason"],"reg":"informal","ielts":"no","note":"Spoken questions only; never in essays."},{"p":"in common with sb/sth","m":"like someone or something else","d":"In the same way as another person or thing.","ex":["In common with many countries, Japan has an ageing population.","In common with her peers, she uses social media daily."],"key":"In common with many countries","syn":["like","similar to","just as"],"reg":"formal","ielts":"yes","note":"Excellent for comparisons in Task 1 and Task 2."},{"p":"be good company","m":"be pleasant to spend time with","d":"To be an enjoyable person to be with.","ex":["My grandmother is very good company.","He is always good company at parties."],"key":"is very good company","syn":["be pleasant to be with","be enjoyable to know","be sociable"],"reg":"neutral","ielts":"careful","note":"Fits Speaking topics on friends and family."},{"p":"comparatively cheap/easy/little, etc.","m":"relatively cheap, easy or small","d":"Used before an adjective to show something is so when compared with others.","ex":["Train travel is comparatively cheap in Europe.","The test was comparatively easy."],"key":"comparatively cheap","syn":["relatively cheap","fairly cheap","cheap by comparison"],"reg":"formal","ielts":"yes","note":"Good in Task 1 to compare values or costs."},{"p":"compare notes","m":"share and discuss experiences with someone","d":"To exchange opinions or experiences with someone on the same topic.","ex":["After the lecture we compared notes on the reading.","Teachers meet to compare notes about their classes."],"key":"compared notes","syn":["swap ideas","exchange views","share experiences"],"reg":"neutral","ielts":"careful","note":"Better for Speaking; informal for essays."},{"p":"feel compelled to do sth","m":"feel you must do something","d":"To feel strongly forced by a moral or emotional need to do something.","ex":["Many people feel compelled to donate after a disaster.","She felt compelled to speak out."],"key":"feel compelled to donate","syn":["feel obliged to","feel driven to","feel forced to"],"reg":"formal","ielts":"yes","note":"Good for pressure and social duty topics in Task 2."},{"p":"(be) concentrated around/in/on, etc.","m":"be gathered in one place","d":"To be found mainly in a particular area or place.","ex":["Industry is concentrated in the north of the country.","Most jobs are concentrated around the capital."],"key":"concentrated in the north","syn":["be clustered","be centred","be focused"],"reg":"formal","ielts":"yes","note":"Great for Task 1 describing distribution on maps and charts."},{"p":"be concerned with sth","m":"deal with or be about something","d":"To be about, or to involve, a particular subject.","ex":["This essay is concerned with the causes of unemployment.","Economics is concerned with how resources are used."],"key":"is concerned with the causes of unemployment","syn":["deal with","relate to","be about"],"reg":"formal","ielts":"yes","note":"Good for introductions to essays and reports."},{"p":"as a consequence","m":"as a result","d":"Used to introduce the result of something mentioned earlier.","ex":["Prices rose; as a consequence, demand fell.","As a consequence, many small shops closed."],"key":"as a consequence","syn":["as a result","consequently","therefore"],"reg":"formal","ielts":"yes","note":"Strong linker for cause and effect in Task 2."},{"p":"of little/no consequence","m":"unimportant","d":"Not important or without serious effects.","ex":["The delay was of little consequence to the final result.","His opinion is of no consequence here."],"key":"of little consequence","syn":["unimportant","trivial","insignificant"],"reg":"formal","ielts":"yes","note":"Formal alternative to 'unimportant' in essays."},{"p":"to the contrary","m":"saying the opposite","d":"Showing or saying the opposite of what was said or expected.","ex":["Despite claims to the contrary, the tax cut did not help.","He said nothing to the contrary."],"key":"claims to the contrary","syn":["the opposite","on the other hand","in contrast"],"reg":"formal","ielts":"yes","note":"Useful for refuting opposing views in Task 2."},{"p":"contrary to sth","m":"opposite to something","d":"In disagreement with a belief, statement or expectation.","ex":["Contrary to popular belief, bats are not blind.","Contrary to expectations, sales rose."],"key":"Contrary to popular belief","syn":["in contrast to","as opposed to","unlike"],"reg":"formal","ielts":"yes","note":"Excellent for introducing a surprising fact in Task 2."},{"p":"conventional wisdom","m":"what most people believe","d":"The generally accepted belief or opinion about something.","ex":["Conventional wisdom says that early starts improve results.","The study challenges conventional wisdom on diet."],"key":"Conventional wisdom","syn":["common belief","accepted view","received wisdom"],"reg":"formal","ielts":"yes","note":"Good for introducing and challenging common ideas in Task 2."},{"p":"hold a conversation","m":"talk with someone","d":"To have a continuous chat with another person.","ex":["After a year, she could hold a conversation in French.","It is hard to hold a conversation in a noisy cafe."],"key":"hold a conversation","syn":["have a chat","converse","talk"],"reg":"neutral","ielts":"careful","note":"Useful in language learning topics and Speaking."},{"p":"during/in/over the course of sth","m":"while something continues","d":"Throughout the period of something.","ex":["Over the course of a decade, rents doubled.","During the course of the study, 200 people were interviewed."],"key":"Over the course of a decade","syn":["throughout","in the course of","over the period of"],"reg":"formal","ielts":"yes","note":"Perfect for describing time periods in Task 1."},{"p":"a matter of course","m":"a normal automatic part of something","d":"Something done as the usual or expected thing.","ex":["Safety checks are carried out as a matter of course.","He assumed that tipping was a matter of course."],"key":"a matter of course","syn":["routine","standard procedure","the norm"],"reg":"formal","ielts":"yes","note":"Useful for describing standard practices in Task 2."},{"p":"crack a joke","m":"tell a joke","d":"To say something funny.","ex":["The teacher cracked a joke to ease the tension.","He cracked a joke at the interview."],"key":"cracked a joke","syn":["tell a joke","make a joke","quip"],"reg":"informal","ielts":"no","note":"Speaking only; use 'humour' or 'jokes' in essays."},{"p":"like crazy","m":"very intensely or a lot","d":"Extremely fast, hard or a lot; very informal.","ex":["Prices have been rising like crazy.","We worked like crazy to finish."],"key":"like crazy","syn":["like mad","a great deal","intensely"],"reg":"informal","ielts":"no","note":"Slang; use for Speaking only, never in essays."},{"p":"the cream of sth","m":"the best part of something","d":"The best people or things within a group.","ex":["The cream of the country's graduates apply for the scheme.","Only the cream of the crop was chosen."],"key":"The cream of the country's graduates","syn":["the best of","the elite","the pick of"],"reg":"neutral","ielts":"careful","note":"Idiomatic and slightly literary; use it only occasionally."},{"p":"dare sb to do sth","m":"challenge someone to do something risky","d":"To challenge someone to do something dangerous or difficult.","ex":["My friends dared me to jump from the cliff.","She dared him to speak up."],"key":"dared me to jump","syn":["challenge","goad","defy"],"reg":"informal","ielts":"no","note":"Informal; Speaking stories about childhood only."},{"p":"How dare she/you, etc.","m":"an angry expression of shock","d":"Used to express anger that someone has done something unacceptable.","ex":["How dare you speak to me like that!","How dare they close the library?"],"key":"How dare you","syn":["what a nerve","how could you","what gall"],"reg":"informal","ielts":"no","note":"Emotional and spoken; avoid in all essays."},{"p":"the dawn of sth","m":"the very beginning of something","d":"The first stage or earliest period of something.","ex":["Since the dawn of civilisation, people have farmed.","The dawn of the internet changed communication."],"key":"the dawn of civilisation","syn":["the beginning of","the birth of","the start of"],"reg":"formal","ielts":"yes","note":"Good in Task 2 introductions about history and change."},{"p":"the old days","m":"a time long ago","d":"A past time, often remembered as different from today.","ex":["In the old days, letters took weeks to arrive.","My grandfather talks about the old days."],"key":"the old days","syn":["the past","former times","bygone days"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; use 'in the past' in essays."},{"p":"be dead (set) against sth/doing sth","m":"strongly oppose something","d":"To be completely opposed to something.","ex":["Many residents are dead set against the new road.","She is dead against moving abroad."],"key":"are dead set against","syn":["be strongly opposed to","be firmly against","object to"],"reg":"informal","ielts":"no","note":"Spoken; write 'be strongly opposed to' in essays."},{"p":"deadly dull/serious, etc.","m":"extremely boring or serious","d":"Used with an adjective to mean extremely so.","ex":["The lecture was deadly dull.","He was deadly serious about quitting."],"key":"deadly dull","syn":["extremely boring","really serious","terribly dull"],"reg":"informal","ielts":"no","note":"Speaking only; informal intensifier."},{"p":"a good deal","m":"a large amount","d":"A large amount or quite a lot of something.","ex":["A good deal of money is wasted on packaging.","He has learnt a good deal since then."],"key":"A good deal of money","syn":["a great deal","a lot","plenty"],"reg":"neutral","ielts":"yes","note":"Neutral quantifier; vary with 'a great deal of'."},{"p":"to sth","m":"to a thing; as in a solution to","d":"Preposition pattern linking a noun to its target, as in a solution to something.","ex":["Education is the key to the problem of poverty.","There is no easy answer to the question."],"key":"to the problem of poverty","syn":["for","towards","regarding"],"reg":"neutral","ielts":"yes","note":"Common after nouns like solution, answer, key and access."},{"p":"definitely not","m":"absolutely no","d":"A very firm way of saying no or denying something.","ex":["Should schools ban phones? Definitely not, in my view.","These changes will definitely not solve the issue."],"key":"Definitely not","syn":["certainly not","absolutely not","by no means"],"reg":"neutral","ielts":"careful","note":"Emphatic; prefer 'by no means' in formal writing."},{"p":"in demand","m":"wanted by many people","d":"Wanted or needed by a lot of people.","ex":["Nurses are in demand all over the world.","Skilled workers are in demand."],"key":"in demand","syn":["sought after","popular","wanted"],"reg":"neutral","ielts":"yes","note":"Useful for jobs and trends in Task 1 or Task 2."},{"p":"dependent on/upon sth","m":"relying on something","d":"Needing something for support, or determined by something else.","ex":["Many economies are dependent on tourism.","Success is dependent upon hard work."],"key":"dependent on tourism","syn":["reliant on","contingent on","based on"],"reg":"formal","ielts":"yes","note":"Good in Task 2 on dependence and cause; spelling is 'dependent'."},{"p":"tell the difference","m":"see how two things differ","d":"To notice how two things are different.","ex":["Few people can tell the difference between the two.","It is hard to tell the difference."],"key":"tell the difference","syn":["distinguish","differentiate","notice the contrast"],"reg":"neutral","ielts":"yes","note":"Often followed by 'between'; useful for comparisons."},{"p":"put sb in a difficult position","m":"cause someone problems or embarrassment","d":"To create a hard situation for someone.","ex":["The new rules put teachers in a difficult position.","His comments put me in a difficult position."],"key":"put teachers in a difficult position","syn":["place someone in a bind","embarrass","corner"],"reg":"neutral","ielts":"yes","note":"Useful for dilemmas in Task 2."},{"p":"etc. sb/sth","m":"do something to someone or something","d":"A fragment standing for 'do sb/sth': to perform an action affecting someone or something.","ex":["The pollution could do us serious harm.","Regular exercise can do the body good."],"key":"do us serious harm","syn":["cause","inflict","bring about"],"reg":"neutral","ielts":"careful","note":"Use in set phrases like 'do harm' and 'do good'."},{"p":"etc.","m":"and so on","d":"Abbreviation of et cetera, used to show a list continues; written, not spoken.","ex":["Students need pens, paper, folders, etc.","Cities offer jobs, schools, hospitals, etc."],"key":"etc.","syn":["and so on","and the like","and so forth"],"reg":"neutral","ielts":"careful","note":"Avoid overusing in essays; give full examples instead."},{"p":"will do","m":"is good enough or I will do it","d":"Used to agree to something or to say something is acceptable.","ex":["Any seat will do for me.","Will you send the report? Will do."],"key":"will do","syn":["be enough","be fine","be adequate"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"do your utmost","m":"try as hard as possible","d":"To make the greatest possible effort to achieve something.","ex":["Governments should do their utmost to cut emissions.","She did her utmost to help."],"key":"do their utmost","syn":["try your hardest","do your best","spare no effort"],"reg":"formal","ielts":"yes","note":"Strong phrase for recommendations in Task 2."},{"p":"no doubt","m":"certainly; probably","d":"Used to say something is almost certainly true.","ex":["No doubt, technology has improved our lives.","He will no doubt be late."],"key":"No doubt","syn":["undoubtedly","certainly","without question"],"reg":"neutral","ielts":"yes","note":"Good for concessions before 'but' or 'however' in Task 2."},{"p":"do sth","m":"perform an action","d":"A general pattern meaning to perform or carry out an action or task.","ex":["Students should do research before writing.","I need to do my homework."],"key":"do research","syn":["carry out","perform","complete"],"reg":"neutral","ielts":"careful","note":"Prefer a specific verb like 'conduct' in academic writing."},{"p":"be due for sth","m":"be expected to get something soon","d":"To be at the time when something should happen or be given.","ex":["The roads are due for repair.","She is due for a promotion."],"key":"are due for repair","syn":["be scheduled for","be ready for","be overdue for"],"reg":"neutral","ielts":"careful","note":"Fits work and infrastructure topics."},{"p":"have an ear for sth","m":"have natural skill at hearing something","d":"To be good at noticing sounds, especially music or language.","ex":["She has an ear for languages.","He has an ear for music."],"key":"has an ear for languages","syn":["be gifted at","have a talent for","be good at"],"reg":"neutral","ielts":"careful","note":"Good in Speaking about talents; moderate in essays."},{"p":"how/what/why, etc. on earth?","m":"an emphatic way to ask a question","d":"Used after a question word to show surprise or annoyance.","ex":["How on earth did they finish so quickly?","Why on earth would anyone refuse?"],"key":"How on earth","syn":["how in the world","however","what the heck"],"reg":"informal","ielts":"no","note":"Spoken emphasis; avoid in essays."},{"p":"have little/no effect","m":"achieve almost nothing","d":"To produce few or no results.","ex":["Fines have little effect on rich drivers.","The medicine had no effect on the symptoms."],"key":"have little effect","syn":["be ineffective","make little difference","achieve nothing"],"reg":"neutral","ielts":"yes","note":"Useful for evaluating policies in Task 2."},{"p":"take effect","m":"begin to work or apply","d":"To start to produce results or become valid.","ex":["The new law will take effect in January.","The painkillers took effect quickly."],"key":"take effect","syn":["come into force","start working","become active"],"reg":"neutral","ielts":"yes","note":"Good for policy and laws in Task 2."},{"p":"the elderly","m":"old people as a group","d":"Old people considered as a group; used with a plural verb.","ex":["Health care for the elderly is expensive.","The elderly often feel lonely."],"key":"the elderly","syn":["older people","senior citizens","the aged"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 on ageing; 'older people' also fine."},{"p":"endeavour to do sth","m":"try hard to do something","d":"To try seriously to achieve something; formal.","ex":["Schools should endeavour to treat all pupils fairly.","We endeavour to reply within a day."],"key":"endeavour to treat all pupils fairly","syn":["strive to","attempt to","seek to"],"reg":"formal","ielts":"yes","note":"Formal and impressive; good in Task 2 and letters."},{"p":"have had enough","m":"be unable to tolerate more","d":"To be tired of or annoyed by something and unwilling to accept more.","ex":["Residents have had enough of the noise.","I have had enough of this rain."],"key":"have had enough","syn":["be fed up","be sick of","not tolerate more"],"reg":"informal","ielts":"no","note":"Spoken; use 'no longer tolerate' in essays."},{"p":"communication/relations, etc.","m":"words like communication or relations ending in a plural-looking form","d":"Pattern showing nouns that are used in plural form, such as communications or relations, with a specific meaning.","ex":["Diplomatic relations between the two countries have improved considerably.","The company invested heavily in new communications technology."],"key":"relations","syn":["plural nouns","fixed plurals"],"reg":"neutral","ielts":"careful","note":"A pattern note, not a phrase; use the specific noun instead."},{"p":"even so","m":"despite that; however","d":"Linking adverb used to introduce a fact that is surprising given what was just said.","ex":["The policy was widely criticised; even so, it remained in force for a decade.","Prices have fallen recently. Even so, many families still struggle to afford housing."],"key":"even so","syn":["nevertheless","nonetheless","all the same"],"reg":"neutral","ielts":"yes","note":"Useful contrast linker in Task 2 body paragraphs."},{"p":"in the event of sth","m":"if something happens","d":"Preposition phrase introducing a possible future situation, especially an unwelcome one.","ex":["In the event of a flood, residents must evacuate immediately.","The contract sets out what happens in the event of a dispute."],"key":"In the event of a flood","syn":["in case of","if there is","should there be"],"reg":"formal","ielts":"yes","note":"Good for formal policy or solution sentences in Task 2."},{"p":"in any event","m":"whatever happens; anyway","d":"Adverbial phrase meaning regardless of circumstances, often used to dismiss a previous point.","ex":["The results may be disputed, but in any event the study raises important questions.","We may not finish by Friday; in any event, the draft will be ready."],"key":"in any event","syn":["in any case","at any rate","regardless"],"reg":"neutral","ielts":"yes","note":"Fine as a linker; do not overuse in essays."},{"p":"ever","m":"at any time","d":"Adverb meaning at any time, used in questions, negatives and with comparatives or superlatives.","ex":["This is the most serious crisis the industry has ever faced.","Technology is changing ever faster than before."],"key":"has ever faced","syn":["at any time","on any occasion"],"reg":"neutral","ielts":"yes","note":"Common with superlatives and 'ever-increasing' in Task 1 and 2."},{"p":"every now and then","m":"sometimes but not often","d":"Adverbial phrase meaning occasionally, from time to time.","ex":["Every now and then, a new technology transforms an entire industry.","I still visit my old school every now and then."],"key":"Every now and then","syn":["occasionally","from time to time","once in a while"],"reg":"neutral","ielts":"careful","note":"Better as 'occasionally' in essays; fine in speaking."},{"p":"do everything in your power to do sth","m":"try as hard as possible to achieve something","d":"Idiom meaning to make every possible effort to do something.","ex":["Governments should do everything in their power to protect vulnerable children.","She did everything in her power to keep the business afloat."],"key":"do everything in their power to protect","syn":["do all you can","spare no effort","go to great lengths"],"reg":"neutral","ielts":"yes","note":"Strong phrase for Task 2 arguments about responsibility."},{"p":"not exactly easy/new/rich, etc.","m":"not very easy, new or rich; often ironic","d":"Pattern used to say something is not at all the quality named, often for understatement or irony.","ex":["Finding affordable housing in the capital is not exactly easy.","Their solution was not exactly new, but it was effective."],"key":"not exactly easy","syn":["hardly","far from","not particularly"],"reg":"neutral","ielts":"careful","note":"Understated tone; use sparingly in essays, fine in speaking."},{"p":"exceed sb's expectations","m":"be better than someone hoped","d":"Verb phrase meaning to turn out better or greater than people had expected.","ex":["The new scheme exceeded the council's expectations in its first year.","Her performance in the exam exceeded all her expectations."],"key":"exceeded the counci
