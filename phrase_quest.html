t before the exam gets most students nowhere."],"key":"will get you nowhere","syn":["be pointless","achieve nothing","be futile"],"reg":"informal","ielts":"careful","note":"Chatty; fine in speaking, use 'be ineffective' in essays."},{"p":"get sth over (and done) with","m":"finish an unpleasant task quickly so it is no longer a worry","d":"To complete something unpleasant or tiresome as soon as possible so that it no longer troubles you.","ex":["I would rather take the dentist appointment now and get it over with.","She wanted to get the interview over and done with."],"key":"get it over with","syn":["finish off","have done with","deal with promptly"],"reg":"informal","ielts":"no","note":"Spoken phrase; useful in Speaking Part 2 stories, not essays."},{"p":"Don't get me wrong","m":"used to prevent a misunderstanding of what you are about to say","d":"A spoken phrase used before a clarification to prevent the listener from misinterpreting your earlier remark.","ex":["Don't get me wrong, I love travelling, but it can be exhausting.","Don't get me wrong, social media has benefits, but it is overused."],"key":"Don't get me wrong","syn":["Please understand me","I don't mean to suggest otherwise","Let me be clear"],"reg":"informal","ielts":"no","note":"Good in Speaking to soften opinions; avoid in written essays."},{"p":"get moving","m":"start to act or go quickly","d":"To begin to move or act, often because there is little time or a task needs doing.","ex":["We need to get moving if we want to catch the early train.","The council must get moving on the housing crisis."],"key":"get moving","syn":["get going","hurry up","make a start"],"reg":"informal","ielts":"no","note":"Spoken; for essays use 'take prompt action' instead."},{"p":"get a move on","m":"hurry up","d":"An informal imperative expression used to tell someone to hurry or act more quickly.","ex":["Get a move on, or we'll miss the start of the lecture.","I need to get a move on with my coursework."],"key":"Get a move on","syn":["hurry up","step on it","get cracking"],"reg":"informal","ielts":"no","note":"Spoken only; never use in essays."},{"p":"get underway","m":"begin to happen","d":"To start or begin, said of an event, project or process; also written 'get under way'.","ex":["Construction of the new bridge will get underway next spring.","The festival got underway with a spectacular parade."],"key":"get underway","syn":["begin","commence","start"],"reg":"neutral","ielts":"yes","note":"Good for describing projects or events; fine in Task 1 plans."},{"p":"give rise to sth","m":"cause something to happen or exist","d":"To be the cause of something, usually something unwelcome or important; followed by a noun phrase.","ex":["Rapid urbanisation can give rise to serious social problems.","The invention of the printing press gave rise to mass literacy."],"key":"give rise to","syn":["lead to","bring about","cause"],"reg":"formal","ielts":"yes","note":"Excellent cause-and-effect phrase for Task 2; vary with 'lead to'."},{"p":"give vent to","m":"express strong feelings openly","d":"To express a strong emotion, such as anger or frustration, openly; followed by a noun phrase.","ex":["Sport allows people to give vent to their frustrations safely.","Protesters gave vent to their anger outside the parliament building."],"key":"give vent to","syn":["express","release","let out"],"reg":"formal","ielts":"careful","note":"Literary; usable for emotions or stress topics, but not essential."},{"p":"give way to sth","m":"be replaced by something else","d":"To be replaced by something newer or different, or to yield to pressure or emotion.","ex":["Traditional shops are giving way to online retailers.","Her nervousness gave way to excitement as the music began."],"key":"giving way to","syn":["be replaced by","yield to","make way for"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 trends and Task 2 social change."},{"p":"give way","m":"collapse, or allow others to go first","d":"To collapse under pressure, to yield in an argument, or to allow other traffic to pass first.","ex":["The old bridge gave way under the weight of the lorry.","Drivers must give way to pedestrians at the crossing."],"key":"gave way","syn":["collapse","yield","concede"],"reg":"neutral","ielts":"careful","note":"Fine for traffic or safety topics; check meaning matches context."},{"p":"give sb a hard time","m":"treat someone in a way that causes them trouble","d":"To criticise or make life difficult for someone, often playfully or unfairly.","ex":["My brother always gives me a hard time about my cooking.","Journalists gave the minister a hard time over the budget."],"key":"gives me a hard time","syn":["make life difficult for","tease","pester"],"reg":"informal","ielts":"no","note":"Spoken; good in Speaking about family or school, not essays."},{"p":"the globe","m":"the Earth; the whole world","d":"The planet Earth considered as a whole, often used to refer to the entire world.","ex":["Companies now sell products to customers across the globe.","Climate change affects every region on the globe."],"key":"across the globe","syn":["the world","the planet","worldwide"],"reg":"neutral","ielts":"yes","note":"Handy variation for 'world' in globalisation essays."},{"p":"glow with happiness/pride,etc.","m":"look very happy or proud","d":"To show strong positive emotion visibly, such as in the face; followed by 'with' and an emotion noun.","ex":["The parents glowed with pride at their daughter's graduation.","She was glowing with happiness after hearing the news."],"key":"glowed with pride","syn":["beam with pride","radiate happiness","shine with joy"],"reg":"neutral","ielts":"careful","note":"Descriptive; good in Speaking Part 2, less so in academic essays."},{"p":"to go","m":"still remaining; left to be done","d":"Used after a number or time period to show how much remains before something ends or is completed.","ex":["There are only two weeks to go before the examination.","With just three questions to go, she felt confident."],"key":"two weeks to go","syn":["remaining","left","still to come"],"reg":"informal","ielts":"careful","note":"Conversational; fine in speaking, use 'remaining' in formal writing."},{"p":"go overboard","m":"do something to an extreme or excessive degree","d":"To behave in an excessive or exaggerated way, especially by doing or spending too much.","ex":["Parents should not go overboard with praise, or children may become complacent.","Many shoppers go overboard during sales."],"key":"go overboard","syn":["overdo it","go to extremes","be excessive"],"reg":"informal","ielts":"careful","note":"Handy in speaking; in essays prefer 'be excessive'."},{"p":"go out of your way to do sth","m":"make a special effort to do something","d":"To make an extra effort, beyond what is normal or required, to do something for someone.","ex":["Our teacher went out of her way to help struggling students.","Some companies go out of their way to protect the environment."],"key":"went out of her way to help","syn":["make a special effort","take great pains","bend over backwards"],"reg":"neutral","ielts":"yes","note":"Good for describing helpful people, companies or policies."},{"p":"be still going strong","m":"continue to be active and successful after a long time","d":"To continue to function, operate or thrive well after a long period; used for people, businesses or traditions.","ex":["The family bakery, founded in 1920, is still going strong.","My grandmother is ninety and still going strong."],"key":"still going strong","syn":["remain thriving","continue to flourish","last"],"reg":"neutral","ielts":"careful","note":"Positive idiom good for speaking about traditions or elderly people."},{"p":"make a go of sth","m":"try hard to make something succeed","d":"To try hard to make something, such as a business or relationship, successful.","ex":["They sold their house to make a go of the small restaurant.","The couple were determined to make a go of their marriage."],"key":"make a go of","syn":["make a success of","get it working","try to succeed"],"reg":"informal","ielts":"careful","note":"Suitable for speaking about business or plans; rarely used in essays."},{"p":"it's a good job","m":"it is lucky that","d":"Used in British English to say that it is fortunate that something happened or is true; followed by a clause.","ex":["It's a good job we left early, because the roads were blocked.","It's a good job she saved money before losing her job."],"key":"It's a good job","syn":["it's lucky that","it's fortunate that","thank goodness"],"reg":"informal","ielts":"no","note":"Spoken British; use 'fortunately' in written responses."},{"p":"be in good taste","m":"be suitable and not offensive","d":"Describes something that shows proper judgement of what is socially acceptable, polite or elegant.","ex":["Her speech was humorous but always in good taste.","Advertisers should ensure that campaigns are in good taste."],"key":"in good taste","syn":["be appropriate","be tasteful","be decent"],"reg":"neutral","ielts":"yes","note":"Useful for media, advertising and censorship topics."},{"p":"do sb a/the world of good","m":"be very beneficial for someone","d":"To have a very positive effect on someone's health, mood or situation.","ex":["A long holiday would do you the world of good.","Regular exercise does students a world of good."],"key":"do you the world of good","syn":["be very beneficial","benefit greatly","work wonders for"],"reg":"informal","ielts":"careful","note":"Warm spoken idiom; formal essays prefer 'be highly beneficial'."},{"p":"with your bare hands","m":"using only your hands and no tools","d":"Using no tool, weapon or protection other than your own hands.","ex":["The villagers dug the survivors out with their bare hands.","Early humans hunted small animals with their bare hands."],"key":"with their bare hands","syn":["unaided","without tools","using only your hands"],"reg":"neutral","ielts":"careful","note":"Vivid detail for narrative or history; not an essay essential."},{"p":"on hand or to hand","m":"available and close by when needed","d":"Available, nearby and ready for use; 'on hand' is more common for people, 'to hand' for objects.","ex":["Medical staff must always be on hand during sporting events.","Keep a dictionary to hand when you write essays."],"key":"on hand","syn":["available","nearby","readily accessible"],"reg":"neutral","ielts":"yes","note":"Good for services and emergency topics in Task 2."},{"p":"get/lay your hands on sth","m":"obtain or find something","d":"To manage to obtain or find something, especially something hard to get.","ex":["Students struggle to lay their hands on affordable textbooks.","Collectors will pay a fortune to get their hands on rare stamps."],"key":"lay their hands on","syn":["obtain","acquire","get hold of"],"reg":"informal","ielts":"careful","note":"Colloquial; use 'obtain' or 'acquire' in formal essays."},{"p":"in hand","m":"under control, or being dealt with","d":"Being dealt with or controlled; also meaning available as a reserve.","ex":["Don't worry; the situation is well in hand.","The council has funds in hand for the new library."],"key":"well in hand","syn":["under control","being handled","in progress"],"reg":"neutral","ielts":"careful","note":"Use in speaking or reports; precise meaning depends on context."},{"p":"take the law into your own hands","m":"punish people yourself instead of using the police or courts","d":"To punish or act against wrongdoers personally rather than relying on legal authorities.","ex":["Residents who take the law into their own hands risk prosecution themselves.","Citizens should not take the law into their own hands, however angry they are."],"key":"take the law into their own hands","syn":["act as vigilantes","impose personal justice","bypass the courts"],"reg":"neutral","ielts":"yes","note":"Strong for crime and justice essays; fits discussions of vigilantism."},{"p":"you have to hand it to sb","m":"you must admit someone has done something well","d":"Used to express admiration or grudging respect for what someone has achieved.","ex":["You have to hand it to her; she built the company from nothing.","You have to hand it to the engineers for finishing on time."],"key":"You have to hand it to","syn":["credit where it's due","you must admit","full marks to"],"reg":"informal","ielts":"no","note":"Spoken praise; good for Speaking, not academic writing."},{"p":"a handsome profit/sum, etc.","m":"a fairly large amount of money","d":"Used to describe a considerable amount of money, usually profit, sum or reward.","ex":["The firm made a handsome profit during the festive season.","He was paid a handsome sum for the painting."],"key":"a handsome profit","syn":["a substantial profit","a considerable sum","a healthy return"],"reg":"formal","ielts":"yes","note":"Good business collocation; avoid with non-money nouns."},{"p":"come in handy","m":"be useful at some time","d":"To prove useful in a particular situation, often unexpectedly.","ex":["A second language can come in handy when travelling abroad.","Basic first-aid skills may come in handy one day."],"key":"come in handy","syn":["prove useful","be of use","be helpful"],"reg":"informal","ielts":"careful","note":"Fine in speaking; essays can use 'prove useful'."},{"p":"do/learn sth the hard way","m":"learn by difficult or painful experience","d":"To learn something through unpleasant experience or without easy shortcuts or advice.","ex":["Many young investors learn about risk the hard way.","She learned the hard way that deadlines matter."],"key":"learn about risk the hard way","syn":["learn from bitter experience","learn by trial and error","suffer to learn"],"reg":"neutral","ielts":"careful","note":"Good in speaking about lessons; essays should phrase more formally."},{"p":"be hard on sb","m":"treat someone severely or unfairly","d":"To be strict, critical or severe with someone, or to cause difficulty for them.","ex":["Some teachers are too hard on pupils who make mistakes.","Rising prices are hard on low-income families."],"key":"too hard on pupils","syn":["be harsh with","be strict with","be tough on"],"reg":"neutral","ielts":"yes","note":"Works in education and parenting topics; also 'hard on' means hurting."},{"p":"have (got) to do/be sth","m":"must do or be something","d":"Expresses obligation or strong necessity; 'have got to' is informal and mainly British.","ex":["Governments have to act quickly to reduce emissions.","I've got to submit the report by Friday."],"key":"have to act","syn":["must","need to","be obliged to"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; essays often prefer 'must' or 'need to'."},{"p":"have sb do sth","m":"ask or cause someone to do something","d":"To arrange for someone to do something, or cause them to do it; followed by object and bare infinitive.","ex":["The manager had her assistant rewrite the report.","Teachers sometimes have students present their research aloud."],"key":"had her assistant rewrite","syn":["get someone to do","instruct","cause to do"],"reg":"neutral","ielts":"yes","note":"Useful causative structure; shows grammatical range in writing."},{"p":"have it in for sb","m":"dislike someone and treat them unfairly","d":"To hold a grudge against someone and want to cause them trouble; informal.","ex":["He thinks the teacher has it in for him.","She felt her boss had it in for her after the argument."],"key":"has it in for him","syn":["have a grudge against","pick on","bear ill will towards"],"reg":"informal","ielts":"no","note":"Spoken; use in Speaking about people, not in essays."},{"p":"laugh/shout/scream, etc. your head off","m":"laugh, shout or scream very loudly for a long time","d":"To do something very loudly or for a long time, especially laughing, shouting or screaming.","ex":["The children were laughing their heads off at the clown.","The fans screamed their heads off when the band appeared."],"key":"laughing their heads off","syn":["laugh uproariously","shout very loudly","scream loudly"],"reg":"informal","ielts":"no","note":"Lively spoken idiom; good in Speaking Part 2, never in essays."},{"p":"a roof over your head","m":"a place to live","d":"A home or shelter, especially when seen as a basic necessity of life.","ex":["Many refugees only want food and a roof over their heads.","Having a roof over your head is a fundamental need."],"key":"a roof over their heads","syn":["shelter","accommodation","a place to live"],"reg":"neutral","ielts":"yes","note":"Good for housing and poverty topics in Task 2."},{"p":"heaps of sth","m":"a lot of something","d":"A large amount or number of something; informal, mainly British and Australian English.","ex":["There are heaps of cafes near the university.","She has heaps of homework to finish this weekend."],"key":"heaps of cafes","syn":["loads of","masses of","lots of"],"reg":"informal","ielts":"no","note":"Informal; fine in speaking and friend letters, not in essays."},{"p":"the height of sth","m":"the highest point or most extreme degree of something","d":"The point at which something is at its most intense, successful or extreme.","ex":["At the height of the crisis, thousands lost their jobs.","The singer was at the height of her fame in the 1990s."],"key":"At the height of the crisis","syn":["the peak of","the climax of","the zenith of"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for peaks and in history or economics essays."},{"p":"a/one hell of a","m":"an extremely good, bad or impressive","d":"An informal intensifier placed before a noun to emphasise how impressive or extreme it is.","ex":["She is one hell of a negotiator.","That was a hell of a journey."],"key":"one hell of a negotiator","syn":["a real","a remarkable","an incredible"],"reg":"informal","ielts":"no","note":"Informal and strong; avoid in writing and polite speaking."},{"p":"like hell","m":"very strongly, or used to say you strongly refuse","d":"Informal expression used as an intensifier ('worked like hell') or as an emphatic denial.","ex":["We worked like hell to meet the deadline.","\"Will you apologise?\" \"Like hell I will!\""],"key":"like hell","syn":["very hard","furiously","extremely"],"reg":"informal","ielts":"no","note":"Considered rude by some; avoid in IELTS."},{"p":"to speak/think highly of sb/sth","m":"to have a very good opinion of someone or something","d":"To praise or hold a very favourable opinion of a person or thing.","ex":["Employers speak highly of graduates who have done internships.","Critics think highly of the director's latest film."],"key":"speak highly of","syn":["praise","admire","hold in high regard"],"reg":"neutral","ielts":"yes","note":"Good, safe phrase for describing people or evaluating services."},{"p":"a hint of sth","m":"a small sign or trace of something","d":"A slight indication, suggestion or small amount of something.","ex":["There was a hint of sadness in her voice.","The soup has a hint of garlic."],"key":"a hint of sadness","syn":["a trace of","a suggestion of","a touch of"],"reg":"neutral","ielts":"yes","note":"Useful in descriptive speaking; also for hint of change in Task 1."},{"p":"a hold on/over sth/sb","m":"power or control over something or someone","d":"Influence or control over a person, group or situation; noun followed by 'on' or 'over'.","ex":["The dictator tightened his hold on the army.","Social media has a strong hold on teenagers."],"key":"his hold on the army","syn":["control over","grip on","influence over"],"reg":"neutral","ielts":"yes","note":"Useful for politics, media and addiction topics."},{"p":"ring hollow","m":"sound false or insincere","d":"To seem insincere or untrue when considered against the facts; used with words, promises or claims.","ex":["The company's promises of change ring hollow after the scandal.","His apology rang hollow to the victims."],"key":"ring hollow","syn":["sound insincere","seem false","lack credibility"],"reg":"formal","ielts":"yes","note":"Strong evaluative phrase for politics and business Task 2 essays."},{"p":"in all honesty","m":"to tell the truth","d":"Used to introduce a sincere, truthful or sometimes critical statement.","ex":["In all honesty, I did not expect to win the competition.","In all honesty, the proposal does not address the real problem."],"key":"In all honesty","syn":["frankly","to be honest","truthfully"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; in essays use sparingly or prefer 'frankly'."},{"p":"sb's best/last/only hope","m":"the best, final or only chance of success someone has","d":"The best, last or only person or thing that can help someone succeed or survive.","ex":["The new treatment is the patient's last hope.","Education is these children's best hope of escaping poverty."],"key":"last hope","syn":["final chance","best chance","only option"],"reg":"neutral","ielts":"yes","note":"Useful in health, poverty and education topics."},{"p":"take/hold sb hostage","m":"capture and keep someone as a prisoner to make demands","d":"To seize or detain a person and threaten them in order to force others to meet demands.","ex":["Armed men took the embassy staff hostage.","The gunman held several customers hostage for hours."],"key":"took the embassy staff hostage","syn":["kidnap","abduct","seize"],"reg":"neutral","ielts":"careful","note":"Relevant to crime and terrorism topics; use only when appropriate."},{"p":"the early/small hours","m":"the time just after midnight until dawn","d":"The period between midnight and early morning, usually between one and four o'clock.","ex":["Students often study into the early hours before exams.","The fire broke out in the small hours of the morning."],"key":"into the early hours","syn":["the middle of the night","after midnight","before dawn"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about sleep and routines."},{"p":"How strange/stupid/weird, etc. is that?","m":"a spoken way to say something is very strange or silly","d":"An informal rhetorical question expressing surprise or disbelief at something unusual.","ex":["He texted me from the next room. How weird is that?","They cancelled the match because of sunshine. How stupid is that?"],"key":"How weird is that?","syn":["Isn't that odd?","What a strange thing!","Can you believe that?"],"reg":"informal","ielts":"no","note":"Spoken, expressive; fine in friend letters or Speaking, not essays."},{"p":"be only human","m":"have normal weaknesses like everyone else","d":"Used to say that people make mistakes or have limits, which should be forgiven.","ex":["Teachers are only human and sometimes make errors.","I was tired and irritable; I'm only human."],"key":"are only human","syn":["be fallible","not be perfect","make mistakes like anyone"],"reg":"neutral","ielts":"careful","note":"Useful in speaking or essays on workplaces, though a little chatty."},{"p":"in my humble opinion","m":"I believe, said politely or sometimes ironically","d":"A polite or ironic phrase introducing an opinion; often abbreviated as IMHO in informal writing.","ex":["In my humble opinion, public transport should be free.","In my humble opinion, the film was overrated."],"key":"In my humble opinion","syn":["in my view","in my opinion","to my mind"],"reg":"formal","ielts":"careful","note":"Can sound old-fashioned or sarcastic; use 'in my view' instead."},{"p":"be hungry for sth","m":"want something very much","d":"To have a strong desire for something such as success, power or knowledge.","ex":["The young players are hungry for success.","Students who are hungry for knowledge often read widely."],"key":"hungry for success","syn":["crave","long for","be eager for"],"reg":"neutral","ielts":"yes","note":"Good figurative phrase for ambition and learning topics."},{"p":"the idea of sth","m":"the thought or concept of something","d":"Used before a noun or gerund to refer to a concept or suggestion; often followed by 'doing'.","ex":["Many young people dislike the idea of working in an office.","The idea of free university education is widely debated."],"key":"the idea of working","syn":["the concept of","the notion of","the thought of"],"reg":"neutral","ielts":"yes","note":"Common essay noun phrase; follow with a gerund or noun."},{"p":"on impulse","m":"suddenly, without thinking carefully","d":"Acting because of a sudden desire rather than planning or careful thought.","ex":["Many shoppers buy goods on impulse rather than from need.","She quit her job on impulse and flew to Bali."],"key":"on impulse","syn":["spontaneously","without thinking","on a whim"],"reg":"neutral","ielts":"yes","note":"Good for consumerism and decision-making topics."},{"p":"in the name of sth","m":"for the stated reason or purpose of something","d":"Used to say that something is done on behalf of, or justified by, a principle or cause.","ex":["Terrible crimes have been committed in the name of religion.","Some firms damage nature in the name of progress."],"key":"in the name of religion","syn":["on behalf of","for the sake of","in the cause of"],"reg":"formal","ielts":"yes","note":"Strong in ethics, politics and environment essays."},{"p":"in the vicinity (of sth)","m":"near a place","d":"In the area close to a particular place; used with 'of' before a noun.","ex":["There are several hospitals in the vicinity of the airport.","Nobody was in the vicinity when the alarm sounded."],"key":"in the vicinity of","syn":["near","in the neighbourhood of","close to"],"reg":"formal","ielts":"yes","note":"Useful in Academic Task 1 maps to describe locations."},{"p":"in sb's words","m":"as someone said it, using their exact expression","d":"Used to quote or report what a person said, indicating their own way of expressing it.","ex":["The project was, in the minister's words, a complete failure.","In her words, the experience was life-changing."],"key":"in the minister's words","syn":["as she put it","to quote","according to"],"reg":"neutral","ielts":"careful","note":"Handy for quoting sources; rare in standard IELTS essays."},{"p":"in all likelihood","m":"very probably","d":"Used to indicate that something is highly probable; adverbial phrase at the start or middle of a clause.","ex":["In all likelihood, fuel prices will continue rising.","The company will, in all likelihood, merge with its rival."],"key":"In all likelihood","syn":["in all probability","most probably","very likely"],"reg":"formal","ielts":"yes","note":"Strong hedging phrase for predictions in Task 2 and Task 1."},{"p":"be in line with sth","m":"match or agree with something","d":"To be consistent with, or following the same pattern as, a rule, policy or expectation.","ex":["The results are in line with earlier research.","Salaries should be in line with the cost of living."],"key":"in line with earlier research","syn":["match","be consistent with","conform to"],"reg":"formal","ielts":"yes","note":"Excellent for comparing figures in Task 1 and policies in Task 2."},{"p":"in memory of sb","m":"to remember a person who has died","d":"Done or created to honour the memory of someone who has died.","ex":["A scholarship was set up in memory of the late professor.","The park was named in memory of the victims."],"key":"in memory of the late professor","syn":["in remembrance of","in honour of","as a tribute to"],"reg":"formal","ielts":"careful","note":"Useful in descriptions of monuments or charities."},{"p":"in miniature","m":"on a very small scale","d":"Used to describe a smaller version of something larger, or something that resembles a larger thing.","ex":["The model village is a town in miniature.","The classroom was society in miniature."],"key":"in miniature","syn":["on a small scale","in small form","scaled down"],"reg":"formal","ielts":"yes","note":"Elegant descriptive tag; works in comparisons of systems."},{"p":"be in the mood for sth/to do sth","m":"want to do or have something at the moment","d":"To feel like doing or having something at a particular moment; followed by a noun or infinitive.","ex":["I'm not in the mood for a long lecture today.","Few people are in the mood to study on Friday evenings."],"key":"in the mood for","syn":["feel like","be inclined to","fancy"],"reg":"informal","ielts":"careful","note":"Common in Speaking Part 1; avoid in formal writing."},{"p":"in its infancy","m":"at a very early stage of development","d":"Describes something new that has only just begun to develop.","ex":["Space tourism is still in its infancy.","Research on this treatment is in its infancy."],"key":"in its infancy","syn":["at an early stage","at a nascent stage","newly emerging"],"reg":"formal","ielts":"yes","note":"Great for technology and science topics in Task 2."},{"p":"in the interest(s) of sth","m":"for the benefit or protection of something","d":"For the good or protection of a person, group or principle; followed by a noun.","ex":["Strict rules are introduced in the interests of public safety.","In the interest of fairness, all applicants will be interviewed."],"key":"in the interests of public safety","syn":["for the sake of","to the benefit of","for the good of"],"reg":"formal","ielts":"yes","note":"Strong for law, health and policy essays."},{"p":"in isolation","m":"separately, without considering other things","d":"Considered on its own, apart from other related factors or people.","ex":["Economic growth cannot be understood in isolation from the environment.","The patient lived in isolation for months."],"key":"in isolation","syn":["separately","alone","independently"],"reg":"formal","ielts":"yes","note":"Useful for argument qualification, often in negatives."},{"p":"in part","m":"to some extent, but not completely","d":"Partly; used to show that something is only partially true or responsible.","ex":["The decline in sales was due, in part, to higher prices.","Success depends, in part, on luck."],"key":"in part","syn":["partly","to some extent","partially"],"reg":"formal","ielts":"yes","note":"Useful hedging phrase in Task 2 cause analysis."},{"p":"in perspective","m":"judged in relation to its true importance","d":"Considered in proportion to other things so that its real size or importance is clear; often 'put sth in perspective'.","ex":["The loss of one match must be kept in perspective.","Travel helps people put their own problems in perspective."],"key":"in perspective","syn":["in proportion","in context","relatively"],"reg":"neutral","ielts":"yes","note":"Good for balanced arguments; usually 'put/keep in perspective'."},{"p":"in place","m":"ready, installed or already existing","d":"Existing, installed or ready to function in the correct position.","ex":["Safety measures must be in place before the factory opens.","The new law has been in place for five years."],"key":"in place","syn":["established","installed","in operation"],"reg":"neutral","ielts":"yes","note":"Useful for policies and systems in Task 2."},{"p":"in principle","m":"in general, though details may differ in practice","d":"Used to say that something is true or acceptable in theory or general terms, though practical details may differ.","ex":["In principle, everyone supports renewable energy, but costs concern them.","The board agreed in principle to the merger."],"key":"In principle","syn":["in theory","theoretically","on the whole"],"reg":"formal","ielts":"yes","note":"Strong concession phrase for Task 2 balanced arguments."},{"p":"in all probability","m":"very likely","d":"Used to say that something is highly likely to happen or be true.","ex":["In all probability, demand for housing will continue to rise.","The delay was, in all probability, caused by bad weather."],"key":"In all probability","syn":["in all likelihood","most likely","very probably"],"reg":"formal","ielts":"yes","note":"Strong prediction hedge; vary with 'in all likelihood'."},{"p":"in the process","m":"while doing something, as part of the same action","d":"While doing something else, as a result or side effect of the same action.","ex":["The company cut costs and, in the process, lost many skilled workers.","She learned a new language and made friends in the process."],"key":"in the process","syn":["meanwhile","as a result","along the way"],"reg":"neutral","ielts":"yes","note":"Useful for describing side effects in Task 2."},{"p":"be in the process of doing sth","m":"be currently doing something","d":"To be currently engaged in an action that is not yet finished; followed by a gerund.","ex":["The city is in the process of building a new metro line.","We are in the process of updating our records."],"key":"in the process of building","syn":["be in the midst of","be currently doing","be engaged in"],"reg":"formal","ielts":"yes","note":"Good for describing ongoing projects in Task 1 or 2."},{"p":"in proportion to","m":"in relation to the size or amount of something","d":"In correct relation to something else in size or amount, so that things increase or decrease together.","ex":["Taxes should rise in proportion to income.","The risk increases in proportion to the number of hours worked."],"key":"in proportion to income","syn":["relative to","commensurate with","in relation to"],"reg":"formal","ielts":"yes","note":"Useful for comparisons in Task 1 and fairness in Task 2."},{"p":"sb/sth in question","m":"the person or thing being talked about","d":"Used after a noun to refer to the person or thing currently being discussed.","ex":["The company in question has denied any wrongdoing.","The year in question saw record unemployment."],"key":"in question","syn":["under discussion","concerned","at issue"],"reg":"formal","ielts":"yes","note":"Precise and formal; helps avoid repeating nouns."},{"p":"in the red","m":"owing money; with a negative bank balance","d":"Having a negative balance, or spending more than earned; opposite of 'in the black'.","ex":["The airline has been in the red for three consecutive years.","Many households end the month in the red."],"key":"in the red","syn":["overdrawn","in debt","loss-making"],"reg":"informal","ielts":"careful","note":"Business idiom; acceptable in Task 1 on finances if explained."},{"p":"in retrospect","m":"when thinking about the past","d":"Considering past events with the benefit of present knowledge; adverbial phrase.","ex":["In retrospect, the decision to close the factory was a mistake.","In retrospect, I should have revised earlier."],"key":"In retrospect","syn":["looking back","with hindsight","on reflection"],"reg":"formal","ielts":"yes","note":"Good for evaluations of past decisions in Task 2."},{"p":"be in bad/poor taste","m":"be offensive or not suitable","d":"Describes something that is unsuitable, offensive or shows poor judgement.","ex":["The advert was widely criticised as being in poor taste.","Jokes about disasters are in bad taste."],"key":"in poor taste","syn":["be inappropriate","be offensive","be tasteless"],"reg":"neutral","ielts":"yes","note":"Useful for media, advertising and ethics topics."},{"p":"in no uncertain terms","m":"in a very clear and direct way","d":"Said in a direct, clear and often forceful manner leaving no doubt about meaning.","ex":["The judge told the defendant in no uncertain terms that his behaviour was unacceptable.","The minister rejected the claims in no uncertain terms."],"key":"in no uncertain terms","syn":["clearly","bluntly","unequivocally"],"reg":"formal","ielts":"careful","note":"Strong in tone; use for emphasis in speaking or reports."},{"p":"be in tune with sb/sth","m":"understand and agree with someone or something","d":"To be in harmony with, or have a good understanding of, another person's feelings or a situation.","ex":["Successful leaders are in tune with their employees.","The policy is not in tune with public opinion."],"key":"in tune with their employees","syn":["be in harmony with","be attuned to","be in sympathy with"],"reg":"neutral","ielts":"yes","note":"Good for leadership, politics and nature topics."},{"p":"in that","m":"because; in the sense that","d":"A conjunction introducing an explanation of how or why a preceding statement is true.","ex":["The scheme is unusual in that it is entirely funded by donations.","Cities differ from villages in that they offer more jobs."],"key":"in that it is","syn":["because","since","in the sense that"],"reg":"formal","ielts":"yes","note":"Excellent for adding precision; shows complex sentence structure."},{"p":"be in for sth","m":"be about to experience something, often unpleasant","d":"To be going to experience something, usually something unexpected or unpleasant.","ex":["Commuters are in for a long delay this morning.","If you think the course is easy, you're in for a shock."],"key":"in for a long delay","syn":["be about to experience","face","be due for"],"reg":"informal","ielts":"careful","note":"Chatty; fine in speaking, avoid in academic writing."},{"p":"inclined to do sth","m":"likely or willing to do something","d":"Having a tendency or preference to do something; 'be inclined to' is followed by an infinitive.","ex":["I am inclined to agree with the writer.","Young people are more inclined to rent than to buy."],"key":"inclined to agree","syn":["tend to","be likely to","be disposed to"],"reg":"neutral","ielts":"yes","note":"Useful hedging phrase for opinions in Task 2."},{"p":"to all intents and purposes","m":"in almost every important way","d":"Used to say that something is practically true in all important respects, though not strictly so.","ex":["To all intents and purposes, the project is finished.","To all intents and purposes, the two firms are one."],"key":"To all intents and purposes","syn":["effectively","in effect","for all practical purposes"],"reg":"formal","ielts":"yes","note":"Formal-sounding; use sparingly to sound natural."},{"p":"be intent on sth/doing sth","m":"be determined to do something","d":"To be strongly determined to do or achieve something; followed by a noun or gerund.","ex":["The government is intent on reducing carbon emissions.","She was intent on finishing her degree."],"key":"intent on reducing","syn":["be determined to","be set on","be bent on"],"reg":"formal","ielts":"yes","note":"Good for government or personal goals; formal tone."},{"p":"an intimate knowledge/understanding of sth","m":"a very detailed and deep knowledge of something","d":"A thorough and detailed knowledge of a subject or place gained through close familiarity.","ex":["Local guides have an intimate knowledge of the region.","The role requires an intimate understanding of tax law."],"key":"an intimate knowledge of","syn":["a thorough knowledge of","a detailed understanding of","an in-depth grasp of"],"reg":"formal","ielts":"yes","note":"Strong collocation for expertise, work and education."},{"p":"invade sb's privacy","m":"interfere in someone's private life","d":"To intrude into someone's private life or personal affairs without permission.","ex":["Tabloids often invade celebrities' privacy.","Constant surveillance invades citizens' privacy."],"key":"invade celebrities' privacy","syn":["intrude on","infringe on privacy","pry into"],"reg":"formal","ielts":"yes","note":"Key for technology, media and surveillance essays."},{"p":"an invasion of privacy","m":"an act that interferes with private life","d":"An act that unlawfully or unfairly intrudes on a person's private life or data.","ex":["Many see CCTV in public places as an invasion of privacy.","Reading someone's messages is a serious invasion of privacy."],"key":"an invasion of privacy","syn":["a breach of privacy","an intrusion","a violation of privacy"],"reg":"formal","ielts":"yes","note":"Useful for technology and personal-rights topics."},{"p":"irrespective of sth","m":"without being affected by something","d":"Regardless of; without taking into account a particular factor; followed by a noun phrase.","ex":["Healthcare should be available irrespective of income.","Applicants are judged irrespective of their nationality."],"key":"irrespective of income","syn":["regardless of","without regard to","independent of"],"reg":"formal","ielts":"yes","note":"Excellent formal connector for equality and rights essays."},{"p":"an isolated case/event/example, etc.","m":"a single instance, not part of a general pattern","d":"A single occurrence that is separate from others and not typical of a wider trend.","ex":["Police insist the attack was an isolated incident.","These errors were isolated cases and not systematic."],"key":"an isolated incident","syn":["a one-off","a single instance","an exception"],"reg":"formal","ielts":"yes","note":"Useful to qualify examples or avoid generalisation."},{"p":"be itching to do sth","m":"be very eager to do something","d":"To be extremely impatient or eager to do something; informal.","ex":["The children were itching to open their presents.","I'm itching to travel again after lockdown."],"key":"itching to open","syn":["be eager to","be dying to","be impatient to"],"reg":"informal","ielts":"careful","note":"Lively in speaking; avoid in formal essays."},{"p":"out of a job","m":"without paid work","d":"Unemployed; having lost one's employment.","ex":["Thousands of workers were out of a job after the factory closed.","He has been out of a job for six months."],"key":"out of a job","syn":["unemployed","jobless","out of work"],"reg":"neutral","ielts":"yes","note":"Safe for unemployment topics; 'unemployed' is more formal."},{"p":"a bad/good, etc. judge of sth","m":"someone who can or cannot assess something well","d":"A person who is able or unable to evaluate a particular quality or situation correctly.","ex":["He is a poor judge of character.","Experienced teachers are good judges of student ability."],"key":"a poor judge of character","syn":["a skilled assessor of","a shrewd evaluator of","an expert on"],"reg":"neutral","ielts":"yes","note":"Useful for evaluating decisions and relationships."},{"p":"10/20, etc. years sb's junior","m":"younger than someone by a number of years","d":"Used to state how much younger one person is than another.","ex":["Her husband is ten years her junior.","He married a woman twenty years his junior."],"key":"ten years her junior","syn":["younger than","several years younger","of a younger generation"],"reg":"formal","ielts":"careful","note":"Rare in IELTS; fine in speaking about family."},{"p":"keep your temper","m":"stay calm and not get angry","d":"To control one's anger and remain calm in a difficult situation.","ex":["It is hard to keep your temper in heavy traffic.","The referee kept his temper despite the abuse."],"key":"keep your temper","syn":["stay calm","control your anger","remain composed"],"reg":"neutral","ielts":"yes","note":"Good for stress and workplace topics in speaking and writing."},{"p":"kick yourself","m":"be very annoyed with yourself for a mistake","d":"To be very annoyed at oneself because of a foolish mistake or missed chance.","ex":["I could kick myself for forgetting my passport.","He kicked himself for ignoring the advice."],"key":"kick myself","syn":["blame yourself","regret deeply","be cross with yourself"],"reg":"informal","ielts":"no","note":"Spoken idiom; fine in Speaking, not for essays."},{"p":"one of a kind","m":"unique; not like anyone or anything else","d":"Describes a person or thing that is unique and has no equal.","ex":["The handmade guitar is truly one of a kind.","Her teaching style was one of a kind."],"key":"one of a kind","syn":["unique","unparalleled","unlike any other"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking describing people or places."},{"p":"not take kindly to sth","m":"dislike or react badly to something","d":"To react negatively to something, especially criticism or interference.","ex":["The director did not take kindly to being criticised.","Customers do not take kindly to hidden fees."],"key":"did not take kindly to","syn":["dislike","object to","react badly to"],"reg":"neutral","ielts":"yes","note":"Polite-sounding negative evaluation, good for reactions in essays."},{"p":"the animal/plant kingdom","m":"all animals or all plants as a group","d":"The biological group that includes all animals, or all plants, as a whole.","ex":["Insects form the largest group in the animal kingdom.","Species in the plant kingdom adapt to many climates."],"key":"the animal kingdom","syn":["the animal world","fauna","the natural world"],"reg":"neutral","ielts":"yes","note":"Useful in environment, biodiversity or science topics."},{"p":"the next thing I knew","m":"suddenly, in a way I did not expect","d":"Used in storytelling to show something happened suddenly, without warning or awareness.","ex":["I closed my eyes, and the next thing I knew, it was morning.","The next thing I knew, the car had stopped."],"key":"the next thing I knew","syn":["suddenly","before I realised","all at once"],"reg":"informal","ielts":"no","note":"Narrative speaking; good for Speaking Part 2 stories only."},{"p":"be lacking","m":"be missing or not good enough","d":"To be absent or insufficient; used with 'in' for what is missing.","ex":["The report is lacking in detail.","Resources are lacking in rural schools."],"key":"lacking in detail","syn":["be insufficient","be deficient","be absent"],"reg":"formal","ielts":"yes","note":"Concise evaluation phrase for problems and shortages."},{"p":"sb/sth at large","m":"in general; the public as a whole","d":"Used after a noun to mean the general public or the whole of something; also means free (of criminal).","ex":["The policy will affect society at large.","The scientists informed the public at large about the risks."],"key":"society at large","syn":["in general","as a whole","the public"],"reg":"formal","ielts":"yes","note":"Useful phrase for essays on society, government and media."},{"p":"loom large","m":"seem very important or threatening","d":"To appear important or threatening in someone's mind or in a situation.","ex":["Climate change looms large in political debates.","Exams were looming large for the students."],"key":"looms large","syn":["be prominent","seem threatening","dominate"],"reg":"formal","ielts":"yes","note":"Strong and idiomatic; fits global-problem essays."},{"p":"a last resort","m":"something done only when all else has failed","d":"An action taken only when all other options have failed.","ex":["Surgery should be a last resort for most patients.","Strikes should be a last resort for workers."],"key":"a last resort","syn":["a final option","a final recourse","the last option"],"reg":"neutral","ielts":"yes","note":"Very useful for policy and solution essays."},{"p":"the last of sth","m":"the final remaining part or member","d":"The final remaining part or example of something.","ex":["She ate the last of the bread.","The last of the survivors was rescued."],"key":"the last of the bread","syn":["the remainder","the final part","what remains"],"reg":"neutral","ielts":"careful","note":"Fine in descriptions; not typical in essays."},{"p":"the last sb heard/saw of sb","m":"the final time someone had news of or saw someone","d":"Used to describe the most recent information or sighting someone had about a person.","ex":["The last I heard of him, he was working in Dubai.","The last they saw of the thief, he was running away."],"key":"The last I heard of him","syn":["the last news of","the final sighting of","the most recent contact with"],"reg":"informal","ielts":"no","note":"Conversational; use in Speaking stories only."},{"p":"be no laughing matter","m":"be serious and not something to joke about","d":"Used to say that a situation is serious and should not be treated lightly.","ex":["Unemployment is no laughing matter for young graduates.","Climate change is no laughing matter."],"key":"is no laughing matter","syn":["be serious","be grave","not be a joke"],"reg":"neutral","ielts":"yes","note":"Useful emphasis for serious social issues."},{"p":"law and order","m":"the state of society when people obey the law","d":"A situation in which people obey the law and crime is controlled by authority.","ex":["The government promised to restore law and order.","Harsh sentences do not guarantee law and order."],"key":"law and order","syn":["public order","social order","peace and security"],"reg":"formal","ielts":"yes","note":"Common crime and politics collocation."},{"p":"lead sb to do sth","m":"cause someone to do something","d":"To influence or cause someone to act in a certain way; followed by object and infinitive.","ex":["Long working hours can lead employees to make mistakes.","Poor housing led many families to move abroad."],"key":"lead employees to make","syn":["cause someone to","prompt","induce"],"reg":"formal","ielts":"yes","note":"Useful cause-effect pattern for Task 2."},{"p":"be led by sth","m":"be directed or influenced by something","d":"To be guided, controlled or influenced by a person or factor.","ex":["Economic policy should be led by evidence, not ideology.","The team was led by an experienced scientist."],"key":"led by evidence","syn":["be guided by","be driven by","be directed by"],"reg":"formal","ielts":"yes","note":"Useful in discussing policies and decision-making."},{"p":"leap into/out of/up, etc.","m":"jump quickly in a direction","d":"To jump suddenly or with energy, usually into, out of or up; used with direction particles.","ex":["The cat leapt onto the table.","Prices leapt up by ten per cent."],"key":"leapt onto","syn":["jump","spring","bound"],"reg":"neutral","ielts":"careful","note":"For Task 1, 'leap' can describe sharp rises; careful with literal use."},{"p":"not least","m":"especially; particularly","d":"Used to emphasise that something is an important example among several.","ex":["Many factors affect health, not least diet.","The city faces problems, not least pollution."],"key":"not least diet","syn":["especially","in particular","notably"],"reg":"formal","ielts":"yes","note":"Elegant emphasis in Task 2; careful with 'not the least'."},{"p":"not in the least","m":"not at all","d":"Used to strongly deny or emphasise that something is not true at all.","ex":["I was not in the least surprised by the result.","The exam was not in the least difficult."],"key":"not in the least","syn":["not at all","by no means","not remotely"],"reg":"formal","ielts":"yes","note":"Strong negation phrase; useful in opinion paragraphs."},{"p":"leave no stone unturned","m":"try every possible way to find or achieve something","d":"To make every possible effort to find or achieve something.","ex":["Investigators left no stone unturned in their search for the cause.","The team will leave no stone unturned to find a cure."],"key":"left no stone unturned","syn":["spare no effort","search thoroughly","try everything"],"reg":"neutral","ielts":"yes","note":"Idiom for research and investigation topics."},{"p":"lend itself to sth","m":"be suitable for something","d":"To be naturally suitable for a particular purpose or treatment; usually used with an inanimate subject.","ex":["The novel lends itself to film adaptation.","Some subjects lend themselves to online learning."],"key":"lends itself to","syn":["be suited to","be well suited for","be appropriate for"],"reg":"formal","ielts":"yes","note":"Sophisticated alternative to 'be suitable for' in essays."},{"p":"teach sb a lesson","m":"punish someone so they will not repeat bad behaviour","d":"To punish or show someone the results of bad behaviour so that they will not repeat it.","ex":["The fine taught the company a lesson about safety.","Failing the exam taught him a lesson."],"key":"taught the company a lesson","syn":["punish","set an example","discipline"],"reg":"neutral","ielts":"careful","note":"Fine for crime and education discussions; avoid sounding vengeful."},{"p":"let go (of sb/sth)","m":"stop holding someone or something","d":"To release one's grip, or stop having feelings or control over someone or something.","ex":["She finally let go of the past and moved abroad.","He let go of the rope."],"key":"let go of the past","syn":["release","relinquish","drop"],"reg":"neutral","ielts":"careful","note":"Good for personal growth topics in speaking."},{"p":"let go (of sth)","m":"stop holding something","d":"To release one's hold on something, either physically or figuratively; usually followed by 'of' plus a noun.","ex":["She finally let go of the grudge she had carried for years.","Governments must let go of outdated policies if growth is to resume."],"key":"let go of","syn":["release","relinquish","abandon"],"reg":"neutral","ielts":"yes","note":"Fine in essays as a figurative verb; 'relinquish' is more formal."},{"p":"be liable to do sth","m":"likely to do something, often something bad","d":"Likely or apt to do something undesirable; used with an infinitive, typically in formal contexts.","ex":["Coastal towns are liable to flood during severe storms.","Untrained staff are liable to make costly errors."],"key":"are liable to flood","syn":["be likely to","be prone to","be apt to"],"reg":"formal","ielts":"yes","note":"Useful for cautious predictions in Task 2; usually about negative outcomes."},{"p":"shed light on","m":"help to explain or make something clearer","d":"To make a subject easier to understand by providing new information about it.","ex":["The new study sheds light on why bees are disappearing.","Historical records can shed light on how ancient cities were governed."],"key":"sheds light on","syn":["clarify","illuminate","throw light on"],"reg":"neutral","ielts":"yes","note":"Strong academic collocation; good for describing research findings."},{"p":"make light of sth","m":"treat something serious as if it were unimportant","d":"To treat a serious matter as though it were trivial or of little consequence.","ex":["Politicians should not make light of the dangers of climate change.","He made light of his injury so that his team would not worry."],"key":"make light of","syn":["downplay","trivialise","belittle"],"reg":"neutral","ielts":"yes","note":"Use in Task 2 to criticise those who underestimate problems."},{"p":"not do sth lightly","m":"only do something after serious thought","d":"To do something only after careful consideration because it is serious or important; used in negative form.","ex":["Doctors do not prescribe such strong drugs lightly.","The court does not take such decisions lightly."],"key":"do not prescribe such strong drugs lightly","syn":["not do sth carelessly","think carefully before","not take sth lightly"],"reg":"formal","ielts":"yes","note":"Good for showing that a decision or action is serious and justified."},{"p":"something like","m":"approximately; about","d":"Used before a number or description to mean approximately or roughly; also means a similar thing.","ex":["The project will cost something like two million pounds.","It took something like six hours to cross the border."],"key":"something like","syn":["approximately","roughly","about"],"reg":"informal","ielts":"careful","note":"Spoken and vague; in writing prefer 'approximately' or 'roughly'."},{"p":"within limits","m":"inside certain boundaries","d":"Inside the boundaries or restrictions that are allowed or considered acceptable.","ex":["Freedom of speech is acceptable within limits.","Some risk is tolerable as long as it stays within limits."],"key":"within limits","syn":["within bounds","in moderation","within reason"],"reg":"neutral","ielts":"yes","note":"Handy in Task 2 when arguing freedoms should have restrictions."},{"p":"off limits","m":"forbidden to enter or discuss","d":"Not allowed to be entered, used or discussed; forbidden to certain people.","ex":["The military base is strictly off limits to civilians.","Certain subjects were off limits during the interview."],"key":"off limits","syn":["forbidden","out of bounds","prohibited"],"reg":"neutral","ielts":"careful","note":"Fine in semi-formal writing; 'prohibited' is more formal."},{"p":"the upper limit","m":"the highest amount allowed","d":"The maximum amount, level or number that is allowed or possible.","ex":["The upper limit for the grant is five thousand dollars.","There is an upper limit to how much stress people can endure."],"key":"The upper limit","syn":["maximum","ceiling","cap"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for describing maximum values on charts or rules."},{"p":"sb's line of reasoning/thinking, etc.","m":"the way someone thinks through a problem","d":"The way a particular person thinks step by step to reach a conclusion; the pattern is a possessive plus 'line of' plus a noun.","ex":["I could not follow her line of reasoning in the final paragraph.","The judge explained his line of thinking to the jury."],"key":"line of reasoning","syn":["train of thought","logic","argument"],"reg":"formal","ielts":"yes","note":"Useful in Task 2 for evaluating an argument or opposing viewpoint."},{"p":"toe the line","m":"obey rules and orders","d":"To obey the rules or accept the authority of an organisation or leader, even if reluctantly.","ex":["Employees who toe the line are more likely to be promoted.","The party leader expected every member to toe the line."],"key":"toe the line","syn":["conform","comply","fall into line"],"reg":"informal","ielts":"careful","note":"Idiomatic; acceptable in Task 2 in moderation, 'conform' is safer."},{"p":"little more/better","m":"only slightly more or better","d":"Only slightly more or better than something; used before a noun or after a number to show a small difference.","ex":["The treatment is little better than a placebo.","He earned little more than the minimum wage."],"key":"little better than","syn":["scarcely more than","barely better than","not much more than"],"reg":"neutral","ielts":"yes","note":"Good for comparing two things with minimal difference in writing."},{"p":"long for sth; long to do sth","m":"want something very much","d":"To want something or someone very much, especially when it is far away or unlikely to happen; 'long for' takes a noun and 'long to' an infinitive.","ex":["Many refugees long for a return to their homeland.","She longed to travel abroad after years of study."],"key":"long for","syn":["yearn for","crave","hanker after"],"reg":"formal","ielts":"careful","note":"More literary; use sparingly in essays, fine in Speaking Part 2 stories."},{"p":"be looking to do sth","m":"wanting or planning to do something","d":"To be trying or hoping to do something, often in the near future; used with an infinitive.","ex":["The company is looking to expand into Asian markets.","Many graduates are looking to start their own businesses."],"key":"is looking to expand","syn":["aim to","intend to","seek to"],"reg":"neutral","ielts":"careful","note":"Natural in speaking; in essays 'aim to' or 'seek to' is better."},{"p":"sb's looks","m":"a person's physical appearance, especially attractiveness","d":"A person's physical appearance, especially how attractive they are; always plural and used with a possessive.","ex":["Society often judges people by their looks rather than their abilities.","He relied on his good looks to win roles in films."],"key":"their looks","syn":["appearance","attractiveness","good looks"],"reg":"neutral","ielts":"careful","note":"Fine for appearance topics; avoid personal or emotive wording in essays."},{"p":"a stroke of luck","m":"a sudden piece of good fortune","d":"An unexpected event that brings good luck, usually in a single moment.","ex":["It was a stroke of luck that the rain stopped before the match.","Finding the lost document was a real stroke of luck."],"key":"a stroke of luck","syn":["a lucky break","a windfall","a fluke"],"reg":"neutral","ielts":"careful","note":"Good in Speaking narratives; in essays avoid attributing success to luck alone."},{"p":"make a name for yourself","m":"become famous or respected","d":"To become well known and respected through your own efforts and achievements.","ex":["She made a name for herself as an investigative journalist.","Young entrepreneurs often move to cities to make a name for themselves."],"key":"","syn":["establish yourself","become famous","gain a reputation"],"reg":"neutral","ielts":"yes","note":"Good for talking about success, careers and ambition; adjust the pronoun."},{"p":"make a nonsense of sth","m":"ruin or make something look ridiculous","d":"To spoil something completely or make it seem meaningless, usually by acting foolishly or badly.","ex":["The new rules make a nonsense of the whole system.","Constant delays made a nonsense of the original timetable."],"key":"make a nonsense of","syn":["make a mockery of","undermine","ruin"],"reg":"formal","ielts":"yes","note":"British usage; strong critical phrase for evaluating policies in Task 2."},{"p":"make waves","m":"cause trouble or disturbance by being different","d":"To cause disturbance or trouble, usually by challenging the way things are done.","ex":["The young economist made waves with her controversial proposal.","He was careful not to make waves during the merger talks."],"key":"made waves","syn":["rock the boat","cause a stir","stir things up"],"reg":"informal","ielts":"careful","note":"Idiomatic and chatty; better in Speaking than in formal essays."},{"p":"make your way","m":"move towards a place, often with difficulty","d":"To move towards a place, often with effort or by a difficult route.","ex":["The crowd made their way slowly towards the stadium.","She made her way through the dense forest at dawn."],"key":"made their way","syn":["head","proceed","travel"],"reg":"neutral","ielts":"careful","note":"Common in narrative; in Task 1 process or map descriptions prefer 'move' or 'proceed'."},{"p":"make way for sth","m":"be replaced by or give room for something","d":"To be removed, or to allow space or opportunity for something new or more important.","ex":["Old factories were demolished to make way for new housing.","Traditional industries must make way for green technology."],"key":"make way for","syn":["give way to","be replaced by","clear the way for"],"reg":"neutral","ielts":"yes","note":"Useful for urban change and technological replacement topics."},{"p":"make your presence felt","m":"have a strong effect so people notice you","d":"To have a clear and noticeable influence or impact so that others cannot ignore you.","ex":["The new director quickly made her presence felt within the company.","Young voters made their presence felt in the last election."],"key":"made her presence felt","syn":["leave a mark","assert yourself","have an impact"],"reg":"neutral","ielts":"careful","note":"Works for political or social influence; adjust the possessive."},{"p":"make sth public","m":"allow everyone to know about something","d":"To allow information to be known openly by everyone rather than kept secret.","ex":["The government decided to make the report public.","Companies should make their accounts public every year."],"key":"make the report public","syn":["disclose","release","publicise"],"reg":"neutral","ielts":"yes","note":"Good for transparency and government topics in Task 2."},{"p":"make a run for it","m":"run away quickly to escape","d":"To run away quickly in order to escape from a place or situation.","ex":["The thieves made a run for it when the alarm sounded.","He made a run for it as the guards approached."],"key":"made a run for it","syn":["flee","bolt","dash off"],"reg":"informal","ielts":"no","note":"Spoken or narrative style; avoid in essays."},{"p":"make sense of sth","m":"begin to understand something confusing","d":"To succeed in understanding something that is complicated or hard to follow.","ex":["Scientists are trying to make sense of the new data.","It is hard to make sense of such conflicting reports."],"key":"make sense of","syn":["interpret","comprehend","figure out"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 1 and 2 when discussing data or research."},{"p":"make a start","m":"begin doing something","d":"To begin an activity or task, especially after waiting or planning.","ex":["The team made a start on the renovation in March.","We should make a start before the deadline gets closer."],"key":"made a start","syn":["begin","get started","commence"],"reg":"neutral","ielts":"careful","note":"British phrase; in formal essays 'begin' or 'commence' is cleaner."},{"p":"march off/up/down, etc.","m":"walk away, up or down in a firm, steady way","d":"To walk in a straight, regular way with fixed steps, like soldiers; the direction word changes.","ex":["The soldiers marched off at dawn.","Protesters marched up the avenue toward the parliament building."],"key":"marched off","syn":["parade","stride","troop"],"reg":"neutral","ielts":"careful","note":"Mostly narrative; in essays it appears in descriptions of protests."},{"p":"a mark of sth","m":"a sign or quality showing something","d":"A sign or an indication of a particular quality, feeling or state, often a good one.","ex":["Politeness is a mark of respect in many cultures.","A strong education system is a mark of a developed society."],"key":"a mark of","syn":["a sign of","an indication of","a hallmark of"],"reg":"formal","ielts":"yes","note":"Good formal alternative to 'sign of' in Task 2."},{"p":"be no match for sb/sth","m":"not strong or skilled enough to compete","d":"Far weaker or less capable than another person or thing and so certain to lose.","ex":["Small shops are no match for large supermarket chains.","The old software was no match for modern cyber threats."],"key":"are no match for","syn":["be outclassed by","be inferior to","cannot compete with"],"reg":"neutral","ielts":"yes","note":"Effective for contrasting small and large competitors in economic topics."},{"p":"confidence/luck/waiting, etc.","m":"a pattern of nouns like confidence, luck or waiting","d":"Examples of abstract nouns that are commonly followed by a preposition or used in a certain grammatical pattern.","ex":["Confidence is essential if students want to speak in public.","Waiting too long can reduce your chances of success."],"key":"Confidence","syn":["certainty","assurance","self-belief"],"reg":"neutral","ielts":"careful","note":"Placeholder pattern; learn the actual noun and its collocations."},{"p":"be meant to do sth","m":"supposed or expected to do something","d":"Expected or supposed to do something, or intended to have a particular purpose; used with an infinitive.","ex":["The new law is meant to protect small farmers.","Schools are meant to prepare students for working life."],"key":"is meant to protect","syn":["be supposed to","be intended to","be designed to"],"reg":"neutral","ielts":"yes","note":"Useful for explaining the purpose or intention of policies."},{"p":"mean well","m":"have good intentions","d":"To have good intentions even if the results of your actions are bad.","ex":["The minister means well, but her policy is unrealistic.","Many parents mean well but overprotect their children."],"key":"means well","syn":["have good intentions","be well-intentioned","act in good faith"],"reg":"neutral","ielts":"careful","note":"Often used with 'but'; fine in Task 2 to present criticism politely."},{"p":"a measure of sth","m":"a certain amount of something","d":"A fairly large or limited amount of something, especially a quality or condition.","ex":["The reform has brought a measure of stability to the region.","Parents should allow children a measure of freedom."],"key":"a measure of","syn":["a degree of","some","a certain amount of"],"reg":"formal","ielts":"yes","note":"Good formal quantifier in place of 'some' in Task 2."},{"p":"the merest","m":"even the smallest or slightest","d":"Used to emphasise that something is very small, with the sense of 'even the slightest' amount.","ex":["The merest hint of criticism upset him.","The merest mistake could ruin the experiment."],"key":"The merest","syn":["the slightest","the faintest","the tiniest"],"reg":"formal","ielts":"careful","note":"Emphatic and literary; use sparingly in formal essays."},{"p":"have sth on your mind","m":"be worried or thinking about something","d":"To be thinking about or worried by something so that it occupies your thoughts.","ex":["She has a lot on her mind before the exam.","He had the project on his mind all weekend."],"key":"on her mind","syn":["be preoccupied with","be worried about","be troubled by"],"reg":"informal","ielts":"careful","note":"Good in Speaking; replace with 'be concerned about' in essays."},{"p":"spring to mind","m":"suddenly be thought of","d":"To come into your thoughts suddenly or immediately when you think about a topic.","ex":["When people discuss pollution, cars spring to mind first.","Several examples spring to mind when we consider renewable energy."],"key":"spring to mind","syn":["come to mind","occur to someone","cross your mind"],"reg":"neutral","ielts":"yes","note":"Useful for introducing examples in Speaking and essays."},{"p":"speak your mind","m":"say openly what you think","d":"To say clearly and honestly what you think, even if others may not like it.","ex":["Citizens must feel free to speak their mind in a democracy.","She spoke her mind at the meeting despite the risks."],"key":"speak their mind","syn":["be outspoken","say what you think","voice your opinion"],"reg":"neutral","ielts":"careful","note":"Good for freedom of speech topics; be careful with the possessive."},{"p":"peace of mind","m":"a calm feeling with no worry","d":"A calm state of mind in which you are not worried or afraid.","ex":["Regular exercise gives many people peace of mind.","Insurance offers families peace of mind."],"key":"peace of mind","syn":["tranquillity","serenity","reassurance"],"reg":"neutral","ielts":"yes","note":"Excellent in Task 2 on health, security and insurance topics."},{"p":"presence of mind","m":"the ability to stay calm and act quickly","d":"The ability to stay calm and think clearly in an emergency so you can act quickly and sensibly.","ex":["The pilot's presence of mind saved all the passengers.","Her presence of mind prevented a serious accident."],"key":"presence of mind","syn":["composure","quick thinking","level-headedness"],"reg":"neutral","ielts":"careful","note":"Better for Speaking narratives or Part 2 stories about emergencies."},{"p":"mind you","m":"used to add a contrasting remark","d":"Used at the beginning or end of a statement to add a comment that slightly changes or limits what you just said.","ex":["The food was good; mind you, the service was slow.","It is cheap; mind you, it is not very durable."],"key":"mind you","syn":["however","that said","admittedly"],"reg":"informal","ielts":"no","note":"Spoken British; avoid in essays, use 'however' or 'admittedly' instead."},{"p":"the minute (that)","m":"as soon as","d":"At the very moment when something happens; used as a conjunction to introduce a clause.","ex":["The minute that the results were published, the share price fell.","The minute the machine is switched on, it records data."],"key":"The minute that","syn":["as soon as","the instant","immediately when"],"reg":"neutral","ielts":"careful","note":"Spoken or narrative; use 'as soon as' or 'once' in formal essays."},{"p":"be misunderstood","m":"not be understood correctly","d":"To be wrongly or incorrectly understood, so that people believe something that was not intended.","ex":["His comments were misunderstood by the press.","Teenagers are often misunderstood by older generations."],"key":"were misunderstood","syn":["be misinterpreted","be misread","be misconstrued"],"reg":"neutral","ielts":"yes","note":"Useful for topics about generation gaps and media coverage."},{"p":"the moment (that)","m":"at the time when","d":"At the exact time when something happens; used as a conjunction to introduce a clause.","ex":["The moment that he entered, the room fell silent.","The moment the data was released, critics questioned it."],"key":"The moment that","syn":["as soon as","the instant","when"],"reg":"neutral","ielts":"careful","note":"Narrative; in essays use 'as soon as' or 'once' for a formal tone."},{"p":"mount sth on/to, etc.","m":"fix something in or onto a support","d":"To fix something firmly onto a surface or into a frame or to a support.","ex":["The camera was mounted on a tripod.","The statue was mounted on a marble base."],"key":"mounted on","syn":["fix","attach","install"],"reg":"neutral","ielts":"yes","note":"Useful for process and equipment descriptions in Academic Task 1."},{"p":"not be up to much","m":"not be very good","d":"Not very good, impressive or interesting; used in negative sentences in informal British English.","ex":["The film is not up to much, in my opinion.","The new library is not up to much compared to the old one."],"key":"not up to much","syn":["be mediocre","be unimpressive","be disappointing"],"reg":"informal","ielts":"no","note":"Spoken British; avoid in essays, use 'disappointing' or 'mediocre'."},{"p":"get sb/sth muddled up","m":"confuse two people or things","d":"To mistake one person or thing for another, or to mix up facts in your mind.","ex":["Tourists often get the two cities muddled up.","I got the dates muddled up and missed the meeting."],"key":"get the two cities muddled up","syn":["mix up","confuse","mistake"],"reg":"informal","ielts":"no","note":"Spoken; use 'confuse' or 'mix up' in more formal writing."},{"p":"pull a muscle","m":"injure a muscle by stretching it","d":"To injure a muscle by stretching or using it too hard.","ex":["He pulled a muscle during the final training session.","Athletes often pull a muscle when they do not warm up."],"key":"pulled a muscle","syn":["strain a muscle","tear a muscle","injure yourself"],"reg":"neutral","ielts":"careful","note":"Useful for sport and health stories; in essays use 'muscle injuries'."},{"p":"you name it","m":"and many other things like that","d":"Used to mean anything else of the same kind; added after a list to show it could continue.","ex":["They sell books, magazines, maps, you name it.","You can find clothes, tools, toys, you name it, at the market."],"key":"you name it","syn":["and so on","and the like","and so forth"],"reg":"informal","ielts":"no","note":"Chatty spoken filler; use 'and so on' or 'and so forth' in essays."},{"p":"There needs to be sth","m":"something must exist or be provided","d":"Used to say that something should exist or be provided in a situation because it is necessary.","ex":["There needs to be more investment in public transport.","There needs to be a clear plan before the work begins."],"key":"There needs to be","syn":["should be","must be","ought to be"],"reg":"neutral","ielts":"yes","note":"A natural way to state recommendations in Task 2 solutions."},{"p":"thread a needle","m":"do something very delicate and difficult","d":"To pass thread through the small hole of a needle; also to do something that needs great precision.","ex":["She managed to thread a needle in poor light.","The surgeon had to thread a needle through the narrow artery."],"key":"thread a needle","syn":["do delicate work","manoeuvre carefully","pass through"],"reg":"neutral","ielts":"careful","note":"Concrete or figurative; use in descriptions of precision, not in formal essays."},{"p":"neglect to do sth","m":"fail to do something you should do","d":"To fail to do something that you ought to do, often because of carelessness; followed by an infinitive.","ex":["Some employers neglect to give their workers proper breaks.","He neglected to check the safety instructions."],"key":"neglect to give","syn":["fail to","omit to","forget to"],"reg":"formal","ielts":"yes","note":"Formal and useful for criticising poor practice in Task 2."},{"p":"sb/sth of note","m":"someone or something important or famous","d":"A person or thing that is important, famous or worth noticing.","ex":["The museum has a painting of note by a local artist.","Few writers of note emerged from the region at that time."],"key":"of note","syn":["of importance","notable","significant"],"reg":"formal","ielts":"yes","note":"Formal and useful in descriptions of history, art and science."},{"p":"be nothing if not sth","m":"have mainly one quality","d":"Used to say that someone or something is above all a certain thing or has a certain quality to the greatest degree.","ex":["The mayor is nothing if not ambitious.","Her proposal is nothing if not practical."],"key":"nothing if not ambitious","syn":["above all","if nothing else","essentially"],"reg":"formal","ielts":"careful","note":"Literary and emphatic; use occasionally for a strong evaluative point."},{"p":"to say nothing of sth","m":"and certainly not to mention something","d":"Used to add another, even more important example of something that you have just mentioned.","ex":["The project cost a fortune, to say nothing of the delay.","The city suffers from traffic, to say nothing of pollution."],"key":"to say nothing of","syn":["not to mention","let alone","to say nothing about"],"reg":"formal","ielts":"yes","note":"Good for adding a stronger point in Task 2 body paragraphs."},{"p":"hand/give in your notice","m":"formally tell your employer you are leaving your job","d":"To formally tell your employer that you are leaving your job, usually by giving them notice in writing.","ex":["She handed in her notice after five years in the post.","Staff must give in their notice a month before leaving."],"key":"handed in her notice","syn":["resign","quit","leave your post"],"reg":"neutral","ielts":"careful","note":"Natural for work topics; 'resign' is more formal in essays."},{"p":"on occasion(s)","m":"sometimes but not often","d":"From time to time, but not regularly or very often.","ex":["He visits the museum on occasion.","Students might, on occasions, need extra support."],"key":"on occasion","syn":["occasionally","from time to time","now and then"],"reg":"formal","ielts":"yes","note":"Good formal alternative to 'sometimes' in Task 2."},{"p":"the odd","m":"a few, not regular or particular","d":"Used to mean a few, not regular, or one here and there, often to indicate chance.","ex":["He makes the odd mistake, but nothing serious.","We get the odd complaint about the service."],"key":"the odd mistake","syn":["the occasional","the occasional few","an occasional"],"reg":"informal","ielts":"careful","note":"British; use 'occasional' in essays."},{"p":"be on the verge of sth/doing sth","m":"very close to doing or experiencing something","d":"Very near to a point where something happens, usually a new state or a negative result.","ex":["The company was on the verge of bankruptcy.","Scientists are on the verge of discovering a new vaccine."],"key":"on the verge of","syn":["on the brink of","close to","on the point of"],"reg":"neutral","ielts":"yes","note":"Great for describing crises or breakthroughs in Task 2."},{"p":"have/carry sth on you","m":"have something with you","d":"To have something with you, especially in your pocket or bag.","ex":["I never carry much money on me.","He had his passport on him when he was stopped."],"key":"carry much money on me","syn":["have with you","bring","hold"],"reg":"informal","ielts":"no","note":"Spoken; in writing use 'carry' or 'have with you'."},{"p":"on the part of sb; on sb's part","m":"by or from a particular person","d":"Used to indicate that something is done or felt by a particular person or group.","ex":["There was a lack of interest on the part of the voters.","The mistake was an error on his part."],"key":"on the part of","syn":["by","from","on behalf of"],"reg":"formal","ielts":"yes","note":"Useful formal structure for assigning responsibility or attitudes."},{"p":"on principle","m":"because of a firm belief or rule","d":"Because you believe it is right or wrong, rather than because of any practical reason.","ex":["She refuses to buy fur on principle.","He declined the offer on principle."],"key":"on principle","syn":["as a matter of principle","because of your beliefs","out of conviction"],"reg":"neutral","ielts":"yes","note":"Useful for ethical positions in Task 2 opinion essays."},{"
