."],"key":"sold for $2,000","syn":["go for","be priced at","fetch"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 describing prices."},{"p":"shall I/we...?","m":"used to offer help or make a suggestion","d":"Used in questions to make an offer or suggestion, especially in British English.","ex":["Shall I open the window?","Shall we go to the park?"],"key":"Shall I open","syn":["Would you like me to...?","Should I...?","Let's..."],"reg":"neutral","ielts":"careful","note":"Good in letters and role-play; not used in essays."},{"p":"a shame","m":"something that makes you feel sad or sorry","d":"Used with 'it's' or 'what' to say that something is disappointing.","ex":["It's a shame you missed the film.","What a shame it rained all day."],"key":"a shame","syn":["a pity","unfortunate","disappointing"],"reg":"informal","ielts":"careful","note":"Fine in letters to friends; use 'unfortunate' in essays."},{"p":"a sheet of paper/glass, etc.","m":"one flat, thin piece of paper or glass","d":"A flat, thin piece of a material such as paper, glass or metal.","ex":["Please take a sheet of paper.","The window is made of a sheet of glass."],"key":"a sheet of paper","syn":["a piece of","a page of","a layer of"],"reg":"neutral","ielts":"yes","note":"Useful for describing materials and processes."},{"p":"or something (like that)","m":"used when you are not exact about what you mean","d":"Used at the end of a sentence when you are not sure or exact.","ex":["He is a doctor or something like that.","Let's have lunch or something."],"key":"or something like that","syn":["or so","or similar","or whatever"],"reg":"informal","ielts":"no","note":"Spoken vague language; avoid in writing."},{"p":"as soon as possible","m":"very quickly; with no delay","d":"Used to ask for something to be done quickly, often shortened to ASAP.","ex":["Please reply as soon as possible.","I need the book as soon as possible."],"key":"as soon as possible","syn":["immediately","promptly","at your earliest convenience"],"reg":"neutral","ielts":"yes","note":"Useful in General Training Task 1 letters and complaints."},{"p":"sound good/interesting/strange, etc.","m":"to seem good or interesting from what you hear","d":"Used with an adjective after 'sound' to give an opinion based on what you have heard.","ex":["Your plan sounds good.","That story sounds strange."],"key":"sounds good","syn":["seem","appear","come across as"],"reg":"neutral","ielts":"careful","note":"Good for reacting in Speaking; avoid in essays."},{"p":"the south","m":"the direction towards the bottom of a map","d":"The direction opposite north, or the part of a place in that direction.","ex":["The town is in the south of the country.","Many birds fly to the south in winter."],"key":"in the south","syn":["the southern part","southward","the lower part"],"reg":"neutral","ielts":"yes","note":"Very useful for Task 1 maps and location descriptions."},{"p":"spare time","m":"time when you are not working or studying","d":"Time that you have free from work or other duties, when you can do what you like.","ex":["I read books in my spare time.","What do you do in your spare time?"],"key":"in my spare time","syn":["free time","leisure time","time off"],"reg":"neutral","ielts":"yes","note":"Very common in Speaking Part 1; use 'leisure time' in essays."},{"p":"bus station","m":"a place where buses start and finish their trips","d":"A building or place where buses arrive and leave, and where people wait for them.","ex":["Meet me at the bus station at nine.","The bus station is near the market."],"key":"the bus station","syn":["bus terminal","bus depot","coach station"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 maps and transport topics."},{"p":"such a(n)","m":"used to stress how big or strong something is","d":"Used before a singular noun, often with an adjective, to emphasise a quality.","ex":["It was such a beautiful day.","She is such an honest person."],"key":"such a beautiful day","syn":["a very","so","really"],"reg":"neutral","ielts":"careful","note":"Use sparingly in essays; strong emphasis is better with data."},{"p":"such as","m":"for example","d":"Used before a noun or list to give examples of the thing you just mentioned.","ex":["I like fruit such as apples and pears.","Countries such as Japan have many earthquakes."],"key":"such as apples","syn":["for example","like","for instance"],"reg":"neutral","ielts":"yes","note":"Excellent for giving examples in Task 2."},{"p":"I suppose","m":"used to say you think something is probably true","d":"Used to show that you think something is true but are not completely sure.","ex":["I suppose you are right.","I suppose we should go home."],"key":"I suppose","syn":["I guess","I think so","presumably"],"reg":"informal","ielts":"careful","note":"Good for hedging in Speaking; avoid in essays."},{"p":"make sure (that)","m":"to check that something is true or done","d":"To check or act so that something will definitely happen or be true; followed by a clause.","ex":["Make sure that you close the window.","She made sure that the door was locked."],"key":"Make sure that you","syn":["ensure","check that","see to it that"],"reg":"neutral","ielts":"careful","note":"Use 'ensure' instead in formal essays."},{"p":"take an exam","m":"to do an exam","d":"To sit for a test of knowledge or skill, usually at school or college.","ex":["I will take an exam in June.","Students must take an exam to pass."],"key":"take an exam","syn":["sit an exam","do a test","sit a test"],"reg":"neutral","ielts":"yes","note":"Useful in education topics; 'sit an exam' is British."},{"p":"tell sb to do sth","m":"to order or ask someone to do something","d":"Used with an object and an infinitive to say that you give someone an instruction.","ex":["The teacher told us to sit down.","She told him to call her."],"key":"told us to sit","syn":["instruct","order","ask"],"reg":"neutral","ielts":"yes","note":"Useful in reported speech; the pattern needs 'to'."},{"p":"have (got) a temperature","m":"to have a body that is hotter than normal","d":"To have a body temperature that is higher than normal because of illness.","ex":["I think I have a temperature.","She has got a temperature and a cough."],"key":"have a temperature","syn":["have a fever","be feverish","run a temperature"],"reg":"neutral","ielts":"careful","note":"Good for health topics in Speaking; 'fever' is more formal."},{"p":"the underground","m":"the train system that runs under a city","d":"The railway system in a city where trains run in tunnels under the ground; British English.","ex":["I go to work by the underground.","The underground is faster than the bus."],"key":"the underground","syn":["the metro","the subway","the tube"],"reg":"neutral","ielts":"yes","note":"Useful in transport essays; 'metro' or 'subway' in other regions."},{"p":"up the road/street, etc.","m":"further along the road or street","d":"Used to say that a place is a short distance along a road or street.","ex":["The bank is just up the road.","She lives up the street from us."],"key":"up the road","syn":["further along","nearby","a little further on"],"reg":"informal","ielts":"careful","note":"Good for directions in Speaking; be clear in map tasks."},{"p":"a variety of sth/sb","m":"many different types of something","d":"Used before a plural noun to mean many different kinds of it.","ex":["The menu offers a variety of dishes.","We met a variety of people."],"key":"a variety of dishes","syn":["a range of","a selection of","many kinds of"],"reg":"neutral","ielts":"yes","note":"Good academic phrase for Task 2 and Task 1."},{"p":"you're welcome","m":"a polite answer when someone says thank you","d":"Used as a polite reply to someone who has thanked you.","ex":["Thank you for your help. - You're welcome.","You're welcome, any time."],"key":"You're welcome","syn":["not at all","my pleasure","no problem"],"reg":"neutral","ielts":"no","note":"Spoken reply only; useful in Speaking role-play."},{"p":"the west","m":"the direction where the sun goes down","d":"The direction where the sun sets, or the part of a place in that direction.","ex":["The sun sets in the west.","The river flows to the west of the city."],"key":"in the west","syn":["the western part","westward","the setting sun"],"reg":"neutral","ielts":"yes","note":"Very useful for Task 1 maps and location descriptions."},{"p":"What about ...?","m":"used to make a suggestion or ask about something","d":"Used followed by a noun or -ing form to suggest something or ask about another thing.","ex":["What about eating out tonight?","What about your brother? Is he coming?"],"key":"What about eating","syn":["How about...?","Why not...?","Shall we...?"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"why don't you?/ why not do sth?","m":"used to give someone a suggestion","d":"Used to suggest that someone does something; followed by a bare infinitive.","ex":["Why don't you ask your teacher?","Why not try the new cafe?"],"key":"Why don't you ask","syn":["you could","how about","you should"],"reg":"informal","ielts":"no","note":"Spoken advice; use 'should' or 'could' in letters."},{"p":"your world","m":"the life, interests and people around you","d":"The things, people and experiences that make up someone's life.","ex":["Music is your world when you are young.","Your family is your world."],"key":"is your world","syn":["your life","your surroundings","your own life"],"reg":"neutral","ielts":"careful","note":"Fairly figurative; use in Speaking, not in academic essays."},{"p":"would love sth","m":"to want something very much","d":"Used with a noun to say you would very much like something.","ex":["I would love a holiday.","We would love some help."],"key":"would love a holiday","syn":["would like","would enjoy","long for"],"reg":"informal","ielts":"careful","note":"Good in Speaking and letters to friends; use 'would like' formally."},{"p":"be wrong","m":"to be not correct or not right","d":"Used to say that a person or an answer is not correct.","ex":["You are wrong about the date.","The answer is wrong."],"key":"are wrong about","syn":["be mistaken","be incorrect","be in error"],"reg":"neutral","ielts":"careful","note":"Direct; use 'be mistaken' or 'be incorrect' in formal writing."}],"B1":[{"p":"How/What about ...?","m":"used to make a suggestion","d":"Used to suggest an idea or ask for information about something.","ex":["How about going to the museum this afternoon?","What about asking your teacher for some advice?"],"key":"How about","syn":["Why not","What if we"],"reg":"informal","ielts":"no","note":"Spoken suggestion; avoid in essays, fine in friendly letters."},{"p":"be (just) about to do sth","m":"be going to do something very soon","d":"To be on the point of doing something in the immediate future.","ex":["I was just about to leave when the phone rang.","She is about to start her first job at a bank."],"key":"was just about to leave","syn":["be on the point of","be on the verge of"],"reg":"neutral","ielts":"careful","note":"Narrative use; rarely needed in essays, fine in speaking."},{"p":"above all","m":"most importantly; more than anything else","d":"Used to emphasise the most important point among several.","ex":["Above all, students need a quiet place to study.","Above all, governments must protect the environment."],"key":"Above all","syn":["most importantly","first and foremost"],"reg":"neutral","ielts":"yes","note":"Good for stressing your key point in Task 2."},{"p":"by accident","m":"without planning to; not on purpose","d":"Without intending to do something; by chance.","ex":["I deleted the file by accident.","He broke his phone by accident last week."],"key":"by accident","syn":["accidentally","unintentionally"],"reg":"neutral","ielts":"careful","note":"Fine for speaking stories; use 'accidentally' in formal writing."},{"p":"in addition (to)","m":"also; as well as something","d":"Used to add extra information to what has already been mentioned.","ex":["In addition to English, she speaks French and Spanish.","In addition, many cities now offer free public transport."],"key":"In addition to","syn":["as well as","besides"],"reg":"formal","ielts":"yes","note":"Strong linker for adding ideas in Task 2."},{"p":"in advance","m":"before something happens","d":"Before a particular time or event, often to prepare for it.","ex":["You should book your tickets well in advance.","Please send me the details in advance."],"key":"in advance","syn":["beforehand","ahead of time"],"reg":"neutral","ielts":"yes","note":"Useful in letters and essays about planning."},{"p":"take advantage of sth","m":"use a good situation to help yourself","d":"To make good use of an opportunity or situation, sometimes unfairly.","ex":["Students should take advantage of the free library services.","He took advantage of the sunny weather to paint the fence."],"key":"take advantage of","syn":["make use of","benefit from"],"reg":"neutral","ielts":"yes","note":"Good for opportunities; can sound negative if about people."},{"p":"can afford","m":"have enough money to pay for something","d":"To have enough money or time to be able to do something.","ex":["Many families cannot afford a house in the city.","I can afford a new laptop this year."],"key":"cannot afford","syn":["have the means to","be able to pay for"],"reg":"neutral","ielts":"yes","note":"Useful in essays on cost and housing; usually negative or with 'can'."},{"p":"after all","m":"despite what has been said or happened","d":"Used to say something is true despite earlier events or doubts.","ex":["After all, nobody is perfect.","We waited an hour, and after all he didn't come."],"key":"After all","syn":["in the end","all things considered"],"reg":"neutral","ielts":"careful","note":"Careful in essays; works as a reminder of a key point."},{"p":"day after day/year after year, etc.","m":"many days or years in a row","d":"Used to say that something happens repeatedly over a long period.","ex":["Day after day, the workers repeated the same task.","Year after year, the town grows bigger."],"key":"Day after day","syn":["every single day","continuously"],"reg":"neutral","ielts":"careful","note":"Descriptive; use sparingly in essays, good in speaking stories."},{"p":"again and again","m":"many times; repeatedly","d":"Many times, repeatedly.","ex":["I told him again and again to be careful.","She read the instructions again and again."],"key":"again and again","syn":["repeatedly","over and over"],"reg":"neutral","ielts":"careful","note":"Good for emphasis in speaking; 'repeatedly' is better in essays."},{"p":"once again","m":"one more time","d":"Another time; once more.","ex":["Once again, the team has won the championship.","Once again, prices have gone up this year."],"key":"Once again","syn":["again","one more time"],"reg":"neutral","ielts":"careful","note":"Useful for showing repeated trends in Task 1."},{"p":"aim to do sth","m":"try or plan to do something","d":"To intend or try to achieve something; followed by to-infinitive.","ex":["The company aims to reduce its costs by ten percent.","We aim to finish the project by June."],"key":"aims to reduce","syn":["intend to","seek to","plan to"],"reg":"neutral","ielts":"yes","note":"Good for stating goals in essays and Task 1 reports."},{"p":"at all","m":"in any way; used for emphasis","d":"Used in negative sentences and questions to emphasise a point.","ex":["I don't like horror films at all.","Did you enjoy the trip at all?"],"key":"at all","syn":["whatsoever","in the least"],"reg":"neutral","ielts":"careful","note":"Use in negative sentences for emphasis; fine in essays."},{"p":"all is well","m":"everything is fine","d":"Used to say that everything is going well.","ex":["The doctor said that all is well.","All is well at home, so don't worry."],"key":"all is well","syn":["everything is fine","all is in order"],"reg":"neutral","ielts":"no","note":"Spoken or letters; rarely used in academic writing."},{"p":"and all that","m":"and other similar things","d":"Used at the end of a list to mean similar things.","ex":["We talked about school, work and all that.","He likes cooking, shopping and all that."],"key":"and all that","syn":["and so on","and things like that"],"reg":"informal","ielts":"no","note":"Spoken only; use 'and so on' in essays."},{"p":"can/could always do sth","m":"it is always possible to do something","d":"Used to say that something is always a possible option.","ex":["You can always ask your teacher for help.","We could always take the bus instead."],"key":"can always ask","syn":["it is always possible to","there is always the option to"],"reg":"neutral","ielts":"careful","note":"Good for suggestions in speaking; modals fine in essays."},{"p":"one another","m":"each other","d":"Used to show that each person does the same to the other.","ex":["The two friends help one another with homework.","People should respect one another."],"key":"one another","syn":["each other","mutually"],"reg":"neutral","ielts":"yes","note":"Fine in essays about relationships and society."},{"p":"apart from","m":"except for; not including","d":"Used to introduce an exception to a statement.","ex":["Apart from Monday, I am free all week.","Apart from the cost, the plan is excellent."],"key":"Apart from","syn":["except for","aside from"],"reg":"neutral","ielts":"yes","note":"Useful to introduce exceptions in Task 1 and Task 2."},{"p":"appear in/at/on, etc.","m":"be seen or be present in a place","d":"To be seen or to be published or present in a place.","ex":["Her name appeared in the local newspaper.","He will appear on television next week."],"key":"appeared in","syn":["be published in","feature in"],"reg":"neutral","ielts":"careful","note":"Neutral verb phrase; fine in writing when the noun is clear."},{"p":"the army","m":"the military forces of a country","d":"The military force of a country that fights on land.","ex":["He joined the army at the age of eighteen.","The army helped people after the flood."],"key":"the army","syn":["the military","the armed forces"],"reg":"neutral","ielts":"yes","note":"Useful in essays on national service or disasters."},{"p":"as soon as","m":"immediately after something happens","d":"At the very moment or just after something else happens.","ex":["Call me as soon as you arrive.","Prices rise as soon as demand increases."],"key":"as soon as","syn":["the moment","once"],"reg":"neutral","ielts":"yes","note":"Fine in essays to show cause and timing."},{"p":"as long as","m":"on the condition that","d":"Provided that; used to say one thing depends on another.","ex":["You can stay out as long as you are home by ten.","Cars are fine as long as they run on clean energy."],"key":"as long as","syn":["provided that","so long as"],"reg":"neutral","ielts":"yes","note":"Good conditional linker in Task 2; 'provided that' is more formal."},{"p":"at his/its, etc. best","m":"in the best condition or form","d":"At the highest quality or level that someone or something can reach.","ex":["The city looks at its best in spring.","She was at her best in the final match."],"key":"at its best","syn":["in top form","at its peak"],"reg":"neutral","ielts":"careful","note":"Descriptive; fine in speaking, use carefully in essays."},{"p":"at least","m":"not less than; at the minimum","d":"Used to say that something is the minimum amount or the very least.","ex":["You should exercise at least three times a week.","At least he tried his best."],"key":"at least","syn":["no fewer than","a minimum of"],"reg":"neutral","ielts":"yes","note":"Useful for numbers and advice; good in Task 2."},{"p":"at first","m":"in the beginning","d":"In the beginning, before later changes happen.","ex":["At first, I found the course difficult.","At first, many people opposed the new law."],"key":"At first","syn":["initially","in the beginning"],"reg":"neutral","ielts":"yes","note":"Good for showing change over time; pair with 'later' or 'however'."},{"p":"at the same time","m":"simultaneously; during the same period","d":"Used to say that two things happen together.","ex":["At the same time, technology also brings risks.","She studies and works at the same time."],"key":"At the same time","syn":["simultaneously","meanwhile"],"reg":"neutral","ielts":"yes","note":"Good linker for balancing two ideas in Task 2."},{"p":"at once","m":"immediately; right now","d":"Immediately, or all together in one moment.","ex":["Please come here at once.","Don't try to do everything at once."],"key":"at once","syn":["immediately","straight away"],"reg":"neutral","ielts":"careful","note":"Fine in letters and speaking; 'immediately' is better in essays."},{"p":"at present","m":"now; at this time","d":"At the moment; during the current period.","ex":["At present, most people use smartphones.","The road is closed at present."],"key":"At present","syn":["currently","at the moment"],"reg":"formal","ielts":"yes","note":"Excellent for Task 1 and Task 2 when describing the current situation."},{"p":"attend a church/college/school, etc.","m":"go to a place for religious services or classes","d":"To go regularly to a church, college or school.","ex":["She attends school every day.","They attend church every Sunday."],"key":"attends school","syn":["go to","be enrolled at"],"reg":"neutral","ielts":"yes","note":"Use with 'school/college' in education essays."},{"p":"pay attention (to sth)","m":"notice or listen carefully to something","d":"To listen to, watch or think about something carefully.","ex":["You must pay attention to the instructions.","Students often don't pay attention in class."],"key":"pay attention to","syn":["focus on","take notice of"],"reg":"neutral","ielts":"yes","note":"Very useful in essays on education and safety."},{"p":"attract attention/interest, etc.","m":"make people notice or become interested","d":"To make people notice or feel interested.","ex":["The festival attracts attention from all over the world.","The new museum has attracted a lot of interest."],"key":"attracts attention","syn":["draw attention","catch the eye"],"reg":"neutral","ielts":"yes","note":"Good for tourism and advertising topics."},{"p":"two weeks/five hours, etc. away","m":"a distance or time from a place","d":"Used to say how far away something is in distance or time.","ex":["The beach is two hours away.","The exam is only three weeks away."],"key":"two hours away","syn":["distant by","a long way off"],"reg":"neutral","ielts":"careful","note":"Mostly spoken; give exact distance in Task 1 maps only."},{"p":"feel bad about sth/doing sth","m":"be sad or guilty about something","d":"To feel sorry or guilty about something you did or that happened.","ex":["I feel bad about forgetting your birthday.","She felt bad about leaving early."],"key":"feel bad about","syn":["feel guilty about","regret"],"reg":"neutral","ielts":"careful","note":"Use in speaking and informal letters; 'regret' is better in essays."},{"p":"too bad","m":"a pity; used to show sympathy","d":"Used to say you are sorry that something is unfortunate.","ex":["It's too bad you can't come to the party.","Too bad it rained all day."],"key":"too bad","syn":["what a pity","unfortunately"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"begin with sth","m":"start with something","d":"To have something as the first part.","ex":["The lesson begins with a short video.","The word begins with a silent letter."],"key":"begins with","syn":["start with","open with"],"reg":"neutral","ielts":"yes","note":"Fine in essays and descriptions of processes."},{"p":"to begin with","m":"firstly; as the first point","d":"Used to introduce the first reason or point.","ex":["To begin with, exercise improves health.","To begin with, the cost is too high."],"key":"To begin with","syn":["firstly","first of all"],"reg":"neutral","ielts":"yes","note":"Good for opening the first paragraph in Task 2."},{"p":"not believe your eyes/ears","m":"be very surprised by what you see or hear","d":"To be very surprised by what you see or hear.","ex":["I couldn't believe my eyes when I saw the huge cake.","She could not believe her ears when she heard the news."],"key":"believe my eyes","syn":["be amazed","be astonished"],"reg":"informal","ielts":"no","note":"Spoken storytelling; avoid in formal essays."},{"p":"believe it or not","m":"used to say something surprising is true","d":"Used to introduce a fact that may seem surprising.","ex":["Believe it or not, I have never flown in a plane.","Believe it or not, he won the first prize."],"key":"Believe it or not","syn":["strange as it may seem","surprisingly"],"reg":"informal","ielts":"no","note":"Spoken only; try 'surprisingly' in writing."},{"p":"the best","m":"the person or thing of highest quality","d":"The person or thing that is better than all others.","ex":["This is the best cafe in town.","She is the best in her class."],"key":"the best","syn":["the finest","the top"],"reg":"neutral","ielts":"careful","note":"Superlative use is fine; avoid vague claims in essays."},{"p":"do/try your best","m":"try as hard as you can","d":"To make the greatest effort possible.","ex":["Just do your best in the exam.","He always tries his best at work."],"key":"do your best","syn":["make every effort","try as hard as possible"],"reg":"neutral","ielts":"careful","note":"Good in speaking and letters; use 'make every effort' in essays."},{"p":"I bet (you)","m":"I am sure; I think it is likely","d":"Used to say you are fairly sure about something.","ex":["I bet you are tired after the trip.","I bet she forgot her keys again."],"key":"I bet you","syn":["I am sure","I would think"],"reg":"informal","ielts":"no","note":"Spoken only; never use in essays."},{"p":"quite a bit","m":"a lot; to a fairly large degree","d":"Quite a large amount or degree.","ex":["I have learned quite a bit this year.","He eats quite a bit of fruit."],"key":"quite a bit","syn":["a lot","a good deal"],"reg":"informal","ielts":"no","note":"Spoken or informal letters; use 'considerably' in essays."},{"p":"blow your nose","m":"clear your nose with a tissue","d":"To clean your nose by blowing air out through it.","ex":["He blew his nose into a tissue.","Please blow your nose before dinner."],"key":"blew his nose","syn":["clear your nose","wipe your nose"],"reg":"neutral","ielts":"no","note":"Everyday phrase; not useful for essays."},{"p":"on board","m":"inside a ship, plane or team; part of a group","d":"On a ship, plane or train, or agreed to join a project.","ex":["All passengers are now on board.","We have a new designer on board."],"key":"on board","syn":["aboard","part of the team"],"reg":"neutral","ielts":"careful","note":"Use for transport and teams; 'on board' also means supportive."},{"p":"bring (sb) happiness/luck/peace, etc.","m":"cause someone to have happiness, luck or peace","d":"To cause people to feel or have a good thing.","ex":["Good friends bring happiness to our lives.","The new law may bring peace to the region."],"key":"bring happiness","syn":["give","create","cause"],"reg":"neutral","ielts":"yes","note":"Good collocation in essays about wellbeing and society."},{"p":"a broad range/variety, etc.","m":"a wide group of different things","d":"A large number of different types or things.","ex":["The shop sells a broad range of products.","The course covers a broad variety of topics."],"key":"a broad range","syn":["a wide range","a diverse selection"],"reg":"neutral","ielts":"yes","note":"Strong collocation for essays and Task 1 descriptions."},{"p":"by accident/mistake, etc.","m":"not on purpose; by chance or error","d":"Without meaning to; by chance or because of a mistake.","ex":["He sent the email by mistake.","The door was opened by accident."],"key":"by mistake","syn":["accidentally","in error"],"reg":"neutral","ielts":"careful","note":"Fine in letters and speaking; 'in error' is more formal."},{"p":"by hand","m":"made using hands, not machines","d":"Done with the hands rather ntrols or manages something.","ex":["She is in charge of the team.","Who is in charge here?"],"key":"in charge of","syn":["be responsible","be in control"],"reg":"neutral","ielts":"yes","note":"Fine for work and management topics."},{"p":"choose to do sth","m":"decide to do something","d":"To decide to do something because you want to.","ex":["Many people choose to live in the city.","He chose to study abroad."],"key":"choose to live","syn":["decide to","opt to"],"reg":"neutral","ielts":"yes","note":"Very useful for talking about choices in Task 2."},{"p":"the cold","m":"cold weather","d":"Cold weather or low temperature in general.","ex":["She doesn't like the cold.","Old people suffer in the cold."],"key":"the cold","syn":["chilly weather","low temperatures"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; be more specific in essays."},{"p":"come after/first/last, etc.","m":"be in a certain place in a list or order","d":"To follow or be in a certain place in an order.","ex":["Friday comes after Thursday.","Who came first in the race?"],"key":"comes after","syn":["follow","rank"],"reg":"neutral","ielts":"yes","note":"Useful for sequences and rankings in Task 1."},{"p":"come true","m":"happen as wished or predicted","d":"To happen in the way someone hoped or said.","ex":["My dream finally came true.","His prediction came true."],"key":"came true","syn":["be realised","become reality"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'be realised' is better in essays."},{"p":"come on","m":"hurry up; used to encourage","d":"Used to tell someone to hurry or to show you do not believe something.","ex":["Come on, we'll be late!","Oh, come on, you can do it."],"key":"Come on","syn":["hurry up","let's go"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in writing."},{"p":"have sth in common","m":"share something with others","d":"To share something with another person or thing.","ex":["The two cities have a lot in common.","We have nothing "with all the small facts","d":"Giving all the facts and small parts.","ex":["She explained the plan in detail.","The report examines the problem in detail."],"key":"in detail","syn":["thoroughly","at length"],"reg":"neutral","ielts":"yes","note":"Great for writing about analysis and explanations."},{"p":"be dying for/to do sth","m":"want something or want to do something very much","d":"To want something very much.","ex":["I'm dying for a cold drink.","She is dying to see the film."],"key":"dying for","syn":["be desperate for","long for"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in formal writing."},{"p":"likes and dislikes","m":"things a person likes and does not like","d":"The things that a person enjoys and does not enjoy.","ex":["Everyone has their own likes and dislikes.","Ask about your guests' likes and dislikes."],"key":"likes and dislikes","syn":["preferences","tastes"],"reg":"neutral","ielts":"careful","note":"Fine in speaking about hobbies; 'preferences' is more formal."},{"p":"on display","m":"shown to the public","d":"Put in a place so that people can see it.","ex":["The paintings are on display in the museum.","New phones are on display in the shop."],"key":"on display","syn":["on show","exhibited"],"reg":"neutral","ielts":"yes","note":"Useful in essays on museums and tourism."},{"p":"do badly/well","m":"perform badly or well","d":"To perform in a bad or good way.","ex":["He did well in the exam.","She did badly at school."],"key":"did well","syn":["perform well","succeed"],"reg":"neutral","ielts":"yes","note":"Fine with results and performance topics."},{"p":"do your hair/make-up, etc.","m":"brush or arrange your hair or put on make-up","d":"To style your hair or put on make-up.","ex":["She spends an hour doing her hair.","He did his hair before the party."],"key":"doing her hair","syn":["style your hair","get ready"],"reg":"informal","ielts":"no","note":"Everyday spoken phrase; fine in letters about daily routines."},{"p":"do your best","m":"try as hard as you can","d":"To make the greatest effort possible.","ex":["I'll do my best to arrive early.","Students should do their best."],"key":"do my best","syn":["try hard","make every effort"],"reg":"neutral","ielts":"careful","note":"Good in letters and speaking; essays prefer 'make every effort'."},{"p":"have no doubt","m":"be certain about something","d":"To be completely sure about something.","ex":["I have no doubt that she will succeed.","He had no doubt about the answer."],"key":"no doubt","syn":["be certain","be sure"],"reg":"neutral","ielts":"yes","note":"Good for strong opinion in Task 2 conclusions."},{"p":"there's no doubt","m":"it is certain; without question","d":"Used to say that something is definitely true.","ex":["There's no doubt that pollution is a problem.","There's no doubt he is the best."],"key":"There's no doubt","syn":["undoubtedly","certainly"],"reg":"neutral","ielts":"yes","note":"Strong opinion phrase for Task 2."},{"p":"drag and drop","m":"move something on a screen with a mouse","d":"To click on something and move it across a screen with a mouse.","ex":["You can drag and drop files into the folder.","Drag and drop the picture here."],"key":"drag and drop","syn":["move by mouse","click and move"],"reg":"neutral","ielts":"careful","note":"Computer term; fine in speaking about technology."},{"p":"due to","m":"because of","d":"Used to give the reason for something.","ex":["The flight was cancelled due to bad weather.","Prices rose due to high demand."],"key":"due to","syn":["because of","owing to"],"reg":"formal","ielts":"yes","note":"Common linker for causes in Task 1 and Task 2."},{"p":"take it/things easy","m":"relax and not worry","d":"To relax and not work too hard or worry.","ex":["Take it easy this weekend.","You should take things easy for a while."],"key":"Take it easy","syn":["relax","rest"],"reg":"informal","ielts":"no","note":"Spoken or friendly letters; avoid in essays."},{"p":"a sound/special/visual effect"," essays."},{"p":"not even","m":"used to show something is surprising or extreme","d":"Used for emphasis to show something is surprising.","ex":["I don't even have a phone.","He didn't even say goodbye."],"key":"don't even","syn":["not so much as","not even once"],"reg":"neutral","ielts":"careful","note":"Good for emphasis in speaking; not strong in formal essays."},{"p":"hardly ever","m":"almost never","d":"Almost never; on very few occasions.","ex":["I hardly ever eat meat.","She hardly ever watches television."],"key":"hardly ever","syn":["rarely","seldom"],"reg":"neutral","ielts":"yes","note":"Good frequency expression; use 'rarely' in formal writing."},{"p":"ever since","m":"from that time until now","d":"From a particular time in the past until now.","ex":["I have lived here ever since I was ten.","Ever since the accident, he has been careful."],"key":"ever since","syn":["since then","from then on"],"reg":"neutral","ielts":"yes","note":"Use with present perfect to link past and present."},{"p":"for ever","m":"always; for all future time","d":"Forever; for all time.","ex":["The memory will stay with me for ever.","Nothing lasts for ever."],"key":"for ever","syn":["forever","permanently"],"reg":"neutral","ielts":"careful","note":"Good for emotions; more careful in academic writing."},{"p":"except that","m":"but; with the exception that","d":"Used to introduce a fact that is the one exception.","ex":["The plan is good except that it is too costly.","It's perfect except that it's small."],"key":"except that","syn":["but","apart from the fact that"],"reg":"neutral","ielts":"yes","note":"Useful to introduce one weakness in a plan."},{"p":"be expecting sb/sth","m":"wait for someone or something to happen or arrive","d":"To believe that someone or something will arrive or happen.","ex":["She is expecting a baby in May.","We are expecting guests tonight."],"key":"expecting a baby","syn":["await","look forward to"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and letters; also used for babies and guests."},{"p":"not believe your eyes","m":"be very surprised by what you see","d":"To be very surprised by what you see.","ex":["I couldn't believe my eyes when I saw the prize.","He couldn't believe his eyes."],"key":"believe my eyes","syn":["be amazed","be astonished"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"make a face","m":"show a strange or funny look on your face","d":"To show an expression on your face to show a feeling.","ex":["The baby made a face when she tasted the lemon.","He made a face at the bad smell."],"key":"made a face","syn":["pull a face","grimace"],"reg":"informal","ielts":"no","note":"Spoken only; fine for describing people in speaking."},{"p":"in fact","m":"really; in truth","d":"Used to show that something is true or to add a strong point.","ex":["In fact, he never came.","In fact, the number has doubled."],"key":"In fact","syn":["actually","in reality"],"reg":"neutral","ielts":"yes","note":"Good for adding evidence in essays."},{"p":"fall asleep/ill","m":"start to sleep or become sick","d":"To begin to sleep or become ill.","ex":["The child fell asleep on the sofa.","She fell ill on holiday."],"key":"fell asleep","syn":["drift off","become ill"],"reg":"neutral","ielts":"careful","note":"Narrative use; fine in speaking and letters."},{"p":"fall in love","m":"start to love someone","d":"To begin to love someone.","ex":["They fell in love at university.","He fell in love with the city."],"key":"fell in love","syn":["become attached to","develop feelings for"],"reg":"neutral","ielts":"careful","note":"Fine for speaking; essays may need more formal wording."},{"p":"so far","m":"until now","d":"Up to this time.","ex":["So far, the project has been successful.","So far, I have read three chapters."],"key":"So far","syn":["until now","to date"],"reg":"neutral","ielts":"yes","note":"Good for describing progress with present perfect."},{"p":"feel like/as if","m":"seem; look as if","d":"Used to say how something seems or appears.","ex":["It feels as if it is going to rain.","She feels like a stranger."],"key":"feels as if","syn":["seem as if","appear to be"],"reg":"neutral","ielts":"careful","note":"Good for speaking; informal in essays."},{"p":"feel like sth/doing sth","m":"want to have or do something","d":"Used to say you want something or want to do something.","ex":["I feel like going for a walk.","I feel like a cold drink."],"key":"feel like going","syn":["want","fancy"],"reg":"informal","ielts":"no","note":"Spoken only; use 'would like' in writing."},{"p":"feel like sb/sth","m":"have a particular feeling like someone or something","d":"Used to say that you have a feeling similar to someone or something.","ex":["I feel like a child again.","He feels like part of the family."],"key":"feel like a child","syn":["seem like","resemble"],"reg":"neutral","ielts":"careful","note":"Good for speaking; be careful in formal writing."},{"p":"feel sorry for","m":"have sympathy for someone","d":"To feel pity or sympathy for someone.","ex":["I feel sorry for the children.","She felt sorry for the lost dog."],"key":"feel sorry for","syn":["sympathise with","pity"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and letters; 'sympathise with' is more formal."},{"p":"feel at home","m":"feel comfortable and relaxed","d":"To feel comfortable and relaxed in a place.","ex":["Visitors soon feel at home here.","I felt at home in the new city."],"key":"feel at home","syn":["feel comfortable","feel relaxed"],"reg":"neutral","ielts":"careful","note":"Good for speaking about places; careful in essays."},{"p":"find sb/sth easy/boring/funny, etc.","m":"think that someone or something is easy, boring or funny","d":"To have a particular opinion about someone or something.","ex":["Many students find the exam difficult.","I find the film boring."],"key":"find the exam difficult","syn":["consider","think of as"],"reg":"neutral","ielts":"yes","note":"Useful for opinions in Task 2."},{"p":"find the money/time, etc.","m":"get money or time for something","d":"To manage to get money or time for something.","ex":["I couldn't find the time to call you.","They found the money to buy a house."],"key":"find the time","syn":["make time","manage to get"],"reg":"neutral","ielts":"yes","note":"Good for essays on cost and time pressure."},{"p":"finish first/second, etc.","m":"end a race or contest in a position","d":"To end a race or contest in a certain position.","ex":["She finished first in the race.","Our team finished second."],"key":"finished first","syn":["come first","end up first"],"reg":"neutral","ielts":"careful","note":"Good for describing rankings in sports essays."},{"p":"on fire","m":"burning","d":"Burning with flames.","ex":["The building was on fire.","The kitchen is on fire!"],"key":"on fire","syn":["burning","in flames"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and news; a different meaning is 'doing great'."},{"p":"the first","m":"the person or thing at the start","d":"The person or thing that is at the beginning.","ex":["She was the first to arrive.","The first of May is a holiday."],"key":"the first","syn":["the earliest","the initial one"],"reg":"neutral","ielts":"careful","note":"Fine for sequences; specify what is meant in essays."},{"p":"folk art/dancing, etc.","m":"art or dance of ordinary people","d":"Art, dance or music from a traditional culture.","ex":["The museum has beautiful folk art.","We watched some folk dancing."],"key":"folk art","syn":["traditional art","country art"],"reg":"neutral","ielts":"yes","note":"Useful in essays on culture and tradition."},{"p":"the following day/morning, etc.","m":"the day or morning after","d":"Used for the next day, morning and so on.","ex":["The following day, we went to the beach.","The following morning, he left early."],"key":"The following day","syn":["the next day","the day after"],"reg":"neutral","ielts":"yes","note":"Good for narrating events or processes."},{"p":"for sure","m":"without doubt","d":"Certainly, without any doubt.","ex":["I know for sure that he is right.","Do you know for sure?"],"key":"for sure","syn":["certainly","definitely"],"reg":"informal","ielts":"no","note":"Spoken; use 'certainly' in essays."},{"p":"for instance","m":"as an example","d":"Used to give an example.","ex":["For instance, you could cycle to work.","Many animals, for instance, sleep all day."],"key":"For instance","syn":["for example","such as"],"reg":"neutral","ielts":"yes","note":"Standard way to give examples in Task 2."},{"p":"fresh air","m":"clean air outside","d":"Clean, cool air outside, not air inside rooms.","ex":["We need some fresh air.","The countryside has fresh air."],"key":"fresh air","syn":["clean air","open air"],"reg":"neutral","ielts":"yes","note":"Good for health and environment topics."},{"p":"be friends (with sb)","m":"have a friendship with someone","d":"To have a friendly relationship with someone.","ex":["I am friends with my neighbour.","They have been friends for years."],"key":"am friends with","syn":["get on with","be close to"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; keep specific in essays."},{"p":"make friends (with sb)","m":"become friends with someone","d":"To start a friendship with someone.","ex":["It's easy to make friends at university.","She made friends with the new student."],"key":"make friends","syn":["befriend","become friends"],"reg":"neutral","ielts":"yes","note":"Useful for social topics in Task 2."},{"p":"be friendly with sb","m":"be kind and pleasant to someone","d":"To be kind and pleasant to someone.","ex":["She is friendly with everyone.","He is friendly with his colleagues."],"key":"is friendly with","syn":["be kind to","get on well with"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and letters; avoid vague terms in essays."},{"p":"in front","m":"ahead of other people or things","d":"In a position ahead of others.","ex":["The car in front stopped suddenly.","She sat in front of the class."],"key":"in front","syn":["ahead","in the lead"],"reg":"neutral","ielts":"careful","note":"Useful for spatial descriptions."},{"p":"in full","m":"completely; with no part left out","d":"Completely; with nothing missed out.","ex":["Please pay in full.","The bill was paid in full."],"key":"in full","syn":["completely","entirely"],"reg":"neutral","ielts":"yes","note":"Good for formal letters about payments."},{"p":"the future","m":"time that will come","d":"The time after now.","ex":["We must think about the future.","The future looks bright."],"key":"the future","syn":["tomorrow","what lies ahead"],"reg":"neutral","ielts":"yes","note":"Key word for Task 2 predictions."},{"p":"in future","m":"from now on; in the time to come","d":"From now on, in the time that will come.","ex":["Please be more careful in future.","In future, we will check carefully."],"key":"in future","syn":["from now on","henceforth"],"reg":"formal","ielts":"yes","note":"Common in formal letters and complaints."},{"p":"in general","m":"usually; in most cases","d":"In most cases or on the whole.","ex":["In general, people prefer fast food.","In general, prices are rising."],"key":"In general","syn":["generally","on the whole"],"reg":"neutral","ielts":"yes","note":"Good for general statements in Task 1 and Task 2."},{"p":"get cancer/flu, etc.","m":"become ill with a disease","d":"To become ill with a disease.","ex":["He got cancer last year.","Many children get flu in winter."],"key":"got cancer","syn":["develop","contract"],"reg":"neutral","ielts":"yes","note":"Use 'develop cancer' or 'contract' in formal writing."},{"p":"get cold/ill/late, etc.","m":"become cold, ill or late","d":"To become cold, ill or late.","ex":["It's getting cold outside.","She got ill during the trip."],"key":"getting cold","syn":["become","turn"],"reg":"neutral","ielts":"careful","note":"Good for speaking; formal writing prefers 'become'."},{"p":"get worse","m":"become less good or more bad","d":"To become more bad or unpleasant.","ex":["The weather got worse.","His health is getting worse."],"key":"got worse","syn":["deteriorate","decline"],"reg":"neutral","ielts":"yes","note":"Good for describing negative trends in Task 1."},{"p":"get caught/killed/told off, etc.","m":"be caught, killed or told off","d":"Used with a past participle to show something happens to someone.","ex":["He got caught stealing.","She got told off for being late."],"key":"got caught","syn":["be caught","be punished"],"reg":"informal","ielts":"no","note":"Informal passive; use 'be caught' in essays."},{"p":"get sth wrong","m":"do something wrongly","d":"To make a mistake with something.","ex":["I got the answer wrong.","You got the date wrong."],"key":"got the answer wrong","syn":["make a mistake","misunderstand"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; use 'misunderstand' in essays."},{"p":"get sth painted/repaired, etc.","m":"have something done by someone else","d":"To arrange for someone else to do something.","ex":["I need to get my car repaired.","We got the house painted."],"key":"get my car repaired","syn":["have done","arrange for"],"reg":"neutral","ielts":"careful","note":"Spoken style; 'have + object + done' is more formal."},{"p":"get in touch","m":"contact someone","d":"To contact someone, by phone or email.","ex":["Please get in touch with me soon.","I got in touch with my old friend."],"key":"get in touch","syn":["contact","reach"],"reg":"neutral","ielts":"yes","note":"Useful in General Training letters."},{"p":"get down/into/off, etc.","m":"move or enter, or leave a place","d":"Used with prepositions to show movement to or from a place.","ex":["He got into the car.","She got off the bus."],"key":"got into the car","syn":["enter","board"],"reg":"neutral","ielts":"careful","note":"Spoken style; fine in narrative."},{"p":"get to know sb/sth","m":"learn about someone or something","d":"To learn about someone or something over time.","ex":["You will soon get to know the city.","I'm getting to know my classmates."],"key":"get to know","syn":["become familiar with","learn about"],"reg":"neutral","ielts":"yes","note":"Good for social and cultural topics."},{"p":"get rid of sth","m":"remove something you don't want","d":"To remove something you don't want.","ex":["We need to get rid of old furniture.","She got rid of her bad habits."],"key":"get rid of","syn":["dispose of","eliminate"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'eliminate' is more formal."},{"p":"the girls","m":"female friends or young women","d":"A group of girls or young women.","ex":["The girls are playing football.","The girls went on holiday together."],"key":"The girls","syn":["young women","female friends"],"reg":"informal","ielts":"no","note":"Everyday spoken phrase; not for essays."},{"p":"glance at/around/towards, etc.","m":"look quickly at something","d":"To look quickly at someone or something.","ex":["She glanced at her watch.","He glanced around the room."],"key":"glanced at","syn":["look quickly","peek at"],"reg":"neutral","ielts":"careful","note":"Narrative verb; not common in essays."},{"p":"go badly/well, etc.","m":"happen badly or well","d":"To happen in a bad or good way.","ex":["The meeting went well.","The interview went badly."],"key":"went well","syn":["turn out well","proceed"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'proceed' for formal writing."},{"p":"go wrong","m":"stop working properly or have problems","d":"To fail, go badly or stop working properly.","ex":["Something went wrong with the computer.","The plan went wrong."],"key":"went wrong","syn":["fail","break down"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'fail' is better in essays."},{"p":"go bald/blind/grey, etc.","m":"become bald, blind or grey","d":"To become bald, blind or grey.","ex":["My father is going bald.","Her hair went grey early."],"key":"going bald","syn":["become","turn"],"reg":"neutral","ielts":"careful","note":"Describing changes; fine in speaking."},{"p":"Oh my God!","m":"used to show surprise or shock","d":"Used to show surprise or shock.","ex":["Oh my God! Look at that!","Oh my God! I forgot my keys!"],"key":"Oh my God","syn":["Oh dear","Good heavens"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in writing."},{"p":"thank God","m":"used to say you are happy or relieved","d":"Used to show you are happy or relieved.","ex":["Thank God it's Friday!","Thank God you're safe."],"key":"Thank God","syn":["thank goodness","what a relief"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"the ground","m":"the surface of the earth","d":"The surface of the earth or the floor.","ex":["The ground was wet after the rain.","He fell to the ground."],"key":"The ground","syn":["the earth","the floor"],"reg":"neutral","ielts":"careful","note":"Descriptive; fine in speaking, rare in essays."},{"p":"I guess","m":"I think so; I suppose","d":"Used to say you think something may be true.","ex":["I guess you're right.","I guess he'll be late."],"key":"I guess","syn":["I suppose","I think"],"reg":"informal","ielts":"no","note":"Spoken only; use 'I believe' in essays."},{"p":"break/cut, etc. sth in half","m":"divide something into two equal parts","d":"To cut or break something into two equal parts.","ex":["Cut the cake in half.","He broke the bread in half."],"key":"Cut the cake in half","syn":["split in two","halve"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and descriptions of processes."},{"p":"a hand","m":"help","d":"Help; used in 'give someone a hand'.","ex":["Can you give me a hand?","He lent us a hand."],"key":"a hand","syn":["help","assistance"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"have sth cleaned/cut/repaired, etc.","m":"arrange for someone else to do something","d":"To arrange for someone else to do something for you.","ex":["I had my hair cut yesterday.","She had her laptop repaired."],"key":"had my hair cut","syn":["get done","arrange for"],"reg":"neutral","ielts":"careful","note":"Good for describing services; fine in letters."},{"p":"have sth stolen/taken, etc.","m":"suffer something bad that happens to you","d":"To experience something unpleasant happening to your property.","ex":["He had his wallet stolen.","She had her bag taken at the station."],"key":"had his wallet stolen","syn":["suffer the theft of","lose"],"reg":"neutral","ielts":"careful","note":"Fine for crime topics in speaking."},{"p":"have no idea","m":"not know at all","d":"To not know or understand something at all.","ex":["I have no idea what to do.","She had no idea about the plan."],"key":"have no idea","syn":["not know","be unaware"],"reg":"informal","ielts":"no","note":"Spoken only; use 'be unaware' in essays."},{"p":"the heart of sth","m":"the most important part of something","d":"The central or most important part of something.","ex":["This is the heart of the problem.","The market is the heart of the city."],"key":"the heart of","syn":["the core of","the centre of"],"reg":"neutral","ielts":"yes","note":"Good for describing the key issue in essays."},{"p":"can't/couldn't help doing sth","m":"not be able to stop yourself doing something","d":"Used to say you cannot stop doing something.","ex":["I couldn't help laughing.","She can't help feeling nervous."],"key":"couldn't help laughing","syn":["be unable to stop","cannot resist"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; careful in essays."},{"p":"help yourself (to sth)","m":"take what you want","d":"Used to tell someone to take what they want.","ex":["Help yourself to some tea.","Please help yourself to the food."],"key":"Help yourself to","syn":["take what you like","go ahead"],"reg":"informal","ielts":"no","note":"Spoken only; polite and friendly."},{"p":"with the help of sth","m":"using something to help","d":"By using something or someone to help.","ex":["With the help of a map, we found the beach.","She fixed it with the help of a neighbour."],"key":"With the help of","syn":["by means of","using"],"reg":"neutral","ielts":"yes","note":"Useful in essays about technology and support."},{"p":"to be honest","m":"to say the truth","d":"Used to say that you are telling the truth.","ex":["To be honest, I don't like it.","To be honest, the film was too long."],"key":"To be honest","syn":["frankly","to tell the truth"],"reg":"informal","ielts":"no","note":"Spoken only; use 'in truth' or 'frankly' in essays."},{"p":"hope to do sth","m":"want or plan to do something","d":"To want or plan to do something in the future.","ex":["I hope to study abroad.","She hopes to become a doctor."],"key":"hope to study","syn":["wish to","aim to"],"reg":"neutral","ielts":"yes","note":"Good for goals in speaking and letters."},{"p":"a horror film/movie/story","m":"a frightening film, story or movie","d":"A film, story or movie that makes people feel afraid.","ex":["I don't like horror films.","He wrote a horror story."],"key":"horror films","syn":["scary film","thriller"],"reg":"neutral","ielts":"careful","note":"Fine for talking about entertainment."},{"p":"How about ...?","m":"used to suggest something","d":"Used to make a suggestion.","ex":["How about a cup of tea?","How about going to the cinema?"],"key":"How about","syn":["Why not","What about"],"reg":"informal","ielts":"no","note":"Spoken suggestion; avoid in essays."},{"p":"a sense of humour","m":"ability to see the funny side of things","d":"The ability to laugh or to see that things are funny.","ex":["She has a good sense of humour.","He lost his sense of humour."],"key":"sense of humour","syn":["wit","comic sense"],"reg":"neutral","ielts":"yes","note":"Good for describing character in speaking and essays."},{"p":"if I were you","m":"used to give advice","d":"Used to give advice by saying what you would do.","ex":["If I were you, I would study harder.","If I were you, I'd say sorry."],"key":"If I were you","syn":["in your position","were I in your place"],"reg":"neutral","ielts":"careful","note":"Useful in advice letters; avoid in academic essays."},{"p":"if only","m":"used to say you wish something were different","d":"Used to show a strong wish about something.","ex":["If only I had more time!","If only we had known earlier."],"key":"If only","syn":["I wish","would that"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; emotional, so careful in essays."},{"p":"in time","m":"early enough","d":"Early enough for something to happen.","ex":["We arrived in time for dinner.","She got to the station in time."],"key":"in time","syn":["early enough","on time"],"reg":"neutral","ielts":"yes","note":"Useful for deadlines and travel essays."},{"p":"in love","m":"feeling love for someone","d":"Feeling love for someone.","ex":["They are in love.","He is in love with his job."],"key":"in love","syn":["be fond of","be smitten"],"reg":"neutral","ielts":"careful","note":"Fine for speaking; keep for personal topics."},{"p":"in tears","m":"crying","d":"Crying, usually because of strong sadness or emotion; used after a linking verb such as be or leave.","ex":["She was in tears when she heard the sad news.","The little boy left the shop in tears after he lost his toy."],"key":"in tears","syn":["crying","weeping","sobbing"],"reg":"neutral","ielts":"careful","note":"Fine in narrative or Speaking; rarely needed in Task 2 essays."},{"p":"in order (for sb/sth) to do sth","m":"so that someone or something can do something","d":"Used to introduce the purpose of an action, with the pattern in order (for sb) to + verb.","ex":["In order for students to succeed, they need good teachers.","She saved money for months in order to buy a new laptop."],"key":"In order for students to succeed","syn":["so that","with the aim of","so as to"],"reg":"formal","ielts":"yes","note":"Good for stating purpose in Task 2; avoid overusing it."},{"p":"in particular","m":"especially; more than others","d":"Used to show that what you say applies especially to one person, thing or case.","ex":["I enjoy sports, football in particular.","Young people in particular are affected by social media."],"key":"in particular","syn":["especially","particularly","notably"],"reg":"neutral","ielts":"yes","note":"Useful for giving focus to an example in essays."},{"p":"be into sth","m":"be very interested in something","d":"To be very interested in or enthusiastic about an activity or subject; informal, used with a noun.","ex":["My brother is really into photography.","Are you into jazz music?"],"key":"is really into photography","syn":["be keen on","be fond of","be interested in"],"reg":"informal","ielts":"careful","note":"Good in Speaking Part 1; use 'be interested in' in essays."},{"p":"You must be joking!/ You're joking!","m":"I cannot believe that; you are not serious","d":"Informal exclamation used to show surprise or disbelief at what someone has said.","ex":["You must be joking! That bag costs a hundred pounds?","You're joking! I didn't know you could speak Chinese."],"key":"You must be joking!","syn":["You can't be serious!","No way!","Are you kidding?"],"reg":"informal","ielts":"no","note":"Spoken only; fine in friendly letters, never in essays."},{"p":"jump in/into/up, etc.","m":"move suddenly by jumping in a direction","d":"To push yourself off the ground or into/onto something suddenly; the particle shows the direction.","ex":["The children jumped into the pool on a hot day.","He jumped up when he heard the doorbell."],"key":"jumped into the pool","syn":["leap","spring","hop"],"reg":"neutral","ielts":"careful","note":"Useful for describing events in narratives or Speaking."},{"p":"just about","m":"almost; nearly","d":"Used as an adverb to mean almost or very nearly, often before a verb or quantity.","ex":["I've just about finished my homework.","The room was just about full when we arrived."],"key":"just about finished","syn":["almost","nearly","practically"],"reg":"informal","ielts":"careful","note":"Good in Speaking; prefer 'almost' or 'nearly' in essays."},{"p":"be just about to do sth","m":"be going to do something very soon","d":"To be ready to do something in the immediate future; pattern be just about to + verb.","ex":["I was just about to leave when the phone rang.","The film is just about to start."],"key":"was just about to leave","syn":["be on the point of","be about to","be ready to"],"reg":"neutral","ielts":"careful","note":"Natural in Speaking and letters; rare in formal essays."},{"p":"just as bad/good/tall/clever, etc. (as sb/sth)","m":"equally bad, good, tall, etc. as someone or something","d":"Used to compare two things that are equal in some quality; pattern just as + adjective (as).","ex":["My new phone is just as good as my old one.","Online lessons can be just as effective as classroom ones."],"key":"just as good as","syn":["equally good as","every bit as good as","no less good than"],"reg":"neutral","ielts":"yes","note":"Useful for comparisons in Task 2 and Task 1 descriptions."},{"p":"just before/over/under, etc.","m":"only a little before, over, under, etc. a point or number","d":"Used with a preposition to show something is very close to a time, place or amount.","ex":["We arrived just before midnight.","Sales were just over 500 units last month."],"key":"just before midnight","syn":["shortly before","slightly over","a little under"],"reg":"neutral","ielts":"yes","note":"Handy for approximate figures in Academic Task 1."},{"p":"keep doing sth","m":"continue to do something or do it again and again","d":"To continue an action or repeat it many times; pattern keep + verb-ing.","ex":["If you keep practising, your English will improve.","She keeps forgetting her keys."],"key":"keep practising","syn":["continue to do","carry on doing","persist in doing"],"reg":"neutral","ielts":"yes","note":"Natural in both speaking and essays about habits or effort."},{"p":"keep in touch","m":"stay in contact with someone","d":"To continue to communicate with someone by phone, letter or online, often after being apart.","ex":["Let's keep in touch after you move abroad.","Social media helps people keep in touch with old friends."],"key":"keep in touch","syn":["stay in contact","remain in contact","stay in touch"],"reg":"neutral","ielts":"yes","note":"Common in friend letters and essays about technology."},{"p":"keep a/sth secret","m":"not tell other people about something","d":"To not tell anyone about something; pattern keep + noun + secret, or keep a secret.","ex":["Can you keep a secret?","They kept the wedding plans secret from their families."],"key":"keep a secret","syn":["keep quiet about","not disclose","keep under wraps"],"reg":"neutral","ielts":"careful","note":"Good for Speaking; essays may use 'keep confidential' instead."},{"p":"that kind of thing","m":"things like that","d":"Used at the end of a statement to refer vaguely to similar things.","ex":["I like hiking, camping, that kind of thing.","He reads magazines, newspapers, that kind of thing."],"key":"that kind of thing","syn":["that sort of thing","things like that","and so on"],"reg":"informal","ielts":"no","note":"Vague and spoken; avoid in essays, use 'and so on' carefully."},{"p":"some kind of","m":"a type of something that is not clearly known","d":"Used before a noun to mean a certain type that is not exactly known or described.","ex":["There was some kind of problem with the train.","He wants some kind of job in tourism."],"key":"some kind of problem","syn":["some sort of","a type of","a form of"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; be more precise in written work."},{"p":"you know","m":"a spoken phrase used to check someone understands","d":"A discourse marker used in speech to fill pauses or to show that the listener understands what is meant.","ex":["It was, you know, a really long day.","I went to that new cafe, you know, the one near the park."],"key":"you know","syn":["I mean","well","like"],"reg":"informal","ielts":"no","note":"Spoken filler; overuse lowers Speaking fluency score. Never in essays."},{"p":"be known as sth","m":"have a particular name or reputation","d":"To be called or recognised by a particular name, title or reputation; pattern be known as + noun.","ex":["Paris is known as the city of love.","He is known as a very honest politician."],"key":"is known as the city of love","syn":["be called","be referred to as","be regarded as"],"reg":"neutral","ielts":"yes","note":"Good for descriptions and introductions in essays."},{"p":"lack of sth","m":"not having enough of something","d":"The state of not having something, or not having enough of it; followed by a noun.","ex":["A lack of sleep can affect your health.","The project failed because of a lack of money."],"key":"A lack of sleep","syn":["shortage of","absence of","deficiency of"],"reg":"neutral","ielts":"yes","note":"Very useful for explaining causes in Task 2."},{"p":"later on","m":"at a time after now or after the time you are speaking about","d":"At a time in the future, or after the point in time being discussed.","ex":["I'll call you later on this evening.","He was shy at first but became more confident later on."],"key":"later on","syn":["afterwards","subsequently","at a later time"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; use 'subsequently' or 'later' in formal essays."},{"p":"lay the table","m":"put plates, knives and forks on the table for a meal","d":"To arrange plates, cutlery and glasses on a table before a meal; mainly British English.","ex":["Could you lay the table for dinner, please?","I laid the table while Mum cooked."],"key":"lay the table","syn":["set the table","prepare the table"],"reg":"neutral","ielts":"careful","note":"Useful for Speaking about home life; rare in essays."},{"p":"a/sb's way of life","m":"the way a person or group lives","d":"The habits, customs and activities that are typical of a person or community.","ex":["Farming is their traditional way of life.","Moving abroad changed my whole way of life."],"key":"traditional way of life","syn":["lifestyle","manner of living","culture"],"reg":"neutral","ielts":"yes","note":"Useful for Task 2 topics about culture and tradition."},{"p":"a little sth","m":"a small amount of something","d":"Used before an uncountable noun to mean a small quantity of it.","ex":["I'd like a little sugar in my tea.","She speaks a little Spanish."],"key":"a little sugar","syn":["a small amount of","a bit of","some"],"reg":"neutral","ielts":"careful","note":"Fine in speech; use precise quantity words in essays."},{"p":"a load/loads","m":"a lot; a large amount or number","d":"Informal expression meaning a large quantity, often used as loads of + noun.","ex":["I've got loads of homework tonight.","There were loads of people at the concert."],"key":"loads of homework","syn":["a lot","plenty","masses"],"reg":"informal","ielts":"no","note":"Informal and spoken; use 'a large amount of' in essays."},{"p":"be located in/near/on/etc.","m":"be in a particular place","d":"To be in a particular place or position; followed by a preposition of place.","ex":["The hotel is located near the beach.","The library is located on the main street."],"key":"is located near the beach","syn":["be situated in","be found in","lie in"],"reg":"formal","ielts":"yes","note":"Very useful for map descriptions in Academic Task 1."},{"p":"all day long","m":"for the whole day","d":"During the whole of a day, often showing that something is tiring or continuous.","ex":["It rained all day long.","She worked at her desk all day long."],"key":"all day long","syn":["throughout the day","the whole day","from morning till night"],"reg":"neutral","ielts":"careful","note":"Good in Speaking; formal essays prefer 'throughout the day'."},{"p":"as/so long as","m":"if; only if something happens or is true","d":"Used as a conjunction to say that something will happen only if a condition is met.","ex":["You can borrow my car as long as you drive carefully.","I don't mind so long as you tell me first."],"key":"as long as you drive carefully","syn":["provided that","on condition that","providing"],"reg":"neutral","ielts":"yes","note":"Good conditional linker; 'provided that' is more formal."},{"p":"no longer","m":"not any more","d":"Used before a verb to say that something stopped being true or happening.","ex":["He no longer lives in London.","Many people no longer use paper maps."],"key":"no longer lives","syn":["not any more","not any longer","formerly"],"reg":"neutral","ielts":"yes","note":"Useful for describing change in Task 1 and Task 2."},{"p":"look like","m":"seem similar to someone or something in appearance","d":"To have an appearance that is similar to someone or something; followed by a noun.","ex":["You look like your mother.","The building looks like a giant glass box."],"key":"look like your mother","syn":["resemble","be similar to","take after"],"reg":"neutral","ielts":"careful","note":"Fine in descriptions; 'resemble' is more formal in writing."},{"p":"it looks like/as if","m":"it seems that something is true or will happen","d":"Used to give an opinion based on what you can see; followed by a clause.","ex":["It looks like it's going to rain.","It looks as if she has forgotten the meeting."],"key":"It looks like it's going to rain","syn":["it seems that","it appears that","it seems as though"],"reg":"neutral","ielts":"careful","note":"Good for Speaking; use 'it appears that' in formal writing."},{"p":"out loud","m":"in a voice that other people can hear","d":"Used as an adverb to mean speaking so that others can hear, not silently.","ex":["She read the letter out loud.","He laughed out loud at the joke."],"key":"out loud","syn":["aloud","audibly"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking; rarely needed in essays."},{"p":"a book/cat/dog, etc. lover","m":"a person who loves books, cats, dogs, etc.","d":"A noun pattern: a person who has a strong liking for the thing named before lover.","ex":["My grandmother is a real dog lover.","As a book lover, he spends hours in the library."],"key":"a real dog lover","syn":["enthusiast","fan","devotee"],"reg":"neutral","ielts":"careful","note":"Nice for Speaking about hobbies; use 'enthusiast' in formal writing."},{"p":"be mad about sb/sth","m":"love someone or something very much","d":"To be extremely enthusiastic about or in love with someone or something; informal British English.","ex":["My sister is mad about horses.","He's mad about his new girlfriend."],"key":"is mad about horses","syn":["be crazy about","be passionate about","be wild about"],"reg":"informal","ielts":"no","note":"Informal; good for Speaking Part 1 and friend letters only."},{"p":"make sb do sth","m":"force or cause someone to do something","d":"To force someone to do something, or cause them to; pattern make + object + bare infinitive.","ex":["The teacher made us rewrite the essay.","The film made me cry."],"key":"made us rewrite the essay","syn":["force sb to do sth","oblige sb to do sth","cause sb to do sth"],"reg":"neutral","ielts":"yes","note":"Remember no 'to' after make; good for cause and effect."},{"p":"make up your mind or make your mind up","m":"decide something","d":"To decide between different choices; the reflexive possessive changes with the subject.","ex":["I can't make up my mind about which course to take.","She made her mind up quickly and accepted the job."],"key":"make up my mind","syn":["decide","come to a decision","settle on"],"reg":"neutral","ielts":"careful","note":"Good for Speaking; 'decide' is better in formal essays."},{"p":"have been meaning to do sth","m":"have planned to do something but not done it yet","d":"Used to say you have intended to do something for some time; pattern have been meaning to + verb.","ex":["I've been meaning to call you all week.","He has been meaning to clean the garage for months."],"key":"I've been meaning to call","syn":["have been planning to","have intended to","have been thinking of"],"reg":"informal","ielts":"no","note":"Natural in speech and friendly letters; avoid in essays."},{"p":"the middle","m":"the centre of a place or period of time","d":"The part of something that is at an equal distance from its edges or ends.","ex":["There is a fountain in the middle of the square.","He woke up in the middle of the night."],"key":"the middle of the square","syn":["the centre","the midpoint","the heart"],"reg":"neutral","ielts":"yes","note":"Useful for location descriptions in map tasks."},{"p":"be in the middle of (doing) sth","m":"be busy doing something at this moment","d":"To be busy doing something and not yet finished; followed by a noun or verb-ing.","ex":["I'm in the middle of cooking dinner.","She was in the middle of a meeting when I called."],"key":"in the middle of cooking dinner","syn":["be busy with","be occupied with","be engaged in"],"reg":"neutral","ielts":"careful","note":"Good for Speaking and informal emails."},{"p":"Would you mind...?","m":"a polite way to ask someone to do something","d":"A polite request, followed by verb-ing or an if-clause, asking someone's permission or help.","ex":["Would you mind closing the window?","Would you mind if I sat here?"],"key":"Would you mind closing the window?","syn":["Could you please...?","Do you mind...?","Would it be possible to...?"],"reg":"neutral","ielts":"careful","note":"Useful polite request in General Training letters and Speaking."},{"p":"wait a minute","m":"please wait for a short time","d":"Used to ask someone to wait briefly, or to show you have just noticed or thought of something.","ex":["Wait a minute, I need to find my keys.","Wait a minute, this isn't my coat."],"key":"Wait a minute","syn":["hold on","just a moment","hang on"],"reg":"informal","ielts":"no","note":"Spoken only; not for essays."},{"p":"miss a chance/opportunity","m":"fail to use a good chance","d":"To fail to take advantage of a good opportunity when it is available.","ex":["Don't miss this chance to study abroad.","He missed the opportunity to get a better job."],"key":"miss this chance","syn":["lose an opportunity","let a chance slip","pass up a chance"],"reg":"neutral","ielts":"yes","note":"Works well in Task 2 about education or career."},{"p":"by mistake","m":"without intending to; because of an error","d":"Used to say that something happened by accident rather than on purpose.","ex":["I took your umbrella by mistake.","She sent the email to the wrong person by mistake."],"key":"by mistake","syn":["accidentally","in error","unintentionally"],"reg":"neutral","ielts":"careful","note":"Fine in letters of complaint; use 'accidentally' in essays."},{"p":"wait a moment","m":"please wait for a short time","d":"A polite request to wait briefly, often used on the phone or in conversation.","ex":["Please wait a moment while I check the file.","Wait a moment, I'll be right back."],"key":"wait a moment","syn":["just a moment","hold on","one moment"],"reg":"neutral","ielts":"no","note":"Spoken and service language; not used in essays."},{"p":"once more","m":"one more time; again","d":"Used as an adverb to mean again, for another time.","ex":["Please read the sentence once more.","Spring has arrived once more."],"key":"once more","syn":["once again","again","one more time"],"reg":"neutral","ielts":"careful","note":"Acceptable in writing; avoid repeating in a short essay."},{"p":"2/3/4, etc. o'clock in the morning","m":"a way to say a time early in the day","d":"A time expression with a number and o'clock, used for hours between midnight and noon.","ex":["The train leaves at 6 o'clock in the morning.","We woke up at 4 o'clock in the morning."],"key":"6 o'clock in the morning","syn":["6 a.m.","six in the morning"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking; in Task 1 timetables use 6 a.m."},{"p":"in the morning","m":"during the early part of the day","d":"During the period from sunrise until about noon.","ex":["I usually go jogging in the morning.","The shop opens in the morning at eight."],"key":"in the morning","syn":["before noon","early in the day","during the morning"],"reg":"neutral","ielts":"careful","note":"Common in Speaking about routines; Task 1 may use 'before noon'."},{"p":"move house","m":"go to live in a different house","d":"To leave your home and go to live in another one; mainly British English.","ex":["We are going to move house next month.","They moved house because of her new job."],"key":"move house","syn":["relocate","change address","move home"],"reg":"neutral","ielts":"careful","note":"Good for Speaking; 'relocate' is more formal in essays."},{"p":"the news","m":"information about recent events","d":"Reports of recent events on television, radio, newspapers or online; treated as a singular uncountable noun.","ex":["I watch the news every evening.","The news about the factory closing is very sad."],"key":"the news","syn":["current affairs","headlines","reports"],"reg":"neutral","ielts":"yes","note":"News is uncountable: say 'the news is', not 'are'."},{"p":"nice and sth","m":"pleasantly something, for example nice and warm","d":"Informal pattern with an adjective to mean pleasantly and describing something good.","ex":["The room was nice and warm.","The soup is nice and hot."],"key":"nice and warm","syn":["pleasantly","comfortably","agreeably"],"reg":"informal","ielts":"no","note":"Informal and spoken; fine for friend letters only."},{"p":"no way","m":"definitely not; I refuse or cannot believe it","d":"Informal exclamation used to say strongly that something is impossible or that you refuse.","ex":["No way! I'm not climbing that mountain.","There is no way I can finish this today."],"key":"No way!","syn":["certainly not","absolutely not","impossible"],"reg":"informal","ielts":"no","note":"Slang-like speech; avoid in essays and Part 3 answers."},{"p":"not at all","m":"in no way; you are welcome; not even a little","d":"Used to answer 'thank you' or 'do you mind', or to say strongly that something is not true.","ex":["I was not at all surprised by the result.","'Thank you for helping.' 'Not at all.'"],"key":"not at all surprised","syn":["by no means","not in the least","certainly not"],"reg":"neutral","ielts":"careful","note":"'Not at all' fits writing for emphasis; 'by no means' is more formal."},{"p":"on sale","m":"available to buy, or sold at a lower price","d":"Available for purchase in shops, or offered at a reduced price for a limited time.","ex":["These shoes are on sale for half price.","The new phone goes on sale next Friday."],"key":"on sale for half price","syn":["for sale","discounted","reduced"],"reg":"neutral","ielts":"careful","note":"Useful for shopping topics; note the two different meanings."},{"p":"on purpose","m":"deliberately; not by accident","d":"Used to say that something is done intentionally, not by chance.","ex":["I didn't break it on purpose.","He arrived late on purpose to avoid the speech."],"key":"on purpose","syn":["deliberately","intentionally","purposely"],"reg":"neutral","ielts":"careful","note":"In essays prefer 'deliberately' or 'intentionally'."},{"p":"on time","m":"at the correct time; not late","d":"At the planned or expected time, neither early nor late.","ex":["The bus arrived on time this morning.","It is important to finish assignments on time."],"key":"on time","syn":["punctually","promptly","on schedule"],"reg":"neutral","ielts":"yes","note":"Useful for transport and work topics; don't confuse with 'in time'."},{"p":"on the whole","m":"in general; considering everything","d":"Used to give a general opinion after thinking about all the facts.","ex":["On the whole, the course was very useful.","The results were good on the whole."],"key":"On the whole","syn":["in general","overall","by and large"],"reg":"neutral","ielts":"yes","note":"Good linker for summarising ideas or conclusions in Task 2."},{"p":"(all) on your own","m":"alone, or without help from o
