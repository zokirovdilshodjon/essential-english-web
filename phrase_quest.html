<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhraseQuest – A1 to C2 Phrases for IELTS</title>
<style>
:root{
  --bg:#f6f4ef;--surface:#ffffff;--surface2:#f0ede5;--ink:#1c1b22;--muted:#686676;--line:#e3dfd3;
  --accent:#5b4bdb;--accent-ink:#fff;--accent-soft:#ece9ff;
  --good:#17935c;--good-soft:#dff5ea;--warn:#b87400;--warn-soft:#fdf0d2;--bad:#cc3a3a;--bad-soft:#fbe3e3;
  --A1:#22a06b;--A2:#128fae;--B1:#3a70dd;--B2:#7653d4;--C1:#d2542b;--C2:#c0306c;
  --shadow:0 1px 2px rgba(20,18,40,.06),0 10px 28px rgba(20,18,40,.07);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14131a;--surface:#1e1d27;--surface2:#272634;--ink:#efedf6;--muted:#a19fb2;--line:#33313f;
    --accent:#8f82ff;--accent-ink:#14131a;--accent-soft:#2a2750;
    --good:#43c98a;--good-soft:#173a2c;--warn:#f0b13a;--warn-soft:#3b2f12;--bad:#ff7a7a;--bad-soft:#40201f;
    --A1:#3fc98a;--A2:#3bbad6;--B1:#6c98ff;--B2:#a58cff;--C1:#ff7f55;--C2:#ff6a9f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14131a;--surface:#1e1d27;--surface2:#272634;--ink:#efedf6;--muted:#a19fb2;--line:#33313f;
  --accent:#8f82ff;--accent-ink:#14131a;--accent-soft:#2a2750;
  --good:#43c98a;--good-soft:#173a2c;--warn:#f0b13a;--warn-soft:#3b2f12;--bad:#ff7a7a;--bad-soft:#40201f;
  --A1:#3fc98a;--A2:#3bbad6;--B1:#6c98ff;--B2:#a58cff;--C1:#ff7f55;--C2:#ff6a9f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.brand i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.95rem}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:flex-end}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.88rem;font-weight:600;white-space:nowrap}
.ico{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;display:inline-grid;place-items:center;font-size:1rem;flex:none}
.ico:hover{border-color:var(--accent)}
.ico.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
main{padding:20px 0 70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:650}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.5rem,4.5vw,2.2rem);letter-spacing:-.03em}
.hero p{color:var(--muted);margin:10px 0 0;max-width:52ch}
.ring{--p:0;width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
.ring>*{position:relative;text-align:center;line-height:1.1}
.ring b{font-size:1.6rem;display:block}
.ring span{font-size:.72rem;color:var(--muted)}
.sec{font-size:1.1rem;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border-top:5px solid var(--c)}
.lc-main{display:flex;gap:14px;padding:16px;align-items:center}
.lcl{width:56px;height:56px;border-radius:15px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.lc h3{font-size:1rem}
.lc small{color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative;margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter .s{background:color-mix(in srgb,var(--c) 35%,transparent)}
.meter .m{background:var(--c)}
.lc-modes{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.lc-modes a{padding:10px 0;text-align:center;font-size:1.1rem}
.lc-modes a:hover{background:var(--surface2)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.legend div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.92rem}
.legend b{display:block;margin-bottom:4px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:.9rem;min-width:200px}
.badge span{font-size:1.5rem}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge small{display:block;color:var(--muted)}
footer.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:.85rem}
footer.foot button{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted)}

/* level page */
.back{display:inline-block;color:var(--muted);margin-bottom:10px;font-weight:600}
.lvhead{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.lvhead .lcl{width:62px;height:62px;font-size:1.4rem;background:var(--c)}
.lvhead h1{font-size:1.3rem}
.lvhead p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.lvhead .grow{flex:1;min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.tab{flex:none;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:650;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#stage{margin-top:12px}

/* chips */
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface2);border:1px solid var(--line);margin:2px 4px 2px 0}
.c-formal{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.c-neutral{background:var(--surface2);color:var(--muted)}
.c-informal{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.c-yes{background:var(--good-soft);color:var(--good);border-color:transparent}
.c-careful{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.c-no{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.lvtag{font-size:.72rem;font-weight:800;padding:1px 7px;border-radius:6px;color:#fff;margin-left:6px;vertical-align:middle}

/* browse */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.filters input,.filters select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.count{color:var(--muted);font-size:.88rem;margin:10px 2px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.rh{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;justify-content:space-between}
.rt{min-width:0}
.ph{font-weight:750;font-size:1.04rem}
.rm{color:var(--muted);font-size:.9rem}
.rb{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.dt{padding:2px 16px 16px;border-top:1px dashed var(--line)}
.dt .def{margin-top:10px}
.dt ul{margin:10px 0;padding-left:20px}
.dt li{margin:5px 0}
mark{background:var(--accent-soft);color:var(--accent);padding:0 3px;border-radius:5px;font-weight:700}
.ielts{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:.92rem}
.ielts.yes{background:var(--good-soft)}
.ielts.careful{background:var(--warn-soft)}
.ielts.no{background:var(--bad-soft)}
#more{width:100%;margin-top:6px}

/* progress bar in games */
.prog{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:650;font-size:.9rem;margin-bottom:12px}
.pb{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.q{font-size:1.2rem;font-weight:650;margin:0 0 16px}
.sent{font-size:1.15rem;margin:0 0 6px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:800}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:52px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:550;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:14px;border-radius:14px;background:var(--surface2);font-size:.95rem}
.fb.ok{background:var(--good-soft)}
.fb.ko{background:var(--bad-soft)}
.hud{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.combo{font-weight:800;color:var(--warn)}
.hearts{letter-spacing:2px}

/* flashcards */
.fc{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;padding:26px 20px}
.fc .big{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.fc .hintline{color:var(--muted);margin-top:14px;font-size:.9rem}
.fc.bk{align-items:stretch;text-align:left;justify-content:flex-start;cursor:default}
.fc.back .big{font-size:1.5rem}
.fc .dt{border:0;padding:0}

/* fill */
.fill{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.fill input{flex:1;min-width:200px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:1.05rem}
.fill input:focus{border-color:var(--accent);outline:none}
.hintbox{margin-top:10px;font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--muted);min-height:1.5em}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.mcol{display:grid;gap:10px;align-content:start}
.mt{min-height:56px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:550;font-size:.95rem;width:100%}
.mt:hover:not(:disabled){border-color:var(--accent)}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--good);background:var(--good-soft);opacity:.55}
.mt.bad{animation:shake .3s;border-color:var(--bad)}

/* judge */
.jbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.jb{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.jb small{font-weight:500;color:var(--muted);font-size:.75rem}
.jb:hover:not(:disabled){border-color:var(--accent)}
.jb.right{border-color:var(--good);background:var(--good-soft)}
.jb.wrong{border-color:var(--bad);background:var(--bad-soft)}
.jb:disabled{cursor:default}

/* result */
.result{text-align:center;padding:30px 20px}
.stars{font-size:2.2rem;letter-spacing:6px}
.result .big{font-size:3rem;font-weight:850;margin:6px 0}
.xpgain{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:999px;padding:4px 16px}
.result .actions{justify-content:center}
#review{text-align:left;margin-top:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:650;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
.empty{text-align:center;color:var(--muted);padding:30px}

@media (max-width:700px){
  .hero{grid-template-columns:1fr;padding:20px}
  .ring{margin:0 auto}
  .filters{grid-template-columns:1fr 1fr}
  .filters input{grid-column:1/-1}
  .rh{align-items:flex-start;flex-direction:column}
  .rb{justify-content:flex-start}
  .mgrid{gap:8px}
  .jbtns{grid-template-columns:1fr}
  .jb{flex-direction:row;gap:10px;min-height:54px}
  .stats .pill.hide-s{display:none}
  .lvhead{flex-wrap:wrap}
}
@media (max-width:480px){
  .brand .bt{display:none}
  .stats{gap:6px}
  .pill{padding:4px 9px;font-size:.84rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><i>🎯</i> <span class="bt">PhraseQuest</span></a>
  <div class="stats">
    <span class="pill" id="st-streak" title="Day streak">🔥 0</span>
    <span class="pill" id="st-xp" title="Total XP">⭐ 0 XP</span>
    <span class="pill hide-s" id="st-lv" title="Player level">Lv 1</span>
    <button class="ico" id="btn-sound" aria-label="Toggle sound" title="Sound">🔊</button>
    <button class="ico" id="btn-theme" aria-label="Toggle dark mode" title="Light / dark">🌓</button>
  </div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script>
const DATA = {"A1":[{"p":"as well","m":"also; too","d":"Adverb phrase meaning 'in addition'; usually placed at the end of a clause.","ex":["I like tea, and I like coffee as well.","She speaks English and French as well."],"key":"as well","syn":["too","also","in addition"],"reg":"neutral","ielts":"yes","note":"Fine in essays; 'also' or 'in addition' sound more formal."},{"p":"I am Spanish/a teacher, etc.","m":"Pattern for saying your nationality or job.","d":"Pattern 'I am + nationality/job' used to say who you are or what you do.","ex":["I am Spanish and I live in Madrid.","I am a teacher at a small school."],"key":"I am Spanish","syn":["I work as a teacher","My job is teaching"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking Part 1 to introduce yourself; not for essays."},{"p":"there is/there are/there was, etc.","m":"Pattern for saying that something exists or is present.","d":"Structure 'there + be' used to say something exists; the verb agrees with the noun that follows.","ex":["There is a park near my house.","There are three books on the table."],"key":"There is a park","syn":["there exists","one can find"],"reg":"neutral","ielts":"yes","note":"Common in Task 1 descriptions; check singular and plural agreement."},{"p":"be called sth","m":"to have a certain name","d":"Verb phrase meaning to have a particular name; pattern: be called + name.","ex":["My dog is called Max.","The small town is called Oakville."],"key":"is called Max","syn":["be named","be known as"],"reg":"neutral","ielts":"yes","note":"Good for naming things in Speaking; 'known as' is better in essays."},{"p":"of course","m":"yes, certainly; as you would expect","d":"Adverb phrase used to agree strongly or to say something is obvious.","ex":["Of course you can sit here.","Of course I remember your name."],"key":"Of course","syn":["certainly","naturally","sure"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; in essays use sparingly as it can sound too casual."},{"p":"do the cleaning/cooking, etc.","m":"Pattern for doing a household job.","d":"Pattern 'do the + noun/-ing' used for household jobs and routine tasks.","ex":["I do the cooking on Sundays.","My brother does the cleaning every Friday."],"key":"do the cooking","syn":["take care of the cooking","handle the chores"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking about home and chores; rare in essays."},{"p":"what does sb do?","m":"A question asking about someone's job.","d":"Question used to ask about a person's job; answer with 'He/She is a...'.","ex":["What does your father do?","What does she do in the evening?"],"key":"What does your father do?","syn":["What is his job?","What is your job?"],"reg":"neutral","ielts":"no","note":"Spoken question; the examiner may ask it in Speaking Part 1."},{"p":"for example","m":"used to give one case that shows what you mean","d":"Linking phrase introducing an example; usually followed by a comma and a clause or noun phrase.","ex":["Many fruits are healthy, for example apples and oranges.","I like sports. For example, I play tennis."],"key":"for example","syn":["for instance","such as","e.g."],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 to support ideas; vary with 'for instance'."},{"p":"Excuse me","m":"polite words to get someone's attention or say sorry","d":"Polite expression used to get attention, ask someone to move, or interrupt.","ex":["Excuse me, where is the station?","Excuse me, is this seat free?"],"key":"Excuse me","syn":["Pardon me","Sorry to bother you"],"reg":"neutral","ielts":"no","note":"Spoken politeness phrase; never use it in essays."},{"p":"Don't forget...","m":"Remember to do something.","d":"Imperative reminder followed by a noun or a to-infinitive.","ex":["Don't forget your keys.","Don't forget to call your mother."],"key":"Don't forget","syn":["Remember to","Make sure you"],"reg":"informal","ielts":"no","note":"Fine in friend letters in General Training Task 1; avoid in essays."},{"p":"get here/there/home/to work, etc.","m":"to arrive at a place","d":"Phrasal pattern 'get + place' meaning to arrive at or reach a place.","ex":["I get home at six o'clock.","What time do you get to work?"],"key":"get home","syn":["arrive","reach"],"reg":"neutral","ielts":"careful","note":"Good for Speaking about daily routine; use 'arrive' in formal writing."},{"p":"get a bus/train/taxi, etc.","m":"to take a vehicle to travel","d":"Informal pattern 'get + vehicle' meaning to take public transport or a taxi.","ex":["I get a bus to school every day.","Let's get a taxi to the airport."],"key":"get a bus","syn":["take a bus","catch a bus","use a bus"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; use 'take' or 'use' in formal writing."},{"p":"go shopping","m":"to go to shops to buy things","d":"Verb phrase meaning to visit shops to buy things; 'go + -ing' pattern.","ex":["We go shopping on Saturdays.","She went shopping with her friend yesterday."],"key":"go shopping","syn":["do some shopping","shop"],"reg":"neutral","ielts":"careful","note":"Good for Speaking about hobbies; 'shop' or 'purchase' suit essays."},{"p":"good for you","m":"well done; I am happy about your success","d":"Informal comment showing approval of someone's success or choice.","ex":["You passed the test? Good for you!","Good for you, you won the race."],"key":"Good for you","syn":["well done","congratulations"],"reg":"informal","ielts":"no","note":"Spoken reaction only; avoid in essays."},{"p":"half past one/two/three, etc.","m":"thirty minutes after the hour","d":"Time expression meaning thirty minutes after a stated hour.","ex":["The lesson starts at half past two.","It is half past one now."],"key":"half past two","syn":["one-thirty","two-thirty"],"reg":"neutral","ielts":"no","note":"Useful for telling time in Speaking; not needed in essays."},{"p":"Happy Birthday/New Year, etc.","m":"words you say on a special day","d":"Greeting used to wish someone well on a celebration.","ex":["Happy Birthday, Anna!","Happy New Year to you and your family."],"key":"Happy Birthday","syn":["Many happy returns","Best wishes"],"reg":"informal","ielts":"no","note":"Only for friend letters in General Training Task 1."},{"p":"How are you?","m":"A question asking if someone is well.","d":"Common greeting asking about someone's health or feelings.","ex":["Hello, Tom! How are you?","How are you today, Mrs Brown?"],"key":"How are you?","syn":["How do you do?","How are things?"],"reg":"neutral","ielts":"no","note":"Greeting; use in Speaking opening or friend letters, never essays."},{"p":"last week/year/Monday, etc.","m":"in the week, year or day before this one","d":"Time expression referring to the most recent past period; used with past tenses.","ex":["I visited my aunt last week.","We moved to this city last year."],"key":"last week","syn":["the previous week","a week ago"],"reg":"neutral","ielts":"careful","note":"Use with past tenses in Speaking; in Task 1 use dates instead."},{"p":"last night","m":"in the evening or night before today","d":"Time expression meaning the night before today; used with past tenses.","ex":["I watched a film last night.","She slept badly last night."],"key":"last night","syn":["yesterday evening","the previous night"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking stories; avoid vague time words in essays."},{"p":"see you later","m":"goodbye; we will meet again soon","d":"Informal farewell used when you expect to meet again the same day.","ex":["I have to go now. See you later!","Bye, see you later."],"key":"See you later","syn":["see you soon","catch you later"],"reg":"informal","ielts":"no","note":"Spoken goodbye; fine in friend letters, not in essays."},{"p":"would like sth/to do sth","m":"polite way to say you want something","d":"Polite structure expressing a wish; followed by a noun or a to-infinitive.","ex":["I would like a cup of tea.","She would like to visit Japan."],"key":"would like a cup of tea","syn":["want","wish for","would love"],"reg":"neutral","ielts":"careful","note":"Good in Speaking and polite letters; not for formal essay claims."},{"p":"Would you like...?","m":"A polite question offering something.","d":"Polite question used to offer something or invite someone; followed by a noun or to-infinitive.","ex":["Would you like some water?","Would you like to come to my party?"],"key":"Would you like some water?","syn":["Do you want...?","How about...?"],"reg":"neutral","ielts":"no","note":"Spoken offer; useful in General Training letters of invitation."},{"p":"live in/at, etc.","m":"to have your home in a place","d":"Verb pattern 'live + preposition + place' meaning to have your home somewhere.","ex":["I live in a small village.","He lives at 25 Park Road."],"key":"live in a small village","syn":["reside in","stay in"],"reg":"neutral","ielts":"yes","note":"Basic and safe; 'reside' is more formal. Use 'in' for towns, 'at' for addresses."},{"p":"a lot/lots","m":"a large amount or number","d":"Informal quantifier meaning many or much; 'lots of' is followed by a noun.","ex":["We have a lot of homework today.","There are lots of people in the park."],"key":"a lot of homework","syn":["many","plenty","much"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; use 'a great deal of' or 'many' in essays."},{"p":"a lot","m":"very much; often","d":"Adverb phrase meaning to a great degree or very often; placed after the verb.","ex":["I like music a lot.","He travels a lot for his job."],"key":"a lot","syn":["very much","often","frequently"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; prefer 'considerably' or 'frequently' in essays."},{"p":"how many","m":"asking about the number of things","d":"Question phrase used with plural countable nouns to ask for a number.","ex":["How many brothers do you have?","How many books are on the shelf?"],"key":"How many brothers","syn":["what number of","how much (for uncountable)"],"reg":"neutral","ielts":"careful","note":"Used in questions; only in essays as an indirect question or rhetorical one."},{"p":"more beautiful/difficult/easily, etc.","m":"Pattern for comparing long adjectives and adverbs.","d":"Comparative pattern 'more + adjective/adverb', used with longer words, often followed by 'than'.","ex":["This city is more beautiful than my town.","She speaks English more easily than me."],"key":"more beautiful","syn":["increasingly beautiful","greater in beauty"],"reg":"neutral","ielts":"yes","note":"Essential for comparisons in Task 1 and Task 2; use 'more...than'."},{"p":"in the morning","m":"during the early part of the day","d":"Time phrase meaning during the part of the day before noon.","ex":["I drink coffee in the morning.","The shop opens in the morning."],"key":"in the morning","syn":["before noon","during the morning"],"reg":"neutral","ielts":"careful","note":"Good for daily routines in Speaking Part 1."},{"p":"very much","m":"to a great degree; a lot","d":"Adverb phrase used after a verb to show a high degree.","ex":["I like this song very much.","Thank you very much."],"key":"very much","syn":["a lot","greatly","really"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; use 'greatly' or 'considerably' in formal essays."},{"p":"need to do sth","m":"must do something because it is necessary","d":"Verb pattern 'need + to-infinitive' showing that an action is necessary.","ex":["I need to buy some milk.","You need to study for the exam."],"key":"need to buy","syn":["have to","must","be required to"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 for recommendations, e.g. 'Governments need to act'."},{"p":"next week/year/Monday, etc.","m":"in the week, year or day after this one","d":"Time expression referring to the coming period; often used with future forms.","ex":["We are going to the beach next week.","My exam is next Monday."],"key":"next week","syn":["the following week","in a week's time"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking and letters; avoid vague time words in essays."},{"p":"the present","m":"now; the time that is happening at this moment","d":"Noun phrase meaning the current time, as opposed to past or future.","ex":["Let's not think about the past, only the present.","At the present, I am very busy."],"key":"the present","syn":["now","the current time"],"reg":"neutral","ielts":"yes","note":"Useful for contrasting past, present and future in essays."},{"p":"put sth down/in/on, etc.","m":"to place something somewhere","d":"Phrasal pattern 'put + object + particle' meaning to place something in a position.","ex":["Please put your bag down.","She put the milk in the fridge."],"key":"put your bag down","syn":["place","set down","lay"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking; use 'place' or 'position' in formal writing."},{"p":"the radio","m":"a device or service for listening to programmes","d":"Noun phrase for broadcast audio; used with 'the' and the preposition 'on' for programmes.","ex":["I listen to the radio in the car.","I heard the news on the radio."],"key":"the radio","syn":["radio broadcasts","the wireless"],"reg":"neutral","ielts":"yes","note":"Useful in media topics; compare radio with TV and the internet."},{"p":"it rains/it is raining","m":"water is falling from the sky","d":"Weather expressions: 'it rains' for general facts, 'it is raining' for now.","ex":["It rains a lot in spring here.","Take an umbrella because it is raining."],"key":"It rains","syn":["rain falls","it pours"],"reg":"neutral","ielts":"careful","note":"Good for weather topics in Speaking; Task 1 uses 'rainfall' instead."},{"p":"the same","m":"not different; equal in every way","d":"Phrase meaning identical; often followed by 'as' or used alone.","ex":["We have the same teacher.","My bag is the same as yours."],"key":"the same","syn":["identical","alike","equal"],"reg":"neutral","ielts":"yes","note":"Useful for comparisons; 'the same as' is common in Task 1."},{"p":"see you","m":"goodbye; we will meet again","d":"Informal farewell said when leaving someone.","ex":["Bye, see you!","I have to go. See you!"],"key":"see you","syn":["bye","see you later"],"reg":"informal","ielts":"no","note":"Spoken goodbye only; never in essays."},{"p":"see you later/soon/tomorrow, etc.","m":"goodbye; we will meet again at a stated time","d":"Informal farewell pattern 'see you + time' used when you expect to meet again.","ex":["Goodbye, see you tomorrow!","See you soon, Anna."],"key":"see you tomorrow","syn":["bye for now","talk to you later"],"reg":"informal","ielts":"no","note":"Fine at the end of friend letters in General Training Task 1."},{"p":"see you soon","m":"goodbye; we will meet again before long","d":"Informal farewell used when you expect to meet again in a short time.","ex":["Thanks for the visit. See you soon!","I will call you next week. See you soon."],"key":"See you soon","syn":["until next time","see you later"],"reg":"informal","ielts":"no","note":"Good closing for a friend letter in General Training Task 1."},{"p":"take a picture/photo(graph)","m":"to use a camera to make an image","d":"Verb phrase meaning to make an image with a camera; often followed by 'of'.","ex":["I want to take a picture of the lake.","He took a photo of his dog."],"key":"take a picture","syn":["snap a photo","photograph"],"reg":"neutral","ielts":"careful","note":"Good for Speaking about hobbies; 'photograph' suits formal writing."},{"p":"There is/are/was, etc.","m":"Pattern for saying something exists or is present.","d":"Structure 'there + be' used to say that something exists; the verb agrees with the noun.","ex":["There are two cats in the garden.","There was a big storm last night."],"key":"There are two cats","syn":["there exists","one can find"],"reg":"neutral","ielts":"yes","note":"Common in Task 1 descriptions; use 'there was/were' for past data."},{"p":"too small/hard/much, etc.","m":"more than is needed or wanted","d":"Pattern 'too + adjective/adverb' showing something is more than is good or possible.","ex":["This coat is too small for me.","The test was too hard for the children."],"key":"too small","syn":["excessively","overly","more than enough"],"reg":"neutral","ielts":"yes","note":"Useful for problems in Task 2; use 'too...to' or 'excessively'."},{"p":"not very good/tall/happy, etc.","m":"Pattern meaning a little bad, short or sad.","d":"Pattern 'not very + adjective' used to say something has a low degree of a quality.","ex":["My English is not very good.","He is not very happy today."],"key":"not very good","syn":["rather poor","quite weak","not particularly good"],"reg":"neutral","ielts":"careful","note":"Softens a negative opinion; in essays 'not particularly' is better."},{"p":"Well done!","m":"A phrase praising someone's good work.","d":"Exclamation used to praise someone for success or effort.","ex":["You won the game. Well done!","Well done, you passed your exam."],"key":"Well done!","syn":["Good job","Congratulations"],"reg":"informal","ielts":"no","note":"Spoken praise; fine in friend letters, not in essays."},{"p":"Don't worry (about sth)","m":"Do not feel anxious about something.","d":"Imperative reassuring someone; 'about' introduces the thing that is a problem.","ex":["Don't worry about the test.","Don't worry, I will help you."],"key":"Don't worry about the test","syn":["Never mind","No need to worry"],"reg":"informal","ielts":"no","note":"Good for reassuring a friend in General Training letters only."},{"p":"Would you like ...?","m":"A polite question offering something.","d":"Polite question used to offer something or invite someone; followed by a noun or to-infinitive.","ex":["Would you like a sandwich?","Would you like to join us for dinner?"],"key":"Would you like a sandwich?","syn":["Do you want...?","Can I offer you...?"],"reg":"neutral","ielts":"no","note":"Spoken offer; useful in invitation letters in General Training Task 1."},{"p":"be ... years old","m":"Pattern for saying how old someone is.","d":"Pattern 'be + number + years old' used to state a person's age.","ex":["My sister is ten years old.","I am twenty years old."],"key":"is ten years old","syn":["be aged ten","be ten"],"reg":"neutral","ielts":"careful","note":"Good for Speaking Part 1; use 'aged' in formal writing."}],"A2":[{"p":"be able to do sth","m":"to have the ability or chance to do something","d":"Used with an infinitive to say that someone can do something or has the chance to do it.","ex":["She will be able to drive next year.","I was able to finish my homework early."],"key":"be able to drive","syn":["can","be capable of doing","manage to do"],"reg":"neutral","ielts":"yes","note":"Useful in all tenses where 'can' is not possible, e.g. future."},{"p":"How/What about ...?","m":"used to make a suggestion or ask for an opinion","d":"Used followed by a noun or -ing form to suggest something or ask what someone thinks.","ex":["How about going to the cinema tonight?","What about this blue shirt?"],"key":"How about going","syn":["Why don't we...?","Shall we...?","What do you think of...?"],"reg":"informal","ielts":"no","note":"Spoken only; good in Speaking Part 3, avoid in essays."},{"p":"I'm afraid...","m":"used to politely say something unwelcome","d":"Used to introduce polite bad news, refusal or disagreement, often followed by a clause.","ex":["I'm afraid I can't come to your party.","I'm afraid the shop is closed today."],"key":"I'm afraid I can't","syn":["Unfortunately","I'm sorry but","Sadly"],"reg":"neutral","ielts":"careful","note":"Fine in polite letters and speaking; use 'unfortunately' in essays."},{"p":"all sorts of sth","m":"many different kinds of something","d":"Used before a plural or uncountable noun to mean many different types of it.","ex":["The market sells all sorts of fruit.","We talked about all sorts of things."],"key":"all sorts of fruit","syn":["all kinds of","many types of","a wide range of"],"reg":"informal","ielts":"careful","note":"Good in Speaking; in essays prefer 'a wide range of'."},{"p":"all the best","m":"a friendly way to wish someone good luck","d":"Used as a friendly goodbye or to end a letter, wishing someone good things.","ex":["Goodbye, and all the best for your new job!","All the best, Tom."],"key":"all the best","syn":["good luck","best wishes","take care"],"reg":"informal","ielts":"careful","note":"Fine to end informal letters to friends; not in essays."},{"p":"all the time","m":"always or very often","d":"Used as an adverbial phrase to mean continuously or very frequently.","ex":["My brother plays computer games all the time.","It rains here all the time in winter."],"key":"all the time","syn":["constantly","always","continually"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; in essays use 'constantly' or 'continually'."},{"p":"all over somewhere","m":"in every part of a place","d":"Used after a verb to mean in or across every part of a place.","ex":["People come from all over the world to see this city.","There were toys all over the floor."],"key":"all over the world","syn":["throughout","everywhere in","across"],"reg":"neutral","ielts":"yes","note":"'All over the world' works well in Task 2 introductions."},{"p":"that's all right","m":"used to say something is fine or to reply to thanks","d":"Used to reassure someone, accept an apology, or reply to thanks.","ex":["Sorry I'm late. - That's all right.","That's all right, I can wait."],"key":"That's all right","syn":["no problem","don't worry","it's fine"],"reg":"informal","ielts":"no","note":"Spoken reply only; useful in Speaking, not in essays."},{"p":"that's alright","m":"used to say something is fine or to reply to thanks","d":"A common variant spelling of 'that's all right', used to reassure or accept an apology.","ex":["Thanks for your help. - That's alright.","That's alright, don't worry about it."],"key":"That's alright","syn":["no problem","it's fine","don't worry"],"reg":"informal","ielts":"no","note":"Spoken only; 'all right' is the standard spelling in writing."},{"p":"and so on","m":"and other similar things","d":"Used at the end of a list to show that there are more similar items.","ex":["We learn English, maths, history and so on.","He sells shoes, bags, hats and so on."],"key":"and so on","syn":["and so forth","and the like","et cetera"],"reg":"neutral","ielts":"careful","note":"Acceptable in essays, but better to give full examples."},{"p":"any more","m":"not now; not still","d":"Used in negative sentences and questions to mean no longer or not now.","ex":["I don't live in London any more.","Do you play the piano any more?"],"key":"any more","syn":["any longer","no longer","not now"],"reg":"neutral","ielts":"yes","note":"Use in negatives; 'no longer' is more formal for essays."},{"p":"as well as","m":"and also; in addition to","d":"Used to add another person or thing, followed by a noun or -ing form.","ex":["She speaks French as well as English.","He plays football as well as tennis."],"key":"as well as","syn":["in addition to","and also","besides"],"reg":"neutral","ielts":"yes","note":"Useful linking phrase in Task 2; follow with noun or -ing."},{"p":"possible","m":"able to happen or be done","d":"Adjective describing something that can happen or can be done; often used after 'as' in 'as soon/much as possible'.","ex":["It is possible to travel there by train.","Please come as early as possible."],"key":"possible","syn":["feasible","achievable","likely"],"reg":"neutral","ielts":"yes","note":"Common in essays: 'it is possible to...' for cautious claims."},{"p":"as usual","m":"in the normal way; as it often happens","d":"Used to say that something happens in the same way as it normally does.","ex":["As usual, he was late for school.","She had tea and toast as usual."],"key":"As usual","syn":["as always","as normal","as ever"],"reg":"neutral","ielts":"careful","note":"Better in speaking or letters than in formal essays."},{"p":"a sales/shop assistant","m":"a person who works in a shop and helps customers","d":"A noun phrase for someone employed in a shop to serve customers.","ex":["My sister works as a shop assistant.","The sales assistant showed me some shoes."],"key":"a shop assistant","syn":["salesperson","shop worker","sales clerk"],"reg":"neutral","ielts":"yes","note":"Useful in Speaking Part 1 about jobs; fine in Task 1 job letters."},{"p":"at least","m":"not less than; the minimum","d":"Used before a number or amount to show the smallest possible amount, or to mention a good point.","ex":["You should drink at least two litres of water a day.","It is raining, but at least it is warm."],"key":"at least two litres","syn":["no fewer than","a minimum of","not less than"],"reg":"neutral","ielts":"yes","note":"Good for numbers in Task 1 and for advice in Task 2."},{"p":"the back","m":"the part of something that is behind","d":"The rear part of a place, vehicle or object, opposite the front.","ex":["The garden is at the back of the house.","I sat at the back of the bus."],"key":"the back of the house","syn":["the rear","the far end","the end"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 maps and layouts: 'at the back of'."},{"p":"be bad for sb/sth","m":"to cause harm to a person or thing","d":"Used with a person or thing as object to say that something harms them.","ex":["Smoking is bad for your health.","Too much sugar is bad for your teeth."],"key":"is bad for your health","syn":["harm","damage","be harmful to"],"reg":"neutral","ielts":"yes","note":"Common in Task 2; 'harmful to' sounds more academic."},{"p":"have/has been to","m":"to have visited a place and come back","d":"Used in the present perfect to say someone has visited a place at some time in their life.","ex":["I have been to Spain twice.","She has been to the new museum."],"key":"have been to Spain","syn":["have visited","have gone to and returned","have travelled to"],"reg":"neutral","ielts":"yes","note":"Useful in Speaking Part 1 and 2 for travel experiences."},{"p":"etc.","m":"and other similar things","d":"Short for 'et cetera'; used at the end of a list to show there are more items.","ex":["I bought apples, bananas, grapes, etc.","The shop sells pens, pencils, paper, etc."],"key":"etc.","syn":["and so on","and so forth","and the like"],"reg":"neutral","ielts":"careful","note":"Avoid overusing in essays; give clear examples instead."},{"p":"best wishes","m":"a polite way to end a letter or card","d":"Used as a friendly closing in letters, cards and emails to wish someone well.","ex":["Best wishes for your birthday!","Best wishes, Anna"],"key":"Best wishes","syn":["kind regards","all the best","warm wishes"],"reg":"neutral","ielts":"yes","note":"Good ending for semi-formal General Training Task 1 letters."},{"p":"I/you/he, etc. had better do sth","m":"it is a good idea to do something","d":"Used with a bare infinitive to give strong advice or a warning.","ex":["You had better take an umbrella.","We had better leave now."],"key":"had better take","syn":["should","ought to","it would be wise to"],"reg":"neutral","ielts":"careful","note":"Fine in informal letters; use 'should' in essays."},{"p":"your big brother/sister","m":"your older brother or sister","d":"An informal phrase for a brother or sister who is older than you.","ex":["My big brother helps me with maths.","Her big sister lives in Canada."],"key":"My big brother","syn":["older brother","elder sister","older sibling"],"reg":"informal","ielts":"careful","note":"Fine in Speaking about family; use 'older' in writing."},{"p":"a bit","m":"a small amount; slightly","d":"Used before an adjective, comparative or verb to mean slightly or to a small degree.","ex":["I am a bit tired today.","Can you speak a bit louder?"],"key":"a bit tired","syn":["slightly","a little","somewhat"],"reg":"informal","ielts":"careful","note":"Spoken style; use 'slightly' or 'somewhat' in essays."},{"p":"be born","m":"to start life; to come into the world","d":"Passive verb used to say when or where someone's life began.","ex":["I was born in a small town.","My sister was born in 2010."],"key":"was born","syn":["come into the world","enter the world","first see the light of day"],"reg":"neutral","ielts":"yes","note":"Always passive; common in Speaking Part 1 and Part 2."},{"p":"break your arm/leg, etc.","m":"to hurt your arm or leg so a bone cracks","d":"To injure a part of the body so that a bone is cracked or split.","ex":["He fell off his bike and broke his leg.","She broke her arm playing tennis."],"key":"broke his leg","syn":["fracture","injure","snap"],"reg":"neutral","ielts":"careful","note":"Useful for health stories in Speaking; 'fracture' is more formal."},{"p":"a broken arm/leg, etc.","m":"an arm or leg with a cracked bone","d":"Used to describe a body part that has a cracked or split bone.","ex":["He cannot play football with a broken leg.","She went to hospital with a broken arm."],"key":"a broken leg","syn":["a fractured limb","an injured leg","a fracture"],"reg":"neutral","ielts":"careful","note":"Fine in Speaking about accidents; not typical in essays."},{"p":"by the way","m":"used to add a new or extra topic","d":"Used to introduce a comment or question that is not directly connected to the main topic.","ex":["By the way, did you see Tom yesterday?","The film was good. By the way, I have your keys."],"key":"By the way","syn":["incidentally","as an aside","speaking of which"],"reg":"informal","ielts":"no","note":"Spoken and informal letters only; avoid in essays."},{"p":"Take care!","m":"a friendly goodbye wishing someone safety","d":"Used when saying goodbye to tell someone to look after themselves.","ex":["Bye, take care!","Take care! See you next week."],"key":"take care","syn":["look after yourself","stay safe","all the best"],"reg":"informal","ielts":"no","note":"Friendly closing for letters to friends; never in essays."},{"p":"a change of clothes","m":"extra clothes to wear instead of the ones you have on","d":"A set of spare clothes that you can put on after you take off wet or dirty ones.","ex":["Bring a change of clothes for the trip.","He had a change of clothes in his bag."],"key":"a change of clothes","syn":["spare clothes","extra clothes","fresh clothes"],"reg":"neutral","ielts":"careful","note":"Useful for travel and sports topics in Speaking."},{"p":"hot chocolate","m":"a sweet hot drink made with chocolate and milk","d":"A drink made by mixing chocolate powder with hot milk or water.","ex":["I like a cup of hot chocolate in winter.","She made hot chocolate for the children."],"key":"hot chocolate","syn":["cocoa","drinking chocolate","hot cocoa"],"reg":"neutral","ielts":"careful","note":"Good for Speaking topics on food and drink."},{"p":"classical music","m":"serious music from composers like Mozart or Bach","d":"Music in a traditional style, written by composers such as Mozart, played by orchestras and similar groups.","ex":["My father listens to classical music in the evening.","She plays classical music on the violin."],"key":"classical music","syn":["orchestral music","serious music","symphonic music"],"reg":"neutral","ielts":"yes","note":"Common in Speaking Part 1 music topics and arts essays."},{"p":"the country","m":"land away from cities, with farms and fields","d":"Areas outside towns and cities, with fields, farms and few buildings.","ex":["My grandparents live in the country.","I love walking in the country at weekends."],"key":"in the country","syn":["the countryside","rural areas","the rural area"],"reg":"neutral","ielts":"yes","note":"Useful in city versus country comparisons; 'countryside' is also common."},{"p":"of course not","m":"used to say 'no' very strongly","d":"Used to answer a question with a strong, obvious 'no'.","ex":["Do you mind if I sit here? - Of course not.","Of course not, I would never say that."],"key":"Of course not","syn":["certainly not","definitely not","not at all"],"reg":"informal","ielts":"no","note":"Spoken reply; use 'certainly not' only in speech."},{"p":"be crazy about sb/sth","m":"to like someone or something very much","d":"Used with a person or thing as object to mean love or be very enthusiastic about them.","ex":["My son is crazy about football.","She is crazy about her new puppy."],"key":"is crazy about football","syn":["be mad about","be passionate about","adore"],"reg":"informal","ielts":"no","note":"Good in Speaking for hobbies; use 'passionate about' in writing."},{"p":"these days","m":"at the present time; now","d":"Used as an adverbial phrase to talk about the present time, compared with the past.","ex":["These days, many people shop online.","I don't watch TV much these days."],"key":"These days","syn":["nowadays","currently","at present"],"reg":"neutral","ielts":"careful","note":"Okay in Task 2 introductions; 'nowadays' or 'currently' is safer."},{"p":"one day","m":"at some time in the future or past","d":"Used to refer to an unspecified time in the future, or to a single day in the past.","ex":["I want to visit Japan one day.","One day, a stranger knocked on our door."],"key":"one day","syn":["someday","at some point","some time"],"reg":"neutral","ielts":"yes","note":"Good for Speaking Part 2 stories and future plans."},{"p":"Oh dear!","m":"used when you are sad, worried or surprised","d":"An exclamation expressing mild worry, sadness or surprise.","ex":["Oh dear! I forgot my keys.","Oh dear, you look very tired."],"key":"Oh dear","syn":["oh no","goodness","dear me"],"reg":"informal","ielts":"no","note":"Spoken exclamation only; do not use in essays."},{"p":"the dishes","m":"the plates, cups and bowls to be washed after a meal","d":"Used with 'do' or 'wash' to mean cleaning the plates and cups after eating.","ex":["I do the dishes after dinner.","Can you help me wash the dishes?"],"key":"do the dishes","syn":["the washing-up","the plates and cups","the crockery"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking about housework; avoid in academic essays."},{"p":"she?/does she?, etc.","m":"a short question added to a sentence to check or show interest","d":"A question tag or short reply question that uses an auxiliary verb and pronoun, with opposite meaning to the main verb.","ex":["She likes tea, doesn't she?","You don't live here, do you?"],"key":"doesn't she","syn":["isn't it?","right?","don't you think?"],"reg":"informal","ielts":"no","note":"Spoken and informal letters only; avoid in essays."},{"p":"Do you mind ...?","m":"a polite way to ask permission or ask for help","d":"Used with 'if' plus a clause or with an -ing form to make a polite request.","ex":["Do you mind opening the window?","Do you mind if I sit here?"],"key":"Do you mind opening","syn":["Would you mind...?","Is it OK if...?","Could you...?"],"reg":"neutral","ielts":"careful","note":"Good for polite letter requests and Speaking role-play."},{"p":"each other","m":"used when two or more people do the same to one another","d":"A reciprocal pronoun used when each person does something to the other or others.","ex":["They help each other with homework.","We write to each other every week."],"key":"each other","syn":["one another","mutually","reciprocally"],"reg":"neutral","ielts":"yes","note":"Useful for relationships topics; no 'to' needed after 'help'."},{"p":"the east","m":"the direction where the sun rises","d":"The direction or region on the right when you face north; the part of a place in that direction.","ex":["The sun rises in the east.","The town is in the east of the country."],"key":"in the east","syn":["the eastern part","eastward","the orient"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 1 maps and describing locations."},{"p":"Excuse me","m":"a polite way to get someone's attention or say sorry","d":"Used to politely get attention, ask to pass, or apologise for a small mistake.","ex":["Excuse me, where is the station?","Excuse me, I need to get past."],"key":"Excuse me","syn":["pardon me","sorry to bother you","pardon"],"reg":"neutral","ielts":"no","note":"Spoken use; good in Speaking role-play, not in essays."},{"p":"a few","m":"a small number of","d":"Used before a plural countable noun to mean some, a small but useful number.","ex":["I have a few friends in London.","We waited for a few minutes."],"key":"a few friends","syn":["some","several","a small number of"],"reg":"neutral","ielts":"yes","note":"Positive meaning; 'few' without 'a' means almost none."},{"p":"quite a few","m":"a fairly large number","d":"Used before a plural noun to mean more than a few; a fairly large number.","ex":["Quite a few students came late.","I have quite a few books about history."],"key":"Quite a few students","syn":["a number of","several","a good many"],"reg":"neutral","ielts":"careful","note":"A bit informal; 'a number of' suits essays better."},{"p":"first of all","m":"as the first thing; before anything else","d":"Used to introduce the first point or step in a series.","ex":["First of all, let me say thank you.","First of all, you need to open the box."],"key":"First of all","syn":["firstly","to begin with","in the first place"],"reg":"neutral","ielts":"yes","note":"Good opening link in Task 2 body paragraphs."},{"p":"follow a road/path, etc.","m":"to go along a road or path","d":"To walk, drive or travel along a road or path in the direction it goes.","ex":["Follow this road for two kilometres.","We followed the path through the forest."],"key":"Follow this road","syn":["go along","keep to","take"],"reg":"neutral","ielts":"yes","note":"Useful for giving directions or describing maps in Task 1."},{"p":"on foot","m":"by walking","d":"Used as an adverbial phrase to say that someone travels by walking, not by vehicle.","ex":["We went to school on foot.","It takes ten minutes on foot."],"key":"on foot","syn":["by walking","walking","by foot"],"reg":"neutral","ielts":"yes","note":"Useful in transport charts and essays about travel to work."},{"p":"for sale","m":"available to buy","d":"Used after 'be' or before a noun to say that something is offered to buyers.","ex":["The house next door is for sale.","He has a car for sale."],"key":"is for sale","syn":["on the market","available","up for sale"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 letters about property or goods."},{"p":"the front","m":"the part that faces forward or is first","d":"The side or part of something that faces forward, opposite the back.","ex":["The main door is at the front of the building.","She sat at the front of the class."],"key":"the front of the building","syn":["the face","the forward part","the facade"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 maps and plans: 'at the front of'."},{"p":"in front of sth/sb","m":"before or facing something, not behind it","d":"A preposition meaning in a position ahead of or facing someone or something.","ex":["There is a tree in front of the school.","He stood in front of the mirror."],"key":"in front of the school","syn":["before","ahead of","opposite"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 maps for describing positions."},{"p":"the future","m":"the time that will come after now","d":"The time after the present, or what will happen then.","ex":["I want to be a doctor in the future.","Nobody knows what the future will bring."],"key":"in the future","syn":["the days ahead","what lies ahead","tomorrow"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 conclusions: 'in the future'."},{"p":"get married","m":"to become husband and wife","d":"To legally or officially become someone's husband or wife; often followed by 'to' plus a person.","ex":["They got married last summer.","My sister wants to get married in Italy."],"key":"got married","syn":["marry","tie the knot","wed"],"reg":"neutral","ielts":"yes","note":"Common in Speaking about family; 'marry' needs no 'to'."},{"p":"give sb a call/ring","m":"to telephone someone","d":"To phone someone; the person is placed between 'give' and 'a call'.","ex":["I will give you a call tomorrow.","Give me a ring when you arrive."],"key":"give you a call","syn":["phone","call","telephone"],"reg":"informal","ielts":"careful","note":"Fine in informal letters; use 'contact' in formal writing."},{"p":"give a party","m":"to hold a party for guests","d":"To organise and host a party at your home or another place.","ex":["We are going to give a party on Saturday.","She gave a party for her birthday."],"key":"give a party","syn":["throw a party","hold a party","host a party"],"reg":"neutral","ielts":"careful","note":"'Throw' or 'have' a party is more usual in speaking."},{"p":"go running/swimming, etc.","m":"to do an activity like running or swimming","d":"Used with an -ing verb to talk about doing a sport or activity.","ex":["I go running every morning.","We went swimming in the lake."],"key":"go running","syn":["do","take part in","enjoy"],"reg":"neutral","ielts":"yes","note":"Useful for hobbies and health in Speaking and essays."},{"p":"be going to do/be sth","m":"used to talk about plans or things that will happen","d":"Used with an infinitive to talk about future plans or things that seem sure to happen.","ex":["I am going to be a teacher.","It is going to rain soon."],"key":"am going to be","syn":["plan to","intend to","will"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; use 'will' or 'plan to' in formal essays."},{"p":"be going to do sth","m":"used to talk about plans or things that will happen","d":"Used with an infinitive to talk about future plans or things that seem sure to happen.","ex":["We are going to visit my aunt.","She is going to start a new job."],"key":"are going to visit","syn":["intend to","plan to","will"],"reg":"neutral","ielts":"careful","note":"Good in Speaking about plans; essays prefer 'will' or 'intend to'."},{"p":"go to the toilet","m":"to use the toilet","d":"A polite and common way to say that someone uses the toilet.","ex":["I need to go to the toilet.","He went to the toilet before the film."],"key":"go to the toilet","syn":["use the bathroom","use the restroom","use the loo"],"reg":"neutral","ielts":"no","note":"Not suitable for essays; fine in daily conversation."},{"p":"Guess what?","m":"used to start telling someone surprising news","d":"Used to introduce news that you think will surprise the listener.","ex":["Guess what? I passed my exam!","Guess what? We are moving to Spain."],"key":"Guess what","syn":["you won't believe this","listen to this","I have news"],"reg":"informal","ielts":"no","note":"Spoken and informal letters only; never in essays."},{"p":"happy to do sth","m":"glad or willing to do something","d":"Used with an infinitive to say that you are pleased or willing to do something.","ex":["I am happy to help you.","She was happy to answer questions."],"key":"am happy to help","syn":["glad to do","pleased to do","willing to do"],"reg":"neutral","ielts":"yes","note":"Good for polite requests in General Training letters."},{"p":"have (got) to do sth","m":"to must do something; to need to do something","d":"Used with an infinitive to say that something is necessary or required.","ex":["I have to get up early tomorrow.","She has got to finish her work."],"key":"have to get up","syn":["must","need to","be obliged to"],"reg":"neutral","ielts":"yes","note":"Use 'have to' for obligation in essays; 'have got to' is informal."},{"p":"have a rest/shower/walk, etc.","m":"to do a short, simple activity","d":"A common phrase with 'have' plus a noun, meaning to do a short activity.","ex":["I usually have a shower in the morning.","Let's have a rest for ten minutes."],"key":"have a shower","syn":["take a shower","take a break","go for a walk"],"reg":"neutral","ielts":"careful","note":"Good for Speaking about routines; avoid in academic essays."},{"p":"here you are/here it is, etc.","m":"used when you give someone something","d":"Used when handing something to someone or showing where something is.","ex":["Here you are, your coffee.","Here it is, on the table."],"key":"Here you are","syn":["there you go","this is for you","take this"],"reg":"informal","ielts":"no","note":"Spoken only; useful in everyday conversation."},{"p":"How about...?","m":"used to make a suggestion","d":"Used followed by a noun or -ing form to suggest something or ask someone's opinion.","ex":["How about a cup of tea?","How about meeting at six o'clock?"],"key":"How about a cup","syn":["What about...?","Why not...?","Shall we...?"],"reg":"informal","ielts":"no","note":"Spoken and informal letters only; avoid in essays."},{"p":"How do you do?","m":"a formal greeting used when first meeting someone","d":"A formal greeting said when meeting someone for the first time; the reply is the same words.","ex":["How do you do? I'm Mark Brown.","How do you do? Pleased to meet you."],"key":"How do you do","syn":["pleased to meet you","nice to meet you","good to meet you"],"reg":"formal","ielts":"no","note":"Old-fashioned greeting; 'Nice to meet you' is more natural now."},{"p":"if not","m":"used to say what happens in the other case","d":"Used to say what is true or what to do when a stated condition is not true.","ex":["Come to the party if you can. If not, call me.","Is it ready? If not, I will wait."],"key":"If not","syn":["otherwise","or else","failing that"],"reg":"neutral","ielts":"yes","note":"Useful for contrasts in Task 2: 'If not, ...'."},{"p":"if you like","m":"used to offer something or agree politely","d":"Used to offer a choice or to say you are happy to do what someone suggests.","ex":["We can go now if you like.","I can help you if you like."],"key":"if you like","syn":["if you want","if you prefer","if you wish"],"reg":"informal","ielts":"careful","note":"Fine in speaking and friendly letters; use 'if you wish' formally."},{"p":"in front of sb/sth","m":"before or facing someone or something, not behind it","d":"A preposition meaning in a position ahead of or facing someone or something.","ex":["The teacher stood in front of the class.","A car stopped in front of me."],"key":"in front of the class","syn":["before","ahead of","facing"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 maps and descriptions of positions."},{"p":"keep sth in/on, etc.","m":"to leave something in a place or on something","d":"Used with a noun and a preposition to mean to store or leave something in a certain place or position.","ex":["I keep my keys in my bag.","Keep your coat on, it is cold."],"key":"keep my keys in","syn":["store","leave","put away"],"reg":"neutral","ielts":"careful","note":"Everyday English; useful in Speaking about homes and habits."},{"p":"sb will kill sb","m":"used to say someone will be very angry with another person","d":"An informal exaggeration meaning that someone will be extremely angry with someone else.","ex":["My mum will kill me if I am late.","Dad will kill you when he sees the car."],"key":"will kill me","syn":["be furious with","be very angry with","be in big trouble"],"reg":"informal","ielts":"no","note":"Spoken exaggeration only; never use it in writing."},{"p":"all kinds of sth","m":"many different types of something","d":"Used before a noun to mean many different types of it.","ex":["The shop sells all kinds of cheese.","We saw all kinds of animals."],"key":"all kinds of cheese","syn":["all sorts of","various","many types of"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'various' or 'many types of' suits essays."},{"p":"let sb know","m":"to tell someone something","d":"To tell someone information, usually about a decision or a plan.","ex":["Please let me know your answer soon.","I will let you know when I arrive."],"key":"let me know","syn":["tell","inform","notify"],"reg":"neutral","ielts":"yes","note":"Useful in General Training letters: 'Please let me know...'."},{"p":"a little bit","m":"a small amount; slightly","d":"Used before an adjective or verb to mean slightly or to a small degree.","ex":["I am a little bit nervous.","Can you wait a little bit?"],"key":"a little bit nervous","syn":["slightly","a bit","somewhat"],"reg":"informal","ielts":"careful","note":"Speaking only; use 'slightly' in essays."},{"p":"look nice/strange, etc.","m":"to seem or appear nice or strange","d":"Used with an adjective after 'look' to describe how someone or something appears.","ex":["You look nice in that dress.","The house looks strange at night."],"key":"look nice","syn":["appear","seem","come across as"],"reg":"neutral","ielts":"yes","note":"Useful in descriptions; 'appear' or 'seem' sounds more formal."},{"p":"would love sth/to do sth","m":"to want something very much","d":"Used with a noun or an infinitive to say you would very much like something.","ex":["I would love a cup of tea.","We would love to visit your country."],"key":"would love a cup","syn":["would like","would enjoy","really want"],"reg":"informal","ielts":"careful","note":"Good in Speaking and friendly letters; use 'would like' formally."},{"p":"would love to (do sth)","m":"to want very much to do something","d":"Used with an infinitive to say you would very much like to do something, often to accept an invitation.","ex":["I would love to come to your party.","She would love to learn French."],"key":"would love to come","syn":["would like to","be keen to","be eager to"],"reg":"informal","ielts":"careful","note":"Great for accepting invitations in letters to friends."},{"p":"love/(with) love from/all my love/lots of love","m":"words used to end a letter to family or close friends","d":"Closing phrases used at the end of personal letters and messages to people you care about.","ex":["See you soon. Lots of love, Emma","With love from Dad"],"key":"Lots of love","syn":["best wishes","yours","take care"],"reg":"informal","ielts":"careful","note":"Only for General Training letters to close friends or family."},{"p":"be made from/(out) of sth","m":"to be produced using a material","d":"Used passively to say what material or materials something is produced from.","ex":["This table is made of wood.","Cheese is made from milk."],"key":"is made of wood","syn":["consist of","be produced from","be built from"],"reg":"neutral","ielts":"yes","note":"Use 'made of' for materials, 'made from' when changed."},{"p":"make sure","m":"to check that something is true or done","d":"To check or act so that something is certain to happen or be true.","ex":["Make sure you lock the door.","I made sure the room was clean."],"key":"Make sure","syn":["ensure","check","see to it"],"reg":"neutral","ielts":"careful","note":"Use 'ensure' in essays; 'make sure' is fine in letters."},{"p":"the matter","m":"the problem or reason something is wrong","d":"Used in 'What's the matter?' to ask what is wrong; refers to the problem.","ex":["What is the matter with your arm?","Nothing is the matter, I am fine."],"key":"the matter with","syn":["the problem","what's wrong","the trouble"],"reg":"neutral","ielts":"careful","note":"Common in spoken questions; not typical in essays."},{"p":"I mean","m":"used to explain or correct what you just said","d":"Used in speech to explain more clearly or correct something you have said.","ex":["It was cold, I mean really cold.","I like it. I mean, it is okay."],"key":"I mean","syn":["that is","in other words","what I mean is"],"reg":"informal","ielts":"no","note":"Spoken filler; do not use in writing, use sparingly in speaking."},{"p":"pleased to meet you","m":"a polite greeting when you meet someone first","d":"A polite phrase said when you meet someone for the first time.","ex":["Pleased to meet you, Mr Lee.","I'm Anna. Pleased to meet you."],"key":"Pleased to meet you","syn":["nice to meet you","good to meet you","how do you do"],"reg":"neutral","ielts":"no","note":"Spoken greeting; useful in Speaking Part 1 openings."},{"p":"the middle","m":"the centre or point halfway","d":"The part of something that is at an equal distance from all sides or ends.","ex":["There is a lake in the middle of the park.","He woke up in the middle of the night."],"key":"in the middle of the park","syn":["the centre","the midpoint","the heart"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 maps and process descriptions."},{"p":"I don't mind","m":"used to say you are happy with either choice","d":"Used to say that you are not bothered by something or have no strong preference.","ex":["I don't mind waiting for you.","Tea or coffee? - I don't mind."],"key":"I don't mind waiting","syn":["I'm happy with that","it's all the same to me","I have no preference"],"reg":"informal","ielts":"careful","note":"Good in Speaking; in essays use 'have no objection'."},{"p":"never mind","m":"used to say something is not important","d":"Used to tell someone not to worry or that something does not matter.","ex":["Never mind, we can try again tomorrow.","Never mind the cost, just buy it."],"key":"Never mind","syn":["don't worry","forget it","it doesn't matter"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"at the moment","m":"now; at this time","d":"Used as an adverbial phrase to mean at the present time.","ex":["I am studying English at the moment.","She is busy at the moment."],"key":"at the moment","syn":["currently","at present","right now"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; use 'currently' or 'at present' in essays."},{"p":"the moon","m":"the bright object seen in the sky at night","d":"The large natural object that moves around the Earth and shines in the night sky.","ex":["The moon was very bright last night.","People first walked on the moon in 1969."],"key":"The moon","syn":["the lunar body","Earth's satellite","the night light"],"reg":"neutral","ielts":"yes","note":"Fine in science topics and descriptive Speaking."},{"p":"(the) most attractive/important/popular, etc.","m":"more attractive, important or popular than all others","d":"The superlative form with 'most' before long adjectives, used to compare three or more things.","ex":["This is the most popular dish in our restaurant.","She is the most important person in my life."],"key":"the most popular","syn":["the leading","the top","the best-known"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 descriptions of highest values."},{"p":"too much/so much","m":"more than is needed; a very large amount","d":"Used before uncountable nouns or as an adverb to mean a very large amount, often more than is good.","ex":["I ate too much cake.","Thank you so much for your help."],"key":"too much cake","syn":["excessive amounts of","far too many","a great deal of"],"reg":"neutral","ielts":"yes","note":"Use 'too much' with uncountable nouns in Task 2 problems."},{"p":"don't need to do sth/needn't do sth","m":"used when it is not necessary to do something","d":"Used to say that something is not necessary; 'needn't' is followed by a bare infinitive.","ex":["You don't need to bring any food.","She needn't come to the meeting."],"key":"don't need to bring","syn":["don't have to","there is no need to","are not obliged to"],"reg":"neutral","ielts":"yes","note":"'Needn't' is more formal and common in British English."},{"p":"the net","m":"the internet","d":"An informal way of referring to the internet; also a piece of netting in sports.","ex":["I found the information on the net.","He spends hours on the net every day."],"key":"on the net","syn":["the internet","the web","online"],"reg":"informal","ielts":"careful","note":"Use 'the internet' in essays; 'the net' is fine in speaking."},{"p":"no thanks","m":"a polite way to refuse something offered","d":"Used to politely say you do not want something that someone offers.","ex":["Would you like some more rice? - No thanks.","No thanks, I am full."],"key":"No thanks","syn":["no thank you","I'm fine","not for me"],"reg":"informal","ielts":"no","note":"Spoken reply only; never use in writing."},{"p":"Oh no!","m":"used when you are worried, sad or shocked","d":"An exclamation used to show worry, sadness or surprise at something bad.","ex":["Oh no! I lost my phone.","Oh no, the bus has gone."],"key":"Oh no","syn":["oh dear","how awful","dear me"],"reg":"informal","ielts":"no","note":"Spoken exclamation only; avoid in essays."},{"p":"No problem.","m":"used to reply to thanks or to say you are happy to help","d":"Used as a friendly answer to thanks or an apology, or to agree to a request.","ex":["Thanks for your help. - No problem.","Can you wait? - No problem."],"key":"No problem","syn":["that's fine","not at all","don't mention it"],"reg":"informal","ielts":"no","note":"Spoken only; suitable in Speaking, not in essays."},{"p":"the north","m":"the direction to your left when you face the rising sun","d":"The direction towards the top of a map, or the part of a place in that direction.","ex":["The lake is in the north of the country.","Birds fly south from the north in winter."],"key":"in the north","syn":["the northern part","northward","the top of the map"],"reg":"neutral","ielts":"yes","note":"Very useful for Task 1 maps and location descriptions."},{"p":"or not","m":"used to include the opposite possibility","d":"Used after 'whether' or at the end of a clause to include the negative possibility.","ex":["I don't know whether he will come or not.","Please tell me if you like it or not."],"key":"or not","syn":["or otherwise","or the opposite","either way"],"reg":"neutral","ielts":"yes","note":"Common in Task 2: 'whether or not...'."},{"p":"not too","m":"not very; only a little","d":"Used before an adjective or adverb to mean not very or only slightly.","ex":["The test was not too difficult.","The water is not too cold today."],"key":"not too difficult","syn":["not very","fairly","reasonably"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; use 'not particularly' in essays."},{"p":"not bad","m":"fairly good; quite good","d":"Used to say that something is fairly good or better than expected.","ex":["The food was not bad.","How was the film? - Not bad."],"key":"not bad","syn":["quite good","fairly good","decent"],"reg":"informal","ielts":"no","note":"Spoken style; use 'reasonably good' in written work."},{"p":"just now","m":"a very short time ago, or at this moment","d":"Used as an adverbial phrase to mean a moment ago or at the present moment.","ex":["I saw her just now.","He phoned just now."],"key":"just now","syn":["a moment ago","a minute ago","recently"],"reg":"neutral","ielts":"careful","note":"Good in speaking; use 'recently' in essays."},{"p":"old friend","m":"a person you have known as a friend for a long time","d":"A friend you have known for many years.","ex":["He is an old friend from school.","I met an old friend at the station."],"key":"an old friend","syn":["longtime friend","close friend","lifelong friend"],"reg":"neutral","ielts":"yes","note":"Useful in Speaking Part 2 about a person you know."},{"p":"on sale","m":"available to buy, or sold at a lower price","d":"Used to say that goods are available in shops, or (in US English) that they cost less than usual.","ex":["The new phone goes on sale tomorrow.","These shoes are on sale this week."],"key":"on sale","syn":["available","for sale","reduced"],"reg":"neutral","ielts":"yes","note":"Useful in shopping topics; check meaning from context."},{"p":"pale blue/green/yellow, etc.","m":"a light, soft colour","d":"Used before a colour word to describe a light shade with little colour.","ex":["She wore a pale blue dress.","The walls are painted pale yellow."],"key":"pale blue","syn":["light blue","soft blue","pastel blue"],"reg":"neutral","ielts":"yes","note":"Useful for describing objects in Speaking Part 2."},{"p":"part of sth","m":"one piece or section of something","d":"Used to say that something is one section of a larger whole.","ex":["The kitchen is part of the house.","Learning grammar is part of studying English."],"key":"part of the house","syn":["a section of","a piece of","a component of"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 and Task 2 for describing wholes."},{"p":"the past","m":"the time before now","d":"The time before the present, or what happened in that time.","ex":["In the past, people wrote more letters.","He does not like talking about the past."],"key":"In the past","syn":["former times","history","days gone by"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 comparisons: 'In the past, ... Today, ...'."},{"p":"a pity","m":"something that makes you feel sad or sorry","d":"Used with 'it's' or 'what' to say something is disappointing or sad.","ex":["It's a pity you cannot come.","What a pity that it rained."],"key":"a pity","syn":["a shame","unfortunate","disappointing"],"reg":"neutral","ielts":"careful","note":"Fine in letters; use 'unfortunately' in essays."},{"p":"plan to do sth","m":"to have an idea of what you will do","d":"Used with an infinitive to say that you have decided and prepared to do something.","ex":["We plan to visit Rome in June.","She plans to study medicine."],"key":"plan to visit","syn":["intend to","aim to","mean to"],"reg":"neutral","ielts":"yes","note":"Good for future plans in Speaking and letters."},{"p":"would prefer","m":"to like one thing more than another","d":"Used with a noun or 'to' infinitive to say what you like better.","ex":["I would prefer tea to coffee.","She would prefer to stay at home."],"key":"would prefer tea","syn":["would rather","favour","would choose"],"reg":"neutral","ielts":"yes","note":"Good for opinions in Speaking; polite in letters."},{"p":"quite a few/a lot","m":"a fairly large number or amount","d":"Used to mean a rather large number (quite a few) or amount (quite a lot).","ex":["Quite a lot of people use buses here.","I have quite a few friends abroad."],"key":"Quite a lot of people","syn":["many","a considerable number of","plenty"],"reg":"neutral","ielts":"careful","note":"A little informal; 'a considerable number' suits essays better."},{"p":"remember to do sth","m":"not to forget to do something","d":"Used with an infinitive to say that you do not forget to do something you must do.","ex":["Remember to lock the door.","I always remember to call my mother."],"key":"Remember to lock","syn":["don't forget to","bear in mind to","make a point of"],"reg":"neutral","ielts":"yes","note":"Do not confuse with 'remember doing' (a memory)."},{"p":"the rest","m":"the part that is left; the others","d":"The remaining part of something, or the remaining people or things.","ex":["I will eat the rest of the pizza later.","Some students left, but the rest stayed."],"key":"the rest of the pizza","syn":["the remainder","the others","what is left"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for describing the remaining percentage."},{"p":"give sb a ring","m":"to telephone someone","d":"To phone someone; mainly British English, with the person between 'give' and 'a ring'.","ex":["Give me a ring tonight.","I'll give you a ring tomorrow."],"key":"Give me a ring","syn":["call","phone","give a call"],"reg":"informal","ielts":"careful","note":"Fine in informal letters; use 'contact' in formal writing."},{"p":"the same","m":"not different; equal","d":"Used to say that things are equal or alike; often followed by 'as'.","ex":["My shirt is the same as yours.","They both look the same."],"key":"the same as yours","syn":["identical","alike","equal"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for comparing figures: 'the same as'."},{"p":"a dance/language/riding, etc. school","m":"a school where you learn a skill like dancing","d":"A school that teaches a particular subject or skill, such as dance or a foreign language.","ex":["She goes to a dance school on Fridays.","He studies at a language school in London."],"key":"a dance school","syn":["a training centre","an academy","a course provider"],"reg":"neutral","ielts":"yes","note":"Useful in education and hobbies topics."},{"p":"sell for/at sth","m":"to be sold at a certain price","d":"Used with a price to say how much something is sold for.","ex":["The old car sold for $2,000.","These tickets sell at ten euros each
