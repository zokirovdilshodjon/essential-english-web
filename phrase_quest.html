especially through mud, snow or a long distance.","ex":["We trudged up the muddy hill in the rain.","He trudged through the snow to reach the village."],"key":"trudged up","syn":["plod","slog","tramp"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for narrative in speaking."},{"p":"not be sb's type","m":"to not be the kind of person someone likes","d":"To not be the kind of person or thing that someone likes or finds attractive.","ex":["He's nice, but he isn't really my type.","Fast cars aren't my type of thing."],"key":"isn't really my type","syn":["not appeal to sb","not be sb's cup of tea","not suit sb"],"reg":"informal","ielts":"no","note":"Spoken and casual; avoid in essays."},{"p":"be under way","m":"to have begun and be in progress","d":"To have started and be continuing, used of plans, projects or events.","ex":["Work on the new bridge is already under way.","Preparations for the summit are well under way."],"key":"is already under way","syn":["be in progress","be ongoing","have begun"],"reg":"neutral","ielts":"yes","note":"Useful for projects and developments in Task 1 and Task 2."},{"p":"undertake to do sth","m":"to promise or agree to do something","d":"To formally promise or agree to do something, followed by an infinitive.","ex":["The contractor undertook to finish the work by June.","The company undertakes to protect customers' data."],"key":"undertook to finish","syn":["promise to","agree to","pledge to"],"reg":"formal","ielts":"yes","note":"Formal; good for official and complaint letters."},{"p":"unsure of yourself","m":"lacking confidence","d":"Lacking confidence in your own abilities or decisions.","ex":["She felt unsure of herself on her first day at work.","Teenagers are often unsure of themselves in new groups."],"key":"unsure of herself","syn":["lacking confidence","insecure","self-doubting"],"reg":"neutral","ielts":"yes","note":"Good for talking about confidence and personality."},{"p":"unusually for sb","m":"differently from what someone normally does","d":"Used to say that someone's behaviour is different from what is typical for them.","ex":["Unusually for him, he arrived late to the meeting.","Unusually for a teenager, she saved most of her pocket money."],"key":"Unusually for him","syn":["uncharacteristically","out of character","atypically"],"reg":"neutral","ielts":"yes","note":"Good sentence opener for describing exceptions."},{"p":"an uphill battle/struggle/task","m":"a very difficult job needing great effort","d":"A task or effort that is very difficult and requires continuous effort over a long time.","ex":["Reducing carbon emissions is an uphill battle for many countries.","Starting a business without funding was an uphill struggle."],"key":"an uphill battle","syn":["an arduous task","a hard struggle","a tough challenge"],"reg":"neutral","ielts":"yes","note":"Strong metaphor for Task 2 about challenges."},{"p":"upwards of sth","m":"more than a certain number","d":"More than a stated number or amount, used with figures.","ex":["Upwards of 10,000 people attended the festival.","The project cost upwards of two million pounds."],"key":"Upwards of 10,000","syn":["more than","in excess of","over"],"reg":"formal","ielts":"yes","note":"Good for approximating large figures in Task 1."},{"p":"the use of sth","m":"the act of using something","d":"The act or practice of using something, often in discussing technology or policy.","ex":["The use of mobile phones is banned in the exam hall.","Critics oppose the use of animals in experiments."],"key":"The use of mobile phones","syn":["the application of","the employment of","the usage of"],"reg":"neutral","ielts":"yes","note":"Very common in essays as a noun phrase subject."},{"p":"come in useful","m":"to be helpful at some later time","d":"To prove helpful or valuable at some time in the future.","ex":["Keep the receipt, because it may come in useful later.","Her language skills came in useful during the trip."],"key":"come in useful","syn":["prove handy","be of use","come in handy"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'prove useful' is safer in essays."},{"p":"a vain attempt/effort/hope","m":"something tried or hoped for without success","d":"An attempt, effort or hope that does not succeed or has no chance of success.","ex":["He made a vain attempt to repair the engine.","They clung to a vain hope that the missing sailors were alive."],"key":"a vain attempt","syn":["a futile attempt","a fruitless effort","an unsuccessful try"],"reg":"formal","ielts":"yes","note":"Good formal phrase for describing failed policies."},{"p":"a vehicle for sth/doing sth","m":"a way of expressing or achieving something","d":"A means by which something is expressed, communicated or achieved.","ex":["The newspaper became a vehicle for political protest.","Sport can be a vehicle for promoting social change."],"key":"a vehicle for","syn":["a means of","a medium for","an outlet for"],"reg":"formal","ielts":"yes","note":"Sophisticated metaphor for media and society essays."},{"p":"vent your anger/frustration, etc.","m":"to express strong feelings openly","d":"To express strong negative emotions openly, often on someone or something.","ex":["He vented his frustration on the referee after the match.","Some people vent their anger on social media."],"key":"vented his frustration","syn":["release","let out","express"],"reg":"neutral","ielts":"yes","note":"Useful for stress, emotions and social media topics."},{"p":"venture into/out/outside, etc.","m":"to go somewhere new or risky","d":"To go to a place that is dangerous, unfamiliar or uncertain, or to try something new.","ex":["Few travellers venture into the desert in summer.","The firm ventured into new markets last year."],"key":"venture into","syn":["dare to go","risk going","set out"],"reg":"neutral","ielts":"yes","note":"Works for travel and business risk topics."},{"p":"a vicious circle/cycle","m":"a bad situation that keeps making itself worse","d":"A situation in which one problem causes another, which in turn makes the first worse.","ex":["Poverty and poor education create a vicious circle.","Stress leads to poor sleep, which causes more stress in a vicious cycle."],"key":"a vicious circle","syn":["a downward spiral","a self-perpetuating problem","a negative loop"],"reg":"neutral","ielts":"yes","note":"Excellent for Task 2 cause-and-effect arguments."},{"p":"sb's attention/mind/thoughts, etc. wander","m":"to stop concentrating and think about other things","d":"To stop concentrating on something and begin thinking about unrelated things.","ex":["During the long lecture, my mind began to wander.","Students' attention wanders when lessons lack variety."],"key":"my mind began to wander","syn":["lose concentration","drift off","become distracted"],"reg":"neutral","ielts":"yes","note":"Useful for education and concentration topics."},{"p":"be wasted on sb","m":"to be given to someone who does not appreciate it","d":"To be given or offered to someone who cannot appreciate or make good use of it.","ex":["Fine wine is wasted on him; he prefers lemonade.","Expensive lessons are wasted on children who are not interested."],"key":"is wasted on him","syn":["be lost on","be thrown away on","be unappreciated by"],"reg":"informal","ielts":"careful","note":"Spoken and opinionated; use cautiously in essays."},{"p":"get/have sth out of the way","m":"to finish a task so it no longer bothers you","d":"To complete an unpleasant or necessary task so that you can concentrate on other things.","ex":["I want to get the paperwork out of the way before lunch.","Once we have the exams out of the way, we can relax."],"key":"get the paperwork out of the way","syn":["finish","deal with","get done"],"reg":"informal","ielts":"careful","note":"Good for talking about work habits in speaking."},{"p":"have a weakness for sth/sb","m":"to like something too much","d":"To like something or someone so much that you find it hard to resist.","ex":["I have a weakness for chocolate cake.","She has a weakness for old, romantic films."],"key":"have a weakness for","syn":["have a soft spot for","be partial to","be fond of"],"reg":"neutral","ielts":"yes","note":"Natural for food and hobbies in speaking."},{"p":"a wealth of sth","m":"a large amount of something good","d":"A large quantity of something valuable or useful, especially information or experience.","ex":["The museum holds a wealth of historical documents.","She brings a wealth of experience to the role."],"key":"a wealth of","syn":["an abundance of","a great deal of","a plethora of"],"reg":"formal","ielts":"yes","note":"Strong, academic alternative to 'a lot of'."},{"p":"weary of sth/sb","m":"tired of or bored with something","d":"Feeling bored, tired or impatient because of something that has continued for too long.","ex":["Voters are weary of broken promises.","He grew weary of the constant travelling."],"key":"weary of","syn":["tired of","sick of","fed up with"],"reg":"formal","ielts":"yes","note":"Slightly literary; good for public opinion in essays."},{"p":"outstay/overstay your welcome","m":"to stay somewhere longer than people want","d":"To remain as a guest or visitor for longer than the host wants.","ex":["Don't outstay your welcome by visiting every weekend.","The guests overstayed their welcome and stayed another week."],"key":"outstay your welcome","syn":["stay too long","wear out your welcome","linger too long"],"reg":"neutral","ielts":"careful","note":"Fine in speaking about hospitality or visitors."},{"p":"what with","m":"because of several things together","d":"Used to introduce the combined reasons for a situation, usually followed by a noun.","ex":["What with the traffic and the rain, I was an hour late.","I'm exhausted, what with work and the new baby."],"key":"What with the traffic","syn":["because of","owing to","thanks to"],"reg":"informal","ielts":"no","note":"Spoken and chatty; use 'owing to' in writing."},{"p":"sb's whereabouts","m":"the place where someone or something is","d":"The place where a person or thing is, especially when it is unknown.","ex":["Police are trying to establish the suspect's whereabouts.","The whereabouts of the painting remain a mystery."],"key":"the suspect's whereabouts","syn":["location","position","the place where sb is"],"reg":"formal","ielts":"yes","note":"Useful for crime and news topics."},{"p":"be worth your while","m":"to be useful or rewarding for you to do","d":"To be beneficial or rewarding enough to justify the time or effort spent.","ex":["It would be worth your while to learn a second language.","The long journey was worth their while."],"key":"worth your while","syn":["be worthwhile","pay off","be beneficial"],"reg":"neutral","ielts":"yes","note":"Useful for recommendations and advice."},{"p":"wield influence/power, etc.","m":"to have and use power or influence","d":"To have and use power, authority or influence over others.","ex":["Large corporations wield enormous influence over governments.","The president wields considerable power in foreign policy."],"key":"wield enormous influence","syn":["exercise","exert","hold"],"reg":"formal","ielts":"yes","note":"Strong collocation for politics and business essays."},{"p":"a wild accusation/guess/rumour, etc.","m":"a claim or idea with no clear evidence","d":"A claim, guess or story made without evidence or careful thought.","ex":["The newspaper printed a wild accusation about the minister.","It was just a wild guess, but it turned out to be right."],"key":"a wild accusation","syn":["an unfounded claim","a baseless allegation","a random guess"],"reg":"neutral","ielts":"yes","note":"Useful for media and misinformation topics."},{"p":"win approval/respect/support, etc.","m":"to gain people's approval or backing","d":"To gain the approval, respect or backing of other people through effort or achievement.","ex":["The mayor won the support of local businesses.","She won respect through years of honest work."],"key":"won the support of","syn":["gain","earn","secure"],"reg":"neutral","ielts":"yes","note":"Useful for leadership and politics topics."},{"p":"word for word","m":"using exactly the same words","d":"Using exactly the same words as the original, with no change.","ex":["He repeated her speech word for word.","The translation followed the original word for word."],"key":"word for word","syn":["verbatim","literally","exactly"],"reg":"neutral","ielts":"careful","note":"Good for describing translation or copying; also avoid plagiarism."},{"p":"worthy of attention/notice, etc.","m":"deserving to be noticed or considered","d":"Good or important enough to deserve attention, notice or respect.","ex":["The results are worthy of attention from policymakers.","Her achievements are worthy of notice."],"key":"worthy of attention","syn":["deserving of","meriting","noteworthy"],"reg":"formal","ielts":"yes","note":"Good for highlighting key points in Task 1 and Task 2."},{"p":"yearn for sth; yearn to do sth","m":"to want something very much","d":"To have a strong, often sad desire for something, followed by 'for' plus noun or 'to' plus infinitive.","ex":["Many exiles yearn for their homeland.","She yearned to travel the world."],"key":"yearn for","syn":["long for","crave","pine for"],"reg":"formal","ielts":"yes","note":"Strong emotional verb; use sparingly in essays."},{"p":"yet another/more, etc.","m":"one more of something, often with annoyance","d":"Used to emphasise that there is an additional thing, often one that is unwelcome.","ex":["The company announced yet another round of job cuts.","Yet more evidence supports the theory."],"key":"yet another","syn":["one more","still another","a further"],"reg":"neutral","ielts":"yes","note":"Good emphatic linker in Task 2 to add points."},{"p":"be/have yet to do sth","m":"to not have done something so far","d":"Used to say that something has not happened up to now but is expected to.","ex":["The government has yet to respond to the report.","Many of the findings have yet to be confirmed."],"key":"has yet to respond","syn":["not yet have done","still need to","be still to"],"reg":"formal","ielts":"yes","note":"Useful formal structure for describing unfinished actions."}]};

const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function span(s,key){
  if(!key)return null;
  let i=s.indexOf(key),len=key.length;
  if(i<0){const m=s.match(new RegExp(rx(key),"i"));if(!m)return null;i=m.index;len=m[0].length}
  return [i,len];
}
function hl(s,key){const r=span(s,key);if(!r)return esc(s);return esc(s.slice(0,r[0]))+"<mark>"+esc(s.slice(r[0],r[0]+r[1]))+"</mark>"+esc(s.slice(r[0]+r[1]))}
function blankOut(s,key){const r=span(s,key);if(!r)return null;return esc(s.slice(0,r[0]))+'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'+esc(s.slice(r[0]+r[1]))}
const canBlank=x=>!!x.key&&!!span(x.ex[0],x.key);
const localDay=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

/* ---------- storage ---------- */
const KEY="phrasequest.v1";
let S={xp:0,streak:0,last:"",today:{d:"",xp:0},prog:{},badges:{},sound:true,theme:"",best:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const getP=id=>S.prog[id]||{box:0,seen:0,ok:0,no:0};
function mark(id,ok){
  const p=S.prog[id]||(S.prog[id]={box:0,seen:0,ok:0,no:0});
  p.seen++;
  if(ok){p.ok++;p.box=Math.min(5,p.box+1)}else{p.no++;p.box=Math.max(0,p.box-2)}
  save();refreshHead();
}
const isMastered=id=>getP(id).box>=3;
function levelStats(L){
  const pool=poolFor(L);let m=0,seen=0;
  pool.forEach(x=>{const p=getP(x.id);if(p.box>=3)m++;if(p.seen>0||p.box>=3)seen++});
  return {m,seen,total:pool.length};
}

/* ---------- xp / streak / badges ---------- */
const playerLevel=()=>Math.floor(Math.sqrt(S.xp/40))+1;
function updateTop(){
  $("#st-streak").textContent="🔥 "+S.streak;
  $("#st-xp").textContent="⭐ "+S.xp+" XP";
  $("#st-lv").textContent="Lv "+playerLevel();
  $("#btn-sound").textContent=S.sound?"🔊":"🔇";
}
function addXP(n){
  if(n<=0)return;
  const t=localDay();
  if(S.today.d!==t)S.today={d:t,xp:0};
  if(S.last!==t){
    const y=new Date();y.setDate(y.getDate()-1);
    S.streak=(S.last===localDay(y))?S.streak+1:1;S.last=t;
  }
  const before=playerLevel();
  S.xp+=n;S.today.xp+=n;save();updateTop();
  if(playerLevel()>before)toast("🎉 Level up! You are now level "+playerLevel());
  checkBadges();
}
const masteredTotal=()=>ALL.filter(x=>isMastered(x.id)).length;
const BADGES=[
  {id:"first",icon:"🌱",name:"First steps",desc:"Earn your first XP",ok:()=>S.xp>0},
  {id:"xp200",icon:"⭐",name:"200 XP",desc:"Keep going!",ok:()=>S.xp>=200},

  {id:"s7",icon:"🚀",name:"7-day streak",desc:"A full week",ok:()=>S.streak>=7},

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- sound / speech / confetti ---------- */
let AC;
function beep(f,d=.12,type="sine"){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}
}
const sfx={ok(){beep(660,.1);setTimeout(()=>beep(880,.14),90)},no(){beep(180,.25,"sawtooth")},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*110))}};
function speak(t){
  try{
    const clean=t.replace(/\bsb\b/g,"somebody").replace(/\bsth\b/g,"something").replace(/\.\.\./g,"").replace(/\//g," or ").replace(/\betc\.?/g,"et cetera");
    const u=new SpeechSynthesisUtterance(clean);u.lang="en-GB";u.rate=.9;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("#confetti"),ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;c.style.display="block";
  const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:6+Math.random()*7,r:Math.random()*6,c:`hsl(${Math.random()*360} 80% 60%)`}));
  let t=0;(function f(){
    ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.12;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
    if(++t<150)requestAnimationFrame(f);else{ctx.clearRect(0,0,c.width,c.height);c.style.display="none"}
  })();
}

const ielChip=x=>`<span class="chip c-${x.ielts}">${IEL[x.ielts][0]} ${x.ielts==="yes"?"Writing OK":x.ielts==="careful"?"Careful":"Not for Writing"}</span>`;

function pickWeighted(pool,n){
  return shuffle(pool.map(x=>[x,getP(x.id).box+Math.random()*3]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(a=>a[0]));
}
function uniq(list,fn,n,ok){const out=[],seen=new Set();for(const o of list){const v=fn(o);if(!v||seen.has(v)||!ok(v))continue;seen.add(v);out.push(v);if(out.length===n)break}return out}
function resultScreen(el,o){

/* ---------- Browse ---------- */
let bf={q:"",reg:"",ie:"",st:""};
function runBrowse(el,L,pool){
  let shown=30;
  const status=x=>{const p=getP(x.id);return p.box>=3?"mastered":p.seen?"learning":"new"};
  const opt=(v,t,cur)=>`<option value="${v}"${cur===v?" selected":""}>${t}</option>`;
  el.innerHTML=`<div class="filters">
    <input id="q" type="search" placeholder="Search phrase, meaning or synonym…" aria-label="Search" value="${esc(bf.q)}">
    <select id="freg" aria-label="Register">${opt("","Any register",bf.reg)}${opt("formal","Formal",bf.reg)}${opt("neutral","Neutral",bf.reg)}${opt("informal","Informal",bf.reg)}</select>
    <select id="fie" aria-label="IELTS Writing">${opt("","IELTS: any",bf.ie)}${opt("yes","✅ Writing OK",bf.ie)}${opt("careful","⚠️ Use with care",bf.ie)}${opt("no","❌ Not for Writing",bf.ie)}</select>
    <select id="fst" aria-label="Status">${opt("","Any status",bf.st)}${opt("new","New",bf.st)}${opt("learning","Learning",bf.st)}${opt("mastered","Mastered",bf.st)}</select>
  </div><div class="count" id="cnt"></div><div id="list"></div><button class="btn" id="more">Show more</button>`;
  const list=$("#list",el);
  const rowHTML=x=>{const m=isMastered(x.id);return `<article class="row" data-id="${x.id}">
    <div class="rh"><div class="rt"><span class="ph">${esc(x.p)}</span>${L==="ALL"?lvTag(x):""}<div class="rm">${esc(x.m)}</div></div>
    <div class="rb">${regChip(x)}${ielChip(x)}<button class="ico" data-act="say" aria-label="Listen" title="Listen">🔊</button><button class="ico ${m?"on":""}" data-act="know" aria-label="Mark as known" title="I know this">✓</button></div></div>
    <div class="dt" hidden></div></article>`};
  function filtered(){
    const q=bf.q.trim().toLowerCase();
    return pool.filter(x=>(!bf.reg||x.reg===bf.reg)&&(!bf.ie||x.ielts===bf.ie)&&(!bf.st||status(x)===bf.st)&&(!q||(x.p+" "+x.m+" "+x.syn.join(" ")).toLowerCase().includes(q)));
  }
  function draw(){
    const f=filtered();
    $("#cnt",el).textContent=f.length+" phrase"+(f.length===1?"":"s");
    list.innerHTML=f.length?f.slice(0,shown).map(rowHTML).join(""):'<div class="empty">No phrases match these filters.</div>';
    $("#more",el).style.display=f.length>shown?"":"none";
  }
  $("#q",el).oninput=e=>{bf.q=e.target.value;shown=30;draw()};
  $("#freg",el).onchange=e=>{bf.reg=e.target.value;shown=30;draw()};
  $("#fie",el).onchange=e=>{bf.ie=e.target.value;shown=30;draw()};
  $("#fst",el).onchange=e=>{bf.st=e.target.value;shown=30;draw()};
  $("#more",el).onclick=()=>{shown+=40;draw()};
  list.onclick=e=>{
    const row=e.target.closest(".row");if(!row)return;
    const x=byId[row.dataset.id],act=e.target.closest("[data-act]");
    if(act){
      if(act.dataset.act==="say")speak(x.p);
      else{const p=S.prog[x.id]||(S.prog[x.id]={box:0,seen:0,ok:0,no:0});p.box=p.box>=3?0:5;save();act.classList.toggle("on",p.box>=3);refreshHead();if(p.box>=3){addXP(2);sfx.ok()}}
      return;
    }
    const dt=$(".dt",row);
    if(dt.hidden){if(!dt.innerHTML)dt.innerHTML=detailHTML(x);dt.hidden=false}else dt.hidden=true;
  };
  draw();
}

/* ---------- Flashcards ---------- */
function runCards(el,L,pool){
  let deck,i,flip,good,xp;
  function start(){deck=pickWeighted(pool,15);i=0;flip=false;good=0;xp=0;draw()}
  function answer(ok){
    const x=deck[i];mark(x.id,ok);if(ok){good++;addXP(5);xp+=5;sfx.ok()}else{addXP(1);xp+=1}
    i++;flip=false;draw();
  }
  function draw(){
    if(i>=deck.length){kb=null;return resultScreen(el,{title:"Deck complete!",score:good,total:deck.length,sub:"cards you knew",xp,L,again:start})}
    const x=deck[i];
    el.innerHTML=`<div class="prog"><span>${i+1} / ${deck.length}</span><div class="pb"><i style="width:${i/deck.length*100}%"></i></div></div>
    <div class="card fc ${flip?"bk":""}" id="fc" ${flip?"":'tabindex="0" role="button" aria-label="Flip card"'}>
    ${flip?`<div class="big">${esc(x.p)} <button class="ico" id="say" aria-label="Listen">🔊</button></div><div class="dt">${detailHTML(x)}</div>`
          :`<div class="big">${esc(x.p)}</div><div class="hintline">${L==="ALL"?lvTag(x)+" ":""}Think of the meaning, then flip the card</div><button class="ico" id="say" style="margin-top:14px" aria-label="Listen">🔊</button>`}
    </div>
    <div class="actions" style="justify-content:center">${flip
      ?`<button class="btn bad" id="no">✗ Again <small>(←)</small></button><button class="btn good" id="yes">✓ Got it <small>(→)</small></button>`
      :`<button class="btn primary" id="flip">Show answer <small>(Space)</small></button>`}</div>`;
    $("#say",el).onclick=e=>{e.stopPropagation();speak(x.p)};
    if(flip){$("#no",el).onclick=()=>answer(false);$("#yes",el).onclick=()=>answer(true)}
    else{$("#flip",el).onclick=()=>{flip=true;draw()};$("#fc",el).onclick=()=>{flip=true;draw()}}
    kb=e=>{
      if(!flip&&(e.key===" "||e.key==="Enter"||e.key==="ArrowUp"||e.key==="ArrowDown")){e.preventDefault();flip=true;draw()}
      else if(flip&&e.key==="ArrowRight"){answer(true)}
      else if(flip&&e.key==="ArrowLeft"){answer(false)}
    };
  }
  start();
}

/* ---------- Quiz ---------- */
function makeQ(x,pool){
  const types=["meaning","phrase"];if(canBlank(x))types.push("cloze","cloze");
  const t=types[Math.random()*types.length|0];
  const others=shuffle(pool.filter(o=>o.id!==x.id));
  let q,opts,ans;
  if(t==="meaning"){
    q=`What does <b>“${esc(x.p)}”</b> mean?`;ans=x.m;
    opts=shuffle([x.m,...uniq(others,o=>o.m,3,m=>m!==x.m)]);
  }else if(t==="phrase"){
    q=`Which phrase matches this meaning?<br><b>“${esc(x.m)}”</b>`;ans=x.p;
    opts=shuffle([x.p,...uniq(others,o=>o.p,3,p=>p!==x.p)]);
  }else{
    q=`Choose the phrase that fits the gap:<div class="sent" style="margin-top:10px">${blankOut(x.ex[0],x.key)}</div>`;ans=x.p;
    opts=shuffle([x.p,...uniq(others,o=>o.p,3,p=>p!==x.p)]);
  }
  return {x,q,opts,ans,t};
}
function runQuiz(el,L,pool){
  const N=10;let qs,i,hearts,score,combo,best,xp,wrong,locked;
  function start(){
    qs=pickWeighted(pool,N).map(x=>makeQ(x,pool));i=0;hearts=3;score=0;combo=0;best=0;xp=0;wrong=[];draw();
  }
  function finish(){
    kb=null;
    if(score===N){S.best.perfect=1;save()}
    checkBadges();
    resultScreen(el,{title:hearts>0?"Quiz complete!":"Out of hearts",score,total:N,sub:best>1?`Best combo: ${best} in a row`:"Try again to beat your score",xp,L,wrong,again:start});
  }
  function draw(){
    if(i>=N||hearts<=0)return finish();
    const Q=qs[i];locked=false;
    el.innerHTML=`<div class="hud"><span class="hearts" aria-label="${hearts} hearts left">${"❤️".repeat(hearts)}${"🖤".repeat(3-hearts)}</span><span class="combo">${combo>1?"🔥 Combo ×"+combo:""}</span><span style="color:var(--muted);font-weight:650">${i+1} / ${N}</span></div>
    <div class="prog"><div class="pb"><i style="width:${i/N*100}%"></i></div></div>
    <div class="card"><p class="q">${Q.q}</p>
    <div class="opts">${Q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    kb=e=>{
      if(!locked&&/^[1-4]$/.test(e.key)&&Q.opts[+e.key-1]!==undefined)pick(+e.key-1);
      else if(locked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();i++;draw()}
    };
  }
  function pick(k){
    if(locked)return;locked=true;
    const Q=qs[i],ok=Q.opts[k]===Q.ans;
    el.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(Q.opts[j]===Q.ans)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
    mark(Q.x.id,ok);
    if(ok){score++;combo++;best=Math.max(best,combo);const g=10+Math.min(combo,5)*2;xp+=g;addXP(g);sfx.ok()}
    else{combo=0;hearts--;wrong.push(Q.x);sfx.no()}
    const last=(i===N-1)||hearts<=0;
    $("#fb",el).innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?"✓ Correct!":"✗ Not quite."}</b> <b>${esc(Q.x.p)}</b>: ${esc(Q.x.m)}.<br><i>${hl(Q.x.ex[0],Q.x.key)}</i><br><span style="display:inline-block;margin-top:6px">${regChip(Q.x)}${ielChip(Q.x)}</span><div class="actions"><button class="btn primary" id="next">${last?"See results":"Next"} <small>(Enter)</small></button></div></div>`;
    $("#next",el).onclick=()=>{i++;draw()};
    $("#next",el).focus();
  }
  start();
}

/* ---------- Fill in the blank ---------- */
function runFill(el,L,pool){
  const N=10;let deck,i,score,xp,hint,checked,wrong;
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
  function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
    for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
  function start(){deck=pickWeighted(pool.filter(canBlank),N);i=0;score=0;xp=0;wrong=[];draw()}
  function draw(){
    if(i>=deck.length){kb=null;return resultScreen(el,{title:"Round complete!",score,total:deck.length,sub:"gaps filled correctly",xp,L,wrong,again:start})}
    const x=deck[i];hint=false;checked=false;
    el.innerHTML=`<div class="prog"><span>${i+1} / ${deck.length}</span><div class="pb"><i style="width:${i/deck.length*100}%"></i></div></div>
    <div class="card"><p class="q">Type the missing phrase</p>
    <p class="sent">${blankOut(x.ex[0],x.key)}</p>
    <p style="color:var(--muted);margin:6px 0 0">Meaning: <b>${esc(x.m)}</b></p>
    <div class="hintbox" id="hb"></div>
    <div class="fill"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer…" aria-label="Your answer">
    <button class="btn primary" id="chk">Check</button><button class="btn ghost" id="hint">💡 Hint</button><button class="btn ghost" id="skip">Reveal</button></div>
    <div id="fb"></div></div>`;
    const inp=$("#ans",el);inp.focus();
    $("#hint",el).onclick=()=>{hint=true;$("#hb",el).textContent=x.key.split(" ").map(w=>w[0]+"·".repeat(Math.max(0,w.length-1))).join("   ");inp.focus()};
    $("#chk",el).onclick=()=>check(false);
    $("#skip",el).onclick=()=>check(true);
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();checked?next():check(false)}};
  }
  function next(){i++;draw()}
  function check(reveal){
    if(checked)return;
    const x=deck[i],inp=$("#ans",el),a=norm(inp.value);
    if(!reveal&&!a){inp.focus();return}
    const targets=[norm(x.key),norm(x.p)];
    let ok=false,close=false;
    if(!reveal){ok=targets.includes(a);if(!ok&&a.length>=6&&targets.some(t=>lev(a,t)<=1)){ok=true;close=true}}
    checked=true;inp.disabled=true;
    mark(x.id,ok);
    let g=0;if(ok){score++;g=hint?10:15;xp+=g;addXP(g);sfx.ok()}else{wrong.push(x);sfx.no()}
    $("#fb",el).innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?(close?"✓ Almost! Check the spelling:":"✓ Correct!"):reveal?"Answer:":"✗ Not quite. Answer:"}</b> <mark>${esc(x.key)}</mark> <span style="color:var(--muted)">(${esc(x.p)})</span><br><i>${hl(x.ex[0],x.key)}</i><br>
    <span style="display:inline-block;margin-top:6px"><b>Synonyms:</b> ${x.syn.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</span><br>${regChip(x)}${ielChip(x)}
    <div class="actions"><button class="btn primary" id="next">${i===deck.length-1?"See results":"Next"} <small>(Enter)</small></button></div></div>`;
    $("#next",el).onclick=next;$("#next",el).focus();
  }
  start();
}

/* ---------- Match ---------- */
function runMatch(el,L,pool){
  let round,left,right,sel,done,miss,t0,timer,xpTotal=0,rounds=0;
  cleanup=()=>clearInterval(timer);
  function start(){
    const items=pickWeighted(pool,6);
    left=shuffle(items);right=shuffle(items);sel=null;done=new Set();miss=0;t0=Date.now();
    clearInterval(timer);draw();
    timer=setInterval(()=>{const t=$("#tm",el);if(t)t.textContent=Math.floor((Date.now()-t0)/1000)+"s"},500);
  }
  function draw(){
    el.innerHTML=`<div class="hud"><span><b>Match each phrase with its meaning</b></span><span style="color:var(--muted);font-weight:650">⏱ <span id="tm">0s</span> · Misses: <span id="ms">${miss}</span></span></div>
    <div class="mgrid"><div class="mcol">${left.map(x=>`<button class="mt" data-side="l" data-id="${x.id}" ${done.has(x.id)?"disabled":""}><b>${esc(x.p)}</b></button>`).join("")}</div>
    <div class="mcol">${right.map(x=>`<button class="mt" data-side="r" data-id="${x.id}" ${done.has(x.id)?"disabled":""}>${esc(x.m)}</button>`).join("")}</div></div>`;
    el.querySelectorAll(".mt").forEach(b=>{
      if(done.has(b.dataset.id))b.classList.add("done");
      if(sel&&sel.side===b.dataset.side&&sel.id===b.dataset.id)b.classList.add("sel");
      b.onclick=()=>click(b);
    });
  }
  function click(b){
    const side=b.dataset.side,id=b.dataset.id;
    if(!sel||sel.side===side){sel={side,id};if(side==="l")speak(byId[id].p);return draw()}
    const ok=sel.id===id,lid=side==="r"?sel.id:id;
    if(ok){
      done.add(id);sel=null;mark(id,true);sfx.ok();draw();
      if(done.size===6)finish();
    }else{
      miss++;mark(lid,false);sfx.no();sel=null;draw();
      el.querySelectorAll(`.mt[data-id="${id}"]`).forEach(x=>x.classList.add("bad"));
    }
  }
  function finish(){
    clearInterval(timer);
    const secs=Math.floor((Date.now()-t0)/1000),xp=Math.max(10,60-miss*5-Math.floor(secs/5));
    addXP(xp);rounds++;xpTotal+=xp;
    sfx.win();if(miss===0)confetti();
    el.innerHTML=`<div class="card result"><div class="stars">${miss===0?"⭐⭐⭐":miss<=2?"⭐⭐☆":"⭐☆☆"}</div><h2>Round ${rounds} cleared!</h2><div class="big">${secs}s</div>
    <p style="color:var(--muted)">${miss} miss${miss===1?"":"es"}</p><span class="xpgain">+${xp} XP</span>
    <div class="actions"><button class="btn primary" id="again">Next round</button><a class="btn ghost" href="#/${L}/learn">Browse phrases</a></div></div>`;
    $("#again",el).onclick=start;
  }
  start();
}

/* ---------- IELTS Judge ---------- */
function runJudge(el,L,pool){
  const N=10;let deck,i,score,xp,locked,wrong;
  const OPTS=[["yes","✅","Safe for essays","Task 1 / Task 2"],["careful","⚠️","Use with care","depends on context"],["no","❌","Not for Writing","speaking / informal"]];
  function start(){
    const by=k=>shuffle(pool.filter(x=>x.ielts===k));
    const pk=(k,n)=>pickWeighted(by(k),n);
    let d=[...pk("yes",4),...pk("careful",3),...pk("no",3)];
    if(d.length<N)d=d.concat(pickWeighted(pool.filter(x=>!d.includes(x)),N-d.length));
    deck=shuffle(d).slice(0,N);i=0;score=0;xp=0;wrong=[];draw();
  }
  function draw(){
    if(i>=deck.length){
      kb=null;S.best.judge=Math.max(S.best.judge||0,score);save();checkBadges();
      return resultScreen(el,{title:"Verdict delivered!",score,total:deck.length,sub:"phrases judged correctly",xp,L,wrong,again:start});
    }
    const x=deck[i];locked=false;
    el.innerHTML=`<div class="prog"><span>${i+1} / ${deck.length}</span><div class="pb"><i style="width:${i/deck.length*100}%"></i></div></div>
    <div class="card"><p class="q" style="margin-bottom:6px">Can you use this in IELTS Writing?</p>
    <div class="fc-phrase" style="font-size:1.7rem;font-weight:800;margin:6px 0">${esc(x.p)} ${L==="ALL"?lvTag(x):""}</div>
    <p class="sent" style="color:var(--muted)"><i>${hl(x.ex[0],x.key)}</i></p>
    <div class="jbtns">${OPTS.map(([k,ic,t,s],j)=>`<button class="jb" data-k="${k}"><span>${ic} ${t} <small>(${j+1})</small></span><small>${s}</small></button>`).join("")}</div>
    <div id="fb"></div></div>`;
    el.querySelectorAll(".jb").forEach(b=>b.onclick=()=>pick(b.dataset.k));
    kb=e=>{
      if(!locked&&/^[1-3]$/.test(e.key))pick(OPTS[+e.key-1][0]);
      else if(locked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();i++;draw()}
    };
  }
  function pick(k){
    if(locked)return;locked=true;
    const x=deck[i],ok=k===x.ielts,order=["yes","careful","no"],near=Math.abs(order.indexOf(k)-order.indexOf(x.ielts))===1;
    el.querySelectorAll(".jb").forEach(b=>{b.disabled=true;if(b.dataset.k===x.ielts)b.classList.add("right");else if(b.dataset.k===k)b.classList.add("wrong")});
    mark(x.id,ok);
    const g=ok?10:near?3:0;xp+=g;addXP(g);
    if(ok){score++;sfx.ok()}else{wrong.push(x);sfx.no()}
    $("#fb",el).innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?"✓ Correct!":near?"Close, but no.":"✗ Not quite."}</b> ${regChip(x)}<br>${IEL[x.ielts][0]} <b>${IEL[x.ielts][1]}.</b> ${esc(x.note)}<br>
    <span style="display:inline-block;margin-top:6px"><b>Meaning:</b> ${esc(x.m)}</span><br><b>Synonyms:</b> ${x.syn.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}
    <div class="actions"><button class="btn primary" id="next">${i===deck.length-1?"See results":"Next"} <small>(Enter)</small></button></div></div>`;
    $("#next",el).onclick=()=>{i++;draw()};$("#next",el).focus();
  }
  start();
}

/* ---------- theme / sound / boot ---------- */
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
$("#btn-theme").onclick=()=>{
  const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  S.theme=dark?"light":"dark";save();applyTheme();
};
$("#btn-sound").onclick=()=>{S.sound=!S.sound;save();updateTop();if(S.sound)beep(660)};
applyTheme();updateTop();route();
</script>
