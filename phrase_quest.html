","note":"Good hedging in speaking Part 3; rare in essays."},{"p":"a working knowledge of sth","m":"enough knowledge to use a subject in practice","d":"Noun phrase meaning practical, basic understanding of a subject or language sufficient for use.","ex":["Applicants need a working knowledge of French.","She has a working knowledge of statistics."],"key":"a working knowledge of French","syn":["practical knowledge","basic understanding","functional command"],"reg":"neutral","ielts":"yes","note":"Useful for jobs, skills and education topics."},{"p":"the last person/thing, etc.","m":"the least likely person or thing","d":"Noun phrase meaning the person or thing you would least expect or want, followed by a relative clause.","ex":["He is the last person I would ask for advice.","Violence is the last thing a government should encourage."],"key":"the last person I would ask","syn":["the least likely person","the person least suited","the least expected"],"reg":"neutral","ielts":"careful","note":"Emphatic; useful in speaking, occasionally in essays."},{"p":"last but not least","m":"finally, and equally important","d":"Fixed phrase used to introduce the final item in a list, stressing that it is also important.","ex":["Last but not least, governments must invest in public transport.","Last but not least, I would like to thank my teacher."],"key":"Last but not least","syn":["finally","lastly","most importantly"],"reg":"neutral","ielts":"careful","note":"Overused as a linker; try 'Finally' in Task 2."},{"p":"the last","m":"the final one","d":"Noun phrase meaning the final person, thing or part in a series, used with 'the'.","ex":["The last of the guests left at midnight.","She was the last to finish the exam."],"key":"The last of the guests","syn":["the final one","the ultimate","the end"],"reg":"neutral","ielts":"yes","note":"Use to describe sequences or final stages in Task 1."},{"p":"last","m":"most recent; final; to continue for a time","d":"Adjective or verb meaning most sson.","Companies must learn their lesson after a financial crisis."],"key":"learned his lesson","syn":["learn from your mistakes","take it to heart","wise up"],"reg":"neutral","ielts":"careful","note":"Good idiom for speaking; use sparingly in essays."},{"p":"let sb/sth in/past/through, etc.","m":"allow someone or something to enter or pass","d":"Phrasal pattern: let + object + adverb or preposition, meaning to allow movement into or past a place.","ex":["The guard let us through the gate.","Thin curtains let in a lot of light."],"key":"let us through the gate","syn":["allow to pass","admit","permit entry"],"reg":"neutral","ielts":"careful","note":"Useful for describing everyday events in speaking."},{"p":"let me/us","m":"used to offer or suggest something","d":"Spoken or written pattern used to make an offer, suggestion or to introduce what you will do.","ex":["Let us now consider the opposing view.","Let me explain why this idea is important."],"key":"Let us now consider","syn":["allow me to","I will now","shall we"],"reg":"neutral","ielts":"careful","note":"'Let us consider' is acceptable in essays; 'Let me' for speaking."},{"p":"like mad","m":"very fast, hard or much","d":"Informal adverbial phrase meaning with great energy, speed or intensity.","ex":["We had to work like mad to finish on time.","The rain was falling like mad."],"key":"work like mad","syn":["like crazy","furiously","flat out"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"little by litte","m":"slowly, in small steps","d":"Adverbial phrase (standard form 'little by little') meaning gradually, in small amounts over time.","ex":["Little by litte, the town recovered after the flood.","He improved his English little by litte."],"key":"Little by litte","syn":["gradually","bit by bit","step by step"],"reg":"neutral","ielts":"careful","note":"Standard spelling is 'little by little'; 'gradually' suits essays."},{"p":"a little","m":"a small amount; slightly","d":"Determiner ok of those clouds","syn":["the appearance of","how it seems","the impression of"],"reg":"informal","ielts":"careful","note":"Better for speaking; use 'appearance' in essays."},{"p":"lose your life","m":"die","d":"Verb phrase meaning to die, usually in an accident, war or disaster.","ex":["Thousands of people lost their lives in the earthquake.","Many soldiers lose their lives every year."],"key":"lost their lives","syn":["die","perish","be killed"],"reg":"formal","ielts":"yes","note":"Suitable for disaster, war or safety topics."},{"p":"lose interest/patience, etc.","m":"stop feeling interested or patient","d":"Verb phrase: lose + noun such as interest, patience, hope or confidence, meaning to stop having that feeling.","ex":["Many students lose interest in science at secondary school.","Customers lose patience with long waiting times."],"key":"lose interest in science","syn":["become bored","grow tired of","run out of patience"],"reg":"neutral","ielts":"yes","note":"Useful for education and motivation topics."},{"p":"lose your temper","m":"become suddenly very angry","d":"Idiom meaning to become angry and lose control of your behaviour.","ex":["He lost his temper when the train was cancelled.","Teachers should never lose their temper with students."],"key":"lost his temper","syn":["flare up","blow up","explode with anger"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; use 'become angry' in essays."},{"p":"lose touch","m":"stop communicating with someone","d":"Idiom meaning to no longer be in contact with someone, often a friend, over time.","ex":["I lost touch with my school friends after university.","Families can lose touch when they live abroad."],"key":"lost touch with my school friends","syn":["drift apart","fall out of contact","stop communicating"],"reg":"neutral","ielts":"yes","note":"Good for family, friendship and migration topics."},{"p":"lose track","m":"forget how things are progressing","d":"Idiom: lose track (of sb/sth), meaning to no ighten the bedding","do the bed"],"reg":"neutral","ielts":"careful","note":"Useful for routines and housework in speaking."},{"p":"make the most of sth","m":"use an opportunity as well as possible","d":"Idiom: make the most of sth, meaning to get the greatest benefit from something.","ex":["Students should make the most of their time at university.","We tried to make the most of the sunny weather."],"key":"make the most of their time","syn":["take full advantage of","exploit","capitalise on"],"reg":"neutral","ielts":"yes","note":"Good in Task 2 on opportunity, education and time."},{"p":"to make matters worse","m":"used to add another bad point to a situation","d":"Discourse phrase introducing an additional negative factor that worsens an already difficult situation.","ex":["To make matters worse, the rent rose again this year.","To make matters worse, there were few jobs in the region."],"key":"To make matters worse","syn":["what is worse","on top of that","compounding the problem"],"reg":"neutral","ielts":"yes","note":"Useful linker when describing problems in Task 2."},{"p":"make sense","m":"be logical or easy to understand","d":"Verb phrase meaning to be reasonable or clear, or to have a clear meaning.","ex":["It makes sense to invest in public transport.","His explanation did not make sense to me."],"key":"makes sense to invest","syn":["be logical","be reasonable","add up"],"reg":"neutral","ielts":"yes","note":"Common and safe in Task 2 arguments."},{"p":"a mass of sth","m":"a large amount of something","d":"Noun phrase meaning a large quantity or lump of something, often shapeless or confused.","ex":["A mass of dark clouds covered the sky.","The report contained a mass of statistical data."],"key":"A mass of dark clouds","syn":["a large amount of","a great deal of","a heap of"],"reg":"neutral","ielts":"careful","note":"Descriptive; 'a large amount of' is simpler for essays."},{"p":"no matter how/what/when, etc.","m":"it does not change whatever the situation is","d":"Pattern: no matter + wh-word + clause, meaning something remains true regardless of the circumstances.","ex":["No matter how hard he tried, he could not pass.","No matter what governments do, some people will resist change."],"key":"No matter how hard he tried","syn":["regardless of how","whatever","however"],"reg":"neutral","ielts":"yes","note":"Good concessive structure for Task 2 arguments."},{"p":"may have","m":"possibly did or has happened","d":"Modal perfect used to express possibility about a past event or an action completed by now.","ex":["The delay may have been caused by bad weather.","Early humans may have used fire for protection."],"key":"may have been caused","syn":["could have","might have","possibly"],"reg":"neutral","ielts":"yes","note":"Good for cautious claims about past causes."},{"p":"may as well","m":"there is no good reason not to","d":"Modal phrase suggesting that an action is acceptable because there is nothing better to do.","ex":["We may as well wait here until the rain stops.","You may as well apply since the fee is free."],"key":"may as well wait","syn":["might as well","could just as well","no harm in"],"reg":"informal","ielts":"no","note":"Spoken and casual; avoid in essays."},{"p":"in the meantime","m":"during the time before something happens","d":"Adverbial phrase meaning during the period between two events.","ex":["The new bridge opens next year; in the meantime, use the ferry.","In the meantime, researchers continue to test the vaccine."],"key":"in the meantime","syn":["meanwhile","for now","in the interim"],"reg":"neutral","ielts":"yes","note":"Useful for interim measures in Task 2 solutions."},{"p":"the media","m":"newspapers, TV, radio and the internet as a group","d":"Collective noun for the organisations that communicate news and information to large audiences; often takes a plural verb.","ex":["The media play a major role in shaping opinions.","The media have given the story wide coverage."],"key":"The media play","syn":["the press","mass communication","news outlets"],"reg":"neutral","ielts":"yes","note":"Very common Task 2 topic; use plural verb in formal writing."},{"p":"not to mention","m":"and also; used to add a stronger point","d":"Phrase used to introduce an additional and often more important point to what has just been said.","ex":["The city is expensive, not to mention overcrowded.","Smoking harms health, not to mention the cost of cigarettes."],"key":"not to mention overcrowded","syn":["let alone","as well as","besides"],"reg":"neutral","ielts":"yes","note":"Effective for adding a strong extra point in Task 2."},{"p":"in the middle of nowhere","m":"in a place far from towns or people","d":"Idiomatic phrase describing a remote, isolated location.","ex":["Their farm is in the middle of nowhere.","We broke down in the middle of nowhere."],"key":"in the middle of nowhere","syn":["in a remote area","in the back of beyond","miles from anywhere"],"reg":"informal","ielts":"careful","note":"Good for speaking Part 2; use 'remote area' in essays."},{"p":"might have","m":"possibly did or was true in the past","d":"Modal perfect expressing a weaker possibility about past events or a missed chance.","ex":["The company might have avoided bankruptcy with better planning.","She might have missed the bus."],"key":"might have avoided bankruptcy","syn":["could have","may have","possibly"],"reg":"neutral","ielts":"yes","note":"Useful for speculation about past causes and missed chances."},{"p":"might as well","m":"there is no good reason not to","d":"Modal phrase suggesting a course of action is acceptable since alternatives are not better.","ex":["We might as well go home, since the shop is closed.","You might as well take the job."],"key":"might as well go home","syn":["may as well","could just as well","no harm in"],"reg":"informal","ielts":"no","note":"Spoken and casual; avoid in essays."},{"p":"bear/keep sb/sth in mind","m":"remember and consider something","d":"Verb phrase meaning to remember something and take it into account when deciding or acting.","ex":["Bear the budget in mind when planning the event.","Governments should keep young people in mind when designing policy."],"key":"Bear the budget in mind","syn":["take into account","remember","consider"],"reg":"neutral","ielts":"yes","note":"Useful in recommendations and conclusions in Task 2."},{"p":"to my mind","m":"in my opinion","d":"Parenthetical phrase used to introduce a personal opinion.","ex":["To my mind, public transport should be free.","To my mind, the plan is too expensive."],"key":"To my mind","syn":["in my opinion","in my view","as I see it"],"reg":"neutral","ielts":"yes","note":"Fine for stating your view in Task 2 introductions."},{"p":"cross your mind","m":"come briefly into your thoughts","d":"Idiom: sth crosses your mind, meaning a thought or idea occurs to you briefly.","ex":["It never crossed my mind that he might be lying.","Did it cross your mind to call the police?"],"key":"crossed my mind","syn":["occur to you","come to mind","strike you"],"reg":"neutral","ielts":"careful","note":"Better for speaking than formal essays."},{"p":"have/keep an open mind","m":"be willing to consider new ideas","d":"Idiom meaning to be ready to listen to and accept different ideas or opinions without prejudice.","ex":["Teachers should keep an open mind about new methods.","Travel encourages people to have an open mind."],"key":"keep an open mind","syn":["be open-minded","be receptive","withhold judgement"],"reg":"neutral","ielts":"yes","note":"Useful for education, travel and culture topics."},{"p":"now","m":"at the present time","d":"Adverb meaning at this moment or at the present period; also used to introduce a new point.","ex":["The population is now over ten million.","Now more people work from home than before."],"key":"now over ten million","syn":["currently","at present","these days"],"reg":"neutral","ielts":"careful","note":"Prefer 'currently' or 'at present' in formal essays."},{"p":"the last minute","m":"the final moments before a deadline or event","d":"Noun phrase, usually used as 'at the last minute', meaning just before the final deadline or event.","ex":["He changed his plans at the last minute.","Students often revise at the last minute."],"key":"at the last minute","syn":["at the eleventh hour","at the final moment","just in time"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; 'at the last minute' is common in letters."},{"p":"be in a mood","m":"feel bad-tempered or annoyed","d":"Idiom meaning to be in a bad or irritable emotional state.","ex":["My brother is in a mood after losing the game.","Don't talk to her now; she's in a mood."],"key":"is in a mood","syn":["be bad-tempered","be grumpy","be in a bad temper"],"reg":"informal","ielts":"no","note":"Spoken or friend letters only."},{"p":"more and more","m":"an increasing amount or number","d":"Adverbial or determiner phrase showing a continuing increase in quantity, degree or number.","ex":["More and more people are shopping online.","Cities are becoming more and more crowded."],"key":"More and more people","syn":["increasingly","a growing number of","ever more"],"reg":"neutral","ielts":"yes","note":"Good for describing trends; 'an increasing number of' is more formal."},{"p":"mother tongue","m":"the first language you learn as a child","d":"Noun phrase meaning the language a person learns from birth.","ex":["Her mother tongue is Spanish, but she speaks fluent English.","Children learn best in their mother tongue."],"key":"mother tongue","syn":["native language","first language","native tongue"],"reg":"neutral","ielts":"yes","note":"Common in language and education topics."},{"p":"your native language/tongue","m":"the language you spoke from birth","d":"Noun phrase meaning the first language of a person, learned naturally in childhood.","ex":["It is easier to express emotions in your native language.","Many migrants lose their native tongue over time."],"key":"your native language","syn":["mother tongue","first language","home language"],"reg":"neutral","ielts":"yes","note":"Useful for language and migration topics."},{"p":"no need","m":"it is not necessary","d":"Phrase meaning that something is unnecessary; often 'there is no need (for sb) to do sth'.","ex":["There is no need to book in advance.","There is no need for students to wear uniforms."],"key":"no need to book","syn":["unnecessary","not required","no call for"],"reg":"neutral","ielts":"yes","note":"Useful for arguing that a measure is unnecessary."},{"p":"be in need of sth","m":"require something","d":"Verb phrase meaning to require something because it is lacking or in poor condition.","ex":["Many schools are in need of repair.","The region is in need of fresh investment."],"key":"are in need of repair","syn":["require","be short of","be lacking"],"reg":"formal","ielts":"yes","note":"Good for social issues and infrastructure topics."},{"p":"steady/strong nerves","m":"the ability to stay calm under pressure","d":"Noun phrase describing calmness and courage in difficult or stressful situations.","ex":["Surgeons need steady nerves during long operations.","The job requires strong nerves and quick decisions."],"key":"steady nerves","syn":["a cool head","composure","calmness"],"reg":"neutral","ielts":"careful","note":"Good descriptive phrase for speaking about careers."},{"p":"after next","m":"following the next one","d":"Phrase used after a time noun to mean the one after the next, such as 'the week after next'.","ex":["The exam is the week after next.","We will meet the Friday after next."],"key":"the week after next","syn":["the one after","two weeks from now","in two weeks"],"reg":"neutral","ielts":"careful","note":"Useful in letters arranging dates."},{"p":"(be) in your nineties","m":"be aged between ninety and ninety-nine","d":"Phrase describing a person's age as being between 90 and 99 years.","ex":["My grandmother is in her nineties.","Many people in their nineties still live independently."],"key":"in her nineties","syn":["aged ninety-something","over ninety","very elderly"],"reg":"neutral","ielts":"yes","note":"Fine for ageing topics and age descriptions."},{"p":"the nineties","m":"the years 1990 to 1999","d":"Noun phrase referring to the decade from 1990 to 1999.","ex":["Internet use grew rapidly in the nineties.","Unemployment fell sharply during the nineties."],"key":"in the nineties","syn":["the 1990s","the last decade of the century","the 90s"],"reg":"neutral","ielts":"careful","note":"Write '1990s' in Task 1 for accuracy."},{"p":"no wonder","m":"it is not surprising","d":"Phrase used to show that something is easy to understand or expected given the facts.","ex":["No wonder the city is so crowded; rents are cheap.","It's no wonder many young people move abroad."],"key":"No wonder the city is so crowded","syn":["unsurprisingly","not surprisingly","understandably"],"reg":"informal","ielts":"careful","note":"Use 'unsurprisingly' in formal essays."},{"p":"not only","m":"used to add a first point before 'but also'","d":"Correlative phrase used with 'but also' to stress two related facts; may trigger inversion at sentence start.","ex":["Not only does exercise improve health, but it also reduces stress.","The course is not only cheap but also practical."],"key":"Not only does exercise improve health","syn":["as well as","both ... and","in addition to"],"reg":"neutral","ielts":"yes","note":"Inversion after 'Not only' shows grammatical range."},{"p":"not quite","m":"almost but not completely","d":"Adverbial phrase meaning not completely or not exactly.","ex":["The figures are not quite accurate.","The results were not quite as good as expected."],"key":"not quite accurate","syn":["not entirely","almost","not completely"],"reg":"neutral","ielts":"careful","note":"Useful for softening claims; use 'not entirely' in essays."},{"p":"nothing but","m":"only","d":"Phrase meaning only or nothing except, followed by a noun or infinitive without 'to'.","ex":["The area was nothing but desert.","He did nothing but complain all day."],"key":"nothing but desert","syn":["only","merely","just"],"reg":"neutral","ielts":"careful","note":"Strong wording; use cautiously in formal essays."},{"p":"be/have nothing to do with sb","m":"have no connection with someone or something","d":"Idiom meaning to have no connection or involvement with someone or something.","ex":["The company says it had nothing to do with the accident.","This problem has nothing to do with money."],"key":"had nothing to do with the accident","syn":["be unconnected with","have no connection with","not be involved in"],"reg":"neutral","ielts":"yes","note":"Useful for rejecting a supposed cause in Task 2."},{"p":"for nothing","m":"without payment or without result","d":"Adverbial phrase meaning free of charge, or without any useful result or purpose.","ex":["He fixed my laptop for nothing.","All their efforts were for nothing."],"key":"for nothing","syn":["free of charge","in vain","to no purpose"],"reg":"informal","ielts":"careful","note":"Better in speaking; use 'free of charge' or 'in vain' in essays."},{"p":"now and then","m":"sometimes but not often","d":"Adverbial phrase meaning occasionally, at irregular intervals.","ex":["I eat fast food now and then.","Heavy storms hit the coast now and then."],"key":"now and then","syn":["occasionally","from time to time","every so often"],"reg":"neutral","ielts":"careful","note":"Common in speaking about habits; 'occasionally' is better for writing."},{"p":"any day/minute/time, etc. now","m":"very soon","d":"Phrase meaning that something is expected to happen at any moment in the near future.","ex":["The baby is due any day now.","The results should arrive any minute now."],"key":"any day now","syn":["very soon","at any moment","shortly"],"reg":"informal","ielts":"no","note":"Spoken; useful in friend letters, not in essays."},{"p":"a number of sth","m":"several of something","d":"Quantifier meaning several or quite a few; takes a plural noun and plural verb.","ex":["A number of studies have shown a link between sleep and memory.","A number of factors explain the decline."],"key":"A number of studies","syn":["several","a range of","numerous"],"reg":"neutral","ielts":"yes","note":"Do not confuse with 'the number of', which takes a singular verb."},{"p":"be obliged to do sth","m":"have to do something because of a rule or duty","d":"Verb phrase meaning to be required by law, duty or circumstance to do something.","ex":["Employers are obliged to provide a safe workplace.","Drivers are obliged to wear seat belts."],"key":"are obliged to provide","syn":["be required to","be compelled to","have a duty to"],"reg":"formal","ielts":"yes","note":"Strong formal alternative to 'have to' in Task 2."},{"p":"be obsessed by/with sb/sth","m":"think about something too much","d":"Verb phrase meaning to think about or focus on someone or something excessively.","ex":["Many teenagers are obsessed with social media.","Society is obsessed by celebrity culture."],"key":"are obsessed with social media","syn":["be preoccupied with","be fixated on","be consumed by"],"reg":"neutral","ielts":"yes","note":"Useful for media and lifestyle topics; a strong, critical term."},{"p":"off duty","m":"not working at the moment","d":"Adjective or adverb phrase describing someone, especially a police officer or nurse, who is not on work time.","ex":["The nurse was off duty when the accident happened.","Police officers are rarely off duty during emergencies."],"key":"off duty","syn":["not working","on leave","off work"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about jobs."},{"p":"on offer","m":"available to buy or use; sold at a reduced price","d":"Phrase meaning available for people to buy, take or use, sometimes at a special price.","ex":["Several courses are on offer at the language school.","Cheap flights are on offer this month."],"key":"are on offer","syn":["available","for sale","provided"],"reg":"neutral","ielts":"yes","note":"Good for services and education topics."},{"p":"on duty","m":"at work; responsible for a job at that time","d":"Adjective or adverb phrase describing someone who is working or responsible for a task at the present time.","ex":["The doctor on duty examined the patient immediately.","Security guards must stay alert while on duty."],"key":"on duty","syn":["at work","working","on shift"],"reg":"neutral","ielts":"careful","note":"Useful for describing jobs in speaking."},{"p":"on top of sth","m":"in addition to something; in control of something","d":"Prepositional phrase meaning in addition to something, or managing a situation well.","ex":["On top of the rent, tenants pay for heating.","It is hard to stay on top of all my assignments."],"key":"On top of the rent","syn":["in addition to","as well as","besides"],"reg":"neutral","ielts":"careful","note":"Spoken flavour; use 'in addition to' in essays."},{"p":"(every) once in a while","m":"occasionally","d":"Adverbial phrase meaning sometimes, but not regularly.","ex":["Once in a while, I like to cook for friends.","Heavy snow falls every once in a while."],"key":"Once in a while","syn":["occasionally","from time to time","now and then"],"reg":"informal","ielts":"careful","note":"Fine in speaking; use 'occasionally' in writing."},{"p":"one by one","m":"separately, in order, each in turn","d":"Adverbial phrase meaning individually, in sequence, not all at once.","ex":["The students entered the hall one by one.","Small shops closed one by one."],"key":"one by one","syn":["individually","in turn","singly"],"reg":"neutral","ielts":"yes","note":"Useful in describing processes in Task 1."},{"p":"one at a time","m":"separately; not together","d":"Adverbial phrase meaning individually, with only one person or thing handled at once.","ex":["Please enter the room one at a time.","Tackle the problems one at a time."],"key":"one at a time","syn":["individually","one by one","separately"],"reg":"neutral","ielts":"yes","note":"Good for describing steps or managing tasks."},{"p":"one after another","m":"in a series, with little time between them","d":"Adverbial phrase meaning in quick succession, one following the other.","ex":["Factories closed one after another during the recession.","Problems arrived one after another."],"key":"one after another","syn":["in succession","consecutively","one by one"],"reg":"neutral","ielts":"yes","note":"Useful for describing a sequence of events."},{"p":"one way or another","m":"by some method or for some reason","d":"Adverbial phrase meaning somehow, by some means or in some form, not specifying which.","ex":["One way or another, the government must reduce emissions.","We will finish the project one way or another."],"key":"One way or another","syn":["somehow","by hook or by crook","in some form"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; occasionally in essays for emphasis."},{"p":"one way or the other","m":"in either case; in some manner","d":"Adverbial phrase meaning whichever of two possibilities happens, or in some way.","ex":["One way or the other, prices will have to rise.","Whether you agree or not, one way or the other, you must decide."],"key":"One way or the other","syn":["either way","in any case","regardless"],"reg":"neutral","ielts":"careful","note":"Useful for showing that the outcome is the same."},{"p":"I only hope (that) ... /I only wish ... (that)","m":"used to express a strong wish","d":"Pattern expressing a strong hope for the future (hope) or regret about a present or past situation (wish).","ex":["I only hope that the weather improves before the festival.","I only wish I had studied harder at school."],"key":"I only hope that the weather improves","syn":["I really hope","if only","let us hope"],"reg":"informal","ielts":"careful","note":"Good for conclusion of a General Training letter; not for essays."},{"p":"take the/this opportunity to do sth","m":"use a chance to do something","d":"Verb phrase meaning to use a favourable moment to do something, often in formal speeches or letters.","ex":["I would like to take this opportunity to thank you for your help.","Take the opportunity to practise your English abroad."],"key":"take this opportunity to thank you","syn":["make use of the chance to","seize the chance to","avail yourself of"],"reg":"formal","ielts":"yes","note":"Good for General Training formal letters."},{"p":"the other way round/around","m":"in the opposite order or direction","d":"Adverbial phrase meaning in the reverse position, order or direction.","ex":["Women earn less than men, not the other way round.","I thought he followed her, but it was the other way around."],"key":"the other way round","syn":["the reverse","vice versa","conversely"],"reg":"neutral","ielts":"yes","note":"Good for contrasting two relationships in Task 2."},{"p":"be out of sth","m":"have no more of something","d":"Verb phrase meaning to have used up or no longer have a supply of something.","ex":["We are out of milk, so I'll go to the shop.","The company is out of cash."],"key":"are out of milk","syn":["have run out of","be short of","have none left"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and letters; 'have run out of' for essays."},{"p":"out of control","m":"not able to be managed or limited","d":"Adjective or adverb phrase describing something that can no longer be directed or restrained.","ex":["The fire quickly got out of control.","Housing costs have spiralled out of control."],"key":"out of control","syn":["unmanageable","uncontrollable","spiralling"],"reg":"neutral","ielts":"yes","note":"Useful for describing worsening social problems."},{"p":"out of nowhere","m":"suddenly and unexpectedly","d":"Adverbial phrase meaning suddenly, with no warning, from an unknown source.","ex":["A car appeared out of nowhere and hit the bike.","The idea came to me out of nowhere."],"key":"out of nowhere","syn":["suddenly","unexpectedly","out of the blue"],"reg":"informal","ielts":"careful","note":"Storytelling in speaking; avoid in essays."},{"p":"be out of practice","m":"be less skilled because you have not done something recently","d":"Verb phrase meaning to be less good at an activity because of a lack of recent practice.","ex":["I'm out of practice at playing the piano.","Many students are out of practice at writing by hand."],"key":"out of practice at playing","syn":["be rusty","be unpractised","lack recent practice"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about skills and hobbies."},{"p":"out of stock","m":"not available in a shop at the moment","d":"Adjective phrase meaning that a shop has no more of a product available.","ex":["The model you want is currently out of stock.","Several items were out of stock during the sale."],"key":"out of stock","syn":["sold out","unavailable","not in supply"],"reg":"neutral","ielts":"careful","note":"Useful in complaint letters."},{"p":"the outside","m":"the outer part or surface of something","d":"Noun phrase meaning the outer surface of something, or the world beyond a place.","ex":["The outside of the house needs painting.","Prisoners have little contact with the outside."],"key":"The outside of the house","syn":["the exterior","the outer surface","the external part"],"reg":"neutral","ielts":"yes","note":"Useful in descriptions of buildings and diagrams."},{"p":"over and over (again)","m":"many times","d":"Adverbial phrase meaning repeatedly, many times, often suggesting annoyance or emphasis.","ex":["She read the letter over and over again.","Governments repeat the same mistakes over and over."],"key":"over and over again","syn":["repeatedly","time after time","again and again"],"reg":"neutral","ielts":"careful","note":"Use 'repeatedly' for formal essays."},{"p":"owe sb an apology/explanation/favour, etc.","m":"need to give someone something because of an earlier action","d":"Verb pattern: owe + person + noun, meaning to have a duty to give something such as an apology.","ex":["I owe you an apology for missing the meeting.","The company owes its customers an explanation."],"key":"owe you an apology","syn":["be indebted to","have an obligation to","be bound to give"],"reg":"neutral","ielts":"yes","note":"Useful in complaint and apology letters."},{"p":"have/play a part in sth","m":"be involved in or help cause something","d":"Verb phrase meaning to be involved in an event or process and to affect how it develops.","ex":["Diet has a part in many health problems.","Teachers play a part in shaping children's attitudes."],"key":"has a part in many health problems","syn":["contribute to","be involved in","play a role in"],"reg":"neutral","ielts":"yes","note":"Safe, flexible phrase for causes and responsibility in Task 2."},{"p":"pass a law","m":"officially approve a new law","d":"Verb phrase meaning to formally approve a law, usually by a government or parliament.","ex":["Parliament passed a law banning smoking in public places.","Governments should pass laws to protect the environment."],"key":"passed a law banning smoking","syn":["enact legislation","introduce a law","legislate"],"reg":"formal","ielts":"yes","note":"Common in Task 2 about government solutions."},{"p":"pay sb/sth a visit or pay a visit to sb/sth","m":"go to see someone or a place","d":"Verb phrase meaning to visit a person or place, usually fairly formal or polite.","ex":["We paid a visit to the old castle.","I plan to pay my grandparents a visit next week."],"key":"paid a visit to the old castle","syn":["visit","call on","drop by"],"reg":"formal","ielts":"yes","note":"Fine for General Training letters and speaking."},{"p":"the perfect (tense)","m":"the verb form showing completed action with 'have'","d":"Grammar term for verb forms made with have and a past participle, showing action completed before a time.","ex":["The present perfect tense links past events to the present.","Students often confuse the perfect with the simple past."],"key":"The present perfect tense","syn":["perfect aspect","the perfect form","have + past participle"],"reg":"formal","ielts":"careful","note":"A grammar term; useful when discussing language learning."},{"p":"a pile of/ piles of sth","m":"a large heap of things","d":"Noun phrase meaning a heap of objects stacked on top of one another, or informally a large amount.","ex":["There was a pile of books on his desk.","Piles of rubbish lined the streets."],"key":"a pile of books","syn":["a heap of","a stack of","a mound of"],"reg":"neutral","ielts":"careful","note":"Descriptive; useful in speaking Part 2."},{"p":"pitch a tent","m":"put up a tent","d":"Verb phrase meaning to erect a tent in a camping place.","ex":["We pitched a tent beside the lake.","It is easy to pitch a tent in dry weather."],"key":"pitched a tent","syn":["put up a tent","set up camp","erect a tent"],"reg":"neutral","ielts":"careful","note":"Useful for describing camping trips in speaking."},{"p":"take sb's place","m":"replace someone","d":"Verb phrase meaning to replace someone or do their job or role instead.","ex":["A younger engineer took his place after he retired.","Robots may take workers' places in factories."],"key":"took his place","syn":["replace","stand in for","substitute for"],"reg":"neutral","ielts":"yes","note":"Useful for automation and job topics."},{"p":"place sth in/on, etc.","m":"put something carefully in a position","d":"Verb pattern: place + object + preposition, meaning to put something in a particular position with care.","ex":["Place the samples on a clean surface.","The government placed restrictions on imports."],"key":"Place the samples on a clean surface","syn":["put","position","set"],"reg":"formal","ielts":"yes","note":"'Place restrictions on' works well in Task 2."},{"p":"plant a bomb","m":"hide an explosive device somewhere","d":"Verb phrase meaning to put a bomb secretly in a place so that it will explode.","ex":["Two men were arrested for planting a bomb at the station.","Police believe someone planted a bomb in the building."],"key":"planting a bomb","syn":["set a bomb","hide an explosive","place an explosive"],"reg":"neutral","ielts":"careful","note":"Relevant to crime and terrorism topics only."},{"p":"play a joke/trick on sb","m":"do something to make someone look foolish for fun","d":"Verb phrase meaning to do something amusing to trick someone, usually harmlessly.","ex":["The children played a trick on their teacher.","He loved to play jokes on his friends."],"key":"played a trick on their teacher","syn":["prank","fool","tease"],"reg":"informal","ielts":"careful","note":"Fine for speaking stories and friend letters."},{"p":"play a part in sth","m":"be involved in something and affect it","d":"Verb phrase meaning to contribute to or influence an event or process.","ex":["Social media plays a part in shaping public opinion.","Genetics plays a part in many illnesses."],"key":"plays a part in shaping","syn":["play a role in","contribute to","be involved in"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 for causes and influence."},{"p":"the point","m":"the main idea or purpose","d":"Noun phrase meaning the central idea, purpose or most important part of something.","ex":["The point of education is to prepare people for life.","I don't see the point of banning cars."],"key":"The point of education","syn":["the purpose","the main idea","the aim"],"reg":"neutral","ielts":"yes","note":"'The point is that' introduces a key argument."},{"p":"be at/on the point of doing sth","m":"be about to do something","d":"Verb phrase meaning to be just about to do something in the very near future.","ex":["She was on the point of leaving when the phone rang.","The company is at the point of collapse."],"key":"on the point of leaving","syn":["be about to","be on the verge of","be on the brink of"],"reg":"formal","ielts":"yes","note":"Good formal alternative to 'be about to'."},{"p":"up to a point","m":"partly but not completely","d":"Adverbial phrase meaning to some degree but not fully, used to limit agreement.","ex":["I agree with this view up to a point.","Money can buy happiness up to a point."],"key":"up to a point","syn":["to some extent","partly","in part"],"reg":"neutral","ielts":"yes","note":"Useful to show a balanced view in Task 2."},{"p":"be poor in sth","m":"have little of a useful substance or quality","d":"Verb phrase meaning to contain little of something useful, such as minerals or vitamins.","ex":["The soil in this region is poor in nutrients.","Fast food is poor in vitamins."],"key":"is poor in nutrients","syn":["be lacking in","be deficient in","be low in"],"reg":"formal","ielts":"yes","note":"Useful for health, diet and environment topics."},{"p":"pop in/out/over, etc.","m":"go somewhere quickly for a short time","d":"Informal phrasal verb pattern: pop + adverb, meaning to go somewhere briefly or visit informally.","ex":["I'll pop in to see you after work.","She popped out to buy some milk."],"key":"pop in to see you","syn":["drop in","nip out","call in"],"reg":"informal","ielts":"no","note":"Fine for friend letters; avoid in essays."},{"p":"whenever possible","m":"at any time when it can be done","d":"Adverbial phrase meaning every time it is possible, often in advice or rules.","ex":["Use public transport whenever possible.","Governments should recycle waste whenever possible."],"key":"whenever possible","syn":["as often as possible","where feasible","if at all possible"],"reg":"neutral","ielts":"yes","note":"Good in recommendations in Task 2."},{"p":"wherever possible","m":"in every place where it can be done","d":"Adverbial phrase meaning in all situations or places where it can be achieved.","ex":["Companies should use renewable energy wherever possible.","Wherever possible, cities should protect green spaces."],"key":"wherever possible","syn":["where feasible","in every possible case","as far as possible"],"reg":"neutral","ielts":"yes","note":"Useful for recommendations in Task 2."},{"p":"pour into/out/from, etc.","m":"flow quickly in large amounts","d":"Verb pattern: pour + preposition, meaning to flow in a steady stream, or to move in large numbers.","ex":["Fans poured into the stadium before the match.","Smoke poured from the factory chimneys."],"key":"poured into the stadium","syn":["flood into","stream into","flow"],"reg":"neutral","ielts":"careful","note":"Vivid; good for speaking, sparingly in essays."},{"p":"to be precise","m":"used to give exact information","d":"Parenthetical phrase used to add exact details to a statement.","ex":["The country has fifty million people, or 51 million to be precise.","It happened in 1995, to be precise."],"key":"to be precise","syn":["to be exact","specifically","strictly speaking"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for adding exact figures."},{"p":"be prepared to do sth","m":"be willing or ready to do something","d":"Verb phrase meaning to be willing to do something, or to have made preparations for it.","ex":["Employees must be prepared to work at weekends.","Governments should be prepared to invest in education."],"key":"be prepared to work","syn":["be willing to","be ready to","be set to"],"reg":"neutral","ielts":"yes","note":"Useful for requirements and responsibilities in Task 2."},{"p":"the press","m":"newspapers and journalists","d":"Collective noun for newspapers, magazines and the journalists who work for them.","ex":["The story was widely covered in the press.","The press has a duty to report the truth."],"key":"in the press","syn":["the media","journalists","newspapers"],"reg":"neutral","ielts":"yes","note":"Common in media topics in Task 2."},{"p":"put pressure on sb","m":"try to force someone to do something","d":"Verb phrase meaning to try to make someone do something by using persuasion or force.","ex":["Parents often put pressure on children to succeed.","Voters put pressure on the government to cut taxes."],"key":"put pressure on children","syn":["pressure","push","coerce"],"reg":"neutral","ielts":"yes","note":"Useful for education, work and politics topics."},{"p":"pretty much/well","m":"almost; nearly","d":"Informal adverbial phrase meaning almost, used to show that something is nearly true.","ex":["The work is pretty much finished.","They are pretty well the same size."],"key":"pretty much finished","syn":["almost","more or less","virtually"],"reg":"informal","ielts":"no","note":"Spoken; use 'almost' or 'virtually' in essays."},{"p":"the pros and cons","m":"the advantages and disadvantages","d":"Noun phrase meaning the arguments for and against something.","ex":["We must weigh the pros and cons before deciding.","The essay discusses the pros and cons of nuclear power."],"key":"the pros and cons","syn":["advantages and disadvantages","benefits and drawbacks","merits and demerits"],"reg":"neutral","ielts":"careful","note":"Common; prefer 'advantages and disadvantages' in formal essays."},{"p":"promise to be sth","m":"seem likely to become something","d":"Verb pattern: promise + to be + adjective/noun, meaning to show signs of becoming something.","ex":["The match promises to be exciting.","The new policy promises to be popular."],"key":"promises to be exciting","syn":["look set to be","be likely to be","show promise of being"],"reg":"neutral","ielts":"careful","note":"Good for predictions; use with caution in Task 1."},{"p":"keep/break a promise","m":"do or fail to do what you said","d":"Verb phrase meaning to do, or fail to do, what you have promised.","ex":["Leaders who break a promise lose public trust.","She always keeps a promise."],"key":"break a promise","syn":["honour a pledge","go back on your word","renege on a promise"],"reg":"neutral","ielts":"yes","note":"Useful for politics and trust topics."},{"p":"propose to do sth","m":"plan or suggest doing something","d":"Verb pattern: propose + to-infinitive, meaning to intend to do something, or to suggest a plan.","ex":["The council proposes to build a new library.","I propose to examine three main causes."],"key":"proposes to build a new library","syn":["intend to","plan to","suggest"],"reg":"formal","ielts":"yes","note":"Good in essay introductions: 'This essay proposes to...'."},{"p":"be too proud (to do sth)","m":"refuse to do something because of your pride","d":"Adjective phrase meaning too self-respecting to accept help or admit a mistake.","ex":["He was too proud to ask for help.","Some patients are too proud to accept charity."],"key":"too proud to ask for help","syn":["be too stubborn to","be unwilling to","be too arrogant to"],"reg":"neutral","ielts":"careful","note":"Useful in speaking and character descriptions."},{"p":"in public","m":"where other people can see or hear you","d":"In a place or situation where people in general can see or hear; opposite of 'in private'.","ex":["She felt embarrassed when he criticised her in public.","Smoking in public places is banned in many countries."],"key":"in public","syn":["openly","publicly","in front of others"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 on privacy, behaviour and public health laws."},{"p":"pull yourself along/up, etc.","m":"move your own body in a direction by pulling","d":"To move your body in a particular direction by pulling with your arms or something you hold; pattern: pull yourself + adverb/preposition.","ex":["He pulled himself up onto the ledge and caught his breath.","The injured climber pulled himself along the rope to safety."],"key":"pulled himself up","syn":["haul yourself up","drag yourself along","heave yourself up"],"reg":"neutral","ielts":"no","note":"Narrative or physical description; rarely needed in essays, fine in speaking stories."},{"p":"push (sb) for sth/to do sth","m":"try hard to make someone agree to or do something","d":"To press or strongly urge someone to provide something or take action; pattern: push (sb) for sth / push (sb) to do sth.","ex":["Environmental groups are pushing the government for stricter emission limits.","Teachers pushed the board to introduce smaller classes."],"key":"pushing the government for","syn":["press for","lobby for","urge","campaign for"],"reg":"neutral","ielts":"yes","note":"Good for Task 2 when describing campaigns, governments or pressure groups."},{"p":"range from sth to sth/between sth and s h","m":"include things from one limit to another","d":"To vary or extend between two limits or extremes; pattern: range from A to B / range between A and B.","ex":["Ticket prices range from ten dollars to fifty dollars.","The ages of participants ranged between eighteen and sixty."],"key":"range from ten dollars to fifty dollars","syn":["vary from ... to","extend from ... to","span"],"reg":"neutral","ielts":"yes","note":"Excellent for Task 1 to describe ranges in data."},{"p":"reach a decision/agreement/conclusion, etc.","m":"arrive at a decision, agreement or final opinion","d":"To arrive at a final decision, agreement or judgement after discussion or thought; pattern: reach + decision/agreement/conclusion.","ex":["After hours of talks, the two sides finally reached an agreement.","It is difficult to reach a firm conclusion without more evidence."],"key":"reached an agreement","syn":["come to a decision","arrive at a conclusion","settle on","strike a deal"],"reg":"neutral","ielts":"yes","note":"Strong collocation for Task 2 conclusions and discussion of negotiations."},{"p":"the reality/realities of sth","m":"the true and often difficult facts of something","d":"The actual, often unpleasant facts or conditions of a situation, as opposed to ideas about it; usually followed by 'of'.","ex":["Many graduates are shocked by the realities of working life.","The reality of climate change is now accepted by most governments."],"key":"the realities of working life","syn":["the truth about","the actual situation of","the facts of"],"reg":"neutral","ielts":"yes","note":"Useful for contrasting ideals with real conditions in Task 2."},{"p":"become a reality","m":"change from an idea into something real","d":"To start to exist in the real world after being only a plan, hope or dream.","ex":["After years of planning, the high-speed railway has finally become a reality.","Free healthcare for all could become a reality within a decade."],"key":"become a reality","syn":["come true","materialise","be realised"],"reg":"neutral","ielts":"yes","note":"Good for describing plans, technology and future predictions."},{"p":"reasonably good/successful/well, etc.","m":"fairly or quite good, but not perfect","d":"Used before an adjective or adverb to mean moderately or fairly; pattern: reasonably + adjective/adverb.","ex":["The new policy has been reasonably successful so far.","She did reasonably well in the exam despite little preparation."],"key":"reasonably successful","syn":["fairly","quite","moderately","relatively"],"reg":"neutral","ielts":"yes","note":"Handy hedging adverb for balanced evaluations in Task 2."},{"p":"with/in reference to sth","m":"about or concerning something","d":"A formal phrase used to say what you are writing or talking about; pattern: with/in reference to + noun.","ex":["I am writing with reference to your advertisement in yesterday's newspaper.","In reference to the figures above, sales rose sharply."],"key":"with reference to","syn":["regarding","concerning","with regard to","in connection with"],"reg":"formal","ielts":"yes","note":"Perfect opening for formal General Training letters."},{"p":"as regards sth","m":"concerning or about something","d":"A formal expression used to introduce the topic you are talking about; pattern: as regards + noun.","ex":["As regards the cost, we will need further details.","The two cities are very similar as regards population."],"key":"As regards the cost","syn":["regarding","concerning","as for","with respect to"],"reg":"formal","ielts":"yes","note":"Formal topic introducer; use sparingly in essays and formal letters."},{"p":"in/with regard to sth","m":"about or concerning something","d":"A formal phrase used to show the subject you are referring to; pattern: in/with regard to + noun.","ex":["With regard to your complaint, we have investigated the matter.","The law is unclear in regard to online privacy."],"key":"With regard to","syn":["regarding","concerning","in relation to","with respect to"],"reg":"formal","ielts":"yes","note":"Common in formal letters and Task 2; do not write 'in regards to'."},{"p":"relatively good/bad/cheap, etc.","m":"quite good or bad when compared with others","d":"Used before an adjective to show a quality is moderate when compared with something else; pattern: relatively + adjective.","ex":["Housing in the region is relatively cheap compared with the capital.","Unemployment remained relatively low throughout the decade."],"key":"relatively cheap","syn":["comparatively","fairly","rather","moderately"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 1 to compare figures cautiously."},{"p":"remain a secret/mystery, etc.","m":"stay unknown or unexplained","d":"To continue to be something unknown or unexplained; pattern: remain + noun complement.","ex":["The cause of the fire remains a mystery.","The location of the treasure has remained a secret for centuries."],"key":"remains a mystery","syn":["stay unknown","continue to be unexplained","stay hidden"],"reg":"neutral","ielts":"yes","note":"Good for describing unresolved questions in science or history topics."},{"p":"remain at/in/with, etc.","m":"stay in a place or with a person or group","d":"To continue to be in a place, state or position without leaving or changing; pattern: remain + preposition.","ex":["Prices remained at the same level for three years.","Many elderly people prefer to remain in their own homes."],"key":"remained at the same level","syn":["stay at","stay in","continue to be at"],"reg":"neutral","ielts":"yes","note":"Excellent for Task 1 to describe stable trends: 'remained at 20%'."},{"p":"require sb to do sth","m":"officially make someone do something","d":"To make it necessary or compulsory for someone to do something, often by law or rule; pattern: require sb to do sth.","ex":["The law requires employers to provide safety equipment.","Students are required to attend at least eighty percent of lectures."],"key":"requires employers to provide","syn":["oblige sb to do","compel sb to do","make it compulsory for"],"reg":"formal","ielts":"yes","note":"Formal verb for laws and rules in Task 2."},{"p":"with respect to sth","m":"about or concerning something","d":"A formal phrase meaning concerning or in relation to a particular subject; pattern: with respect to + noun.","ex":["With respect to safety, the new design is far superior.","Men and women differ greatly with respect to career choices."],"key":"With respect to safety","syn":["regarding","with regard to","in relation to","concerning"],"reg":"formal","ielts":"yes","note":"Formal topic marker; good for narrowing the focus in an essay."},{"p":"take/accept/claim responsibility for sth","m":"say that you are the one who is to blame or in charge","d":"To admit or state that you are the cause of or in charge of something; pattern: take/accept/claim responsibility for sth.","ex":["The company accepted responsibility for the oil spill.","Parents should take responsibility for their children's behaviour."],"key":"accepted responsibility for","syn":["admit liability for","be accountable for","answer for"],"reg":"neutral","ielts":"yes","note":"Very common in Task 2 on duties of governments, parents and companies."},{"p":"rest your eyes/feet/legs, etc.","m":"stop using part of your body so it can relax","d":"To stop using part of the body for a time so that it can recover from tiredness; pattern: rest + your + body part.","ex":["After the long walk, we stopped to rest our feet.","Looking away from the screen regularly helps you rest your eyes."],"key":"rest our feet","syn":["relax your eyes","give your legs a break","take the weight off your feet"],"reg":"neutral","ielts":"careful","note":"Fine in speaking about health habits; seldom needed in formal essays."},{"p":"return to sth","m":"go back to a place, state or activity","d":"To go or come back to a place, situation, activity or topic; pattern: return to + noun.","ex":["Many workers hope to return to normal life after the crisis.","Let me return to my first point."],"key":"return to normal life","syn":["go back to","revert to","come back to"],"reg":"neutral","ielts":"yes","note":"Useful for referring back to earlier ideas or describing recovery in trends."},{"p":"in return","m":"as payment or reward for something","d":"As something given or done in exchange for what has been received.","ex":["Volunteers receive free training in return.","He offered to help her and asked for nothing in return."],"key":"in return","syn":["in exchange","in repayment","as compensation"],"reg":"neutral","ielts":"yes","note":"Good for discussing exchange, taxes and benefits; often with 'for sth'."},{"p":"take a risk","m":"do something that might have a bad result","d":"To do something although there is a chance of a bad or dangerous outcome.","ex":["Entrepreneurs often have to take a risk to build successful companies.","It is unwise to take a risk with your health."],"key":"take a risk","syn":["run a risk","gamble","take a chance","risk it"],"reg":"neutral","ielts":"yes","note":"Common in Task 2 on business, young people and adventure; also 'take risks'."},{"p":"roll (sth) across/around/over, etc.","m":"move by turning over and over in a direction","d":"To move, or make something move, by turning over and over; pattern: roll (sth) + preposition/adverb.","ex":["The ball rolled across the road and under a parked car.","He rolled the barrel over the grass to the shed."],"key":"rolled across the road","syn":["trundle across","turn over","spin along"],"reg":"neutral","ielts":"no","note":"Descriptive physical movement; not needed in essays."},{"p":"roll down/in/off, etc.","m":"move along by turning over in a direction","d":"To move in a particular direction while turning over and over, or (of vehicles/products) to move out or along; pattern: roll + adverb/preposition.","ex":["Tears rolled down her cheeks as she listened.","New cars roll off the production line every minute."],"key":"rolled down her cheeks","syn":["run down","trickle down","come off"],"reg":"neutral","ielts":"careful","note":"'Roll off the production line' suits Task 1 on manufacturing; otherwise descriptive."},{"p":"round and round","m":"moving in circles again and again","d":"Moving in a circle many times, or repeating without making progress.","ex":["The children ran round and round the garden.","My thoughts went round and round all night."],"key":"round and round","syn":["in circles","over and over","again and again"],"reg":"informal","ielts":"no","note":"Spoken or narrative; avoid in academic writing."},{"p":"rub sth into/on, etc.","m":"press and move something against a surface","d":"To press and move something, such as cream, against a surface with your hand; pattern: rub sth into/on/over sth.","ex":["She rubbed the cream into her hands before bed.","Rub some oil on the wood to protect it."],"key":"rubbed the cream into","syn":["massage into","work into","smear on"],"reg":"neutral","ielts":"no","note":"Everyday physical action; useful only in speaking descriptions or instructions."},{"p":"in the long run","m":"after a long time; as the final result","d":"Over a long period of time, or as a final result in the future.","ex":["Investing in education saves money in the long run.","Cheap products often cost more in the long run."],"key":"in the long run","syn":["in the long term","eventually","ultimately","over time"],"reg":"neutral","ielts":"yes","note":"Very useful in Task 2 to discuss long-term effects and conclusions."},{"p":"rush to do sth","m":"hurry to do something quickly","d":"To hurry to do something, often without thinking enough; pattern: rush to do sth.","ex":["Shoppers rushed to buy the discounted tickets.","Governments should not rush to introduce new laws without research."],"key":"rushed to buy","syn":["hurry to do","hasten to do","race to do"],"reg":"neutral","ielts":"yes","note":"Good for criticising hasty decisions in Task 2."},{"p":"the sack","m":"dismissal from a job","d":"Informal British term for being dismissed from employment; usually 'get/give sb the sack'.","ex":["He got the sack for repeatedly arriving late.","Many workers fear the sack during an economic downturn."],"key":"got the sack","syn":["dismissal","the boot","the axe"],"reg":"informal","ielts":"no","note":"Use 'dismissal' or 'be dismissed' in essays; fine in speaking."},{"p":"for the sake of sb/sth; for sb's/sth's sake","m":"to help or benefit someone or something","d":"Out of consideration for or in order to benefit or achieve something; pattern: for the sake of sb/sth.","ex":["Many parents stay together for the sake of their children.","Cities should limit traffic for the sake of public health."],"key":"for the sake of their children","syn":["in the interest of","for the benefit of","on behalf of"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 to state a purpose or justification."},{"p":"the same","m":"exactly alike, not different","d":"Used to refer to something that is identical or unchanged; often 'the same as' or alone as a pronoun.","ex":["The two schools offer the same courses at the same price.","I feel the same about the proposal as you do."],"key":"the same courses","syn":["identical","alike","equal"],"reg":"neutral","ielts":"yes","note":"Useful for Task 1 comparisons: 'remained the same', 'the same as'."},{"p":"save a goal","m":"stop the ball going into your goal","d":"In sports such as football, to stop the ball from going into the goal, usually as goalkeeper.","ex":["The goalkeeper saved a goal in the last minute.","She dived to the left to save a goal from a penalty."],"key":"saved a goal","syn":["make a save","stop a shot","block a shot"],"reg":"neutral","ielts":"no","note":"Sport vocabulary; only useful in speaking about football or hobbies."},{"p":"be said to be","m":"be described by people as being something","d":"Used to report what people generally believe or claim about someone or something; pattern: be said to be + noun/adjective.","ex":["The region is said to be rich in natural resources.","Coffee is said to be good for concentration."],"key":"is said to be","syn":["be reported to be","be believed to be","be claimed to be","be considered"],"reg":"neutral","ielts":"yes","note":"Safe way to present claims without committing to them in Task 2."},{"p":"the club/gay/music, etc. scene","m":"the world of activities around a certain interest","d":"The activities, people and places connected with a particular interest or lifestyle, especially in a city.","ex":["The city has a lively music scene with dozens of small venues.","She became part of the London club scene in her twenties."],"key":"a lively music scene","syn":["the world of","the culture of","the circuit"],"reg":"informal","ielts":"careful","note":"Fine for speaking about culture and cities; use 'cultural life' in essays."},{"p":"be seated","m":"be sitting down","d":"To be sitting, or to be given a seat, often in formal situations.","ex":["Guests were seated at long tables in the hall.","Please be seated until the speaker arrives."],"key":"were seated","syn":["sit","take a seat","be placed"],"reg":"formal","ielts":"careful","note":"Formal; mainly for describing events or speaking about ceremonies."},{"p":"the secret","m":"the key way of achieving something","d":"The best or hidden method by which something is achieved; usually 'the secret of/to sth'.","ex":["Regular practice is the secret of learning a language.","Many people ask what the secret to a long life is."],"key":"the secret of learning","syn":["the key","the formula","the trick"],"reg":"neutral","ielts":"careful","note":"Good in speaking; in essays prefer 'the key factor'."},{"p":"It seems...","m":"it appears that something is true","d":"Used to introduce an impression or conclusion based on available evidence; pattern: It seems (that) + clause.","ex":["It seems that more young people are choosing to study abroad.","It seems unlikely that prices will fall soon."],"key":"It seems that","syn":["It appears that","It looks as if","Apparently"],"reg":"neutral","ielts":"yes","note":"Useful for cautious claims in Task 1 and Task 2."},{"p":"seize a chance/opportunity","m":"quickly take an opportunity when it appears","d":"To take advantage of a chance quickly and eagerly; pattern: seize + chance/opportunity.","ex":["Young entrepreneurs must seize every opportunity that arises.","She seized the chance to study overseas."],"key":"seize every opportunity","syn":["grasp an opportunity","jump at a chance","take advantage of"],"reg":"neutral","ielts":"yes","note":"Good for Task 2 about careers, education and globalisation."},{"p":"take sb/sth seriously","m":"treat someone or something as important","d":"To treat a person, idea or problem as important and worth careful attention; pattern: take sb/sth seriously.","ex":["Governments must take climate change seriously.","Employers should take complaints from staff seriously."],"key":"take climate change seriously","syn":["treat as important","give serious consideration to","regard as significant"],"reg":"neutral","ielts":"yes","note":"Strong phrase for arguments about problems needing action."},{"p":"set a record","m":"do better than anyone has done before","d":"To achieve a higher, faster or better result than any previously recorded; pattern: set a (new) record.","ex":["The athlete set a record in the hundred metres.","Global temperatures set a record last summer."],"key":"set a record","syn":["break a record","achieve a best ever","set a new standard"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 for peaks: 'prices set a record in 2020'."},{"p":"(be) in your seventies","m":"be aged between seventy and seventy-nine","d":"Used to say a person's age is between seventy and seventy-nine.","ex":["My grandfather is in his seventies and still plays tennis.","Many people in their seventies now use smartphones."],"key":"in his seventies","syn":["aged 70 to 79","septuagenarian","in their seventies"],"reg":"neutral","ielts":"yes","note":"Handy for age groups in Task 1 and speaking about family."},{"p":"the seventies","m":"the years 1970 to 1979","d":"The decade from 1970 to 1979, or ages 70 to 79.","ex":["Oil prices rose dramatically in the seventies.","Cheap air travel began to expand after the seventies."],"key":"in the seventies","syn":["the 1970s","the decade 1970-1979"],"reg":"neutral","ielts":"yes","note":"In Task 1 write '1970s' with digits for clarity and accuracy."},{"p":"shake your head","m":"move your head from side to side to say no","d":"To move the head from side to side, usually to show disagreement, refusal or disbelief.","ex":["She shook her head when asked if she wanted more.","He shook his head in disbelief at the news."],"key":"shook her head","syn":["nod in disagreement","signal no","express disapproval"],"reg":"neutral","ielts":"careful","note":"Good for narrative and speaking; rarely used in academic essays."},{"p":"in good/bad, etc. shape","m":"in good or bad physical or general condition","d":"In a particular state of health, fitness or condition; pattern: in + adjective + shape.","ex":["He is in excellent shape for a man of sixty.","The roads are in terrible shape after the storms."],"key":"in excellent shape","syn":["in good condition","in fit state","in good health"],"reg":"neutral","ielts":"careful","note":"Fine for speaking about health or objects; slightly informal for essays."},{"p":"keep in shape","m":"stay healthy and physically fit","d":"To stay physically fit through exercise and healthy habits.","ex":["Many people join gyms to keep in shape.","Walking to work is an easy way to keep in shape."],"key":"keep in shape","syn":["stay fit","keep fit","stay healthy"],"reg":"neutral","ielts":"yes","note":"Common in speaking and health essays; 'stay fit' also works."},{"p":"in the short term","m":"during the near future, not for long","d":"Over a brief period of time from now, rather than in the distant future.","ex":["Tax cuts may help the economy in the short term.","In the short term, the new rules will increase costs."],"key":"in the short term","syn":["in the near future","temporarily","over a brief period"],"reg":"neutral","ielts":"yes","note":"Pair with 'in the long term' for balanced Task 2 arguments."},{"p":"why should/shouldn't...?","m":"a question asking for a reason or arguing against something","d":"Used to question the reason for something or to argue that it is right or wrong; pattern: why should/shouldn't + subject + verb?","ex":["Why should taxpayers fund private companies?","Why shouldn't students choose their own subjects?"],"key":"Why should taxpayers fund","syn":["what reason is there for","what justifies","is there any reason why"],"reg":"informal","ielts":"careful","note":"Rhetorical questions are fine in speaking; use sparingly in essays."},{"p":"keep your mouth shut","m":"say nothing, especially about a secret","d":"Informal expression meaning to stay silent or not reveal something; can sound rude.","ex":["I told him to keep his mouth shut about the surprise.","She decided to keep her mouth shut during the meeting."],"key":"keep his mouth shut","syn":["stay quiet","say nothing","hold your tongue"],"reg":"informal","ielts":"no","note":"Spoken and rude; use 'remain silent' in writing."},{"p":"be sick of sth","m":"be tired of something and annoyed by it","d":"To be bored or annoyed by something that has gone on too long; pattern: be sick of sth/doing sth.","ex":["I am sick of the constant noise from the road.","Many commuters are sick of delayed trains."],"key":"am sick of","syn":["be fed up with","be tired of","be weary of"],"reg":"informal","ielts":"no","note":"Fine in speaking Part 1; use 'dissatisfied with' in essays."},{"p":"side by side","m":"next to each other","d":"Close together and next to one another, or existing together in harmony.","ex":["The two communities live side by side in peace.","They walked side by side along the beach."],"key":"side by side","syn":["next to each other","alongside","together"],"reg":"neutral","ielts":"yes","note":"Useful for coexistence of old and new, or cultures in Task 2."},{"p":"the sight of sb/sth","m":"the act of seeing someone or something","d":"The act of seeing a person or thing, often causing a reaction; pattern: the sight of sb/sth.","ex":["The sight of the empty shelves worried the shoppers.","She felt sick at the sight of blood."],"key":"The sight of the empty shelves","syn":["seeing","the view of","the appearance of"],"reg":"neutral","ielts":"careful","note":"More narrative; good for speaking descriptions of reactions."},{"p":"no sign of sb/sth","m":"nothing shows that someone or something is there","d":"Used to say there is no evidence that a person or thing exists, is present or is happening.","ex":["There is no sign of improvement in the housing market.","Rescuers found no sign of the missing hikers."],"key":"no sign of improvement","syn":["no trace of","no evidence of","no indication of"],"reg":"neutral","ielts":"yes","note":"Useful in Task 1 or 2 for trends that fail to appear."},{"p":"Dear Sir","m":"formal opening for a letter to a man you do not know","d":"A formal salutation used to begin a letter to a man whose name is not known.","ex":["Dear Sir, I am writing to apply for the position advertised online.","Dear Sir, I wish to complain about the service I received."],"key":"Dear Sir","syn":["Dear Sir or Madam","To whom it may concern"],"reg":"formal","ielts":"yes","note":"Use 'Dear Sir or Madam' in formal General Training letters; end 'Yours faithfully'."},{"p":"(be) in your sixties","m":"be aged between sixty and sixty-nine","d":"Used to say a person's age is between sixty and sixty-nine.","ex":["My neighbour is in his sixties and runs every morning.","Many people in their sixties are choosing to work longer."],"key":"in his sixties","syn":["aged 60 to 69","in their sixties"],"reg":"neutral","ielts":"yes","note":"Good for age groups in Task 1 charts and speaking about people."},{"p":"the sixties","m":"the years 1960 to 1969","d":"The decade from 1960 to 1969, or ages 60 to 69.","ex":["Pop music changed dramatically in the sixties.","Car ownership rose quickly after the sixties."],"key":"in the sixties","syn":["the 1960s","the decade 1960-1969"],"reg":"neutral","ielts":"yes","note":"In Task 1 write '1960s' with digits for precision."},{"p":"slam sth down/onto/into, etc.","m":"put something down very hard and noisily","d":"To put or throw something down with great force, making a loud noise; pattern: slam sth + preposition/adverb.","ex":["He slammed the phone down and walked out of the room.","She slammed her books onto the desk in anger."],"key":"slammed the phone down","syn":["bang down","crash down","throw down"],"reg":"neutral","ielts":"no","note":"Narrative action verb; not for essays."},{"p":"slide (sth) across/down/along, etc.","m":"move smoothly over a surface","d":"To move smoothly over a surface, or to make something do so; pattern: slide (sth) + preposition/adverb.","ex":["The children slid down the icy hill on plastic trays.","She slid the envelope across the table."],"key":"slid down the icy hill","syn":["glide down","slip along","skim across"],"reg":"neutral","ielts":"no","note":"Descriptive movement verb; useful in storytelling, not essays."},{"p":"so as to","m":"in order to; for the purpose of","d":"Used before an infinitive to introduce the purpose of an action; pattern: so as (not) to + verb.","ex":["Governments tax fuel so as to reduce pollution.","He spoke quietly so as not to wake the baby."],"key":"so as to reduce","syn":["in order to","with the aim of","to"],"reg":"formal","ielts":"yes","note":"Good purpose linker in Task 2; vary with 'in order to'."},{"p":"somewhere around/between, etc.","m":"roughly or approximately in a number or range","d":"Used to give an approximate amount, time or position; pattern: somewhere + around/between/in + figure.","ex":["The festival attracts somewhere around fifty thousand visitors.","The temperature stays somewhere between ten and fifteen degrees."],"key":"somewhere around fifty thousand","syn":["approximately","roughly","about","in the region of"],"reg":"informal","ielts":"careful","note":"Fine in speaking; in Task 1 use 'approximately' or 'around'."},{"p":"sort of","m":"in a way; a little; not exactly","d":"Informal phrase used to show that a description is not exact; pattern: sort of + adjective/verb.","ex":["It was sort of boring, but I learned a lot.","The film was sort of a comedy and sort of a drama."],"key":"sort of boring","syn":["kind of","rather","somewhat","a bit"],"reg":"informal","ielts":"no","note":"Spoken filler; use 'somewhat' or 'rather' in writing."},{"p":"sound angry/happy/rude, etc.","m":"seem a certain way from how it is said","d":"To give a particular impression through the voice or words; pattern: sound + adjective.","ex":["He sounded angry when he answered the phone.","Your email sounds rude, so please rewrite it politely."],"key":"sounded angry","syn":["seem upset","come across as angry","give an angry impression"],"reg":"neutral","ielts":"careful","note":"Useful in speaking and informal letters; less common in academic essays."},{"p":"attention/care/treatment","m":"help or notice given to a person or thing","d":"Listed as a pattern linking nouns with 'special/medical' words; used for the quality of care or notice given.","ex":["Patients with serious injuries need immediate medical attention.","Children require special care and treatment in hospital."],"key":"medical attention","syn":["medical care","medical treatment","attention"],"reg":"neutral","ielts":"yes","note":"Collocations like 'medical attention' suit health topics in Task 2."},{"p":"etc. sth","m":"and so on; used when listing things","d":"Placeholder entry; 'etc.' is used at the end of a list to show more items could be added.","ex":["The shop sells apples, oranges, bananas, etc.","You can bring books, notebooks, pens, etc. to the exam."],"key":"etc.","syn":["and so on","and so forth","and the like"],"reg":"neutral","ielts":"careful","note":"Avoid 'etc.' in essays; give full examples or use 'and so on' sparingly."},{"p":"standard of living","m":"how comfortable and wealthy people's lives are","d":"The level of wealth, comfort and material goods available to a person or group of people.","ex":["Economic growth has raised the standard of living in many countries.","A high standard of living does not always mean happiness."],"key":"the standard of living","syn":["living standards","quality of life","level of prosperity"],"reg":"neutral","ielts":"yes","note":"Key phrase for Task 2 on economy, development and migration."},{"p":"to start with","m":"first; as the first point or at the beginning","d":"Used to introduce the first point or to describe the initial situation.","ex":["To start with, public transport is cheaper than driving.","The job was difficult to start with, but it got easier."],"key":"To start with","syn":["firstly","to begin with","in the first place"],"reg":"neutral","ielts":"careful","note":"Acceptable linker but plain; 'Firstly' is preferred in Task 2 essays."},{"p":"stick (sth) in/into/through, etc.","m":"push something pointed into or through something","d":"To push a pointed object into or through something, or to put something somewhere quickly; pattern: stick (sth) + preposition.","ex":["She stuck the needle into the fabric carefully.","He stuck his hand through the fence to reach the ball."],"key":"stuck the needle into","syn":["push into","poke through","thrust into"],"reg":"neutral","ielts":"no","note":"Everyday physical action; not for essays."},{"p":"better/worse still","m":"even better or worse; used to add a stronger point","d":"Used to introduce an additional point that is even better or worse than the last.","ex":["The roads are crowded and, worse still, badly maintained.","The scheme is cheap and, better still, easy to use."],"key":"worse still","syn":["even better","what is more","even worse"],"reg":"neutral","ielts":"careful","note":"Useful for building emphasis; use in moderation in Task 2."},{"p":"in stock/out of stock","m":"available in a shop, or not available","d":"Available for sale in a shop or warehouse (in stock), or not currently available (out of stock).","ex":["The book you ordered is now in stock.","Most popular models are out of stock this month."],"key":"in stock","syn":["available","on hand","unavailable"],"reg":"neutral","ielts":"careful","note":"Good for General Training letters about orders and complaints."},{"p":"sit up/stand up straight","m":"keep your back upright, not bent","d":"To sit or stand with a straight back; pattern: sit/stand up straight.","ex":["The teacher told the pupils to sit up straight.","Doctors advise people to stand up straight to avoid back pain."],"key":"sit up straight","syn":["keep your back straight","sit upright","stand tall"],"reg":"neutral","ielts":"no","note":"Everyday posture advice; fine in speaking about health."},{"p":"come/get straight to the point","m":"say the main thing immediately","d":"To speak or write directly about the main matter without unnecessary introduction.","ex":["The manager came straight to the point and announced the layoffs.","I will get straight to the point: the budget is too low."],"key":"came straight to the point","syn":["be direct","cut to the chase","speak plainly"],"reg":"neutral","ielts":"careful","note":"Fine in speaking and emails; essays need clear intros instead."},{"p":"a stream of sth","m":"a continuous flow of people, things or words","d":"A continuous flow of people, things, liquid or words; pattern: a stream of + noun.","ex":["A constant stream of tourists visits the old town.","She received a stream of complaints from customers."],"key":"A constant stream of tourists","syn":["a flow of","a succession of","a series of"],"reg":"neutral","ielts":"yes","note":"Good for describing steady flows of people or traffic."},{"p":"strictly forbidden/prohibited","m":"completely not allowed","d":"Absolutely not permitted, usually by rules or law; pattern: strictly + forbidden/prohibited.","ex":["Photography is strictly forbidden inside the museum.","Smoking is strictly prohibited on all flights."],"key":"strictly forbidden","syn":["totally banned","absolutely prohibited","completely not allowed"],"reg":"formal","ielts":"yes","note":"Good for laws and rules; also notices in General Training letters."},{"p":"struck me...","m":"made me notice or think something","d":"Used to say that something suddenly gave you a strong impression; pattern: sth struck me as + adjective / it struck me that + clause.","ex":["The city struck me as surprisingly quiet.","It struck me that nobody had asked the students."],"key":"struck me as","syn":["impressed me as","occurred to me","seemed to me"],"reg":"neutral","ielts":"careful","note":"Good in speaking Part 2 to describe impressions; less academic."},{"p":"the supernatural","m":"things that cannot be explained by science","d":"Events or forces believed to exist beyond natural laws and scientific explanation.","ex":["Many old stories involve ghosts and the supernatural.","He has always been fascinated by the supernatural."],"key":"the supernatural","syn":["the paranormal","the occult","the unexplained"],"reg":"neutral","ielts":"careful","note":"Useful in speaking about films or beliefs; rare in essays."},{"p":"be supposed to be sth","m":"be expected or believed to be something","d":"To be generally thought or expected to be a certain thing, often when this is not true; pattern: be supposed to be + noun/adjective.","ex":["This restaurant is supposed to be the best in tow
