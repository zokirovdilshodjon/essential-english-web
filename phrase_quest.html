l's expectations","syn":["surpass expectations","outdo hopes","go beyond expectations"],"reg":"neutral","ielts":"yes","note":"Useful for describing results or outcomes."},{"p":"exceed the speed limit","m":"drive faster than allowed","d":"Verb phrase meaning to travel at a speed higher than the legal maximum.","ex":["Drivers who exceed the speed limit should face heavier fines.","He was fined for exceeding the speed limit on the motorway."],"key":"exceed the speed limit","syn":["speed","break the speed limit","drive too fast"],"reg":"neutral","ielts":"yes","note":"Handy for Task 2 essays on road safety and law."},{"p":"make an exception","m":"allow a rule not to apply once","d":"Verb phrase meaning to treat a person or case differently from the usual rule.","ex":["The university made an exception for students with medical problems.","Rules are rules, but I will make an exception this time."],"key":"made an exception","syn":["bend the rules","waive the rule","allow an exemption"],"reg":"neutral","ielts":"yes","note":"Fine in essays about rules, laws and fairness."},{"p":"faculty","m":"a university department or the teaching staff","d":"Noun meaning a group of related university departments, or the academic staff of a university or college.","ex":["She is a professor in the Faculty of Medicine.","The faculty voted to change the exam system."],"key":"Faculty of Medicine","syn":["department","academic staff","school"],"reg":"formal","ielts":"yes","note":"Useful academic noun; common in education topics."},{"p":"fall flat","m":"fail to have the intended effect","d":"Idiom meaning that a joke, plan or event fails to produce the effect that was wanted.","ex":["The government's campaign fell flat because few people understood its message.","His joke fell flat and nobody laughed."],"key":"fell flat","syn":["fail","go wrong","miss the mark"],"reg":"neutral","ielts":"careful","note":"Slightly idiomatic; fine in Task 2 if used once."},{"p":"far from sth","m":"not at all something","d":"Phrase meaning not at all, or the opposite of the quality mentioned.","ex":["Public transport is far from perfect in rural areas.","The situation is far from clear at this stage."],"key":"far from perfect","syn":["by no means","anything but","not at all"],"reg":"neutral","ielts":"yes","note":"Good for balanced, cautious arguments in Task 2."},{"p":"far from it","m":"definitely not; the opposite is true","d":"Informal phrase used to strongly deny what has just been said.","ex":["Some say the system is fair. Far from it: the poorest students are disadvantaged.","Is he lazy? Far from it; he works every weekend."],"key":"Far from it","syn":["quite the opposite","not at all","on the contrary"],"reg":"informal","ielts":"careful","note":"Emphatic and chatty; better in speaking than in essays."},{"p":"how far","m":"to what extent; what distance","d":"Question phrase asking about distance or degree, also used in indirect questions.","ex":["It is unclear how far social media influences voting behaviour.","I asked how far the station was from the hotel."],"key":"how far","syn":["to what extent","to what degree","what distance"],"reg":"neutral","ielts":"yes","note":"Good in essay questions: 'To what extent...'; 'how far' is a variant."},{"p":"in sb's favour","m":"to someone's advantage","d":"Phrase meaning helping or benefiting a person, such as a decision or a trend that supports them.","ex":["The court ruled in the company's favour.","Circumstances were in her favour, so she took the risk."],"key":"in the company's favour","syn":["to one's advantage","beneficial to","on one's side"],"reg":"neutral","ielts":"yes","note":"Useful for law, politics and arguments; British spelling 'favour'."},{"p":"bad/ill feeling","m":"anger or hostility between people","d":"Noun phrase meaning resentment or hostility, especially after an argument or unfair treatment.","ex":["The decision caused a great deal of bad feeling among staff.","There was no ill feeling between the two teams after the match."],"key":"bad feeling","syn":["resentment","hostility","animosity","tension"],"reg":"neutral","ielts":"yes","note":"Fine for workplace or social issues in Task 2."},{"p":"from start to finish","m":"during the whole of something","d":"Phrase meaning from the beginning to the end, completely.","ex":["The project was managed by the same team from start to finish.","The film was exciting from start to finish."],"key":"from start to finish","syn":["throughout","from beginning to end","all the way through"],"reg":"neutral","ielts":"yes","note":"Neutral and clear; fine in Task 1 process descriptions."},{"p":"first and foremost","m":"most importantly","d":"Fixed phrase used to introduce the most important point or the first point in a list.","ex":["First and foremost, governments must invest in public education.","First and foremost, I want to thank my family."],"key":"First and foremost","syn":["above all","primarily","most importantly"],"reg":"neutral","ielts":"yes","note":"Strong opener for the first main point in Task 2."},{"p":"the focus of sth","m":"the main centre of attention of something","d":"Noun phrase meaning the thing that attention, interest or activity is mainly directed at.","ex":["Climate change has become the focus of international debate.","Housing was the focus of the minister's speech."],"key":"the focus of international debate","syn":["the centre of","the main point of","the heart of"],"reg":"neutral","ielts":"yes","note":"Useful academic noun phrase for introductions."},{"p":"the foot of sth","m":"the bottom part of something","d":"Noun phrase meaning the lowest part of something such as a hill, stairs or page.","ex":["The village lies at the foot of the mountain.","Please sign at the foot of the page."],"key":"the foot of the mountain","syn":["the base of","the bottom of"],"reg":"neutral","ielts":"careful","note":"Mostly descriptive; useful for map or place descriptions in Task 1."},{"p":"set foot in/on sth","m":"enter or step into a place","d":"Verb phrase meaning to go into or onto a place, often used in negative statements.","ex":["Many of these children have never set foot in a classroom.","He swore he would never set foot in that house again."],"key":"set foot in a classroom","syn":["enter","step into","visit"],"reg":"neutral","ielts":"yes","note":"Vivid in negatives; good for education or poverty topics."},{"p":"for good","m":"permanently","d":"Adverbial phrase meaning forever or permanently.","ex":["Many young people leave rural areas for good and never return.","She left the country for good in 2015."],"key":"for good","syn":["permanently","forever","for ever"],"reg":"neutral","ielts":"yes","note":"Clear and natural; avoid confusion with 'for the good of'."},{"p":"for life","m":"for the whole of someone's life","d":"Phrase meaning lasting until a person dies.","ex":["Some people choose a partner for life at a young age.","He was banned from the sport for life."],"key":"for life","syn":["permanently","lifelong","for ever"],"reg":"neutral","ielts":"yes","note":"Fine for topics on careers, marriage or punishment."},{"p":"for long","m":"for a long time","d":"Adverbial phrase meaning for much time, used mostly in questions and negatives.","ex":["Traditional farming methods cannot survive for long without support.","We did not wait for long before the bus arrived."],"key":"for long","syn":["for a long time","for ages","for an extended period"],"reg":"neutral","ielts":"yes","note":"Use in negatives and questions, not positive sentences."},{"p":"for the most part","m":"mostly; in general","d":"Adverbial phrase meaning mainly or in most cases, ignoring a few exceptions.","ex":["For the most part, students support the new timetable.","The weather was, for the most part, sunny."],"key":"For the most part","syn":["mostly","largely","on the whole","mainly"],"reg":"neutral","ielts":"yes","note":"Good hedging phrase for Task 2 and Task 1 summaries."},{"p":"for the time being","m":"for now but not forever","d":"Adverbial phrase meaning temporarily, until something changes.","ex":["For the time being, the museum will remain closed.","You can stay here for the time being."],"key":"For the time being","syn":["for now","temporarily","at present"],"reg":"neutral","ielts":"yes","note":"Fine in formal or neutral writing for temporary situations."},{"p":"for a start","m":"as a first point","d":"Informal phrase used to introduce the first of several reasons or points.","ex":["It is a poor idea; for a start, it costs too much.","I can't go. For a start, I have no money."],"key":"for a start","syn":["to begin with","first of all","in the first place"],"reg":"informal","ielts":"careful","note":"Spoken style; use 'firstly' or 'to begin with' in essays."},{"p":"in the form of sth","m":"taking the shape or type of something","d":"Phrase meaning appearing as a particular kind of thing.","ex":["Financial help was provided in the form of grants.","The warning came in the form of a letter."],"key":"in the form of grants","syn":["as","by way of","taking the shape of"],"reg":"formal","ielts":"yes","note":"Useful for describing types of aid, taxes or data."},{"p":"foul language","m":"rude or offensive words","d":"Noun phrase meaning swear words or offensive speech.","ex":["Foul language on television should be restricted before the watershed.","The coach was criticised for using foul language."],"key":"Foul language","syn":["bad language","swearing","obscenities"],"reg":"neutral","ielts":"careful","note":"Okay for media or education topics; keep tone neutral."},{"p":"free from/of sth","m":"without something unpleasant or unwanted","d":"Adjective phrase meaning not containing or affected by something harmful or unwanted.","ex":["Everyone has the right to live free from fear.","The water was free of chemicals."],"key":"free from fear","syn":["without","devoid of","unaffected by"],"reg":"neutral","ielts":"yes","note":"Good for rights, health and environment topics."},{"p":"from then/that day, etc. on","m":"starting at that time and continuing","d":"Pattern meaning from a stated point in time onwards.","ex":["From that day on, the town's economy began to decline.","From then on, she never trusted him."],"key":"From that day on","syn":["thereafter","from that point","ever since"],"reg":"neutral","ielts":"yes","note":"Useful in narrative; for Task 1 trends use 'from 2010 onwards'."},{"p":"fulfil a function/need/role, etc.","m":"do or satisfy a function, need or role","d":"Verb phrase meaning to perform a task or satisfy a requirement; collocates with function, need, role, promise.","ex":["Schools must fulfil a wider role than simply preparing pupils for exams.","The new bridge fulfils a vital need for the local community."],"key":"fulfil a wider role","syn":["perform a role","meet a need","serve a purpose","satisfy"],"reg":"formal","ielts":"yes","note":"Strong academic collocation; British spelling 'fulfil'."},{"p":"ns, etc.","m":"word endings forming plural nouns","d":"Fragment showing that a noun ending in -ns is plural, such as in fixed plural expressions.","ex":["The two nations signed several trade agreements.","The talks between the unions and management broke down."],"key":"nations","syn":["plural form","plural nouns"],"reg":"neutral","ielts":"careful","note":"Not a real phrase; learn the full expression instead."},{"p":"a further 10/100, etc.","m":"another 10 or 100 more","d":"Phrase using 'further' to mean an additional amount or number.","ex":["A further 200 jobs are expected to be lost next year.","The company plans to open a further ten stores."],"key":"A further 200 jobs","syn":["an additional","another","a further"],"reg":"formal","ielts":"yes","note":"Good for Task 1 describing additional increases."},{"p":"gather speed/strength/support, etc.","m":"become faster, stronger or more supported","d":"Verb phrase meaning to increase gradually in speed, force or popularity.","ex":["The campaign for cleaner air has gathered support across the country.","The storm gathered strength over the ocean."],"key":"gathered support","syn":["gain momentum","build up","pick up"],"reg":"neutral","ielts":"yes","note":"Good for describing trends and movements in Task 2."},{"p":"get on sb's nerves","m":"annoy someone","d":"Informal idiom meaning to irritate someone, especially repeatedly.","ex":["His constant complaining really gets on my nerves.","Loud music on the train gets on everyone's nerves."],"key":"gets on my nerves","syn":["irritate","annoy","drive sb mad"],"reg":"informal","ielts":"no","note":"Spoken or friend letters only; avoid in essays."},{"p":"get rid of sb","m":"remove or dismiss a person","d":"Verb phrase meaning to make a person leave or to dismiss them, often informal.","ex":["The manager wanted to get rid of the least productive staff.","They finally got rid of their annoying neighbour."],"key":"get rid of the least productive staff","syn":["dismiss","remove","sack"],"reg":"informal","ielts":"careful","note":"Informal for people; use 'dismiss' in formal writing."},{"p":"get sth straight","m":"understand something clearly","d":"Informal phrase meaning to make sure you understand a fact correctly or arrange it clearly.","ex":["Let me get this straight: you want to cancel the whole project?","We need to get the facts straight before we publish."],"key":"get this straight","syn":["clarify","make clear","sort out"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays, fine in Speaking Part 3."},{"p":"give sth a miss","m":"decide not to do or attend something","d":"Informal British phrase meaning to avoid or skip an activity.","ex":["I think I will give the party a miss this weekend.","Many commuters give the gym a miss when it is cold."],"key":"give the party a miss","syn":["skip","avoid","pass on"],"reg":"informal","ielts":"no","note":"Informal British; use in Speaking, not in essays."},{"p":"give way","m":"let others go first or collapse","d":"Verb phrase meaning to allow other traffic to pass, to collapse, or to yield to pressure.","ex":["Drivers must give way to pedestrians at crossings.","The old bridge finally gave way under the weight."],"key":"give way","syn":["yield","collapse","concede"],"reg":"neutral","ielts":"yes","note":"Flexible: traffic rules, structures or arguments in Task 2."},{"p":"give sb your word","m":"promise something to someone","d":"Verb phrase meaning to make a serious promise.","ex":["The minister gave the public his word that taxes would not rise.","I give you my word that I will be there."],"key":"gave the public his word","syn":["promise","pledge","assure"],"reg":"neutral","ielts":"careful","note":"Slightly literary; 'promise' is safer in essays."},{"p":"be glad of sth","m":"feel grateful for something","d":"Phrase meaning to appreciate something because it helps in a situation.","ex":["Travellers were glad of the shelter during the storm.","I was glad of your advice when I started."],"key":"were glad of the shelter","syn":["be grateful for","appreciate","welcome"],"reg":"neutral","ielts":"careful","note":"Slightly dated in some uses; fine in Speaking."},{"p":"keep sb going","m":"help someone continue","d":"Phrase meaning to provide enough energy, money or hope to continue doing something.","ex":["A strong cup of coffee kept him going through the night.","Hope was what kept the villagers going after the earthquake."],"key":"kept him going","syn":["sustain","keep up","help carry on"],"reg":"neutral","ielts":"careful","note":"Natural for speaking; limited use in essays."},{"p":"go from strength to strength","m":"keep becoming more successful","d":"Idiom meaning to become stronger or more successful over time.","ex":["The company has gone from strength to strength since its launch.","Her career went from strength to strength after the award."],"key":"gone from strength to strength","syn":["thrive","flourish","prosper","do better and better"],"reg":"neutral","ielts":"yes","note":"Positive idiom for success in Task 1 or Task 2."},{"p":"grab the opportunity/chance","m":"quickly take a chance","d":"Verb phrase meaning to take advantage of a chance eagerly.","ex":["Young graduates should grab the opportunity to work abroad.","She grabbed the chance to study in London."],"key":"grab the opportunity","syn":["seize the opportunity","jump at the chance","take advantage of"],"reg":"neutral","ielts":"careful","note":"Slightly informal; 'seize the opportunity' is better in essays."},{"p":"grab sb's attention","m":"quickly attract someone's interest","d":"Verb phrase meaning to make someone notice something immediately.","ex":["Striking headlines are used to grab readers' attention.","The advert grabbed my attention straight away."],"key":"grab readers' attention","syn":["catch sb's eye","attract attention","capture interest"],"reg":"neutral","ielts":"yes","note":"Good for media and advertising topics."},{"p":"on the grounds of/that","m":"because of a stated reason","d":"Prepositional phrase introducing the reason for an action or decision, often a legal or formal one.","ex":["The application was rejected on the grounds of insufficient evidence.","He refused on the grounds that it was too risky."],"key":"on the grounds of insufficient evidence","syn":["because of","owing to","on account of"],"reg":"formal","ielts":"yes","note":"Formal reason linker, good in Task 2 on law or rights."},{"p":"be in sb's hands","m":"be someone's responsibility","d":"Phrase meaning that someone has control or responsibility for a situation.","ex":["The future of the planet is in our hands.","The decision is now in the committee's hands."],"key":"is in our hands","syn":["be up to","rest with","be controlled by"],"reg":"neutral","ielts":"yes","note":"Effective for concluding sentences about responsibility."},{"p":"happen to do sth","m":"do or be something by chance","d":"Verb phrase meaning to do something by chance or without planning.","ex":["If you happen to see her, give her the message.","I happened to be in the area, so I called in."],"key":"happen to see her","syn":["chance to","do by chance"],"reg":"neutral","ielts":"careful","note":"Fine in speaking; occasionally useful in narrative writing."},{"p":"there's no harm in doing sth","m":"doing something is safe and might help","d":"Phrase meaning that trying something is not risky and may be worthwhile.","ex":["There is no harm in asking for a second opinion.","There's no harm in trying a different approach."],"key":"There is no harm in asking","syn":["it does no damage to","it is worth trying"],"reg":"neutral","ielts":"careful","note":"Conversational; contracted form is best kept for speaking."},{"p":"in your heart","m":"deep inside; in your true feelings","d":"Phrase meaning in your most sincere feelings, even if not shown.","ex":["In his heart, he knew the plan would fail.","She was a teacher in her heart, even after retiring."],"key":"In his heart","syn":["deep down","inwardly","privately"],"reg":"neutral","ielts":"careful","note":"Emotional; suitable for speaking and personal narrative."},{"p":"have no hesitation in doing sth","m":"be completely ready to do something","d":"Phrase meaning to be willing to do something without doubt or delay.","ex":["I have no hesitation in recommending this course to future students.","The board had no hesitation in accepting the offer."],"key":"have no hesitation in recommending","syn":["not hesitate to","be only too willing to","readily"],"reg":"formal","ielts":"yes","note":"Formal; good in letters and opinion statements."},{"p":"high in sth","m":"containing a lot of something","d":"Adjective phrase meaning containing a large amount of a substance or quality.","ex":["Fast food is often high in fat and sugar.","The region is high in natural resources."],"key":"high in fat and sugar","syn":["rich in","full of","abundant in"],"reg":"neutral","ielts":"yes","note":"Good for diet, health and resource topics."},{"p":"a history of sth","m":"a record of something in the past","d":"Noun phrase meaning past events or a long record of a certain type.","ex":["The city has a history of political unrest.","He has a history of heart problems."],"key":"a history of political unrest","syn":["a record of","a past of","a tradition of"],"reg":"neutral","ielts":"yes","note":"Useful in health, crime and social topics."},{"p":"hold an opinion/belief/view","m":"have a particular opinion","d":"Verb phrase meaning to have a certain opinion, belief or view.","ex":["Many people hold the view that tourism harms local culture.","She holds strong beliefs about animal rights."],"key":"hold the view","syn":["have a view","maintain","subscribe to"],"reg":"formal","ielts":"yes","note":"Excellent for opinion sentences in Task 2."},{"p":"hold sb's attention/interest","m":"keep someone interested","d":"Verb phrase meaning to keep someone's attention or interest for a period.","ex":["Interactive lessons hold students' attention better than lectures.","The film failed to hold my interest."],"key":"hold students' attention","syn":["engage","keep interested","captivate"],"reg":"neutral","ielts":"yes","note":"Good for education and media topics."},{"p":"on hold","m":"paused; waiting","d":"Phrase meaning temporarily delayed or waiting, e.g. a plan or a phone call.","ex":["The construction project has been put on hold.","Her career was on hold while she raised her children."],"key":"on hold","syn":["suspended","postponed","paused"],"reg":"neutral","ielts":"yes","note":"Useful for plans and projects in Task 1 or 2."},{"p":"the home of sth/sb","m":"the place where something comes from","d":"Noun phrase meaning the place where something originated or is most associated.","ex":["Greece is the home of the Olympic Games.","Silicon Valley is the home of many technology firms."],"key":"the home of the Olympic Games","syn":["the birthplace of","the base of","the centre of"],"reg":"neutral","ielts":"yes","note":"Good for describing origin or centres of activity."},{"p":"make yourself at home","m":"relax as if in your own house","d":"Phrase used to invite a guest to feel comfortable.","ex":["Please come in and make yourself at home.","They made us feel welcome and told us to make ourselves at home."],"key":"make yourself at home","syn":["relax","feel comfortable","settle in"],"reg":"informal","ielts":"no","note":"Spoken hospitality phrase; not for essays."},{"p":"the homeless","m":"people who have no house","d":"Noun phrase meaning people who live without a permanent home; used with a plural verb.","ex":["The government should provide more shelters for the homeless.","Volunteers serve meals to the homeless every evening."],"key":"the homeless","syn":["rough sleepers","people without homes"],"reg":"neutral","ielts":"yes","note":"Common in social issues; 'homeless people' is also fine."},{"p":"in the hope of/that","m":"with the wish that something will happen","d":"Phrase explaining the aim or wish behind an action.","ex":["Many migrants travel abroad in the hope of better wages.","She wrote to him in the hope that he would reply."],"key":"in the hope of better wages","syn":["hoping to","with the aim of","aiming for"],"reg":"neutral","ielts":"yes","note":"Useful for explaining motives in Task 2."},{"p":"broaden/expand/widen your horizons","m":"gain new experiences and ideas","d":"Verb phrase meaning to learn new things or experience new ideas and places.","ex":["Studying abroad can broaden students' horizons.","Travel is a great way to widen your horizons."],"key":"broaden students' horizons","syn":["open your mind","gain new perspectives","extend your experience"],"reg":"neutral","ielts":"yes","note":"Very common in education and travel essays."},{"p":"on the horizon","m":"about to happen soon","d":"Phrase meaning that something is likely to happen in the near future.","ex":["Major changes to the education system are on the horizon.","With an election on the horizon, politicians are cautious."],"key":"are on the horizon","syn":["approaching","imminent","just around the corner"],"reg":"neutral","ielts":"yes","note":"Good for predictions in Task 1 and Task 2."},{"p":"a host of sth","m":"a large number of things","d":"Noun phrase meaning a large number of people or things.","ex":["The internet offers a host of opportunities for learners.","A host of problems delayed the project."],"key":"a host of opportunities","syn":["a multitude of","numerous","a wide range of"],"reg":"formal","ielts":"yes","note":"Fine academic quantifier; avoid overusing 'a lot of'."},{"p":"a hot issue/topic","m":"a very discussed subject","d":"Noun phrase meaning a subject that many people are discussing strongly.","ex":["Climate policy remains a hot topic in many elections.","Immigration is a hot issue in the media."],"key":"a hot topic","syn":["a controversial issue","a burning issue","a talking point"],"reg":"neutral","ielts":"careful","note":"Slightly informal; 'a controversial issue' is safer in essays."},{"p":"room for improvement","m":"chance to get better","d":"Phrase meaning that something could be better than it is now.","ex":["The report shows there is still room for improvement in public services.","The essay was good, but there is room for improvement."],"key":"room for improvement","syn":["scope for improvement","potential to improve"],"reg":"neutral","ielts":"yes","note":"Good evaluative phrase for Task 2 and Task 1 comments."},{"p":"in turn","m":"as the next step in a sequence","d":"Adverbial phrase meaning as a result, or one after another.","ex":["Higher prices reduce demand, which in turn leads to lower profits.","Each member introduced himself in turn."],"key":"in turn","syn":["consequently","subsequently","one after another"],"reg":"neutral","ielts":"yes","note":"Excellent for chain-of-cause arguments in Task 2."},{"p":"be in sb's interest(s)","m":"benefit someone","d":"Phrase meaning that something is advantageous to a person or group.","ex":["It is in everyone's interest to reduce pollution.","The deal is in the interests of both countries."],"key":"is in everyone's interest","syn":["benefit sb","be advantageous to","serve sb's interests"],"reg":"formal","ielts":"yes","note":"Strong formal phrase for arguments in Task 2."},{"p":"in the light of sth","m":"considering new information","d":"Prepositional phrase meaning taking something into account, especially new facts.","ex":["In the light of recent evidence, the policy was reviewed.","The plan changed in the light of public criticism."],"key":"In the light of recent evidence","syn":["considering","in view of","given"],"reg":"formal","ielts":"yes","note":"Formal and useful in Task 2 conclusions and reports."},{"p":"in moderation","m":"in reasonable amounts","d":"Adverbial phrase meaning not too much and not too little.","ex":["Sweets are fine in moderation.","Experts say alcohol should be consumed in moderation."],"key":"in moderation","syn":["in small amounts","sensibly","without excess"],"reg":"neutral","ielts":"yes","note":"Common in health and lifestyle essays."},{"p":"be in two minds","m":"be unable to decide","d":"Idiom meaning to be undecided between two choices.","ex":["I am in two minds about moving abroad.","Many voters are in two minds about the proposal."],"key":"am in two minds","syn":["be undecided","be uncertain","be torn"],"reg":"neutral","ielts":"careful","note":"Idiomatic; good in Speaking, rare in formal essays."},{"p":"be in position","m":"be ready in the right place","d":"Phrase meaning to be located or prepared where needed.","ex":["The guards were already in position before the ceremony.","Once everyone is in position, we can begin."],"key":"were already in position","syn":["be in place","be set up","be ready"],"reg":"neutral","ielts":"careful","note":"Mostly descriptive; useful in Task 1 process or map tasks."},{"p":"in the region of sth","m":"approximately","d":"Prepositional phrase meaning about or around a stated amount.","ex":["The project will cost in the region of five million pounds.","Attendance was in the region of 20,000."],"key":"in the region of five million pounds","syn":["approximately","roughly","around"],"reg":"formal","ielts":"yes","note":"Good approximation phrase for Task 1 figures."},{"p":"in respect of sth","m":"concerning something","d":"Formal prepositional phrase meaning about or regarding something.","ex":["The company was fined in respect of safety breaches.","Several questions remain in respect of funding."],"key":"in respect of safety breaches","syn":["regarding","concerning","with regard to"],"reg":"formal","ielts":"yes","note":"Formal; common in reports, letters and academic writing."},{"p":"in reverse","m":"in the opposite order","d":"Phrase meaning in the opposite direction or order.","ex":["The sequence of events then happened in reverse.","The data show the trend in reverse after 2010."],"key":"in reverse","syn":["backwards","the other way round","inverted"],"reg":"neutral","ielts":"yes","note":"Useful to describe opposite trends in Task 1."},{"p":"in no time","m":"very quickly","d":"Phrase meaning almost immediately or very soon.","ex":["With modern software, reports can be produced in no time.","We will be there in no time."],"key":"in no time","syn":["very quickly","in a flash","almost at once"],"reg":"informal","ielts":"careful","note":"Conversational; use 'rapidly' in essays."},{"p":"in tune","m":"in harmony with","d":"Phrase meaning agreeing or matching with something, or in the right musical pitch.","ex":["Politicians must remain in tune with public opinion.","The band played perfectly in tune."],"key":"in tune with public opinion","syn":["in harmony","in step","in line"],"reg":"neutral","ielts":"yes","note":"Often 'in tune with'; useful for society and politics."},{"p":"in vain","m":"without success","d":"Phrase meaning without achieving the wanted result.","ex":["Doctors tried in vain to save the patient.","All our efforts were in vain."],"key":"in vain","syn":["unsuccessfully","to no avail","fruitlessly"],"reg":"formal","ielts":"yes","note":"Formal, useful for describing failed efforts."},{"p":"in no way/not in any way","m":"not at all","d":"Phrase used to strongly deny something.","ex":["The result is in no way surprising.","This policy is not in any way discriminatory."],"key":"in no way","syn":["by no means","not at all","under no circumstances"],"reg":"formal","ielts":"yes","note":"Strong negative; note inversion when at sentence start."},{"p":"in a sense","m":"in a particular way; partly","d":"Phrase used to say that a statement is true only in one way.","ex":["In a sense, the crisis was an opportunity for reform.","He was, in a sense, a hero."],"key":"In a sense","syn":["in a way","to some extent","in some respects"],"reg":"neutral","ielts":"yes","note":"Good hedge in Task 2; helps show balance."},{"p":"in short","m":"to sum up briefly","d":"Linking phrase used before a brief summary of what has been said.","ex":["In short, education is the key to economic growth.","In short, the plan failed."],"key":"In short","syn":["in brief","to sum up","in a nutshell"],"reg":"neutral","ielts":"yes","note":"Good for conclusions in Task 2."},{"p":"in store","m":"about to happen","d":"Phrase meaning waiting in the future for someone.","ex":["Great challenges are in store for the next generation.","Nobody knew what was in store for the team."],"key":"are in store","syn":["ahead","coming","awaiting"],"reg":"neutral","ielts":"careful","note":"Often 'in store for'; fine for predictions."},{"p":"incapable of sth/doing sth","m":"unable to do something","d":"Adjective phrase meaning not able to do something or to feel something.","ex":["Some old systems are incapable of handling large data.","He seemed incapable of telling the truth."],"key":"incapable of handling large data","syn":["unable to","powerless to","not up to"],"reg":"formal","ielts":"yes","note":"Formal, stronger than 'unable'; useful for criticism."},{"p":"be inclined to think/believe/agree, etc.","m":"tend to think or agree","d":"Phrase meaning to have a tendency or opinion in a certain direction.","ex":["I am inclined to agree with the view that tuition should be free.","Many experts are inclined to believe the figures."],"key":"am inclined to agree","syn":["tend to","lean towards","be disposed to"],"reg":"formal","ielts":"yes","note":"Good, polite way to give opinions in Task 2."},{"p":"on the increase","m":"getting more common","d":"Phrase meaning growing in number or amount.","ex":["Cases of obesity are on the increase.","Online shopping is on the increase."],"key":"on the increase","syn":["rising","growing","increasing"],"reg":"neutral","ielts":"yes","note":"Good for trends in Task 1 and Task 2."},{"p":"take the initiative","m":"act first without being told","d":"Verb phrase meaning to be the first to act to solve a problem.","ex":["Local councils should take the initiative in tackling pollution.","She took the initiative and organised the meeting."],"key":"take the initiative","syn":["act first","lead the way","step forward"],"reg":"neutral","ielts":"yes","note":"Positive phrase for leadership or responsibility topics."},{"p":"be intended for","m":"be designed for a purpose","d":"Phrase meaning to be meant for a particular person or use.","ex":["The programme is intended for adult learners.","These rooms are intended for staff only."],"key":"is intended for adult learners","syn":["be designed for","be meant for","be aimed at"],"reg":"formal","ielts":"yes","note":"Common in academic and report writing."},{"p":"take issue (with sb/sth)","m":"disagree with","d":"Verb phrase meaning to disagree or argue about a point.","ex":["Critics take issue with the government's figures.","I must take issue with that statement."],"key":"take issue with","syn":["disagree with","challenge","object to","dispute"],"reg":"formal","ielts":"yes","note":"Formal; useful for counter-argument in Task 2."},{"p":"be a joke","m":"be ridiculous or very bad","d":"Informal phrase meaning to be so poor or silly that it is not taken seriously.","ex":["The punishment was a joke and no deterrent.","The service at that hotel is a joke."],"key":"was a joke","syn":["be ridiculous","be absurd","be farcical"],"reg":"informal","ielts":"no","note":"Informal; not suitable for formal essays."},{"p":"it's just as well","m":"it's lucky","d":"Informal phrase meaning it is fortunate that something happened.","ex":["It's just as well we left early, or we would have missed the train.","It's just as well you brought an umbrella."],"key":"It's just as well","syn":["it's lucky","fortunately","luckily"],"reg":"informal","ielts":"no","note":"Spoken only; avoid in essays."},{"p":"I/you/we, etc. will just have to do sth","m":"there is no other choice but","d":"Phrase meaning that there is no alternative to doing something.","ex":["If the weather is bad, we will just have to stay inside.","You will just have to accept the decision."],"key":"we will just have to stay inside","syn":["have no choice but to","be forced to","must simply"],"reg":"informal","ielts":"no","note":"Spoken; use 'must' or 'have no choice but to' in essays."},{"p":"keep track","m":"continue to know what is happening","d":"Verb phrase meaning to stay informed about something, often 'keep track of'.","ex":["It is hard to keep track of all the new apps.","Parents should keep track of what children watch online."],"key":"keep track of all the new apps","syn":["monitor","follow","stay informed"],"reg":"neutral","ielts":"yes","note":"Fine in technology and parenting topics."},{"p":"keep your word","m":"do what you promised","d":"Verb phrase meaning to do what you have promised.","ex":["Leaders who keep their word earn the public's trust.","He always keeps his word, so I trust him."],"key":"keep their word","syn":["honour a promise","fulfil a promise","stick to a promise"],"reg":"neutral","ielts":"yes","note":"Good for trust and honesty arguments."},{"p":"keep pace with sb/sth","m":"stay equal in speed or progress","d":"Verb phrase meaning to progress at the same speed as something.","ex":["Wages have not kept pace with inflation.","Schools struggle to keep pace with new technology."],"key":"kept pace with inflation","syn":["keep up with","match","stay level with"],"reg":"neutral","ielts":"yes","note":"Very useful for Task 1 and Task 2 comparison."},{"p":"be key to sth","m":"be very important for something","d":"Phrase meaning to be the most important factor in achieving something.","ex":["Education is key to reducing poverty.","Trust is key to any successful team."],"key":"is key to reducing poverty","syn":["be vital to","be essential for","be crucial to"],"reg":"neutral","ielts":"yes","note":"Short, strong and clear; very good in Task 2."},{"p":"be known to do sth","m":"be recognised as doing something","d":"Phrase meaning that people are aware that someone does something.","ex":["Some companies are known to ignore safety rules.","He is known to arrive late for meetings."],"key":"are known to ignore safety rules","syn":["be recognised as","be said to","be reputed to"],"reg":"neutral","ielts":"yes","note":"Good for cautious statements with evidence."},{"p":"the labour market","m":"system of jobs and workers","d":"Noun phrase meaning the supply of workers and demand for jobs in an economy.","ex":["Automation will change the labour market significantly.","Graduates entering the labour market face fierce competition."],"key":"the labour market","syn":["the job market","employment market","workforce"],"reg":"formal","ielts":"yes","note":"Common economic term for work topics; British spelling 'labour'."},{"p":"be lacking in sth","m":"not have enough of something","d":"Phrase meaning to have too little of a quality or thing.","ex":["The proposal is lacking in detail.","Some rural schools are lacking in basic resources."],"key":"is lacking in detail","syn":["be short of","be deficient in","be without"],"reg":"formal","ielts":"yes","note":"Formal and useful for criticism."},{"p":"land in/on, etc.","m":"arrive on the ground after flight","d":"Verb pattern meaning to come down onto the ground, a surface or into a situation, with a preposition.","ex":["The aircraft landed on the runway ten minutes late.","The ball landed in the garden next door."],"key":"landed on the runway","syn":["touch down","come down","arrive"],"reg":"neutral","ielts":"careful","note":"Literal use; for trouble, 'land in trouble' is informal."},{"p":"strong language","m":"rude or forceful words","d":"Noun phrase meaning offensive words, or forceful and blunt wording.","ex":["The film contains strong language and is unsuitable for children.","The minister used strong language to criticise the plan."],"key":"strong language","syn":["bad language","harsh words","swearing"],"reg":"neutral","ielts":"careful","note":"Fine for media topics; avoid using such language in essays."},{"p":"lay sth down/in/on, etc.","m":"put something carefully in a place","d":"Verb phrase meaning to put something flat or in a position, or establish rules.","ex":["The council laid down strict rules for new buildings.","She laid the baby on the bed."],"key":"laid down strict rules","syn":["place","set out","establish"],"reg":"neutral","ielts":"careful","note":"'Lay down rules' works in formal writing."},{"p":"the leadership","m":"the people in charge","d":"Noun phrase meaning the leaders of an organisation, or the position of leading.","ex":["The company leadership failed to respond to the crisis.","The party leadership rejected the proposal."],"key":"The company leadership","syn":["the management","the top team","those in charge"],"reg":"neutral","ielts":"yes","note":"Good for politics and business topics."},{"p":"to say the least","m":"without exaggerating","d":"Phrase used to say that something is more extreme than the mild word suggests.","ex":["The results were disappointing, to say the least.","His behaviour was strange, to say the least."],"key":"to say the least","syn":["to put it mildly","at the very least"],"reg":"neutral","ielts":"careful","note":"Understated tone; use once, mostly in opinions."},{"p":"leave sb doing sth","m":"make someone stay doing something","d":"Verb pattern meaning to cause someone to be in a state of doing something.","ex":["Long working hours often leave employees feeling exhausted.","The delay left passengers waiting for hours."],"key":"leave employees feeling exhausted","syn":["cause sb to be","make sb","result in sb being"],"reg":"neutral","ielts":"yes","note":"Useful for describing effects in Task 2."},{"p":"take the liberty of doing sth","m":"do something without asking first","d":"Formal phrase meaning to do something without permission, usually politely.","ex":["I took the liberty of booking a table for you.","She took the liberty of correcting the report."],"key":"took the liberty of booking","syn":["presume to","venture to","dare to"],"reg":"formal","ielts":"careful","note":"Formal letters or emails; slightly old-fashioned."},{"p":"on loan","m":"borrowed for a time","d":"Phrase meaning lent for a short time, such as an artwork or a player.","ex":["The painting is on loan from a private collector.","The striker is on loan at another club."],"key":"on loan","syn":["borrowed","lent","temporarily transferred"],"reg":"neutral","ielts":"yes","note":"Useful for museum or finance descriptions."},{"p":"on location","m":"filmed away from the studio","d":"Phrase meaning filming in a real place, not a studio.","ex":["The series was filmed on location in Iceland.","Much of the film was shot on location."],"key":"on location","syn":["outside the studio","at the real site"],"reg":"neutral","ielts":"careful","note":"Specialised in film topics; usually not essay material."},{"p":"be lost without sb/sth","m":"not manage without someone","d":"Phrase meaning to be unable to cope without someone or something.","ex":["Many people are lost without their phones.","I would be lost without my sister."],"key":"are lost without their phones","syn":["depend on","be helpless without","rely on"],"reg":"neutral","ielts":"careful","note":"Good for technology dependence; slightly informal."},{"p":"be in luck","m":"be fortunate","d":"Phrase meaning to be lucky at a certain time.","ex":["You're in luck: the last ticket is still available.","We were in luck, as the sun came out."],"key":"You're in luck","syn":["be fortunate","be lucky","get a break"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"make time","m":"find time for something","d":"Verb phrase meaning to arrange to have time for something.","ex":["Busy parents should make time to read with their children.","I try to make time for exercise every day."],"key":"make time to read","syn":["find time","set aside time","allocate time"],"reg":"neutral","ielts":"yes","note":"Good for work-life balance topics."},{"p":"make it","m":"succeed or arrive","d":"Informal phrase meaning to reach a place, manage to attend, or be successful.","ex":["Many young actors never make it in Hollywood.","I can't make it to the meeting on Friday."],"key":"make it in Hollywood","syn":["succeed","get there","manage"],"reg":"informal","ielts":"careful","note":"Informal; use 'succeed' in essays."},{"p":"make a note of sth","m":"write it down","d":"Verb phrase meaning to write something to remember it.","ex":["Please make a note of the key dates.","I made a note of her number."],"key":"make a note of the key dates","syn":["write down","record","jot down"],"reg":"neutral","ielts":"careful","note":"Fine for Task 1 letters and instructions."},{"p":"make a point of doing sth","m":"deliberately do something","d":"Verb phrase meaning to make sure to do something as it is important.","ex":["Good managers make a point of listening to staff.","She makes a point of reading the news every day."],"key":"make a point of listening","syn":["take care to","ensure","go out of the way to"],"reg":"neutral","ielts":"yes","note":"Good for habits and recommended actions."},{"p":"make yourself understood","m":"communicate your meaning clearly","d":"Verb phrase meaning to be able to express yourself so others understand, often in a foreign language.","ex":["Learners need to make themselves understood in everyday situations.","I could barely make myself understood in the market."],"key":"make themselves understood","syn":["get your message across","communicate","express yourself"],"reg":"neutral","ielts":"yes","note":"Useful for language-learning topics."},{"p":"it's only a matter of time","m":"it will surely happen soon","d":"Phrase meaning that something will certainly happen in the future.","ex":["It is only a matter of time before electric cars replace petrol ones.","It's only a matter of time until he finds out."],"key":"It is only a matter of time","syn":["sooner or later","inevitably","eventually"],"reg":"neutral","ielts":"careful","note":"Strong prediction; write 'it is' in formal text."},{"p":"may as well do sth","m":"might as well because there is no reason not to","d":"Phrase meaning that there is no good reason not to do something.","ex":["We may as well stay since the rain has started.","You may as well tell her the truth."],"key":"may as well stay","syn":["might as well","could just as well"],"reg":"informal","ielts":"no","note":"Spoken; avoid in essays."},{"p":"take it from me","m":"believe what I say","d":"Informal phrase used to tell someone to trust you because of your experience.","ex":["Take it from me, studying abroad is worth the cost.","Take it from me, it's not easy."],"key":"Take it from me","syn":["trust me","believe me","I can tell you"],"reg":"informal","ielts":"no","note":"Spoken, friendly; not for essays."},{"p":"be meant for sb/sth","m":"be intended for someone or something","d":"Phrase meaning to be designed or intended for a person or purpose.","ex":["The programme is meant for beginners.","That message was not meant for you."],"key":"is meant for beginners","syn":["be intended for","be designed for","be aimed at"],"reg":"neutral","ielts":"careful","note":"Neutral; 'intended for' sounds more academic."},{"p":"by no means; not by any means","m":"not at all","d":"Phrase meaning definitely not, used for emphasis.","ex":["The task is by no means easy.","The situation is not by any means hopeless."],"key":"by no means easy","syn":["not at all","far from","in no way"],"reg":"formal","ielts":"yes","note":"Strong emphasis; useful in Task 2 arguments."},{"p":"by means of","m":"using; through","d":"Prepositional phrase meaning using a particular method or tool.","ex":["Water is carried to the fields by means of canals.","They communicated by means of signs."],"key":"by means of canals","syn":["through","using","via","with the help of"],"reg":"formal","ielts":"yes","note":"Good for describing processes in Task 1."},{"p":"you might like/want to...","m":"I suggest you","d":"Polite phrase used to suggest an action to someone.","ex":["You might want to check the website for updates.","You might like to bring a coat."],"key":"You might want to check","syn":["you could","I suggest you","it may be wise to"],"reg":"informal","ielts":"careful","note":"Polite advice in letters; avoid in formal essays."},{"p":"might as well do sth","m":"used when there is no good reason not to do something","d":"Used to suggest doing something because no better alternative exists; followed by a bare infinitive.","ex":["Since the train was delayed by two hours, we might as well have dinner in the station café.","If you are going to be late anyway, you might as well finish the report."],"key":"might as well have","syn":["may as well","could just as well","no reason not to"],"reg":"neutral","ielts":"careful","note":"Better in Speaking; too casual for formal Task 2 essays."},{"p":"the military","m":"the armed forces of a country","d":"The army, navy and air force of a country; usually treated as a singular or plural group noun.","ex":["Many governments rely on the military to respond to natural disasters.","He decided to join the military after graduating from university."],"key":"the military","syn":["the armed forces","the army","the defence forces"],"reg":"neutral","ielts":"yes","note":"Useful in Task 2 topics on government spending and national service."},{"p":"put/set sb's mind at ease/at rest","m":"make someone stop worrying","d":"To say or do something that stops someone feeling anxious; the possessive adjective changes with the person.","ex":["The doctor's clear explanation put my mind at ease about the surgery.","The manager set her staff's minds at rest by confirming that no jobs would be lost."],"key":"put my mind at ease","syn":["reassure sb","calm sb's fears","allay sb's worries"],"reg":"neutral","ielts":"careful","note":"Good idiom for Speaking; in essays prefer 'reassure'."},{"p":"put your mind to sth","m":"decide to concentrate hard on doing something","d":"To give all your attention and effort to a task, often implying that success will follow.","ex":["If you put your mind to learning a language, you can reach fluency within a few years.","She put her mind to the problem and finally found a solution."],"key":"put your mind to learning","syn":["focus on sth","apply yourself to sth","set your sights on sth"],"reg":"neutral","ielts":"careful","note":"Nice Speaking idiom about determination; use sparingly in essays."},{"p":"mouth of a river","m":"the place where a river flows into the sea","d":"The point at which a river enters a sea, lake or larger river.","ex":["The ancient city was built at the mouth of a river, which made trade easy.","Pollution is especially severe near the mouth of a river where industrial waste collects."],"key":"mouth of a river","syn":["river mouth","estuary","outlet of a river"],"reg":"neutral","ielts":"yes","note":"Useful for describing maps and geography in Academic Task 1."},{"p":"not much of a sth","m":"not a very good example of something","d":"Used before a noun to say that someone or something is poor or disappointing in that role.","ex":["He is not much of a singer, but he performs with great enthusiasm.","The film was not much of a success at the box office."],"key":"not much of a singer","syn":["not a very good sth","hardly a sth","a poor sth"],"reg":"informal","ielts":"careful","note":"Conversational; fine in Speaking, avoid in formal essays."},{"p":"(all) to myself","m":"for my own use only, not shared","d":"Used to say that you have something alone, without sharing it with anyone; the pronoun changes with the subject.","ex":["For the first time in years, I had the whole house all to myself.","She wanted a quiet weekend to herself to recover from the stressful project."],"key":"all to myself","syn":["for my own use","exclusively mine","unshared"],"reg":"informal","ielts":"no","note":"Spoken and personal; fine in Speaking, not in academic writing."},{"p":"nowhere near","m":"very far from; not at all close to","d":"Used before an adjective, adverb or noun to emphasise that something is far from a particular level or state.","ex":["The company is nowhere near achieving its target for this year.","Public transport in rural areas is nowhere near as reliable as in cities."],"key":"nowhere near achieving","syn":["far from","not remotely","a long way from"],"reg":"neutral","ielts":"careful","note":"Good for comparisons in Speaking; use 'far from' in formal essays."},{"p":"not nearly (as/so)","m":"much less than; not at all as much as","d":"Used with 'as' or 'so' to emphasise that one thing is much less than another.","ex":["Renewable energy is not nearly as expensive as it was a decade ago.","The new policy is not nearly so effective as its supporters claimed."],"key":"not nearly as expensive","syn":["nowhere near as","far less than","not by a long way"],"reg":"neutral","ielts":"yes","note":"Handy for emphasising differences in comparison essays and Task 1."},{"p":"needless to say","m":"it is obvious, so there is no need to say it","d":"Used to introduce a statement that the speaker thinks is obvious or generally accepted.","ex":["Needless to say, education plays a crucial role in reducing poverty.","Needless to say, the government must consider the long-term costs."],"key":"Needless to say","syn":["it goes without saying","obviously","of course"],"reg":"neutral","ielts":"yes","note":"Fine as a discourse marker in Task 2; do not overuse."},{"p":"be bad/good news for sb","m":"be harmful or helpful for someone","d":"Used to describe an event or situation that will have a negative or positive effect on a person or group.","ex":["The new tax is bad news for small businesses.","Falling interest rates are good news for people with large mortgages."],"key":"bad news for small businesses","syn":["be harmful to sb","be beneficial to sb","work in sb's favour"],"reg":"informal","ielts":"careful","note":"Journalistic tone; prefer 'detrimental/beneficial' in formal essays."},{"p":"a sleepless night","m":"a night when you cannot sleep","d":"A night during which a person gets little or no sleep, usually because of worry or noise.","ex":["Anxiety about the exam gave her a sleepless night.","Parents of newborn babies often endure many sleepless nights."],"key":"a sleepless night","syn":["a restless night","a night without sleep","insomnia"],"reg":"neutral","ielts":"careful","note":"Useful in Speaking and health topics; keep essays more general."},{"p":"the norm","m":"what is usual and expected","d":"A standard or pattern that is typical or accepted in a particular group or situation.","ex":["In many countries, working from home has become the norm.","Large families were the norm a century ago."],"key":"the norm","syn":["the standard","the convention","the usual practice"],"reg":"neutral","ielts":"yes","note":"Excellent for Task 2 when describing social trends."},{"p":"return to normal","m":"become as usual again after a problem","d":"To go back to the usual state or condition after a period of disruption.","ex":["Experts predict that air travel will return to normal by next summer.","After the floods, life in the town slowly returned to normal."],"key":"return to normal","syn":["get back to normal","revert to normal","resume as usual"],"reg":"neutral","ielts":"yes","note":"Useful for describing recovery after crises in Task 2."},{"p":"not a/one","m":"not even one; none at all","d":"Used before a noun for emphasis to mean none whatsoever.","ex":["Not a single student in the class failed the final exam.","Not one of the proposals addressed the problem of housing costs."],"key":"Not a single student","syn":["not a single","none","not even one"],"reg":"neutral","ielts":"yes","note":"Adds emphasis in essays; use 'not a single' or 'not one of'."},{"p":"certainly/definitely/hopefully not","m":"used to give a strong or hopeful negative answer","d":"Short answers expressing a firm 'no', or a hope that something will not happen, depending on the adverb.","ex":["Will the tickets be cheaper next year? Definitely not, given the rising costs.","Will the crisis return? Hopefully not, if governments act early."],"key":"Definitely not","syn":["absolutely not","by no means","I hope not"],"reg":"informal","ielts":"no","note":"Spoken short answers; suitable for Speaking, not for essays."},{"p":"take note (of sth)","m":"pay attention to something and remember it","d":"To notice something carefully and consider it as important or useful; often followed by 'of'.","ex":["Policymakers should take note of the latest research on urban pollution.","Please take note that the deadline cannot be extended."],"key":"take note of","syn":["pay attention to","bear in mind","heed"],"reg":"neutral","ielts":"yes","note":"Useful in recommendations: 'Governments should take note of...'."},{"p":"stop at nothing","m":"be willing to do anything to get what you want","d":"To be determined to achieve something, using any means, even extreme or dishonest ones; followed by 'to do sth'.","ex":["Some companies stop at nothing to increase their profits.","He would stop at nothing to protect his family."],"key":"stop at nothing","syn":["go to any lengths","spare no effort","leave no stone unturned"],"reg":"neutral","ielts":"careful","note":"Dramatic tone; fine in opinion essays if used sparingly."},{"p":"nothing of the sort/kind","m":"not at all like what was said or expected","d":"Used to deny strongly what has been said or suggested.","ex":["Critics expected a disaster, but the event was nothing of the sort.","He claimed the product was safe, but it was nothing of the kind."],"key":"nothing of the sort","syn":["quite the opposite","far from it","not at all"],"reg":"neutral","ielts":"careful","note":"A bit rhetorical; occasional use in argumentative writing."},{"p":"the object of sth","m":"the aim or target of an action or feeling","d":"The purpose of an activity, or the person or thing that a feeling or action is directed at.","ex":["The object of the experiment was to test how sleep affects memory.","The mayor became the object of intense public criticism."],"key":"The object of the experiment","syn":["the purpose of sth","the aim of sth","the target of sth"],"reg":"formal","ielts":"yes","note":"Good formal alternative to 'aim' in introductions and Task 1."},{"p":"the same old arguments/face/story, etc.","m":"the usual, boring thing you have heard many times","d":"Used with a noun to criticise something as repeated and unoriginal.","ex":["The debate produced the same old arguments about taxation.","I am tired of hearing the same old story about lack of funding."],"key":"the same old arguments","syn":["the usual arguments","tired clichés","the familiar story"],"reg":"informal","ielts":"careful","note":"Critical and chatty tone; better in Speaking than essays."},{"p":"omit to do sth","m":"fail to do something, often by mistake","d":"To not do something that you should have done, either deliberately or through forgetfulness; followed by 'to' plus infinitive.","ex":["The author omitted to mention the limitations of the study.","He omitted to declare some of his income on his tax form."],"key":"omitted to mention","syn":["fail to do sth","neglect to do sth","forget to do sth"],"reg":"formal","ielts":"yes","note":"Formal and precise; useful in critique or Task 1 reports."},{"p":"be on a committee/panel, etc.","m":"be a member of an official group","d":"To belong to a group of people chosen to make decisions or give advice.","ex":["She is on a committee that reviews university admission policies.","Several scientists were on the panel that examined the proposal."],"key":"is on a committee","syn":["serve on a committee","sit on a board","be a member of a panel"],"reg":"neutral","ielts":"yes","note":"Useful for describing work or volunteering in Speaking and writing."},{"p":"on the road","m":"travelling, especially by car for a long time","d":"Travelling, particularly over a long distance, or on tour; also used for being in transit.","ex":["Sales representatives spend most of the year on the road.","The band has been on the road since January."],"key":"on the road","syn":["travelling","on tour","en route"],"reg":"informal","ielts":"careful","note":"Good for Speaking about jobs or trips; informal in essays."},{"p":"on show","m":"displayed for people to see","d":"Being exhibited publicly, as in a museum, gallery or exhibition.","ex":["Rare manuscripts from the 12th century are on show at the national library.","The latest models will be on show at the trade fair."],"key":"on show","syn":["on display","on view","on exhibition"],"reg":"neutral","ielts":"yes","note":"Fine for describing museums or events in Task 1 and Speaking."},{"p":"on site","m":"at the place where work is happening","d":"Located or happening at the actual place of work, construction or event.","ex":["The company provides on site childcare for all employees.","Engineers must be on site during the construction of the bridge."],"key":"on site","syn":["at the location","on the premises","in situ"],"reg":"neutral","ielts":"yes","note":"Common in workplace and facilities descriptions, including Task 1."},{"p":"open to discussion/suggestions, etc.","m":"ready to listen to ideas and consider them","d":"Willing to consider or accept something, such as discussion, suggestions or criticism.","ex":["The council said that the plan is open to discussion before the final vote.","Our manager is always open to suggestions from the team."],"key":"open to discussion","syn":["receptive to sth","willing to consider sth","amenable to sth"],"reg":"neutral","ielts":"yes","note":"Useful in formal letters and essays about debate."},{"p":"have a high/low opinion of sb/sth","m":"think someone or something is very good or poor","d":"To judge a person or thing favourably or unfavourably.","ex":["Many employers have a high opinion of graduates with practical experience.","Some citizens have a low opinion of the local authority."],"key":"have a high opinion of","syn":["think highly of sb","hold sb in high regard","think poorly of sb"],"reg":"neutral","ielts":"yes","note":"Natural for expressing attitudes in Task 2 and Speaking."},{"p":"be opposed to sth","m":"strongly disagree with something","d":"To disagree with a plan, idea or practice and want to prevent it; followed by a noun or gerund.","ex":["Many residents are opposed to the construction of a new airport.","Some scientists are opposed to genetic modification of crops."],"key":"are opposed to","syn":["be against sth","object to sth","be averse to sth"],"reg":"formal","ielts":"yes","note":"Strong formal phrase for stating opinions in Task 2."},{"p":"the opposite sex","m":"men if you are a woman, women if you are a man","d":"People of the sex different from your own.","ex":["Teenagers often feel nervous when they talk to the opposite sex.","The study examined how people perceive members of the opposite sex."],"key":"the opposite sex","syn":["the other sex","the opposite gender","the other gender"],"reg":"neutral","ielts":"careful","note":"Becoming dated; consider 'the other gender' in academic writing."},{"p":"the opposition","m":"the people or parties against the ruling government or a plan","d":"The political parties not in government, or any group that opposes a plan.","ex":["The opposition criticised the budget as unfair to low-income families.","There was strong opposition to the proposal among local residents."],"key":"The opposition criticised","syn":["the opposing party","the rivals","the critics"],"reg":"neutral","ielts":"yes","note":"Useful for politics topics in Task 2."},{"p":"have no option (but to do sth)","m":"have no other choice than to do something","d":"To be forced to take a particular action because there is no alternative; followed by 'but to' plus infinitive.","ex":["Facing huge debts, the firm had no option but to close several branches.","Governments have no option but to invest in clean energy."],"key":"had no option but to close","syn":["have no choice but to do sth","be left with no alternative","be forced to do sth"],"reg":"formal","ielts":"yes","note":"Strong phrase for presenting solutions as necessary in Task 2."},{"p":"or two","m":"used to say a small number, about one or two more","d":"Added after a singular noun to indicate a small, approximate number.","ex":["Give me a day or two to review the data.","Add a spoonful or two of sugar to the mixture."],"key":"a day or two","syn":["a few","a couple of","one or two"],"reg":"informal","ielts":"no","note":"Spoken and vague; use precise numbers in academic writing."},{"p":"or other","m":"used when you are not sure or not specific","d":"Used after 'some' plus noun, or a question word, to show uncertainty or vagueness about the identity.","ex":["For one reason or other, the project was never completed.","He was talking to some official or other about the permit."],"key":"For one reason or other","syn":["or another","some sort of","whatever"],"reg":"informal","ielts":"no","note":"Vague; avoid in formal essays that need precision."},{"p":"other than","m":"except for; apart from","d":"Used to introduce an exception to what has just been said; also means 'different from' after negatives.","ex":["Other than a few minor errors, the report was accurate.","The committee had no choice other than to resign."],"key":"Other than a few minor errors","syn":["apart from","except for","aside from"],"reg":"neutral","ielts":"yes","note":"Good for exceptions in essays and describing data."},{"p":"other than that","m":"apart from what I just said","d":"Used after a statement to say that everything else is acceptable or unchanged.","ex":["The hotel was noisy, but other than that, it was a pleasant stay.","Other than that, the results were consistent across all groups."],"key":"other than that","syn":["apart from that","aside from that","otherwise"],"reg":"informal","ielts":"careful","note":"Fine in Speaking; use 'otherwise' or 'apart from this' in essays."},{"p":"out of tune","m":"not at the correct musical pitch","d":"Not producing the right musical notes; also used figuratively for being out of agreement with something.","ex":["The violin sounded out of tune during the performance.","The government's policies are out of tune with public opinion."],"key":"out of tune","syn":["off-key","discordant","out of step"],"reg":"neutral","ielts":"careful","note":"Literal use in music topics; figurative 'out of tune with' is stylish."},{"p":"a passion for sth","m":"a very strong love or enthusiasm for something","d":"An intense enthusiasm for an activity or subject.","ex":["She developed a passion for astronomy as a child.","His passion for teaching inspired many students."],"key":"a passion for astronomy","syn":["a love of sth","a keen interest in sth","enthusiasm for sth"],"reg":"neutral","ielts":"yes","note":"Excellent for Speaking Part 1 and 2 about hobbies and careers."},{"p":"the people","m":"ordinary citizens of a country","d":"The ordinary population of a country, as opposed to its government or elite.","ex":["In a democracy, the government is chosen by the people.","The new law was designed to serve the people rather than powerful companies."],"key":"the people","syn":["the public","the citizens","the population"],"reg":"neutral","ielts":"yes","note":"Common in politics essays; 'the public' is often more precise."},{"p":"personal hygiene","m":"keeping your body clean to stay healthy","d":"The practice of keeping oneself clean in order to maintain health and prevent disease.","ex":["Good personal hygiene reduces the spread of infectious diseases.","Schools should teach children about personal hygiene from an early age."],"key":"personal hygiene","syn":["cleanliness","personal cleanliness","body care"],"reg":"formal","ielts":"yes","note":"Useful for health and education topics in Task 2."},{"p":"take sth personally","m":"feel upset because you think a remark is aimed at you","d":"To react to a comment or event as if it were a deliberate criticism of oneself.","ex":["Try not to take his criticism personally; he treats everyone that way.","Some people take failure too personally and lose confidence."],"key":"take his criticism personally","syn":["be offended by sth","take offence","feel hurt by sth"],"reg":"neutral","ielts":"careful","note":"Better for Speaking about relationships; rarely needed in essays."},{"p":"sb's strong point","m":"something a person is especially good at","d":"A skill or quality in which a person is particularly good.","ex":["Communication is her strong point, so she excels in customer service.","Mathematics was never my strong point at school."],"key":"her strong point","syn":["strength","forte","strong suit"],"reg":"neutral","ielts":"yes","note":"Useful for describing abilities in Speaking and job letters."},{"p":"the poor","m":"people who have very little money","d":"People who have little money or few possessions; used with a plural verb.","ex":["The government should do more to support the poor.","Heavy taxes on basic goods hit the poor hardest."],"key":"the poor","syn":["people in poverty","the needy","the disadvantaged"],"reg":"neutral","ielts":"careful","note":"Common but blunt; 'people living in poverty' sounds more sensitive."},{"p":"be populated","m":"have people living there","d":"Said of a place that has inhabitants; often followed by 'by' or used with adverbs such as 'densely'.","ex":["The coastal region is densely populated by fishing communities.","Large parts of the country are sparsely populated."],"key":"is densely populated","syn":["be inhabited","be settled","be occupied"],"reg":"formal","ielts":"yes","note":"Very useful for demography and Academic Task 1 maps."},{"p":"be in a position to do sth","m":"be able to do something because of your situation","d":"To have the power, means or opportunity to do something.","ex":["Wealthy countries are in a position to offer financial aid.","The company is not in a position to raise salaries this year."],"key":"are in a position to offer","syn":["be able to do sth","have the means to do sth","be well placed to do sth"],"reg":"formal","ielts":"yes","note":"Formal and flexible; good for Task 2 argument about responsibility."},{"p":"possible","m":"able to happen or be done","d":"Adjective describing something that can happen, exist or be done; often used with 'as ... as' or in 'if possible'.","ex":["Governments should act as quickly as possible.","It is possible to reduce emissions without harming economic growth."],"key":"as quickly as possible","syn":["feasible","achievable","conceivable"],"reg":"neutral","ielts":"yes","note":"Core academic word; 'It is possible that...' is useful hedging."},{"p":"practice","m":"the usual way of doing something, or repeated training","d":"Noun meaning a habitual or customary way of doing something, or repeated exercise to improve a skill; spelled 'practise' as a verb in British English.","ex":["Child labour is still common practice in some industries.","Regular practice is essential for mastering a foreign language."],"key":"common practice","syn":["custom","habit","routine","training"],"reg":"neutral","ielts":"yes","note":"Watch spelling: noun 'practice', British verb 'practise'."},{"p":"danger/difficulty/problem, etc.","m":"pattern showing a noun used after 'of' or 'in'","d":"A placeholder pattern for nouns of difficulty or risk, such as 'the danger of', 'difficulty in', 'a problem with'.","ex":["There is a danger of overfishing if quotas are not enforced.","Many migrants face difficulty in finding stable housing."],"key":"a danger of overfishing","syn":["risk of sth","challenge in sth","hazard of sth"],"reg":"neutral","ielts":"yes","note":"Learn the prepositions: danger of, difficulty in, problem with."},{"p":"good/bad press","m":"positive or negative reports in newspapers and media","d":"Favourable or unfavourable coverage of a person, company or event in the media.","ex":["The airline has received bad press since the safety incident.","The scheme enjoyed good press after its first year."],"key":"bad press","syn":["negative publicity","positive coverage","media criticism"],"reg":"neutral","ielts":"yes","note":"Good for media and business topics in Task 2."},{"p":"prior to sth","m":"before something","d":"A formal preposition meaning before a particular time or event; followed by a noun or gerund.","ex":["Prior to the 1990s, few households owned a computer.","Participants completed a questionnaire prior to the interview."],"key":"Prior to the 1990s","syn":["before","preceding","in advance of"],"reg":"formal","ielts":"yes","note":"Formal alternative to 'before' in Task 1 and Task 2."},{"p":"buyers/employers/parents, etc.","m":"pattern showing a plural noun for a group of people","d":"A placeholder for plural nouns that name groups of people, such as buyers, employers or parents.","ex":["Employers increasingly value communication skills over qualifications.","Parents play a key role in shaping children's attitudes to education."],"key":"Employers increasingly value","syn":["groups of people","stakeholders","those concerned"],"reg":"neutral","ielts":"yes","note":"Using such group nouns makes Task 2 arguments more concrete."},{"p":"put a stop to sth","m":"make something end","d":"To cause an undesirable activity or situation to end; followed by a noun or gerund.","ex":["The council introduced fines to put a stop to illegal dumping.","Strict laws could put a stop to online fraud."],"key":"put a stop to","syn":["end sth","halt sth","bring sth to an end"],"reg":"neutral","ielts":"yes","note":"Strong phrase for solutions in Task 2."},{"p":"be a question of","m":"depend on or involve a particular matter","d":"Used to say that the main issue or requirement is a particular thing; followed by a noun or gerund.","ex":["Success is largely a question of motivation and consistent effort.","It is often a question of balancing economic growth with environmental protection."],"key":"a question of motivation","syn":["come down to sth","depend on sth","be a matter of sth"],"reg":"neutral","ielts":"yes","note":"Useful for framing the core issue in introductions."},{"p":"race along/down/over, etc.","m":"move very quickly in a direction","d":"To move or travel very fast along or across something; the preposition shows direction.","ex":["Children raced along the beach in the early morning.","The motorbike raced down the empty road."],"key":"raced along the beach","syn":["dash along","speed down","rush across"],"reg":"neutral","ielts":"careful","note":"Descriptive; good for narrative Speaking, less common in essays."},{"p":"raise your voice","m":"speak more loudly, often when angry","d":"To speak louder, usually because of anger or to be heard; also to speak out in protest.","ex":["He never raised his voice, even when the discussion became heated.","Citizens must raise their voices against injustice."],"key":"raised his voice","syn":["shout","speak up","speak out"],"reg":"neutral","ielts":"careful","note":"Literal in Speaking; figurative use can work in opinion essays."},{"p":"be a rarity","m":"be something that hardly ever happens or exists","d":"To be uncommon or unusual; used for things that are seldom seen or found.","ex":["Handwritten letters are a rarity in the age of email.","Such clear evidence is a rarity in social science research."],"key":"are a rarity","syn":["be uncommon","be few and far between","be scarce"],"reg":"neutral","ielts":"yes","note":"Useful for describing declining customs or scarcity."},{"p":"first-/second-/third-rate","m":"of high, average or low quality","d":"Compound adjective describing the quality of something; 'first-rate' means excellent and 'third-rate' means poor.","ex":["The city offers first-rate healthcare facilities.","He was criticised for producing third-rate work."],"key":"first-rate","syn":["top-quality","excellent","inferior"],"reg":"neutral","ielts":"careful","note":"'First-rate' is fine; 'third-rate' sounds harsh in formal writing."},{"p":"the rear","m":"the back part of something","d":"The back section of a building, vehicle or group; often used in 'at the rear of'.","ex":["The emergency exit is located at the rear of the building.","Seat belts are required for passengers at the rear of the car."],"key":"at the rear","syn":["the back","the back end","the hind part"],"reg":"formal","ielts":"yes","note":"Useful for describing positions on maps in Task 1."},{"p":"a reflection of sth","m":"something that shows the nature or state of something else","d":"Something that reveals or is a sign of a particular situation, attitude or quality.","ex":["The rise in volunteering is a reflection of growing social awareness.","Her success is a reflection of years of hard work."],"key":"a reflection of growing social awareness","syn":["a sign of sth","an indication of sth","a mirror of sth"],"reg":"formal","ielts":"yes","note":"Strong analytical phrase for explaining trends in Task 2."},{"p":"regardless of","m":"without being affected by something","d":"Preposition meaning without considering or being influenced by a factor; followed by a noun or wh-clause.","ex":["Education should be available to all children regardless of their income.","Regardless of the cost, the government decided to proceed."],"key":"regardless of their income","syn":["irrespective of","despite","no matter"],"reg":"formal","ielts":"yes","note":"Excellent for equality and rights arguments in Task 2."},{"p":"the rich","m":"people who have a lot of money","d":"Wealthy people considered as a group; used with a plural verb.","ex":["Critics argue that the tax system favours the rich.","The gap between the rich and the poor has widened."],"key":"the rich","syn":["the wealthy","the affluent","high-income groups"],"reg":"neutral","ielts":"yes","note":"Common in inequality topics; 'the wealthy' sounds more formal."},{"p":"have a/no right to do sth","m":"be allowed or not allowed to do something by moral or legal rule","d":"To have or lack the legal or moral entitlement to do something; followed by 'to' plus infinitive.","ex":["Every citizen has a right to vote in free elections.","Employers have no right to read private emails."],"key":"has a right to vote","syn":["be entitled to do sth","be permitted to do sth","have the authority to do sth"],"reg":"formal","ielts":"yes","note":"Key phrase in Task 2 essays about rights and responsibilities."},{"p":"rip sth out/off/from, etc.","m":"pull something away with force","d":"To remove something by pulling it violently from its place; the particle shows direction.","ex":["Workers ripped out the old carpet before painting the floor.","The storm ripped the roof off several houses."],"key":"ripped out","syn":["tear out","pull off","wrench away"],"reg":"neutral","ielts":"careful","note":"Physical and vivid; good in descriptive Speaking, not academic essays."},{"p":"the root of sth","m":"the basic cause of something","d":"The fundamental cause or origin of a problem or situation; often in 'get to the root of'.","ex":["Poverty is often at the root of crime.","Researchers are trying to get to the root of the problem."],"key":"at the root of crime","syn":["the cause of sth","the source of sth","the origin of sth"],"reg":"neutral","ielts":"yes","note":"Strong phrase for cause-and-effect arguments in Task 2."},{"p":"be/lie in ruins","m":"be badly damaged or destroyed","d":"To be in a state of destruction, either literally (buildings) or figuratively (plans, economy).","ex":["After the earthquake, much of the old town lay in ruins.","The country's economy was in ruins after the long war."],"key":"lay in ruins","syn":["be destroyed","be devastated","be in tatters"],"reg":"neutral","ielts":"yes","note":"Works for disasters and history; figurative use is effective."},{"p":"running water","m":"water supplied through pipes to a home","d":"Water that is supplied directly to buildings by pipes, or water that flows in a river or stream.","ex":["Many rural villages still lack access to running water.","Houses in the area now have running water and electricity."],"key":"running water","syn":["piped water","tap water","mains water"],"reg":"neutral","ielts":"yes","note":"Useful for infrastructure and development topics."},{"p":"safe to say","m":"reasonable to state with confidence","d":"Used to introduce a statement the speaker believes is true or unlikely to be challenged; often 'It is safe to say that...'.","ex":["It is safe to say that technology has transformed the way we work.","It is safe to say that most people favour stricter safety standards."],"key":"safe to say","syn":["fair to say","reasonable to assume","it is clear that"],"reg":"neutral","ielts":"yes","note":"Good hedging phrase for stating opinions in essays."},{"p":"a safe place; somewhere safe","m":"a location where nothing bad can happen to you","d":"A secure location where someone or something is protected from harm or theft.","ex":["Please keep your passport in a safe place during the trip.","Refugees need somewhere safe to rebuild their lives."],"key":"in a safe place","syn":["a secure location","a haven","a refuge"],"reg":"neutral","ielts":"careful","note":"Fine in Speakin
