<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Writing Master</title>
<meta name="description" content="Offline IELTS Academic Writing preparation: topics, model essays, Task 1, vocabulary trainer and writing studio.">
<style>
:root{
  --bg:#f5f6fb;--surface:#ffffff;--surface2:#f0f2f9;--text:#1a2033;--muted:#566079;--border:#dfe3ee;
  --primary:#4338ca;--primary-ink:#ffffff;--primary-soft:#e9e8fd;--accent:#0f766e;--accent-soft:#d9f2ee;
  --danger:#b91c1c;--danger-soft:#fde4e4;--ok:#047857;--ok-soft:#d6f3e6;--warn:#a15c07;--warn-soft:#fdeccd;
  --shadow:0 1px 2px rgba(20,28,60,.06),0 4px 14px rgba(20,28,60,.06);
  --c1:#4338ca;--c2:#0f766e;--c3:#c2410c;--c4:#7e22ce;--c5:#a16207;
  --radius:14px;--sidebar:262px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
:root[data-theme="dark"]{
  --bg:#0e1220;--surface:#161b2e;--surface2:#1d2338;--text:#e9ecf6;--muted:#a5aec6;--border:#2a3250;
  --primary:#9aa0ff;--primary-ink:#0e1220;--primary-soft:#262c55;--accent:#4fd1c0;--accent-soft:#143a3a;
  --danger:#ff8a8a;--danger-soft:#3b1a1f;--ok:#5fe0a8;--ok-soft:#123628;--warn:#f5c26b;--warn-soft:#3a2d12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --c1:#9aa0ff;--c2:#4fd1c0;--c3:#ff9f6b;--c4:#d3a1ff;--c5:#f2cf6a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0e1220;--surface:#161b2e;--surface2:#1d2338;--text:#e9ecf6;--muted:#a5aec6;--border:#2a3250;
    --primary:#9aa0ff;--primary-ink:#0e1220;--primary-soft:#262c55;--accent:#4fd1c0;--accent-soft:#143a3a;
    --danger:#ff8a8a;--danger-soft:#3b1a1f;--ok:#5fe0a8;--ok-soft:#123628;--warn:#f5c26b;--warn-soft:#3a2d12;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --c1:#9aa0ff;--c2:#4fd1c0;--c3:#ff9f6b;--c4:#d3a1ff;--c5:#f2cf6a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:1.75rem}h2{font-size:1.3rem}h3{font-size:1.08rem}h4{font-size:.98rem}
p{margin:0 0 .8em}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--primary-ink);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:1.05rem}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:650}
.nav svg{flex:0 0 auto}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;font-size:.85rem;color:var(--muted)}
.content-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;gap:12px}
.topbar strong{flex:1}
main{padding:28px clamp(16px,3vw,40px) 80px;max-width:1240px;width:100%;margin:0 auto;outline:none;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scrim{display:none}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:25}
  .topbar{display:flex}
}
body.focus-mode .sidebar,body.focus-mode .topbar{display:none}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{margin:0;color:var(--muted)}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:8px}
.crumbs a{color:var(--muted)}

/* components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.93rem;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.again{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.hard{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.easy{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
.iconbtn.on{color:#b7791f;background:var(--warn-soft);border-color:transparent}
:root[data-theme="dark"] .iconbtn.on{color:#f5c26b}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:.8rem;font-weight:600;border:1px solid transparent}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--border);color:var(--text)}
.chip.on{background:var(--primary-soft);color:var(--primary)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.label{font-size:.82rem;font-weight:650;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;align-items:flex-end}
.filters .field{min-width:160px;flex:1 1 160px}
.filters .field.grow{flex:2 1 240px}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease}
.progress.ok>i{background:var(--ok)}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.stackbar i{display:block;height:100%}
.stat .num{font-size:2rem;font-weight:750;line-height:1.1;letter-spacing:-.02em}
.stat .lab{color:var(--muted);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.stat .sub{color:var(--muted);font-size:.83rem;margin-top:6px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface)}
.empty strong{display:block;color:var(--text);margin-bottom:4px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:0}
.bullets{margin:0;padding-left:1.15em}
.bullets li{margin:.25em 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.note-box{background:var(--primary-soft);color:var(--text);border-radius:12px;padding:12px 14px;font-size:.92rem}
.note-box.warn{background:var(--warn-soft)}
.note-box.ok{background:var(--ok-soft)}
.note-box.danger{background:var(--danger-soft)}
details>summary{cursor:pointer;font-weight:600}
.tcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .15s ease,border-color .15s ease}
.tcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.tcard h3{margin:0}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.dots i.on{background:var(--primary)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}

/* essays */
.essay-text{font-family:var(--serif);font-size:1.06rem;line-height:1.8}
.essay-text p{margin:0 0 1.1em}
.essay-text mark{background:var(--warn-soft);color:inherit;padding:0 2px;border-radius:3px}
.plabel{font-family:var(--font);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);display:block;margin-bottom:2px}
.question-box{border-left:4px solid var(--primary);background:var(--surface2);padding:12px 16px;border-radius:0 12px 12px 0;font-weight:500}
.vocab-pill{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.vocab-pill:first-child{border-top:0}
.vocab-pill b{color:var(--primary)}

/* flashcards */
.session{max-width:760px;margin:0 auto}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:30px 24px}
.flash .term{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:750;letter-spacing:-.02em}
.flash .pos{color:var(--muted);font-size:.9rem}
.reveal{text-align:left;border-top:1px solid var(--border);padding-top:14px;display:grid;gap:8px}
.reveal .k{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.reveal .uz{font-size:1.25rem;font-weight:700;color:var(--accent)}
.sentence{font-size:1.15rem;line-height:1.7;text-align:left}
.sentence .gap{display:inline-block;min-width:100px;border-bottom:3px solid var(--primary);text-align:center;color:var(--primary);font-weight:700}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{padding:12px 14px;border:2px solid var(--border);background:var(--surface);border-radius:12px;cursor:pointer;text-align:left;font-weight:600}
.opt:hover{border-color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.verdict{padding:10px 14px;border-radius:12px;font-weight:650;text-align:left}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--danger-soft);color:var(--danger)}
.modecard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;cursor:pointer;width:100%}
.modecard:hover{border-color:var(--primary)}
.modecard .ic{color:var(--primary)}

/* studio */
.studio{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;gap:16px;align-items:start}
.studio.compare{grid-template-columns:300px minmax(0,1fr) 330px}
body.focus-mode .studio{grid-template-columns:minmax(0,1fr)}
body.focus-mode .studio .side-l,body.focus-mode .studio .side-r{display:none}
@media (max-width:1180px){.studio,.studio.compare{grid-template-columns:minmax(0,1fr)}}
.editor-wrap{display:flex;flex-direction:column;gap:10px}
.editor-split{display:grid;gap:14px;grid-template-columns:1fr}
.editor-split.compare{grid-template-columns:1fr 1fr}
@media (max-width:900px){.editor-split.compare{grid-template-columns:1fr}}
#editor{min-height:420px;font-family:var(--serif);font-size:1.08rem;line-height:1.75;padding:16px 18px;border-radius:14px}
.statusbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.9rem;color:var(--muted)}
.statusbar b{color:var(--text)}
.timer{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:750;letter-spacing:.02em}
.timer.low{color:var(--danger)}
.model-pane{max-height:640px;overflow:auto}
.sticky{position:sticky;top:14px}
.diag td{padding:4px 10px 4px 0;vertical-align:top}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.chk input{margin-top:4px;flex:0 0 auto}

/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.chart .axis{stroke:var(--border)}
svg.chart .grid{stroke:var(--border);stroke-dasharray:3 4}
svg.chart .lbl{fill:var(--text);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.visual{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.visual h4{margin:0 0 8px;font-size:.95rem}
table.data{width:100%;border-collapse:collapse;font-size:.93rem}
table.data th,table.data td{border:1px solid var(--border);padding:7px 10px;text-align:left}
table.data th{background:var(--surface2)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(8,12,28,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal h2{margin-top:0}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:.92rem;animation:fade .2s ease}
.toast.warn{background:var(--warn);color:#fff}
:root[data-theme="dark"] .toast.warn{color:#1b1400}
.banner{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--text);font-size:.9rem;margin-bottom:14px}

</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><div class="brand-mark" aria-hidden="true">IW</div><div>IELTS Writing Master<small>Personal writing coach</small></div></div>
    <nav aria-label="Sections"><ul class="nav" id="nav"></ul></nav>
    <div class="side-foot">
      <div id="side-foot-info"></div>
      <button class="btn sm theme-toggle" type="button" aria-label="Toggle theme"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content-wrap">
    <header class="topbar">
      <button class="iconbtn" id="menu-btn" type="button" aria-label="Open navigation"><span class="menu-icon"></span></button>
      <strong id="topbar-title">Dashboard</strong>
      <button class="iconbtn theme-toggle" type="button" aria-label="Toggle theme"></button>
    </header>
    <main id="main" tabindex="-1"><noscript>This app needs JavaScript enabled.</noscript></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script>
"use strict";
/* ===== DATA: TOPIC LIBRARY (Task 2 themes) ===== */
const TOPIC_GROUPS = ["People & Society","Technology & Science","Environment & Places","Economy & Work","Health & Lifestyle","Law & Media"];

const TOPICS = [
{id:"edu",name:"Education and learning",group:"People & Society",
 sub:["Online and distance learning","Vocational vs academic study","University funding and tuition fees","Teacher quality and class size","Homework and exams","Lifelong learning","Studying abroad","Arts and practical subjects in the curriculum"],
 args:["Education is the main driver of social mobility and long-term economic growth.","Practical and vocational skills deserve the same status as academic qualifications.","Teacher quality matters more than expensive facilities.","Exam-focused systems can reduce creativity and increase student stress."],
 adv:["Flexible, cheaper access through online learning","Better job prospects and higher earning potential","Wider social and cultural horizons through study abroad"],
 dis:["Reduced face-to-face interaction in online study","The digital divide excludes poorer learners","Heavy debt from tuition fees"],
 cau:["Underfunding of public schools","Teacher shortages and low pay","A culture that rewards test scores above understanding"],
 eff:["A widening skills gap between graduates and employers","Graduate unemployment or underemployment","Greater inequality between rich and poor students"],
 sol:["Invest in teacher training and fair pay","Combine academic study with work placements","Offer targeted scholarships and affordable devices"],
 ex:["Germany's dual apprenticeship system combines classroom study with paid work.","Massive open online courses (MOOCs) allow anyone with internet access to study university-level material.","Finland is often cited for its emphasis on teacher training and limited standardised testing."]},
{id:"tech",name:"Technology and artificial intelligence",group:"Technology & Science",
 sub:["Automation and jobs","AI in healthcare and education","Smartphones and screen time","Online privacy and data","Social robots and driverless cars","Digital skills for older people","Cybersecurity","Technology and communication"],
 args:["Technology increases productivity but may displace routine jobs.","Rapid innovation should be matched by regulation to protect privacy.","Technology can connect people but may weaken face-to-face relationships.","Access to digital tools is now a basic requirement for full participation in society."],
 adv:["Faster, cheaper communication and information access","Higher productivity and new industries","Better diagnosis and personalised services"],
 dis:["Job losses in routine occupations","Privacy risks and data misuse","Over-reliance and reduced practical skills"],
 cau:["Falling costs of computing power","Consumer demand for convenience","Competition between companies to automate"],
 eff:["Changing labour markets that reward digital skills","Addictive habits and weaker concentration","Concerns about surveillance and misinformation"],
 sol:["Retrain workers for new roles","Introduce strict data-protection laws","Teach digital literacy and healthy device habits"],
 ex:["Automated checkouts have reduced demand for cashiers in many supermarkets.","Navigation apps have changed how people travel and plan journeys.","Telemedicine allows patients in remote areas to consult specialists."]},
{id:"env",name:"Environment and climate change",group:"Environment & Places",
 sub:["Global warming and emissions","Plastic and household waste","Renewable energy","Deforestation and biodiversity","Individual vs government responsibility","Air and water pollution","Sustainable consumption","Natural disasters and adaptation"],
 args:["Climate change is a global problem that requires international cooperation.","Governments, not individuals alone, have the power to change energy systems.","Economic growth and environmental protection can be reconciled through green technology.","Short-term costs of action are smaller than the long-term costs of inaction."],
 adv:["Cleaner air and healthier communities","Long-term savings from renewable energy","Protection of ecosystems and biodiversity"],
 dis:["High up-front costs for green infrastructure","Possible job losses in fossil-fuel industries","Higher prices for consumers in the short term"],
 cau:["Burning fossil fuels for energy and transport","Large-scale deforestation","Throwaway consumer culture"],
 eff:["Rising sea levels and extreme weather","Loss of habitats and species","Pressure on food and water supplies"],
 sol:["Invest in renewable energy and public transport","Introduce carbon pricing and tougher regulation","Encourage recycling and reduce single-use plastic"],

const ESSAYS_1 = [
{id:"e01",t:"edu",t2:"work",ty:"A",d:2,
q:"Universities should focus on teaching practical, job-related skills rather than theoretical knowledge. To what extent do you agree or disagree?",
th:"I partly agree that universities should place more emphasis on employable skills, but theoretical knowledge must remain at the core of degree programmes.",
p:[
"Many employers complain that graduates arrive at work with impressive qualifications but little practical ability. This has led some people to argue that universities should concentrate on job-related skills. I partly agree that universities should place more emphasis on employable skills, but theoretical knowledge must remain at the core of degree programmes.",
"There is a strong case for giving practical training a larger role. Graduates who have completed work placements, laboratory projects or real client assignments tend to adapt to the workplace faster, because they already understand how to meet deadlines, communicate with colleagues and solve unfamiliar problems. Such experience also helps students to discover which careers suit them before they commit to a profession. In fields such as engineering or nursing, programmes that combine classroom study with supervised practice have a clear advantage over purely lecture-based courses. Employers consistently report that candidates with such experience are easier to train.",
"However, abandoning theory would be a mistake. Technical skills quickly become outdated, whereas a solid understanding of principles allows graduates to learn new methods throughout their careers. A student who understands the basic logic of statistics, for example, can adapt to any new data software, while someone who has only memorised one program may struggle when it changes. Theoretical study also develops critical thinking, which employers value but which cannot be taught through short training courses alone. Universities are therefore best placed to teach principles, leaving specific tools to be learned on the job.",
"In conclusion, universities should integrate practical experience into their courses, but not at the expense of theoretical foundations. A balanced curriculum prepares graduates both for their first job and for a lifetime of changing work."],
pe:["Paraphrases the debate and gives a partial-agreement thesis that shows the structure of the essay.","Supports the 'agree' part of the position: practical training helps adaptation and career choice. Uses fields as examples.","Explains the limit of the agreement: theory builds transferable understanding and critical thinking. Uses a concrete contrast.","Restates the balanced position and summarises both parts."],
v:["employable skills :: abilities that make a person attractive to employers","work placement :: a period of supervised work as part of a course","adapt to the workplace :: adjust to the demands of a job","transferable skills :: skills useful in many different jobs","become outdated :: stop being useful because newer methods exist","critical thinking :: the ability to analyse and evaluate ideas"],
sp:["I partly agree that ..., but ... must remain ...","Graduates who ... tend to ..., because ...","..., whereas ..., for example, ...","In conclusion, ... should ..., but not at the expense of ..."],
note:"The essay answers 'to what extent' with a clear, consistent partial-agreement position. Each body paragraph develops one side of that position with explanation and a field-specific example, so the reader never has to guess the writer's view."},

{id:"e02",t:"health",t2:"govt",ty:"A",d:2,
q:"Governments should impose higher taxes on unhealthy food and drinks to improve public health. To what extent do you agree or disagree?",
th:"I largely agree that taxing unhealthy products is a worthwhile policy, provided that it is accompanied by other measures.",
p:[
"Diet-related illnesses such as diabetes and heart disease place heavy burdens on health services in many countries. One proposed response is to raise taxes on sugary drinks and fast food. I largely agree that taxing unhealthy products is a worthwhile policy, provided that it is accompanied by other measures.",
"The main strength of such taxes is that they change the price signals that consumers see. When a sugary drink becomes noticeably more expensive, some people will switch to water or cheaper, healthier options, and manufacturers often respond by reducing the sugar content of their products to avoid the tax. Several countries that introduced levies on sugary beverages saw companies reformulate their recipes, which improved the average nutritional quality of the drinks on sale without requiring any change of behaviour from shoppers. In this way, the tax can improve diet quality across the whole population, not only among individuals who choose to read nutrition labels.",
"A second advantage is that the revenue can be used to fund public health. If the money raised is spent on school meals, sports facilities or fresh-food subsidies, the policy benefits low-income families who might otherwise be harmed by higher prices. Nevertheless, a tax alone will not solve the problem. People also need clear nutrition education and easy access to affordable fresh food, especially in neighbourhoods where fast food is the only convenient option.",
"In conclusion, taxing unhealthy food and drink can encourage healthier choices and generate funds for prevention, but it works best as one part of a wider strategy that includes education and access to better alternatives."],
pe:["Introduces the health problem and gives a 'largely agree' position with a condition.","Argument 1: prices change behaviour and producers' recipes. Evidence is general and avoids invented statistics.","Argument 2: revenue funds prevention; limits of the policy are acknowledged to stay credible.","Restates position and summarises the two arguments plus the condition."],
v:["place a heavy burden on :: cause serious pressure on","price signal :: the information about value that price gives consumers","reformulate :: change a recipe or product","low-income families :: households with little money","nutrition education :: teaching people about healthy eating","a wider strategy :: a larger plan involving several measures"],
sp:["I largely agree that ..., provided that ...","When ... becomes ..., some people will ..., and ... often respond by ...","Nevertheless, ... alone will not ...","... works best as one part of ..."],
note:"The thesis is clear and conditional, so the essay can both support the tax and recognise its limits. The examples are general and truthful, which keeps the argument credible without invented figures."},

{id:"e03",t:"crime",ty:"A",d:2,
q:"The best way to reduce crime is to give longer prison sentences to criminals. To what extent do you agree or disagree?",
th:"I disagree that longer sentences are the best solution, because crime is more effectively reduced by prevention and rehabilitation.",
p:[
"Politicians often respond to public fear of crime by promising tougher punishments. While long prison sentences may seem a logical answer, I disagree that longer sentences are the best solution, because crime is more effectively reduced by prevention and rehabilitation.",
"The first problem with long sentences is that their deterrent effect is weaker than many people assume. Most offenders do not carefully calculate the length of a possible sentence before acting; they expect to avoid being caught. What deters them more is the likelihood of being detected, which depends on effective policing rather than on harsher penalties. Moreover, prisons are expensive to run, and money spent keeping offenders inside for longer periods could be used to fund services that prevent crime in the first place. Longer sentences may even raise costs without improving public safety.",
"A better approach is to address the causes of offending and to help prisoners return to society. Many people commit crimes because of poverty, lack of education or limited job prospects. When prisoners receive training and educational support, they are better prepared to find legitimate work after release and are less likely to reoffend. Similarly, youth programmes and community projects can give young people constructive alternatives before they turn to crime. Admittedly, dangerous offenders must be kept away from the public, but this does not require longer sentences for every crime. In this way, prisoners return to society with skills rather than only with a criminal record.",
"In conclusion, long prison terms are an expensive and uncertain tool. Investing in prevention, effective policing and rehabilitation offers a more sustainable way to make societies safer."],
pe:["Gives context (political promises) and a clear disagree thesis with a reason.","Argues that deterrence is weak and costs are high; links certainty of capture to effective policing.","Offers an alternative (rehabilitation, prevention) and concedes a limited point to remain balanced.","Concludes by restating the position and the preferred approach."],

sp:["While ... may seem ..., I disagree that ..., because ...","What deters them more is ..., which depends on ... rather than on ...","Admittedly, ...; however, this does not require ...","In conclusion, ... offers a more sustainable way to ..."],
note:"The writer disagrees directly, gives two supported reasons, and makes a small concession that increases credibility. The conclusion repeats the position without copying the introduction."},

{id:"e04",t:"arts",t2:"govt",ty:"A",d:2,
q:"Governments should spend less on the arts and more on essential services such as healthcare and education. To what extent do you agree or disagree?",
th:"I disagree that arts funding should be cut, although I accept that essential services must remain the first priority.",
p:[
"Public budgets are always limited, so governments must decide how to divide money between competing needs. Some people argue that the arts are a luxury that should be funded less than healthcare and education. I disagree that arts funding should be cut, although I accept that essential services must remain the first priority.",
"It is true that hospitals and schools meet basic needs, and no government should neglect them. However, the amount spent on the arts is usually a small share of total public spending, so reducing it would not significantly improve health or education budgets. At the same time, the cultural sector provides jobs for musicians, designers, technicians and guides, and it attracts visitors who spend money in local shops and hotels. In this way, funding for museums and theatres can contribute to the economy rather than merely consume resources. Many cultural institutions also raise part of their income from ticket sales and private donations, which reduces the burden on taxpayers.",
"More importantly, the arts provide benefits that are hard to measure but valuable. Children who take part in music, drama or painting often develop confidence, creativity and teamwork, which support their performance in other subjects. Public galleries and libraries also offer free or low-cost cultural experiences to families who could not afford private entertainment. If arts funding disappeared, such opportunities would be limited to wealthier people, which would widen social inequality. A society that values only what can be measured in money risks neglecting the experiences that make life meaningful.",
"In conclusion, healthcare and education should receive priority, but cutting arts funding would bring limited savings and substantial cultural and social costs. A balanced budget should protect both."],
pe:["Frames the budget dilemma and states disagreement with a concession.","Concedes the importance of essential services, then argues that arts spending is small and economically useful.","Gives a social argument: creativity and access. Links consequences to inequality.","Concludes with a balanced budget message."],
v:["public budgets :: the money governments have to spend","competing needs :: different demands for the same resources","contribute to the economy :: help economic activity","hard to measure :: difficult to count or quantify","creativity and teamwork :: imaginative thinking and working together","widen social inequality :: increase the gap between groups"],
sp:["I disagree that ..., although I accept that ...","It is true that ...; however, ...","More importantly, ...","If ... disappeared, such ... would be limited to ..., which would ..."],
note:"The essay makes a concession to show that the writer understands the opposite view, then explains why the position still stands. It avoids invented statistics by using proportional language ('a small share')."},

/* B: Discuss both views */
{id:"e05",t:"tech",t2:"work",ty:"B",d:2,
q:"Some people believe that artificial intelligence will make many human workers unnecessary. Others think it will create new kinds of jobs. Discuss both views and give your opinion.",
th:"Although automation will undoubtedly remove many existing roles, I believe that new jobs will emerge, provided that workers are given opportunities to retrain.",
p:[
"Artificial intelligence is now capable of tasks that once required human judgement, from translating documents to analysing medical scans. As a result, some people fear mass unemployment, while others expect new opportunities. Although automation will undoubtedly remove many existing roles, I believe that new jobs will emerge, provided that workers are given opportunities to retrain.",
"Those who fear job losses have a reasonable argument. Machines can already perform routine tasks faster and more cheaply than people, and companies have a strong financial incentive to adopt them. Clerical work, customer service and basic data analysis are particularly vulnerable. If large numbers of workers in these areas lose their jobs at the same time, the social consequences could be serious, especially for older employees who may find it difficult to change careers. Without support, they could face long periods of unemployment.",
"On the other hand, history suggests that technology often creates as many roles as it destroys. Previous waves of automation reduced agricultural and factory employment but also produced entirely new professions in transport, electronics and services. Similarly, artificial intelligence will require people to design, supervise, repair and regulate it, and it may allow humans to concentrate on creative and interpersonal work that machines handle poorly. The key challenge is the transition. Governments and employers must fund retraining so that displaced workers can move into growing sectors rather than being left behind. A society that plans for this change will be better placed to share its benefits widely.",
"In conclusion, while the risk to some occupations is real, I am cautiously optimistic that new jobs will appear, provided that societies invest in education and retraining."],
pe:["Introduces AI and the debate; opinion is stated early with a condition.","View 1: job losses. Explains why the fear is reasonable and who is most affected.","View 2 and opinion: historical pattern, new roles, retraining as the key condition.","Short conclusion that restates opinion and condition."],
v:["routine tasks :: repetitive jobs that follow clear rules","financial incentive :: a money-based reason to act","vulnerable to :: at risk of","a wave of automation :: a period of rapid mechanisation","interpersonal work :: tasks involving relationships with people","displaced workers :: people who have lost jobs because of change"],
sp:["Those who fear ... have a reasonable argument.","On the other hand, history suggests that ...","The key challenge is ...","While ... is real, I am cautiously optimistic that ..., provided that ..."],
note:"Both views get a full paragraph with reasons. The writer's opinion is visible in the introduction, strengthened in the second body paragraph and confirmed in the conclusion."},

{id:"e06",t:"work",t2:"tech",ty:"B",d:1,
q:"Some people think that employees should work in an office with colleagues. Others believe that working from home is more productive. Discuss both views and give your opinion.",
th:"In my view, a hybrid arrangement that combines both is most effective for the majority of employees.",
p:[
"Since the rapid growth of video conferencing and cloud software, many employees are able to do their jobs from anywhere. This has prompted a debate about whether the traditional office is still necessary. In my view, a hybrid arrangement that combines both is most effective for the majority of employees.",
"Supporters of office-based work point out that physical proximity makes collaboration easier. Colleagues can ask quick questions, solve problems together and build the trust that develops through everyday conversation. New staff benefit particularly, because they learn company culture and practical skills by observing experienced workers. In addition, a separate workplace helps some people to keep a clear boundary between professional and private life, which reduces the risk of working excessive hours.",
"On the other hand, those who prefer working from home highlight the benefits of flexibility and concentration. Employees save the time and money they would otherwise spend commuting, and many find it easier to focus on complex tasks without the interruptions of an open-plan office. This can increase output and improve job satisfaction. However, remote work can also lead to isolation, and ideas that might be shared spontaneously in a corridor may never be discussed.",
"Considering these points, I believe the best solution is a hybrid model in which staff attend the office for meetings, training and team projects, and work remotely when they need quiet concentration. This approach captures the strengths of both systems and reduces their weaknesses.",
"In conclusion, neither arrangement is superior in every situation, and flexibility is the most valuable feature of modern working life."],
pe:["Introduces cause of debate (technology) and gives the opinion (hybrid).","View 1: office advantages — collaboration, training of new staff, work-life boundary.","View 2: remote advantages — commuting time, concentration, plus the drawback of isolation.","Opinion paragraph: hybrid model explained.","Short conclusion."],
v:["video conferencing :: meeting with video over the internet","physical proximity :: being close together in person","company culture :: shared habits and values in a workplace","open-plan office :: office without separate rooms","job satisfaction :: how pleased people are with their work","hybrid model :: a mixture of home and office working"],
sp:["Supporters of ... point out that ...","On the other hand, those who prefer ... highlight ...","Considering these points, I believe the best solution is ...","This approach captures the strengths of ... and reduces ..."],
note:"The essay shows a fair account of both views, then places the writer's opinion in its own paragraph so the reader can see exactly what the writer thinks and why."},

{id:"e07",t:"family",t2:"edu",ty:"B",d:2,
q:"Some people believe that parents are the most important influence on a child's development. Others argue that teachers and friends have a greater influence. Discuss both views and give your opinion.",
th:"While teachers and friends play a significant role, I believe that parents remain the most important influence, particularly in the early years.",
p:[
"A child's character is shaped by many forces, including family, school and social circle. People disagree about which of these is the most powerful. While teachers and friends play a significant role, I believe that parents remain the most important influence, particularly in the early years.",
"Those who emphasise the influence of teachers and friends have some justification. Children spend a large part of the day at school, where teachers introduce them to knowledge and set expectations for behaviour. Friends become increasingly important during adolescence, when young people often copy peers' tastes, language and attitudes in order to be accepted. A teenager who joins a group that values study, for instance, may become more ambitious than parents alone could have encouraged. Teachers, in turn, can inspire a lasting interest in a subject that parents may not be able to provide.",
"Nevertheless, I believe that parental influence is deeper and longer lasting. In the first years of life, children learn language, emotional security and basic values almost entirely from the people who care for them. A child who is spoken to, listened to and supported at home usually develops the confidence needed to learn at school and to make healthy friendships. Moreover, parents choose the neighbourhood, school and daily routines that determine which teachers and friends a child meets. In this sense, other influences operate within the framework that parents create. Research on child development also suggests that secure early attachments help children to cope with later stress.",
"In conclusion, teachers and peers certainly contribute to a child's development, but parents lay the foundations on which all later influences build."],
pe:["Introduces the question and gives an early opinion.","View 1: teachers and friends: school time and peer pressure with example.","Opinion supported: early development, confidence, and parental control over environment.","Concludes with a balanced restatement."],
v:["shape someone's character :: influence the kind of person they become","set expectations :: define what is considered acceptable","peer :: a person of similar age or status","emotional security :: the feeling of being safe and cared for","long lasting :: continuing for a long time","lay the foundations :: create a base for later development"],
sp:["Those who emphasise ... have some justification.","A teenager who ..., for instance, may ...","Moreover, parents choose ... that determine ...","... lay the foundations on which ... build."],
note:"The essay gives credit to the opposite view before explaining why the writer's preference is stronger. The final argument about 'framework' shows how the views relate, which adds depth."},

{id:"e08",t:"global",ty:"B",d:3,
q:"Some people think that wealthy countries have a responsibility to help poorer nations. Others believe that every country should solve its own problems. Discuss both views and give your opinion.",
th:"I believe that wealthy countries should help poorer nations, but this support should aim to build independence rather than create reliance.",
p:[
"Differences in wealth between countries remain very large, and people disagree about whether richer nations should help those that are poorer. I believe that wealthy countries should help poorer nations, but this support should aim to build independence rather than create reliance.",
"Supporters of self-reliance argue that each government is responsible for its own citizens. They point out that aid can be misused through corruption, or can discourage governments from developing their own tax systems and industries. There is also a political argument: taxpayers in wealthy countries may feel that domestic problems, such as housing or healthcare, should come before overseas spending. If aid is poorly designed, it may indeed create dependency rather than growth.",
"However, there are strong reasons for international help. Many of today's challenges, such as infectious disease and climate change, do not stop at national borders, so a health crisis in one country can eventually affect others. Wealthy nations also have the resources and expertise to fund vaccination, clean water and education, which can transform living standards at a relatively small cost. Furthermore, some poorer countries are affected by problems they did little to cause, for example rising sea levels resulting largely from emissions produced elsewhere.",
"The most effective aid, in my view, focuses on long-term capacity, such as training teachers, building infrastructure and supporting local businesses, rather than simply providing money or goods. This respects the principle of self-reliance while recognising shared responsibility.",
"In conclusion, wealthy countries should assist poorer ones, but the help must be designed to strengthen local abilities so that it eventually becomes unnecessary."],
pe:["Introduces global inequality and gives the opinion with a condition.","View 1: self-reliance, corruption, dependency, domestic priorities.","View 2 and reasons: shared problems, resources, fairness.","Opinion paragraph: capacity-building aid, which reconciles both views.","Conclusion."],
v:["self-reliance :: depending on yourself","aid :: money or resources given to help","dependency :: needing something to survive","infectious disease :: illness that spreads between people","expertise :: expert knowledge","capacity-building :: developing abilities of people or institutions"],
sp:["They point out that ... can be misused through ...","If ... is poorly designed, it may indeed create ...","Furthermore, some ... are affected by problems they did little to cause.","The most effective ..., in my view, focuses on ..."],
note:"This essay bridges two opposing views with a clear opinion (capacity-building) which is explained in its own paragraph. It uses only general, verifiable claims."},

/* C: advantages and disadvantages */
{id:"e09",t:"tourism",ty:"C",d:1,
q:"International tourism has become the main source of income in some countries. What are the advantages and disadvantages of this?",
th:"Although tourism can generate jobs and funds, depending on it heavily makes an economy vulnerable and may damage the places that visitors come to see.",
p:[
"In several countries, from island nations to historic cities, tourism now accounts for a large share of national income. Although tourism can generate jobs and funds, depending on it heavily makes an economy vulnerable and may damage the places that visitors come to see.",
"The most obvious advantage is economic. Tourists spend money on hotels, restaurants, transport and souvenirs, which creates employment for guides, drivers, cooks and shop owners. Tourism also encourages investment in airports, roads and communications that local people can use as well. In addition, income from visitors can pay for the protection of heritage sites and national parks, giving communities a financial reason to preserve their natural and cultural assets. Local farmers and craftspeople may also find new markets for their products, which spreads the benefits beyond hotels and airlines.",
"On the other hand, relying too heavily on one industry is risky. If a country faces a natural disaster, political instability or a global crisis that prevents travel, income can fall sharply and many people may lose their jobs at once. Many tourism jobs are also seasonal and poorly paid, so the benefits are not always shared fairly. Furthermore, large numbers of visitors can overload local resources, push up housing prices and erode local culture, as traditions may be adapted to please tourists rather than to express community identity. Without careful planning, the very attractions that draw visitors may lose their appeal.",
"Overall, tourism offers real economic benefits, but countries that depend on it need to diversify their economies and manage visitor numbers carefully. A more varied economy would protect communities if tourist numbers fell suddenly."],
pe:["Introduces the trend and gives a balanced overview.","Advantages: income, jobs, infrastructure, heritage funding.","Disadvantages: vulnerability, seasonality, overcrowding, cultural impact.","Short, balanced conclusion with a recommendation."],
v:["account for a large share :: make up a big part","heritage site :: place of historical or cultural value","vulnerable :: easily harmed","seasonal jobs :: jobs available only part of the year","erode :: gradually reduce","diversify the economy :: develop many different industries"],
sp:["The most obvious advantage is ...","In addition, ... can ..., giving ... a reason to ...","On the other hand, relying too heavily on ... is risky.","Overall, ... offers ..., but ... need to ..."],
note:"The question asks for advantages and disadvantages only, so the writer gives each a full paragraph, avoids a strong opinion and offers a balanced closing comment."},

{id:"e10",t:"media",ty:"C",d:2,
q:"More and more people are getting their news from social media rather than from newspapers or television. What are the advantages and disadvantages of this trend?",
th:"This trend brings speed and accessibility, but it also increases the risk of misinformation and narrow viewpoints.",
p:[
"A growing number of people now learn about world events through their social media feeds. This trend brings speed and accessibility, but it also increases the risk of misinformation and narrow viewpoints.",
"The main advantage of social media news is convenience. Updates appear on a person's phone within minutes of an event, often accompanied by video from people who are present at the scene. Users can follow journalists and organisations from many countries, which gives them access to perspectives that traditional outlets might not provide. Because the platforms are free and easy to use, they also allow people who rarely read newspapers, such as young adults, to stay informed about current affairs. For breaking news in particular, this speed is a clear advantage over a daily newspaper.",
"However, there are serious disadvantages. Unlike professional news organisations, most users do not check facts before sharing a story, so rumours and manipulated images can spread widely before corrections appear. In addition, platform algorithms tend to show people content that matches their existing interests and opinions. Over time, users may see only one side of a debate, which can increase polarisation and reduce their willingness to consider other views. Finally, because news appears among entertainment and advertisements, people may skim headlines without reading the full article, and so understand issues only superficially. Readers therefore need to develop the habit of checking where a story comes from.",
"In summary, social media makes information easier to reach, but readers need to be careful about the sources they trust and should look beyond their own feeds to gain a balanced understanding of events."],
pe:["Introduces the trend and previews both sides.","Advantages: speed, diversity of sources, access for young people.","Disadvantages: unverified content, algorithms and polarisation, shallow reading.","Summary with practical advice."],
v:["current affairs :: news about politics and society","outlet :: a media organisation","manipulated image :: a photo or video that has been altered","algorithm :: a set of rules computers follow to choose content","polarisation :: division into opposing groups","superficially :: without depth"],
sp:["The main advantage of ... is convenience.","Unlike ..., most users do not ...","In addition, ... tend to show people ...","In summary, ... makes ... easier to ..., but ..."],
note:"The essay explains why each advantage or disadvantage matters, instead of simply listing them. Cause-and-effect language shows the logical chain."},

{id:"e11",t:"ageing",t2:"work",ty:"C",d:2,
q:"In many countries, older people are choosing to keep working after the traditional retirement age. What are the advantages and disadvantages of this development?",
th:"There are clear benefits for individuals, employers and economies, but there are also risks for younger workers and for older people who are not in good health.",
p:[
"Because people are living longer and healthier lives, an increasing number of older adults continue working beyond the traditional retirement age. There are clear benefits for individuals, employers and economies, but there are also risks for younger workers and for older people who are not in good health.",
"One major advantage is that experienced employees bring knowledge that cannot easily be taught in a classroom. Older workers can mentor younger colleagues, handle difficult situations calmly and maintain relationships with long-standing clients. For the individual, continuing to work provides income, routine and social contact, which research and common experience suggest can protect against loneliness. At the national level, a larger workforce increases tax revenue and eases pressure on pension systems that are strained by ageing populations. Staying active in a familiar workplace may also help to maintain mental sharpness.",
"However, the trend also has drawbacks. If older workers remain in senior positions, promotion opportunities for younger employees may be delayed, which could increase frustration in a competitive job market. In addition, jobs that are physically demanding, such as construction or farming, may be unsuitable for people in their late sixties or seventies. If financial pressure rather than choice forces them to continue, this may harm their health and quality of life. There is also a risk that employers will assume that older staff are less able to learn new technology, which may lead to unfair treatment.",
"In conclusion, working longer can benefit both older people and society, provided that jobs are flexible and that age discrimination is prevented. It should be a genuine choice and not an obligation."],
pe:["Gives context and previews benefits and risks.","Advantages: experience, mentoring, income, social contact, pension relief.","Disadvantages: slower promotion, physical demands, forced work, discrimination.","Conclusion with a condition."],
v:["traditional retirement age :: the usual age to stop working","mentor :: advise and guide a less experienced person","long-standing clients :: customers of many years","pension system :: scheme paying money to retired people","physically demanding :: requiring a lot of bodily effort","age discrimination :: unfair treatment because of age"],
sp:["One major advantage is that ...","For the individual, ... provides ...","However, the trend also has drawbacks.","..., provided that ... and that ..."],
note:"The question does not ask for an opinion, so the conclusion offers a balanced judgement based on both sides. Each point has a consequence or example."},

{id:"e12",t:"transport",t2:"cities",ty:"C",d:2,
q:"Some cities are banning private cars from their centres. What are the advantages and disadvantages of this policy?",
th:"Car-free centres can make cities cleaner, safer and more pleasant, but they also create practical difficulties for residents, businesses and people with limited mobility.",
p:[
"As traffic and pollution increase, a number of cities have decided to restrict or completely ban private vehicles in their central districts. Car-free centres can make cities cleaner, safer and more pleasant, but they also create practical difficulties for residents, businesses and people with limited mobility.",
"The environmental and social benefits are significant. Removing cars cuts exhaust fumes and noise, which improves air quality and reduces respiratory illness. Streets become safer for pedestrians and cyclists, and the space previously used for roads and parking can be converted into squares, cafes and green areas. These changes often make the centre a more attractive place to walk, shop and meet friends, which can encourage healthier habits and strengthen community life. Quieter streets can also encourage street performers, markets and outdoor seating, which bring life to the area.",
"Nevertheless, a ban may cause problems. Elderly people, disabled residents and families with young children may find it difficult to reach shops or services without a car, particularly if public transport is infrequent. Delivery of goods also becomes more complicated, which can raise costs for small businesses, and some shop owners fear that customers will go to out-of-town malls instead. In the short term, drivers may simply move their journeys elsewhere, increasing congestion on surrounding roads unless alternatives are provided. Cities that ignore these concerns risk turning a popular policy into a source of frustration.",
"Overall, restricting cars in city centres brings genuine benefits, but the policy works only when it is combined with reliable public transport, accessible exceptions and sensible delivery arrangements. Careful consultation with residents before a ban is introduced would reduce conflict."],
pe:["Introduces the policy and a two-sided thesis.","Advantages: air, noise, safety, better public space.","Disadvantages: accessibility, deliveries, business, displacement of traffic.","Conclusion states conditions for success."],
v:["private vehicles :: cars owned by individuals","respiratory illness :: breathing-related disease","convert into :: change into something else","limited mobility :: difficulty moving around","out-of-town malls :: shopping centres outside the city","public transport :: buses, trains and trams for all"],
sp:["Removing ... cuts ..., which improves ...","..., particularly if ... is infrequent.","In the short term, ... may simply ..., increasing ... unless ...","... works only when it is combined with ..."],
note:"Each paragraph contains a logical chain (cause → effect → example). The conclusion adds practical conditions rather than repeating the introduction."}
];

{id:"e13",t:"science",t2:"govt",ty:"D",d:2,
q:"Some people think that governments should spend money on space exploration. Others believe that this money should be spent on problems on Earth. Do the advantages of space exploration outweigh the disadvantages?",
th:"I believe that the advantages of space exploration outweigh the disadvantages, provided that the budget remains a small and carefully monitored part of public spending.",
p:[
"Space programmes cost enormous sums, and critics ask why governments should send rockets into space when there are hospitals and schools to fund. Although this criticism deserves attention, I believe that the advantages of space exploration outweigh the disadvantages, provided that the budget remains a small and carefully monitored part of public spending.",
"The main disadvantage is cost. Large missions can take years and billions of dollars, and some of them produce results that seem distant from everyday needs. Money used for a space mission could theoretically be used to improve public transport or reduce poverty, and a failed launch represents a very visible waste of public funds. For this reason, space spending must be transparent and proportionate. Such criticism is understandable when public services face shortages.",
"Nevertheless, the benefits are considerable. Space research has produced technologies that people use daily, such as satellite navigation, weather forecasting and global communications. Satellites also monitor climate change, deforestation and natural disasters, giving governments information that supports practical decisions on Earth. In addition, ambitious programmes inspire young people to study science and engineering, which strengthens a country's long-term skills base. Finally, the knowledge gained about other planets helps scientists to understand our own, including how atmospheres and climates change. Even failed missions teach engineers about reliability, and those lessons are applied to other industries.",

{id:"e14",t:"business",t2:"tech",ty:"D",d:1,
q:"Online shopping is becoming more popular than visiting traditional shops. Do the advantages of this trend outweigh the disadvantages?",
th:"In my opinion, the advantages of online shopping slightly outweigh the disadvantages, although the damage to local high streets should not be ignored.",
p:[
"Over the past decade, buying goods on a phone or computer has become a normal part of life for millions of people. In my opinion, the advantages of online shopping slightly outweigh the disadvantages, although the damage to local high streets should not be ignored.",
"The greatest benefit is convenience. Shoppers can compare prices from many sellers in a few minutes, read reviews and have goods delivered to their door, which saves time and travel costs. This is especially valuable for people who live far from big towns, work long hours or have difficulty walking. Online retailers also make niche products, such as specialist books or equipment for minority hobbies, available to customers who could never find them in a local shop. Competition between sellers frequently lowers prices, which helps consumers on limited incomes. For many households, these savings add up over a year.",
"Nevertheless, there are real costs. When customers stop visiting shops, many small businesses close, leaving empty premises and reducing employment in town centres. Online delivery also generates a large amount of packaging waste and additional vehicle journeys. Another concern is that the ease of ordering with one click encourages impulse buying, which can lead some people to spend more than they intended or to accumulate debt. Returns, too, create extra transport and sometimes unnecessary waste.",
"Overall, I believe that the improved access and lower prices outweigh the drawbacks, particularly because many shops are adapting by offering online services and unique experiences. Governments and consumers can reduce the downsides by supporting local businesses and choosing recyclable packaging."],
pe:["States a modest judgement ('slightly outweigh') that avoids exaggeration.","Advantages first: convenience, access, niche products, price competition.","Disadvantages: closures, waste, impulse buying; kept shorter than advantages.","Conclusion justifies the judgement and suggests mitigation."],
v:["high street :: the main shopping street in a town","niche products :: goods for a small group of customers","impulse buying :: unplanned purchases","accumulate debt :: gradually owe more money","packaging waste :: rubbish from boxes and wrapping","adapt :: change to suit new conditions"],
sp:["In my opinion, the advantages ... slightly outweigh ..., although ... should not be ignored.","The greatest benefit is convenience.","Another concern is that ... encourages ..., which can lead ...","... can reduce the downsides by ..."],
note:"The essay compares both sides and chooses one. The word 'slightly' is a good example of precise hedging that fits the evidence provided."},

{id:"e15",t:"equality",t2:"work",ty:"D",d:3,
q:"Some companies introduce quotas to increase the number of women in senior positions. Do the advantages of this approach outweigh the disadvantages?",
th:"I believe the advantages of quotas outweigh the disadvantages, particularly as a temporary measure while other forms of discrimination are being removed.",
p:[
"Despite years of equal-opportunity legislation, women remain under-represented in senior roles in many industries. Some organisations have therefore introduced quotas that require a minimum proportion of women in leadership. I believe the advantages of quotas outweigh the disadvantages, particularly as a temporary measure while other forms of discrimination are being removed.",
"The most frequent criticism of quotas is that they may undermine the principle of merit. If a candidate believes that gender, rather than ability, influenced a decision, resentment can develop, and the women who are promoted may be doubted by colleagues. There is also a risk that companies will focus on reaching numbers rather than changing a culture that makes progress difficult for women. Poorly designed quotas can therefore become a form of box-ticking.",
"However, these dangers are outweighed by the benefits. Voluntary change has often been very slow, partly because decision-makers tend to promote people who resemble themselves. Quotas force organisations to look more widely for talent, and once more women reach senior positions, they serve as role models and mentors for younger employees. Research on company boards is often cited as showing that diverse teams consider more options, although the evidence varies; even without this, it is clearly fairer to use the abilities of the whole population. To keep merit at the centre, companies can require that all candidates meet the same standards and that quotas apply only when several candidates are equally qualified.",
"In conclusion, quotas are not perfect, but they are an effective way to accelerate fairer representation, and any harm to merit can be limited through careful design."],
pe:["Introduces under-representation and gives a clear judgement with a time-limited condition.","Concedes disadvantages: merit, resentment, box-ticking.","Main argument: slow voluntary change, role models, fairness; suggests safeguards. Notes uncertainty about evidence honestly.","Conclusion repeats the judgement and the safeguard."],

{id:"e16",t:"edu",t2:"global",ty:"D",d:2,
q:"More and more students are choosing to study at universities in other countries. Do the advantages of this trend outweigh the disadvantages?",
th:"Overall, I believe the advantages of studying overseas outweigh the disadvantages, as long as students receive adequate support.",
p:[
"Thanks to cheaper travel and international programmes, a growing number of students now complete all or part of their degrees abroad. Overall, I believe the advantages of studying overseas outweigh the disadvantages, as long as students receive adequate support.",
"The principal benefit is personal and academic growth. Living in a foreign country forces students to become independent: they must manage money, solve everyday problems and adapt to unfamiliar customs. They also improve their language skills quickly through daily use, which is a valuable asset when applying for jobs. Academically, foreign universities may offer specialist courses or research facilities that are not available at home, and meeting classmates from many countries broadens students' perspectives and creates an international network of contacts. Employers frequently value graduates who have shown the courage to live and study abroad.",
"On the other hand, there are significant drawbacks. Tuition fees and living costs can be extremely high, and families may have to take on debt that takes years to repay. Some students suffer from homesickness, cultural isolation or difficulties with academic expectations, which may affect their performance. From a national perspective, there is also the risk of 'brain drain', as graduates who remain abroad take their skills with them. However, many students return with new knowledge and connections that benefit their home economies, and universities can reduce the personal difficulties through orientation programmes and counselling. Scholarships and part-time work can ease the financial burden for some students.",
"In conclusion, studying abroad is expensive and sometimes stressful, but its long-term educational and cultural rewards are greater, provided that institutions and governments support students properly."],
