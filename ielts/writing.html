/* E: Problems and solutions */
{id:"e17",t:"env",ty:"E",d:1,
q:"Plastic waste is a growing problem in many countries. What problems does it cause and what solutions can you suggest?",
th:"Plastic pollution harms wildlife, health and the economy, but it can be reduced through stronger regulation, better recycling systems and changes in consumer habits.",
p:[
"Plastic is cheap, light and durable, which explains why it is used in everything from food packaging to clothing. Unfortunately, these same qualities mean it remains in the environment for centuries. Plastic pollution harms wildlife, health and the economy, but it can be reduced through stronger regulation, better recycling systems and changes in consumer habits.",
"The most visible problem is damage to ecosystems. Marine animals mistake plastic for food or become trapped in discarded nets and bags, and larger items slowly break down into tiny fragments called microplastics. These particles have been found in water, fish and even drinking supplies, and scientists are still studying their effects on human health. In addition, clearing litter from beaches and rivers is expensive, and a polluted coastline can discourage tourists, so communities that rely on tourism lose income.",
"There are several practical solutions. Governments can restrict single-use items such as plastic bags and straws, or charge for them, which has been shown to reduce consumption in several countries. They can also require producers to design packaging that is easier to recycle and to pay towards its collection. At the household level, clear labelling and convenient recycling points make it easier for people to dispose of waste correctly. Finally, individuals can bring reusable bottles and shopping bags and choose products with less packaging, which sends a signal to manufacturers. Companies can also be encouraged to use recycled material in new products, reducing the demand for fresh plastic.",
"In conclusion, plastic waste causes lasting environmental and economic harm, but a combination of regulation, improved recycling and consumer responsibility can reduce the problem significantly."],
pe:["Gives context (why plastic is used) and outlines problems and solutions.","Problems: ecosystems, microplastics, economic costs, each explained.","Solutions at three levels: government, producers, households and individuals.","Conclusion linking the problems and solutions."],
v:["single-use :: designed to be used once","microplastics :: very small pieces of plastic","discarded :: thrown away","ecosystem :: community of living things and their environment","recycling point :: place where waste can be sorted for reuse","send a signal :: show what consumers want"],
sp:["... harms ..., ... and ..., but it can be reduced through ...","Marine animals mistake ... for ... or become ...","Governments can ..., which has been shown to ...","At the household level, ..."],
note:"Problems and solutions are separated into clearly different paragraphs, and every solution responds to a problem. The solutions address several actors, which makes them realistic."},

{id:"e18",t:"transport",t2:"cities",ty:"E",d:1,
q:"Traffic congestion is a serious problem in many cities. What problems does it cause and what can be done about it?",
th:"Congestion wastes time, damages health and harms the economy, but cities can reduce it by investing in public transport and discouraging unnecessary car use.",
p:[
"In many large cities, drivers spend a significant part of every day sitting in slow-moving traffic. Congestion wastes time, damages health and harms the economy, but cities can reduce it by investing in public transport and discouraging unnecessary car use.",
"The most obvious problem is lost time. Commuters who spend long hours in traffic have less time for family, rest and exercise, and the unpredictability of journeys causes stress. At the same time, idling engines release exhaust fumes that worsen air quality and contribute to asthma and other respiratory diseases. Congestion also has economic consequences: delivery vehicles are delayed, businesses lose productivity and goods become more expensive for consumers. Emergency vehicles may also be delayed, which can have serious consequences.",
"The best long-term solution is to offer a convincing alternative to the private car. Reliable, frequent and affordable buses, trams and metro lines will persuade many people to leave their cars at home, particularly if dedicated bus lanes make journeys faster than driving. Cities can also introduce congestion charges for entering the centre at peak times, as London and Singapore have done, and use the revenue to improve public transport. In addition, safe cycle lanes and wider pavements encourage short journeys on foot or by bike, and flexible working hours spread demand more evenly through the day. Park-and-ride schemes at the edge of the city can remove many cars before they reach busy streets.",
"In conclusion, congestion is costly in terms of time, health and money. A combination of better public transport, pricing measures and support for walking and cycling would make city travel more efficient and more pleasant."],
pe:["Introduces the problem and gives a preview of problems and solutions.","Problems: time, stress, air quality, economic cost.","Solutions: public transport, pricing, cycling, flexible hours; real examples used correctly.","Summary conclusion."],
v:["slow-moving traffic :: vehicles travelling slowly","idling engine :: engine running while vehicle is not moving","respiratory diseases :: illnesses affecting breathing","congestion charge :: fee for driving in a busy area","dedicated bus lane :: road lane reserved for buses","peak times :: busiest periods"],
sp:["Commuters who ... have less time for ...","At the same time, ... release ... that worsen ...","The best long-term solution is to ...","In addition, ... encourage ..., and ... spread demand more evenly."],
note:"The problems are explained through effects (time, health, economy), and each solution is connected to one of them. Real-world examples (London, Singapore) are used briefly and accurately."},

{id:"e19",t:"cities",t2:"work",ty:"E",d:2,
q:"Many young people are leaving rural villages to live in cities, and many villages are losing their populations. What problems does this cause and how can they be solved?",
th:"Rural depopulation weakens local services and economies, but it can be slowed by creating jobs, improving connections and making village life more attractive.",
p:[
"In many countries, young adults are moving from the countryside to cities in search of education, employment and entertainment. As a result, numerous villages are shrinking and ageing. Rural depopulation weakens local services and economies, but it can be slowed by creating jobs, improving connections and making village life more attractive.",
"The first problem is that services become unviable. When the number of children falls, schools close, and when fewer customers remain, shops, clinics and bus services cut back or disappear. Those who stay, often older residents, must travel long distances for basic needs, which is particularly difficult for people without cars. Furthermore, farms and small businesses struggle to find workers, so land may be abandoned and local traditions may be forgotten as skills are not passed on.",
"To address this, governments should encourage employment in rural areas. Tax incentives for small businesses, support for local food producers and investment in rural tourism can all create opportunities that make leaving less necessary. Better broadband is equally important, because it allows people to work remotely, run online businesses or study from home while living in a village. In addition, improving transport links and keeping essential services, such as primary schools and healthcare, in rural communities will make them more attractive to young families. Some regions also offer housing grants to new residents, which helps to renew the population. Community-owned shops and cafes can also become meeting places that keep village life active.",
"In conclusion, the loss of young people leaves villages vulnerable, but targeted investment in jobs, digital infrastructure and services can make rural life a realistic option again."],
pe:["Gives the trend and previews both problems and solutions.","Problems: loss of services, isolation of older people, labour shortage, loss of tradition.","Solutions: jobs, broadband, transport, services, incentives for newcomers.","Conclusion."],
v:["rural depopulation :: decline in people living in the countryside","unviable :: not able to continue economically","tax incentive :: reduction in tax to encourage something","rural tourism :: tourism in the countryside","broadband :: fast internet connection","transport links :: roads and public services connecting places"],
sp:["Rural depopulation weakens ..., but it can be slowed by ...","The first problem is that ... become ...","To address this, governments should ...","... is equally important, because it allows people to ..."],
note:"The essay links problems to solutions directly (service loss → keep essential services; lack of jobs → job creation, broadband). It uses precise vocabulary for the topic."},

{id:"e20",t:"health",t2:"sports",ty:"E",d:1,
q:"Many people spend most of the day sitting at a desk or in front of a screen. What problems does this cause and what can be done to solve them?",
th:"A sedentary lifestyle increases the risk of physical and mental health problems, but both individuals and employers can take practical steps to reduce it.",
p:[
"Modern work and entertainment increasingly involve sitting for many hours, whether at an office desk, in a car or in front of a television. A sedentary lifestyle increases the risk of physical and mental health problems, but both individuals and employers can take practical steps to reduce it.",
"The most serious problem is the effect on physical health. Long periods of inactivity are associated with weight gain, back and neck pain, and a higher risk of diabetes and heart disease. Poor posture and repetitive use of keyboards may also cause muscular problems that affect work performance. Beyond the physical effects, a lack of movement can contribute to low mood and poor sleep, and these in turn reduce concentration and productivity. For society, the long-term result is greater pressure on health services. Even people who exercise after work may remain at risk if most of their day is spent sitting.",
"There are several effective ways to address the issue. Employers can encourage regular breaks, provide adjustable desks and organise walking meetings, which require little cost but can improve employees' health and energy. Governments can support active lifestyles by building safe cycle paths and public sports facilities and by promoting exercise through public campaigns. On a personal level, people can set reminders to stand up every hour, walk or cycle for short journeys and schedule exercise as they would any other appointment. Even moderate activity, such as a brisk daily walk, brings measurable benefits.",
"In conclusion, prolonged sitting harms health and productivity, but modest changes in workplaces, public planning and personal habits can reduce the problem."],
pe:["Gives context and previews the thesis.","Problems: physical illnesses, posture, mental effects, social cost.","Solutions for employers, governments and individuals.","Conclusion."],
v:["sedentary lifestyle :: a way of living with little physical activity","back and neck pain :: discomfort in the spine and neck","poor posture :: incorrect sitting or standing position","adjustable desk :: desk whose height can be changed","public campaign :: organised effort to inform people","brisk walk :: a fast walk"],
sp:["Long periods of ... are associated with ...","..., and these in turn reduce ...","There are several effective ways to address the issue.","Even moderate activity, such as ..., brings ..."],
note:"The essay offers solutions at three levels (employers, government, individuals) that match the problems described. Each solution is concrete and realistic."}

"In conclusion, prestige projects are driven by image, politics and short-term economic gains, and they are worthwhile only when they serve real needs."],
pe:["Introduces the topic and gives short answers to both questions.","Question 1: reasons — image, political legacy, short-term jobs.","Question 2: judgement — conditional approval with examples of success and waste.","Opinion detail: criteria for assessment.","Conclusion answering both questions."],
v:["prestige project :: building or scheme meant to impress","visible legacy :: lasting achievement people can see","stimulate :: encourage activity","one-off event :: an event that happens only once","maintenance costs :: money needed to keep something working","transparent accounting :: clear reporting of money spent"],
sp:["... mainly for ... reasons, but I believe that ... only when ...","There are several reasons why ... First, ... Second, ... Third, ...","Whether this is ... depends on ...","For this reason, I believe ... should assess ... by asking ..."],
note:"The writer answers both questions in separate paragraphs. The judgement is not simply 'good' or 'bad', but a conditional answer with clear criteria."},

{id:"e30",t:"science",ty:"H",d:2,
q:"Scientific research often needs a lot of money. What are the main benefits of scientific research to society? Who should pay for it?",
th:"Scientific research improves health, technology and our understanding of the world, and since its benefits are shared by everyone, governments should fund it, with support from private companies.",
p:[
"Laboratories, telescopes and long-term field studies are expensive, and some people question whether such spending is necessary. Scientific research improves health, technology and our understanding of the world, and since its benefits are shared by everyone, governments should fund it, with support from private companies.",
"The benefits of scientific research are far-reaching. In medicine, research has led to vaccines, antibiotics and new surgical techniques that have increased life expectancy and reduced suffering. In technology, discoveries in physics and materials science have made possible computers, mobile communications and renewable energy systems, which in turn create industries and jobs. Research also helps societies prepare for problems such as climate change and new diseases by providing data on which policies can be based. In addition, science education and discovery inspire curiosity and critical thinking among the public.",
"As for who should pay, I believe the main responsibility lies with governments. Basic research, which seeks to understand how nature works without a specific product in mind, rarely offers quick profits, so private companies may not fund it. Yet it often provides the foundation for later applications that benefit everyone. Public funding also allows researchers to publish results openly so that others can build on them. Nevertheless, private companies have an important role in applied research, such as developing a new drug or battery, because they have the resources and the commercial motivation to turn discoveries into products. Partnerships between universities and industry can combine the strengths of both.",
"In conclusion, research brings health, technological and social benefits. Governments should provide the core funding, while businesses should contribute where they can profit from practical developments."],
pe:["Introduces the question and gives a combined answer to both.","Question 1: benefits in health, technology, policy and education.","Question 2: governments for basic research; companies for applied research; partnership.","Conclusion."],
v:["far-reaching :: having wide effects","life expectancy :: average length of life","basic research :: research aimed at understanding, not a product","applied research :: research aimed at practical use","commercial motivation :: desire for profit","partnership :: cooperation between organisations"],
sp:["... improves ..., ... and ..., and since ..., governments should ...","The benefits of ... are far-reaching.","As for who should pay, I believe ...","Nevertheless, ... have an important role in ..."],
note:"The two questions are answered separately and then linked through the idea of shared benefit. Examples are general and factual."},

{id:"e31",t:"equality",t2:"work",ty:"H",d:2,
q:"Women remain under-represented in senior positions in many professions. Why do you think this is? What can be done to change the situation?",
th:"Women are under-represented at the top because of caring responsibilities, unconscious bias and a lack of role models, but fairer policies and cultural change can improve the balance.",
p:[
"Although women now make up nearly half of the workforce in many countries and often perform very well at university, relatively few reach senior management. Women are under-represented at the top because of caring responsibilities, unconscious bias and a lack of role models, but fairer policies and cultural change can improve the balance.",
"One reason is the unequal distribution of childcare and housework. Women are still more likely to reduce their hours or take career breaks when they have children, and this can slow promotion in organisations that value continuous, full-time service. Another factor is unconscious bias: decision-makers may, without realising it, associate leadership with traditionally male qualities and favour candidates who resemble existing managers. Finally, when few women hold senior positions, younger women may find it harder to imagine themselves in those roles or to find mentors who understand their challenges.",
"To change this, organisations and governments should act in several ways. Offering flexible hours, affordable childcare and equal parental leave for fathers would help families to share caring tasks more fairly. Companies can reduce bias by using structured interviews, anonymising applications and setting clear promotion criteria. Mentoring and sponsorship programmes can connect talented women with senior leaders who support their progress. Publishing data on pay and promotion also creates accountability, because organisations are more likely to improve when their results are visible. Over time, as more women reach leadership, the cultural expectation that top jobs are masculine will weaken.",
"In conclusion, unequal caring duties, hidden bias and the shortage of role models explain the lack of women in senior roles. Practical policies in workplaces and at home can gradually remove these barriers."],
pe:["Introduces under-representation and answers both questions in outline.","Question 1: reasons — caring duties, bias, lack of role models.","Question 2: measures — flexible work, parental leave, bias reduction, mentoring, transparency.","Conclusion."],
v:["senior management :: top-level managers","unconscious bias :: unintentional prejudice","career break :: period away from work","mentoring :: guidance by a more experienced person","accountability :: responsibility to explain results","anonymising applications :: removing names and personal details"],
sp:["... are under-represented at the top because of ..., ... and ..., but ... can improve ...","One reason is ... Another factor is ...","To change this, organisations and governments should ...","... is more likely to improve when ..."],
note:"Each question has its own paragraph. The explanation avoids stereotypes by focusing on structures and policies."},

{id:"e32",t:"arts",t2:"media",ty:"H",d:2,
q:"Many people still enjoy attending live concerts, even though recorded music is easily available. Why do you think this is? Do you think live music will survive in the digital age?",
th:"People attend live concerts because of the shared atmosphere and the unique experience, and I believe live music will survive because recordings cannot replace being present.",
p:[
"Streaming services give listeners access to almost any song at any time, yet concert tickets for popular performers sell out quickly. People attend live concerts because of the shared atmosphere and the unique experience, and I believe live music will survive because recordings cannot replace being present.",
"The most important reason is the emotional intensity of a live performance. Standing among thousands of fans who know the same songs creates a sense of belonging that is difficult to reproduce at home. The music is also never exactly the same twice: performers respond to the audience, make mistakes, improvise and sometimes change arrangements, so each event feels special. In addition, fans value seeing artists in person, and concerts have become a social occasion that friends can enjoy together and remember. A ticket stub or photo serves as a souvenir of the experience.",
"Looking ahead, I am confident that live music will continue, although it will adapt. Digital technology may actually support concerts by helping artists to build fan bases through online platforms, which then lead to ticket sales. For many musicians, touring is now a more important source of income than recordings. Technology may also create new formats, such as livestreamed shows, but these are more likely to complement attending in person than replace it. The main threat is high ticket prices, which could exclude some fans, and small venues may struggle to survive without support. Even so, the human desire to gather and share emotion is unlikely to disappear.",
"In conclusion, people go to live concerts for atmosphere, uniqueness and social connection, and these qualities will keep live music alive despite technological change."],
pe:["Introduces the paradox and answers both questions.","Question 1: reasons — emotional intensity, uniqueness, social occasion.","Question 2: future — adaptation, income from touring, risks like prices.","Conclusion."],
v:["live performance :: show in front of an audience","sense of belonging :: feeling of being part of a group","improvise :: perform without preparation","fan base :: group of dedicated supporters","livestreamed show :: show broadcast online as it happens","complement :: add to and improve"],
sp:["... attend ... because of ... and ..., and I believe ... will survive because ...","The most important reason is ...","Looking ahead, I am confident that ... although ...","... are more likely to complement ... than replace ..."],
note:"The essay answers 'why' with specific psychological and social reasons, then answers the opinion question with a prediction supported by reasons, including a realistic limitation."},

/* I: Positive or negative development */
{id:"e33",t:"tech",t2:"society",ty:"I",d:1,
q:"People increasingly communicate with friends and family through messages and video calls rather than meeting in person. Is this a positive or negative development?",
th:"On balance, I believe this is a positive development, as long as digital contact supplements rather than replaces meeting in person.",
p:[
"Messaging applications and video calls have changed the way relationships are maintained, particularly among people who live far apart. On balance, I believe this is a positive development, as long as digital contact supplements rather than replaces meeting in person.",
"The strongest argument in favour is that technology keeps people connected despite distance. Families whose members have moved to different cities or countries can speak face to face every week, and friends can share news instantly rather than losing touch. This is especially valuable for older relatives and for people who are disabled or live in remote places. Digital communication is also inexpensive, and it allows people with busy schedules to maintain relationships in short moments, such as a quick message during a break.",
"There are, however, valid concerns. Communicating through screens can lack the warmth of physical presence: tone is easily misunderstood in a text, and a video call cannot replace a hug or the spontaneity of sitting together. If people begin to choose messaging because it is easier than arranging a meeting, relationships may become more superficial, and young people might develop weaker social skills. Constant connectivity can also distract people from those who are physically with them.",
"Nevertheless, these problems result from how the tools are used and not from the tools themselves. When people use messages and calls to arrange meetings, share daily moments and stay close between visits, technology strengthens relationships. The solution is to keep a balance, for example by agreeing to put phones away at meals.",
"In conclusion, digital communication is mainly beneficial because it overcomes distance and saves time, but it needs to be combined with real-life contact."],
pe:["Introduces trend and gives a conditional positive judgement.","Positive reasons: overcoming distance, accessibility, low cost, flexibility.","Concerns: loss of warmth, superficial ties, social skills, distraction.","Rebuttal and balance: the problem is use, not technology.","Conclusion."],
v:["maintain relationships :: keep connections strong","lose touch :: stop communicating with someone","spontaneity :: unplanned, natural behaviour","superficial :: shallow, not deep","connectivity :: state of being connected online","supplement :: add to, not replace"],
sp:["On balance, I believe this is a positive development, as long as ...","The strongest argument in favour is that ...","There are, however, valid concerns.","... result from how the tools are used and not from the tools themselves."],
note:"The evaluation is clear (positive, with a condition). The concerns paragraph shows awareness of the other side, and the next paragraph explains why the judgement still stands."},

{id:"e34",t:"global",t2:"society",ty:"I",d:2,
q:"English is increasingly used as a global language of business, science and the internet. Is this a positive or negative development?",
th:"I believe the global use of English is mostly positive because it improves communication and cooperation, although steps must be taken to protect other languages.",
p:[
"Today, English is used in international conferences, scientific journals, aviation and online forums by people whose first language is something else. I believe the global use of English is mostly positive because it improves communication and cooperation, although steps must be taken to protect other languages.",
"The main benefit is that a shared language reduces barriers. Researchers in different countries can read and discuss each other's findings without waiting for translation, and engineers and pilots can follow common instructions, which supports safety. Businesses benefit when employees from different countries can negotiate directly, and individuals who learn English gain access to education, travel and a very wide range of information online. In this sense, a common language promotes economic opportunity and mutual understanding.",
"However, there are risks. When English dominates in education or the workplace, speakers of other languages may feel pressure to abandon their mother tongue, and smaller languages may lose status or disappear. People who do not speak English well may also be excluded from jobs and information, which increases inequality between those who can afford good language education and those who cannot. Native speakers may also gain an unfair advantage in international discussions.",
"For this reason, the growth of English should be accompanied by support for multilingual education. Schools can teach English as an additional language while valuing the local language, and governments can fund media and publications in minority languages. If people can be proud of their own language and also communicate globally, the benefits of a common language can be enjoyed without cultural loss.",
"In conclusion, English as a global language is useful and generally positive, provided that linguistic diversity is protected."],
pe:["Introduces the trend and gives a positive judgement with a condition.","Benefits: communication, science, safety, business, personal opportunity.","Risks: language loss, inequality, native-speaker advantage.","Solution that maintains the positive judgement: multilingual education.","Conclusion."],
v:["global language :: language used worldwide","reduce barriers :: make communication easier","mother tongue :: first language","linguistic diversity :: variety of languages","multilingual education :: teaching in more than one language","mutual understanding :: shared understanding between people"],
sp:["I believe ... is mostly positive because ..., although steps must be taken to ...","The main benefit is that ...","However, there are risks.","If people can ... and also ..., the benefits ... can be enjoyed without ..."],
note:"The essay evaluates the trend, offers a balanced view, and ends with a practical condition that supports the writer's position."},

{id:"e35",t:"business",t2:"env",ty:"I",d:2,
q:"People today buy more clothes, gadgets and household goods than in the past, and replace them more often. Is this a positive or negative development?",
th:"I believe this trend is mainly negative, because it harms the environment and encourages debt, even though it supports jobs and gives consumers more choice.",
p:[
"Fast fashion, annual smartphone upgrades and cheap furniture mean that consumers now replace their belongings much more frequently than previous generations did. I believe this trend is mainly negative, because it harms the environment and encourages debt, even though it supports jobs and gives consumers more choice.",
"It is fair to acknowledge some benefits. Higher consumer spending keeps factories, shops and delivery services running, and many people depend on these industries for employment. Affordable goods also allow people on low incomes to enjoy products that were once luxuries, such as clothes in the latest style or a modern laptop. Competition between brands encourages innovation, so products become more useful over time.",
"Nevertheless, the negative consequences are more serious. Producing goods consumes energy, water and raw materials, and discarded items create mountains of waste. Electronic products contain materials that are difficult to recycle, and cheap clothing is often thrown away after only a few uses. Environmental damage is therefore a heavy price for convenience. In addition, constant advertising and social pressure encourage people to buy things they do not need, and easy credit makes it possible to spend money that they do not have. For some households, this leads to anxiety and long-term debt, while the satisfaction from a purchase often disappears quickly.",
"To limit these problems, consumers can buy fewer items of higher quality, repair rather than replace, and choose second-hand goods, while governments can encourage longer product guarantees and recycling. A more thoughtful approach to consumption would protect resources without ending economic activity.",
"In conclusion, increased consumption has some economic advantages, but its environmental and personal costs make it a mainly negative development."],
pe:["States a clear negative judgement and acknowledges the benefits.","Concession: jobs, accessibility, innovation.","Main reasons: environment, waste, advertising, debt, short-lived satisfaction.","Suggests solutions to show practical thinking.","Conclusion."],
v:["consumer spending :: money people spend on goods","fast fashion :: cheap clothes made quickly to follow trends","raw materials :: natural resources used in production","discarded :: thrown away","easy credit :: borrowing that is simple to obtain","second-hand goods :: items that have been owned before"],
sp:["I believe this trend is mainly negative, because ..., even though ...","It is fair to acknowledge some benefits.","Nevertheless, the negative consequences are more serious.","... is therefore a heavy price for ..."],
note:"The essay evaluates by weighing positives and negatives. The concession paragraph is shorter than the main reasons paragraph, which supports the final judgement."},

{id:"e36",t:"cities",t2:"society",ty:"I",d:2,
q:"Increasing numbers of people are moving from rural areas to live in cities. Is this a positive or negative development?",
th:"I believe urban migration is more positive than negative for individuals and national economies, provided that cities and villages are both planned with care.",
p:[
"The proportion of the world's population living in cities has risen steadily, as people leave farming communities for urban life. I believe urban migration is more positive than negative for individuals and national economies, provided that cities and villages are both planned with care.",
"The most compelling advantage is opportunity. Cities offer a greater variety of jobs, higher wages in many sectors, and better access to universities, hospitals and cultural activities. Migrants who move for work often send money to relatives in the countryside, which can raise living standards at home. Cities also concentrate businesses, skills and ideas in one place, which encourages innovation and productivity, and compact urban living can be efficient because public transport, housing and utilities serve many people at once.",
"However, rapid urban growth can create serious problems. Housing may become scarce and expensive, leading to overcrowded or informal settlements. Traffic, noise and air pollution may increase, and public services can struggle to keep up. In the countryside, the departure of young people can leave behind an ageing population and abandoned farmland, as well as a loss of traditional knowledge. These consequences are not inevitable, but they do show that unmanaged migration carries real costs.",
"The key is planning. Cities can build affordable housing, expand public transport and protect green spaces, while governments can improve rural infrastructure and create jobs outside big cities. If both areas offer a good quality of life, people will move because they want to and not because they have no alternative.",
"In conclusion, the move to cities is largely beneficial because of economic and educational opportunities, but its success depends on good planning in both urban and rural areas."],
pe:["Introduces the trend and gives a conditional positive judgement.","Advantages: jobs, services, remittances, innovation, efficiency.","Disadvantages: housing, pollution, rural decline.","Planning paragraph supports the conditional judgement.","Conclusion."],
v:["urban migration :: movement of people to cities","informal settlements :: unplanned housing areas","utilities :: basic services like water and electricity","abandoned farmland :: land no longer used for farming","affordable housing :: homes that people on ordinary incomes can pay for","quality of life :: how good daily living is"],
sp:["I believe ... is more positive than negative for ..., provided that ...","The most compelling advantage is opportunity.","However, rapid ... can create serious problems.","If both ... offer ..., people will ... because they want to and not because ..."],
note:"The essay includes a planning paragraph that connects the two sides and clarifies the condition in the thesis. This shows development rather than a simple list."},

/* J: Mixed */
{id:"e37",t:"env",t2:"govt",ty:"J",d:2,
q:"Some people think that the best way to tackle climate change is for governments to take action, while others believe that individuals must change their behaviour. Discuss both views and give your opinion. Give examples to support your answer.",
th:"Both are necessary, but in my opinion government action is more decisive, because it can change the systems within which individuals make choices.",
p:[
"Climate change is one of the greatest challenges of our time, and people disagree about who should act. Both are necessary, but in my opinion government action is more decisive, because it can change the systems within which individuals make choices.",
"Those who emphasise personal responsibility make a fair point. Everyday habits, such as flying frequently, eating large amounts of meat and wasting energy, add up to a significant share of emissions. If millions of people chose to use public transport, insulate their homes and reduce waste, the effect would be substantial. Individual action also sets social examples and creates consumer demand for greener products, which encourages businesses to change.",
"However, individuals face limits that only governments can remove. A commuter cannot choose an electric train if no line exists, and a householder cannot use renewable electricity if the national grid depends on coal. Governments can invest in clean energy and public transport, set standards for buildings and vehicles, and use taxes or emissions trading to make polluting activities more expensive. For example, several countries have banned coal power or provided subsidies for electric cars and home insulation, creating large reductions that individuals alone could not achieve. Regulations also ensure that everyone, including large companies, contributes, which is fairer than relying on voluntary action.",
"This does not mean that individuals have no role. Public support is essential for governments to introduce ambitious policies, and personal choices can show that change is acceptable. Nevertheless, in my view, lasting progress depends on laws and infrastructure that make sustainable choices the easiest ones.",
"In conclusion, individuals and governments must both contribute, but governments hold the greater power to reduce emissions on the scale that is required."],
pe:["Introduces the debate and states the opinion directly.","View 1 (individuals): habits, collective effect, consumer demand.","View 2 and opinion: structural limits, policy tools, example, fairness.","Clarifies the role of individuals to remain balanced.","Conclusion."],
v:["emissions trading :: system where polluters buy and sell permits","national grid :: network supplying electricity","insulate :: cover to reduce heat loss","subsidies :: money given by governments to support something","voluntary action :: action done by choice","sustainable choices :: decisions that protect resources for the future"],
sp:["Those who emphasise ... make a fair point.","However, individuals face limits that only governments can remove.","For example, several countries have ..., creating ... that individuals alone could not achieve.","... hold the greater power to ..."],
note:"This mixed question asks for both views, an opinion and examples. The essay provides all three and keeps the opinion visible. The examples are general and accurate (policies exist in several countries)."},

{id:"e38",t:"health",t2:"tech",ty:"J",d:3,
q:"Healthcare is increasingly dependent on technology such as online consultations and artificial intelligence. What are the advantages and disadvantages of this? Do you think human doctors will still be needed in the future?",
th:"Technology improves access and accuracy but cannot replace human care, so I believe doctors will remain essential, working alongside technology.",
p:[
"From video appointments to software that analyses scans, technology is changing how patients receive care. Technology improves access and accuracy but cannot replace human care, so I believe doctors will remain essential, working alongside technology.",
"The advantages are substantial. Online consultations save travel time and allow people in remote areas to consult specialists who are far away. Digital records make it easier for different clinics to share information, which reduces repeated tests and mistakes. Artificial intelligence can detect patterns in images or data that may be difficult for a human to notice, helping doctors to diagnose certain illnesses earlier. Wearable devices also allow patients and doctors to monitor conditions such as high blood pressure continuously.",
"There are also disadvantages. Patients who lack internet access or digital skills, often older or poorer people, may be left behind. Sensitive medical data stored online can be stolen or misused if security is weak. In addition, algorithms may make errors or reflect biases in the data on which they were trained, and over-reliance on technology could weaken the practical skills of professionals. Some patients also find remote consultations impersonal.",
"Despite these issues, human doctors will still be needed. Medicine involves not only technical analysis but also judgement, ethical decisions and communication. A patient receiving a serious diagnosis needs empathy and explanation that a machine cannot genuinely provide, and doctors are accountable for decisions in a way that software is not. In my view, the most likely future is one in which technology handles routine tasks and information, giving doctors more time to concentrate on complex cases and on the relationship with patients.",
"In conclusion, technology brings real benefits and some risks, but it will support rather than replace doctors."],
pe:["Introduces the topic and gives a clear answer to the opinion question in the thesis.","Advantages part of the question: access, records, early diagnosis, monitoring.","Disadvantages part: digital divide, privacy, errors, over-reliance, impersonal care.","Opinion question answered directly: why doctors remain necessary.","Conclusion that covers all parts."],
v:["online consultation :: medical appointment held by video or phone","digital records :: patient information stored electronically","diagnose :: identify an illness","wearable device :: electronic device worn on the body","accountable :: responsible for results","empathy :: understanding another person's feelings"],
sp:["... improves ... and ... but cannot replace ..., so I believe ... will remain ...","The advantages are substantial.","There are also disadvantages.","In my view, the most likely future is one in which ..."],
note:"The question has two instructions: advantages and disadvantages, and an opinion about the future. The essay allocates a paragraph to each instruction so that nothing is missed."},

{id:"e39",t:"ageing",t2:"govt",ty:"J",d:3,
q:"People are living longer than ever before. What problems will this cause for society? Who should be responsible for the care of older people: the government or their families?",
th:"Longer lives will increase pressure on pensions, healthcare and housing, and I believe responsibility for care should be shared, with the government providing the framework and families offering personal support.",
p:[
"Advances in medicine and living conditions mean that many people now live into their eighties or beyond. Longer lives will increase pressure on pensions, healthcare and housing, and I believe responsibility for care should be shared, with the government providing the framework and families offering personal support.",
"The first problem is financial. If life expectancy rises while the number of working-age people stays the same or falls, there are fewer taxpayers to support more pensioners, so governments may have to raise taxes, increase the retirement age or reduce benefits. Second, older people use health services more often, and conditions such as dementia require long-term care, which is expensive and requires trained staff. Third, there may be a shortage of suitable housing, since many older people need accessible homes close to services, and loneliness can become a social problem for those who live alone.",
"As for responsibility, I do not believe it can rest on one party alone. Families are often best placed to provide emotional support, company and everyday help, and many older people prefer to remain close to their relatives. However, expecting families to bear the full burden is unfair, particularly when both partners work or live far away, and the cost of professional care can be too high for most households. Governments should therefore guarantee a basic pension, fund healthcare and long-term care, and support carers with allowances and respite services. In practice, this means public systems provide security, while relatives provide affection and individual attention.",
"In conclusion, ageing populations will strain public finances and services, and the best response is a partnership between the state and families rather than reliance on either alone."],
pe:["Introduces the trend and answers both questions in outline.","Problems: financial pressure, healthcare, housing and loneliness.","Responsibility question: families and government roles explained and balanced.","Conclusion covering both parts."],
v:["life expectancy :: average length of life","retirement age :: age at which people stop working","long-term care :: continued help for people who cannot look after themselves","dementia :: illness that affects memory and thinking","respite services :: temporary care giving carers a break","public finances :: government income and spending"],
sp:["Longer lives will ..., and I believe responsibility ... should be shared, with ... providing ... and ... offering ...","The first problem is financial.","As for responsibility, I do not believe it can rest on one party alone.","In practice, this means ..., while ..."],
note:"The first question is answered with a list of developed problems; the second with a nuanced opinion. The two paragraphs map directly onto the two instructions."},

{id:"e40",t:"society",t2:"edu",ty:"J",d:2,
q:"Some people believe that all young people should do a period of community service, such as helping in hospitals or cleaning public spaces. Do you agree or disagree? What benefits or problems could it bring?",
th:"I largely agree that community service should be encouraged for young people, because it benefits both participants and communities, although it must be well organised and not too restrictive.",
p:[
"Community service for young people, such as helping older residents or cleaning parks, is sometimes proposed as a way to strengthen society. I largely agree that community service should be encouraged for young people, because it benefits both participants and communities, although it must be well organised and not too restrictive.",
"The benefits for young people are considerable. Working with others on practical tasks develops teamwork, responsibility and communication skills that are valuable in any career. Volunteers also gain new perspectives: a teenager who helps in a hospital may understand healthcare more deeply and may even discover a future profession. Mixing with people from different backgrounds can reduce prejudice and build empathy, while the satisfaction of contributing can improve confidence and well-being.",
"Communities gain as well. Tasks that might otherwise be neglected, such as supporting lonely older people, maintaining local facilities or helping at food banks, can be carried out with enthusiasm and energy. Moreover, when young people care for their neighbourhood, they are more likely to continue to take part in civic life as adults.",
"Nevertheless, there are possible problems. If service is compulsory, some young people may resent it, and unwilling participants might perform poorly or cause difficulties. Poorly organised schemes may waste time or replace paid employees, and students with heavy study loads or part-time jobs may find it difficult to attend. To avoid these problems, authorities should offer choices of activity, limit the time required, provide training and ensure that volunteers do not take paid jobs.",
"In conclusion, well-designed community service offers valuable experience and social benefits, and I believe it should be strongly encouraged, with sensible flexibility."],
pe:["Introduces the idea and gives an opinion that covers the first instruction.","Benefits for young people (second instruction, part 1).","Benefits for communities.","Problems (second instruction, part 2) with practical safeguards.","Conclusion that answers all parts."],
v:["community service :: unpaid work for the benefit of local people","civic life :: participation in public affairs","reduce prejudice :: lessen unfair negative opinions","food bank :: place giving free food to those in need","compulsory :: required by rule or law","resent :: feel angry about"],
sp:["I largely agree that ..., because ..., although it must be ...","The benefits for ... are considerable.","... gain as well.","To avoid these problems, authorities should ..."],
note:"The essay answers 'do you agree or disagree?' and 'what benefits or problems?' by giving each its own space and linking the solution to the problems."}
];

/* ---------- Spaced repetition (transparent Leitner-style boxes) ----------

  nextBox(box, g) {

    return Math.min(6, box + 2);

  vocabCounts() {

/* ---------- Writing helpers ---------- */
const STOP = new Set("the and that this with from have has had are was were for not but you your they them their there which would could should about into than then also been being more most such some any can will its our out who whom what when where while why how one two may might must very much many other these those only over under both each every just because through during before after between among against without within upon".split(" "));
const LINKERS = ["however","moreover","furthermore","in addition","nevertheless","therefore","consequently","as a result","for example","for instance","on the other hand","in contrast","while","although","whereas","firstly","secondly","finally","in conclusion","overall","admittedly","on balance","by contrast","similarly","thus","hence","despite","in particular"];
function diagnose(text) {
  const words = countWords(text);
  const sentences = String(text).split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => countWords(s) > 0);
  const lens = sentences.map(countWords);
  const freq = {};
  (String(text).toLowerCase().match(/[a-z']+/g) || []).forEach(w => { if (w.length >= 5 && !STOP.has(w)) freq[w] = (freq[w] || 0) + 1; });
  const repeated = Object.keys(freq).filter(w => freq[w] >= 4).sort((a, b) => freq[b] - freq[a]).slice(0, 6).map(w => [w, freq[w]]);
  const low = " " + String(text).toLowerCase().replace(/\s+/g, " ") + " ";
  const used = LINKERS.filter(l => new RegExp("[^a-z]" + l + "[^a-z]").test(low));
  const starts = {}; sentences.forEach(s => { const w = (s.match(/^[A-Za-z']+/) || [""])[0].toLowerCase(); if (w) starts[w] = (starts[w] || 0) + 1; });
  const sameStart = Object.keys(starts).filter(w => starts[w] >= 3).map(w => [w, starts[w]]);
  return {words, paragraphs: countParagraphs(text), sentences: sentences.length, avg: sentences.length ? Math.round(10 * words / sentences.length) / 10 : 0, longest: lens.length ? Math.max.apply(null, lens) : 0, repeated, linkers: used, sameStart};
}

  mount(root, pageHead("Settings & Backup"),
    h("div", {class: "stack"},
      h("div", {class: "note-box warn"}, h("strong", null, "Your data stays in this browser. "), "Progress, drafts and notes are saved with localStorage on this device only. Clearing browser data, using a private window or switching browsers will erase them, so export a backup regularly.", !Store.ok ? h("div", {style: {marginTop: "6px", fontWeight: 600}}, "Warning: storage is currently unavailable in this browser. Changes cannot be saved.") : null),
      h("div", {class: "card"}, h("h3", null, "Appearance and goals"),
        h("div", {class: "grid g3"},
          field("Theme", selectEl([["auto", "Match my device"], ["light", "Light"], ["dark", "Dark"]], p.theme, v => { p.theme = v; Store.save(); App.applyTheme(); })),
          num("dailyGoal", 10, 5000, "Daily writing goal (words)"), num("sessionSize", 5, 100, "Default vocabulary session size"),
          num("timer2", 1, 180, "Task 2 timer (minutes)"), num("timer1", 1, 180, "Task 1 timer (minutes)"))),
      h("div", {class: "card"}, h("h3", null, "Backup and restore"), h("p", {class: "muted"}, "Last export: " + (S().lastExport ? fmtDateTime(S().lastExport) : "never")),
        h("div", {class: "row"}, h("button", {class: "btn primary", onclick: exportAll}, icon("download", 16), "Export all data (JSON)"), h("label", {class: "btn", for: "import-file", tabindex: 0, onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileIn.click(); } }}, icon("upload", 16), "Import backup"), fileIn),
        h("p", {class: "muted small", style: {marginTop: "10px"}}, "Single essays can be exported as .txt files from the Writing Studio history.")),
      h("div", {class: "card"}, h("h3", null, "Reset progress"), h("p", {class: "muted"}, "Deletes vocabulary progress, notes, custom words, essays, history and streaks from this browser. The built-in content is not affected."),
        h("button", {class: "btn danger", onclick: () => {
          const inp = h("input", {type: "text", placeholder: "Type RESET", "aria-label": "Type RESET to confirm", autocomplete: "off"});
          modal({title: "Reset all progress?", body: h("div", {class: "stack"}, h("p", null, "This cannot be undone. Export a backup first if you might want your data later."), inp), actions: [{label: "Cancel"}, {label: "Delete everything", kind: "danger", onClick: () => {
            if (inp.value.trim() !== "RESET") { toast("Type RESET exactly to confirm.", "warn"); return false; }
            const theme = S().prefs.theme; Store.state = defaultState(); Store.state.prefs.theme = theme; invalidateVocab(); Store.flush(); Studio.st = null; Studio.init(); App.applyTheme(); toast("Progress reset"); App.render();
          }}]});
        }}, icon("trash", 16), "Reset progress")),
      h("div", {class: "card"}, h("h3", null, "Keyboard shortcuts"), bullets(["Flashcards: Space shows the answer, 1–4 grades Again / Difficult / Good / Easy.", "Quizzes: Enter checks or moves on; 1–4 pick an option in the contextual quiz.", "Esc closes dialogs."])),
      h("div", {class: "card"}, h("h3", null, "About"), h("p", {class: "muted"}, "IELTS Writing Master is an independent self-study tool. It is not affiliated with IELTS, the British Council, IDP or Cambridge. Model essays and reports are original examples written for study, and indicative levels such as “Band 7–8 quality” describe the writing style only. The self-check tools never generate an official IELTS band score. Task 1 chart data are invented for practice.")))
  );
};

/* =====================================================================
   MAIN: router, navigation, theme, init
   ===================================================================== */
const NAV = [
  ["dashboard", "Dashboard", "home"], ["topics", "Topic Explorer", "compass"], ["questions", "Task 2 Question Bank", "help"],
  ["essays", "Model Essays", "book"], ["task1", "Academic Task 1", "image"], ["vocab", "Vocabulary Trainer", "layers"],
  ["notebook", "My Vocabulary Notebook", "bookmark"], ["studio", "Writing Studio", "edit"], ["progress", "Progress & Analytics", "activity"], ["settings", "Settings & Backup", "sliders"]
];
const App = {
  render() {
    const root = document.getElementById("main");
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
    let sec = parts[0] || "dashboard"; if (!Views[sec]) sec = "dashboard";
    const args = parts.slice(1);
    if (sec !== "vocab") leaveSession();
    if (sec !== "studio") document.body.classList.remove("focus-mode");
    document.body.classList.remove("nav-open");
    document.querySelectorAll(".nav a").forEach(a => { if (a.dataset.sec === sec) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    const nv = NAV.find(n => n[0] === sec); document.title = (nv ? nv[1] : "Dashboard") + " · IELTS Writing Master";
    const tb = document.getElementById("topbar-title"); if (tb) tb.textContent = nv ? nv[1] : "Dashboard";
    try { Views[sec](root, args); }
    catch (e) { console.error(e); mount(root, h("div", {class: "empty"}, h("strong", null, "Something went wrong showing this page"), String(e && e.message || e), h("div", {style: {marginTop: "10px"}}, h("a", {class: "btn", href: "#/dashboard"}, "Back to dashboard")))); }
    updateSideFoot();
    if (App.scroll !== false) window.scrollTo(0, 0);
  },
  applyTheme() {
    const t = S().prefs.theme, el = document.documentElement;
    if (t === "light" || t === "dark") el.setAttribute("data-theme", t); else el.removeAttribute("data-theme");
    const dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelectorAll(".theme-toggle").forEach(b => { mount(b, icon(dark ? "sun" : "moon", 18)); b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode"); b.title = b.getAttribute("aria-label"); });
  },
  toggleTheme() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    S().prefs.theme = dark ? "light" : "dark"; Store.save(); App.applyTheme();
  }
};
function updateSideFoot() {
  const el = document.getElementById("side-foot-info"); if (!el) return;
  const due = SRS.dueIds().length;
  mount(el, h("div", null, "🔥 Streak: ", h("b", null, Stats.streak() + " d")), h("div", null, "⏰ Due words: ", h("b", null, due)), !Store.ok ? h("div", {style: {color: "var(--danger)"}}, "Storage unavailable") : null);
}
function buildChrome() {
  const nav = document.getElementById("nav");
  NAV.forEach(n => nav.appendChild(h("li", null, h("a", {href: "#/" + n[0], "data-sec": n[0]}, icon(n[2], 19), n[1]))));
  document.getElementById("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
  document.querySelectorAll(".theme-toggle").forEach(b => b.addEventListener("click", App.toggleTheme));
  document.querySelectorAll(".menu-icon").forEach(m => m.appendChild(icon("menu", 22)));
}
function boot() {
  Store.load(); Studio.init(); buildChrome(); App.applyTheme();
  window.addEventListener("hashchange", App.render);
  if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", App.applyTheme); } catch (e) {} }
  App.render();
}
document.addEventListener("DOMContentLoaded", boot);

</script>
